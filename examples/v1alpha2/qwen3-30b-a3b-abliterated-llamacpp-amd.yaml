# Qwen3-30B-A3B Abliterated (MoE) via llama.cpp on AMD gfx1100
#
# Model: huihui-ai/Qwen3-30B-A3B-abliterated
# GGUF:  mradermacher/Qwen3-30B-A3B-abliterated-i1-GGUF (imatrix quant)
# Arch:  Mixture-of-Experts — 30.5B total params, 3.3B active per token
# VRAM:  ~18.7GB weights at Q4_K_M + KV cache (tight on 24GB, use q4_0 KV quant)
#
# On-demand model in 5930k-models group. Scaled to zero by default;
# activates via qwen3-30b / qwen3-moe alias when explicitly requested.
# Group leader is now qwen3-14b-claude-distill (priority 160).
apiVersion: ai.flexinfer/v1alpha2
kind: Model
metadata:
  name: qwen3-30b-a3b-abliterated
  namespace: flexinfer-system
spec:
  backend: llamacpp
  source: HF://mradermacher/Qwen3-30B-A3B-abliterated-i1-GGUF
  nodeSelector:
    flexinfer.ai/gpu.arch: gfx1100
    kubernetes.io/hostname: cblevins-5930k
  cache:
    strategy: SharedPVC
    storageClass: local-path
    size: 25Gi
  gpu:
    vendor: amd
    shared: 5930k-models
    priority: 110
    vramEstimateMB: 20000
  config:
    ggufFile: Qwen3-30B-A3B-abliterated.i1-Q4_K_M.gguf
    contextSize: 16384
    flashAttention: true
    parallel: 2
    batchSize: 2048
    cacheTypeK: q4_0
    cacheTypeV: q4_0
    jinja: true
  resources:
    requests:
      memory: 16Gi
    limits:
      memory: 32Gi
  serverless:
    enabled: true
    idleTimeout: 30m
    coldStartTimeout: 25m
    minReplicas: 0
  litellm:
    enabled: true
    servedModelName: qwen3-30b-abliterated
    aliases:
      - qwen3-30b
      - qwen3-moe
  serviceLabels:
    - qwen3-30b

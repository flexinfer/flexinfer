# llama.cpp inference on AMD Radeon VII (gfx906)
# Uses GGUF format with Q4_K_M quantization for 16GB VRAM
apiVersion: ai.flexinfer/v1alpha2
kind: Model
metadata:
  name: mistral-7b-llamacpp-gfx906
spec:
  backend: llamacpp
  source: "HF://TheBloke/Mistral-7B-Instruct-v0.2-GGUF"
  modelFileName: "mistral-7b-instruct-v0.2.Q4_K_M.gguf"
  nodeSelector:
    flexinfer.ai/gpu.arch: gfx906
  resources:
    limits:
      amd.com/gpu: 1
      memory: 20Gi
  config:
    contextSize: 8192
    nGPULayers: 999
    flashAttention: false  # Not supported on gfx906

# vLLM inference on AMD Radeon VII (gfx906)
# Uses AWQ quantization for efficient VRAM usage on 16GB HBM2
# Canary only: the default unified gfx906 runtime does not ship vLLM today.
# Promote a validated vLLM image digest before treating this as full support.
apiVersion: ai.flexinfer/v1alpha2
kind: Model
metadata:
  name: mistral-7b-vllm-gfx906
spec:
  backend: vllm
  source: "HF://TheBloke/Mistral-7B-Instruct-v0.2-AWQ"
  nodeSelector:
    flexinfer.ai/gpu.arch: gfx906
  gpu:
    vendor: amd
    count: 1
  config:
    maxModelLen: 8192
    dtype: auto
    gpuMemoryUtilization: "0.90"

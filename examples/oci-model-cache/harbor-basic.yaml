# OCI ModelCache Example - Basic Harbor Setup
#
# This example shows how to use a Harbor registry as a model source.
# Models are stored as OCI artifacts and pulled using ORAS.
#
# Prerequisites:
# 1. Push model to Harbor:
#    oras login harbor.example.com -u <username>
#    oras push harbor.example.com/library/qwen3-8b-mlc:q4f16_1 ./qwen3-8b-mlc/
#
# 2. Create registry credentials secret using kubectl:
#    kubectl create secret docker-registry harbor-credentials \
#      --docker-server=harbor.example.com \
#      --docker-username=<your-username> \
#      --docker-password=<your-password> \
#      -n flexinfer-system
#
# NOTE: The Secret manifest below is for reference only.
#       Use 'kubectl create secret' command above for production.

---
# Registry credentials for Harbor (EXAMPLE - replace with your values)
# Preferred method: use 'kubectl create secret docker-registry' command above
apiVersion: v1
kind: Secret
metadata:
  name: harbor-credentials
  namespace: flexinfer-system
type: kubernetes.io/dockerconfigjson
stringData:
  # Use stringData for readability; Kubernetes will base64 encode automatically
  .dockerconfigjson: |
    {
      "auths": {
        "harbor.example.com": {
          "username": "<your-username>",
          "password": "<your-password>",
          "auth": "<base64-of-username:password>"
        }
      }
    }
---
# ModelCache pulling from Harbor
apiVersion: ai.flexinfer/v1alpha1
kind: ModelCache
metadata:
  name: qwen3-8b-harbor
  namespace: flexinfer-system
spec:
  # OCI source format: oci://<registry>/<repository>:<tag>
  source: oci://harbor.example.com/library/qwen3-8b-mlc:q4f16_1

  # Reference to the docker config secret for authentication
  ociRegistrySecretRef: harbor-credentials

  # Storage configuration
  storageStrategy: SharedPVC
  storageClassName: longhorn
  storageSize: 10Gi

  # Eviction settings (optional)
  evictionPolicy: LRU
  retentionPriority: 70
---
# ModelDeployment using the cached model
apiVersion: ai.flexinfer/v1alpha1
kind: ModelDeployment
metadata:
  name: qwen3-8b-harbor
  namespace: flexinfer-system
spec:
  backend: mlc-llm
  model: Qwen3-8B-q4f16_1-MLC
  modelCacheRef: qwen3-8b-harbor

  mlcllm:
    mode: local
    overrides:
      maxTotalSeqLength: 8192
      prefillChunkSize: 512

  resources:
    limits:
      nvidia.com/gpu: 1
      memory: 16Gi
    requests:
      memory: 12Gi

  minReplicas: 0
  replicas: 1
  idleTimeoutSeconds: 600

apiVersion: ai.flexinfer/v1alpha2
kind: Model
metadata:
  name: bge-large-radeonvii
  namespace: flexinfer-system
  annotations:
    flexinfer.ai/serving-priority-class: flexinfer-serving-critical
spec:
  backend: llamacpp
  source: HF://CompendiumLabs/bge-large-en-v1.5-gguf
  cache:
    size: 2Gi
    storageClass: nvme-1r
    strategy: Local
  gpu:
    vendor: amd
    shared: radeonvii-models
    priority: 120
    count: 1
    vramEstimateMB: 1500
  serverless:
    enabled: true
    minReplicas: 1
    idleTimeout: 30m
    coldStartTimeout: 5m
  config:
    ggufFile: bge-large-en-v1.5-q8_0.gguf
    contextSize: 512
    nGPULayers: 999
    batchSize: 2048
    ubatchSize: 512
    embedding: true
    fitOff: true
    metrics: true
    rocrVisibleDevices: "0"
  nodeSelector:
    kubernetes.io/hostname: cblevins-radeonvii
  resources:
    requests:
      cpu: "2"
      memory: 2Gi
    limits:
      cpu: "4"
      memory: 4Gi
  serviceLabels:
    - embeddings
    - semantic-search
    - rag
    - embeddings-hbm2
  litellm:
    enabled: true
    servedModelName: bge-large-radeonvii
    aliases:
      - embeddings
      - text-embedding-3-small
      - bge-large
      - embeddings-radeonvii

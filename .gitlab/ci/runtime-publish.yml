# Runtime image publish jobs live here so ordinary root CI edits do not
# accidentally trigger multi-hour GPU runtime builds.

# gfx1100 runtime personas live here so serving-only changes do not drag
# quantizer, Steam, llama.cpp, and Ollama through the same image path.
runtime_patch_contracts:
  stage: lint
  image: python:3.12-alpine
  needs: []
  script:
    - python3 scripts/check-runtime-patch-contracts.py
    - python3 build/scripts/test_modules_in_block_to_quantize.py
    - python3 build/scripts/test_validate_quantized_artifact.py
    - python3 build/scripts/test_abliterate_safety.py

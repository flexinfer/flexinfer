        - build/scripts/patch_vllm_env_override_torch29.py
        - build/scripts/vllm_gemma4_moe_gptq_patch.py
        - build/scripts/vllm_qwen35_patches_nodiag.py
        - build/scripts/qwen35_wrap_to_vl_layout.py
        - build/scripts/qwen35_unwrap_from_vl_layout.py
        - scripts/check-runtime-patch-contracts.py
        - build/scripts/abliterate.py
        - build/scripts/abliterate_safety.py
        - build/scripts/test_abliterate_safety.py

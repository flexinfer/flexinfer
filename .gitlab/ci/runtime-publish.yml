# Multi-arch torch rebuild — PROVEN. Rebuilds torch from source for BOTH gfx906
# and gfx1100 in one wheel (the stock rocm/pytorch 6.3.4 base ships torch for
# gfx1100 only; its SYSTEM rocBLAS Tensile + librccl already cover both arches,
# so only torch's own kernels need rebuilding). Verified 2026-06-08: the built
# libtorch_hip.so embeds both gfx906 AND gfx1100 code objects; image published
# to ${REGISTRY}/torch:rocm6.3.4-multiarch.
#
# CANONICAL BUILD PATH IS OFF-CI: build/build-torch-multiarch.sh on a beefy host
# (e.g. the 7900xtx Docker builder: 24c/62G/~496G free). This from-source 2-arch
# torch + aotriton build's peak working set (>130GB) EXCEEDS the in-cluster
# buildkitd-central VMs (~134GB free, 14G RAM), which get evicted mid-build —
# wiping the emptyDir cache and canceling the build (observed 3x: snapshot
# "no such file" + "context canceled"). Do NOT rely on this CI job for the
# real build; it is kept MANUAL-ONLY below as documentation / break-glass and
# will fail on buildkit. Downstream runtime images COPY --from=<image> /wheels/.
publish_torch_multiarch:
  stage: publish
  image: registry.harbor.lan/library/buildkit:v0.12.5
  timeout: 4h
  needs: []
  resource_group: buildkit-rocm-images
  retry:
    max: 1
    when: [runner_system_failure, stuck_or_timeout_failure]
  script:
    - |
      echo "Waiting for BuildKit..."
      for i in $(seq 1 30); do
        if buildctl --addr "${BUILDKIT_HOST}" debug info >/dev/null 2>&1; then
          echo "BuildKit is ready"; break
        fi
        echo "[$i/30] not ready yet"; sleep 2
      done
    - |
      echo "Building multi-arch torch (gfx906;gfx1100) for ROCm 6.3.4..."
      attempts=3
      delay=5
      for i in $(seq 1 "${attempts}"); do
        if buildctl --addr "${BUILDKIT_HOST}" build \
          --frontend dockerfile.v0 \
          --local context=. \
          --local dockerfile=build \
          --opt filename="Dockerfile.runtime-torch-multiarch" \
          --opt platform=linux/amd64 \
          --opt build-arg:BASE_IMAGE="rocm/pytorch:rocm6.3.4_ubuntu22.04_py3.10_pytorch_release_2.4.0" \
          --opt build-arg:PYTORCH_ROCM_ARCH="gfx906;gfx1100" \
          --opt build-arg:PYTORCH_REF="v2.4.0" \
          --import-cache "type=registry,ref=${REGISTRY}/torch:rocm6.3.4-multiarch-buildcache" \
          --import-cache "type=registry,ref=${REGISTRY}/torch:rocm6.3.4-multiarch" \
          --export-cache "type=registry,ref=${REGISTRY}/torch:rocm6.3.4-multiarch-buildcache,mode=max,image-manifest=true,ignore-error=true" \
          --export-cache "type=inline" \
          --output "type=image,\"name=${REGISTRY}/torch:rocm6.3.4-multiarch,${REGISTRY}/torch:rocm6.3.4-multiarch-${CI_COMMIT_SHORT_SHA}\",push=true"; then
          break
        fi
        if [ "${i}" -eq "${attempts}" ]; then
          echo "ERROR: build failed after ${attempts} attempts"
          exit 1
        fi
        echo "WARN: build failed (${i}/${attempts}); retrying..."
        sleep "${delay}"
        delay=$((delay * 2))
      done
  rules:
    # MANUAL-ONLY (break-glass). NO master auto-trigger on Dockerfile changes:
    # buildkitd-central cannot hold this build's >130GB working set and evicts
    # mid-build (see job header). The canonical, working build path is off-CI:
    # build/build-torch-multiarch.sh.
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"
      when: manual
    - when: never


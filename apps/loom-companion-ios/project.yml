name: LoomCompanion
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
targets:
  LoomCompanionKit:
    type: framework
    platform: iOS
    sources:
      - Sources/LoomCompanionKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.flexinfer.loom.companion.kit
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
  LoomCompanion:
    type: application
    platform: iOS
    sources:
      - Sources/LoomCompanion
    dependencies:
      - target: LoomCompanionKit
      - target: LoomCompanionWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.flexinfer.loom.companion
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: Loom Companion
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Loom Companion needs local network access to connect to your local Loom HUD server.
        INFOPLIST_KEY_NSBonjourServices:
          - _http._tcp
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_UIBackgroundModes: remote-notification
    entitlements:
      path: Sources/LoomCompanion/LoomCompanion.entitlements
      properties:
        com.apple.security.application-groups:
          - group.ai.flexinfer.loom.companion
        aps-environment: development
  LoomCompanionWidget:
    type: app-extension
    platform: iOS
    sources:
      - Sources/LoomCompanionWidget
    dependencies:
      - target: LoomCompanionKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.flexinfer.loom.companion.widget
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        INFOPLIST_KEY_NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Sources/LoomCompanionWidget/LoomCompanionWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.ai.flexinfer.loom.companion

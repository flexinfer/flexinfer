# --- vLLM Backend Images ---
# vLLM OpenAI-compatible API server for AMD GPUs
publish_vllm_rocm:
  stage: publish
  image: registry.harbor.lan/library/buildkit:v0.12.5
  timeout: 1h
  needs: []
  script:
    - |
      echo "Waiting for BuildKit..."
      for i in $(seq 1 30); do
        if buildctl --addr "${BUILDKIT_HOST}" debug info >/dev/null 2>&1; then
          echo "BuildKit is ready"; break
        fi
        echo "[$i/30] not ready yet"; sleep 2
      done
    - |
      echo "Building vLLM ROCm image (gfx1100/RDNA3 optimized)..."
      buildctl --addr "${BUILDKIT_HOST}" build \
        --frontend dockerfile.v0 \
        --local context=. \
        --local dockerfile=build \
        --opt filename="Dockerfile.vllm-rocm" \
        --opt platform=linux/amd64 \
        --output "type=image,name=registry.harbor.lan/library/vllm-api:rocm-navi,push=true"
  rules:
    - when: manual
      allow_failure: true


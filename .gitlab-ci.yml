include:
  - project: platform/gitops
    ref: main
    file:
      - /k3s/ci/caches/gitlab-ci-cache.yml

stages:
  - lint
  - test
  - build
  - publish

variables:
  GO_VERSION: "1.25.5"
  # Disable CGO for static binaries where possible
  CGO_ENABLED: "0"
  REGISTRY: "registry.harbor.lan/flexinfer"
  GOPROXY: "http://athens.ci.svc.cluster.local:3000,direct"
  BUILDKIT_HOST: "tcp://buildkitd-central.ci-build.svc.cluster.local:1234"

.go-cache: &go-cache
  image: golang:${GO_VERSION}
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .go/pkg/mod/
  before_script:
    - mkdir -p .go
    - export GOPATH=${CI_PROJECT_DIR}/.go
    - export PATH=$PATH:$GOPATH/bin

# --- Lint Stage ---
lint:
  stage: lint
  image: golangci/golangci-lint:v1.64.8
  script:
    - golangci-lint run -v --timeout=5m ./...

fmt:
  stage: lint
  <<: *go-cache
  script:
    - |
      dirs="$(go list -f '{{.Dir}}' ./... | tr '\n' ' ')"
      unformatted="$(gofmt -l $dirs)"
      if [ -n "$unformatted" ]; then
        echo "Go code is not formatted:"
        echo "$unformatted"
        exit 1
      fi

helm:
  stage: lint
  image: alpine/helm:3.15.4
  script:
    - helm lint charts/flexinfer
    - helm template flexinfer charts/flexinfer --namespace flexinfer-system >/dev/null

vet:
  stage: lint
  <<: *go-cache
  script:
    - go vet ./...

# --- Test Stage ---
unit_test:
  stage: test
  <<: *go-cache
  script:
    - go list ./... | grep -v /controllers | xargs go test -v -short

integration_test:
  stage: test
  <<: *go-cache
  script:
    - go install sigs.k8s.io/controller-runtime/tools/setup-envtest@latest
    - export KUBEBUILDER_ASSETS=$(setup-envtest use 1.28.x -p path)
    - go test -v ./controllers/...

# --- Build Stage ---
build_manager:
  stage: build
  <<: *go-cache
  script:
    - go build -o bin/manager cmd/flexinfer-manager/main.go
  artifacts:
    paths:
      - bin/manager
    expire_in: 1 day

build_agent:
  stage: build
  <<: *go-cache
  script:
    - go build -o bin/agent ./agents/agent
  artifacts:
    paths:
      - bin/agent
    expire_in: 1 day

build_proxy:
  stage: build
  <<: *go-cache
  script:
    - go build -o bin/proxy cmd/flexinfer-proxy/main.go
  artifacts:
    paths:
      - bin/proxy
    expire_in: 1 day
    
build_scheduler:
  stage: build
  <<: *go-cache
  script:
    - go build -o bin/scheduler cmd/flexinfer-sched/main.go
  artifacts:
    paths:
      - bin/scheduler
    expire_in: 1 day

build_benchmarker:
  stage: build
  <<: *go-cache
  script:
    - go build -o bin/benchmarker cmd/flexinfer-bench/main.go
  artifacts:
    paths:
      - bin/benchmarker
    expire_in: 1 day

# --- Publish Stage ---
# Build via BuildKit (no Docker-in-Docker)
publish:
  stage: publish
  image: moby/buildkit:v0.12.5
  before_script:
    - echo "Assuming CI runner has auth for ${REGISTRY} or it is open."
  script:
    - |
      echo "Waiting for BuildKit..."
      for i in $(seq 1 30); do
        if buildctl --addr "${BUILDKIT_HOST}" debug info >/dev/null 2>&1; then
          echo "BuildKit is ready"; break
        fi
        echo "[$i/30] not ready yet"; sleep 2
      done
      buildctl --addr "${BUILDKIT_HOST}" debug info
    - |
      build_image() {
        local name="$1" dockerfile="$2" tags="$3"
        buildctl --addr "${BUILDKIT_HOST}" build \
          --frontend dockerfile.v0 \
          --local context=. \
          --local dockerfile=build \
          --opt filename="${dockerfile}" \
          --opt platform=linux/amd64 \
          --output "type=image,name=${tags},push=true"
      }

      build_image "flexinfer-controller" "Dockerfile.manager" "${REGISTRY}/flexinfer-controller:${CI_COMMIT_SHORT_SHA},${REGISTRY}/flexinfer-controller:latest"
      build_image "flexinfer-agent" "Dockerfile.agent" "${REGISTRY}/flexinfer-agent:${CI_COMMIT_SHORT_SHA}"
      build_image "flexinfer-scheduler" "Dockerfile.sched" "${REGISTRY}/flexinfer-scheduler:${CI_COMMIT_SHORT_SHA}"
      build_image "flexinfer-bench" "Dockerfile.bench" "${REGISTRY}/flexinfer-bench:${CI_COMMIT_SHORT_SHA}"
      build_image "flexinfer-proxy" "Dockerfile.proxy" "${REGISTRY}/flexinfer-proxy:${CI_COMMIT_SHORT_SHA}"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

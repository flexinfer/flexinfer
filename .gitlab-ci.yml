# Live gfx906 runtime (flexinfer-runtime + llama.cpp + Ollama + diffusers).
# This is the image path used by the live gfx906 runtime DaemonSet.
publish_runtime_rocm_gfx906:
  stage: publish
  image: registry.harbor.lan/library/buildkit:v0.12.5
  timeout: 2h
  needs: []
  resource_group: buildkit-rocm-images
  retry:
    max: 1
    when: [runner_system_failure, stuck_or_timeout_failure]
  script:
    - |
      echo "Waiting for BuildKit..."
      for i in $(seq 1 30); do
        if buildctl --addr "${BUILDKIT_HOST}" debug info >/dev/null 2>&1; then
          echo "BuildKit is ready"; break
        fi
        echo "[$i/30] not ready yet"; sleep 2
      done
    - |
      cat > build/.runtime-env <<'EOF'
      # Generated by CI for profile: gfx906
      GPU_VENDOR=amd
      GPU_ARCH=gfx906
      FLEXINFER_TRANSFORMERS_PACKAGE=transformers>=5.0
      FLEXINFER_TRANSFORMERS_RUNTIME_INSTALL=fallback
      HSA_OVERRIDE_GFX_VERSION=9.0.6
      HSA_ENABLE_SDMA=0
      HSA_USE_SVM=0
      PYTORCH_ROCM_ARCH=gfx906
      TORCH_BLAS_PREFER_HIPBLASLT=0
      MIOPEN_FIND_MODE=2
      HF_HUB_DISABLE_XET=1
      EOF
    - |
      echo "Building live flexinfer-runtime image for gfx906..."
      attempts=3
      delay=5
      for i in $(seq 1 "${attempts}"); do
        if buildctl --addr "${BUILDKIT_HOST}" build \
          --frontend dockerfile.v0 \
          --local context=. \
          --local dockerfile=build \
          --opt filename="Dockerfile.runtime-gfx906" \
          --opt platform=linux/amd64 \
          --opt build-arg:BASE_IMAGE="docker.io/mixa3607/pytorch-gfx906:v2.9.0-rocm-6.3.3" \
          --opt build-arg:GO_VERSION="1.26.0" \
          --opt build-arg:LLAMACPP_VERSION="b8173" \
          --opt build-arg:OLLAMA_VERSION="v0.17.4" \
          --opt build-arg:OLLAMA_GO_VERSION="1.25.7" \
          --opt build-arg:AMDGPU_TARGETS="gfx906" \
          --opt build-arg:GPU_VENDOR="amd" \
          --opt build-arg:GPU_ARCH="gfx906" \
          --opt build-arg:INCLUDE_VLLM="false" \
          --opt build-arg:INCLUDE_LLAMACPP="true" \
          --opt build-arg:INCLUDE_OLLAMA="true" \
          --opt build-arg:INCLUDE_DIFFUSERS="true" \
          --opt build-arg:INCLUDE_BITSANDBYTES="true" \
          --opt build-arg:INCLUDE_STEAM="false" \
          --opt build-arg:INCLUDE_QUANTIZER="false" \
          --opt build-arg:TRANSFORMERS_CONSTRAINT=">=5.0" \
          --opt build-arg:TRANSFORMERS_INSTALL_MODE="constraint" \
          --opt build-arg:TRANSFORMERS_PACKAGE="transformers>=5.0" \
          --opt build-arg:TRANSFORMERS_RUNTIME_INSTALL="fallback" \
          --opt build-arg:VLLM_INSTALL_MODE="none" \
          --opt build-arg:INSTALL_QWEN35_FASTPATH="false" \
          --opt build-arg:INCLUDE_TURBOQUANT="false" \
          --opt build-arg:TURBOQUANT_INSTALL_MODE="none" \
          --opt build-arg:LLAMACPP_BUILD_IMAGE="rocm/dev-ubuntu-22.04:6.2" \
          --opt build-arg:CUDA_ARCHITECTURES="52" \
          --import-cache "type=registry,ref=${REGISTRY}/runtime:rocm-gfx906" \
          --export-cache "type=inline" \
          --output "type=image,\"name=${REGISTRY}/runtime:rocm-gfx906,${REGISTRY}/runtime:rocm-gfx906-${CI_COMMIT_SHORT_SHA}\",push=true"; then
          break
        fi
        if [ "${i}" -eq "${attempts}" ]; then
          echo "ERROR: build failed after ${attempts} attempts"
          exit 1
        fi
        echo "WARN: build failed (${i}/${attempts}); retrying..."
        sleep "${delay}"
        delay=$((delay * 2))
      done
  after_script:
    - rm -f build/.runtime-env
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
      changes:
        - .gitlab-ci.yml
        - go.mod
        - go.sum
        - cmd/flexinfer-runtime/**/*
        - internal/runtime/**/*
        - backend/**/*
        - build/Dockerfile.runtime-gfx906
        - build/hipmemgetinfo_shim.cpp
        - build/patch-hipmemgetinfo.sh
        - build/runtime.yaml
        - build/runtime-entrypoint.sh
        - build/server-diffusers.py
        - build/scripts/**/*
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"
      when: manual
    - when: never


include:
  - local: /.gitlab/ci/runtime-publish.yml

  - project: platform/gitops
    ref: main
    file:
      - /k3s/ci/caches/gitlab-ci-cache.yml

  - project: 'services/tech-radar'
    file: '/ci/radar.yml'

workflow:
  rules:
    # All feature branches are validated through MR pipelines (auto-ship
    # policy) and the source branch is deleted on merge. Push pipelines for
    # non-master branches are suppressed entirely: the previous
    # $CI_OPEN_MERGE_REQUESTS dedup rule only caught pushes made *after* the
    # MR existed, so the initial push pipeline raced fast auto-merges and its
    # queued jobs failed with "couldn't find remote ref" once the branch was
    # deleted. Every validation job that runs on branch pipelines also runs
    # on MR pipelines (rule-parity audit, DEBT-CI-01), so no coverage is lost.
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != "master"
      when: never
    - when: always

stages:
  - lint
  - test
  - build
  - promote
  - security
  - publish
  - benchmark
  - security-images

default:
  interruptible: true

.rules-go-validation: &rules-go-validation
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_MERGE_REQUEST_ID
      changes: &go-validation-changes
        - "**/*.go"
        - go.mod
        - go.sum
        - Makefile
        - .golangci.yml
        - .gitlab-ci.yml
        - config/**/*
    - if: $CI_COMMIT_BRANCH
      changes: *go-validation-changes

.rules-helm-validation: &rules-helm-validation
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_MERGE_REQUEST_ID
      changes: &helm-validation-changes
        - charts/**/*
        - config/crd/**/*
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH
      changes: *helm-validation-changes

.rules-dependency-validation: &rules-dependency-validation
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_MERGE_REQUEST_ID
      changes: &dependency-validation-changes
        - go.mod
        - go.sum
        - .gitlab-ci.yml

variables:
  # Prefer GO_IMAGE from the local Harbor mirror when the patched tag exists.
  # Temporarily use Docker Hub for 1.25.12 because the Harbor mirror lags behind
  # upstream patch releases and govulncheck flags vulnerable stdlib builds.
  # 1.25.12 additionally patches GO-2026-5856 (crypto/tls) and GO-2026-4970 (os).
  # Bump promptly on Go security releases; Trivy/govulncheck will flag vulnerable stdlib builds.
  GO_VERSION: "1.25.12"
  GO_IMAGE: "golang:${GO_VERSION}"
  ENVTEST_VERSION: "release-0.23"
  GOLANGCI_LINT_VERSION: "v2.10.1"
  GOVULNCHECK_VERSION: "latest"
  GO_LICENSES_VERSION: "v1.6.0"
  # Disable CGO for static binaries where possible
  CGO_ENABLED: "0"
  REGISTRY: "registry.harbor.lan/flexinfer"
  # Prefer the public proxy for reliability; keep Athens as a warm cache/fallback.
  # Use "|" so transient Athens 5xx errors do not block the pipeline.
  GOPROXY: "https://proxy.golang.org|http://athens.ci.svc.cluster.local:3000|direct"
  GOLANGCI_LINT_TIMEOUT: "20m"
  BUILDKIT_HOST: "tcp://buildkitd-central.ci-build.svc.cluster.local:1234"
  # The shared runner exports DOCKER_HOST=localhost for Docker-in-Docker jobs.
  # FlexInfer uses remote BuildKit instead; clearing this prevents non-Docker
  # Go lint/test jobs from blocking in the runner pre-build Docker wait hook.
  DOCKER_HOST: ""
  # Set to "1" to additionally push OCI images to the GitLab Container Registry.
  PUBLISH_GITLAB_IMAGES: "0"
  # Default: avoid building + pushing duplicate ":latest" tags during publish
  # (faster and keeps GitOps pinned to commit SHAs).
  PUBLISH_LATEST_TAGS: "0"
  # Optional: OCI repo for Helm chart publishing (example: oci://registry.harbor.lan/flexinfer-charts)
  HELM_OCI_REPO: ""

.go-cache: &go-cache
  image: ${GO_IMAGE}
  cache:
    - key:
        files:
          - go.sum
        prefix: gomod
      paths:
        - .go/pkg/mod/
      policy: pull-push
    - key: gobuild-${CI_COMMIT_REF_SLUG}
      paths:
        - .go/cache/
      policy: pull-push
    - key: gotools-${GO_VERSION}-${GOLANGCI_LINT_VERSION}-${ENVTEST_VERSION}-${GOVULNCHECK_VERSION}-${GO_LICENSES_VERSION}
      paths:
        - .go/bin/
        - .go/envtest/
      policy: pull-push
  before_script:
    - mkdir -p .go .go/cache .go/bin .go/envtest
    - export GOPATH=${CI_PROJECT_DIR}/.go
    - export GOCACHE=${CI_PROJECT_DIR}/.go/cache
    - export PATH=$PATH:$GOPATH/bin

# --- Lint Stage ---
lint:
  stage: lint
  <<: *go-cache
  <<: *rules-go-validation
  needs: []
  before_script:
    - mkdir -p .go .go/cache .go/bin
    - export GOPATH=${CI_PROJECT_DIR}/.go
    - export GOCACHE=${CI_PROJECT_DIR}/.go/cache
    - export PATH=$PATH:$GOPATH/bin
    - |
      set -e
      if ! command -v golangci-lint >/dev/null 2>&1; then
        echo "Installing golangci-lint ${GOLANGCI_LINT_VERSION}..."
        if ! curl --retry 5 --retry-delay 2 --retry-connrefused -sSfL \
          https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh \
          | sh -s -- -b "$GOPATH/bin" "${GOLANGCI_LINT_VERSION}"; then
          echo "WARN: installer script failed; falling back to go install via module proxies"
          GOPROXY="https://proxy.golang.org|http://athens.ci.svc.cluster.local:3000|direct" \
            go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@"${GOLANGCI_LINT_VERSION}"
        fi
      fi
  script:
    - golangci-lint run -v --timeout=${GOLANGCI_LINT_TIMEOUT} ./...

fmt:
  stage: lint
  <<: *go-cache
  <<: *rules-go-validation
  needs: []
  script:
    - |
      files="$(git ls-files '*.go')"
      unformatted="$(gofmt -l $files)"
      if [ -n "$unformatted" ]; then
        echo "Go code is not formatted:"
        echo "$unformatted"
        exit 1
      fi

helm:
  stage: lint
  image: alpine/helm:3.15.4
  <<: *rules-helm-validation
  needs: []
  script:
    - helm lint charts/flexinfer
    - |
      rendered="$(helm template flexinfer charts/flexinfer --namespace flexinfer-system)"
      if printf '%s\n' "$rendered" | grep -q 'flexinfer.ai/chart-version'; then
        echo "chart version must not be embedded in pod templates; it causes fleet-wide rollouts on metadata-only chart upgrades" >&2
        exit 1
      fi
    - >-
      helm template flexinfer charts/flexinfer --namespace flexinfer-system
      --set imagePrewarm.enabled=true
      --set-string 'imagePrewarm.profiles[0].name=release-gate-test'
      --set 'imagePrewarm.profiles[0].releaseGate=true'
      --set-string 'imagePrewarm.profiles[0].images[0]=registry.example/runtime@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
      >/dev/null
    - >-
      if helm template flexinfer charts/flexinfer --namespace flexinfer-system
      --set imagePrewarm.enabled=true
      --set-string 'imagePrewarm.profiles[0].name=release-gate-test'
      --set 'imagePrewarm.profiles[0].releaseGate=true'
      --set-string 'imagePrewarm.profiles[0].images[0]=registry.example/runtime:mutable'
      >/dev/null 2>&1; then
      echo 'release-gated mutable image unexpectedly rendered' >&2;
      exit 1;
      fi

renovate_config:
  stage: lint
  image:
    name: renovate/renovate:39.107.0
    entrypoint: [""]
  needs: []
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
      changes:
        - renovate.json
    - if: $CI_MERGE_REQUEST_ID
      changes:
        - renovate.json
    - if: $CI_COMMIT_BRANCH
      changes:
        - renovate.json
  script:
    - renovate-config-validator --strict

vet:
  stage: lint
  <<: *go-cache
  <<: *rules-go-validation
  needs: []
  script:
    - go vet ./...

# Pure-stdlib unit tests for the F3 read-path context-selection logic.
# Gates the diversify_selection helper shared (by inline mirror) between the
# kill-test harness and the codebase-answer service. No pip deps -> alpine.
readpath_test:
  stage: lint
  image: python:3.12-alpine
  needs: []
  script:
    - python3 eval/f3-retrieval/test_readpath.py
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
      changes:
        - eval/f3-retrieval/f3eval.py
        - eval/f3-retrieval/test_readpath.py
        - deploy/system/codebase-answer/configmap.yaml
    - if: $CI_MERGE_REQUEST_ID
      changes:
        - eval/f3-retrieval/f3eval.py
        - eval/f3-retrieval/test_readpath.py
        - deploy/system/codebase-answer/configmap.yaml
    - if: $CI_COMMIT_BRANCH
      changes:
        - eval/f3-retrieval/f3eval.py
        - eval/f3-retrieval/test_readpath.py
        - deploy/system/codebase-answer/configmap.yaml
    - when: never

# Pure-stdlib unit tests for the F3 retrieval-quality gate kernel (Slice 5).
# Gates rqgate (aggregate/gate/result_row) + the f3eval RQ_RESULT_JSON wiring it
# feeds. No pip deps -> alpine. Mirrors readpath_test.
rqgate_test:
  stage: lint
  image: python:3.12-alpine
  needs: []
  script:
    - python3 eval/f3-retrieval/rqgate.py --self-check
    - python3 eval/f3-retrieval/test_rqgate.py
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
      changes:
        - eval/f3-retrieval/rqgate.py
        - eval/f3-retrieval/test_rqgate.py
        - eval/f3-retrieval/f3eval.py
    - if: $CI_MERGE_REQUEST_ID
      changes:
        - eval/f3-retrieval/rqgate.py
        - eval/f3-retrieval/test_rqgate.py
        - eval/f3-retrieval/f3eval.py
    - if: $CI_COMMIT_BRANCH
      changes:
        - eval/f3-retrieval/rqgate.py
        - eval/f3-retrieval/test_rqgate.py
        - eval/f3-retrieval/f3eval.py
    - when: never

build_node_disk_check_test:
  stage: lint
  image: ${GO_IMAGE}
  needs: []
  script:
    - bash -n scripts/check-build-node-disk.sh scripts/test-check-build-node-disk.sh scripts/prune-build-node-disk.sh scripts/test-prune-build-node-disk.sh
    - scripts/test-check-build-node-disk.sh
    - scripts/test-prune-build-node-disk.sh
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
      changes:
        - scripts/check-build-node-disk.sh
        - scripts/test-check-build-node-disk.sh
        - scripts/prune-build-node-disk.sh
        - scripts/test-prune-build-node-disk.sh
        - docs/dev/build-node-disk-management.md
        - build/buildkitd-gc.toml
        - build/README.md
        - .gitlab-ci.yml
    - if: $CI_MERGE_REQUEST_ID
      changes:
        - scripts/check-build-node-disk.sh
        - scripts/test-check-build-node-disk.sh
        - scripts/prune-build-node-disk.sh
        - scripts/test-prune-build-node-disk.sh
        - docs/dev/build-node-disk-management.md
        - build/buildkitd-gc.toml
        - build/README.md
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH
      changes:
        - scripts/check-build-node-disk.sh
        - scripts/test-check-build-node-disk.sh
        - scripts/prune-build-node-disk.sh
        - scripts/test-prune-build-node-disk.sh
        - docs/dev/build-node-disk-management.md
        - build/buildkitd-gc.toml
        - build/README.md
        - .gitlab-ci.yml
    - when: never

buildkit_publish_observability_test:
  stage: lint
  image: registry.harbor.lan/library/buildkit:v0.12.5
  needs: []
  script:
    - sh -n scripts/buildkit-publish-image.sh scripts/test-buildkit-publish-image.sh
    - sh scripts/test-buildkit-publish-image.sh
    - |
      buildctl_help="$(buildctl build --help)"
      case "${buildctl_help}" in
        *--progress*) ;;
        *) echo "ERROR: pinned buildctl lacks --progress" >&2; exit 1 ;;
      esac
      case "${buildctl_help}" in
        *--metadata-file*) ;;
        *) echo "ERROR: pinned buildctl lacks --metadata-file" >&2; exit 1 ;;
      esac
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
      changes: &buildkit-observability-changes
        - scripts/buildkit-publish-image.sh
        - scripts/test-buildkit-publish-image.sh
        - docs/dev/build-node-disk-management.md
        - .gitlab-ci.yml
    - if: $CI_MERGE_REQUEST_ID
      changes: *buildkit-observability-changes
    - if: $CI_COMMIT_BRANCH
      changes: *buildkit-observability-changes
    - when: never

# Pure-stdlib unit tests for the nightly re-embed script's multi-repo logic
# (F3 Slice 4). Extracts the canonical script from the ConfigMap literal block
# and exercises parse_repos / point_id / chunk_file offline. No pip deps -> alpine.
reembed_test:
  stage: lint
  image: python:3.12-alpine
  needs: []
  script:
    - python3 deploy/tasks/codebase-reembed/test_reembed.py
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
      changes:
        - deploy/tasks/codebase-reembed/configmap.yaml
        - deploy/tasks/codebase-reembed/test_reembed.py
    - if: $CI_MERGE_REQUEST_ID
      changes:
        - deploy/tasks/codebase-reembed/configmap.yaml
        - deploy/tasks/codebase-reembed/test_reembed.py
    - if: $CI_COMMIT_BRANCH
      changes:
        - deploy/tasks/codebase-reembed/configmap.yaml
        - deploy/tasks/codebase-reembed/test_reembed.py
    - when: never

# Pure-stdlib regression tests for RAG readiness and declarative routing.
rag_answer_test:
  stage: lint
  image: python:3.12-alpine
  needs: []
  script:
    - python3 deploy/system/codebase-answer/test_rag_answer.py
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
      changes: &rag-answer-test-changes
        - deploy/system/codebase-answer/**/*
        - deploy/system/values-k3s.yaml
        - .gitlab-ci.yml
    - if: $CI_MERGE_REQUEST_ID
      changes: *rag-answer-test-changes
    - if: $CI_COMMIT_BRANCH
      changes: *rag-answer-test-changes
    - when: never

# --- Test Stage ---
unit_test:
  stage: test
  <<: *go-cache
  <<: *rules-go-validation
  needs: []
  variables:
    # Minimum code coverage percentage required to pass CI.
    # Raise this as coverage improves; lowering requires justification.
    MIN_COVERAGE: "40"
  script:
    - SKIP_ENVTEST=1 go test -v -coverprofile=coverage.out ./... -short
    - go tool cover -func=coverage.out | tee coverage.txt
    - |
      total=$(go tool cover -func=coverage.out | grep '^total:' | awk '{print $3}' | tr -d '%')
      echo "Total coverage: ${total}%"
      if [ "$(echo "${total} < ${MIN_COVERAGE}" | bc -l)" -eq 1 ]; then
        echo "FAIL: Coverage ${total}% is below minimum threshold ${MIN_COVERAGE}%"
        exit 1
      fi
      echo "PASS: Coverage ${total}% meets minimum threshold ${MIN_COVERAGE}%"
  artifacts:
    paths:
      - coverage.out
      - coverage.txt
    expire_in: 7 days
    when: always

gpugroup_test:
  stage: test
  <<: *go-cache
  <<: *rules-go-validation
  needs: []
  script:
    - SKIP_ENVTEST=1 go test -v ./controllers/... -run "GPUGroup" -timeout 5m

proxy_test:
  stage: test
  <<: *go-cache
  <<: *rules-go-validation
  needs: []
  script:
    - go test -v ./internal/proxy/... -timeout 2m

race_test:
  stage: test
  <<: *go-cache
  needs: []
  script:
    - echo "Running tests with race detector..."
    - CGO_ENABLED=1 go test -race ./... -short -timeout 10m
  allow_failure: false
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_MERGE_REQUEST_ID
      changes: *go-validation-changes
      when: manual
      allow_failure: true

integration_test:
  stage: test
  <<: *go-cache
  <<: *rules-go-validation
  needs: []
  script:
    - go install sigs.k8s.io/controller-runtime/tools/setup-envtest@${ENVTEST_VERSION}
    - export KUBEBUILDER_ASSETS=$(setup-envtest use 1.28.x --bin-dir "${CI_PROJECT_DIR}/.go/envtest" -p path)
    - go test -v ./controllers/...

vllm_qwen35_text_plugin_test:
  stage: test
  image: python:3.12-slim
  needs: []
  script:
    - python3 build/scripts/test_vllm_qwen35_text_plugin.py
    - python3 -m py_compile build/vllm-qwen35-text-plugin/src/flexinfer_vllm_qwen35_text/__init__.py
  rules:
    - if: $CI_MERGE_REQUEST_ID
      changes: &qwen35-text-plugin-changes
        - .gitlab-ci.yml
        - build/Dockerfile.vllm-rocm-v023-qwen35-text
        - build/Dockerfile.vllm-rocm-gfx906-qwen35-mtp
        - build/vllm-qwen35-text-plugin/**/*
        - build/scripts/install_vllm_gfx906_compat.py
        - build/scripts/test_vllm_qwen35_text_plugin.py
        - deploy/debug/qwen35-35b-clean-gptq-canary.yaml
    - if: $CI_COMMIT_BRANCH == "master"
      changes: *qwen35-text-plugin-changes

mtp_expert_quantizer_test:
  stage: test
  image: python:3.12-slim
  needs: []
  before_script:
    - python3 -m pip install --disable-pip-version-check --no-cache-dir numpy
  script:
    - python3 build/scripts/test_quantize_mtp_experts.py
    - python3 build/scripts/test_graft_qwen35_mtp.py
    - python3 -m py_compile build/scripts/quantize_mtp_experts.py
    - python3 -m py_compile build/scripts/graft_qwen35_mtp.py
  rules:
    - if: $CI_MERGE_REQUEST_ID
      changes: &mtp-expert-quantizer-changes
        - .gitlab-ci.yml
        - build/Dockerfile.quantizer-mtp-expert
        - build/Dockerfile.quantizer-gptq-rocm
        - build/scripts/quantize_mtp_experts.py
        - build/scripts/test_quantize_mtp_experts.py
        - build/scripts/graft_qwen35_mtp.py
        - build/scripts/test_graft_qwen35_mtp.py
        - deploy/debug/gfx1100-qwen35-mtp-expert-quantize.yaml
    - if: $CI_COMMIT_BRANCH == "master"
      changes: *mtp-expert-quantizer-changes

# Targeted promotion gate for master/merge pipelines.
# This validates the ModelCache readiness contract without requiring a live cluster.
promotion_gate_test:
  stage: promote
  <<: *go-cache
  needs:
    - job: unit_test
    - job: gpugroup_test
    - job: proxy_test
    - job: integration_test
  variables:
    FLEXINFER_E2E_PROMOTION_GATE: "1"
  script:
    - go test -v ./e2e -run '^TestModelCachePromotionGate$' -count=1 -timeout 5m -short
  <<: *rules-go-validation

# E2E tests against real cluster (nightly)
# Requires k3s kubeconfig to be available
e2e_test:
  stage: test
  <<: *go-cache
  variables:
    KUBECONFIG: /etc/kubeconfig/k3s.yaml
    E2E_TIMEOUT_MODEL_READY: "10m"
    E2E_TIMEOUT_COLD_START: "5m"
    E2E_TIMEOUT_INFERENCE: "3m"
    E2E_POLL_INTERVAL: "5s"
  script:
    - |
      echo "Running E2E tests against real cluster..."
      if [ ! -f "${KUBECONFIG}" ]; then
        echo "Kubeconfig not found at ${KUBECONFIG}, skipping E2E tests"
        exit 0
      fi
    - go test -v ./e2e/... -timeout 30m
  rules:
    # Run nightly via schedule
    - if: $CI_PIPELINE_SOURCE == "schedule"
    # Manual trigger for ad-hoc testing
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
  allow_failure: true
  artifacts:
    reports:
      junit: e2e-report.xml
    when: always

# --- Build Stage ---
build_binaries:
  stage: build
  <<: *go-cache
  <<: *rules-go-validation
  needs: []
  script:
    - mkdir -p bin
    - go build -o bin/manager cmd/flexinfer-manager/main.go
    - GOOS=linux GOARCH=amd64 go build -o bin/agent cmd/flexinfer-agent/main.go
    - go build -o bin/scheduler cmd/flexinfer-sched/main.go
    - go build -o bin/benchmarker cmd/flexinfer-bench/main.go
    - go build -o bin/proxy ./cmd/flexinfer-proxy/
    - go build -o bin/flash-loader ./cmd/flexinfer-flash-loader/
  artifacts:
    paths:
      - bin/manager
      - bin/agent
      - bin/scheduler
      - bin/benchmarker
      - bin/proxy
      - bin/flash-loader
    expire_in: 1 day

# --- Publish Stage ---
# Build via BuildKit (no Docker-in-Docker)
publish:
  stage: publish
  image: registry.harbor.lan/library/buildkit:v0.12.5
  timeout: 2h
  needs:
    - job: promotion_gate_test
      artifacts: false
    - job: build_binaries
      artifacts: true
  before_script:
    - echo "Assuming CI runner has auth for ${REGISTRY} or it is open."
  artifacts:
    when: always
    paths:
      - .buildkit-observability/
    expire_in: 7 days
  script:
    - |
      echo "Waiting for BuildKit..."
      for i in $(seq 1 30); do
        if buildctl --addr "${BUILDKIT_HOST}" debug info >/dev/null 2>&1; then
          echo "BuildKit is ready"; break
        fi
        echo "[$i/30] not ready yet"; sleep 2
      done
      buildctl --addr "${BUILDKIT_HOST}" debug info
    - |
      build_image() {
        # BuildKit v0.12.x only supports a single --output and treats commas
        # in --output as option delimiters. Push each tag with a separate
        # buildctl invocation; layers are cached so only the first build
        # compiles, subsequent calls just push the manifest.
        sh scripts/buildkit-publish-image.sh "$@"
      }

      controller_tags="${REGISTRY}/flexinfer-controller:${CI_COMMIT_SHORT_SHA}"
      agent_tags="${REGISTRY}/flexinfer-agent:${CI_COMMIT_SHORT_SHA}"
      scheduler_tags="${REGISTRY}/flexinfer-scheduler:${CI_COMMIT_SHORT_SHA}"
      bench_tags="${REGISTRY}/flexinfer-bench:${CI_COMMIT_SHORT_SHA}"
      proxy_tags="${REGISTRY}/flexinfer-proxy:${CI_COMMIT_SHORT_SHA}"
      flash_loader_tags="${REGISTRY}/flexinfer-flash-loader:${CI_COMMIT_SHORT_SHA}"
      # model-tools major candidates are promoted to GitOps values by tested
      # digest. Never rebuild a candidate under a mutable/timestamp stable tag.
      model_tools_tags="${REGISTRY}/model-tools:${CI_COMMIT_SHORT_SHA}"

      # Immutable, chronologically-sortable UTC timestamp tag (YYYYMMDD-HHMMSS).
      # This is what Flux image-automation selects (ImagePolicy filterTags
      # `^[0-9]{8}-[0-9]{6}$`, alphabetical asc) to pin deployments to the exact
      # image that finished publishing — eliminating the rollout/image race the
      # mutable ":master" tag has (the HelmRelease reconcileStrategy:Revision rolls
      # on git commit, which fires before this publish job pushes the new image).
      # See platform/gitops/k3s/flux/image-automation/flexinfer-*.
      BUILD_TS="$(date -u +%Y%m%d-%H%M%S)"

      # "master" tags are used for continuous deployment in homelab clusters.
      # imagePullPolicy=Always ensures the mutable tag is re-pulled; the timestamp
      # tag above is the one image-automation actually pins for deterministic rollouts.
      if [ "${CI_COMMIT_BRANCH:-}" = "master" ]; then
        controller_tags="${controller_tags} ${REGISTRY}/flexinfer-controller:master ${REGISTRY}/flexinfer-controller:${BUILD_TS}"
        agent_tags="${agent_tags} ${REGISTRY}/flexinfer-agent:master ${REGISTRY}/flexinfer-agent:${BUILD_TS}"
        scheduler_tags="${scheduler_tags} ${REGISTRY}/flexinfer-scheduler:master ${REGISTRY}/flexinfer-scheduler:${BUILD_TS}"
        bench_tags="${bench_tags} ${REGISTRY}/flexinfer-bench:master ${REGISTRY}/flexinfer-bench:${BUILD_TS}"
        proxy_tags="${proxy_tags} ${REGISTRY}/flexinfer-proxy:master ${REGISTRY}/flexinfer-proxy:${BUILD_TS}"
        flash_loader_tags="${flash_loader_tags} ${REGISTRY}/flexinfer-flash-loader:master ${REGISTRY}/flexinfer-flash-loader:${BUILD_TS}"
      fi

      if [ "${PUBLISH_LATEST_TAGS}" = "1" ] && [ "${CI_COMMIT_BRANCH:-}" = "master" ]; then
        controller_tags="${controller_tags} ${REGISTRY}/flexinfer-controller:latest"
        agent_tags="${agent_tags} ${REGISTRY}/flexinfer-agent:latest"
        scheduler_tags="${scheduler_tags} ${REGISTRY}/flexinfer-scheduler:latest"
        bench_tags="${bench_tags} ${REGISTRY}/flexinfer-bench:latest"
        proxy_tags="${proxy_tags} ${REGISTRY}/flexinfer-proxy:latest"
        flash_loader_tags="${flash_loader_tags} ${REGISTRY}/flexinfer-flash-loader:latest"
      fi

      if [ "${PUBLISH_GITLAB_IMAGES}" = "1" ] && [ -n "${CI_REGISTRY_IMAGE:-}" ]; then
        controller_tags="${controller_tags} ${CI_REGISTRY_IMAGE}/flexinfer-controller:${CI_COMMIT_SHORT_SHA}"
        agent_tags="${agent_tags} ${CI_REGISTRY_IMAGE}/flexinfer-agent:${CI_COMMIT_SHORT_SHA}"
        scheduler_tags="${scheduler_tags} ${CI_REGISTRY_IMAGE}/flexinfer-scheduler:${CI_COMMIT_SHORT_SHA}"
        bench_tags="${bench_tags} ${CI_REGISTRY_IMAGE}/flexinfer-bench:${CI_COMMIT_SHORT_SHA}"
        proxy_tags="${proxy_tags} ${CI_REGISTRY_IMAGE}/flexinfer-proxy:${CI_COMMIT_SHORT_SHA}"
        flash_loader_tags="${flash_loader_tags} ${CI_REGISTRY_IMAGE}/flexinfer-flash-loader:${CI_COMMIT_SHORT_SHA}"
        model_tools_tags="${model_tools_tags} ${CI_REGISTRY_IMAGE}/model-tools:${CI_COMMIT_SHORT_SHA}"
        if [ "${CI_COMMIT_BRANCH:-}" = "master" ]; then
          controller_tags="${controller_tags} ${CI_REGISTRY_IMAGE}/flexinfer-controller:latest"
        fi
      fi

      # Build from the build-stage artifacts (bin/*) to avoid recompiling Go
      # multiple times in the publish stage.
      # shellcheck disable=SC2086
      build_image "flexinfer-controller" "Dockerfile.manager.bin" ${controller_tags}
      # shellcheck disable=SC2086
      build_image "flexinfer-agent" "Dockerfile.agent.bin" ${agent_tags}
      # shellcheck disable=SC2086
      build_image "flexinfer-scheduler" "Dockerfile.sched.bin" ${scheduler_tags}
      # shellcheck disable=SC2086
      build_image "flexinfer-bench" "Dockerfile.bench.bin" ${bench_tags}
      # shellcheck disable=SC2086
      build_image "flexinfer-proxy" "Dockerfile.proxy.bin" ${proxy_tags}
      # shellcheck disable=SC2086
      build_image "flexinfer-flash-loader" "Dockerfile.flash-loader.bin" ${flash_loader_tags}
      # shellcheck disable=SC2086
      build_image "model-tools" "Dockerfile.model-tools" ${model_tools_tags}
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_TAG

model_eval_gauntlet_trigger:
  stage: benchmark
  image: alpine/k8s:1.31.13
  needs:
    - job: publish
      artifacts: false
  variables:
    KUBECONFIG: /etc/kubeconfig/k3s.yaml
    MODEL_EVAL_GAUNTLET_NAMESPACE: flexinfer-system
    MODEL_EVAL_GAUNTLET_TIMEOUT_SECONDS: "2700"
  script:
    - |
      set -eu

      ns="${MODEL_EVAL_GAUNTLET_NAMESPACE}"
      if [ ! -f "${KUBECONFIG}" ]; then
        echo "Kubeconfig not found at ${KUBECONFIG}; skipping model-eval gauntlet trigger"
        exit 0
      fi

      kubectl -n "${ns}" get cronjob/model-eval-gauntlet

      job="${MODEL_EVAL_GAUNTLET_JOB_NAME:-model-eval-gauntlet-ci-${CI_PIPELINE_ID}}"
      echo "Triggering ${ns}/${job} from cronjob/model-eval-gauntlet"
      kubectl -n "${ns}" delete job "${job}" --ignore-not-found
      kubectl -n "${ns}" create job "${job}" --from=cronjob/model-eval-gauntlet

      deadline=$(( $(date +%s) + ${MODEL_EVAL_GAUNTLET_TIMEOUT_SECONDS} ))
      while [ "$(date +%s)" -lt "${deadline}" ]; do
        succeeded="$(kubectl -n "${ns}" get job "${job}" -o jsonpath='{.status.succeeded}' 2>/dev/null || true)"
        failed="$(kubectl -n "${ns}" get job "${job}" -o jsonpath='{.status.failed}' 2>/dev/null || true)"
        if [ "${succeeded:-0}" = "1" ]; then
          kubectl -n "${ns}" logs "job/${job}" --all-containers=true --tail=-1 || true
          echo "model-eval gauntlet completed successfully"
          exit 0
        fi
        if [ -n "${failed}" ] && [ "${failed}" != "0" ]; then
          kubectl -n "${ns}" logs "job/${job}" --all-containers=true --tail=-1 || true
          kubectl -n "${ns}" describe "job/${job}" || true
          echo "model-eval gauntlet failed"
          exit 1
        fi
        sleep 15
      done

      kubectl -n "${ns}" logs "job/${job}" --all-containers=true --tail=-1 || true
      kubectl -n "${ns}" describe "job/${job}" || true
      echo "model-eval gauntlet timed out"
      exit 1
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"
      when: manual

publish_binaries:
  stage: publish
  image: alpine/helm:3.15.4
  needs:
    - job: promotion_gate_test
      artifacts: false
    - job: build_binaries
      artifacts: true
  script:
    - apk add --no-cache curl
    - mkdir -p dist
    - version="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    - |
      upload() {
        local src="$1" dst="$2"
        curl --fail-with-body \
          --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "${src}" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/flexinfer/${version}/${dst}"
      }

      upload "bin/manager" "manager_linux_amd64"
      upload "bin/agent" "agent_linux_amd64"
      upload "bin/scheduler" "scheduler_linux_amd64"
      upload "bin/benchmarker" "benchmarker_linux_amd64"
      upload "bin/proxy" "proxy_linux_amd64"
      upload "bin/flash-loader" "flash-loader_linux_amd64"
  rules:
    # Generic packages are release artifacts, not per-commit build outputs.
    # Publishing every master SHA retained hundreds of large binary bundles
    # and exhausted the GitLab data disk. Merge pipelines still validate the
    # binaries through build_binaries; only tags persist them in the registry.
    - if: $CI_COMMIT_TAG

publish_helm_chart:
  stage: publish
  image: alpine/helm:3.15.4
  needs:
    - job: promotion_gate_test
      artifacts: false
  script:
    - apk add --no-cache curl
    - mkdir -p dist
    - |
      chart_version=""
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        chart_version="${CI_COMMIT_TAG#v}"
      else
        chart_version="0.1.0-${CI_COMMIT_SHORT_SHA}"
      fi
      helm lint charts/flexinfer
      helm package charts/flexinfer --destination dist --version "${chart_version}"
      chart_tgz="$(ls dist/flexinfer-*.tgz | head -n 1)"
      version="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
      curl --fail-with-body \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file "${chart_tgz}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/flexinfer-helm/${version}/$(basename "${chart_tgz}")"

      if [ -n "${HELM_OCI_REPO}" ]; then
        helm push "${chart_tgz}" "${HELM_OCI_REPO}"
      else
        echo "HELM_OCI_REPO not set; skipping OCI push"
      fi
  rules:
    # The chart is deployed from this repository by Flux. Keep the generic
    # package registry for tagged releases only so commit builds do not grow
    # GitLab storage without bound.
    - if: $CI_COMMIT_TAG


          --opt filename="Dockerfile.llamacpp-cuda-maxwell" \
          --opt platform=linux/amd64 \
          --import-cache "type=registry,ref=${REGISTRY}/llamacpp:cuda-maxwell" \
          --export-cache "type=inline" \
          --output "type=image,\"name=${REGISTRY}/llamacpp:cuda-maxwell,${REGISTRY}/llamacpp:cuda-maxwell-${CI_COMMIT_SHORT_SHA}\",push=true"; then
          break
        fi
        if [ "${i}" -eq "${attempts}" ]; then
          echo "ERROR: llama.cpp cuda-maxwell build/push failed after ${attempts} attempts"
          exit 1
        fi
        echo "WARN: llama.cpp cuda-maxwell build/push failed (${i}/${attempts}); retrying in ${delay}s..."
        sleep "${delay}"
        delay=$((delay * 2))
      done
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
      changes: [build/Dockerfile.llamacpp-cuda-maxwell]
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"
      when: manual
    - when: never


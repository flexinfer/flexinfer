# Unified gfx1100 runtime (vLLM + diffusers + quantizer + abliteration)
# This is the image path used by the live gfx1100 runtime DaemonSets.
publish_unified_rocm_gfx1100:
  stage: publish
  image: registry.harbor.lan/library/buildkit:v0.12.5
  timeout: 1h
  needs: []
  resource_group: buildkit-rocm-images
  retry:
    max: 1
    when: [runner_system_failure, stuck_or_timeout_failure]
  script:
    - |
      echo "Waiting for BuildKit..."
      for i in $(seq 1 30); do
        if buildctl --addr "${BUILDKIT_HOST}" debug info >/dev/null 2>&1; then
          echo "BuildKit is ready"; break
        fi
        echo "[$i/30] not ready yet"; sleep 2
      done
    - |
      cat > build/.runtime-env <<'EOF'
      # Generated by GitLab CI for profile: gfx1100
      # Do not edit — regenerated during publish.
      GPU_VENDOR=amd
      GPU_ARCH=gfx1100
      ROCM_PATH=/opt/rocm
      HIP_PATH=/opt/rocm
      HSA_OVERRIDE_GFX_VERSION=11.0.0
      PYTORCH_ROCM_ARCH=gfx1100
      TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL=1
      HIP_FORCE_DEV_KERNARG=1
      TORCH_BLAS_PREFER_HIPBLASLT=1
      VLLM_USE_TRITON_FLASH_ATTN=0
      VLLM_ROCM_USE_AITER=0
      VLLM_TARGET_DEVICE=rocm
      MIOPEN_FIND_MODE=2
      PYTORCH_HIP_ALLOC_CONF=garbage_collection_threshold:0.9,max_split_size_mb:512
      EOF
      trap 'rm -f build/.runtime-env' EXIT
    - |
      echo "Building Unified Runtime image for gfx1100..."
      buildctl --addr "${BUILDKIT_HOST}" build \
        --frontend dockerfile.v0 \
        --local context=. \
        --local dockerfile=build \
        --opt filename="Dockerfile.runtime" \
        --opt platform=linux/amd64 \
        --opt build-arg:BASE_IMAGE="rocm/vllm-dev:rocm7.2_navi_ubuntu24.04_py3.12_pytorch_2.9_vllm_0.14.0rc0" \
        --opt build-arg:GO_VERSION="1.26.0" \
        --opt build-arg:LLAMACPP_VERSION="b8173" \
        --opt build-arg:OLLAMA_VERSION="v0.17.4" \
        --opt build-arg:OLLAMA_GO_VERSION="1.25.7" \
        --opt build-arg:AMDGPU_TARGETS="gfx1100" \
        --opt build-arg:GPU_VENDOR="amd" \
        --opt build-arg:GPU_ARCH="gfx1100" \
        --opt build-arg:INCLUDE_VLLM="true" \
        --opt build-arg:INCLUDE_LLAMACPP="true" \
        --opt build-arg:INCLUDE_OLLAMA="true" \
        --opt build-arg:INCLUDE_DIFFUSERS="true" \
        --opt build-arg:INCLUDE_BITSANDBYTES="true" \
        --opt build-arg:INCLUDE_STEAM="true" \
        --opt build-arg:INCLUDE_QUANTIZER="true" \
        --opt build-arg:TRANSFORMERS_CONSTRAINT=">=5.0" \
        --opt build-arg:LLAMACPP_BUILD_IMAGE="rocm/dev-ubuntu-24.04:6.4.4" \
        --opt build-arg:CUDA_ARCHITECTURES="52" \
        --import-cache "type=registry,ref=${REGISTRY}/runtime:rocm-gfx1100" \
        --export-cache "type=inline" \
        --output "type=image,\"name=${REGISTRY}/runtime:rocm-gfx1100,${REGISTRY}/runtime:rocm-gfx1100-${CI_COMMIT_SHORT_SHA}\",push=true"
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
      changes:
        - .gitlab-ci.yml
        - build/Dockerfile.runtime
        - build/runtime.yaml
        - build/runtime-entrypoint.sh
        - build/server-diffusers.py
        - build/scripts/abliterate.py
        - build/scripts/quantize_gptq.py
        - build/scripts/vllm_qwen35_patches_nodiag.py
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"
      when: manual
    - when: never


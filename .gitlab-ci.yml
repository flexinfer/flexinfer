# Loom CI/CD Pipeline
# Provides lint, test, build, and deploy stages with comprehensive testing
#
# iOS signing/distribution secret contract (mirrors streamslate pattern):
#   APPLE_CERTIFICATE            - Base64 .p12 or File variable path
#   APPLE_CERTIFICATE_PASSWORD   - .p12 password
#   APPLE_TEAM_ID                - Apple Developer Team ID
#   APPLE_PROVISIONING_PROFILE   - Base64 .mobileprovision or File variable path
#   APPLE_API_ISSUER             - App Store Connect issuer ID (upload lanes)
#   APPLE_API_KEY                - App Store Connect key ID (upload lanes)
#   APPLE_API_KEY_BASE64         - Base64 .p8 key contents (upload lanes)
#
# Helper scripts:
#   scripts/mobile/import-certificate.sh
#   scripts/mobile/cleanup-signing.sh

include:
  - project: platform/gitops
    ref: main
    file:
      - /k3s/ci/caches/gitlab-ci-cache.yml

# This GitLab instance intermittently creates detached MR pipelines with
# refs/merge-requests/*/head that fail immediately with no jobs. Run the
# branch/tag pipeline as the canonical CI signal for merge requests.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

stages:
  - lint
  - build
  - test
  - deploy

variables:
  AUTO_DEVOPS_ENABLED: "false"
  GO_VERSION: "1.25.5"
  BINARY_NAME: "loom"
  # Ensure private modules never go to public proxies/sumdb.
  GOPRIVATE: "gitlab.flexinfer.ai/*"
  # Athens is the preferred in-cluster proxy; fall back to public proxy then direct
  # to reduce transient infra outages breaking CI.
  GOPROXY: "http://athens.ci.svc.cluster.local:3000,https://proxy.golang.org,direct"
  # Work around occasional runner fetch failures for ephemeral pipeline refs by
  # disabling shallow clones (fetch full history).
  GIT_DEPTH: "0"
  # GitLab Runner intermittently attempts to fetch `refs/pipelines/<id>`, which
  # is not reliably available on this GitLab instance. Skip the built-in
  # checkout and fetch sources explicitly inside jobs instead.
  GIT_STRATEGY: "none"
  # Minimum test coverage threshold (percentage)
  # Lowered from 30% to accommodate SSH tunnel code which requires actual SSH server to test
  COVERAGE_THRESHOLD: "24"
  IMAGE_REGISTRY: registry.flexinfer.ai
  IMAGE_REGISTRIES: "registry.harbor.lan registry.flexinfer.ai"
  CUSTOM_SERVER_IMAGE_REPO: mcp/custom-server
  DOCKER_CONFIG: /kaniko/.docker
  # The CI runner injects a pre-build step that waits for a Docker daemon when DOCKER_HOST is tcp://localhost:2375.
  # This repo doesn't use DinD for its Go jobs; disable that wait globally to prevent jobs hanging.
  DOCKER_HOST: ""

# Cache Go modules and build cache
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .go/pkg/mod/
    - .go-build/
  # Pull cache everywhere, but only push from selected jobs to avoid repeatedly
  # archiving tens of thousands of small Go cache files on every job.
  policy: pull

# Base template for Go jobs
.go-template: &go-template
  image: golang:${GO_VERSION}
  before_script:
    - |
      # Ensure required OS tools exist (golang image may not include them).
      if ! command -v git >/dev/null 2>&1 || ! command -v curl >/dev/null 2>&1; then
        apt-get update -qq
        apt-get install -y --no-install-recommends git curl ca-certificates
        rm -rf /var/lib/apt/lists/*
      fi
    - |
      if [ ! -f go.mod ]; then
        echo "Fetching repository sources (archive)..."
        URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/repository/archive.tar.gz?sha=${CI_COMMIT_SHA}"
        # Some GitLab deployments return 404 for archive downloads when using
        # CI_JOB_TOKEN (JOB-TOKEN header). If the archive fetch fails for any reason,
        # fall back to a normal git fetch using CI_JOB_TOKEN in the remote URL.
        if curl -fsSL -H "JOB-TOKEN: ${CI_JOB_TOKEN}" "$URL" | tar -xz --strip-components=1; then
          :
        else
          echo "Archive fetch failed; falling back to git fetch..."
          if [ -z "${CI_JOB_TOKEN:-}" ]; then
            echo "ERROR: CI_JOB_TOKEN is not set; cannot fetch via git"
            exit 1
          fi

          # Avoid printing the token in logs.
          git init -q
          git remote add origin "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
          # Fetch the exact commit SHA (not just branch tip) so checkout always works,
          # even when the branch has advanced since the pipeline was created.
          git fetch -q origin "${CI_COMMIT_SHA}"
          git checkout -q -f "${CI_COMMIT_SHA}"
        fi
      fi
    - |
      # This repo uses local `replace` directives to `../../libs/*`.
      # In CI, ensure those sibling repos exist so `go mod download` and builds work.
      LIBS_DIR="$(realpath "${CI_PROJECT_DIR}/../../libs")"
      mkdir -p "${LIBS_DIR}"
      if [ ! -d "${LIBS_DIR}/mcp-go" ]; then
        git clone "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.flexinfer.ai/libs/mcp-go.git" "${LIBS_DIR}/mcp-go"
      fi
      if [ ! -d "${LIBS_DIR}/fi-mcp-kit" ]; then
        git clone "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.flexinfer.ai/libs/fi-mcp-kit.git" "${LIBS_DIR}/fi-mcp-kit"
      fi
      if [ ! -d "${LIBS_DIR}/fi-accel" ]; then
        git clone "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.flexinfer.ai/libs/fi-accel.git" "${LIBS_DIR}/fi-accel"
      fi
    - export GOPATH="$CI_PROJECT_DIR/.go"
    - export GOCACHE="$CI_PROJECT_DIR/.go-build"
    - mkdir -p "$GOPATH" "$GOCACHE"
    - |
      # Best-effort: wait briefly for in-cluster Athens during rollouts.
      ATHENS_READY_URL="http://athens.ci.svc.cluster.local:3000/readyz"
      for i in 1 2 3 4 5; do
        if curl -fsS "$ATHENS_READY_URL" >/dev/null 2>&1; then
          break
        fi
        echo "Waiting for Athens (${i}/5)..."
        sleep 2
      done
    - |
      # Go module downloads are occasionally flaky on the homelab runner; retry a few times.
      for i in 1 2 3; do
        if go mod download; then
          exit 0
        fi
        echo "go mod download failed (attempt ${i}/3); retrying..."
        sleep 3
      done
      exit 1

# =============================================================================
# LINT STAGE
# =============================================================================

lint:
  <<: *go-template
  stage: lint
  script:
    - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.8.0
    - $(go env GOPATH)/bin/golangci-lint run --timeout 5m ./...
  allow_failure: true

vet:
  <<: *go-template
  stage: lint
  script:
    - go vet ./...

fmt:
  <<: *go-template
  stage: lint
  script:
    - |
      UNFORMATTED=$(gofmt -l . 2>/dev/null | grep -v '^vendor/' | grep -v '^\.go/' | grep -v '\.pb\.go$' || true)
      if [ -n "$UNFORMATTED" ]; then
        echo "The following files need formatting:"
        echo "$UNFORMATTED"
        gofmt -d $(echo "$UNFORMATTED" | head -20)
        exit 1
      fi

guardrails:docs-cli:
  <<: *go-template
  stage: lint
  script:
    - |
      # The shared template may fetch sources via archive (no .git metadata).
      # Recreate a minimal git checkout so docs drift checks can diff against base.
      if ! git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
        git init -q
        git remote add origin "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
        git fetch -q origin "${CI_COMMIT_SHA}"
        git checkout -q -f "${CI_COMMIT_SHA}"
      fi
      BASE_BRANCH="${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-$CI_DEFAULT_BRANCH}"
      git fetch -q origin "${BASE_BRANCH}:${BASE_BRANCH}" || true
      DOCS_CHECK_BASE_REF="${BASE_BRANCH}" bash scripts/ci/check_docs_guardrails.sh
      bash scripts/ci/check_flexinfer_site_integration.sh
    - go run ./cmd/loom --help >/dev/null
    - go run ./cmd/loom proxy --help >/dev/null

security:gosec:
  <<: *go-template
  stage: lint
  script:
    - go install github.com/securego/gosec/v2/cmd/gosec@latest
    - $(go env GOPATH)/bin/gosec -fmt json -out gosec-report.json ./...
  artifacts:
    when: always
    paths:
      - gosec-report.json
    expire_in: 1 week

security:govulncheck:
  <<: *go-template
  stage: lint
  script:
    - go install golang.org/x/vuln/cmd/govulncheck@latest
    - $(go env GOPATH)/bin/govulncheck ./... > govulncheck-report.txt
    - cat govulncheck-report.txt
  artifacts:
    when: always
    paths:
      - govulncheck-report.txt
    expire_in: 1 week

lint:mcp-godot:
  image: node:20
  stage: lint
  variables:
    # This job needs repository files under tools/mcp-godot.
    # Global GIT_STRATEGY is "none", so override to fetch sources here.
    GIT_STRATEGY: fetch
  rules:
    - changes:
        - tools/mcp-godot/**/*
    - if: '$RUN_MCP_GODOT_QUALITY == "true"'
    - when: never
  before_script: []
  script:
    - cd tools/mcp-godot
    - npm ci
    - npm run lint
    - npm run test

# =============================================================================
# BUILD STAGE
# Build binaries before tests to enable integration testing
# =============================================================================

build:binaries:
  <<: *go-template
  stage: build
  cache:
    # Keep Go module/build caches shared per-branch, but keep compiled binaries
    # scoped per-commit to avoid stale/incorrect reuse.
    - key: ${CI_COMMIT_REF_SLUG}
      paths:
        - .go/pkg/mod/
        - .go-build/
      policy: pull-push
    - key: ${CI_COMMIT_SHA}-bin
      paths:
        - bin/
      policy: push
  script:
    - |
      VERSION="${CI_COMMIT_TAG:-${CI_COMMIT_SHORT_SHA}}"
      LDFLAGS="-s -w -X main.version=${VERSION}"

      echo "Building all binaries..."
      mkdir -p bin

      # Build main binaries
      CGO_ENABLED=0 go build -ldflags="$LDFLAGS" -o bin/loom ./cmd/loom
      CGO_ENABLED=0 go build -ldflags="$LDFLAGS" -o bin/loomd ./cmd/loomd

      # Build MCP servers for integration tests
      failures=0
      for pkg in $(ls cmd/ | grep '^mcp-'); do
        echo "Building $pkg..."
        if ! CGO_ENABLED=0 go build -ldflags="$LDFLAGS" -o "bin/$pkg" "./cmd/$pkg"; then
          echo "ERROR: Failed to build $pkg"
          failures=$((failures + 1))
        fi
      done
      if [ "$failures" -ne 0 ]; then
        echo "ERROR: $failures MCP server(s) failed to build"
        exit 1
      fi

      echo "Built binaries:"
      ls -la bin/
  # NOTE: GitLab instance currently rejects large artifact uploads (HTTP 413).
  # Use the runner cache (MinIO) for passing binaries to downstream jobs instead.

# =============================================================================
# TEST STAGE
# =============================================================================

test:unit:
  <<: *go-template
  stage: test
  script:
    - |
      echo "Selecting packages with tests..."
      mapfile -t PKGS < <(go list -f '{{if or (gt (len .TestGoFiles) 0) (gt (len .XTestGoFiles) 0)}}{{.ImportPath}}{{end}}' ./... | sed '/^$/d')
      echo "Packages with tests: ${#PKGS[@]}"

      echo "Running unit tests with race detector..."
      go test -race -coverprofile=coverage.out -covermode=atomic "${PKGS[@]}"

      # Convert Go coverprofile to Cobertura XML for GitLab coverage reports
      go install github.com/boumenot/gocover-cobertura@v1.4.0
      $(go env GOPATH)/bin/gocover-cobertura < coverage.out > coverage.xml

      echo ""
      echo "Coverage Summary:"
      go tool cover -func=coverage.out | tail -20

      # Extract total coverage
      TOTAL=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
      echo ""
      echo "Total Coverage: ${TOTAL}%"

      # Check coverage threshold
      if [ -n "$COVERAGE_THRESHOLD" ]; then
        THRESHOLD_INT=$(echo "$COVERAGE_THRESHOLD" | cut -d. -f1)
        TOTAL_INT=$(echo "$TOTAL" | cut -d. -f1)
        if [ "$TOTAL_INT" -lt "$THRESHOLD_INT" ]; then
          echo "ERROR: Coverage ${TOTAL}% is below threshold ${COVERAGE_THRESHOLD}%"
          exit 1
        fi
      fi
  coverage: '/total:\s+\(statements\)\s+(\d+.\d+)%/'
  artifacts:
    paths:
      - coverage.out
      - coverage.xml
    expire_in: 1 week
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

test:integration:
  <<: *go-template
  stage: test
  needs:
    - build:binaries
  cache:
    - key: ${CI_COMMIT_SHA}-bin
      paths:
        - bin/
      policy: pull
  script:
    - |
      echo "Setting up integration test environment..."
      export LOOM_REPO_ROOT="$CI_PROJECT_DIR"
      export LOOM_RUN_MCP_SMOKE="1"
      export PATH="$CI_PROJECT_DIR/bin:$PATH"

      echo "Using pre-built MCP server binaries from build:binaries job..."
      echo "Available MCP servers:"
      ls -la bin/mcp-* 2>/dev/null || echo "No MCP servers found"

      echo ""
      echo "Running integration tests..."
      go test -v -race ./internal/integration/...

test:race:
  <<: *go-template
  stage: test
  script:
    - go test -race -short ./...
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Benchmark tests - run on demand
test:benchmark:
  <<: *go-template
  stage: test
  needs:
    - build:binaries
  allow_failure: true
  script:
    - |
      export LOOM_REPO_ROOT="$CI_PROJECT_DIR"
      export PATH="$CI_PROJECT_DIR/bin:$PATH"

      echo "Running benchmarks..."
      go test -bench=. -benchmem -run=^$ ./internal/... ./pkg/... 2>&1 | tee benchmark.txt
  artifacts:
    paths:
      - benchmark.txt
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: manual

# =============================================================================
# RELEASE BUILDS
# Cross-compile for all target platforms
# =============================================================================

build:linux-amd64:
  <<: *go-template
  stage: test
  needs:
    - test:unit
  script:
    - GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w -X main.version=${CI_COMMIT_TAG:-${CI_COMMIT_SHORT_SHA}}" -o ${BINARY_NAME}-linux-amd64 ./cmd/loom
  artifacts:
    paths:
      - ${BINARY_NAME}-linux-amd64
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG

build:linux-arm64:
  <<: *go-template
  stage: test
  needs:
    - test:unit
  script:
    - GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-s -w -X main.version=${CI_COMMIT_TAG:-${CI_COMMIT_SHORT_SHA}}" -o ${BINARY_NAME}-linux-arm64 ./cmd/loom
  artifacts:
    paths:
      - ${BINARY_NAME}-linux-arm64
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG

build:darwin-amd64:
  <<: *go-template
  stage: test
  needs:
    - test:unit
  script:
    - GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w -X main.version=${CI_COMMIT_TAG:-${CI_COMMIT_SHORT_SHA}}" -o ${BINARY_NAME}-darwin-amd64 ./cmd/loom
  artifacts:
    paths:
      - ${BINARY_NAME}-darwin-amd64
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG

build:darwin-arm64:
  <<: *go-template
  stage: test
  needs:
    - test:unit
  script:
    - GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-s -w -X main.version=${CI_COMMIT_TAG:-${CI_COMMIT_SHORT_SHA}}" -o ${BINARY_NAME}-darwin-arm64 ./cmd/loom
  artifacts:
    paths:
      - ${BINARY_NAME}-darwin-arm64
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG

# =============================================================================
# DEPLOY STAGE
# =============================================================================

release:
  stage: deploy
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  script:
    - echo "Creating release for $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    description: 'Release $CI_COMMIT_TAG'
    assets:
      links:
        - name: 'loom-linux-amd64'
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/loom-linux-amd64?job=build:linux-amd64'
        - name: 'loom-linux-arm64'
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/loom-linux-arm64?job=build:linux-arm64'
        - name: 'loom-darwin-amd64'
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/loom-darwin-amd64?job=build:darwin-amd64'
        - name: 'loom-darwin-arm64'
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/loom-darwin-arm64?job=build:darwin-arm64'
  rules:
    - if: $CI_COMMIT_TAG

deploy:homebrew:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache git curl
  script:
    - echo "Homebrew tap update would go here"
    - echo "Update formula with new version $CI_COMMIT_TAG"
  rules:
    - if: $CI_COMMIT_TAG
  when: manual

ios:archive-export:
  stage: deploy
  tags:
    - macos
  needs: []
  script:
    - chmod +x scripts/mobile/import-certificate.sh scripts/mobile/archive_export.sh scripts/mobile/cleanup-signing.sh
    - ./scripts/mobile/import-certificate.sh
    - set -a && source build.env && set +a
    - ./scripts/mobile/archive_export.sh
  after_script:
    - ./scripts/mobile/cleanup-signing.sh || true
  artifacts:
    when: always
    paths:
      - build/mobile/LoomCompanion.xcarchive
      - build/mobile/export/app-store/*.ipa
      - build/mobile/ExportOptions.app-store.plist
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_TAG'
      when: manual
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
    - when: never

build:image:loom-core:
  stage: deploy
  # Avoid concurrent Kaniko builds piling up ephemeral storage across nodes.
  resource_group: kaniko
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  # This repo sets GIT_STRATEGY=none globally; Kaniko jobs need a checked-out
  # working tree, and the GitLab archive API has been returning 404.
  variables:
    GIT_STRATEGY: fetch
  script:
    - mkdir -p "$DOCKER_CONFIG"
    - test -f /docker-secrets/config.json || (echo "missing /docker-secrets/config.json (Harbor auth)" && exit 1)
    - cp /docker-secrets/config.json "$DOCKER_CONFIG/config.json"
    - |
      REGISTRY_CANDIDATES="${IMAGE_REGISTRIES:-$IMAGE_REGISTRY}"
      SUCCESS=0
      LAST_RC=1

      for REGISTRY in $REGISTRY_CANDIDATES; do
        PROBE_LOG="$CI_PROJECT_DIR/.probe-${REGISTRY//[^a-zA-Z0-9_.-]/_}.log"
        rm -f "$PROBE_LOG"
        if command -v wget >/dev/null 2>&1; then
          if ! wget -q --spider --timeout=5 --tries=1 "https://$REGISTRY/v2/" >"$PROBE_LOG" 2>&1; then
            if grep -Eqi "401|403|unauthorized|forbidden" "$PROBE_LOG"; then
              echo "Registry host $REGISTRY is reachable (auth challenge)."
            else
              echo "Registry host $REGISTRY is unreachable; skipping."
              cat "$PROBE_LOG"
              rm -f "$PROBE_LOG"
              continue
            fi
          fi
        fi
        rm -f "$PROBE_LOG"

        IMAGE="$REGISTRY/mcp/loom-core"
        DESTINATIONS="--destination $IMAGE:$CI_COMMIT_SHORT_SHA"
        if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
          DESTINATIONS="$DESTINATIONS --destination $IMAGE:latest"
        fi
        if [ -n "$CI_COMMIT_TAG" ]; then
          DESTINATIONS="$DESTINATIONS --destination $IMAGE:$CI_COMMIT_TAG"
        fi

        echo "Attempting build/push via registry host: $REGISTRY"
        echo "Building with destinations: $DESTINATIONS"
        LOG_FILE="$CI_PROJECT_DIR/.kaniko-${REGISTRY//[^a-zA-Z0-9_.-]/_}.log"
        rm -f "$LOG_FILE"
        if /kaniko/executor \
          --context "$CI_PROJECT_DIR" \
          --dockerfile "$CI_PROJECT_DIR/Dockerfile" \
          $DESTINATIONS \
          --cleanup \
          --build-arg "RUNTIME_REGISTRY=$REGISTRY" \
          --build-arg "VERSION=${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}" \
          --build-arg "CI_JOB_TOKEN=$CI_JOB_TOKEN" >"$LOG_FILE" 2>&1; then
          cat "$LOG_FILE"
          rm -f "$LOG_FILE"
          SUCCESS=1
          break
        fi

        LAST_RC=$?
        cat "$LOG_FILE"
        if grep -Eqi "x509|certificate|tls handshake timeout|unknown authority|connection refused|i/o timeout|no route to host|context deadline exceeded|temporary failure in name resolution|unauthorized|denied" "$LOG_FILE"; then
          echo "Registry host $REGISTRY failed; trying next configured host."
          rm -f "$LOG_FILE"
          continue
        fi

        rm -f "$LOG_FILE"
        exit "$LAST_RC"
      done

      if [ "$SUCCESS" -ne 1 ]; then
        echo "All registry hosts failed: $REGISTRY_CANDIDATES"
        exit "$LAST_RC"
      fi
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

build:image:custom-server:
  stage: deploy
  # Avoid concurrent Kaniko builds piling up ephemeral storage across nodes.
  resource_group: kaniko
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  variables:
    GIT_STRATEGY: fetch
  script:
    - mkdir -p "$DOCKER_CONFIG"
    - test -f /docker-secrets/config.json || (echo "missing /docker-secrets/config.json (Harbor auth)" && exit 1)
    - cp /docker-secrets/config.json "$DOCKER_CONFIG/config.json"
    - |
      REGISTRY_CANDIDATES="${IMAGE_REGISTRIES:-$IMAGE_REGISTRY}"
      SUCCESS=0
      LAST_RC=1

      for REGISTRY in $REGISTRY_CANDIDATES; do
        PROBE_LOG="$CI_PROJECT_DIR/.probe-${REGISTRY//[^a-zA-Z0-9_.-]/_}.log"
        rm -f "$PROBE_LOG"
        if command -v wget >/dev/null 2>&1; then
          if ! wget -q --spider --timeout=5 --tries=1 "https://$REGISTRY/v2/" >"$PROBE_LOG" 2>&1; then
            if grep -Eqi "401|403|unauthorized|forbidden" "$PROBE_LOG"; then
              echo "Registry host $REGISTRY is reachable (auth challenge)."
            else
              echo "Registry host $REGISTRY is unreachable; skipping."
              cat "$PROBE_LOG"
              rm -f "$PROBE_LOG"
              continue
            fi
          fi
        fi
        rm -f "$PROBE_LOG"

        IMAGE="$REGISTRY/$CUSTOM_SERVER_IMAGE_REPO"
        DESTINATIONS="--destination $IMAGE:$CI_COMMIT_SHORT_SHA"
        if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
          DESTINATIONS="$DESTINATIONS --destination $IMAGE:latest"
        fi
        if [ -n "$CI_COMMIT_TAG" ]; then
          DESTINATIONS="$DESTINATIONS --destination $IMAGE:$CI_COMMIT_TAG"
        fi

        echo "Attempting build/push via registry host: $REGISTRY"
        echo "Building with destinations: $DESTINATIONS"
        LOG_FILE="$CI_PROJECT_DIR/.kaniko-${REGISTRY//[^a-zA-Z0-9_.-]/_}.log"
        rm -f "$LOG_FILE"
        if /kaniko/executor \
          --context "$CI_PROJECT_DIR" \
          --dockerfile "$CI_PROJECT_DIR/Dockerfile.custom-server" \
          $DESTINATIONS \
          --cleanup \
          --build-arg "RUNTIME_REGISTRY=$REGISTRY" \
          --build-arg "CI_JOB_TOKEN=$CI_JOB_TOKEN" >"$LOG_FILE" 2>&1; then
          cat "$LOG_FILE"
          rm -f "$LOG_FILE"
          SUCCESS=1
          break
        fi

        LAST_RC=$?
        cat "$LOG_FILE"
        if grep -Eqi "x509|certificate|tls handshake timeout|unknown authority|connection refused|i/o timeout|no route to host|context deadline exceeded|temporary failure in name resolution|unauthorized|denied" "$LOG_FILE"; then
          echo "Registry host $REGISTRY failed; trying next configured host."
          rm -f "$LOG_FILE"
          continue
        fi

        rm -f "$LOG_FILE"
        exit "$LAST_RC"
      done

      if [ "$SUCCESS" -ne 1 ]; then
        echo "All registry hosts failed: $REGISTRY_CANDIDATES"
        exit "$LAST_RC"
      fi
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

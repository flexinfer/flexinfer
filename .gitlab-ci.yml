include:
  - project: platform/gitops
    ref: main
    file:
      - /k3s/ci/caches/gitlab-ci-cache.yml

stages:
  - lint
  - test
  - build
  - publish
  - security

default:
  interruptible: true

variables:
  # Keep in sync with Harbor mirror: registry.harbor.lan/library/golang:${GO_VERSION}
  # Bump promptly on Go security releases; Trivy/govulncheck will flag vulnerable stdlib builds.
  GO_VERSION: "1.25.7"
  # Disable CGO for static binaries where possible
  CGO_ENABLED: "0"
  REGISTRY: "registry.harbor.lan/flexinfer"
  GOPROXY: "http://athens.ci.svc.cluster.local:3000,direct"
  BUILDKIT_HOST: "tcp://buildkitd-central.ci-build.svc.cluster.local:1234"
  # Set to "1" to additionally push OCI images to the GitLab Container Registry.
  PUBLISH_GITLAB_IMAGES: "0"
  # Default: avoid building + pushing duplicate ":latest" tags during publish
  # (faster and keeps GitOps pinned to commit SHAs).
  PUBLISH_LATEST_TAGS: "0"
  # Optional: OCI repo for Helm chart publishing (example: oci://registry.harbor.lan/flexinfer-charts)
  HELM_OCI_REPO: ""

.go-cache: &go-cache
  image: registry.harbor.lan/library/golang:${GO_VERSION}
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .go/pkg/mod/
  before_script:
    - mkdir -p .go
    - export GOPATH=${CI_PROJECT_DIR}/.go
    - export PATH=$PATH:$GOPATH/bin

# --- Lint Stage ---
lint:
  stage: lint
  <<: *go-cache
  before_script:
    - mkdir -p .go
    - export GOPATH=${CI_PROJECT_DIR}/.go
    - export PATH=$PATH:$GOPATH/bin
    - go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
  script:
    - golangci-lint run -v --timeout=10m ./...

fmt:
  stage: lint
  <<: *go-cache
  script:
    - |
      dirs="$(go list -f '{{.Dir}}' ./... | tr '\n' ' ')"
      unformatted="$(gofmt -l $dirs)"
      if [ -n "$unformatted" ]; then
        echo "Go code is not formatted:"
        echo "$unformatted"
        exit 1
      fi

helm:
  stage: lint
  image: registry.harbor.lan/library/helm:3.15.4
  script:
    - helm lint charts/flexinfer
    - helm template flexinfer charts/flexinfer --namespace flexinfer-system >/dev/null

vet:
  stage: lint
  <<: *go-cache
  script:
    - go vet ./...

# --- Test Stage ---
unit_test:
  stage: test
  <<: *go-cache
  variables:
    # Minimum code coverage percentage required to pass CI.
    # Raise this as coverage improves; lowering requires justification.
    MIN_COVERAGE: "40"
  script:
    - SKIP_ENVTEST=1 go test -v -coverprofile=coverage.out ./... -short
    - go tool cover -func=coverage.out | tee coverage.txt
    - |
      total=$(go tool cover -func=coverage.out | grep '^total:' | awk '{print $3}' | tr -d '%')
      echo "Total coverage: ${total}%"
      if [ "$(echo "${total} < ${MIN_COVERAGE}" | bc -l)" -eq 1 ]; then
        echo "FAIL: Coverage ${total}% is below minimum threshold ${MIN_COVERAGE}%"
        exit 1
      fi
      echo "PASS: Coverage ${total}% meets minimum threshold ${MIN_COVERAGE}%"
  artifacts:
    paths:
      - coverage.out
      - coverage.txt
    expire_in: 7 days
    when: always

gpugroup_test:
  stage: test
  <<: *go-cache
  script:
    - SKIP_ENVTEST=1 go test -v ./controllers/... -run "GPUGroup" -timeout 5m

proxy_test:
  stage: test
  <<: *go-cache
  script:
    - go test -v ./internal/proxy/... -timeout 2m

race_test:
  stage: test
  <<: *go-cache
  script:
    - echo "Running tests with race detector..."
    - CGO_ENABLED=1 go test -race ./... -short -timeout 10m
  allow_failure: false

integration_test:
  stage: test
  <<: *go-cache
  script:
    - go install sigs.k8s.io/controller-runtime/tools/setup-envtest@latest
    - export KUBEBUILDER_ASSETS=$(setup-envtest use 1.28.x -p path)
    - go test -v ./controllers/...

# E2E tests against real cluster (nightly)
# Requires k3s kubeconfig to be available
e2e_test:
  stage: test
  <<: *go-cache
  variables:
    KUBECONFIG: /etc/kubeconfig/k3s.yaml
    E2E_TIMEOUT_MODEL_READY: "10m"
    E2E_TIMEOUT_COLD_START: "5m"
    E2E_TIMEOUT_INFERENCE: "3m"
    E2E_POLL_INTERVAL: "5s"
  script:
    - |
      echo "Running E2E tests against real cluster..."
      if [ ! -f "${KUBECONFIG}" ]; then
        echo "Kubeconfig not found at ${KUBECONFIG}, skipping E2E tests"
        exit 0
      fi
    - go test -v ./e2e/... -timeout 30m
  rules:
    # Run nightly via schedule
    - if: $CI_PIPELINE_SOURCE == "schedule"
    # Manual trigger for ad-hoc testing
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
  allow_failure: true
  artifacts:
    reports:
      junit: e2e-report.xml
    when: always

# --- Build Stage ---
build_manager:
  stage: build
  <<: *go-cache
  script:
    - go build -o bin/manager cmd/flexinfer-manager/main.go
  artifacts:
    paths:
      - bin/manager
    expire_in: 1 day

build_agent:
  stage: build
  <<: *go-cache
  script:
    - GOOS=linux GOARCH=amd64 go build -o bin/agent cmd/flexinfer-agent/main.go
  artifacts:
    paths:
      - bin/agent
    expire_in: 1 day

build_proxy:
  stage: build
  <<: *go-cache
  script:
    - go build -o bin/proxy ./cmd/flexinfer-proxy/
  artifacts:
    paths:
      - bin/proxy
    expire_in: 1 day
    
build_scheduler:
  stage: build
  <<: *go-cache
  script:
    - go build -o bin/scheduler cmd/flexinfer-sched/main.go
  artifacts:
    paths:
      - bin/scheduler
    expire_in: 1 day

build_benchmarker:
  stage: build
  <<: *go-cache
  script:
    - go build -o bin/benchmarker cmd/flexinfer-bench/main.go
  artifacts:
    paths:
      - bin/benchmarker
    expire_in: 1 day

build_flash_loader:
  stage: build
  <<: *go-cache
  script:
    - go build -o bin/flash-loader cmd/flexinfer-flash-loader/main.go
  artifacts:
    paths:
      - bin/flash-loader
    expire_in: 1 day

# --- Publish Stage ---
# Build via BuildKit (no Docker-in-Docker)
publish:
  stage: publish
  image: registry.harbor.lan/library/buildkit:v0.12.5
  timeout: 2h
  needs:
    - job: build_manager
      artifacts: true
    - job: build_agent
      artifacts: true
    - job: build_scheduler
      artifacts: true
    - job: build_benchmarker
      artifacts: true
    - job: build_proxy
      artifacts: true
    - job: build_flash_loader
      artifacts: true
  before_script:
    - echo "Assuming CI runner has auth for ${REGISTRY} or it is open."
  script:
    - |
      echo "Waiting for BuildKit..."
      for i in $(seq 1 30); do
        if buildctl --addr "${BUILDKIT_HOST}" debug info >/dev/null 2>&1; then
          echo "BuildKit is ready"; break
        fi
        echo "[$i/30] not ready yet"; sleep 2
      done
      buildctl --addr "${BUILDKIT_HOST}" debug info
    - |
      build_image() {
        name="$1"
        dockerfile="$2"
        shift 2

        for tag in "$@"; do
          echo "Publishing ${name}: ${tag}"
          attempts=5
          delay=2
          for i in $(seq 1 "${attempts}"); do
            if buildctl --addr "${BUILDKIT_HOST}" build \
              --frontend dockerfile.v0 \
              --local context=. \
              --local dockerfile=build \
              --opt filename="${dockerfile}" \
              --opt platform=linux/amd64 \
              --output "type=image,name=${tag},push=true"; then
              break
            fi
            if [ "${i}" -eq "${attempts}" ]; then
              echo "ERROR: failed to publish ${name} (${tag}) after ${attempts} attempts"
              exit 1
            fi
            echo "WARN: publish failed (${i}/${attempts}); retrying in ${delay}s..."
            sleep "${delay}"
            delay=$((delay * 2))
          done
        done
      }

      controller_tags="${REGISTRY}/flexinfer-controller:${CI_COMMIT_SHORT_SHA}"
      agent_tags="${REGISTRY}/flexinfer-agent:${CI_COMMIT_SHORT_SHA}"
      scheduler_tags="${REGISTRY}/flexinfer-scheduler:${CI_COMMIT_SHORT_SHA}"
      bench_tags="${REGISTRY}/flexinfer-bench:${CI_COMMIT_SHORT_SHA}"
      proxy_tags="${REGISTRY}/flexinfer-proxy:${CI_COMMIT_SHORT_SHA}"
      flash_loader_tags="${REGISTRY}/flexinfer-flash-loader:${CI_COMMIT_SHORT_SHA}"

      # "master" tags are used for continuous deployment in homelab clusters.
      # The Helm chart forces a rollout on each revision, and imagePullPolicy=Always
      # ensures we always pull the latest "master" image.
      if [ "${CI_COMMIT_BRANCH:-}" = "master" ]; then
        controller_tags="${controller_tags} ${REGISTRY}/flexinfer-controller:master"
        agent_tags="${agent_tags} ${REGISTRY}/flexinfer-agent:master"
        scheduler_tags="${scheduler_tags} ${REGISTRY}/flexinfer-scheduler:master"
        bench_tags="${bench_tags} ${REGISTRY}/flexinfer-bench:master"
        proxy_tags="${proxy_tags} ${REGISTRY}/flexinfer-proxy:master"
        flash_loader_tags="${flash_loader_tags} ${REGISTRY}/flexinfer-flash-loader:master"
      fi

      if [ "${PUBLISH_LATEST_TAGS}" = "1" ] && [ "${CI_COMMIT_BRANCH:-}" = "master" ]; then
        controller_tags="${controller_tags} ${REGISTRY}/flexinfer-controller:latest"
        agent_tags="${agent_tags} ${REGISTRY}/flexinfer-agent:latest"
        scheduler_tags="${scheduler_tags} ${REGISTRY}/flexinfer-scheduler:latest"
        bench_tags="${bench_tags} ${REGISTRY}/flexinfer-bench:latest"
        proxy_tags="${proxy_tags} ${REGISTRY}/flexinfer-proxy:latest"
        flash_loader_tags="${flash_loader_tags} ${REGISTRY}/flexinfer-flash-loader:latest"
      fi

      if [ "${PUBLISH_GITLAB_IMAGES}" = "1" ] && [ -n "${CI_REGISTRY_IMAGE:-}" ]; then
        controller_tags="${controller_tags} ${CI_REGISTRY_IMAGE}/flexinfer-controller:${CI_COMMIT_SHORT_SHA}"
        agent_tags="${agent_tags} ${CI_REGISTRY_IMAGE}/flexinfer-agent:${CI_COMMIT_SHORT_SHA}"
        scheduler_tags="${scheduler_tags} ${CI_REGISTRY_IMAGE}/flexinfer-scheduler:${CI_COMMIT_SHORT_SHA}"
        bench_tags="${bench_tags} ${CI_REGISTRY_IMAGE}/flexinfer-bench:${CI_COMMIT_SHORT_SHA}"
        proxy_tags="${proxy_tags} ${CI_REGISTRY_IMAGE}/flexinfer-proxy:${CI_COMMIT_SHORT_SHA}"
        flash_loader_tags="${flash_loader_tags} ${CI_REGISTRY_IMAGE}/flexinfer-flash-loader:${CI_COMMIT_SHORT_SHA}"
        if [ "${CI_COMMIT_BRANCH:-}" = "master" ]; then
          controller_tags="${controller_tags} ${CI_REGISTRY_IMAGE}/flexinfer-controller:latest"
        fi
      fi

      # Build from the build-stage artifacts (bin/*) to avoid recompiling Go
      # multiple times in the publish stage.
      # shellcheck disable=SC2086
      build_image "flexinfer-controller" "Dockerfile.manager.bin" ${controller_tags}
      # shellcheck disable=SC2086
      build_image "flexinfer-agent" "Dockerfile.agent.bin" ${agent_tags}
      # shellcheck disable=SC2086
      build_image "flexinfer-scheduler" "Dockerfile.sched.bin" ${scheduler_tags}
      # shellcheck disable=SC2086
      build_image "flexinfer-bench" "Dockerfile.bench.bin" ${bench_tags}
      # shellcheck disable=SC2086
      build_image "flexinfer-proxy" "Dockerfile.proxy.bin" ${proxy_tags}
      # shellcheck disable=SC2086
      build_image "flexinfer-flash-loader" "Dockerfile.flash-loader.bin" ${flash_loader_tags}
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_TAG

publish_binaries:
  stage: publish
  image: registry.harbor.lan/library/helm:3.15.4
  needs:
    - job: build_manager
      artifacts: true
    - job: build_agent
      artifacts: true
    - job: build_scheduler
      artifacts: true
    - job: build_benchmarker
      artifacts: true
    - job: build_proxy
      artifacts: true
    - job: build_flash_loader
      artifacts: true
  script:
    - apk add --no-cache curl
    - mkdir -p dist
    - version="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    - |
      upload() {
        local src="$1" dst="$2"
        curl --fail-with-body \
          --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "${src}" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/flexinfer/${version}/${dst}"
      }

      upload "bin/manager" "manager_linux_amd64"
      upload "bin/agent" "agent_linux_amd64"
      upload "bin/scheduler" "scheduler_linux_amd64"
      upload "bin/benchmarker" "benchmarker_linux_amd64"
      upload "bin/proxy" "proxy_linux_amd64"
      upload "bin/flash-loader" "flash-loader_linux_amd64"
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_TAG

publish_helm_chart:
  stage: publish
  image: registry.harbor.lan/library/helm:3.15.4
  script:
    - apk add --no-cache curl
    - mkdir -p dist
    - |
      chart_version=""
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        chart_version="${CI_COMMIT_TAG#v}"
      else
        chart_version="0.1.0-${CI_COMMIT_SHORT_SHA}"
      fi
      helm lint charts/flexinfer
      helm package charts/flexinfer --destination dist --version "${chart_version}"
      chart_tgz="$(ls dist/flexinfer-*.tgz | head -n 1)"
      version="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
      curl --fail-with-body \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file "${chart_tgz}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/flexinfer-helm/${version}/$(basename "${chart_tgz}")"

      if [ -n "${HELM_OCI_REPO}" ]; then
        helm push "${chart_tgz}" "${HELM_OCI_REPO}"
      else
        echo "HELM_OCI_REPO not set; skipping OCI push"
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_TAG

# --- Optional: MLC-LLM Backend Images ---
# These are large images (~10GB) and take a long time to build.
# Trigger manually when needed.
publish_mlcllm_rocm:
  stage: publish
  image: registry.harbor.lan/library/buildkit:v0.12.5
  timeout: 2h
  script:
    - |
      echo "Waiting for BuildKit..."
      for i in $(seq 1 30); do
        if buildctl --addr "${BUILDKIT_HOST}" debug info >/dev/null 2>&1; then
          echo "BuildKit is ready"; break
        fi
        echo "[$i/30] not ready yet"; sleep 2
      done
    - |
      echo "Building MLC-LLM ROCm image..."
      buildctl --addr "${BUILDKIT_HOST}" build \
        --frontend dockerfile.v0 \
        --local context=. \
        --local dockerfile=build \
        --opt filename="Dockerfile.mlc-rocm" \
        --opt platform=linux/amd64 \
        --output "type=image,name=${REGISTRY}/mlc-llm:rocm,push=true"
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
    - when: never


# --- Quantizer Images ---
# CPU-only quantization tools for model weight compression
build_quantizer_gguf:
  stage: build
  image: registry.harbor.lan/library/buildkit:v0.12.5
  timeout: 1h
  needs: []
  script:
    - |
      echo "Waiting for BuildKit..."
      for i in $(seq 1 30); do
        if buildctl --addr "${BUILDKIT_HOST}" debug info >/dev/null 2>&1; then
          echo "BuildKit is ready"; break
        fi
        echo "[$i/30] not ready yet"; sleep 2
      done
    - |
      echo "Building GGUF quantizer image..."
      attempts=3
      delay=5
      for i in $(seq 1 "${attempts}"); do
        if buildctl --addr "${BUILDKIT_HOST}" build \
          --frontend dockerfile.v0 \
          --local context=. \
          --local dockerfile=build \
          --opt filename="Dockerfile.quantizer-gguf" \
          --opt platform=linux/amd64 \
          --import-cache "type=registry,ref=${REGISTRY}/quantizer:gguf" \
          --export-cache "type=inline" \
          --output "type=image,name=${REGISTRY}/quantizer:gguf,push=true"; then
          break
        fi
        if [ "${i}" -eq "${attempts}" ]; then
          echo "ERROR: GGUF quantizer build/push failed after ${attempts} attempts"
          exit 1
        fi
        echo "WARN: GGUF quantizer build/push failed (${i}/${attempts}); retrying in ${delay}s..."
        sleep "${delay}"
        delay=$((delay * 2))
      done
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
      changes:
        - build/Dockerfile.quantizer-gguf
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"

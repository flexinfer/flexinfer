# --- Security Stage ---
# Go dependency vulnerability scanning using govulncheck
govulncheck:
  stage: security
  <<: *go-cache
  before_script:
    - mkdir -p .go
    - export GOPATH=${CI_PROJECT_DIR}/.go
    - export PATH=$PATH:$GOPATH/bin
    - go install golang.org/x/vuln/cmd/govulncheck@latest
  script:
    - echo "Scanning Go dependencies for known vulnerabilities..."
    - govulncheck -show verbose ./...
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_PIPELINE_SOURCE == "schedule"
  allow_failure: false

# Trivy filesystem scanning for go.mod vulnerabilities
trivy_scan_deps:
  stage: security
  image: registry.harbor.lan/library/trivy:0.58.0
  variables:
    TRIVY_NO_PROGRESS: "true"
    TRIVY_CACHE_DIR: ".trivycache/"
  cache:
    paths:
      - .trivycache/
  script:
    - echo "Scanning go.mod for dependency vulnerabilities..."
    - trivy fs --scanners vuln --exit-code 0 --format table .
    - echo ""
    - echo "=== Checking for HIGH/CRITICAL vulnerabilities ==="
    - trivy fs --scanners vuln --exit-code 1 --severity HIGH,CRITICAL .
  artifacts:
    reports:
      dependency_scanning: trivy-deps-report.json
    when: always
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_PIPELINE_SOURCE == "schedule"

# SBOM generation using syft (spdx-json format)
# Generates Software Bill of Materials for CNCF compliance
sbom_generate:
  stage: security
  image: registry.harbor.lan/library/golang:${GO_VERSION}
  before_script:
    - mkdir -p .go
    - export GOPATH=${CI_PROJECT_DIR}/.go
    - export PATH=$PATH:$GOPATH/bin
    - |
      echo "Installing syft..."
      curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
  script:
    - echo "Generating SBOM in SPDX JSON format..."
    - syft dir:. -o spdx-json=sbom-spdx.json
    - echo "Generating SBOM in CycloneDX format..."
    - syft dir:. -o cyclonedx-json=sbom-cyclonedx.json
    - echo "SBOM generation complete."
    - echo "SPDX entries:"
    - wc -l sbom-spdx.json
  artifacts:
    paths:
      - sbom-spdx.json
      - sbom-cyclonedx.json
    expire_in: 90 days
    when: always
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "schedule"

# License compliance check using go-licenses
# Ensures all dependencies use approved open-source licenses
go_licenses_check:
  stage: security
  <<: *go-cache
  before_script:
    - mkdir -p .go
    - export GOPATH=${CI_PROJECT_DIR}/.go
    - export PATH=$PATH:$GOPATH/bin
    - go install github.com/google/go-licenses@latest
  script:
    - echo "Checking license compliance for all Go dependencies..."
    - go-licenses report ./... 2>licenses-errors.txt | tee licenses-report.csv || true
    - |
      echo ""
      echo "=== Checking for forbidden licenses ==="
      # Fail if any dependency uses a restricted license (GPL, AGPL, SSPL)
      if go-licenses check ./... 2>&1 | grep -i "forbidden\|restricted"; then
        echo "FAIL: Found dependencies with forbidden licenses"
        exit 1
      fi
      echo "PASS: All dependencies use approved licenses"
  artifacts:
    paths:
      - licenses-report.csv
      - licenses-errors.txt
    expire_in: 30 days
    when: always
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_PIPELINE_SOURCE == "schedule"
  allow_failure: true

# Go module update check (informational)
go_mod_outdated:
  stage: security
  <<: *go-cache
  before_script:
    - mkdir -p .go
    - export GOPATH=${CI_PROJECT_DIR}/.go
    - export PATH=$PATH:$GOPATH/bin
    - go install github.com/psampaz/go-mod-outdated@latest
  script:
    - echo "Checking for outdated Go dependencies..."
    - go list -u -m -json all | go-mod-outdated -direct -update
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  allow_failure: true

# Trivy vulnerability scanning for container images
# Fails pipeline on HIGH or CRITICAL CVEs in production images
.trivy-scan: &trivy-scan
  stage: security
  image: registry.harbor.lan/library/trivy:0.58.0
  variables:
    TRIVY_NO_PROGRESS: "true"
    TRIVY_CACHE_DIR: ".trivycache/"
  cache:
    paths:
      - .trivycache/
  artifacts:
    reports:
      container_scanning: trivy-report.json
    paths:
      - trivy-report.json
      - trivy-report.sarif
    expire_in: 7 days
    when: always

trivy_scan_controller:
  <<: *trivy-scan
  needs:
    - job: publish
      optional: true
  script:
    - |
      echo "Scanning flexinfer-controller image for vulnerabilities..."
      IMAGE="${REGISTRY}/flexinfer-controller:${CI_COMMIT_SHORT_SHA}"

      # Generate JSON report for GitLab integration
      trivy image --exit-code 0 \
        --format json \
        --output trivy-report.json \
        "${IMAGE}"

      # Generate SARIF report for GitHub-compatible tools
      trivy image --exit-code 0 \
        --format sarif \
        --output trivy-report.sarif \
        "${IMAGE}"

      # Fail on HIGH/CRITICAL vulnerabilities
      echo ""
      echo "=== Checking for HIGH/CRITICAL vulnerabilities ==="
      trivy image --exit-code 1 \
        --severity HIGH,CRITICAL \
        --ignore-unfixed \
        "${IMAGE}"
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_TAG


# Loom CI/CD Pipeline
# Provides lint, test, build, and deploy stages with comprehensive testing
#
# iOS signing/distribution secret contract (mirrors streamslate pattern):
#   APPLE_CERTIFICATE            - Base64 .p12 or File variable path
#   APPLE_CERTIFICATE_PASSWORD   - .p12 password
#   APPLE_TEAM_ID                - Apple Developer Team ID
#   APPLE_PROVISIONING_PROFILE   - Base64 .mobileprovision or File variable path
#   APPLE_API_ISSUER             - App Store Connect issuer ID (upload lanes)
#   APPLE_API_KEY                - App Store Connect key ID (upload lanes)
#   APPLE_API_KEY_BASE64         - Base64 .p8 key contents (upload lanes)
#
# Helper scripts:
#   scripts/mobile/import-certificate.sh
#   scripts/mobile/cleanup-signing.sh

include:
  - project: platform/gitops
    ref: main
    file:
      - /k3s/ci/caches/gitlab-ci-cache.yml
  - project: "services/tech-radar"
    file: "/ci/radar.yml"

# This GitLab instance intermittently creates detached MR pipelines with
# refs/merge-requests/*/head that fail immediately with no jobs. Run the
# branch/tag pipeline as the canonical CI signal for merge requests.
workflow:
  auto_cancel:
    # Cancel older running pipelines on the same ref when a newer commit arrives.
    on_new_commit: interruptible
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

stages:
  - prepare
  - lint
  - build
  - test
  - deploy

default:
  # Allow newer commits to preempt in-flight non-release work and free runner slots.
  interruptible: true

variables:
  AUTO_DEVOPS_ENABLED: "false"
  GO_VERSION: "1.25.8"
  BINARY_NAME: "loom"
  # Limit static-analysis scans to first-party packages.
  GO_APP_PKGS: "./cmd/... ./internal/... ./pkg/..."
  # Ensure private modules never go to public proxies/sumdb.
  GOPRIVATE: "gitlab.flexinfer.ai/*"
  # Athens is the preferred in-cluster proxy; fall back to public proxy then direct
  # to reduce transient infra outages breaking CI.
  GOPROXY: "https://proxy.golang.org|direct"
  # Work around occasional runner fetch failures for ephemeral pipeline refs by
  # disabling shallow clones (fetch full history).
  GIT_DEPTH: "0"
  # CI should resolve pinned module versions, not the local workspace overlays
  # used on developer machines.
  GOWORK: "off"
  # Disable CGo globally — CI runners don't have fi-accel C headers, and all
  # binaries are statically linked for container deployment.
  CGO_ENABLED: "0"
  # GitLab Runner intermittently attempts to fetch `refs/pipelines/<id>`, which
  # is not reliably available on this GitLab instance. Skip the built-in
  # checkout and fetch sources explicitly inside jobs instead.
  GIT_STRATEGY: "none"
  # Minimum test coverage threshold (percentage)
  # Raised to 35% (actual coverage ~39.4%). Original was 30%, lowered to 24% for SSH
  # tunnel code, then raised to 35% in Cycle 3 debt remediation (2026-03-27).
  COVERAGE_THRESHOLD: "35"
  IMAGE_REGISTRY: registry.flexinfer.ai
  IMAGE_REGISTRIES: "registry.harbor.lan registry.flexinfer.ai"
  CUSTOM_SERVER_IMAGE_REPO: mcp/custom-server
  BUILDKIT_HOST: "tcp://buildkitd-central.ci-build.svc.cluster.local:1234"
  BUILDKIT_FALLBACK_HOSTS: "tcp://buildkitd-central.ci-build.svc.cluster.local:1234,tcp://buildkitd.ci-build.svc.cluster.local:1234"
  BUILDKIT_CLI_IMAGE: "registry.harbor.lan/dockerhub-cache/moby/buildkit:v0.12.5"
  # The CI runner injects a pre-build step that waits for a Docker daemon when DOCKER_HOST is tcp://localhost:2375.
  # This repo doesn't use DinD for its Go jobs; disable that wait globally to prevent jobs hanging.
  DOCKER_HOST: ""

# Cache Go modules and build cache
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    # Cache Go-installed tooling (golangci-lint, etc.) to avoid reinstalling
    # large toolchains on every job.
    - .go/bin/
    # Cache the module download ZIP/index cache (not extracted modules).
    # This stays well under the runner's 512MB cache upload limit.
    - .go/pkg/mod/cache/download/
    - .go-build/
  # Pull cache everywhere, but only push from selected jobs to avoid repeatedly
  # archiving tens of thousands of small Go cache files on every job.
  policy: pull

# Base template for Go jobs
.go-template: &go-template
  image: registry.harbor.lan/dockerhub-cache/library/golang:${GO_VERSION}
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  variables:
    GO_WARM_MOD_CACHE: "false"
  before_script:
    - |
      # Ensure required OS tools exist (golang image may not include them).
      if ! command -v git >/dev/null 2>&1 || ! command -v curl >/dev/null 2>&1; then
        apt-get update -qq
        apt-get install -y --no-install-recommends git curl ca-certificates
        rm -rf /var/lib/apt/lists/*
      fi
    - |
      if [ ! -f go.mod ]; then
        echo "Fetching repository sources (git)..."
        if [ -z "${CI_JOB_TOKEN:-}" ]; then
          echo "ERROR: CI_JOB_TOKEN is not set; cannot fetch via git"
          exit 1
        fi

        # Avoid printing the token in logs.
        git init -q
        git remote add origin "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
        # Fetch the exact commit SHA (not just branch tip) so checkout always works,
        # even when the branch has advanced since the pipeline was created.
        git fetch -q origin "${CI_COMMIT_SHA}"
        git checkout -q -f "${CI_COMMIT_SHA}"
      fi
    - |
      # Authenticate direct Git module fetches for private libs/* modules without
      # recloning sibling repositories into the workspace.
      git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/".insteadOf "https://${CI_SERVER_HOST}/"
      git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.flexinfer.ai/".insteadOf "https://gitlab.flexinfer.ai/"
    - export GOPATH="$CI_PROJECT_DIR/.go"
    - export GOCACHE="$CI_PROJECT_DIR/.go-build"
    - mkdir -p "$GOPATH" "$GOCACHE"
    - |
      # Best-effort: wait briefly for in-cluster Athens during rollouts.
      ATHENS_READY_URL="http://athens.ci.svc.cluster.local:3000/readyz"
      for i in 1 2 3 4 5; do
        if curl -fsS "$ATHENS_READY_URL" >/dev/null 2>&1; then
          break
        fi
        echo "Waiting for Athens (${i}/5)..."
        sleep 2
      done
    - |
      if [ "${GO_WARM_MOD_CACHE:-true}" = "true" ]; then
        # Go module downloads are occasionally flaky on the homelab runner; retry a few times.
        download_ok=0
        for i in 1 2 3; do
          if go mod download; then
            download_ok=1
            break
          fi
          echo "go mod download failed (attempt ${i}/3); retrying..."
          sleep 3
        done
        if [ "$download_ok" -ne 1 ]; then
          exit 1
        fi
      else
        echo "Skipping eager go mod download (GO_WARM_MOD_CACHE=false); resolving modules on demand."
      fi

# =============================================================================
# PREPARE STAGE
# Seed shared Go module/build cache once so lint/test jobs avoid repeating
# network-heavy dependency downloads.
# =============================================================================

prepare:go-cache:
  <<: *go-template
  stage: prepare
  variables:
    GO_WARM_MOD_CACHE: "true"
    KUBERNETES_CPU_REQUEST: "1"
    KUBERNETES_CPU_LIMIT: "2"
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .go/bin/
      - .go/pkg/mod/cache/download/
      - .go-build/
    policy: pull-push
  script:
    - echo "Seeding shared Go cache/tooling"
    - |
      LINT_BIN="$(go env GOPATH)/bin/golangci-lint"
      if [ -x "$LINT_BIN" ] && "$LINT_BIN" version 2>/dev/null | grep -q 'version v2.8.0'; then
        echo "Using cached golangci-lint v2.8.0"
      else
        go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.8.0
      fi
    - go env GOPATH GOCACHE
  artifacts:
    paths:
      - .go/bin/golangci-lint
    expire_in: 1 week

# =============================================================================
# LINT STAGE
# =============================================================================

lint:
  <<: *go-template
  stage: lint
  needs:
    - job: prepare:go-cache
      artifacts: true
  dependencies:
    - prepare:go-cache
  variables:
    GO_WARM_MOD_CACHE: "false"
    KUBERNETES_CPU_REQUEST: "1"
    KUBERNETES_CPU_LIMIT: "2"
    KUBERNETES_MEMORY_REQUEST: "4Gi"
    KUBERNETES_MEMORY_LIMIT: "8Gi"
  script:
    - |
      if [ ! -x "$(go env GOPATH)/bin/golangci-lint" ]; then
        echo "ERROR: expected golangci-lint artifact from prepare:go-cache"
        ls -la "$(go env GOPATH)/bin" || true
        exit 1
      fi
    - $(go env GOPATH)/bin/golangci-lint run --timeout 30m ${GO_APP_PKGS}

vet:
  <<: *go-template
  stage: lint
  variables:
    GO_WARM_MOD_CACHE: "false"
  script:
    - go vet ./...

fmt:
  <<: *go-template
  stage: lint
  variables:
    GIT_STRATEGY: fetch
    GO_WARM_MOD_CACHE: "false"
  before_script: []
  script:
    - |
      UNFORMATTED=$(gofmt -l . 2>/dev/null | grep -v '^vendor/' | grep -v '^\.go/' | grep -v '\.pb\.go$' || true)
      if [ -n "$UNFORMATTED" ]; then
        echo "The following files need formatting:"
        echo "$UNFORMATTED"
        gofmt -d $(echo "$UNFORMATTED" | head -20)
        exit 1
      fi

lint:rbac-policy:
  <<: *go-template
  stage: lint
  variables:
    GO_WARM_MOD_CACHE: "false"
  script:
    - go run ./cmd/loom validate rbac --source repo

guardrails:docs-cli:
  <<: *go-template
  stage: lint
  variables:
    GO_WARM_MOD_CACHE: "false"
  script:
    - |
      # The shared template may fetch sources via archive (no .git metadata).
      # Recreate a minimal git checkout so docs drift checks can diff against base.
      if ! git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
        git init -q
        git remote add origin "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
        git fetch -q origin "${CI_COMMIT_SHA}"
        git checkout -q -f "${CI_COMMIT_SHA}"
      fi
      BASE_BRANCH="${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-$CI_DEFAULT_BRANCH}"
      git fetch -q origin "${BASE_BRANCH}:${BASE_BRANCH}" || true
      DOCS_CHECK_BASE_REF="${BASE_BRANCH}" bash scripts/ci/check_docs_guardrails.sh
      bash scripts/ci/check_flexinfer_site_integration.sh
    - go run ./cmd/loom --help >/dev/null
    - go run ./cmd/loom proxy --help >/dev/null

security:gosec:
  <<: *go-template
  stage: lint
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - when: never
  variables:
    GO_WARM_MOD_CACHE: "false"
  script:
    - go install github.com/securego/gosec/v2/cmd/gosec@latest
    # Exclude rules that are false positives or intentional patterns:
    #   G101: env var key names, not credentials  G104: best-effort error handling
    #   G106: SSH config flag  G115: safe int conversions  G117: struct field names
    #   G118: intentional context.Background  G120: local-only OAuth handler
    #   G122: CLI filepath.Walk  G204/G304: core CLI/MCP functionality
    #   G301/G302/G306: intentional permissions  G401/G501/G505: crypto tool functionality
    #   G402: internal LAN TLS  G702/G703/G704: core server-launch/file-read functionality
    - >-
      $(go env GOPATH)/bin/gosec -concurrency=2
      -exclude=G101,G104,G106,G115,G117,G118,G120,G122,G204,G301,G302,G304,G306,G401,G402,G501,G505,G702,G703,G704
      -exclude-dir=.go -exclude-dir=vendor
      -fmt json -out gosec-report.json ${GO_APP_PKGS}
  artifacts:
    when: always
    paths:
      - gosec-report.json
    expire_in: 1 week

security:govulncheck:
  <<: *go-template
  stage: lint
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - when: never
  variables:
    GO_WARM_MOD_CACHE: "false"
    GOMEMLIMIT: "6GiB"
  script:
    - go install golang.org/x/vuln/cmd/govulncheck@latest
    # module mode scans the current module and does not accept package patterns
    # run from a package dir since repo root has no Go files
    - (cd cmd/loom && $(go env GOPATH)/bin/govulncheck -scan=module) > govulncheck-report.txt
    - cat govulncheck-report.txt
  artifacts:
    when: always
    paths:
      - govulncheck-report.txt
    expire_in: 1 week

lint:mcp-godot:
  image: registry.harbor.lan/dockerhub-cache/library/node:20
  stage: lint
  variables:
    # This job needs repository files under tools/mcp-godot.
    # Global GIT_STRATEGY is "none", so override to fetch sources here.
    GIT_STRATEGY: fetch
  rules:
    - changes:
        - tools/mcp-godot/**/*
    - if: '$RUN_MCP_GODOT_QUALITY == "true"'
    - when: never
  before_script: []
  script:
    - cd tools/mcp-godot
    - npm ci
    - npm run lint
    - npm run test

# =============================================================================
# BUILD STAGE
# Build binaries before tests to enable integration testing
# =============================================================================

build:binaries:
  <<: *go-template
  stage: build
  needs:
    - job: prepare:go-cache
      artifacts: false
  variables:
    GO_WARM_MOD_CACHE: "false"
    # Keep generous limits, but lower requests so bursty branch pipelines fit
    # more cleanly on the shared runner pool during agent-heavy development.
    KUBERNETES_CPU_REQUEST: "1500m"
    KUBERNETES_CPU_LIMIT: "4"
    KUBERNETES_MEMORY_REQUEST: "3Gi"
    KUBERNETES_MEMORY_LIMIT: "8Gi"
  cache:
    # Keep Go module/build caches shared per-branch, but keep compiled binaries
    # scoped per-commit to avoid stale/incorrect reuse.
    - key: ${CI_COMMIT_REF_SLUG}
      paths:
        - .go/pkg/mod/
        - .go-build/
      # Uploading this cache adds several minutes of archive time in practice
      # (40k+ files). Keep pull-only to avoid CI wall-clock bottlenecks.
      policy: pull
    - key: ${CI_COMMIT_SHA}-bin
      paths:
        - bin/
      policy: push
  script:
    - |
      VERSION="${CI_COMMIT_TAG:-${CI_COMMIT_SHORT_SHA}}"
      LDFLAGS="-s -w -X main.version=${VERSION}"
      export LDFLAGS

      echo "Building all binaries..."
      mkdir -p bin

      # Build main binaries
      go build -ldflags="$LDFLAGS" -o bin/loom ./cmd/loom
      go build -ldflags="$LDFLAGS" -o bin/loomd ./cmd/loomd

      # Build MCP servers for integration tests in parallel to reduce wall time.
      # Cap parallelism to avoid exhausting /tmp with per-process Go build caches
      # when building 60+ servers. Also redirect GOTMPDIR to the workspace volume
      # which has more space than the runner's tmpfs.
      mapfile -t MCP_PKGS < <(find cmd -mindepth 1 -maxdepth 1 -type d -name 'mcp-*' | xargs -n1 basename | sort)
      MCP_BUILD_JOBS="${MCP_BUILD_JOBS:-4}"
      export GOTMPDIR="${CI_PROJECT_DIR:-.}/.go-tmp"
      mkdir -p "$GOTMPDIR"
      echo "Building ${#MCP_PKGS[@]} MCP servers with ${MCP_BUILD_JOBS} parallel jobs..."
      if ! printf '%s\n' "${MCP_PKGS[@]}" | xargs -P "${MCP_BUILD_JOBS}" -I{} bash -c '
        pkg="$1"
        echo "Building ${pkg}..."
        go build -ldflags="$LDFLAGS" -o "bin/${pkg}" "./cmd/${pkg}"
      ' _ {}; then
        echo "ERROR: one or more MCP server builds failed"
        exit 1
      fi

      echo "Built binaries:"
      ls -la bin/
  # NOTE: GitLab instance currently rejects large artifact uploads (HTTP 413).
  # Use the runner cache (MinIO) for passing binaries to downstream jobs instead.

# =============================================================================
# TEST STAGE
# =============================================================================

test:unit:
  <<: *go-template
  stage: test
  needs:
    - job: prepare:go-cache
      artifacts: false
  variables:
    CGO_ENABLED: "0"
    GO_WARM_MOD_CACHE: "false"
    KUBERNETES_CPU_REQUEST: "1500m"
    KUBERNETES_CPU_LIMIT: "4"
    KUBERNETES_MEMORY_REQUEST: "3Gi"
    KUBERNETES_MEMORY_LIMIT: "8Gi"
  script:
    - |
      echo "Selecting packages with tests..."
      mapfile -t PKGS < <(go list -f '{{if or (gt (len .TestGoFiles) 0) (gt (len .XTestGoFiles) 0)}}{{.ImportPath}}{{end}}' ./... | sed '/^$/d')
      echo "Packages with tests: ${#PKGS[@]}"

      # agentcontext-linked packages require fi-accel FFI. On runners where
      # the native fi-accel library is unavailable, skip those packages so
      # the rest of the unit suite still runs.
      if [ ! -f "${CI_PROJECT_DIR}/../../libs/fi-accel/go/lib/linux_amd64/libfi_accel_ffi.so" ] && \
         [ ! -f "${CI_PROJECT_DIR}/../../libs/fi-accel/go/lib/linux_amd64/libfi_accel_ffi.a" ]; then
        echo "fi-accel FFI library not found; excluding agentcontext-linked packages from unit tests."
        mapfile -t PKGS < <(printf '%s\n' "${PKGS[@]}" | grep -Ev '^github.com/crb2nu/loom/(pkg|cmd/mcp-agent-context)')
      fi

      echo "Running unit tests with coverage..."
      go test -coverprofile=coverage.out -covermode=count "${PKGS[@]}"

      # Convert Go coverprofile to Cobertura XML for GitLab coverage reports
      go install github.com/boumenot/gocover-cobertura@v1.4.0
      $(go env GOPATH)/bin/gocover-cobertura < coverage.out > coverage.xml

      echo ""
      echo "Coverage Summary:"
      go tool cover -func=coverage.out | tail -20

      # Extract total coverage
      TOTAL=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
      echo ""
      echo "Total Coverage: ${TOTAL}%"

      # Check coverage threshold
      if [ -n "$COVERAGE_THRESHOLD" ]; then
        THRESHOLD_INT=$(echo "$COVERAGE_THRESHOLD" | cut -d. -f1)
        TOTAL_INT=$(echo "$TOTAL" | cut -d. -f1)
        if [ "$TOTAL_INT" -lt "$THRESHOLD_INT" ]; then
          echo "ERROR: Coverage ${TOTAL}% is below threshold ${COVERAGE_THRESHOLD}%"
          exit 1
        fi
      fi
  coverage: '/total:\s+\(statements\)\s+(\d+.\d+)%/'
  artifacts:
    paths:
      - coverage.out
      - coverage.xml
    expire_in: 1 week
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

test:integration:
  <<: *go-template
  stage: test
  needs:
    - build:binaries
  variables:
    GO_WARM_MOD_CACHE: "false"
    CGO_ENABLED: "1"
    KUBERNETES_CPU_REQUEST: "1500m"
    KUBERNETES_CPU_LIMIT: "4"
    KUBERNETES_MEMORY_REQUEST: "3Gi"
    KUBERNETES_MEMORY_LIMIT: "8Gi"
  cache:
    - key: ${CI_COMMIT_SHA}-bin
      paths:
        - bin/
      policy: pull
  script:
    - |
      echo "Setting up integration test environment..."
      export LOOM_REPO_ROOT="$CI_PROJECT_DIR"
      export LOOM_RUN_MCP_SMOKE="1"
      export PATH="$CI_PROJECT_DIR/bin:$PATH"

      echo "Using pre-built MCP server binaries from build:binaries job..."
      echo "Available MCP servers:"
      ls -la bin/mcp-* 2>/dev/null || echo "No MCP servers found"

      echo ""
      echo "Running integration tests..."
      go test -v -race ./internal/integration/...

test:enterprise-smoke:
  <<: *go-template
  stage: test
  needs:
    - job: prepare:go-cache
      artifacts: false
  variables:
    GO_WARM_MOD_CACHE: "false"
  script:
    - bash scripts/ci/enterprise_smoke_suite.sh

test:race:
  <<: *go-template
  stage: test
  needs:
    - job: prepare:go-cache
      artifacts: false
  variables:
    GO_WARM_MOD_CACHE: "false"
    CGO_ENABLED: "1"
    KUBERNETES_CPU_REQUEST: "1500m"
    KUBERNETES_CPU_LIMIT: "4"
    KUBERNETES_MEMORY_REQUEST: "3Gi"
    KUBERNETES_MEMORY_LIMIT: "8Gi"
  script:
    - |
      mapfile -t PKGS < <(go list ./...)

      # Some packages still transitively require fi-accel FFI. On runners
      # where the native library is unavailable, skip only those packages so
      # the rest of the race suite can still run.
      # Known transitive fi-accel entrypoints:
      #   agentcontext path: cmd/loom, cmd/loomd, cmd/mcp-agent-context, pkg/...
      #                      internal/daemon, internal/hud/*, internal/tui
      #   openairesponses path: cmd/mcp-orchestra, cmd/mcp-weaver
      if [ ! -f "${CI_PROJECT_DIR}/../../libs/fi-accel/go/lib/linux_amd64/libfi_accel_ffi.so" ] && \
         [ ! -f "${CI_PROJECT_DIR}/../../libs/fi-accel/go/lib/linux_amd64/libfi_accel_ffi.a" ]; then
        echo "fi-accel FFI library not found; excluding fi-accel-linked packages from race tests."
        mapfile -t PKGS < <(printf '%s\n' "${PKGS[@]}" | grep -Ev '^github.com/crb2nu/loom/(pkg|cmd/(loom$|loomd$|mcp-agent-context|mcp-orchestra|mcp-weaver)|internal/(daemon|hud|tui|contracts))')
      fi

      go test -race -short "${PKGS[@]}"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Benchmark tests - run on demand
test:benchmark:
  <<: *go-template
  stage: test
  needs:
    - build:binaries
  allow_failure: true
  script:
    - |
      export LOOM_REPO_ROOT="$CI_PROJECT_DIR"
      export PATH="$CI_PROJECT_DIR/bin:$PATH"

      echo "Running benchmarks..."
      go test -bench=. -benchmem -run=^$ ./internal/... ./pkg/... 2>&1 | tee benchmark.txt
  artifacts:
    paths:
      - benchmark.txt
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: manual

# =============================================================================
# RELEASE BUILDS
# Cross-compile for all target platforms
# =============================================================================

build:linux-amd64:
  <<: *go-template
  stage: test
  needs:
    - test:unit
  script:
    - GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w -X main.version=${CI_COMMIT_TAG:-${CI_COMMIT_SHORT_SHA}}" -o ${BINARY_NAME}-linux-amd64 ./cmd/loom
  artifacts:
    paths:
      - ${BINARY_NAME}-linux-amd64
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG

build:linux-arm64:
  <<: *go-template
  stage: test
  needs:
    - test:unit
  script:
    - GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-s -w -X main.version=${CI_COMMIT_TAG:-${CI_COMMIT_SHORT_SHA}}" -o ${BINARY_NAME}-linux-arm64 ./cmd/loom
  artifacts:
    paths:
      - ${BINARY_NAME}-linux-arm64
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG

build:darwin-amd64:
  <<: *go-template
  stage: test
  needs:
    - test:unit
  script:
    - GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w -X main.version=${CI_COMMIT_TAG:-${CI_COMMIT_SHORT_SHA}}" -o ${BINARY_NAME}-darwin-amd64 ./cmd/loom
  artifacts:
    paths:
      - ${BINARY_NAME}-darwin-amd64
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG

build:darwin-arm64:
  <<: *go-template
  stage: test
  needs:
    - test:unit
  script:
    - GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-s -w -X main.version=${CI_COMMIT_TAG:-${CI_COMMIT_SHORT_SHA}}" -o ${BINARY_NAME}-darwin-arm64 ./cmd/loom
  artifacts:
    paths:
      - ${BINARY_NAME}-darwin-arm64
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG

# =============================================================================
# DEPLOY STAGE
# =============================================================================

release:
  stage: deploy
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  script:
    - echo "Creating release for $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    description: 'Release $CI_COMMIT_TAG'
    assets:
      links:
        - name: 'loom-linux-amd64'
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/loom-linux-amd64?job=build:linux-amd64'
        - name: 'loom-linux-arm64'
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/loom-linux-arm64?job=build:linux-arm64'
        - name: 'loom-darwin-amd64'
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/loom-darwin-amd64?job=build:darwin-amd64'
        - name: 'loom-darwin-arm64'
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/loom-darwin-arm64?job=build:darwin-arm64'
  rules:
    - if: $CI_COMMIT_TAG

deploy:homebrew:
  stage: deploy
  image: registry.harbor.lan/dockerhub-cache/library/alpine:latest
  before_script:
    - apk add --no-cache git curl
  script:
    - echo "Homebrew tap update would go here"
    - echo "Update formula with new version $CI_COMMIT_TAG"
  rules:
    - if: $CI_COMMIT_TAG
  when: manual

ios:archive-export:
  stage: deploy
  tags:
    - macos
  needs: []
  # This job runs repo-local signing/export scripts, so it must opt out of the
  # global no-checkout mode and fetch a working tree first.
  variables:
    GIT_STRATEGY: fetch
  script:
    - chmod +x scripts/mobile/import-certificate.sh scripts/mobile/archive_export.sh scripts/mobile/cleanup-signing.sh
    - ./scripts/mobile/import-certificate.sh
    - set -a && source build.env && set +a
    - ./scripts/mobile/archive_export.sh
  after_script:
    - ./scripts/mobile/cleanup-signing.sh || true
  artifacts:
    when: always
    paths:
      - build/mobile/LoomCompanion.xcarchive
      - build/mobile/export/app-store/*.ipa
      - build/mobile/ExportOptions.app-store.plist
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_TAG'
      when: manual
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
    - when: never

build:image:loom-core:
  stage: deploy
  interruptible: true
  timeout: 90 minutes
  # Image jobs do not use language caches; skip restore/upload overhead.
  cache: []
  # Keep serialization within a ref, but don't let feature/MR pipelines block main.
  resource_group: "buildkit-images-loom-core-${CI_COMMIT_REF_SLUG}"
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  image:
    name: $BUILDKIT_CLI_IMAGE
    entrypoint: [""]
  # GIT_STRATEGY overrides the global "none" because image jobs need a working tree.
  # DOCKER_HOST="" prevents the runner from waiting for a DinD daemon.
  variables:
    GIT_STRATEGY: fetch
    DOCKER_HOST: ""
  script:
    - chmod +x scripts/ci/buildkit-build.sh
    - scripts/ci/buildkit-build.sh mcp/loom-core Dockerfile loom-core
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH'
      changes:
        - .gitlab-ci.yml
        - .dockerignore
        - Dockerfile
        - scripts/ci/buildkit-build.sh
        - go.mod
        - go.sum
        - cmd/**/*
        - internal/**/*
        - pkg/**/*
      allow_failure: true
    - when: never

build:image:custom-server:
  stage: deploy
  interruptible: true
  timeout: 90 minutes
  cache: []
  resource_group: "buildkit-images-custom-server-${CI_COMMIT_REF_SLUG}"
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  image:
    name: $BUILDKIT_CLI_IMAGE
    entrypoint: [""]
  variables:
    GIT_STRATEGY: fetch
    DOCKER_HOST: ""
  script:
    - chmod +x scripts/ci/buildkit-build.sh
    - scripts/ci/buildkit-build.sh "$CUSTOM_SERVER_IMAGE_REPO" Dockerfile.custom-server custom-server
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH'
      changes:
        - .gitlab-ci.yml
        - .dockerignore
        - Dockerfile.custom-server
        - scripts/ci/buildkit-build.sh
        - go.mod
        - go.sum
        - cmd/**/*
        - internal/**/*
        - pkg/**/*
      allow_failure: true
    - when: never

radar-scan:
  extends: .radar-scan

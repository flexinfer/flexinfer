# Nightly comprehensive scan of all images
# Includes MEDIUM vulnerabilities and generates full reports
trivy_scan_nightly:
  <<: *trivy-scan
  script:
    - |
      echo "=== Nightly Security Scan ==="
      echo "Scanning all FlexInfer images..."

      IMAGES="
        ${REGISTRY}/flexinfer-controller:latest
        ${REGISTRY}/flexinfer-agent:latest
        ${REGISTRY}/flexinfer-proxy:latest
        ${REGISTRY}/flexinfer-scheduler:latest
        ${REGISTRY}/flexinfer-bench:latest
        ${REGISTRY}/flexinfer-flash-loader:latest
      "

      all_passed=true
      for image in ${IMAGES}; do
        echo ""
        echo "=== Scanning ${image} ==="

        # Full scan including MEDIUM severity
        if ! trivy image --exit-code 1 \
          --severity MEDIUM,HIGH,CRITICAL \
          --ignore-unfixed \
          "${image}"; then
          all_passed=false
          echo "WARN: Vulnerabilities found in ${image}"
        fi
      done

      if [ "${all_passed}" = "false" ]; then
        echo ""
        echo "=== SUMMARY: Some images have vulnerabilities ==="
        exit 1
      fi

      echo ""
      echo "=== All images passed security scan ==="
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual

radar-scan:
  extends: .radar-scan

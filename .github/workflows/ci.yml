name: ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # loom-core uses local `replace` directives for these libs. In GitHub Actions we
      # check them out and repoint the replaces so builds/tests are hermetic.
      - uses: actions/checkout@v4
        with:
          repository: crb2nu/mcp-go
          path: _deps/mcp-go
      - uses: actions/checkout@v4
        with:
          repository: crb2nu/fi-mcp-kit
          path: _deps/fi-mcp-kit
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Wire local module replacements
        run: |
          set -euo pipefail
          go mod edit -replace gitlab.flexinfer.ai/libs/mcp-go=./_deps/mcp-go
          go mod edit -replace gitlab.flexinfer.ai/libs/fi-mcp-kit=./_deps/fi-mcp-kit
      - name: Test
        run: go test ./...

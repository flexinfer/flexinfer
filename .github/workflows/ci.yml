name: ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # loom-core uses local `replace` directives for these libs. In GitHub Actions we
      # check them out and repoint the replaces so builds/tests are hermetic.
      - uses: actions/checkout@v4
        with:
          repository: crb2nu/mcp-go
          path: _deps/mcp-go
          ref: main
          # Use a PAT/fine-grained token with access to the private dependency repos.
          # Deploy-key based checkouts were flaky on runners ("error in libcrypto").
          token: ${{ secrets.LOOM_DEPS_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: crb2nu/fi-mcp-kit
          path: _deps/fi-mcp-kit
          ref: main
          token: ${{ secrets.LOOM_DEPS_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Wire local module replacements
        run: |
          set -euo pipefail
          go mod edit -replace gitlab.flexinfer.ai/libs/mcp-go=./_deps/mcp-go
          go mod edit -replace gitlab.flexinfer.ai/libs/fi-mcp-kit=./_deps/fi-mcp-kit
      - name: Guardrails (docs drift + CLI help smoke)
        run: |
          bash scripts/ci/check_docs_guardrails.sh
          bash scripts/ci/check_flexinfer_site_integration.sh
          go run ./cmd/loom --help >/dev/null
          go run ./cmd/loom proxy --help >/dev/null
      - name: Test
        run: go test ./...

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
            archive: tar.gz
          - goos: linux
            goarch: arm64
            ext: ""
            archive: tar.gz
          - goos: darwin
            goarch: amd64
            ext: ""
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            ext: ""
            archive: tar.gz
          - goos: windows
            goarch: amd64
            ext: ".exe"
            archive: zip
          - goos: windows
            goarch: arm64
            ext: ".exe"
            archive: zip

    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: crb2nu/mcp-go
          path: _deps/mcp-go
          ref: main
          token: ${{ secrets.LOOM_DEPS_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: crb2nu/fi-mcp-kit
          path: _deps/fi-mcp-kit
          ref: main
          token: ${{ secrets.LOOM_DEPS_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          go mod edit -replace gitlab.flexinfer.ai/libs/mcp-go=./_deps/mcp-go
          go mod edit -replace gitlab.flexinfer.ai/libs/fi-mcp-kit=./_deps/fi-mcp-kit

          mkdir -p dist/stage

          LDFLAGS="-s -w -X main.version=${TAG}"

          echo "Building loom (${GOOS}/${GOARCH})..."
          go build -trimpath -ldflags "${LDFLAGS}" -o "dist/stage/loom${{ matrix.ext }}" ./cmd/loom

          echo "Building loomd (${GOOS}/${GOARCH})..."
          go build -trimpath -ldflags "${LDFLAGS}" -o "dist/stage/loomd${{ matrix.ext }}" ./cmd/loomd

          cp -f README.md dist/stage/README.md || true
          # Include a license file if the repo has one.
          if ls LICENSE* >/dev/null 2>&1; then
            cp -f LICENSE* dist/stage/ || true
          fi

      - name: Package
        env:
          TAG: ${{ github.ref_name }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail

          mkdir -p dist/out

          NAME="loom-core_${TAG}_${GOOS}_${GOARCH}"
          if [ "${ARCHIVE}" = "zip" ]; then
            (cd dist/stage && zip -q -9 "../out/${NAME}.zip" ./*)
          else
            (cd dist/stage && tar -czf "../out/${NAME}.tar.gz" ./*)
          fi

          rm -rf dist/stage

      - uses: actions/upload-artifact@v4
        with:
          name: loom-core-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/out/*
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: List assets
        run: |
          set -euo pipefail
          find dist -type f -maxdepth 4 -print

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        # `action-gh-release` expects a tag ref; for workflow_dispatch runs on a
        # branch we still want the build/package steps to run, but we should not
        # attempt to publish a release.
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          files: |
            dist/**/*.tar.gz
            dist/**/*.zip

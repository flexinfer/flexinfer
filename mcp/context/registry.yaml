      always_allow:
        - git_status
        - git_diff
        - git_log
        - git_show
        - git_branch
    targets:
      claude:
        command: "${repo}/services/loom-core/bin/mcp-git"
        args: []
        env:
          GIT_REPO_PATH: "${repo}"
      gemini:
        command: "${repo}/services/loom-core/bin/mcp-git"
        args: []
        env:
          GIT_REPO_PATH: "${repo}"
      codex:
        command: "${repo}/services/loom-core/bin/mcp-git"
        args: []
        env:
          GIT_REPO_PATH: "${repo}"
      kilocode:
        command: "${repo}/services/loom-core/bin/mcp-git"
        args: []
        env:
          GIT_REPO_PATH: "${repo}"
      vscode:
        type: stdio
        command: "${repo}/services/loom-core/bin/mcp-git"
        args: []
        env:
          GIT_REPO_PATH: "${repo}"

    categories: [reasoning, planning]
    common:
      description: Dynamic and reflective problem-solving through sequential thoughts
      hint: Use for complex problem breakdown and multi-step analysis
      command: "${repo}/services/loom-core/bin/mcp-sequentialthinking"
      args: []
      timeout: 60
      always_allow:
        - start_thinking
        - add_thought
        - get_chain
        - list_chains
        - set_active_chain
        - complete_chain
        - branch_thought
        - delete_chain
        - summarize_chain
    targets:
      vscode:
        type: stdio
        command: "${repo}/services/loom-core/bin/mcp-sequentialthinking"
        args: []

        MORPH_BASE_URL: "${env:MORPH_BASE_URL:-https://api.morphllm.com/v1}"
        MORPH_EMBED_MODEL: "${env:MORPH_EMBED_MODEL:-morph-embedding-v3}"
        LOG_LEVEL: info

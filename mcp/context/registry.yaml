          - "@coding-solo/godot-mcp"
        env:
          GODOT_PATH: "${env:GODOT_PATH:-/Applications/Godot.app/Contents/MacOS/Godot}"
          DEBUG: "${env:GODOT_MCP_DEBUG:-false}"
          PATH: "${HOME}/.npm-global/bin:/opt/homebrew/opt/node@20/bin:/opt/homebrew/bin:${env:PATH}"
      gemini:

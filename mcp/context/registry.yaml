# Sandbox policy — advisory guidance for agents on when to use devbox sandboxes.
# Agents read this from AGENTS.md (injected by loom sync) and the HUD displays it.
sandbox_policy:
  # Commands that MUST run inside a sandbox (agents should always use devbox_exec).
  require_sandbox:
    - "npm install"
    - "pip install"
    - "cargo build"
    - "yarn install"
    - "pnpm install"
    - "go build ./..."
    - "make build"
  # Commands that SHOULD run inside a sandbox (agents should prefer devbox_exec).
  recommend_sandbox:
    - "go test"
    - "pytest"
    - "npm test"
    - "make test"
    - "make lint"
    - "cargo test"
  # Auto-provision a sandbox container on session start if a project fingerprint is found.
  auto_provision: true
  # Default backend for sandbox containers (docker or k8s).
  default_backend: k8s

# Platform permissions — per-platform permission and settings for config generation.
# These are emitted into .claude/settings.json (and equivalents) by `loom sync`.
platform_permissions:
  # Shared agent-behavior policy used by generated AGENTS.md guidance and CLI hooks.
  agents:
    settings:
      # Continue on dirty repos by default; commit scope must stay task-local.
      dirty_worktree_mode: "continue_scoped_commits"
      # Show a non-blocking nudge at session start when repo has local changes.
      dirty_worktree_nudge_on_session_start: true
      # Canonical guidance text propagated to AGENTS.md + SessionStart hooks.
      dirty_worktree_nudge_message: "Dirty worktree detected. Treat pre-existing changes as baseline context, continue work, and stage/commit only files for the active task. Before creating another multi-file worktree, inspect existing linked trees with git -C <repo> worktree list or workspace-clean --report --worktrees. For multi-file work, create repo-local linked trees under <repo>/.worktrees/<branch>; do not create sibling repos under services/, libs/, labs/, or the workspace root. Escalate only if new unexpected changes appear in files you are editing."
      # Shared guardrails consumed by generator hooks now and proxy enforcement later.
      guardrails:
        gitops_flux:
          blocked_commands:
            - "kubectl apply"
            - "kubectl delete"
            - "kubectl patch"
            - "kubectl edit"
            - "kubectl set"
            - "kubectl replace"
            - "kubectl create"
            - "kubectl scale"
            - "kubectl rollout restart"
            - "kubectl rollout undo"
          message: >-
            GitOps policy: Direct kubectl mutations bypass git history and Flux reconciliation.
            Edit manifests in platform/gitops/, commit, push, then run flux reconcile.

  claude:
    additional_directories:
      - "~/workspace"
    settings:
      # Accept edits automatically; Bash is broadly allowed below so
      # the only remaining prompts are the deny-list items.
      default_mode: "acceptEdits"
    allow:
      # -- MCP tools (all loom-proxied servers) --
      - "mcp__loom"
      # -- Built-in Claude Code tools --
      - "Bash"
      - "Edit"
      - "MultiEdit"
      - "Glob"
      - "Grep"
      - "Read"
      - "Write"
      - "NotebookEdit"
      - "NotebookRead"
      - "LS"
      - "Task"
      - "WebFetch"
      - "WebSearch"
      - "Skill"
      - "ToolSearch"
      # -- Planning & task management --
      - "EnterPlanMode"
      - "ExitPlanMode"
      - "AskUserQuestion"
      - "TaskCreate"
      - "TaskGet"
      - "TaskList"
      - "TaskUpdate"
      - "TaskOutput"
      - "TaskStop"
      - "KillShell"
      - "Monitor"

  codex:
    settings:
      # Default approval policy for autonomous runs.
      # Modern Codex CLI versions (>=4.x) respect the top-level "never" string
      # reliably when paired with server-level approval_mode = "always".
      approval_policy: "never"
      suppress_unstable_features_warning: true
      sandbox_mode: "workspace-write"
      web_search: "live"
      model: "gpt-5.4"
      model_reasoning_effort: "high"
      features:
        multi_agent: true
        unified_exec: true
        shell_tool: true
        collaboration_modes: true
        # Opt in to Codex's [hooks] block (GA v0.129.0, 2026-05-07). The
        # generator emits hooks.json alongside config.toml; this flag tells
        # Codex to load it. See pkg/generator/VENDOR_SPECS.md "Codex [hooks]".
        hooks: true
      # Agent definitions emitted as [agents.<name>] TOML sections.
      agents:
        max_threads: 4
        max_depth: 1
        job_max_runtime_seconds: 1800
        definitions:
          slice-implementer:
            description: "Implements a single feature slice in an isolated worktree."
          reviewer:
            description: "Reviews code for correctness, security, and test coverage."

  gemini:
    settings:
      # Auto-approve edit tools (matches Claude's extensive allow list).
      # Gemini CLI: "auto_edit" auto-approves file edits while prompting for others.
      # Note: "yolo" mode not yet supported in settings.json per upstream schema.
      approval_mode: "auto_edit"
      # Enable checkpointing so /restore can undo file changes.
      checkpointing: true
      # Let trusted workspaces persist low-risk command approvals instead of
      # asking every session.
      enable_permanent_tool_approval: true
      folder_trust_enabled: true
      # Allowed tool patterns — bypass confirmation for common safe commands.
      # Uses Gemini CLI prefix matching (run_shell_command(git) matches git *).
      # Include shell primitives commonly used in pipes and redirections so
      # benign one-liners behave more like Claude/Codex without allowing broad
      # shell wrappers such as bash/sh.
      tools_allowed:
        - "run_shell_command(git)"
        - "run_shell_command(go)"
        - "run_shell_command(gofmt)"
        - "run_shell_command(goimports)"
        - "run_shell_command(golangci-lint)"
        - "run_shell_command(make)"
        - "run_shell_command(npm)"

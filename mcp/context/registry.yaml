    common:
      description: Manage ASUS router via SSH alias (asus-router in ~/.ssh/config)
      command: "${repo}/services/loom-core/bin/mcp-asus-router"
      args: []
      env:
        ASUS_ROUTER_HOST: asus-router
        ASUS_ROUTER_PORT: "2222"
        ASUS_ROUTER_USER: admin
      hint: Use for router status/log tails, nvram inspection, and safe maintenance actions
      timeout: 30
      startup_timeout_ms: 180000

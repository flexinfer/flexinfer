version: 1
updated: 2026-03-31
notes: |
  Canonical MCP server registry shared by Codex CLI, Claude Code, and Kilo Code.

  ## Purpose
  This registry provides a single source of truth for all MCP server configurations
  across different AI coding assistant platforms. It enables:
  - Consistent MCP server definitions across profiles
  - Platform-specific overrides (codex, kilocode, vscode)
  - Centralized maintenance of environment variables and permissions
  - Automatic configuration generation for different platforms

  ## Structure
  Each server entry contains:
  - name: Unique identifier for the MCP server
  - categories: Classification tags (e.g., kubernetes, monitoring, search)
  - common: Default configuration used across all platforms
    - description: Human-readable description
    - command: Executable or script to run
    - args: Command-line arguments
    - env: Environment variables
    - timeout: Maximum execution time in seconds
    - always_allow: Auto-approved tool names
    - hint: Usage guidance for AI assistants
  - targets: Platform-specific overrides
    - codex: Codex CLI specific settings
    - kilocode: Kilo Code specific settings
    - vscode: Claude Code VSCode extension settings

  ## Variable Substitution
  The registry supports these variable patterns:
  - ${repo}: Repository root path (replaced at config generation time)
  - ${HOME}: User home directory
  - ${env:VAR}: Environment variable reference
  - ${keychain:KEY}: macOS Keychain reference (codex/vscode)
  - ${secret:KEY}: Loom secret store reference (env -> keychain -> 1Password -> encrypted file)

  ## Token Naming
  - GitLab PATs: use GITLAB_PERSONAL_ACCESS_TOKEN when possible; sync_all_configs.sh will map GITLAB_PAT to the canonical name for convenience.

  ## Configuration Locations
  Generated/derived configurations:
  - .claude/config.toml - Claude Code VSCode extension (manually maintained, should align)
  - .codex/config.toml - Codex CLI (generated from this registry)
  - .kilocode/config.toml - Kilo Code (manually maintained, should align)

  ## Maintenance
  When adding or modifying MCP servers:
  1. Update this registry file first
  2. Add common configuration that works for all platforms
  3. Add platform-specific overrides only when necessary
  4. Regenerate or manually update platform configs
  5. Test across all platforms (codex, kilocode, vscode)
  6. Ensure parity in .claude/, .codex/, and .kilocode/ directories

  ## Context Broker
  All platforms use port 9876 for the MCP context broker (not Redis port 6379).
  The context broker enables cross-MCP server coordination and state sharing.

servers:
  - name: tavily
    categories: [search, docs]
    common:
      description: AI-powered web search and content extraction (Go native)
      command: "${repo}/services/loom-core/bin/mcp-tavily"
      args: []
      env:
        TAVILY_API_KEY: "${env:TAVILY_API_KEY}"
      always_allow:
        - search
        - search_news
        - extract
        - search_context
      hint: Use for real-time web search and information gathering
      timeout: 60
    targets:
      codex:
        env:
          TAVILY_API_KEY: "${secret:TAVILY_API_KEY}"
      vscode:
        type: stdio
        command: "${repo}/services/loom-core/bin/mcp-tavily"
        args: []
        env:
          TAVILY_API_KEY: "${env:TAVILY_API_KEY}"
  - name: context7
    categories: [docs, local-only]
    common:
      description: Library documentation retrieval
      command: python3
      args:
        - "${repo}/platform/gitops/scripts/mcp/run_cached_node_server.py"
        - context7
      env:
        CONTEXT7_MAX_TOKENS: "20000"
        LOG_LEVEL: info
        MCP_TIMEOUT: "90"
        PATH: "${HOME}/.npm-global/bin:/opt/homebrew/opt/node@20/bin:/opt/homebrew/bin:${env:PATH}"
      always_allow:
        - resolve-library-id
        - get-library-docs
      hint: Use for retrieving library documentation and code snippets
      timeout: 90
    targets:
      kilocode:
        command: npx
        args:
          - -y
          - "@upstash/context7-mcp@1.0.26"
      vscode:
        type: stdio
        command: npx
        args:
          - -y
          - "@upstash/context7-mcp@1.0.26"
        env:
          CONTEXT7_MAX_TOKENS: "20000"
          LOG_LEVEL: info
  - name: github
    categories: [devops, scm]
    common:
      description: GitHub repository operations and management (Go native)
      command: "${repo}/services/loom-core/bin/mcp-github"
      args: []
      env:
        GITHUB_TOKEN: "${env:GITHUB_PERSONAL_ACCESS_TOKEN}"
      hint: Use for GitHub API operations, repository management, and PR automation
      timeout: 60
      always_allow:
        - list_repos
        - get_repo
        - list_issues
        - get_issue
        - create_issue
        - list_prs
        - get_pr
        - list_commits
        - search_repos
        - search_code
        - get_file_contents
    targets:
      claude:
        command: "${repo}/services/loom-core/bin/mcp-github"
        args: []
        env:
          GITHUB_TOKEN: "${env:GITHUB_PERSONAL_ACCESS_TOKEN}"
      gemini:
        command: "${repo}/services/loom-core/bin/mcp-github"
        args: []
        env:
          GITHUB_TOKEN: "${env:GITHUB_PERSONAL_ACCESS_TOKEN}"
      codex:
        env:
          GITHUB_TOKEN: "${keychain:GITHUB_PERSONAL_ACCESS_TOKEN}"
      kilocode:
        command: "${repo}/services/loom-core/bin/mcp-github"
        args: []
        env:
          GITHUB_TOKEN: "${env:GITHUB_PERSONAL_ACCESS_TOKEN}"
      vscode:
        type: stdio
        command: "${repo}/services/loom-core/bin/mcp-github"
        args: []
        env:
          GITHUB_TOKEN: "${env:GITHUB_PERSONAL_ACCESS_TOKEN}"
  - name: gitlab
    categories: [devops, scm]
    common:
      description: GitLab repository operations and management (Go native)
      hint: Use for GitLab API operations (issues, MRs, repo content); defaults to the self-hosted API URL.
      command: "${repo}/services/loom-core/bin/mcp-gitlab"
      args: []
      timeout: 60
      always_allow:
        - verify_token
        - create_or_update_file
        - push_files
        - search_repositories
        - create_repository
        - get_file_contents
        - create_issue
        - list_issues
        - create_merge_request
        - get_merge_request
        - list_merge_requests
        - merge_merge_request
        - list_pipelines
        - get_pipeline
        - create_pipeline
        - cancel_pipeline
        - retry_pipeline
        - list_pipeline_jobs
        - get_job
        - get_job_trace
        - retry_job
        - play_job
        - cancel_job
        - fork_repository
        - create_branch
        - get_project
        - list_projects
      env:
        GITLAB_API_URL: "${env:GITLAB_API_URL:-https://gitlab.flexinfer.ai/api/v4}"
        GITLAB_PERSONAL_ACCESS_TOKEN: "${env:GITLAB_PERSONAL_ACCESS_TOKEN}"
    targets:
      claude:
        command: "${repo}/services/loom-core/bin/mcp-gitlab"
        args: []
        env:
          GITLAB_PERSONAL_ACCESS_TOKEN: "${env:GITLAB_PERSONAL_ACCESS_TOKEN}"
          GITLAB_API_URL: "${env:GITLAB_API_URL:-https://gitlab.flexinfer.ai/api/v4}"
      gemini:
        command: "${repo}/services/loom-core/bin/mcp-gitlab"
        args: []
        env:
          GITLAB_PERSONAL_ACCESS_TOKEN: "${env:GITLAB_PERSONAL_ACCESS_TOKEN}"
          GITLAB_API_URL: "${env:GITLAB_API_URL:-https://gitlab.flexinfer.ai/api/v4}"
      codex:
        env:
          GITLAB_PERSONAL_ACCESS_TOKEN: "${keychain:GITLAB_PERSONAL_ACCESS_TOKEN}"
          GITLAB_API_URL: "${env:GITLAB_API_URL:-https://gitlab.flexinfer.ai/api/v4}"
      kilocode:
        command: "${repo}/services/loom-core/bin/mcp-gitlab"
        args: []
        env:
          GITLAB_PERSONAL_ACCESS_TOKEN: "${env:GITLAB_PERSONAL_ACCESS_TOKEN}"
          GITLAB_API_URL: "${env:GITLAB_API_URL:-https://gitlab.flexinfer.ai/api/v4}"
      vscode:
        type: stdio
        command: "${repo}/services/loom-core/bin/mcp-gitlab"
        args: []
        env:
          GITLAB_PERSONAL_ACCESS_TOKEN: "${env:GITLAB_PERSONAL_ACCESS_TOKEN}"
          GITLAB_API_URL: "${env:GITLAB_API_URL:-https://gitlab.flexinfer.ai/api/v4}"
  - name: cloudflare
    categories: [networking, operations]
    common:
      description: Cloudflare API utilities (token verify, zones, tunnels, DNS management)
      command: "${repo}/services/loom-core/bin/mcp-cloudflare"
      args: []
      env:
        CF_API_TOKEN: "${env:CF_API_TOKEN}"
        CF_ACCOUNT_ID: "${env:CF_ACCOUNT_ID}"
        LOG_LEVEL: info
      always_allow:
        - cf_verify_token
        - cf_list_zones
        - cf_list_tunnels
        - cf_list_dns_records
        - cf_create_dns_record
        - cf_update_dns_record
        - cf_delete_dns_record
        - cf_purge_cache
      hint: Use for DNS management, zone/tunnel inspection, and cache operations
      timeout: 60
    targets:
      codex:
        env:
          CF_API_TOKEN: "${secret:CF_API_TOKEN}"
          CF_ACCOUNT_ID: "${secret:CF_ACCOUNT_ID}"
      vscode:
        type: stdio
        command: "${repo}/services/loom-core/bin/mcp-cloudflare"
        args: []
  - name: k8s_apps_k3s
    categories: [kubernetes, operations]
    common:
      description: Kubernetes operations for the k3s apps cluster (use for app deploys, logs, rollouts)
      hint: Use k8s_apps_k3s__* tools for workloads running on k3s
      command: "${repo}/services/loom-core/bin/mcp-k8s-ops"
      args: []

      timeout: 90
      always_allow:
        - k8s.apply
        - k8s.get
        - k8s.getPods
        - k8s.logs
        - k8s.describe
        - k8s.exec
        - k8s.listNamespaces
        - k8s.listContexts
      env:
        MCP_K8S_KUBECONFIG: "${repo}/platform/gitops/.kube/k3s.yaml"
        KUBECONFIG: "${repo}/platform/gitops/.kube/k3s.yaml"
        MCP_K8S_DEBUG: ""
        CONTEXT_BROKER_PUBLISH: "1"
        CONTEXT_BROKER_HOST: "127.0.0.1"
        CONTEXT_BROKER_PORT: "9876"
    targets:
      kilocode:
        timeout: 120
        env:
          MCP_K8S_DEBUG: "1"
          K8S_OPERATION_TIMEOUT: "120"
      vscode:
        type: stdio
        command: "${repo}/services/loom-core/bin/mcp-k8s-ops"
        args: []

        timeout: 120
        env:
          MCP_K8S_KUBECONFIG: "${repo}/platform/gitops/.kube/k3s.yaml"
          KUBECONFIG: "${repo}/platform/gitops/.kube/k3s.yaml"
          MCP_K8S_DEBUG: "1"
          CONTEXT_BROKER_PUBLISH: "1"
          CONTEXT_BROKER_HOST: "127.0.0.1"
          CONTEXT_BROKER_PORT: "9876"
          K8S_OPERATION_TIMEOUT: "120"
  - name: longhorn_k3s
    categories: [storage, kubernetes, operations]
    common:
      description: Longhorn storage operations on the k3s cluster (volumes, replicas, attachments)
      hint: Target the longhorn-system namespace; use k8s.get/k8s.describe on Volume, Replica, Node CRDs and inspect events to debug attachments.
      command: "${repo}/services/loom-core/bin/mcp-k8s-ops"
      args: []
      env:
        MCP_K8S_KUBECONFIG: "${repo}/platform/gitops/.kube/k3s.yaml"
        KUBECONFIG: "${repo}/platform/gitops/.kube/k3s.yaml"
        LOG_LEVEL: info
        CONTEXT_BROKER_PUBLISH: "1"
        CONTEXT_BROKER_HOST: "127.0.0.1"
        CONTEXT_BROKER_PORT: "9876"
      timeout: 90
      always_allow:
        - k8s.get
        - k8s.describe
        - k8s.getPods
        - k8s.logs
        - k8s.apply
    targets:
      codex:
        env:
          MCP_K8S_DEBUG: "1"
      kilocode:
        env:
          MCP_K8S_DEBUG: "1"
  - name: k8s_harvester_infra
    categories: [kubernetes, operations]
    common:
      description: Kubernetes operations for the Harvester (RKE2) management cluster (Go native)
      hint: Use k8s_harvester_infra__* tools for Harvester/infra operations
      command: "${repo}/services/loom-core/bin/mcp-k8s-ops"
      args: []
      timeout: 90
      always_allow:
        - k8s.get
        - k8s.getPods
        - k8s.logs
        - k8s.exec
        - k8s.describe
        - k8s.listNamespaces
        - k8s.apply
        - k8s.listContexts
      env:
        MCP_K8S_KUBECONFIG: "${repo}/platform/gitops/.kube/harvester-admin.yaml"
        KUBECONFIG: "${repo}/platform/gitops/.kube/harvester-admin.yaml"
    targets:
      vscode:
        type: stdio
        command: "${repo}/services/loom-core/bin/mcp-k8s-ops"
        args: []
        env:
          MCP_K8S_KUBECONFIG: "${repo}/platform/gitops/.kube/harvester-admin.yaml"
          KUBECONFIG: "${repo}/platform/gitops/.kube/harvester-admin.yaml"

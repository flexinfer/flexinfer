      hint: Use to create isolated worktrees per agent; inspect existing worktrees first and keep new paths under <repo>/.worktrees
      command: "${repo}/services/loom-core/bin/mcp-git-worktree"
      args: []
      timeout: 60
      always_allow:
        - git_worktree_list
        - git_worktree_add
        - git_worktree_remove
        - git_worktree_prune

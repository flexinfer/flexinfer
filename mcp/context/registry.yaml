    common:
      description: Semantic codebase indexing + search (Go native)
      hint: Run codebase_index_start and poll, then query via search/context tools. Indexing is async; use a fresh collection (codebase_memory_v1).
      command: "${repo}/services/loom-core/bin/mcp-codebase-memory"
      args: []
      timeout: 180
      always_allow:

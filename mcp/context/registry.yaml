  - name: memory
    categories: [memory, knowledge]
    common:
      description: Knowledge graph memory for persistent context (Go native)
      hint: Use for storing and retrieving entity relationships and observations
      command: "${repo}/services/loom-core/bin/mcp-memory"
      args: []
      timeout: 60

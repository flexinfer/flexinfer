  - name: codebase-exploration-memory
    categories: [memory, agents]
    common:
      description: |
        Preserve codebase exploration findings across sessions with an index-first workflow. Use when mapping architecture, tracing behavior, or building reusable mental models across agents.
      instructions: |
        # Codebase Exploration Memory

        Build persistent mental models of codebases that survive across sessions.

        ## When to Use

        - Onboarding to a new codebase
        - Deep-diving into complex subsystems
        - Mapping dependencies and call graphs
        - Building architecture documentation

        ## Exploration Workflow

        ### 0. Ensure Code Index Is Ready

        Before deep exploration, verify index coverage:

        ```
        codebase_stats(repo_id="my-project")
        ```

        If index is absent or stale:

        ```
        codebase_index_start(
            repo_id="my-project",
            root=".",
            full_refresh=true
        )
        codebase_index_poll(job_id="...")
        ```

        Use watch mode for long exploration sessions:

        ```
        codebase_watch_start(repo_id="my-project", root=".")
        ```

        ### 1. Start Exploration Session

        ```
        agent_session_start(
            namespace="project/codebase-exploration",
            description="Mapping authentication subsystem"
        )
        ```

        ### 2. Record File Reads

        When you read important files, record key insights:

        ```
        agent_context_add(
            session_id="...",
            entries=[
                {
                    entry_type: "file_read",
                    title: "Auth middleware entry point",
                    content: "Main validation in validateToken(). Uses JWT with RS256. Refresh handled separately.",
                    file_path: "src/middleware/auth.go",
                    line_start: 45,
                    line_end: 120,
                    tags: ["auth", "middleware", "jwt"]
                }
            ]
        )
        ```

        ### 3. Record Symbol-Level Code Context

        Connect findings to indexed code with `code_context` entries:

        ```
        agent_context_add(
            session_id="...",
            entries=[
                {
                    entry_type: "code_context",
                    title: "validateToken symbol context",
                    content: "Main entry point for JWT validation.",
                    file_path: "src/middleware/auth.go",
                    line_start: 45,
                    line_end: 90,
                    metadata: {
                        repo_id: "my-project",
                        symbol: "validateToken"
                    },
                    tags: ["auth", "critical-path"]
                }
            ]
        )
        ```

        ### 4. Record Architectural Findings


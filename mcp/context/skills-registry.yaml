  - name: agent-workflow-ops
    categories: [workflow, agents]
    common:
      description: |
        Define and execute multi-step agent workflows with approval gates. Use for complex operations requiring human oversight, multi-stage deployments, or coordinated agent actions.
      instructions: |
        # Agent Workflow Operations

        Orchestrate multi-step workflows with approval gates and status tracking.

        ## When to Use

        - Multi-stage deployments requiring approval
        - Complex refactoring with checkpoints
        - Operations requiring human sign-off
        - Coordinated multi-agent tasks

        ## Workflow Concepts

        - **Workflow Definition**: Template for a repeatable process
        - **Workflow Instance**: Running execution of a definition
        - **Steps**: Individual actions in sequence
        - **Approval Gates**: Points requiring human confirmation
        - **Events**: Audit trail of workflow progress

        ## Defining Workflows

        ### Create Definition

        ```
        agent_workflow_define(
            name="production-deploy",
            description="Deploy to production with approval",
            steps=[
                {
                    name: "run-tests",
                    description: "Execute test suite",
                    action: "command",
                    command: "make test"
                },
                {
                    name: "build-image",
                    description: "Build container image",
                    action: "command",
                    command: "make docker-build"
                },
                {
                    name: "deploy-staging",
                    description: "Deploy to staging",
                    action: "command",
                    command: "make deploy-staging"
                },
                {
                    name: "approval-gate",
                    description: "Human approval for production",
                    action: "approval",
                    approvers: ["cblevins"]
                },
                {
                    name: "deploy-production",
                    description: "Deploy to production",
                    action: "command",
                    command: "make deploy-production"
                }
            ]
        )
        ```

        ## Running Workflows

        ### Start Workflow

        ```
        agent_workflow_start(
            definition_name="production-deploy",
            parameters={
                version: "1.2.3",
                commit: "abc123"
            }
        )
        → Returns workflow_id
        ```

        ### Check Status

        ```
        agent_workflow_status(
            workflow_id="..."
        )
        → Returns current step, status, events
        ```

        ### Handle Approval Gate

        When workflow reaches approval step:

        ```
        # Approve
        agent_workflow_approve(
            workflow_id="...",
            step_name="approval-gate",
            comment="Staging looks good, proceeding to prod"
        )

        # Or Reject
        agent_workflow_reject(
            workflow_id="...",
            step_name="approval-gate",
            reason="Found regression in staging"
        )
        ```

        ### Cancel Workflow

        ```
        agent_workflow_cancel(
            workflow_id="...",
            reason="No longer needed"
        )
        ```

        ## Monitoring Workflows

        ### List Active Workflows

        ```
        agent_workflow_list(
            status="running"
        )
        ```

        ### View Events

        ```
        agent_workflow_events(
            workflow_id="...",
            limit=50
        )
        → Returns audit trail
        ```

        ### List Definitions

        ```
        agent_workflow_definitions()
        ```

        ## Common Workflow Patterns

        ### Feature Release

        1. Run tests
        2. Build artifacts
        3. Deploy to staging
        4. **Approval gate**
        5. Deploy to production
        6. Verify health checks

        ### Database Migration

        1. Backup database
        2. **Approval gate**
        3. Apply migration
        4. Verify data integrity
        5. **Approval gate** (rollback window)
        6. Mark complete

        ### Multi-Agent Coordination

        1. Agent A: Analyze codebase
        2. **Handoff** to Agent B
        3. Agent B: Implement changes
        4. **Approval gate**
        5. Agent C: Review and test

        ## Best Practices

        1. **Keep steps atomic**: Each step should do one thing
        2. **Add approval gates**: For irreversible operations
        3. **Include rollback steps**: Plan for failure
        4. **Log parameters**: Track what was deployed
        5. **Monitor events**: Audit trail is valuable

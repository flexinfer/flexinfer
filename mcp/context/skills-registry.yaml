  - name: loom-skill-builder
    categories: [development, scaffolding]
    common:
      description: |
        Scaffold and evolve cross-platform Loom skills from skills-registry.yaml, with explicit vendor-specific overrides where needed, then regenerate/sync so behavior is consistent across Codex, Claude, Kilocode, and Gemini.
      instructions: |
        # Loom Skill Builder

        Create new Loom skills quickly and consistently, then regenerate platform-specific outputs for all CLIs/apps.

        ## Quick Start

        Preview (default — no files written):
        - `python ${SKILL_PATH}/scripts/skill_scaffold.py --root . --name my-skill --description "When to use this skill" --categories workflow,automation`

        Apply (writes registry + creates directories):
        - `python ${SKILL_PATH}/scripts/skill_scaffold.py --root . --name my-skill --description "When to use this skill" --categories workflow,automation --apply`

        When `${SKILL_PATH}` is unavailable and `CODEX_HOME` is not exported, use the workspace-local path directly:
        - `python services/loom-core/.codex/skills/loom-skill-builder/scripts/skill_scaffold.py --root . --name my-skill --description "When to use this skill" --apply`

        ## What the Scaffold Script Does

        - Finds `skills-registry.yaml` (workspace-first)
        - Normalizes the skill name to kebab-case
        - Appends (or replaces with `--force`) a skill entry with sane cross-platform defaults:
          - codex=`skill`, claude=`command`, kilocode=`rule`, gemini=`skill`
        - Creates source directories:
          - `mcp/skills/<name>/scripts`
          - `mcp/skills/<name>/references`
          - `mcp/skills/<name>/assets/templates`
        - Updates registry `updated:` date

        ## Source Hygiene

        Keep the source skill tree clean before regeneration:
        - every file under `scripts/` with a shebang should be executable (`chmod +x`)
        - do not keep `__pycache__/`, `.pyc`, or other compiled artifacts under `mcp/skills/**`
        - validate all `scripts`, `references`, and `assets` paths from the registry before generating
        - after changing source assets, regenerate first, then sync profiles; do not hand-edit generated outputs

        ## End-to-End Workflow

        1. Scaffold the skill entry and directories:
           - `python ${SKILL_PATH}/scripts/skill_scaffold.py --root . --name <skill-name> --description "<when to use>" --apply`
        2. Edit `common.instructions` in `mcp/context/skills-registry.yaml`.
        3. Add optional reusable resources under `mcp/skills/<skill-name>/`.
        4. Wire resources in the skill entry:
           - `scripts`, `references`, `assets`, and optional `always_allow`.
        5. Add vendor-specific deltas only when required:
           - `targets.<platform>.instructions_append` for platform primitives/workarounds
           - keep `common.instructions` as the canonical workflow
        6. Validate registry:
           - `bin/loom generate skills --registry mcp/context/skills-registry.yaml --validate`
        7. Regenerate all platform outputs:
           - `bin/loom generate skills --target all --registry mcp/context/skills-registry.yaml --workspace . --codex-home ./.codex`
        8. Sync skills into home profiles:
           - `bin/loom sync skills all`
        9. If repo-local platform trees must be refreshed across the workspace:
           - `for profile in codex claude gemini kilocode opencode zed vscode antigravity; do bin/loom sync "$profile" --regen --hub-mode --all-projects --skip-worktrees; done`

        If `bin/loom` does not exist:
        - `cd services/loom-core && go build -o ./bin/loom ./cmd/loom`

        ## Design Guidelines

        - Keep descriptions trigger-oriented: clearly state when to use the skill.
        - Keep instruction body concise; move deep details to `references/`.
        - Design for repeatable outcomes, not advisory checklists only.
        - Use scripts for deterministic, repeatable steps.
        - Keep `always_allow` minimal and safe (read-only operations by default).
        - Prefer additive, non-breaking updates to existing skills.
        - Make codebase indexing/search and agent context explicit in engineering workflows.

        ## Done Criteria

        - New skill appears in `skills-registry.yaml`.
        - Generated outputs exist for at least codex/claude/kilocode and the appropriate Gemini artifact (`skills/<name>/SKILL.md` or `GEMINI.md`, depending on type).
        - Manifests include the new generated file paths (platform-specific).
        - At least one smoke check confirms the workflow behaves consistently in 2+ platforms.
      scripts:
        - name: skill_scaffold.py
          path: scripts/skill_scaffold.py
          description: Scaffold new skill registry entries and source directories
      references: []
      assets: []
      always_allow:
        - skill_scaffold.py
        # ^ Safe by default: runs --dry-run unless --apply is passed.

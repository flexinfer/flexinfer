  - name: roadmap-spec-ralph-loop
    categories: [workflow, planning]
    common:
      description: |
        Run a roadmap/spec execution loop ("RALPH") that repeatedly turns roadmap intent into shippable increments: review roadmap+specs, align on next slice, land implementation, prove quality/CI, and hand off context. Use for multi-session delivery programs and milestone-driven work.
      instructions: |
        # Roadmap Spec RALPH Loop

        RALPH is a repeatable loop for executing roadmap/spec work in stable increments.

        ## RALPH Phases

        - **R**eview: Read roadmap, active specs, and recent decisions
        - **A**lign: Select next slice with clear acceptance criteria
        - **L**and: Implement the smallest end-to-end increment
        - **P**rove: Run tests/lint/CI and validate behavior
        - **H**andoff/Harvest: Record outcomes, update plans, queue next slice

        ## Step 1: Review Inputs

        Read these first:
        - roadmap docs (`ROADMAP.md`, `docs/roadmap*`)
        - active specs (`.loom/20-product-spec.md`, `.loom/30-implementation-plan.md`, ADRs)
        - open decisions/questions from agent context recall

        Start agent context session for the loop:
        - `agent_session_start(namespace="<repo>/ralph-loop", description="Roadmap slice <milestone>")`
        - `agent_recall(query="<milestone> <spec area>", scope="context")`

        ## Step 2: Align Next Slice

        Produce one iteration plan with:
        - scope in/out
        - acceptance criteria
        - risk notes
        - dependency/blocker map
        - test plan

        Use `assets/templates/iteration-plan.md`.

        ## Step 3: Land Increment

        - implement one vertical slice only
        - prefer backward-compatible changes for mid-milestone safety
        - keep docs/spec deltas in the same PR when possible
        - record decisions immediately in agent context

        ## Step 4: Prove Quality

        - run targeted tests, then broader suite
        - run lint/static checks
        - run pre-commit if configured

        If failures appear, loop on fixes before moving to the landing procedure.

        ## Step 5: Landing Procedure

        1. **Stage scoped files** — only files for the active slice (never `.env`, credentials, or unrelated changes)
        2. **Commit with conventional format** — `feat(scope): <slice description>` + `Co-Authored-By` trailer
        3. **Push branch** — `git push origin <branch>` (`-u` if first push)
        4. **Create or reuse MR/PR** — check for existing MR on the same source branch first
        5. **Request auto-merge** when project policy allows
        6. **Poll pipeline to terminal state** — if red → fix → re-commit → re-push → re-poll
        7. **Confirm merged** or document blocker

        ## Step 6: Handoff and Harvest

        At the end of each slice:
        - update roadmap/spec progress markers
        - add agent-context summary entries (`decision`, `finding`, `question`)
        - close current task with `resolution`
        - create follow-up task for the next slice
        - release worktree if allocated: `agent_worktree_release(...)`
        - if switching agents, create a focused handoff package

        Use `assets/templates/slice-handoff.md` for consistent transfer notes.

        ## Exit Criteria for a Slice

        A slice is done only when:
        1. acceptance criteria are met
        2. tests/lint/pre-commit are clean (or exceptions documented)
        3. MR is merged or queued (not just pushed)
        4. roadmap/spec artifacts are updated
        5. agent context is summarized for the next loop

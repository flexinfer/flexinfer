      references: []
      assets: []
      always_allow: []
    targets:
      codex:
        enabled: true
        type: skill
        instructions_append: |
          ## Codex Sub-Agent Delegation

          Use Codex's native multi-agent system for parallel slice execution:

          ```toml
          # Each slice runs as a named agent thread
          [agents]
          max_threads = 6

          [agents.slice-1]
          description = "Implement <slice-1-goal>"
          ```

          - Use `spawn_agent` to launch each slice agent

  - name: review-response-loop
    categories: [workflow, development, collaboration]
    common:
      description: |
        Review response loop: turn PR/MR feedback into a prioritized fix list, apply the smallest corrections, verify locally, and close the review cycle with clear responses.
      instructions: |
        # Review Response Loop

        Use this when review feedback exists and the branch needs another clean pass before merge.

        ## Outcome

        Close the review cycle with:
        - normalized review findings
        - fixes applied or explicitly rebutted
        - local verification rerun
        - concise response summary for the reviewer

        ## Intake Sources

        - GitLab merge request discussions / notes
        - GitHub PR review comments
        - local review notes or inline findings
        - user-provided review bullets

        ## Loop

        1. **Collect all findings**
           - group duplicates and related comments
           - separate correctness issues from style or optional suggestions
        2. **Prioritize**
           - correctness / regression risk first
           - test gaps second
           - maintainability and naming after that
        3. **Map findings to code**
           - `codebase_memory__codebase_get_context`
           - `codebase_memory__codebase_get_references`
           - confirm the current code still matches the comment
        4. **Implement minimally**
           - fix only what the feedback requires
           - avoid turning a review pass into an opportunistic refactor
        5. **Re-verify**
           - rerun the narrowest meaningful local checks
           - escalate to `quality-gate-loop` when the review touches broader behavior
        6. **Respond clearly**
           - state what changed
           - if rejecting a suggestion, explain the concrete reason

        ## Landing After Review

        When all review findings are addressed and local verification passes:
        1. Commit fixes with conventional format: `fix(review): address <reviewer> feedback` + `Co-Authored-By` trailer
        2. Push the branch
        3. Proceed to `merge-readiness` → `ci-green-merge-loop` for the merge

        ## Rules

        - stale comments should be marked stale mentally before coding; do not "fix" already-resolved behavior
        - if a review reveals a missing test, add the test close to the fix
        - if feedback exposes a deeper defect, switch to `bugfix`

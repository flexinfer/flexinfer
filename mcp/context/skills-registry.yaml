  - name: commit
    categories: [workflow, development, git]
    common:
      description: |
        Ship scoped changes: stage files, commit with a conventional message, push the branch, monitor CI to terminal state, and fix failures. Use when the user says "ship it", "commit", "push this", or any variant of "land these changes".
      instructions: |
        # Commit & Ship

        Use this when code changes are ready to land. This is the shipping step — not a full dev workflow.

        ## Trigger Words

        Respond to: "ship it", "commit", "push this", "land it", "send it", "commit and push", or `/commit`.

        ## Steps

        1. **Assess what changed**
           - `git status` and `git diff --stat` to understand the scope
           - `git log --oneline -5` to match the repo's commit message style

        2. **Stage scoped files**
           - Stage only files related to the current task
           - Never stage `.env`, credentials, or large binaries
           - Prefer explicit file names over `git add -A`

        3. **Commit with a conventional message**
           - Format: `type(scope): description` (e.g., `fix(ci): expand race test exclusion`)
           - End with `Co-Authored-By: <agent> <noreply@anthropic.com>`
           - Use a HEREDOC for multi-line messages

        4. **Stamp agent provenance**
           - If using `git_commit` MCP tool: pass `agent_id` and `session_id` parameters
             to auto-add `Agent-ID` and `Agent-Session` git trailers
           - If committing via shell: append trailers manually:
             `--trailer "Agent-ID: <agent-id>" --trailer "Agent-Session: <session-id>"`
           - These trailers enable thread tracking and pipeline correlation in the HUD
           - The `agent_id` should match the agent's registered presence ID
           - The `session_id` should match the active agent-context session

        5. **Push the branch**
           - `git push origin <branch>` (with `-u` if first push)
           - Never force-push without explicit user approval

        6. **Monitor CI**
           - Poll the triggered pipeline to terminal state
           - GitLab: `gitlab__poll_pipeline` or `gitlab__pipeline_summary`
           - GitHub: `gh run watch` or `gh run list`
           - If red: diagnose → fix → re-commit → re-push → re-poll
           - If green: report success

        7. **Create or reuse MR/PR**
           - Check for existing MR on the same source branch before creating a new one; never create duplicates
           - GitLab: `gitlab__list_merge_requests(source_branch=..., target_branch=main)`
           - GitHub: `gh pr list --head <branch>`

        8. **Request auto-merge**
           - GitLab: `gitlab__merge_merge_request(auto_merge=true, sha=<HEAD>)`
           - GitHub: `gh pr merge --auto --squash`

        9. **Post-Merge Cleanup** (when applicable)
           - Delete remote branch: `git push origin --delete <branch>`
           - Release worktree if allocated: `agent_worktree_release(agent_id=..., worktree_id=..., remove_worktree=true)`
           - Delete local branch: `git branch -d <branch>`
           - End session if active: `agent_session_end(session_id=..., summarize=true)`

        Do not ask the user before committing, pushing, creating MRs, or merging.
        Only pause on failures, blockers, or when the user explicitly requests a stop.

        ## Safety

        - Never amend published commits without user approval
        - Never skip hooks (`--no-verify`) unless explicitly asked
        - Never push to main/master without confirmation
        - If pre-commit hooks fail, fix the issue and create a NEW commit

        ## When to Escalate

        - CI failures beyond the current change scope → `ci-failure-recovery`
        - Merge conflicts → ask user for resolution strategy
        - Branch protection rules blocking push → inform user

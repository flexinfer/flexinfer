  - name: frontend-ux-craft
    categories: [frontend, design, workflow]
    common:
      description: |
        Design and implement polished, consistent, and beautiful frontend experiences with strong UX judgment, accessible interaction states, responsive behavior, and an intentional visual language. Use when shaping new UI, upgrading rough interfaces, or pushing beyond functional-but-generic output.
      instructions: |
        # Frontend UX Craft

        Shape frontend work into interfaces that feel deliberate, usable, and visually cohesive instead of merely functional.

        ## Use This When

        - the user asks for frontend, UI, UX, visual polish, responsive cleanup, design-system alignment, or a stronger product feel
        - the feature works but feels generic, inconsistent, crowded, or hard to scan
        - the task needs both implementation and design judgment

        ## North Star

        - Preserve the existing design system when one already exists.
        - If no strong system exists, choose a clear visual direction before coding:
          - typography, spacing rhythm, color story, component shapes, motion, and copy tone should reinforce one another
        - Optimize for clarity first, delight second, ornament last.
        - Always cover loading, empty, error, hover, focus, active, and disabled states.
        - Ensure the result works on mobile and desktop.

        ## Core Workflow

        1. Read the surface before rewriting it.
           - Identify the user goal, primary action, constraints, and current confusion points.
           - Inventory existing tokens, patterns, and reusable components so improvements stay coherent.
        2. Establish a design direction.
           - Define or reuse CSS variables / tokens.
           - Set type scale, spacing rhythm, containers, elevation, border treatment, and motion rules.
           - Choose a single visual thesis instead of mixing styles.
        3. Implement the experience, not just the happy path.
           - Handle hierarchy, copy, affordances, feedback, edge states, and accessibility semantics.
           - Avoid AI-slop defaults: generic card grids, flat white pages, random gradients, and interchangeable typography.
           - Use purposeful motion, not decorative noise.
        4. Review the result in context.
           - If the app can run locally, capture screenshots with `browserkit-screenshots`.
           - Compare before/after for hierarchy, density, spacing, contrast, and action clarity.
        5. Close with proof.
           - Summarize the visual direction, key UX improvements, and verification performed.
           - Call out any intentionally deferred polish as explicit follow-up work.

        ## Output Expectations

        - A brief visual-direction statement
        - A concrete implementation slice
        - Evidence of responsive, accessibility, and state coverage

        ## Handoff to Implementation

        When design direction is established and ready to build:
        - Use `feature-dev` for multi-file frontend implementation
        - Use `small-change-loop` for targeted CSS/component tweaks
        - Each implementation slice follows the standard Landing Procedure (commit → MR → CI → merge)

        ## References / Templates


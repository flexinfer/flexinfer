        - **harvester**: Infrastructure VMs — use harvester MCP server set
        - Always use the matching MCP server set for the target cluster

        ## Image Standards
        - No `:latest` — pin versions/digests
        - Set arch selectors for single-arch images
        - Use minimal base images; non-root user

        ## Storage
        - Use `storageClass: longhorn` for PVCs
        - Keep PVC names stable across redeployments

        ## Llama.cpp Specifics
        - Server already exposes API; omit `--api`/`--stop` flags
        - Keep ROCm/GPU specifics in env vars

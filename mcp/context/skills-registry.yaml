  - name: incident-response
    categories: [operations, kubernetes]
    common:
      description: |
        Incident response workflow: triage, investigate, mitigate, verify, and preserve context/handoff for production issues across k3s and harvester clusters.
      instructions: |
        # Incident Response

        Structured workflow for production incidents across k3s + Harvester, with GitOps-first recovery and explicit containment/rollback gates.

        ## Response Contract

        - Open/update agent context session at incident start.
        - Track one explicit incident task with severity and owner.
        - Keep an incident timeline (UTC timestamps + actions).
        - Distinguish temporary containment from durable GitOps fix.
        - End with root cause, resolution, and follow-up actions.

        ## Phase 1: Triage

        1. **Assess scope**: Single pod, service, node, or cluster-wide?
        2. **Check dashboards**: `grafana_list_alerts` for active alerts
        3. **Check Alertmanager**: `am_list_alerts` for firing alerts
        4. **Check pods**: `k8s_getPods` across relevant namespaces
        5. **Severity**: P1 (outage) / P2 (degraded) / P3 (non-critical) / P4 (minor)
        6. **GitOps ownership**: identify source manifests before mitigation

        ## Phase 2: Investigate

        1. **Logs**: `loki_query_range` for affected services
        2. **Metrics**: `query_range` for resource usage, error rates
        3. **Recent changes**: `flux_events`, `git_log` for platform/gitops, `helm_history`
        4. **Infrastructure**: `k8s_get_nodes`, `harvester_vms_list`, `router_status`
        5. **Flux status**: `flux_get_kustomizations`, `flux_get_sources`

        ## Phase 3: Mitigate

        - **Restart**: `k8s_delete_pods_by_phase` for crashing pods
        - **Scale up**: `k8s_scale_deploy` to add capacity
        - **Rollback Helm**: check `helm_history`, rollback to last good release
        - **Suspend Flux**: `flux_suspend` to stop problematic reconciliation
        - **Network**: `router_wanStatus` for connectivity issues
        - **Harvester VM stuck Running**: delete VMI to force recreation (`kubectl --kubeconfig .kube/harvester-admin.yaml -n default delete vmi <vm-name>`)

        Containment rule:
        - If live change is applied, open immediate follow-up to mirror in `platform/gitops` before incident closure.

        ### Safe Rollback
        1. Identify last known good state
        2. Revert Git changes and push
        3. `flux_reconcile` the affected kustomization
        4. Verify rollback successful

        ## Phase 4: Resolve

        1. Confirm service restored
        2. Monitor for recurrence
        3. Remove temporary mitigations
        4. Resume suspended Flux: `flux_resume`
        5. Update incident task status with final resolution
        6. Capture before/after evidence snapshots

        ## Phase 5: Postmortem

        Record in agent context:
        - **Timeline**: Sequence of events with timestamps
        - **Root cause**: What caused the incident
        - **Resolution**: What fixed it
        - **Impact**: Users/services affected, duration
        - **Action items**: Preventive measures with owners

        Useful local runbooks (repo):
        - `docs/runbooks/widespread-vm-cluster-recovery.md`
        - `docs/runbooks/longhorn-replica-directory-missing.md`
        - `docs/runbooks/qdrant-vm-recovery.md`

        If unresolved at handoff time:
        - create explicit blocker notes
        - package a handoff with current state, hypotheses, and exact next probe

        ## Workflow Automation

        For structured execution with session tracking and approval gates:

        ```
        agent_workflow_start(definition_id="incident-response", input={
          namespace: "incidents/INC-2024-042",
          agent_id: "claude-code",
          incident_id: "INC-2024-042",
          symptoms: "HTTP 503 on /api/users, p99 latency > 5s",
          affected_service: "user-service",
          severity: "P2"
        })
        ```

        Workflow file: `.agents/workflows/incident-response.yaml`
      scripts: []
      references: []
      assets: []
      always_allow: []
    targets:
      codex:
        enabled: true
        type: skill
      claude:
        enabled: true
        type: command
      kilocode:
        enabled: true
        type: workflow
      gemini:
        enabled: true
        type: skill
      antigravity:
        enabled: true
        type: command

  - name: devbox-sandbox
    categories: [dev-environment, quality]
    common:
      description: |
        Use devbox sandbox for running builds, tests, lints, and installs in isolated containers.
        Prefer devbox_exec over direct shell commands for any operation that modifies dependencies
        or produces build artifacts. Required for K8s backend where sandbox pods run on K3s cluster.
      instructions: |
        # Devbox Sandbox

        Run builds, tests, and installs inside isolated project containers.

        ## When to Use

        **Always use devbox** for:
        - `npm install`, `pip install`, `cargo build`, `go build ./...`, `make build`
        - Any command that modifies node_modules, venv, or other dependency directories

        **Prefer devbox** for:
        - `go test`, `pytest`, `npm test`, `make test`, `make lint`, `cargo test`
        - Any command that might fail and leave the host in a dirty state

        ## Required Tools

        | Tool | Purpose |
        |------|---------|
        | `devbox_exec` | Run a command in the sandbox (auto-builds if needed). Supports `retry` param (max 3) for infrastructure failures. |
        | `devbox_quality_gate` | Run fmt → lint → test with language auto-detection and structured JSON output |
        | `devbox_build` | Pre-build the sandbox image |
        | `devbox_status` | Check sandbox status |
        | `devbox_stop` | Stop a running sandbox |

        ## Quality Gate

        Use `devbox_quality_gate` instead of manual `devbox_exec` calls for quality verification:
        ```
        devbox_quality_gate(project="loom-core", agent_id="claude-code")
        ```
        Returns structured JSON: `{language, passed, checks: [{name, passed, exit_code, duration_ms, output_tail}], total_duration_ms}`.
        Auto-detects language (go, python, node, rust) and runs appropriate fmt/lint/test commands.
        Includes retry=1 per check for infrastructure resilience. Supports `fail_fast` (default: true)
        and custom `checks` array (e.g., `["test"]` to skip fmt/lint).

        ## Recommended Tools

        | Tool | Purpose |
        |------|---------|
        | `devbox_exec_async` | Long-running commands (>2min) |
        | `devbox_exec_poll` | Poll async exec status |
        | `devbox_read_file` | Read files from sandbox |
        | `devbox_write_file` | Write files to sandbox |
        | `devbox_detect` | Detect project environment fingerprint (languages, deps, tools) |
        | `devbox_metrics` | Prometheus metrics for sandbox operations |
        | `devbox_summary` | Aggregated sandbox summary for HUD display |

        ## K8s Backend

        When `DEVBOX_BACKEND=k8s`, sandbox pods run on the K3s cluster instead of local Docker.
        The workspace is shared via NFS PVC (`devbox-workspace-nfs`).

        - Pods get `devbox/agent-id` label from the `agent_id` parameter
        - Pods target amd64 nodes via `nodeSelector`
        - Images are pulled from `registry.harbor.lan` via `harbor-creds` secret

        ## Agent ID

        Pass `agent_id` to `devbox_exec`, `devbox_build`, and `devbox_exec_async` so the
        sandbox pod is labeled with the owning agent. This enables HUD tracking and prevents
        reaper conflicts in multi-agent scenarios.

        ```
        devbox_exec(project="loom-core", command="make test", agent_id="claude-code")
        ```

        ## Async Exec for Long Tasks

        For commands that take more than 2 minutes, use async exec:

        ```
        result = devbox_exec_async(project="loom-core", command="make build-all", agent_id="claude-code")
        # Later:
        devbox_exec_poll(exec_id=result.exec_id)
        ```
      scripts: []
      references: []
      assets: []
      always_allow: []
    targets:
      codex:
        enabled: true
        type: instruction
      claude:
        enabled: true
        type: rule
      gemini:
        enabled: true
        type: instruction
      antigravity:
        enabled: true
        type: rule

  - name: backlog-delivery-loop
    categories: [workflow, development, ci-cd]
    common:
      description: |
        Run a full implementation loop from highest-priority backlog item to green CI: context recall, implementation, hooks/tests/lint, commit/push, CI watch/fix, and durable handoff-ready reporting.
      instructions: |
        # Backlog Delivery Loop

        Use this when you want a consistent, CLI-agnostic "pick top item and ship to green" flow without extra prompting.

        ## Loop Outcome

        Deliver one high-priority backlog item with:
        - code merged/pushed
        - hooks + tests + lint passing
        - CI status verified
        - agent-context entries + task updates complete

        ## Step 1: Pick Highest-Priority Item

        Discover backlog source in this order:
        1. Jira (`jira_search`) if project uses Jira
        2. GitLab issues (`gitlab.list_issues`) if repo uses GitLab
        3. GitHub issues (`github.list_issues`) if repo uses GitHub
        4. Fallback to local backlog docs (`ROADMAP.md`, `docs/roadmap*`, `.loom/*.md`)

        Selection rule:
        - choose the highest-priority open item that is not blocked
        - if priority ties, choose oldest updated item
        - if still tied, choose smallest scoped item for fastest value

        ## Step 1.5: Branch Isolation (Worktree)

        Create an isolated worktree for this backlog item:
        - call `agent_worktree_allocate(agent_id=<id>, session_id=<session>, branch_name="backlog/<item-id>", base_branch="main", purpose="Deliver <item-id>")`
        - work exclusively in the returned `worktree_path`
        - this prevents dirty-worktree conflicts with other agents or pre-existing changes
        - the worktree is automatically cleaned up when the session ends (TTL/orphan reconciler)

        ## Step 2: Start Agent Context Session

        Use `mcp-agent-context` before coding:
        - `agent_session_start(namespace="<repo>/backlog-loop", description="Deliver <item-id>")`
        - `agent_recall(query="<item-id> <topic>", scope="context")`
        - `agent_task_add(...)` with explicit title/context/priority/file_path/tags
        - `agent_task_update(..., status="in_progress")`
        - `agent_presence_register(...)` + periodic `agent_presence_heartbeat(...)`

        ## Step 3: Implement Vertical Slice

        - confirm acceptance criteria from backlog ticket/spec
        - implement smallest complete slice first
        - keep edits scoped; avoid unrelated refactors
        - record key decisions/finding entries as you go (`agent_context_add`)

        ## Step 4: Verify Locally (Hooks Are Mandatory)

        Run checks in this order:
        1. repository hooks (`pre-commit run -a` if configured)
        2. targeted tests for touched package/module
        3. broader suite (`go test ./...`, `npm test`, `pytest`, etc.)
        4. lint (`golangci-lint run`, `eslint`, etc.)

        Optional helper:
        - `bash ${SKILL_PATH}/scripts/verify_local_loop.sh`

        If any check fails, fix and rerun before committing.

        Verification is not optional and not deferred to CI.

        ## Step 4.5: Dirty Worktree Baseline (Non-Blocking)

        If using a worktree from Step 1.5, the worktree starts clean and this step is unnecessary.

        Fallback for agents that skip worktree allocation:
        - treat pre-existing changes as baseline context (not a blocker)
        - continue on the current branch/worktree by default
        - stage/commit only files for the selected backlog item
        - ask for direction only when new unexpected changes appear in files you edit, or when branch/worktree switching is required

        ## Step 5: Landing Procedure

        Unless the user explicitly requests "no commit/push":

        1. **Stage scoped files** — only files for the selected backlog item (never `.env`, credentials, or unrelated changes)
        2. **Commit with conventional format** — `type(scope): description` + `Co-Authored-By` trailer; include issue reference if required by project policy
        3. **Push branch** — `git push origin <branch>` (`-u` if first push)
        4. **Create or reuse MR/PR**
           - Check for existing MR on the same source branch before creating a new one
           - GitLab: `gitlab__list_merge_requests(source_branch=..., target_branch=main)`
           - GitHub: `gh pr list --head <branch>`
        5. **Request auto-merge** (when project policy allows)
           - GitLab: `gitlab__merge_merge_request(auto_merge=true, sha=<HEAD>)`
           - GitHub: `gh pr merge --auto --squash`

        ## Step 6: Watch CI to Terminal State

        Prefer MCP APIs over manual polling:
        - GitLab: `list_pipelines` + `pipeline_summary` or `poll_pipeline`
        - GitHub: inspect PR/commit checks through repo tooling or configured MCP path

        Optional helper:
        - `bash ${SKILL_PATH}/scripts/verify_ci_loop.sh --provider auto --ref <branch>`
        - Override provider explicitly when needed:
          - `--provider gitlab --project <group/project>`
          - `--provider github --repo <owner/repo>`

        CI loop:
        1. find the latest pipeline for the pushed branch
        2. run to terminal state
        3. if failed, inspect logs/tests
        4. implement minimal fix
        5. rerun local hooks/tests/lint
        6. push and repoll
        7. repeat until green or blocked

        If blocked by external dependency:
        - update task status to `blocked` with concrete blocker details
        - publish a short handoff note with exact next action

        If in a sandboxed multi-agent environment, prefer devbox tools for builds/tests.

        ## Step 7: Confirm Merged + Report + Session Close

        - confirm MR is merged or queued in merge train
        - update backlog ticket with summary and links
        - `agent_task_update(..., status="completed", resolution="...")`
        - add final `decision`/`note` in agent context
        - release worktree if allocated: `agent_worktree_release(...)`
        - `agent_session_end(summarize=true)`

        Use `assets/templates/status-report.md` for consistent completion reporting.
      scripts:
        - name: verify_local_loop.sh
          path: scripts/verify_local_loop.sh
          description: Run pre-commit/hooks plus language-aware local verification commands
        - name: verify_ci_loop.sh
          path: scripts/verify_ci_loop.sh
          description: Auto-detect GitLab/GitHub for a repo and poll CI to terminal state with failure summary
      references:
        - workflow.md
      assets:
        - templates/status-report.md
        - templates/task-selection.md
      always_allow:
        - verify_local_loop.sh
        - verify_ci_loop.sh
    targets:
      codex:
        enabled: true
        type: skill
        instructions_append: |
          ## Codex Notes
          - Use `multi_tool_use.parallel` for concurrent backlog source queries (Jira, GitLab, GitHub)
          - Use `spawn_agent` for parallel implementation when multiple items are selected
      claude:
        enabled: true
        type: command
        output_format: markdown
        instructions_append: |
          ## Claude Code Notes
          - Use `Task` tool with `subagent_type="Explore"` for parallel backlog source queries
          - Delegate CI polling to a background `Task` agent when waiting
      kilocode:
        enabled: true
        type: workflow
        instructions_append: |
          ## Kilocode Notes
          - This workflow maps to `.kilocode/workflows/backlog-delivery-loop.yaml`
          - Use staged phases with checkpoints between selection and implementation
      gemini:
        enabled: true
        type: skill
        instructions_append: |
          ## Gemini Notes
          - Use checkpointed phased decomposition for the delivery loop
          - Record progress markers between major steps for resumability
      antigravity:
        enabled: true
        type: command
        output_format: markdown

  - name: tech-debt-planning
    categories: [workflow, planning]
    common:
      description: |
        Plan and prioritize technical debt: inventory debt items, score impact/risk/effort, produce a sequenced remediation plan, and track decisions and follow-up tasks.
      instructions: |
        # Tech Debt Planning

        Build an evidence-backed, prioritized technical debt plan with explicit sequencing and backlog-ready slices.

        ## Loop Outcome

        Produce:
        - normalized debt inventory
        - deterministic priority ranking
        - wave-based remediation plan
        - backlog-ready implementation slices

        ## Step 1: Gather Debt Signals

        Pull evidence from:
        - code markers: `rg -n "TODO|FIXME|HACK|XXX" --glob '!vendor/**' .`
        - flaky/failing tests and CI instability
        - recurring incidents / on-call pain points
        - performance bottlenecks and high-change hotspots

        Avoid "opinion-only" debt items; every item should include observed impact.

        ## Step 2: Normalize Inventory

        Use `assets/templates/debt-inventory.md` and capture each candidate debt item with:
        - system/component ownership
        - evidence and user/business impact
        - risk if deferred
        - estimated effort (S/M/L or points)
        - proposed acceptance criteria

        ## Step 3: Score Deterministically

        Convert inventory to JSON and score with:
        - `python ${SKILL_PATH}/scripts/debt_score.py --input <inventory.json> --output <priority.md>`

        Use this weighted model:
        - impact: 35%
        - risk reduction: 30%
        - delivery drag reduction: 20%
        - effort (inverse): 15%

        Keep raw inputs and computed scores so ranking decisions are auditable.

        ## Step 4: Build Remediation Waves

        Use `assets/templates/debt-plan.md` to produce:
        - Wave 1 (quick wins/high leverage)
        - Wave 2 (medium effort / high risk-reduction)
        - Wave 3 (strategic refactors requiring coordination)

        Each wave should include dependencies, constraints, and explicit "not in this wave" scope.

        ## Step 5: Publish Backlog-Ready Slices

        Turn each selected debt item into an implementation-ready backlog unit:
        - clear problem statement
        - acceptance criteria
        - test/verification strategy
        - rollback/safety notes

        ## Step 6: Record Decisions and Tasks

        Persist planning context:
        - `agent_session_start(namespace="<repo>/tech-debt-planning", description="Debt planning cycle")`
        - `agent_context_add(entry_type="decision" | "finding", ...)`
        - `agent_task_add(...)` for follow-up execution items
      scripts:
        - name: debt_score.py
          path: scripts/debt_score.py
          description: Rank debt items from JSON inventory with weighted scoring
      references:
        - planning-workflow.md
      assets:
        - templates/debt-inventory.md
        - templates/debt-plan.md
      always_allow:
        - debt_score.py
    targets:
      codex:
        enabled: true
        type: skill
      claude:
        enabled: true
        type: command
        output_format: markdown
      kilocode:
        enabled: true
        type: rule
      gemini:

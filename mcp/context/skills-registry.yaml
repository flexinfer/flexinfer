  - name: merge-readiness
    categories: [workflow, ci-cd, quality]
    common:
      description: |
        Merge readiness loop: confirm the branch diff, local validation, CI state, review status, and release notes/docs so a merge can happen without surprise follow-up churn.
      instructions: |
        # Merge Readiness

        Use this right before asking for merge or performing merge/deploy work.

        ## Outcome

        Produce a merge-ready verdict:
        - ready now
        - ready after one concrete fix
        - not ready, with blockers

        ## Checklist

        1. **Diff sanity**
           - inspect staged or branch diff
           - confirm the change scope still matches the task
           - remove accidental unrelated edits
        2. **Local validation**
           - ensure required hooks/tests/lint/build checks were rerun after the last meaningful edit
           - use `quality-gate-loop` if this is uncertain
        3. **CI status**
           - `gitlab__pipeline_summary` / `gitlab__poll_pipeline`
           - or the equivalent GitHub checks view
        4. **Review status**
           - unresolved comments?
           - requested changes still open?
           - ownership/approval requirements satisfied?
        5. **Operational/doc impact**
           - docs/spec/changelog updated when the change affects usage or rollout
           - follow-up tasks created for deliberate omissions

        ## Session Tracking

        Record the readiness verdict:
        - `agent_context_add(entries=[{entry_type: "finding", title: "Merge readiness: <verdict>", content: "..."}])`

        ## Decision Rule

        - merge only if there are no unresolved correctness concerns and the latest required checks are green
        - if CI is the only blocker, switch to `ci-failure-recovery`
        - if the diff no longer matches the requested scope, tighten it before merge instead of explaining it away
        - when ready: proceed to `ci-green-merge-loop` for the actual merge execution

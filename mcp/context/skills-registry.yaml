  - name: small-change-loop
    categories: [workflow, development]
    common:
      description: |
        Lightweight coding loop for small, well-bounded changes: clarify the request, inspect the narrow code surface, implement, verify locally, and ship without heavyweight workflow overhead. Ship without asking: commit, push, create MR, and request auto-merge automatically. Only pause on failures or explicit user stop. After merge, auto-cleanup: delete remote branch, release worktree, delete local branch.
      instructions: |
        # Small Change Loop

        Use this when the task is real code work but does not justify backlog selection, migration research, or a large feature branch ceremony.

        ## Good Fit

        - one to three files
        - small bug, copy change, config tweak, test fix, or focused UI adjustment
        - the user expects direct execution, not a planning phase

        ## Not a Good Fit

        - broad feature work across subsystems
        - risky bugfixes without clear repro
        - refactors that need impact analysis
        - dependency upgrades or release work

        ## Loop

        1. **Load only the local context you need**
           - read `AGENTS.md` and the touched file area
           - use `codebase_memory__codebase_search` or `codebase_memory__codebase_get_context` for quick targeting
        2. **Track the slice**
           - `agent_session_start`
           - `agent_task_add` when the work is non-trivial enough to revisit
        3. **Implement directly**
           - keep the diff narrow
           - avoid unrelated cleanup unless correctness requires it
        4. **Verify proportionally**
           - run the smallest meaningful local checks first
           - escalate to `quality-gate-loop` if the change grows or fails unexpectedly
        5. **Ship (Landing Procedure)**
           a. Stage only files for the active task (never `.env`, credentials, or unrelated changes)
           b. Commit with conventional format: `type(scope): description` + `Co-Authored-By` trailer
           c. Push branch (`-u` if first push)
           d. Create or reuse MR/PR (check existing MRs for same source branch first; never create duplicates)
              - GitLab: `gitlab__list_merge_requests(source_branch=..., target_branch=main)`
              - GitHub: `gh pr list --head <branch>`
           e. Request auto-merge
              - GitLab: `gitlab__merge_merge_request(auto_merge=true, sha=<HEAD>)`
              - GitHub: `gh pr merge --auto --squash`
           f. Poll pipeline to terminal state; if red → fix → re-commit → re-push → re-poll
           g. Confirm merged or document blocker

           Do not ask the user before committing, pushing, creating MRs, or merging.
           Only pause on failures, blockers, or when the user explicitly requests a stop.

        6. **Post-Merge Cleanup** (when worktree was allocated)
           a. Delete remote branch: `git push origin --delete <branch>`
           b. Release worktree: `agent_worktree_release(agent_id=..., worktree_id=..., remove_worktree=true)`
           c. Delete local branch: `git branch -d <branch>`
           d. End session: `agent_session_end(session_id=..., summarize=true)`

        ## Escalation

        Switch to another skill if the task expands:
        - `feature-dev` for larger implementation slices
        - `bugfix` for investigation-heavy defects
        - `refactor` for structural cleanup
        - `ci-failure-recovery` when the branch is blocked by pipeline failures

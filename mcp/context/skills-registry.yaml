        # Workspace Daily Sweep

        Use this for a quick start-of-day or before-shipping health pass across the local loom workspace.

        ## Outcome

        Produce a short sweep report with:
        - config/skill sync drift
        - daemon/HUD health
        - dirty repos or stale worktrees
        - active agents, blocked tasks, or coordination pressure
        - immediate actions worth taking today

        ## Session Tracking


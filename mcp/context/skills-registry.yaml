  - name: testing-guidelines
    categories: [testing, quality]
    common:
      description: |
        Universal testing instructions: test commands by language (Go, Python, TypeScript, Rust), coverage requirements, pre-commit checklist, and CI/CD stage expectations.
      instructions: |
        # Testing Guidelines

        Universal testing instructions for AI coding agents working in this workspace.

        ## Test Commands by Language

        ### Go
        ```bash
        go test ./...                           # Run all tests
        go test -v ./path/to/pkg                # Verbose output for specific package
        go test -race ./...                     # With race detector
        go test -cover ./...                    # With coverage
        go test ./path -run TestName -v         # Single test
        ```

        ### Python
        ```bash
        pytest tests/                           # Run all tests
        pytest tests/test_file.py -v           # Specific file
        pytest tests/test_file.py::test_func   # Single test
        pytest --cov=src tests/                # With coverage
        ```

        ### TypeScript/Node.js
        ```bash
        npm test                                # Run all tests
        npm test -- --watch                     # Watch mode
        npm test -- tests/file.test.ts         # Specific file
        ```

        ### Rust
        ```bash
        cargo test                              # Run all tests
        cargo test test_name                    # Single test
        cargo test -- --nocapture               # Show print output
        ```

        ## Test Coverage Requirements

        - New features: >80% coverage
        - Bug fixes: Must include regression test
        - Refactors: Maintain existing coverage

        ## Before Committing

        1. Run tests locally: `make test` or language-specific command
        2. Check for linting errors: `make lint`
        3. Verify no sensitive data in test fixtures

        ## CI/CD Notes

        All projects use GitLab CI with these standard stages:
        - `lint` - Code style checks
        - `test` - Unit and integration tests
        - `build` - Compile/bundle
        - `publish` - Deploy (manual, on tags)

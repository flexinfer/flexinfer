    common:
      description: |
        Fast repository intake loop: establish repo context, current state, available loom/MCP capabilities, and the likely execution path before making changes.
      instructions: |
        # Repo Intake

        Use this at the start of a session when the repo or task context is not fully loaded.

        ## Outcome

        Produce a compact intake summary covering:
        - repository purpose and conventions
        - current git/worktree state
        - available loom/MCP capabilities
        - likely code areas involved
        - recommended next workflow (`feature-dev`, `bugfix`, `research`, `small-change-loop`, etc.)

        ## Intake Sequence

        1. **Read local repo instructions first**
           - `AGENTS.md`
           - `README*`
           - task-specific docs (`ROADMAP.md`, `.loom/*.md`, `docs/**`) when present
        2. **Check repo state**
           - `git status`
           - active branch / worktree
           - note pre-existing changes as baseline context, not an automatic blocker
        3. **Start or resume context**
           - `agent_session_start`
           - `agent_recall(query="<repo> <task>")`
           - `agent_presence_register`
        4. **Verify codebase search readiness**
           - `codebase_memory__codebase_stats`
           - if missing/stale: `codebase_memory__codebase_index_start` + `codebase_memory__codebase_index_poll`
        5. **Map the likely surface area**
           - `codebase_memory__codebase_search`
           - `codebase_memory__codebase_get_definition`
           - `codebase_memory__codebase_get_context`
        6. **Inventory operational tooling if relevant**
           - `loom sync status`

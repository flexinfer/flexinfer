                    properties: { method: "GetUser" }
                }
            ]
        )
        ```

        ## Best Practices

        1. **Tag consistently**: Use domain tags (auth, database, api)
        2. **Record the "why"**: Not just what code does, but why it matters
        3. **Link symbols**: Record `code_context` entries for key functions
        4. **Use structured codebase queries**: search/definition/references/context before ad-hoc scans

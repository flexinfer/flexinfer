  - name: entropy-reduction-protocol
    categories: [workflow, quality, coordination]
    common:
      description: |
        Reduce agent drift and execution entropy by forcing tight scopes, explicit assumptions, checkpointed progress, and small verified loops. Use when work is sprawling, underspecified, or vulnerable to context-window thrash.
      instructions: |
        # Entropy Reduction Protocol

        Keep agent work tight, cumulative, and recoverable when tasks are ambiguous, large, or easy to derail.

        ## Use This When

        - the task is sprawling, underspecified, or multi-step
        - context-window pressure is rising and the work is starting to thrash
        - multiple tempting paths exist and we need disciplined convergence
        - the user wants fewer surprises and more deliberate execution

        ## Operating Rules

        - Hold one primary objective at a time.
        - Keep a visible working set: goal, constraints, touched files, next action, verification plan, and exit criteria.
        - Prefer the smallest reversible change that proves direction.
        - Close or capture every open loop; do not carry fuzzy state in memory alone.
        - Escalate only at real decision boundaries with non-obvious consequences.

        ## Core Workflow

        1. Compress the objective.
           - Rewrite the task as one sentence and one shippable slice.
        2. Build the working set.
           - Record known facts, assumptions, files in play, verification steps, and stop condition.
        3. Execute in micro-cycles.
           - Inspect narrowly.
           - Edit narrowly.
           - Verify immediately.
           - Summarize the delta before expanding scope again.
        4. Run drift checks whenever progress stalls.
           - What am I doing right now?
           - Why does it serve the objective?
           - What can be deleted, deferred, or explicitly tracked instead?
        5. Externalize state.
           - Use plan/progress primitives and agent context when available.
           - Record decisions, follow-ups, and unresolved questions instead of relying on memory.
        6. Finish cleanly.
           - State what changed, what was verified, and what remains uncertain.

        ## Anti-Entropy Guardrails

        - Avoid parallel speculative edits across unrelated files.
        - Do not mix refactor, feature, and cleanup work unless correctness requires it.
        - Do not reopen settled decisions without new evidence.
        - When new work appears, either capture it as follow-up or consciously swap goals.

        ## Handoff to Implementation

        Once scope is compressed and direction is clear:
        - Use `small-change-loop` for the narrowest possible slice
        - Use `feature-dev` for multi-file implementation
        - Each implementation slice follows the standard Landing Procedure (commit → MR → CI → merge)

        ## References / Templates

        - Protocol notes: `references/protocol.md`
        - Drift signals: `references/drift-signals.md`
        - Working set template: `assets/templates/working-set.md`
        - Checkpoint log template: `assets/templates/checkpoint-log.md`
      scripts: []
      references:
        - protocol.md
        - drift-signals.md
      assets:
        - templates/working-set.md
        - templates/checkpoint-log.md
      always_allow: []

  - name: long-term-memory
    categories: [memory, decisions, agents]
    common:
      description: |
        Manage long-term agent memory with explicit tiered storage and recall. Use for preserving important knowledge beyond individual sessions and building institutional memory.
      instructions: |
        # Long-Term Memory Management

        Build and maintain persistent knowledge that survives across sessions and agents.

        ## Memory Tiers

        The agent memory system has three tiers:

        | Tier | Retention | Use Case |
        |------|-----------|----------|
        | **Working** | Session only | Current task context |
        | **Short-term** | Days | Recent important findings |
        | **Long-term** | Indefinite | Core knowledge, decisions |

        ## Adding Memories

        ### Add to Working Memory

        ```
        agent_memory_add(
            session_id="...",
            items=[
                {
                    title: "Preferred coding style",
                    content: "User prefers functional programming style",
                    category: "preference",
                    tier: "working",
                    importance: "high",
                    tags: ["coding-style", "user-preference"]
                }
            ]
        )
        ```

        ### Memory Categories

        Suggested categories:
        - `decision`: Architecture and implementation choices
        - `preference`: User/project preferences
        - `pattern`: Recurring practices and anti-patterns
        - `context`: Domain or codebase background
        - `task`: Task-specific reminders that should outlive one session

        ## Persisting Durable Memories

        Write important memories directly into long-term tier:

        ```
        agent_memory_add(
            session_id="...",
            items=[
                {
                    title: "Auth migration decision",
                    content: "Moved token verification into gateway middleware for consistency across services.",
                    category: "decision",
                    tier: "long_term",
                    importance: "high",
                    tags: ["auth", "architecture"]
                }
            ]
        )
        ```

        ## Recalling Memories

        ### Basic Recall

        ```
        agent_recall(
            query="coding style preferences",
            scope="memory",
            memory_categories=["preference", "pattern"],
            memory_tiers=["short_term", "long_term"],
            token_budget=3000
        )
        ```

        ### Contextual Recall

        ```
        agent_recall(
            query="error handling patterns",
            session_id="...",
            scope="memory",
            memory_categories=["pattern", "decision"],
            memory_tiers=["working", "short_term", "long_term"],
            token_budget=2500
        )
        ```

        ## Memory Lifecycle

        Keep lifecycle explicit with retention audits and deletes:

        ### Delete Memories

        Remove obsolete memories:

        ```
        agent_memory_delete(
            item_ids=["mem-wrong"],
            confirm=true
        )
        ```

        ## Memory Policies

        ### Get Current Policy

        ```
        agent_memory_policy_get(tier="working")
        → Returns retention rules, compression settings
        ```

        ## Memory Statistics

        ```
        agent_memory_stats()
        → Returns counts by tier, total tokens, oldest/newest
        ```

        ## Best Practices

        1. **Persist important memories directly**: Write key items to `long_term`
        2. **Use appropriate types**: Helps with targeted recall
        3. **Tag consistently**: Enables filtered queries
        4. **Review long-term**: Occasionally audit for relevance
        5. **Set importance scores**: Guides retrieval priority
        6. **Include context**: Why is this memory important?

    common:
      description: |
        Documentation style guide for source-backed technical writing: templates, structure, architecture diagrams, changelog discipline, and documentation QA.
      instructions: |
        # Documentation Style Guide

        ## Principles

        - **Comprehensive**: Cover all aspects thoroughly
        - **Structured**: Logical organization and flow
        - **Accurate**: Keep synchronized with implementation
        - **Discoverable**: Easy to find and navigate
        - **Practical**: Include real-world examples

        ## Documentation Hierarchy

        ```
        Level 1: README.md (Project Overview)
        Level 2: docs/index.md (Documentation Hub)
        Level 3: Category Documentation (API, Architecture, Operations)
        Level 4: Detailed Guides and References
        ```

        ## Standard Templates

        - **Service docs**: Overview, Architecture, API Reference, Configuration, Operations, Troubleshooting
        - **Runbook**: Purpose, Prerequisites, Procedures (step-by-step), Rollback, Contacts
        - **ADR**: Status, Context, Decision, Consequences
        - **API Reference**: Endpoints, Parameters, Response codes, Examples

        ## Architecture Documentation

        - Use Architecture Decision Records (ADRs) for significant choices
        - C4 model diagrams (Context, Containers, Components)
        - Use Mermaid for inline diagrams (sequence, flowchart, class)

        ## Writing Style

        - Use active voice and present tense
        - Keep sentences concise (under 25 words)
        - Use code blocks with language hints for all examples
        - Include expected output for commands
        - Mark assumptions explicitly and separate them from verified facts

        ## Evidence Requirements

        - For non-trivial claims, include one of:
          - workspace file reference with line number
          - exact command used to validate behavior
          - canonical URL for external fact
        - Prefer reproducible references over narrative summaries.

        ## Changelog Management

        - Follow Keep a Changelog format
        - Categories: Added, Changed, Deprecated, Removed, Fixed, Security
        - Link version headers to diff URLs

        ## Documentation QA

        - Verify all code examples compile/run
        - Check links are not broken
        - Ensure diagrams match current architecture
        - Review for outdated version references

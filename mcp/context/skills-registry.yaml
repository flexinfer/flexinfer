    common:
      description: |
        Coding standards for the workspace: language guidelines (JS/TS, Python, Go, Shell), function design, error handling, testing, performance, security, and code review checklists.
      instructions: |
        # Coding Standards

        ## Core Principles

        1. **Simplicity**: Favor simple solutions over complex ones
        2. **Readability**: Code should be self-documenting
        3. **Reliability**: Build robust systems that handle failures gracefully
        4. **Efficiency**: Balance performance with maintainability

        ## Language Guidelines

        ### JavaScript/TypeScript
        - TypeScript required for production code
        - Use strict mode and strict TypeScript settings
        - Functional programming preferred where appropriate
        - Jest for testing framework

        ### Python
        - Python 3.9+ required
        - Use type hints extensively
        - Black for formatting; uv or Poetry for dependency management
        - Pytest for testing

        ### Go
        - Follow Effective Go guidelines
        - Error wrapping with context
        - Context propagation for cancellation
        - Structured logging; benchmark critical paths

        ### Shell Scripts
        - POSIX compliance when possible
        - Defensive programming practices
        - Idempotent operations; dry-run options for destructive operations

        ## Coding Practices

        - Single responsibility principle
        - Maximum 20 lines per function (guideline), maximum 4 parameters
        - Return early on errors; pure functions where possible
        - Explicit error handling with structured error types
        - Circuit breaker patterns for external services

        ## Testing Requirements

        - Unit tests for all business logic
        - Integration tests for APIs
        - Contract tests for services
        - Property-based testing for algorithms

        ## Security Standards

        - Whitelist validation approach; SQL injection prevention; XSS protection
        - OAuth 2.0/OIDC preferred; JWT with short expiration
        - Encryption at rest; TLS 1.3 for transport
        - PII handling compliance; secure secret storage

        ## Code Review Checklist

        - Input validation implemented
        - Authentication and authorization checks in place
        - Tests written and passing
        - Documentation updated
        - Error handling complete
        - Performance acceptable

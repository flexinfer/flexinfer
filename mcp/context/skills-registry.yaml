  - name: loom-go-mcp-scaffold
    categories: [development, go, scaffolding]
    common:
      description: |
        Create a new Loom Go MCP server under cmd/mcp-<name>, wire it into Makefile + mcp/context/registry.yaml, and regenerate/sync platform configs with loom.
      instructions: |
        # Loom Go MCP Scaffold

        Build a new Loom-native Go MCP server with repo conventions, shared packages, and registry-driven config generation.

        ## MCP Server Design Checklist

        - Define tool surface first: read-only tools vs mutating tools, and expected caller permissions.
        - Keep calls bounded for client deadlines (~60s is common); avoid unbounded network or shell operations.
        - Name env vars clearly with service prefixes (for example `<SERVICE>_TOKEN`, `<SERVICE>_URL`) and define fallback behavior.
        - Set conservative defaults for pagination, result size, and output truncation.
        - Design errors for agents: user-actionable message + structured code path.

        ## Scaffold Layout (loom-core)

        Create:
        - `cmd/mcp-<name>/main.go`
        - optional split files (`tools.go`, `client.go`, etc.) when handlers become large
        - `cmd/mcp-<name>/main_test.go`

        Typical server shape:
        1. `main()` delegates to `lifecycle.RunWithSignals(context.Background(), run)`
        2. `run(ctx)` initializes logger, optional tracing, dependencies, and `mcp.NewServer("mcp-<name>", version)`
        3. Register tools via `server.AddTool(...)`
        4. Return `server.Run(ctx)`

        ## Required Loom Package Usage

        - `pkg/env`: env parsing and fallback chains
        - `pkg/validate`: argument validation (`Required`, typed getters, pagination helpers)
        - `pkg/mcperror`: structured, user-safe errors and API-status mapping
        - `pkg/httpclient`: HTTP client with retries/timeouts from shared config
        - `pkg/lifecycle`: signal-aware lifecycle wrapper
        - `pkg/mcplog`: structured logger setup
        - `pkg/mcpotel` (optional): per-tool tracing via `TracedToolHandler`

        ## Tool Handler Pattern

        - Parse and validate args early with `validate.NewArgs(args)`.
        - Return validation issues as `mcp.ErrorResult(...)`, not panics.
        - Convert upstream API failures using `mcperror.APIError(...)`.
        - Use `mcperror.NotConfigured(...)` for missing credentials/config.
        - Keep tool output compact and deterministic; trim or truncate large payloads.

        ## Makefile Integration

        1. Add `mcp-<name>` to `MCP_SERVERS` in `Makefile`.
        2. Add build target:
           - `mcp-<name>:` then `go build $(LDFLAGS) -o bin/mcp-<name> ./cmd/mcp-<name>`
        3. Ensure `make servers` includes the new target via `MCP_SERVERS`.

        ## MCP Registry Onboarding

        Update:
        - `mcp/context/registry.yaml`

        Add a new `servers` entry with:
        - `name`
        - `categories`
        - `common.description`
        - `common.command` (usually `\${repo}/services/loom-core/bin/mcp-<name>`)
        - `common.args`
        - `common.env`
        - `common.timeout`
        - optional `common.always_allow` for low-risk read tools
        - `targets.*` overrides only where needed (codex/kilocode/claude/gemini/vscode)

        Keep `always_allow` minimal; default to explicit approval for mutating tools.

        ## Config/Manifest Generation with loom

        From `services/loom-core`:
        - Build CLI if needed:
          - `go build -o ./bin/loom ./cmd/loom`
        - Regenerate client configs:
          - `./bin/loom generate configs --registry ../mcp/context/registry.yaml --target all --output-dir generated/mcp --hub-mode`
        - Regenerate MCP hub manifests (if deploying via hub):
          - `./bin/loom generate manifests --registry ../mcp/context/registry.yaml --output-dir ../platform/gitops/k3s/loom-hub/servers`
        - Sync local platform configs:
          - `for profile in vscode antigravity codex claude gemini kilocode; do ./bin/loom sync "$profile" --regen --hub-mode --all-projects --skip-worktrees; done`
          - `./bin/loom sync skills all`

        ## Verification Checklist

        - Targeted tests:
          - `go test ./cmd/mcp-<name> -v`
        - Repo tests:
          - `go test ./...`
        - Lint:
          - `golangci-lint run`
        - Build smoke:
          - `make mcp-<name>`
          - `make servers`
        - Registry/config validation:
          - `./bin/loom validate configs --dir generated/mcp`

        ## Done Criteria

        - New server builds and passes tests/lint.
        - New server is listed in `Makefile` and emits `bin/mcp-<name>`.
        - `mcp/context/registry.yaml` includes the server.
        - `loom generate` and `loom sync` complete without errors.
        - Expected tools appear in client configs after regen/sync.

        ## Common Pitfalls

        - Forgetting to add the Makefile target or `MCP_SERVERS` entry.
        - Returning raw upstream errors without `mcperror` mapping.
        - Missing required env vars or using inconsistent env names.
        - Overly broad `always_allow` for mutating/destructive tools.
        - Tool responses that exceed practical client size/time limits.

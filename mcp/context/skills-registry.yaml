  - name: quality-gate-loop
    categories: [workflow, quality, development]
    common:
      description: |
        Standard local quality loop: run repo hooks, targeted tests, broader validation, and summarize failures/fixes until the change is actually ready to ship.
      instructions: |
        # Quality Gate Loop

        Use this whenever code has changed and the next question is "is this really ready?".

        ## Outcome

        End with one of:
        - all required local gates passing
        - a precise failure summary with the next fix to make
        - a documented external blocker

        ## Standard Order

        1. **Hook layer**
           - `pre-commit run -a` when configured
           - repo-specific hooks or wrappers
        2. **Targeted verification**
           - run tests only for touched packages/modules first
           - use `devbox_exec` when dependency or build isolation matters
        3. **Broader verification**
           - full unit/integration suite as appropriate
           - lint/static checks
           - build/compile checks
        4. **Regression summary**
           - record what failed, why, and whether the fix is local, flaky, or environmental

        ## Preferred Loom Tooling

        - `devbox_detect` to fingerprint the project
        - `devbox_exec` / `devbox_exec_async` for safe isolated execution
        - `quality_check`, `quality_lint`, `quality_test`, `quality_security`, `quality_coverage` for Go repos that expose those gates

        ## Rules

        - do not jump straight to the full suite if a smaller targeted check can fail faster
        - do not stop after the first failure; identify the narrowest fix and rerun the affected gate
        - do not claim "ready" while hooks, tests, or lint still have known failures

        ## Session Tracking

        Record quality gate results for resumability:
        - `agent_context_add(entries=[{entry_type: "finding", title: "Quality gate result", content: "..."}])`
        - If blocked, update task status: `agent_task_update(..., status="blocked", ...)`

        ## Handoff

        If the loop ends blocked, leave:
        - exact command that failed
        - key failing output
        - current hypothesis
        - next command to run after the blocker clears

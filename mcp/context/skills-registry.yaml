    common:
      description: |
        Run a creative but grounded multi-lens critique across UX, copy, accessibility, performance, and implementation reality, then converge on the highest-leverage next slice. Use when we need structured taste, sharper product thinking, or a more inventive direction before building.
      instructions: |
        # Multi Lens Product Review

        Use the Loom framework to run a creative but grounded critique from several angles, then converge on the best next move.

        ## Use This When

        - a vague product or UI concept needs shaping
        - the current experience needs a stronger point of view
        - we want structured critique instead of a single-agent taste take
        - we need evidence-backed prioritization before implementation

        ## Required Inputs

        - the artifact under review: screenshot, running app, mock, code surface, or spec
        - the intended user outcome
        - relevant constraints: brand, platform, timeline, technical limits

        ## Review Lenses

        - User value and narrative
        - Information hierarchy and scanability
        - Interaction and state transitions
        - Copy, tone, and comprehension
        - Accessibility and inclusion
        - Performance and implementation leverage

        ## Core Workflow

        1. Capture reality.
           - Collect screenshots, code references, or specs.
           - Write a plain-language statement of what the user is trying to do.
        2. Diverge by lens.
           - Assess the artifact through each lens.
           - Generate bold but plausible alternatives, not just cosmetic nitpicks.
        3. Converge.
           - Identify the few changes that improve multiple lenses at once.
           - Choose the smallest high-leverage slice to prototype or implement.
        4. Package the review.
           - Produce a recommendation matrix with severity, upside, effort, and confidence.
           - Produce a proof pack with before/after notes or screenshots when available.
        5. Preserve and coordinate.
           - If multi-agent support exists, assign distinct lenses to different agents and merge results.
           - If agent context exists, store the decision trail and follow-ups.

        ## Framework Hooks

        - `browserkit-screenshots` for evidence capture
        - `agent-context` for durable findings and decisions
        - `multi-agent-handoff` when splitting lenses across agents
        - `frontend-ux-craft` when the selected slice becomes implementation work

        ## Output Expectations

        - 3-6 strongest findings
        - 1 chosen direction
        - An implementation-ready next slice
        - Open risks or unanswered questions

        ## Handoff to Implementation

        When the review converges on an actionable next slice:
        - Use `frontend-ux-craft` for UI/UX implementation work
        - Use `feature-dev` for broader feature implementation
        - Use `small-change-loop` for targeted adjustments
        - Each implementation slice follows the standard Landing Procedure (commit → MR → CI → merge)


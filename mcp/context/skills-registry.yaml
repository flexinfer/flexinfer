# Skills Registry - Unified Cross-Agent Skill Definitions
#
# This registry provides a single source of truth for AI coding assistant skills
# across different platforms (Codex CLI, Claude Code, Gemini, OpenCode, etc.)
#
# ## Structure
# Each skill entry contains:
# - name: Unique identifier (kebab-case)
# - categories: Classification tags for organization
# - common: Default configuration used across all platforms
#   - description: When to use this skill (appears in YAML frontmatter for Codex)
#   - instructions: Main workflow markdown content
#   - scripts: List of bundled scripts with names and relative paths
#   - references: Documentation files to include
#   - assets: Templates and other assets
#   - always_allow: Scripts auto-approved without confirmation (safety criteria below)
#
# ## always_allow Safety Criteria
# A script qualifies for always_allow if it meets ONE of:
#   1. Read-only (kubectl get, grep, stat, list)
#   2. Write-capable BUT safe by default (--dry-run default, --apply to write;
#      or skips existing files, --force opt-in)
#   3. Verification scripts (pre-commit, test, lint) — auto-fixes are expected behavior
# Scripts that unconditionally modify files without a safe default require
# explicit confirmation and should NOT be in always_allow.
# - targets: Platform-specific overrides
#   - codex: Codex CLI specific settings
#   - claude: Claude Code specific settings
#   - kilocode: Kilocode specific settings
#   - gemini: Gemini CLI specific settings
#   - instructions_append: Optional additive markdown appended after common.instructions
#
# ## Variable Substitution
# - ${SKILL_PATH}: Path to skill directory (Codex: $CODEX_HOME/skills/<name>, Claude: direct paths)
# - ${CODEX_HOME}: Codex home directory (~/.codex)
# - ${HOME}: User home directory
# To emit a literal ${VARIABLE} in generated output, escape it: \${VARIABLE}
#
# ## Source Files
# Skill source files (scripts, references, assets) are stored in:
#   mcp/skills/<skill-name>/
#     scripts/
#     references/
#     assets/
#
# ## Skill Types
# Each target can specify a `type` that determines the output format:
# - command: Slash command (Claude .claude/commands/, Kilocode workflows)
# - skill: Full skill bundle (Codex ~/.codex/skills/)
# - rule: Rule file (Claude .claude/rules/, Kilocode .kilocode/rules/)
# - instruction: Included in composite instructions.md (Codex, Kilocode, Gemini)
# - workflow: YAML workflow file (Kilocode .kilocode/workflows/)
#
# ## Composite Instruction Assembly Order
# Skills with type=instruction are merged into a single composite file
# (instructions.md or GEMINI.md). Assembly order is:
#   1. Skills with explicit `priority` (lower number = first in output)
#   2. Skills without priority (in registry YAML order)
# Equal priorities preserve registry order (stable sort).
# Context window priority favors content near the top.
#
# ## Generation
# Run: loom generate skills --target <codex|claude|kilocode|gemini|all>
# Sync: loom sync <profile> --regen --hub-mode --all-projects --skip-worktrees


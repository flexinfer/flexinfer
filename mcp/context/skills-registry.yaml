  - name: k3s-harvester-maintenance
    categories: [kubernetes, gitops, operations]
    common:
      description: |
        Run routine k3s and Harvester maintenance via GitOps-first workflows with explicit triage, validation, and rollback guardrails.
      instructions: |
        # K3s Harvester Maintenance

        Routine operations workflow spanning k3s workloads and Harvester VM infrastructure with GitOps as default control plane.

        ## Quick Start

        1. `cd platform/gitops && source dev-env.sh`
        2. Capture baseline:
           - `bash ${SKILL_PATH}/scripts/cluster_maintenance_snapshot.sh > /tmp/maintenance-before.md`
        3. Choose intent:
           - routine upkeep (disk pressure cleanup, policy tuning, cron updates)
           - VM/node recovery
           - post-incident hardening

        ## Guardrails

        - Prefer Git changes under `k3s/**` and `harvester/**`; reconcile with Flux instead of live drift.
        - If a VM is stuck in `Running` with unhealthy guest state, use Harvester guidance:
          - `kubectl --kubeconfig .kube/harvester-admin.yaml -n default delete vmi <vm-name>`
        - Keep one-off jobs in `k3s/ops/maintenance/` deliberate and short-lived.

        ## Core Workflow

        ### 1) Baseline and Scope

        - Collect k3s node health, Harvester VM state, Flux kustomization readiness, and pressure signals.
        - Identify if issue is node, VM, storage, or control-plane reconciliation.

        ### 2) Apply Change in Git

        - Maintenance manifests: `k3s/ops/maintenance/**`
        - Harvester VM/infra manifests: `harvester/**`
        - Cluster policy changes: relevant `k3s/**` components
        - Commit and push with maintenance-focused message.

        ### 3) Reconcile and Verify

        - `flux reconcile kustomization apps -n flux-system --with-source`
        - If monitoring/system kustomizations changed, reconcile those explicitly.
        - Validate nodes, VMs, and affected namespaces return to healthy state.

        ### 4) Closeout

        - Capture after snapshot.
        - Remove temporary mitigation manifests from Git once no longer needed.
        - Record what was changed and rollback trigger conditions.

        ## References / Templates

        - Workflow + source links: `references/workflow.md`
        - Maintenance checklist: `assets/templates/maintenance-window-checklist.md`
      scripts:
        - name: cluster_maintenance_snapshot.sh

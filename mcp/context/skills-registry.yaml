  - name: dependency-upgrade
    categories: [development, workflow]
    common:
      description: |
        Dependency upgrade with breaking change detection, Tavily research, iterative migration, and validation. Use when upgrading libraries or frameworks across versions.
      instructions: |
        # Dependency Upgrade

        Structured dependency upgrade with breaking change detection, impact analysis, and iterative migration.

        ## When to Use

        - Upgrading a major or minor dependency version
        - Migrations that involve breaking API changes
        - Multi-step upgrades that need research and validation

        ## Research Standard

        - prefer official changelogs, migration guides, and release notes before secondary summaries
        - pin the exact `from_version` and `to_version`; avoid fuzzy “latest” targets
        - map lockfiles, generated code, and transitive dependencies that may also shift during the upgrade
        - if risk is high, land the migration in staged commits so regressions are easier to isolate

        ## Workflow Steps

        1. **Initialize session** — `agent_session_start(namespace="upgrade/<dep>-<version>", description="...")`; recall prior migrations with `agent_recall`
        2. **Allocate worktree** — `agent_worktree_allocate(branch_name="upgrade/<dep>-<version>", base_branch="main", purpose="...")`
        3. **Inventory current state** — catalog versions, transitive deps, lock files
        4. **Breaking changes analysis** — research changelogs via Tavily
        5. **Impact assessment** — map affected files and usage patterns
        6. **Approve migration plan** — human review gate
        7. **Execute migration** — apply changes iteratively with compile/test
        8. **Full validation** — test suite, linting, integration tests
        9. **Landing Procedure**
           a. Stage only upgrade-related files (never `.env`, credentials, or unrelated changes)
           b. Commit with conventional format: `upgrade(scope): bump <dep> from <old> to <new>` + `Co-Authored-By` trailer
           c. Push branch (`-u` if first push)
           d. Create or reuse MR/PR (check existing MRs for same source branch first)
           e. Request auto-merge when project policy allows
           f. Poll pipeline to terminal state; if red → fix → re-commit → re-push → re-poll
           g. Confirm merged or document blocker
        10. **Release worktree** — `agent_worktree_release(...)`
        11. **End session** — `agent_session_end(summarize=true)` with migration lessons

        ## Quick Start

        ```
        agent_workflow_start(definition_id="dependency-upgrade", input={
          namespace: "upgrade/react-18-to-19",
          agent_id: "claude-code",
          dependency: "react",
          from_version: "18.2",
          to_version: "19.0"
        })

    common:
      description: |
        Create a new Go service following workspace patterns: standard layout, Makefile, Dockerfile, K8s manifests, and CI pipeline.
      instructions: |
        # Go Service Scaffold

        Create a new Go service following workspace conventions.

        ## Standard Layout

        ```
        services/<name>/
        ├── cmd/<name>/
        │   └── main.go            # Entry point
        ├── internal/
        │   ├── server/            # HTTP/gRPC server setup
        │   ├── handler/           # Request handlers
        │   ├── service/           # Business logic
        │   └── repository/        # Data access
        ├── pkg/                   # Public API (if any)
        ├── Makefile
        ├── Dockerfile
        ├── go.mod
        ├── AGENTS.md
        └── README.md
        ```

        ## Steps

        1. **Initialize Go module**: `go mod init github.com/crb2nu/<name>`
        2. **Create main.go**: Parse config, set up structured logging, HTTP server with graceful shutdown
        3. **Create Makefile**: `build`, `test`, `lint`, `run`, `docker-build` targets
        4. **Create Dockerfile**: Multi-stage (golang:1.23 builder, distroless runtime), non-root user
        5. **Create K8s manifests** in `platform/gitops/k3s/apps/<name>/`: deployment, service, kustomization
        6. **Create AGENTS.md**: Build commands, test commands, architecture overview

        ## Patterns

        - Error wrapping: `fmt.Errorf("op: %w", err)`
        - Config: environment variables with struct binding
        - Logging: structured JSON (zerolog or slog)
        - Health: `/healthz` and `/readyz` endpoints
        - Metrics: Prometheus on `/metrics`
        - Shutdown: Handle SIGTERM/SIGINT gracefully

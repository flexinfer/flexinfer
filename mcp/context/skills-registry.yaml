  - name: recursive-context-strategy
    categories: [agents]
    common:
      description: |
        Teaches agents the four RLM (Recursive Language Model) strategies for processing
        large or complex context: peeking, grepping, partition+map, and summarize/reduce.
        Mapped to existing loom MCP tools.
      instructions: |
        # Recursive Context Strategy

        Apply these four strategies when facing large codebases, long documents, or complex
        analysis tasks. Each strategy maps to existing loom MCP tools.

        ## Strategy 1: Peeking (Sample Structure)

        Before deep-diving, probe the high-level structure to orient yourself.

        ```
        codebase_stats(repo_path=".")
        → codebase_get_context(repo_path=".", path="/", max_depth=1)
        → agent_recall(query="<topic>", scope="context", token_budget=2000)
        ```

        **When to use:** Starting a new analysis, unfamiliar codebase, or when the scope is unclear.
        **Termination:** Move to Grepping once you have a structural mental model.

        ## Strategy 2: Grepping (Keyword Narrowing)

        Iteratively narrow the search space using keywords and patterns.

        ```
        codebase_text_search(repo_path=".", pattern="<keyword>")
        → codebase_search(repo_path=".", query="<semantic query>")
        → codebase_get_definition(repo_path=".", symbol="<symbol>")
        ```

        **When to use:** You know what you are looking for but not where it lives.
        **Iterative pattern:** Broad search → filter by relevance → targeted definition lookup.
        **Termination:** Stop when you have identified all relevant code locations.

        ## Strategy 3: Partition + Map (Parallel Decomposition)

        Decompose the problem into independent sub-problems and process each separately.

        ```
        start_thinking(title="Partition Plan", initial_thought="Decompose into N areas...")
        → For each partition:
            codebase_search(repo_path=".", query="<partition-specific query>")
            agent_context_add(entries=[{entry_type: "finding", title: "Partition N result", ...}])
        → add_thought(thought="Partition N complete, confidence: 0.X")
        ```

        **When to use:** The problem has natural divisions (by module, by file, by concern).
        **Bounded parallelism:** Process at most 4-6 partitions before synthesizing.
        **Termination:** All partitions processed or confidence threshold reached.

        ## Strategy 4: Summarize / Reduce (Aggregate Results)

        Combine findings from earlier strategies into a coherent answer.

        ```
        agent_context_summarize(session_id="<session>")
        → agent_recall(query="<original question>", scope="all", token_budget=3000)
        → agent_context_add(entries=[{entry_type: "note", title: "Final synthesis", content: "..."}])
        ```

        **When to use:** After Grepping or Partition+Map, when you have scattered findings.
        **Output:** A reasoning chain with confidence score and traceable evidence.

        ## Termination Heuristic

        Use sequential-thinking confidence scores to decide when to stop recursing:

        1. After each strategy application, assess confidence (0.0-1.0)
        2. If confidence >= 0.8 → proceed to Summarize/Reduce
        3. If confidence < 0.8 → identify the specific uncertainty
        4. Recurse into the uncertain area using the most appropriate strategy
        5. Maximum recursion depth: 3 levels (peek → grep → partition is typical)

        ## Decision Tree

        ```
        Start
        ├─ Unknown scope? → Peek first
        ├─ Know what to find? → Grep
        ├─ Multiple areas to cover? → Partition + Map
        └─ Have scattered findings? → Summarize / Reduce
        ```

        ## Workflow Integration

        For structured execution, use the `long-context-analysis` or `recursive-context`
        workflow definitions via `agent_workflow_start`.

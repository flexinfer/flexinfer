  - name: security-audit
    categories: [security, operations]
    common:
      description: |
        Security assessment workflow: OWASP top 10 checks, dependency vulnerability scanning, secret scanning, and container security review.
      instructions: |
        # Security Audit

        Systematic security assessment for applications and infrastructure.

        ## OWASP Top 10 Checks

        1. **Broken Access Control**: Verify authorization on all endpoints, check RBAC configuration
        2. **Cryptographic Failures**: Verify TLS configuration, check encryption at rest, review key management
        3. **Injection**: Check for SQL, NoSQL, OS command, LDAP injection vectors
        4. **Insecure Design**: Review threat model, check for security design patterns
        5. **Security Misconfiguration**: Review default configs, check unnecessary features disabled
        6. **Vulnerable Components**: Run dependency vulnerability scan
        7. **Authentication Failures**: Check password policies, session management, MFA
        8. **Data Integrity Failures**: Verify CI/CD pipeline integrity, check software supply chain
        9. **Logging Failures**: Verify security events logged, check log integrity
        10. **SSRF**: Check URL validation, verify network segmentation

        ## Dependency Scanning

        - **Go**: `govulncheck ./...`
        - **Node.js**: `pnpm audit`
        - **Python**: `pip-audit` or `safety check`
        - **Container images**: `trivy image <image:tag>`

        ## Secret Scanning

        - Check for hardcoded secrets in source code
        - Verify environment variables used for credentials
        - Check `.env` files not committed
        - Verify secrets use `${keychain:}`, `${env:}`, or `${secret:}` patterns

        ## Container Security

        - Non-root user in Dockerfile
        - Minimal base image (distroless, alpine)
        - No unnecessary packages installed
        - Multi-stage build for minimal attack surface

        ## Kubernetes Security

        - Pod Security Standards enforced
        - Network policies in place
        - RBAC with least privilege
        - Secrets encrypted at rest (SOPS + age)
        - No privileged containers

        ## Output Format

        For each finding, record:
        - **Severity**: Critical / High / Medium / Low / Info
        - **Location**: File path and line number
        - **Description**: What the issue is
        - **Recommendation**: How to fix it
        - **Reference**: OWASP/CWE identifier

        ## Workflow Automation

        For structured execution with session tracking and approval gates:

        ```
        agent_workflow_start(definition_id="security-audit", input={
          namespace: "security/loom-core-audit",
          agent_id: "claude-code",
          audit_target: "loom-core",
          scope: "full"
        })
        ```

        Workflow file: `.agents/workflows/security-audit.yaml`

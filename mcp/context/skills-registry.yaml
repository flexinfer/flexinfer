  - name: backlog-triage
    categories: [workflow, planning, coordination]
    common:
      description: |
        Backlog triage loop: gather open work from Jira, GitLab, GitHub, and local plans, normalize priority and blockers, then produce a concrete ranked next-action list.
      instructions: |
        # Backlog Triage

        Use this when the problem is not "write code now" but "decide what should move next".

        ## Outcome

        Produce a ranked backlog snapshot with:
        - top candidate items
        - blocker and dependency notes
        - ownership gaps
        - a recommended next slice to execute

        ## Source Order

        1. Jira issues if the repo/program uses Jira
        2. GitLab issues / merge requests
        3. GitHub issues / pull requests
        4. Local planning docs (`ROADMAP.md`, `.loom/*.md`, `docs/**`)
        5. Agent tasks already tracked in `agent-context`

        ## Triage Loop

        1. **Collect candidates**
           - `jira__jira_search`
           - `gitlab__list_issues`
           - `github__list_issues`
           - `agent_task_list`
        2. **Normalize**
           - one line summary
           - owner
           - status
           - urgency / impact
           - blocker state
           - likely effort
        3. **Cross-check coordination**
           - `agent_presence_list`
           - `agent_worktree_list`
           - identify work already in progress before assigning new slices
        4. **Rank**
           - prioritize unblocked, high-impact, smallest-shippable items
           - de-prioritize vague work that still needs research
        5. **Publish next action**
           - recommend a specific next item
           - point to the right follow-on skill: `small-change-loop`, `feature-dev`, `bugfix`, or `research`

        ## Handoff to Implementation

        When the next item is selected:
        - Use `small-change-loop` for tightly scoped edits
        - Use `feature-dev` for multi-file feature slices
        - Use `bugfix` for investigation-heavy defects
        - Use `backlog-delivery-loop` for full pick-and-ship automation
        - Each implementation skill follows the standard Landing Procedure (commit → MR → CI → merge)

        ## Rules

        - do not treat backlog grooming as abstract strategy work; every recommendation should end in an executable next step
        - avoid selecting blocked work unless the blocker itself is the next tractable item
        - prefer items with crisp acceptance criteria and visible user or operational value

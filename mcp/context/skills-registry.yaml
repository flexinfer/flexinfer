  - name: ci-green-merge-loop
    categories: [workflow, ci-cd]
    common:
      description: |
        Carry a repo-local CI fix all the way through commit, push, merge request creation or reuse, auto-merge, and final green status. Use after the failure is understood and the job is to land the repair end-to-end.
      instructions: |
        # CI Green Merge Loop

        Use this when the important question is no longer "what failed?" but "how do we land the fix cleanly and get back to green?"

        ## Outcome

        Finish with one of:
        - scoped fix committed, pushed, merged, and verified green
        - scoped fix queued with auto-merge / merge train and awaiting final merge
        - a precise blocker explaining why the fix cannot be merged yet

        ## Best Fit

        - the failing job is already understood as repo-local
        - the code fix is in hand or nearly in hand
        - you want a non-interactive path through commit, push, MR, and CI watch

        ## Not a Fit

        - infra-wide runner or registry outage
        - default branch already broken
        - suspected flake that has not been quarantined or explicitly accepted

        ## Loop

        1. **Start from a real fix**
           - use `ci-failure-recovery` first if the cause is still unclear
           - keep the diff tightly scoped to the causal failure
        2. **Run local verification before shipping**
           - targeted gate first, then broader checks as needed
           - do not defer first validation to CI if you can reproduce locally
        3. **Commit and push**
           - stage only intended files
           - use a narrow commit message that describes the CI repair
           - push the branch before creating or updating the MR
        4. **Create or reuse the MR**
           - avoid duplicate MRs for the same source branch
           - prefer updating the existing MR thread when one already exists
        5. **Enable safe merge automation**
           - on GitLab, prefer auto-merge or merge trains over manual "wait then click merge"
           - use the current source `sha` when requesting merge so unseen commits do not slip through
        6. **Poll the decisive pipeline**
           - if red, loop back to the smallest fix
           - if green, confirm the MR is merged or queued in the merge train as expected
        7. **Close the loop**
           - summarize the root cause and fix in the MR or handoff note
           - leave an explicit blocker if approvals, branch policy, or infra status prevents merge

        ## Native MCP Path

        When you want a pure tool-driven flow inside the agent:
        - `gitlab__list_merge_requests` with `source_branch` / `target_branch` filters to reuse an open MR
        - `gitlab__get_merge_request` to poll merged state and detailed merge status
        - `gitlab__merge_merge_request` with `auto_merge=true` and the current `sha` for a safe merge request handoff

        ## GitLab Helper

        Use the bundled helper for the non-interactive GitLab path:

        - `bash ${SKILL_PATH}/scripts/gitlab_green_loop.sh --project <group/project> --target-branch main --verify-command "<targeted gate>" --commit-message "fix(ci): <summary>" --mr-title "fix(ci): <summary>" --stage-all`

        Notes:
        - omit `--commit-message` when the fix is already committed
        - omit `--stage-all` if you want tracked-only staging or explicit file selection
        - pass `--no-auto-merge` when approvals or project policy require a human checkpoint

        ## Auto-Ship Policy

        Do not ask the user before committing, pushing, creating MRs, or merging.
        Only pause on failures, blockers, or when the user explicitly requests a stop.

        ## Safety Rules

        - do not auto-merge infra-only changes just to clear red CI
        - do not rely on duplicate branch pipelines when MR pipelines exist
        - do not open a fresh MR if the branch already has an active one
        - do not keep retrying a flaky test in the main merge gate without a quarantine plan

        ## Post-Merge Cleanup

        After the MR is merged (or blocker documented):
        1. Delete remote branch: `git push origin --delete <branch>`
        2. Release worktree if allocated: `agent_worktree_release(agent_id=..., worktree_id=..., remove_worktree=true)`
        3. Delete local branch: `git branch -d <branch>`
        4. End session: `agent_session_end(session_id=..., summarize=true)`

        ## Reference

        `references/workflow.md` captures the current GitLab and flaky-test patterns this loop is based on.
      scripts:
        - name: gitlab_green_loop.sh
          path: scripts/gitlab_green_loop.sh
          description: Commit or reuse a fix, push, create or reuse a GitLab MR, request auto-merge, poll CI, and wait for merged state
      references:
        - workflow.md
      assets: []
      always_allow:
        - gitlab_green_loop.sh
    targets:
      codex:
        enabled: true
        type: skill
        instructions_append: |
          ## Codex Notes
          - Bundled scripts available at `${SKILL_PATH}/scripts/`
      claude:
        enabled: true

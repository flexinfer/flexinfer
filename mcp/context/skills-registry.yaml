      instructions: |
        # Docs Refresh Loop

        Use this when implementation changed but docs, specs, or runbooks are now out of date.

        ## Outcome

        Deliver a small, accurate documentation refresh with:
        - changed docs/specs/runbooks
        - file-backed evidence for the update
        - explicit open questions where behavior is still unsettled

        ## Loop

        1. **Identify likely drift**
           - changed code paths
           - user-facing behavior changes
           - operational workflow changes
           - stale `.loom` planning docs after implementation moved
        2. **Source from the code first**
           - `codebase_memory__codebase_search`
           - `codebase_memory__codebase_get_context`
           - exact commands and file refs for operational steps
        3. **Update the minimum doc set**
           - README / feature docs
           - `.loom/20-product-spec.md` or `.loom/30-implementation-plan.md`
           - runbooks or rollout notes when operations changed
        4. **Check for consistency**
           - no promises the code does not fulfill
           - no obsolete flags, commands, or paths
        5. **Preserve context**
           - add a short `agent-context` note or decision when the doc change captures non-obvious rationale

        ## Landing Procedure

        1. **Stage scoped files** — only changed docs (never `.env`, credentials, or unrelated code changes)
        2. **Commit with conventional format** — `docs(scope): update <what changed>` + `Co-Authored-By` trailer
        3. **Push branch** — `git push origin <branch>` (`-u` if first push)
        4. **Create or reuse MR/PR** — check for existing MR on the same source branch first
        5. **Request auto-merge** when project policy allows
        6. **Poll pipeline to terminal state** — if red → fix → re-push
        7. **Confirm merged** or document blocker

        ## Rules

        - prefer smaller accurate updates over broad prose refreshes
        - cite exact code or command evidence for non-trivial claims
        - if external behavior is still in flux, document the uncertainty instead of inventing certainty

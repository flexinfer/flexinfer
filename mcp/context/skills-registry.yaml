  - name: k8s-debug
    categories: [kubernetes, operations]
    common:
      description: |
        Kubernetes troubleshooting loop: triage, isolate, verify fix, and capture reusable findings across k3s and harvester clusters.
      instructions: |
        # Kubernetes Debug

        Systematic debugging workflow for Kubernetes clusters with repeatable evidence capture and GitOps-safe remediation.

        ## Required Troubleshooting Loop

        1. Start context session and create a task for the issue.
        2. Run triage probes (pods, events, logs, resource status, Flux status).
        3. Form one hypothesis at a time and test minimally.
        4. Prefer Git + Flux fixes; only use live mitigations for incident containment.
        5. Verify health after each change.
        6. Record root cause and durable fix in agent context.

        ## GitOps Debug Guardrails

        - Before patching a workload, identify its manifest owner path under `k3s/**`.
        - If you hotfix live state (`kubectl patch`/`edit`) during incident response, mirror that fix into Git immediately.
        - Reconcile relevant Flux kustomization after committing.

        ## Quick Triage

        1. **Check pod status**: `k8s_getPods` for the target namespace
        2. **Describe failing pods**: `k8s_describe` on pods in CrashLoopBackOff, Error, or Pending
        3. **Check logs**: `k8s_logs` for recent container output (use `previous: true` for crashed containers)
        4. **Check events**: `k8s_get` for Events sorted by lastTimestamp

        ## Common Issues

        ### Pod stuck in Pending
        - Check node resources: `k8s_get` nodes with resource allocations
        - Check PVC status: `k8s_get` PersistentVolumeClaims
        - Check node selectors/tolerations match available nodes

        ### CrashLoopBackOff
        - Get previous logs: `k8s_logs` with `previous: true`
        - Check resource limits: may be OOM killed
        - Verify config maps and secrets exist
        - Check readiness/liveness probe configuration

        ### ImagePullBackOff
        - Verify image name and tag exist
        - Check image pull secrets
        - Verify registry accessibility from nodes

        ### Service Not Reachable
        - Verify service selectors match pod labels
        - Check endpoints: `k8s_get` endpoints for the service
        - Verify network policies allow traffic
        - Check ingress/gateway configuration

        ## Verification Checklist (Do Not Skip)

        - Workload state returns to expected replicas/ready status
        - Error rate and latency metrics normalize
        - No fresh warning/error events for the affected resource
        - A short "what changed / why it worked" note is written to agent context

        ## Cluster Selection

        - **k3s apps cluster**: Application workloads — use `k8s_apps_k3s` MCP tools
        - **harvester infra**: Infrastructure VMs — use `k8s_harvester_infra` MCP tools
        - **longhorn**: Storage — use `longhorn_k3s` MCP tools

        ## Domain-Specific Escalation

        - Longhorn/storage-heavy failures:
          - switch to `longhorn-gitops-ops`
        - Monitoring/alerting stack failures:
          - switch to `monitoring-gitops-ops`
        - Cross-cluster VM/node maintenance:
          - switch to `k3s-harvester-maintenance`

        ## Advanced Debugging

        - **Exec into pod**: `k8s_exec` for interactive troubleshooting
        - **Check Flux**: `flux_get_kustomizations` for GitOps reconciliation status
        - **Check Helm**: `helm_status` for Helm release status
        - **Check Prometheus**: `query` for resource metrics
        - **Check Loki logs**: `loki_query` for aggregated log analysis

  - name: decision-journal
    categories: [decisions, memory]
    common:
      description: |
        Track architectural and implementation decisions with rationale. Use when making significant choices that future agents (or humans) need to understand. Creates a searchable decision log with context.
      instructions: |
        # Decision Journal

        Maintain a persistent record of architectural decisions and their rationale.

        ## When to Use

        - Choosing between implementation approaches
        - Selecting libraries or frameworks
        - Defining API contracts
        - Making trade-off decisions
        - Establishing patterns or conventions

        ## Recording Decisions

        ### Standard Decision Entry

        ```
        agent_context_add(
            session_id="...",
            entries=[
                {
                    entry_type: "decision",
                    title: "Use PostgreSQL over MongoDB",
                    content: """
        ## Context
        Need a database for user data with complex relationships.

        ## Decision
        PostgreSQL with JSONB for flexible fields.

        ## Rationale
        - Strong consistency required for financial data
        - Complex joins needed for reporting
        - Team has PostgreSQL expertise
        - JSONB provides NoSQL flexibility where needed

        ## Alternatives Considered
        - MongoDB: Rejected due to consistency requirements
        - CockroachDB: Overkill for current scale

        ## Consequences
        - Need connection pooling (use PgBouncer)
        - Schema migrations required
        - JSONB queries may need optimization
        """,
                    tags: ["database", "architecture", "adr"]
                }
            ]
        )
        ```

        ### Quick Decision

        For smaller decisions:

        ```
        agent_context_add(
            session_id="...",
            entries=[
                {
                    entry_type: "decision",
                    title: "Use zap for logging",
                    content: "Chose zap over logrus for performance. Structured logging with JSON output.",
                    tags: ["logging", "library-choice"]
                }
            ]
        )
        ```

        ## Querying Decisions

        ### Find All Decisions

        ```
        agent_context_search(
            query="decisions",
            entry_types=["decision"],
            limit=20
        )
        ```

        ### Decisions by Tag

        ```
        agent_context_search(
            query="database choices",
            entry_types=["decision"],
            tags=["database", "architecture"]
        )
        ```

        ### Recall with Context

        ```
        agent_recall(
            query="why did we choose this database",
            scope="context",
            include_decisions=true,
            token_budget=4000
        )
        ```

        ## Decision Categories

        Tag decisions consistently:

        | Category | Tags | Examples |
        |----------|------|----------|
        | Architecture | `architecture`, `adr` | Service boundaries, data flow |
        | Libraries | `library-choice`, `dependencies` | Framework selection |
        | API Design | `api`, `contracts` | Endpoint design, versioning |
        | Data | `database`, `schema` | Storage choices, migrations |
        | Security | `security`, `auth` | Auth methods, encryption |
        | Performance | `performance`, `optimization` | Caching, indexing |

        ## Best Practices

        1. **Record immediately**: Capture decisions when made, not later
        2. **Include rationale**: Future you will thank present you
        3. **Note alternatives**: What was considered and rejected
        4. **Add consequences**: What this decision implies
        5. **Link to code**: Reference implementation locations
        6. **Review periodically**: Decisions may need revisiting

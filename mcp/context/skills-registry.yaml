        1. **Platform drift**
           - `loom sync status`
           - if drift exists, run targeted `loom sync <profile> --regen --hub-mode --all-projects --skip-worktrees`
        2. **Daemon and proxy health**
           - `curl http://localhost:9876/health`
           - `loom tunnel status` when remote clusters are in scope
        3. **HUD status**
           - confirm local HUD responds on `http://127.0.0.1:3333` or the configured port
           - use the HUD to spot lifecycle pressure, blocked tasks, and stale sessions
        4. **Agent coordination state**
           - `agent_presence_list`
           - `agent_task_list`
           - `agent_worktree_list`
           - look for idle agents holding claims, blocked tasks without owners, and orphaned worktrees
        5. **Repo hygiene**
           - scan key repos for dirty trees and pending branches
           - confirm the active branch matches the current task

        Close the sweep: `agent_session_end(summarize=true)`

        ## Escalation Rules

        - if config drift is widespread, use `platform-config-sync`
        - if blocked tasks or claim conflicts dominate, update task ownership and session summaries before starting new work
        - if daemon/HUD state is unhealthy, fix the local platform before attempting normal delivery

        ## Reporting Format

        Keep the sweep concise:
        - green: safe to continue
        - yellow: attention needed soon
        - red: blocking issue that should be resolved first

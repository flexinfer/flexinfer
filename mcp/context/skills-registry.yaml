        output_format: markdown

  - name: agent-context
    categories: [memory, agents]
    common:
      description: |
        Use mcp-agent-context for persistent memory across sessions: start sessions, record decisions/findings, track tasks, and hand off context between agents. Use for long-running tasks, resumable work, multi-agent coordination, or knowledge preservation.
      instructions: |
        # Agent Context (Persistent Memory)

        Universal guidance for AI agents using the `mcp-agent-context` MCP server from loom-core.

        ## When to Use Agent Context

        Use agent context for:
        - **Long-running tasks**: Multi-file refactors, feature implementations
        - **Resumable work**: Tasks spanning multiple sessions
        - **Multi-agent coordination**: Handing off work between agents
        - **Knowledge preservation**: Recording decisions, findings, and rationale

        Skip agent context for:
        - Simple one-shot queries
        - Quick fixes under 5 minutes
        - Read-only exploration

        ## Essential Workflow

        ### 1. Start Session with Recall

        ```
        agent_session_start(
            namespace="project/feature-x",
            description="Implementing user auth"
        )
        → Returns session_id

        agent_recall(
            session_id="...",
            query="user authentication implementation",
            scope="context",
            file_context="src/auth/handler.go",
            include_tasks=true,
            token_budget=3000
        )
        → Returns previous decisions, findings, tasks
        ```

        ### 2. Record Context as You Work

        ```
        agent_context_add(
            session_id="...",
            entries=[
                {
                    entry_type: "decision",
                    title: "Use JWT for session tokens",
                    content: "Chose JWT over session cookies because...",
                    tags: ["auth", "security"]
                },
                {
                    entry_type: "file_read",
                    title: "Auth middleware",
                    content: "Key functions: validateToken(), refreshToken()",
                    file_path: "src/middleware/auth.go",
                    line_start: 45,
                    line_end: 120
                }
            ]
        )
        ```

        ### 3. Track Tasks & Task Dispatch

        Create tasks as you discover work. Use all fields to make tasks actionable in the HUD:

        ```
        agent_task_add(
            session_id="...",
            tasks=[{
                title: "Refactor auth middleware",
                context: "JWT refresh tokens need support. See issue #42.",
                priority: "high",
                file_path: "services/api/auth.go",
                line_number: 89,
                tags: ["auth", "refactor"],
                blocked_by: ["task-abc-123"]
            }]
        )
        ```

        **Task Lifecycle**: `pending → in_progress → completed` (or `→ blocked` when dependencies are incomplete).

        Update status and close with resolution:

        ```
        agent_task_update(task_id="...", status="in_progress")

        agent_task_update(
            task_id="...",
            status="completed",
            resolution="Implemented JWT refresh at auth.go:89-142. Added tests."
        )
        ```

        List and filter tasks:

        ```
        agent_task_list(session_id="...", status=["pending", "in_progress"])
        ```

        Tasks created here appear in the HUD agent dashboard when you have registered presence.

        ### 4. End Session

        ```
        agent_session_end(
            session_id="...",
            summarize=true
        )
        → Generates compressed summary for future recall
        ```

        ## Entry Types Reference

        | Type | When to Use | Example |
        |------|-------------|---------|
        | `decision` | Architecture/implementation choices | "Chose gRPC over REST" |
        | `finding` | Discoveries during exploration | "Found validation in utils.go" |
        | `file_read` | Recording important file sections | "Key config at lines 45-80" |
        | `question` | Open questions to revisit | "Should we support OAuth2?" |
        | `note` | General observations | "Module uses singleton pattern" |
        | `error` | Errors and resolutions | "Fixed nil pointer" |

        ## Best Practices

        1. **Recall before starting**: Check for previous context at session start
        2. **Record decisions immediately**: Don't wait until end of session
        3. **Use meaningful namespaces**: `project/feature`, `project/bugfix-123`
        4. **Tag entries consistently**: Enables filtered recall later
        5. **End sessions with summary**: Compresses context for future recall

        ### Context Budget Hygiene

        Keep context compact and retrieval-focused:

        1. Start each new work chunk with token-limited recall (`token_budget`), not full-history dumps.
        2. Prefer `decision` and `finding` entries over verbose freeform notes.
        3. Summarize and end stale sessions instead of carrying everything forward:

        ```
        agent_session_end(session_id="...", summarize=true)
        ```

        ## Agent Coordination (Multi-Agent)

        When multiple agents work concurrently, use presence, file claims, and worktrees to coordinate.

        ### Presence Registry

        Register presence so the HUD can assign tasks to your agent and show your status:

        ```
        agent_presence_register(
            agent_id="claude-1",
            session_id="...",
            agent_type="claude-code",
            description="Working on auth refactor"
        )
        ```

        Send heartbeats to stay visible and detect file conflicts:

        ```
        agent_presence_heartbeat(
            agent_id="claude-1",
            active_files=["src/auth/handler.go", "src/auth/middleware.go"],
            current_task="Refactoring auth middleware",
            branch="feat/auth-refactor"
        )
        → Returns has_conflicts if another agent is editing the same files
        ```

        Discover other active agents:

        ```
        agent_presence_list()
        → Returns active agents with their current tasks, files, and branches
        ```

        ### File Claims (Advisory Locks)

        Claim files before editing to avoid conflicts:

        ```
        agent_file_claim_acquire(
            agent_id="claude-1",
            session_id="...",
            file_path="src/auth/handler.go",
            claim_type="edit",
            reason="Refactoring auth handler"
        )
        → Returns has_conflicts if another agent holds a claim
        ```

        Check who holds claims on files:

        ```
        agent_file_claim_query(file_paths=["src/auth/handler.go"])
        ```

        ### Git Worktree Isolation

        Request an isolated worktree for parallel work:

        ```
        agent_worktree_allocate(
            agent_id="claude-1",
            session_id="...",
            branch_name="feat/auth-refactor",
            base_branch="main",
            purpose="Auth system refactor"
        )
        → Returns worktree_path to work in
        ```

        ### Sharing Context with Other Agents

        Share specific entries with target agents using shared visibility:

        ```
        agent_context_add(
            session_id="...",
            entries=[
                {
                    entry_type: "note",
                    title: "Auth implementation handoff context",
                    content: "Token refresh logic is in middleware/auth.go and user lookup in service/user.go.",
                    visibility: "shared",
                    shared_with: ["codex-1", "claude-1"],
                    tags: ["handoff-context", "auth"]
                }
            ]
        )
        ```

        ### Handoff Inbox

        Check for pending handoffs at session start:

        ```
        agent_handoff_inbox(agent_id="claude-1")
        → Returns pending handoffs from other agents
        ```
      scripts: []
      references: []
      assets:
        - templates/session-start.md
        - templates/handoff.md
      always_allow: []
    targets:
      codex:
        enabled: true
        type: skill
      claude:
        enabled: true
        type: command
        output_format: markdown
      kilocode:
        enabled: true
        type: rule
      gemini:
        enabled: true
        type: instruction
      antigravity:
        enabled: true
        type: command
        output_format: markdown

  - name: multi-agent-handoff
    categories: [agents, memory]
    common:
      description: |
        Hand off work between AI coding agents with context preservation. Use when transferring tasks between Claude, Codex, Gemini, or other agents, ensuring the receiving agent has full context of decisions, findings, and pending work.
      instructions: |
        # Multi-Agent Handoff

        Transfer work between agents while preserving context and continuity.

        ## When to Use

        - Switching from Claude to Codex (or vice versa)
        - Parallel agent work on different aspects
        - Escalating complex tasks to specialized agents
        - Sharing discoveries across agent sessions

        ## Handoff Workflow

        ### 1. Prepare Context (Source Agent)

        Before creating handoff, ensure key context is recorded:

        ```
        agent_context_add(
            session_id="...",
            entries=[
                {
                    entry_type: "decision",
                    title: "Summary of approach taken",
                    content: "Detailed explanation...",
                    tags: ["handoff-context"]
                }
            ]
        )
        ```

        ### 2. Create Handoff

        ```
        agent_handoff_create(
            session_id="current-session",
            target_agent_id="codex-1",
            handoff_type="selective",   # or "full"
            entry_ids=["entry1", "entry2"],  # for selective
            instructions="Continue implementing rate limiting. Key decision: using token bucket algorithm.",
            token_budget=4000
        )
        → Returns handoff_id
        ```

        **Handoff Types:**
        - `selective`: Only include specified entries (recommended for focused handoffs)
        - `full`: Include all session context (use sparingly)

        ### 3. Accept Handoff (Target Agent)

        ```
        agent_handoff_accept(
            handoff_id="...",
            session_id="new-session-id",
            import_entries=true
        )
        → Imports context into target agent's session
        ```

        ### 4. Continue Work

        The target agent now has:
        - All shared context entries
        - Source agent's instructions
        - Task continuity

        ## Sharing Without Full Handoff

        For lighter coordination, write shared entries directly:

        ```
        agent_context_add(
            session_id="current-session",
            entries=[
                {
                    entry_type: "note",
                    title: "Auth findings snapshot",
                    content: "Rate limiting interceptor is in gateway/ratelimit.go; tests in gateway/ratelimit_test.go.",
                    visibility: "shared",
                    shared_with: ["claude-code", "codex-1"],
                    tags: ["auth", "handoff-context"]
                }
            ]
        )
        ```

        Target agents can retrieve this with:

        ```
        agent_recall(
            query="auth findings snapshot",
            scope="context",
            cross_agent=true
        )
        ```

        ## Best Practices

        1. **Include clear instructions**: Tell the target agent what to do next
        2. **Share decisions, not just findings**: Context about "why" is crucial
        3. **Use selective handoffs**: Full handoffs can overwhelm
        4. **Tag handoff entries**: Use `handoff-context` tag for filtering
        5. **Verify acceptance**: Confirm target agent received context
      scripts: []
      references: []
      assets:
        - templates/handoff-brief.md
        - templates/shared-context.md
      always_allow: []
    targets:
      codex:
        enabled: true
        type: skill
      claude:
        enabled: true
        type: command
        output_format: markdown
      kilocode:
        enabled: true
        type: rule
      gemini:
        enabled: true
        type: instruction
      antigravity:
        enabled: true

        # Memory Practices

        ## Knowledge Graph Usage

        ### At the Start of Every Task
        - **ALWAYS** check the knowledge graph first using `read_graph` or `search_nodes`
        - Look for entities related to the current project, technologies, previous decisions, known issues, and user preferences

        ### During Task Execution
        - Store important findings as entities with observations
        - Record configuration decisions, architecture choices, problem solutions, project structure insights

        ### Before Task Completion
        - Update the knowledge graph with new learnings, task outcomes, relationships between components

        ## Entity Types

        - `Project` — repositories and applications
        - `Technology` — languages, frameworks, tools
        - `Configuration` — settings and parameters
        - `Issue` — problems and bugs
        - `Solution` — fixes and workarounds
        - `Decision` — architectural choices
        - `Documentation` — important references

        ## Relationship Types

        - `uses` — Project uses Technology
        - `configures` — Configuration configures Project
        - `solves` — Solution solves Issue
        - `depends_on` — dependency relationship
        - `relates_to` — general relationship
        - `contains` — parent-child relationship
        - `implements` — implementation relationship

        ## Best Practices

        - Create/extend entities for Project, Configuration, Issue, Solution, Decision, Technology
        - Link relationships (uses/configures/solves/depends_on/relates_to)
        - Store concise observations; avoid secrets
        - Don't duplicate entities — search first

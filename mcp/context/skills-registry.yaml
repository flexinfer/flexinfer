  - name: deployment-practices
    categories: [deployment, operations]
    common:
      description: |
        Deployment procedures for the workspace: GitOps workflow via Flux CD, Kubernetes cluster access (K3s and Harvester), deployment checklist, rollback procedures, container registry conventions, and troubleshooting commands.
      instructions: |
        # Deployment Guidelines

        Deployment procedures for AI coding agents working in this workspace.

        ## GitOps Workflow

        All deployments go through Git - never direct `kubectl apply` in production.

        ### Standard Flow
        1. Make changes to manifests in `platform/gitops/`
        2. Commit and push to appropriate branch
        3. Flux CD reconciles automatically
        4. Verify with `flux get kustomizations -A`

        ### Quick Commands
        ```bash
        # Check Flux status
        flux get kustomizations -A
        flux logs -A --follow

        # Force reconcile
        flux reconcile kustomization system -n flux-system
        flux reconcile kustomization apps -n flux-system

        # Suspend/Resume (for maintenance)
        flux suspend kustomization apps -n flux-system
        flux resume kustomization apps -n flux-system
        ```

        ## Kubernetes Clusters

        ### K3s (App Workloads)
        ```bash
        export KUBECONFIG=~/workspace/platform/gitops/.kube/k3s.yaml
        # Or use alias: kc-k3s
        ```

        ### Harvester (Infrastructure)
        ```bash
        export KUBECONFIG=~/workspace/platform/gitops/.kube/harvester-admin.yaml
        # Or use alias: kc-harv
        ```

        ## Deployment Checklist

        - [ ] Image version is pinned (no `:latest`)
        - [ ] Resource limits/requests are set
        - [ ] Health probes configured (liveness/readiness)
        - [ ] Secrets are encrypted with SOPS
        - [ ] Ingress/Service configured correctly
        - [ ] Monitoring/alerting in place

        ## Rollback Procedures

        ```bash
        # View deployment history
        kubectl rollout history deployment/<name> -n <namespace>

        # Rollback to previous version
        kubectl rollout undo deployment/<name> -n <namespace>

        # Rollback to specific revision
        kubectl rollout undo deployment/<name> --to-revision=<N> -n <namespace>
        ```

        ## Container Registry

        - Registry: `registry.harbor.lan/library/<service>:<tag>`
        - Push after build: `make docker push`
        - Always use semantic versioning for tags

        ## Troubleshooting

        ```bash
        # Check pod status
        kubectl get pods -n <namespace>
        kubectl describe pod <pod-name> -n <namespace>

        # View logs
        kubectl logs -f deployment/<name> -n <namespace>

        # Events (sorted by time)
        kubectl get events -n <namespace> --sort-by=.lastTimestamp
        ```

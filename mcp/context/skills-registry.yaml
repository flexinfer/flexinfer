  - name: platform-config-sync
    categories: [mcp, configuration]
    common:
      description: |
        Manage MCP configs and generated skills across Codex, Claude, Kilocode, Gemini, VS Code, and Antigravity. Use to prevent drift and ensure workflow changes propagate consistently across tools.
      instructions: |
        # Platform Configuration Sync

        Manage MCP server configs and generated skills from a single registry source of truth.

        ## Supported Platforms

        | Platform | Config Format | Repo Path | Home Path |
        |----------|---------------|-----------|-----------|
        | VS Code | JSON | `.vscode/mcp.json` | `~/Library/.../Code/User/mcp.json` |
        | Antigravity | JSON | `.antigravity/mcp.json` | `~/.antigravity/mcp.json` |
        | Gemini | JSON | `.gemini/settings.json` | `~/.gemini/settings.json` |
        | Claude | JSON | `.claude/mcp.json` | `~/.claude/mcp.json` |
        | Codex | TOML | `.codex/config.toml` | `~/.codex/config.toml` |
        | Kilocode | TOML | `.kilocode/config.toml` | `~/.kilocode/config.toml` |

        ## Quick Commands

        ### Check Sync Status
        ```bash
        loom sync status
        ```
        Shows sync status for all platforms: in-sync, drift, or missing.

        ### Validate + Generate Skills
        ```bash
        loom generate skills --registry mcp/context/skills-registry.yaml --validate
        loom generate skills --target all --registry mcp/context/skills-registry.yaml --workspace . --codex-home ./.codex
        ```

        ### Audit Skill Sources
        ```bash
        find mcp/skills -type f -path '*/scripts/*' -exec stat -f '%Sp %N' {} \;
        find mcp/skills -type d -name '__pycache__'
        ```
        Every script with a shebang should be executable; compiled cache artifacts should not be kept in source-controlled skill trees.

        ### Sync All Platforms
        ```bash
        for profile in vscode antigravity codex claude gemini kilocode opencode zed; do
          loom sync "$profile" --regen --hub-mode --all-projects --skip-worktrees
        done
        loom sync skills all
        ```

        ### Sync Single Platform
        ```bash
        loom sync vscode --regen --hub-mode --all-projects --skip-worktrees       # VS Code
        loom sync antigravity --regen --hub-mode --all-projects --skip-worktrees  # Antigravity/Windsurf
        loom sync gemini --regen --hub-mode --all-projects --skip-worktrees       # Gemini CLI
        loom sync claude --regen --hub-mode --all-projects --skip-worktrees       # Claude Code
        loom sync codex --regen --hub-mode --all-projects --skip-worktrees        # Codex CLI
        loom sync kilocode --regen --hub-mode --all-projects --skip-worktrees     # Kilocode
        ```

        ## VS Code Extension Commands (Loom)

        If using VS Code or Antigravity with Loom extension:

        | Command | Description |
        |---------|-------------|
        | `Loom: Show Platform Configs` | Refresh platform status view |
        | `Loom: Sync Platform Config` | Sync single platform |
        | `Loom: Sync All Platforms` | Sync all enabled platforms |
        | `Loom: Show Sync Dashboard` | Visual sync status grid |
        | `Loom: Diff Platform Config` | Compare repo vs home diff |

        ## Workflow

        1. **Validate registries** (`registry.yaml` and `skills-registry.yaml`)
        2. **Audit skill-source hygiene** (scripts executable, no cache artifacts, paths resolve)
        3. **Generate skills + configs**
        4. **Sync profiles and repo-local project trees**
        5. **Verify drift-free status**
        6. **Smoke critical workflows** (agent context, codebase memory, gitlab CI polling)

        ## Registry Location

        Canonical MCP server definitions are in:
        ```
        mcp/context/registry.yaml
        ```

        Canonical skill definitions are in:
        ```
        mcp/context/skills-registry.yaml
        ```

        Edit registries, then regenerate + sync for all platforms.

        ## Troubleshooting

        ### Config Drift
        If `loom sync status` shows drift:
        ```bash
        loom sync <profile> --regen --hub-mode --all-projects --skip-worktrees
        ```

        ### Skills Not Updated In One Platform
        Regenerate + resync skills:
        ```bash
        loom generate skills --target all --registry mcp/context/skills-registry.yaml --workspace . --codex-home ./.codex
        loom sync skills all
        ```
        If repo-local platform trees are also used, rerun:
        ```bash
        for profile in codex claude gemini kilocode opencode zed vscode antigravity; do
          loom sync "$profile" --regen --hub-mode --all-projects --skip-worktrees
        done
        ```

        ### Missing Secrets
        Secrets use `${keychain:KEY}` or `${env:VAR}` patterns. Ensure:
        - Environment variables are set in shell profile
        - Keychain items exist: `security find-generic-password -a $USER -s KEY`

        ### Binary Not Found
        Build loom CLI if missing:
        ```bash
        cd services/loom-core && make build
        ```
      scripts: []
      references: []
      assets: []
      always_allow: []
    targets:
      codex:
        enabled: true
        type: skill
      claude:
        enabled: true
        type: command
        output_format: markdown
      kilocode:
        enabled: true
        type: rule
      gemini:
        enabled: true

  - name: parallel-slice-ship
    categories: [workflow, development, coordination, planning]
    common:
      description: |
        Plan multiple simultaneous implementation slices from a prompt, spawn parallel sub-agents to implement each slice in isolated worktrees, then integrate into a single MR and ship. Use for large features that decompose into independent parallel work streams.
      instructions: |
        # Parallel Slice Ship

        Decompose a feature into independent slices, implement them in parallel using sub-agents, merge results, and ship.

        ## When to Use

        - Feature naturally splits into 2-5 independent implementation slices
        - Each slice touches different files/packages (minimal merge conflicts)
        - Total work exceeds what one agent can do efficiently in sequence
        - User wants maximum throughput on a well-understood task

        ## When NOT to Use

        - Slices have tight interdependencies (use sequential `feature-dev` instead)
        - Fewer than 2 slices (use `small-change-loop`)
        - Requirements are unclear (use `plan-loom-core` first)
        - Single-file changes (overkill)

        ## Phase 1: Plan Slices

        1. **Understand the prompt**
           - Recall prior context: `agent_context__agent_recall`
           - Check codebase state: `codebase_memory__codebase_search`
           - Read relevant files to understand boundaries

        2. **Decompose into slices**
           - Each slice MUST be independently implementable and testable
           - Each slice gets its own branch and worktree
           - Document per-slice: goal, files to touch, acceptance criteria, estimated complexity
           - Identify shared interfaces (types, APIs) that must be agreed upon before parallel work

        3. **Write the plan**
           - Output a structured plan with numbered slices
           - For each slice: title, description, files, branch name, test strategy
           - Identify the integration order (which slices merge first)
           - Get user approval before spawning agents

        ## Phase 2: Spawn Parallel Agents

        Each slice gets an isolated agent with its own worktree:

        ```
        For each slice:
          1. agent_worktree_allocate(branch_name="feat/<feature>-slice-<N>", base_branch=main)
          2. Spawn sub-agent with slice context:
             - Slice goal and acceptance criteria
             - Files to modify
             - Shared interface contracts
             - Test requirements
          3. Sub-agent implements, tests locally, commits
        ```

        ### Waiting and Monitoring

        - Monitor all sub-agents for completion
        - If a sub-agent fails: diagnose, provide guidance, or reassign
        - Collect results as each agent completes

        ## Phase 3: Integrate and Land

        1. **Merge slices into integration branch**
           - Create `feat/<feature>` integration branch from main
           - Merge each slice branch in dependency order
           - Resolve any merge conflicts (should be minimal if slices were independent)

        2. **Run full test suite**
           - Verify combined changes pass all tests
           - Fix integration issues in the integration branch

        2.5. **Self-Review** — before landing, review the combined diff against the `pr-self-review` checklist (diff size, debug artifacts, secrets, scope, tests, commit format). Fix any issues first.

        3. **Landing Procedure**
           a. Push integration branch (`-u` if first push)
           b. Create MR/PR from integration branch to main with all slice summaries in description
              (check existing MRs for same source branch first; never create duplicates)
           c. Request auto-merge
              - GitLab: `gitlab__merge_merge_request(auto_merge=true, sha=<HEAD>)`
              - GitHub: `gh pr merge --auto --squash`
           d. Poll pipeline to terminal state; if red → fix → re-push → re-poll
           e. Confirm merged or document blocker

           Do not ask the user before committing, pushing, creating MRs, or merging.
           Only pause on failures, blockers, or when the user explicitly requests a stop.

        ## Phase 4: Post-Merge Cleanup

        1. Delete remote branches: `git push origin --delete <branch>` for integration + all slice branches
        2. Release all worktrees: `agent_worktree_release(agent_id=..., worktree_id=..., remove_worktree=true)` for each slice
        3. Delete local branches: `git branch -d <branch>` for all slice branches
        4. End sub-agent sessions
        5. Record decisions and outcomes in agent context
        6. End session: `agent_session_end(session_id=..., summarize=true)`

  - name: code-review
    categories: [development, quality]
    common:
      description: |
        Code review workflow: prioritize defects/regressions, verify test coverage, and produce severity-ordered findings with clear evidence.
      instructions: |
        # Code Review

        Use a findings-first review style focused on correctness and risk.

        ## Output Contract

        1. Findings first, ordered by severity.
        2. Each finding includes file path + line reference + impact.
        3. Summaries come after findings.
        4. If no findings, state that explicitly and call out residual risk/testing gaps.

        ## Review Loop

        1. Understand intent (ticket/spec/PR description).
        2. Diff scan for behavior changes and contract/API shifts.
        3. Validate tests and hook coverage for changed paths.
        4. Check security/performance/concurrency/error-handling risks.
        5. Produce concise remediation guidance per finding.

        ## Security Review

        - [ ] Input validation on all user-supplied data
        - [ ] No SQL injection vectors (parameterized queries used)
        - [ ] No XSS vectors (output encoding in place)
        - [ ] Authentication checks present where needed
        - [ ] Authorization verified (not just authentication)
        - [ ] No hardcoded secrets, tokens, or credentials
        - [ ] Sensitive data not logged
        - [ ] Rate limiting on public endpoints

        ## Performance Review

        - [ ] No N+1 query patterns
        - [ ] Database queries use appropriate indexes
        - [ ] Large result sets paginated
        - [ ] Caching used where appropriate
        - [ ] No unnecessary memory allocations in hot paths
        - [ ] Connection pooling for external services
        - [ ] Timeouts set on all external calls

        ## Code Quality

        - [ ] Functions follow single responsibility principle
        - [ ] No code duplication (DRY principle)
        - [ ] Clear, descriptive naming conventions
        - [ ] Error handling is complete (no swallowed errors)
        - [ ] Error messages are actionable
        - [ ] No TODO/FIXME without tracking issue
        - [ ] Dead code removed

        ## Testing

        - [ ] Unit tests cover new/changed logic
        - [ ] Edge cases tested (empty, nil, boundary values)
        - [ ] Error paths tested
        - [ ] Integration tests for API changes
        - [ ] Test assertions are specific (not just "no error")
        - [ ] Existing hooks/lint checks would catch the same class of issue in future

        ## Documentation

        - [ ] Public APIs documented
        - [ ] Complex logic has explanatory comments
        - [ ] README updated if behavior changes
        - [ ] CHANGELOG entry added

        ## Go-Specific

        - [ ] Errors wrapped with context (`fmt.Errorf("...: %w", err)`)
        - [ ] Context propagated for cancellation
        - [ ] Goroutine leaks prevented (proper cleanup)
        - [ ] defer used for cleanup

        ## Kubernetes-Specific

        - [ ] Resource limits and requests set
        - [ ] Image version pinned (not :latest)
        - [ ] Liveness and readiness probes configured
        - [ ] RBAC permissions minimal

        ## Workflow Automation

        For structured execution with session tracking and approval gates:

        ```
        agent_workflow_start(definition_id="code-review", input={
          namespace: "project/pr-123",
          agent_id: "claude-code",
          description: "Review PR #123: Add user authentication"
        })
        ```

        Workflow file: `.agents/workflows/code-review.yaml`

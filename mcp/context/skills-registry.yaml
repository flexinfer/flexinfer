  - name: ci-failure-recovery
    categories: [workflow, ci-cd, debugging]
    common:
      description: |
        CI failure recovery loop: inspect the latest failing pipeline, classify the break, reproduce locally when possible, land the smallest fix, and re-poll to green.
      instructions: |
        # CI Failure Recovery

        Use this when the code is pushed but the branch is not actually shippable because CI is failing.

        ## Outcome

        Resolve or classify the failure with:
        - failing job and root-cause summary
        - local reproduction status
        - minimal corrective change or explicit external blocker
        - updated pipeline status
        - clear next step: `ci-green-merge-loop`, flaky quarantine, or infra escalation

        ## Guardrails Up Front

        - Treat pre-existing dirty-worktree changes as baseline context unless they overlap the failing area.
        - Prefer the smallest decisive failing gate, not the full suite, for first reproduction.
        - Do not hide a likely flaky test with blanket retries in the main gate.
        - If the default branch or runners are already unhealthy, stop code churn and document the blocker.

        ## Failure Taxonomy

        Classify the failure before changing code:
        1. test regression
        2. lint/static check failure
        3. build/package/toolchain failure
        4. environment, runner, or dependency outage
        5. confirmed or probable flake

        ## Standard Loop

        1. **Find the decisive pipeline**
           - GitLab: `gitlab__list_pipelines`, `gitlab__pipeline_summary`, `gitlab__poll_pipeline`
           - GitHub: inspect PR/check status with the configured repo tooling
           - If the repo runs both branch and merge-request pipelines, treat the MR pipeline as merge-deciding.
        2. **Pick the earliest causal failure**
           - start with the first failed or blocked job in dependency order
           - do not fix downstream noise before the root failure
        3. **Pull actionable evidence**
           - `gitlab__get_job_trace`
           - `gitlab__get_test_report`
           - failed job artifacts when available
        4. **Decide repo-local vs flaky vs infra**
           - repo-local: the failure follows the branch content and is reproducible or strongly explained by code/config
           - flaky: reruns clear the failure without a code reason, or logs point to timing/shared-state instability
           - infra: runners, package registries, external services, or the default branch are unhealthy
        5. **Reproduce the narrowest equivalent gate locally**
           - run the nearest local/devbox command to confirm the failure
           - if exact reproduction is impossible, reproduce the smallest equivalent gate
        6. **Fix minimally**
           - avoid opportunistic cleanup while CI is red
           - rerun the relevant local gate before pushing
        7. **Handle flakes explicitly**
           - confirm with a focused rerun or recent pipeline history
           - quarantine the flaky test or gate if the repo supports that pattern
           - leave ownership plus a follow-up fix path instead of silently retrying forever
        8. **Escalate into shipping mode**
           - once the fix is repo-local and ready to land, switch to `ci-green-merge-loop`
           - keep `ci-failure-recovery` focused on triage and the first corrective iteration

        ## Decision Rule

        - if the failure is clearly repo-local, keep iterating in the same branch
        - if the failure is platform-wide or runner-related, stop code churn and document the infra blocker
        - if multiple jobs fail, fix the earliest causal failure first
        - if the failure is a real flake, quarantine or de-gate it with an owner and expiry plan

        ## Session Tracking

        Record failure analysis for resumability:
        - `agent_session_start(namespace="<repo>/ci-recovery", description="CI failure triage on <branch>")`
        - `agent_context_add(entries=[{entry_type: "finding", title: "CI failure classification", content: "..."}])`
        - `agent_session_end(summarize=true)` when handing off to `ci-green-merge-loop`

        ## Research Notes

        See `references/workflow.md` for current GitLab merge-safety patterns and flaky-test handling ideas.
      scripts: []
      references:
        - workflow.md
      assets: []
      always_allow: []
    targets:
      codex:
        enabled: true
        type: skill
        instructions_append: |

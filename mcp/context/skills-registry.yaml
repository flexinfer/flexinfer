        type: command
        output_format: markdown

  - name: tech-debt-backlog-dev-loop
    categories: [workflow, development]
    common:
      description: |
        Execute technical debt backlog items in a repeatable dev loop: pick highest-value debt slice, implement safely, verify quality, and close with context-rich reporting.
      instructions: |
        # Tech Debt Backlog Dev Loop

        Use this loop to execute one technical debt item at a time with strong safety rails and measurable outcomes.

        ## Loop Outcome

        Deliver one debt slice with:
        - behavior preserved or intentionally changed with tests
        - local quality gates passing
        - CI status verified
        - debt backlog item updated with before/after impact

        ## Step 1: Select Next Debt Slice

        Prefer ranking from `tech-debt-planning`; otherwise select by:
        - highest `(priority_score / effort)` first
        - if tied, choose item with highest operational risk
        - if still tied, choose smallest shippable slice

        Use `assets/templates/debt-item-checklist.md` to confirm scope and acceptance criteria before coding.

        ## Step 1.5: Branch Isolation (Worktree)

        Create an isolated worktree for this debt item:
        - call `agent_worktree_allocate(agent_id=<id>, session_id=<session>, branch_name="debt/<item-id>", base_branch="main", purpose="Deliver debt item <id>")`
        - work exclusively in the returned `worktree_path`
        - this prevents dirty-worktree conflicts with other agents or pre-existing changes
        - the worktree is automatically cleaned up when the session ends (TTL/orphan reconciler)

        ## Step 2: Start Execution Context

        - `agent_session_start(namespace="<repo>/tech-debt-loop", description="Deliver debt item <id>")`
        - `agent_recall(query="<id> <component>", scope="context")`
        - `agent_task_add(...)` + `agent_task_update(..., status="in_progress")`

        ## Step 3: Implement Safely

        - add a characterization/baseline test before risky refactors where possible
        - prefer incremental refactor steps over big-bang rewrites
        - avoid coupling debt cleanup with unrelated feature changes
        - log key decisions/findings with `agent_context_add(...)`

        ## Step 4: Verify Locally (Mandatory)

        Run:
        - `bash ${SKILL_PATH}/scripts/verify_local_loop.sh`

        If checks fail, fix and rerun before commit.

        ## Step 5: Landing Procedure

        Unless user asks otherwise:

        1. **Stage scoped files** — only debt-item-related files (never `.env`, credentials, or unrelated changes)
        2. **Commit with conventional format** — `fix(scope): resolve debt item <id>` or `refactor(scope): ...` + `Co-Authored-By` trailer
        3. **Push branch** — `git push origin <branch>` (`-u` if first push)
        4. **Create or reuse MR/PR**
           - Check for existing MR on the same source branch before creating a new one
           - GitLab: `gitlab__list_merge_requests(source_branch=..., target_branch=main)`
           - GitHub: `gh pr list --head <branch>`
        5. **Request auto-merge** (when project policy allows)
           - GitLab: `gitlab__merge_merge_request(auto_merge=true, sha=<HEAD>)`
           - GitHub: `gh pr merge --auto --squash`

        ## Step 6: Verify CI to Terminal State

        Run:
        - `bash ${SKILL_PATH}/scripts/verify_ci_loop.sh --provider auto --ref <branch>`

        If failed:
        - inspect failure details
        - implement minimal fix
        - rerun local verification
        - push and repoll until green or blocked

        ## Step 7: Confirm Merged + Close Item + Report

        - confirm MR is merged or queued in merge train
        - update debt backlog item status and impact notes
        - `agent_task_update(..., status="completed", resolution="...")`
        - release worktree: `agent_worktree_release(...)`
        - `agent_session_end(summarize=true)`

        Use `assets/templates/implementation-report.md` for a consistent closure note.

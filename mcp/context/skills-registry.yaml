  - name: feature-dev
    categories: [development, workflow]
    common:
      description: |
        Standard feature development loop with session tracking, worktree allocation, sandbox testing, and commit/push gates. Use for any multi-file feature implementation. Ship without asking: commit, push, create MR, and request auto-merge automatically. Only pause on failures or explicit user stop. After merge, auto-cleanup: delete remote branch, release worktree, delete local branch.
      instructions: |
        # Feature Development

        Standard feature development loop with enforced session tracking, worktree isolation, and quality gates.

        ## When to Use

        - Implementing a new feature that touches multiple files
        - Any change that benefits from worktree isolation
        - Work that should be tracked across sessions

        ## Execution Guardrails

        - Treat a dirty worktree as baseline context unless the current files conflict directly with your change.
        - Stage and commit only the files for the active feature slice.
        - Prefer non-interactive git commands and keep the branch/worktree naming aligned with the feature scope.
        - Do not stop at code changes; carry the loop through validation, push, and CI verification unless the user explicitly pauses it.

        ## Workflow Steps

        1. **Initialize session** — `agent_session_start(namespace="<repo>/feat/<name>", description="...")`; recall prior context with `agent_recall`
        2. **Allocate worktree** — `agent_worktree_allocate(branch_name="feat/<name>", base_branch="main", purpose="...")`
        3. **Implement** — write code in the worktree (approval gate)
        4. **Sandbox test** — run tests via devbox
        5. **Pre-commit checks** — lint, fmt, hooks
        5.5. **Self-Review** — before landing, review your diff against the `pr-self-review` checklist (diff size, debug artifacts, secrets, scope, tests, commit format). Fix any issues first.
        6. **Landing Procedure**
           a. Stage only files for the active task (never `.env`, credentials, or unrelated changes)
           b. Commit with conventional format: `type(scope): description` + `Co-Authored-By` trailer
           c. Push branch (`-u` if first push)
           d. Create or reuse MR/PR (check existing MRs for same source branch first; never create duplicates)
              - GitLab: `gitlab__list_merge_requests(source_branch=..., target_branch=main)`
              - GitHub: `gh pr list --head <branch>`
           e. Request auto-merge
              - GitLab: `gitlab__merge_merge_request(auto_merge=true, sha=<HEAD>)`
              - GitHub: `gh pr merge --auto --squash`
           f. Poll pipeline to terminal state; if red → fix → re-commit → re-push → re-poll
           g. Confirm merged or document blocker

           Do not ask the user before committing, pushing, creating MRs, or merging.
           Only pause on failures, blockers, or when the user explicitly requests a stop.

        7. **Post-Merge Cleanup**
           a. Delete remote branch: `git push origin --delete <branch>`
           b. Release worktree: `agent_worktree_release(agent_id=..., worktree_id=..., remove_worktree=true)`
           c. Delete local branch: `git branch -d <branch>`
           d. End session: `agent_session_end(session_id=..., summarize=true)`

        ## Quick Start

        ```
        agent_workflow_start(definition_id="feature-dev", input={
          namespace: "project/feature-branch",
          agent_id: "claude-code",
          description: "Add user authentication",
          branch_name: "feat/user-auth",
          base_branch: "main"
        })
        ```

        ## Input Parameters

        | Parameter | Required | Description |
        |-----------|----------|-------------|
        | `namespace` | Yes | Session namespace (e.g., `project/feature-branch`) |
        | `agent_id` | Yes | Agent identifier (e.g., `claude-code`) |
        | `description` | Yes | Feature description |
        | `branch_name` | Yes | Git branch name (`feat/<name>`) |
        | `base_branch` | No | Base branch (default: `main`) |

        Workflow file: `.agents/workflows/feature-dev.yaml`

  - name: project-patterns
    categories: [development]
    common:
      description: |
        Project structure patterns for the workspace: enterprise repository layout, service architecture (DDD, Event-Driven), Kubernetes deployment patterns, CI/CD pipelines, observability, and security patterns.
      instructions: |
        # Project Patterns

        ## Repository Structure

        Standard multi-project layout:
        ```
        project/
        ├── infrastructure/      # IaC (Terraform, Ansible)
        ├── kubernetes/          # K8s manifests, Helm charts
        ├── services/            # Microservices
        ├── libraries/           # Shared libraries
        ├── tools/               # Development tools
        └── docs/                # Documentation
        ```

        ## Service Architecture

        - **Domain-Driven Design**: domain/, application/, infrastructure/ layers
        - **Event-Driven**: Use event bus for cross-service communication
        - **CQRS**: Separate read/write models where needed

        ## Kubernetes Patterns

        - **GitOps with Flux**: Edit manifests, commit, reconcile. Never kubectl edit.
        - **Kustomize structure**: base/ + overlays/ per environment
        - **Helm charts**: Chart.yaml + values.yaml + templates/
        - Pin image versions (never :latest)
        - Always set resource limits/requests
        - Use `storageClass: longhorn` for PVCs

        ## CI/CD Patterns

        - Automated testing gates before deploy
        - Security scanning in pipeline (container + dependency)
        - Blue-green or canary deployments
        - Rollback procedures documented

        ## Observability

        - Structured logging (JSON format)
        - Prometheus metrics with ServiceMonitor CRDs
        - Distributed tracing (OpenTelemetry)
        - Grafana dashboards per service

        ## Security Patterns

        - Zero trust: authenticate all service-to-service calls
        - Secrets via SOPS + age encryption or external secret operators
        - Network policies for pod isolation
        - RBAC with principle of least privilege

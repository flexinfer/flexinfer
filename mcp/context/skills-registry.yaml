  - name: plan-loom-core
    categories: [planning, research]
    common:
      description: |
        Planning + working-context workflow: gather workspace/repo information, validate MCP/runtime capabilities, establish codebase index/search readiness, and produce standardized Markdown context/spec/plan docs in `.loom/`.
      instructions: |
        # Plan Loom Core

        ## Overview

        Create and maintain an evidence-backed "Loom Context Pack" (usually in `.loom/`) so planning, research, specs, and implementation stay consistent, reviewable, and shareable across agents.

        ## Quick Start

        1. Initialize templates into `.loom/`:
           - `python ${SKILL_PATH}/scripts/init_loom_context.py --root .`
        2. Generate a workspace snapshot:
           - `python ${SKILL_PATH}/scripts/workspace_snapshot.py --root .`
        3. Validate codebase indexing/search baseline:
           - `codebase_memory__codebase_stats`
           - If missing/stale: `codebase_memory__codebase_index_start` + `codebase_memory__codebase_index_poll`
           - Capture index state in `.loom/00-mcp-inventory.md` and `.loom/30-implementation-plan.md`
        4. Detect runtime mode and inventory MCP tools (in `.loom/00-mcp-inventory.md`):
           - Prefer loom-mode inventory via `loom://config`, `loom://servers`, and `loom://tools/*`
           - Fallback to per-server MCP resource/template discovery when loom proxy is not present
        5. Fill in the docs you need:
           - Research: `.loom/10-research.md`
           - Product spec: `.loom/20-product-spec.md`
           - Implementation plan: `.loom/30-implementation-plan.md`

        ## Workflow Decision Tree

        - If the user asks for "plan this", "write a spec", "research approaches", or "establish context":
          - Create/refresh `.loom/` templates and generate a workspace snapshot.
          - Verify index/search readiness and note gaps.
          - Add/refresh MCP inventory.
          - Produce (or update) the relevant standardized doc(s) and keep sources updated.
        - If the user asks "what's in this workspace/repo?":
          - Generate/update `.loom/00-workspace-snapshot.md` first, then summarize.
        - If the user asks to "use loom tools" / "use MCP tools":
          - Start with `.loom/00-mcp-inventory.md` so tool choices are sourced.

        ## Document Standards (Sourcing)

        Follow `references/doc-standards.md`:
        - Use sources for non-trivial claims: `path/to/file.ext:line`, exact commands run, and URLs.
        - Prefer stable, reproducible references; separate facts from assumptions.

        ## MCP Inventory Workflow (Loom-Mode Aware)

        1. Detect runtime mode:
           - Call `functions.list_mcp_resources` with no `server`.
           - Call `functions.list_mcp_resource_templates` with no `server`.
           - If top-level loom resources/templates are present (`loom://config`, `loom://servers`, `loom://tools/index`), treat this as loom-mode.
        2. If loom-mode is active, inventory through loom proxy resources:
           - `functions.read_mcp_resource(server="loom", uri="loom://config")`
           - `functions.read_mcp_resource(server="loom", uri="loom://servers")`
           - `functions.read_mcp_resource(server="loom", uri="loom://tools/index")`
           - Use `totalPages` from index, then read each page:
             - `loom://tools/page/{page}`
           - For server-specific deep dives, read:
             - `loom://tools/server/{server}/page/{page}`
        3. If loom-mode is not active, inventory directly per server:
           - `functions.list_mcp_resources(server=...)`
           - `functions.list_mcp_resource_templates(server=...)`
           - `functions.read_mcp_resource(server=..., uri=...)` for relevant entries.
        4. If MCP resource APIs are restricted/unavailable, use CLI fallback:
           - `loom tools list --json`
           - `loom tools list --json --server <server> --page <n> --limit <n>`
        5. Capture findings in `.loom/00-mcp-inventory.md`:
           - Runtime mode detection, server inventory, tool counts by server, paged capture strategy, auth/permission constraints, codebase index readiness, and delegation plan rationale.

        ## Core Workflow Packs to Design

        When planning skill/workflow upgrades, explicitly cover:
        1. Research loop (local index + external validation)
        2. Technical writing loop (source-backed docs/specs)
        3. Testing + ship loop (hooks/tests/lint, commit/push, CI monitor/fix)
        4. Troubleshooting loop (triage/investigate/mitigate with handoff-ready context)
        5. Coordination loop (agent presence, task lifecycle, session summaries)
      scripts:
        - name: init_loom_context.py
          path: scripts/init_loom_context.py
          description: Initialize .loom/ directory with templates
        - name: workspace_snapshot.py
          path: scripts/workspace_snapshot.py
          description: Generate workspace structure snapshot
      references:
        - doc-standards.md
      assets:
        - templates/00-index.md
        - templates/00-mcp-inventory.md
        - templates/10-research.md
        - templates/20-product-spec.md
        - templates/30-implementation-plan.md
        - templates/50-worklog.md
      always_allow:
        # init_loom_context.py is safe: skips existing files by default,
        # only overwrites with explicit --force.
        - init_loom_context.py
        - workspace_snapshot.py
    targets:
      codex:
        enabled: true
        type: skill
        instructions_append: |
          ## Codex Delegation Addendum

          - In collaboration mode, shard inventory work in parallel where safe:
            - server groups, tool page ranges, or deep-dive sections.
          - Use `multi_tool_use.parallel` for concurrent read-only inventory calls.
          - Keep one coordinator thread that merges slices into `.loom/00-mcp-inventory.md` and de-duplicates findings.
          - Prefer loom-mode paged endpoints to avoid truncation and top-level tool under-reporting.
      claude:
        enabled: true
        type: command
        output_format: markdown
        instructions_append: |
          ## Claude Delegation Addendum

          - Use `Task`-based subagent delegation for server-group sharding when inventory is large.
          - Assign each subagent a bounded slice (specific servers or page ranges), then aggregate into one normalized inventory doc.
          - Keep a short reconciliation pass to resolve overlaps and confirm permissions/auth constraints.
      kilocode:
        enabled: true
        type: rule
        instructions_append: |
          ## Kilocode Delegation Addendum

          - Prefer staged delegation through workflow/rule phases:
            - Phase 1: runtime detection + server list
            - Phase 2: paged tool capture by shard
            - Phase 3: synthesis + decision notes
          - Keep each phase checkpointed so a partial run can resume without redoing completed slices.
      gemini:
        enabled: true
        type: skill
        instructions_append: |
          ## Gemini Planning Addendum
      antigravity:
        enabled: true
        type: command
        output_format: markdown

          - Use checkpointed phased decomposition even when explicit subagent primitives are unavailable.
          - Break inventory into deterministic slices (mode detection, summary, paged deep dives, constraints) and validate each checkpoint before proceeding.
          - Record assumptions explicitly when delegation primitives are unavailable in the active runtime.

  - name: polyglot-release-bumper
    categories: [ci-cd, development]
    common:
      description: |
        Prepare and ship releases across Go/Python/Node repos: detect project type, run the right test/lint/build commands, bump versions in pyproject.toml/package.json when applicable, and execute commit/tag/push with a standardized checklist. Use when asked to bump versions, cut a release, update changelogs, or publish.
      instructions: |
        # Polyglot Release Bumper

        Standardize a safe release routine across repos that don't share one build system.

        ## Quick Start

        - Detect project type(s) and suggested commands:
          - `python ${SKILL_PATH}/scripts/detect_project.py --root .`
        - Bump versions (Python/Node only) with preview:
          - `python ${SKILL_PATH}/scripts/bump_version.py --root . --bump patch --dry-run`
        - Apply the bump:
          - `python ${SKILL_PATH}/scripts/bump_version.py --root . --bump patch`

        ## What Gets Updated

        - `pyproject.toml`: first `version = "X.Y.Z"` found under `[project]` or `[tool.poetry]`
        - `package.json`: top-level `"version"`
        - Go modules (`go.mod`): usually tag-only (no file bump); ship via `git tag vX.Y.Z`

        ## Core Workflow

        1. Confirm clean working tree; pull latest.
        2. Run tests/lint/build for the repo.
        3. Bump version (if applicable).
        4. Update changelog / release notes (repo conventions).
        5. Commit, tag, push.
        6. Verify CI pipeline.

        ## References / Templates

        - Workflow notes: `references/workflow.md`
        - Checklist: `assets/templates/release-checklist.md`
      scripts:
        - name: detect_project.py
          path: scripts/detect_project.py
          description: Detect project types and suggest commands
        - name: bump_version.py
          path: scripts/bump_version.py
          description: Bump version in pyproject.toml or package.json
      references:
        - workflow.md
      assets:
        - templates/release-checklist.md
      always_allow:
        - detect_project.py
    targets:
      codex:
        enabled: true
        type: skill
      claude:
        enabled: true
        type: command
        output_format: markdown
      kilocode:
        enabled: true
        type: rule
      gemini:
        enabled: true
        type: skill
      antigravity:
        enabled: true
        type: command
        output_format: markdown

  - name: workspace-branding-maintenance
    categories: [operations, gitlab]
    common:
      description: |
        Standardize repo branding across a multi-repo workspace: ensure assets/banner.png + assets/icon.png and README banner references using libs/banner-kit, and keep the services public allowlist consistent. Use when repos are missing branding assets, banners drift, or GitLab metadata/visibility needs alignment.
      instructions: |
        # Workspace Branding Maintenance

        Use `libs/banner-kit` as the canonical implementation for generating and fixing workspace branding and related GitLab metadata.

        ## Quick Start

        - Scan for missing assets / README banner drift:
          - `python ${SKILL_PATH}/scripts/scan_branding.py --root .`
        - Run banner-kit maintenance in dry-run mode (default):
          - `bash ${SKILL_PATH}/scripts/run_workspace_branding.sh . --stash`
        - Apply changes (explicit opt-in):
          - `APPLY=1 bash ${SKILL_PATH}/scripts/run_workspace_branding.sh . --stash`

        ## Core Workflow

        1. Identify drift with `scan_branding.py` and/or banner-kit `--dry-run`.
        2. Confirm allowlist behavior:
           - `libs/banner-kit/scripts/workspace_public_services.txt`
        3. Apply changes only after previewing.

        ## Notes / Constraints

        - The source script may commit/push and update GitLab project metadata; always start with `--dry-run`.
        - `libs/*` repos are public by default; `services/*` repos are private by default unless allowlisted.
      scripts:
        - name: scan_branding.py
          path: scripts/scan_branding.py
          description: Scan for missing branding assets
        - name: run_workspace_branding.sh
          path: scripts/run_workspace_branding.sh
          description: Run banner-kit workspace maintenance

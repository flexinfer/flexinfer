        instructions_append: |
          ## Claude Sub-Agent Delegation

          Use the Task tool for parallel slice execution:

          ```
          # Launch all slice agents in a SINGLE message with multiple Task tool calls:
          Task(subagent_type="general-purpose", prompt="Implement slice 1: ...", isolation="worktree")
          Task(subagent_type="general-purpose", prompt="Implement slice 2: ...", isolation="worktree")
          Task(subagent_type="general-purpose", prompt="Implement slice 3: ...", isolation="worktree")
          ```

          - Use `isolation: "worktree"` so each agent gets its own git worktree
          - Launch ALL slice agents in a single message for true parallelism
          - Each agent returns its worktree path and branch name
          - After all complete, integrate branches in the main conversation
          - Use `subagent_type="general-purpose"` for implementation work
          - Use `subagent_type="Plan"` for the initial slice decomposition if complex
      kilocode:
        enabled: true
        type: workflow
        instructions_append: |
          ## Kilocode Phased Execution

          Execute slices as sequential phases with checkpoints:

          1. **Phase 1**: Plan all slices (checkpoint: plan approved)
          2. **Phase 2-N**: Implement each slice sequentially with worktree isolation
          3. **Phase N+1**: Integrate and ship

          Use `agent_worktree_allocate` for isolation between phases.
          Checkpoint between each phase for partial-run resumption.
      gemini:
        enabled: true
        type: skill
        instructions_append: |
          ## Gemini Phased Execution

          Without native sub-agent delegation, execute slices as checkpointed phases:

          1. Plan all slices with explicit boundaries
          2. Implement each slice sequentially in its own worktree
          3. Validate each slice checkpoint before proceeding
          4. Integrate all slices and ship

          Use `agent_worktree_allocate` for branch isolation.
          Record progress explicitly so each phase can resume independently.

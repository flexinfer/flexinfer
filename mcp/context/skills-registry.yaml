  - name: mcp-registry-ops
    categories: [mcp, configuration, operations]
    common:
      description: |
        Edit and operate MCP registry.yaml (especially mcp/context/registry.yaml): validate registry changes, manage per-server allowlists (always_allow), and generate MCP client configs and hub manifests via loom-core's loom CLI. Use when updating MCP servers, hub deployments, gateway registry, or Codex/VSCode/Kilo configs.
      instructions: |
        # MCP Registry Ops

        Maintain the workspace's canonical MCP server registry and regenerate downstream artifacts (client configs + hub manifests) safely and repeatably.

        ## Quick Start (Workspace Layout)

        - Find the registry:
          - `python ${SKILL_PATH}/scripts/registry_discover.py --root .`
        - Generate client configs (preview by default, --apply to write):
          - `bash ${SKILL_PATH}/scripts/loom_generate_configs.sh . --target all --output-dir generated/mcp --hub-mode`
          - `bash ${SKILL_PATH}/scripts/loom_generate_configs.sh . --target all --output-dir generated/mcp --hub-mode --apply`
        - Generate hub manifests (preview by default, --apply to write):
          - `bash ${SKILL_PATH}/scripts/loom_generate_manifests.sh . --output-dir platform/gitops/k3s/loom-hub/servers`
          - `bash ${SKILL_PATH}/scripts/loom_generate_manifests.sh . --output-dir platform/gitops/k3s/loom-hub/servers --apply`

        ## Core Workflow

        ### 1) Edit `registry.yaml`

        - Prefer editing `common` first.
        - Use `targets.<platform>` only for platform-specific overrides.
        - Keep `always_allow` (auto-approve) lists minimal and intentional.

        ### 2) Update an Allowlist (always_allow)

        - Edit `common.always_allow`:
          - `python ${SKILL_PATH}/scripts/registry_allowlist_edit.py --registry mcp/context/registry.yaml --server gitlab --scope common --add create_issue`
        - Edit `targets.<target>.always_allow`:
          - `python ${SKILL_PATH}/scripts/registry_allowlist_edit.py --registry mcp/context/registry.yaml --server gitlab --scope target:codex --set verify_token list_projects`

        Use `--dry-run` to preview and `--sort` to normalize.

        ### 3) Generate Configs / Manifests

        - Generate client configs:
          - `bin/loom generate configs --registry mcp/context/registry.yaml --target all --output-dir generated/mcp --hub-mode`
        - Generate hub manifests:
          - `bin/loom generate manifests --registry mcp/context/registry.yaml --output-dir platform/gitops/k3s/loom-hub/servers`
        - Sync all platform configs (hub mode, all projects, skip nested worktrees):
          - `for profile in vscode antigravity codex claude gemini kilocode; do bin/loom sync "$profile" --regen --hub-mode --all-projects --skip-worktrees; done`
          - `bin/loom sync skills all`

        If `bin/loom` doesn't exist, build it:
        - `cd services/loom-core && go build -o bin/loom ./cmd/loom`

        ### 4) Validate Generated Configs (Secrets Hygiene)

        - `bin/loom validate configs --dir generated/mcp`

        ### 5) Post-Sync Proxy Smoke Check

        When clients run in `loom proxy` mode (Codex/Claude default), verify the daemon surface directly after sync:

        - Reload daemon config:
          - `bin/loom reload`
        - Confirm expected tools are exposed:
          - `bin/loom tools list | rg "agent_context__agent_workflow_start|agent_context__agent_entity_add|qdrant__qdrant_delete_collection"`
        - Execute lightweight read calls:
          - `bin/loom tools call agent_context__agent_workflow_list --args '{"session_id":"<session-id>"}' --json`
          - `bin/loom tools call agent_context__agent_memory_policy_get --args '{"tier":"working"}' --json`
        - Execute reversible vector lifecycle smoke:
          - create/get/delete a temporary collection via `qdrant__qdrant_create_collection`, `qdrant__qdrant_get_collection`, and `qdrant__qdrant_delete_collection`

        ## References / Templates

        - Conventions: `references/workspace-conventions.md`
        - Change checklist: `assets/templates/registry-change-checklist.md`
      scripts:
        - name: registry_discover.py
          path: scripts/registry_discover.py
          description: Find registry.yaml in workspace
        - name: registry_allowlist_edit.py
          path: scripts/registry_allowlist_edit.py

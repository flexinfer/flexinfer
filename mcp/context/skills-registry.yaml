  - name: longhorn-gitops-ops
    categories: [kubernetes, gitops, operations]
    common:
      description: |
        Operate Longhorn storage safely via GitOps in platform/gitops, including node/disk policy changes, recurring jobs, and recovery validation for k3s/Harvester environments.
      instructions: |
        # Longhorn GitOps Ops

        Operate Longhorn through Git-backed manifests in this repository, with incident-safe handling when live mitigation is unavoidable.

        ## Quick Start

        1. From workspace root: `cd platform/gitops`
        2. Load environment: `source dev-env.sh`
        3. Capture baseline:
           - `bash ${SKILL_PATH}/scripts/longhorn_health_snapshot.sh > /tmp/longhorn-before.md`

        ## Guardrails

        - Longhorn is reconciled from `k3s/longhorn/**` via `k3s/flux/apps/kustomization.yaml`; do not treat live edits as durable state.
        - If an incident requires a live patch, mirror the same delta into Git immediately and reconcile Flux.
        - Prefer explicit node/disk policy manifests (`k3s/longhorn/node-*.yaml`) and storage class manifests (`k3s/longhorn/storageclass-*.yaml`) over ad-hoc patching.

        ## Core Workflow

        ### 1) Scope + Baseline

        - Confirm whether this is:
          - policy tuning (`settings.yaml`, `storageclass-*`)
          - node/disk scheduling (`node-*.yaml`)
          - recurring jobs / backup policy (`recurring-jobs.yaml`, `settings-backup-target.yaml`)
          - incident containment
        - Run baseline snapshot script and keep output for before/after diff.

        ### 2) Change in Git

        - Edit only under `k3s/longhorn/**` (and related references if needed).
        - If recurring-job selector behavior changes, verify corresponding StorageClass params and selectors stay aligned.
        - Commit with storage-focused message and push.

        ### 3) Reconcile

        - Trigger:
          - `flux reconcile kustomization apps -n flux-system --with-source`
        - Verify reconciliation status:
          - `kubectl -n flux-system get kustomizations`

        ### 4) Validate Outcome

        - Re-run:
          - `bash ${SKILL_PATH}/scripts/longhorn_health_snapshot.sh > /tmp/longhorn-after.md`
        - Confirm:
          - volume robustness trend improves/stabilizes
          - no repeated scheduler errors (`HardNodeAffinity`, `no available disk`)
          - no repeated replica startup failures for missing directories
        - For incident recovery, cross-check runbooks in `references/workflow.md`.

        ### 5) Persist and Handoff

        - Record decision + result in agent context.
        - If residual risk exists, create explicit follow-up tasks with owning file/path.

        ## References / Templates

        - Workflow + source links: `references/workflow.md`
        - Change checklist: `assets/templates/longhorn-change-checklist.md`
      scripts:
        - name: longhorn_health_snapshot.sh
          path: scripts/longhorn_health_snapshot.sh
          description: Generate a read-only Longhorn health snapshot for before/after verification
      references:
        - workflow.md
      assets:
        - templates/longhorn-change-checklist.md
      always_allow:
        - longhorn_health_snapshot.sh
    targets:
      codex:
        enabled: true
        type: skill
      claude:
        enabled: true
        type: command
        output_format: markdown
      kilocode:
        enabled: true
        type: workflow
      gemini:
        enabled: true
        type: skill
      antigravity:
        enabled: true
        type: command
        output_format: markdown

  - name: monitoring-gitops-ops
    categories: [kubernetes, gitops, operations]
    common:
      description: |
        Operate monitoring stack (Prometheus/Grafana/Alertmanager/Loki) via GitOps in platform/gitops, including alert rule changes, dashboard rollouts, and verification workflows.
      instructions: |
        # Monitoring GitOps Ops

        Manage monitoring changes through Git and Flux with explicit verification of alerting semantics and runtime health.

        ## Quick Start

        1. `cd platform/gitops && source dev-env.sh`
        2. Baseline:
           - `bash ${SKILL_PATH}/scripts/monitoring_health_snapshot.sh > /tmp/monitoring-before.md`
        3. Optional rule lint (heuristic):
           - `bash ${SKILL_PATH}/scripts/check_prometheus_rule_annotations.sh`

        ## Guardrails

        - Monitoring reconciliation is owned by Flux `Kustomization/monitoring` (`clusters/k3s/flux-system/kustomization-monitoring.yaml` -> `k3s/flux/monitoring`).
        - Keep rule and dashboard changes in `k3s/monitoring/**`; avoid editing live PrometheusRule objects directly.
        - Alert definitions should include operational context (`summary`, `description`, `runbook_url`) to reduce responder ambiguity.

        ## Core Workflow

        ### 1) Identify Change Type

        - Rule tuning: `k3s/monitoring/prometheus-rules-*.yaml`
        - Scrape topology: `*servicemonitor*`, `*podmonitor*`, exporter manifests
        - Dashboards: `k3s/monitoring/dashboards/**`
        - Stack configuration: `k3s/monitoring/kube-prometheus-stack.yaml`

        ### 2) Apply Git Change

        - Edit manifests and keep scope narrow.
        - Run annotation check script for rule files.
        - Commit and push.

        ### 3) Reconcile + Observe

        - `flux reconcile kustomization monitoring -n flux-system --with-source`
        - Validate:
          - `kubectl -n flux-system get kustomizations monitoring`
          - `kubectl -n monitoring get pods`
          - `kubectl -n monitoring get prometheusrules`

        ### 4) Runtime Validation

        - Use MCP when available:
          - `prometheus__list_alerts`
          - `grafana__grafana_list_alerts`
          - `alertmanager__am_list_alerts`
        - Ensure expected alerts fire/clear behavior and no rule-evaluation errors.

        ### 5) Persist

        - Capture after snapshot and summarize what changed, why, and residual risk.
        - Add follow-ups for noisy/fatiguing alerts rather than leaving ad-hoc suppressions.

        ## References / Templates

        - Workflow + source links: `references/workflow.md`
        - Change checklist: `assets/templates/monitoring-change-checklist.md`
      scripts:
        - name: monitoring_health_snapshot.sh
          path: scripts/monitoring_health_snapshot.sh
          description: Generate read-only monitoring stack status snapshot
        - name: check_prometheus_rule_annotations.sh
          path: scripts/check_prometheus_rule_annotations.sh
          description: Heuristic check for summary/description/runbook_url coverage in rule files

  - name: mcp-usage-core
    priority: 10
    categories: [agents, workflow]
    common:
      description: |
        Core MCP usage directive: context-first, index-first, ship-to-green workflow for AI agents. Enforces repeatable delivery loops with hooks, commit/push, CI monitoring, and durable agent memory.
      instructions: |
        # MCP Usage Core Directive

        ## Core Principle

        Always run context-first and index-first:
        1. recall what is already known
        2. validate live/tooling state
        3. execute to completion (including commit/push/CI) unless explicitly told not to

        ## Default Execution Loop (Required)

        ### 1) Context and Ownership
        - Start/resume agent session: `agent_context__agent_session_start`
        - Recall relevant prior work: `agent_context__agent_recall`
        - Register presence and track task: `agent_context__agent_presence_register`, `agent_context__agent_task_add`, `agent_context__agent_task_update`

        ### 2) Codebase Index Baseline
        - Check index health first: `codebase_memory__codebase_stats`
        - If index is missing/stale, rebuild before deep work:
          - `codebase_memory__codebase_index_start`
          - `codebase_memory__codebase_index_poll`
        - Use indexed workflows over blind grep when possible:
          - `codebase_memory__codebase_search`
          - `codebase_memory__codebase_get_definition`
          - `codebase_memory__codebase_get_references`
          - `codebase_memory__codebase_get_context`

        ### 3) Implement in Small Slices
        - Keep changes scoped and reversible.
        - Capture decisions/findings during execution: `agent_context__agent_context_add`
        - Link important symbols/files with `code_context` entries via `agent_context__agent_context_add`

        ### 4) Verify with Hooks + Tests
        - Run repo hooks/checks as part of done criteria, not optional hygiene:
          1. pre-commit / repo hooks
          2. targeted tests
          3. full test/lint checks
        - If checks fail, fix and rerun until green or clearly blocked.

        ### 5) Ship by Default
        - Unless the user explicitly requests otherwise, complete the loop:
          1. commit scoped changes
          2. push branch
          3. monitor CI to terminal state
          4. fix failures and repush

        ### 6) Close and Preserve Context
        - Mark task complete with resolution: `agent_context__agent_task_update`
        - End/summarize session: `agent_context__agent_session_end`
        - Ensure next agent can resume without asking for recap.

        ## Do / Don't

        **Do:**
        - Use MCP resources/tools to validate assumptions before coding
        - Prefer structured tools (agent_context, codebase_memory, gitlab/github APIs) over ad-hoc manual workflows
        - Keep status updates concise and tied to objective completion criteria
        - Mirror any live hotfix back into Git immediately

        **Don't:**
        - Stop at "code written" when shipping steps are still pending
        - Skip hooks/tests and rely on CI to find obvious local failures
        - Store secrets in memory/context systems
        - Bypass Flux with manual cluster edits outside incident handling

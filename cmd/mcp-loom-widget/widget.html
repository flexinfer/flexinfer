<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Loom Fleet</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #fafafa;
      --fg: #111;
      --muted: #666;
      --accent: #6e56cf;
      --border: #e5e5e5;
      --card: #fff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111;
        --fg: #f5f5f5;
        --muted: #999;
        --accent: #a99ce0;
        --border: #2a2a2a;
        --card: #1a1a1a;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px;
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--fg);
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }
    h1 {
      margin: 0 0 4px;
      font-size: 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      display: inline-block;
    }
    .sub {
      color: var(--muted);
      font-size: 12px;
      margin: 0 0 12px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-top: 1px solid var(--border);
      font-size: 13px;
    }
    .row:first-of-type { border-top: 0; }
    .label { color: var(--muted); }
    .value { font-weight: 500; }
    .placeholder {
      margin-top: 12px;
      padding: 8px 12px;
      background: color-mix(in srgb, var(--accent) 8%, transparent);
      border-radius: 6px;
      color: var(--muted);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1><span class="dot"></span>Loom Fleet</h1>
    <p class="sub">Slice 1b-&alpha; placeholder &mdash; widget plumbing verified end-to-end.</p>
    <div class="row">
      <span class="label">Source</span>
      <span class="value">mcp-loom-widget</span>
    </div>
    <div class="row">
      <span class="label">Wire format</span>
      <span class="value">MCP Apps (ui:// resource)</span>
    </div>
    <div class="row">
      <span class="label">Next slice</span>
      <span class="value">1b-&beta; Skybridge bundle</span>
    </div>
    <p class="placeholder">
      When 1b-&gamma; lands, this widget will fetch live data from
      <code>/api/mobile/v1/dashboard</code> via the MCP server proxy.
    </p>
  </div>
</body>
</html>

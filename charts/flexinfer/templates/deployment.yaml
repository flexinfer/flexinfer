{{- $controller := default (dict) .Values.controller -}}
{{- $controllerImage := default (dict) $controller.image -}}
{{- $controllerRuntime := default (dict) $controller.runtime -}}
{{- $flashLoader := default (dict) $controllerRuntime.flashLoader -}}
{{- $backend := default (dict) .Values.backend -}}
{{- $backendImage := default (dict) $backend.image -}}
{{- $benchmarker := default (dict) .Values.benchmarker -}}
{{- $benchmarkerImage := default (dict) $benchmarker.image -}}
{{- $observability := default (dict) .Values.observability -}}
{{- $tracing := default (dict) $observability.tracing -}}
{{- $mlcllm := default (dict) .Values.mlcllm -}}
{{- $mlcllmDefaults := default (dict) $mlcllm.defaults -}}
{{- $vllm := default (dict) .Values.vllm -}}
{{- $vllmDefaults := default (dict) $vllm.defaults -}}
{{- $llamacpp := default (dict) .Values.llamacpp -}}
{{- $llamacppDefaults := default (dict) $llamacpp.defaults -}}
{{- $quantization := default (dict) .Values.quantization -}}
{{- $quantizationImages := default (dict) $quantization.images -}}
{{- $oras := default (dict) .Values.oras -}}
{{- if $controller.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flexinfer.fullname" . }}-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "flexinfer.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  replicas: {{ default 1 $controller.replicas }}
  selector:
    matchLabels:
      {{- include "flexinfer.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: controller
  template:
    metadata:
      annotations:
        flexinfer.ai/chart-version: {{ .Chart.Version | quote }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "flexinfer.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: {{ include "flexinfer.controllerServiceAccountName" . }}
      {{- with $controller.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $controller.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $controller.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: manager
          image: "{{ $controllerImage.repository }}:{{ $controllerImage.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ include "flexinfer.imagePullPolicy" $controllerImage }}
          command:
            - /manager
          args:
            - --leader-elect
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml $controller.resources | nindent 12 }}
          env:
            - name: DEFAULT_BACKEND_IMAGE
              value: "{{ $backendImage.repository }}:{{ $backendImage.tag }}"
            - name: BENCHMARKER_IMAGE
              value: "{{ $benchmarkerImage.repository }}:{{ $benchmarkerImage.tag }}"
            - name: BENCHMARK_SERVICE_ACCOUNT
              value: {{ include "flexinfer.benchmarkerServiceAccountName" . | quote }}
            {{- if $benchmarker.postgresDsn }}
            - name: POSTGRES_DSN
              value: {{ $benchmarker.postgresDsn | quote }}
            {{- end }}
            {{- if $controllerRuntime.shmSizeLimit }}
            - name: DEFAULT_SHM_SIZE_LIMIT
              value: {{ $controllerRuntime.shmSizeLimit | quote }}
            {{- end }}
            {{- if $controllerRuntime.flashLoader }}
            - name: DEFAULT_FLASH_LOADER_ENABLED
              value: {{ default false $flashLoader.enabled | quote }}
            {{- if $flashLoader.image }}
            - name: DEFAULT_FLASH_LOADER_IMAGE
              value: {{ $flashLoader.image | quote }}
            {{- end }}
            {{- if $flashLoader.concurrency }}
            - name: DEFAULT_FLASH_LOADER_CONCURRENCY
              value: {{ $flashLoader.concurrency | quote }}
            {{- end }}
            {{- if $flashLoader.tmpfsSizeLimit }}
            - name: DEFAULT_FLASH_LOADER_TMPFS_SIZE_LIMIT
              value: {{ $flashLoader.tmpfsSizeLimit | quote }}
            {{- end }}
            {{- end }}
            {{- if $tracing.enabled }}
            - name: FLEXINFER_OTEL_ENABLED
              value: "true"
            {{- if $tracing.otlpEndpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ $tracing.otlpEndpoint | quote }}
            {{- end }}
            {{- if $tracing.serviceNamespace }}
            - name: FLEXINFER_OTEL_SERVICE_NAMESPACE
              value: {{ $tracing.serviceNamespace | quote }}
            {{- end }}
            {{- end }}
            {{- if $mlcllm.cudaImage }}
            - name: DEFAULT_MLC_LLM_IMAGE
              value: {{ $mlcllm.cudaImage | quote }}
            {{- end }}
            {{- if $mlcllm.rocmImage }}
            - name: DEFAULT_MLC_LLM_IMAGE_AMD
              value: {{ $mlcllm.rocmImage | quote }}
            {{- end }}
            {{- if $mlcllm.maxwellImage }}
            - name: DEFAULT_MLC_LLM_IMAGE_MAXWELL
              value: {{ $mlcllm.maxwellImage | quote }}
            {{- end }}
            {{- if $mlcllm.gfx1100Image }}
            - name: DEFAULT_MLC_LLM_IMAGE_GFX1100
              value: {{ $mlcllm.gfx1100Image | quote }}
            {{- end }}
            {{- if $mlcllm.gfx906Image }}
            - name: DEFAULT_MLC_LLM_IMAGE_GFX906
              value: {{ $mlcllm.gfx906Image | quote }}
            {{- end }}
            {{- if $mlcllmDefaults.mode }}
            - name: DEFAULT_MLC_LLM_MODE
              value: {{ $mlcllmDefaults.mode | quote }}
            {{- end }}
            {{- if $mlcllmDefaults.gpuMemoryBytes }}
            - name: DEFAULT_MLC_GPU_SIZE_BYTES
              value: {{ $mlcllmDefaults.gpuMemoryBytes | quote }}
            {{- end }}
            {{- if $mlcllmDefaults.jitPolicy }}
            - name: DEFAULT_MLC_JIT_POLICY
              value: {{ $mlcllmDefaults.jitPolicy | quote }}
            {{- end }}
            {{- if $mlcllmDefaults.modelLibPath }}
            - name: DEFAULT_MLC_LLM_MODEL_LIB
              value: {{ $mlcllmDefaults.modelLibPath | quote }}
            {{- end }}
            {{- if $mlcllmDefaults.args }}
            - name: DEFAULT_MLC_LLM_ARGS
              value: {{ $mlcllmDefaults.args | quote }}
            {{- end }}
            {{- if $vllm.cudaImage }}
            - name: DEFAULT_VLLM_IMAGE
              value: {{ $vllm.cudaImage | quote }}
            {{- end }}
            {{- if $vllm.rocmImage }}
            - name: DEFAULT_VLLM_IMAGE_AMD
              value: {{ $vllm.rocmImage | quote }}
            {{- end }}
            {{- if $vllm.gfx1100Image }}
            - name: DEFAULT_VLLM_IMAGE_GFX1100
              value: {{ $vllm.gfx1100Image | quote }}
            {{- end }}
            {{- if $vllm.gfx906Image }}
            - name: DEFAULT_VLLM_IMAGE_GFX906
              value: {{ $vllm.gfx906Image | quote }}
            {{- end }}
            {{- if $vllmDefaults.args }}
            - name: DEFAULT_VLLM_ARGS
              value: {{ $vllmDefaults.args | quote }}
            {{- end }}
            {{- if .Values.ollama }}
            {{- if .Values.ollama.maxwellImage }}
            - name: DEFAULT_BACKEND_IMAGE_MAXWELL
              value: {{ .Values.ollama.maxwellImage | quote }}
            {{- end }}
            {{- if .Values.ollama.gfx1100Image }}
            - name: DEFAULT_OLLAMA_IMAGE_GFX1100
              value: {{ .Values.ollama.gfx1100Image | quote }}
            {{- end }}
            {{- if .Values.ollama.gfx906Image }}
            - name: DEFAULT_OLLAMA_IMAGE_GFX906
              value: {{ .Values.ollama.gfx906Image | quote }}
            {{- end }}
            {{- end }}
            {{- if $llamacpp.cudaImage }}
            - name: DEFAULT_LLAMA_CPP_IMAGE
              value: {{ $llamacpp.cudaImage | quote }}
            {{- end }}
            {{- if $llamacpp.rocmImage }}
            - name: DEFAULT_LLAMA_CPP_IMAGE_AMD
              value: {{ $llamacpp.rocmImage | quote }}
            {{- end }}
            {{- if $llamacpp.gfx1100Image }}
            - name: DEFAULT_LLAMA_CPP_IMAGE_GFX1100
              value: {{ $llamacpp.gfx1100Image | quote }}
            {{- end }}
            {{- if $llamacpp.gfx906Image }}
            - name: DEFAULT_LLAMA_CPP_IMAGE_GFX906
              value: {{ $llamacpp.gfx906Image | quote }}
            {{- end }}
            {{- if $llamacpp.maxwellImage }}
            - name: DEFAULT_LLAMA_CPP_IMAGE_MAXWELL
              value: {{ $llamacpp.maxwellImage | quote }}
            {{- end }}
            {{- if $llamacppDefaults.args }}
            - name: DEFAULT_LLAMA_CPP_ARGS
              value: {{ $llamacppDefaults.args | quote }}
            {{- end }}
            {{- if .Values.diffusers }}
            {{- if .Values.diffusers.cudaImage }}
            - name: DEFAULT_DIFFUSERS_IMAGE
              value: {{ .Values.diffusers.cudaImage | quote }}
            {{- end }}
            {{- if .Values.diffusers.rocmImage }}
            - name: DEFAULT_DIFFUSERS_IMAGE_AMD
              value: {{ .Values.diffusers.rocmImage | quote }}
            {{- end }}
            {{- if .Values.diffusers.gfx1100Image }}
            - name: DEFAULT_DIFFUSERS_IMAGE_GFX1100
              value: {{ .Values.diffusers.gfx1100Image | quote }}
            {{- end }}
            {{- if .Values.diffusers.gfx906Image }}
            - name: DEFAULT_DIFFUSERS_IMAGE_GFX906
              value: {{ .Values.diffusers.gfx906Image | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.comfyui }}
            {{- if .Values.comfyui.rocmImage }}
            - name: DEFAULT_COMFYUI_IMAGE_AMD
              value: {{ .Values.comfyui.rocmImage | quote }}
            {{- end }}
            {{- if .Values.comfyui.gfx1100Image }}
            - name: DEFAULT_COMFYUI_IMAGE_GFX1100
              value: {{ .Values.comfyui.gfx1100Image | quote }}
            {{- end }}
            {{- if .Values.comfyui.gfx906Image }}
            - name: DEFAULT_COMFYUI_IMAGE_GFX906
              value: {{ .Values.comfyui.gfx906Image | quote }}
            {{- end }}
            {{- end }}
            {{- if $oras.image }}
            - name: ORAS_DOWNLOADER_IMAGE
              value: {{ $oras.image | quote }}
            {{- end }}
            {{- if $quantizationImages.gguf }}
            - name: FLEXINFER_QUANTIZER_GGUF_IMAGE
              value: {{ $quantizationImages.gguf | quote }}
            {{- end }}
            {{- if $quantizationImages.awq }}
            - name: FLEXINFER_QUANTIZER_AWQ_IMAGE
              value: {{ $quantizationImages.awq | quote }}
            {{- end }}
            {{- if $quantizationImages.gptq }}
            - name: FLEXINFER_QUANTIZER_GPTQ_IMAGE
              value: {{ $quantizationImages.gptq | quote }}
            {{- end }}
            {{- if $quantizationImages.gptqRocm }}
            - name: FLEXINFER_QUANTIZER_GPTQ_ROCM_IMAGE
              value: {{ $quantizationImages.gptqRocm | quote }}
            {{- end }}
            {{- if $quantizationImages.exl2 }}
            - name: FLEXINFER_QUANTIZER_EXL2_IMAGE
              value: {{ $quantizationImages.exl2 | quote }}
            {{- end }}
            {{- if $quantizationImages.fp8 }}
            - name: FLEXINFER_QUANTIZER_FP8_IMAGE
              value: {{ $quantizationImages.fp8 | quote }}
            {{- end }}
            {{- if $quantization.useRuntimeForQuantize }}
            - name: FLEXINFER_USE_RUNTIME_FOR_QUANTIZE
              value: "true"
            {{- end }}
            {{- if $quantization.runtimeImage }}
            - name: FLEXINFER_RUNTIME_IMAGE
              value: {{ $quantization.runtimeImage | quote }}
            {{- end }}
            {{- if $quantization.gptqModelPolicies }}
            - name: FLEXINFER_GPTQ_MODEL_POLICIES
              value: {{ $quantization.gptqModelPolicies | toJson | quote }}
            {{- end }}
{{- end }}

{{- if .Values.controller.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flexinfer.fullname" . }}-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "flexinfer.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  replicas: {{ .Values.controller.replicas }}
  selector:
    matchLabels:
      {{- include "flexinfer.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: controller
  template:
    metadata:
      annotations:
        flexinfer.ai/chart-version: {{ .Chart.Version | quote }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "flexinfer.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: {{ include "flexinfer.controllerServiceAccountName" . }}
      {{- with .Values.controller.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: manager
          image: "{{ .Values.controller.image.repository }}:{{ .Values.controller.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ include "flexinfer.imagePullPolicy" .Values.controller.image }}
          command:
            - /manager
          args:
            - --leader-elect
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
          env:
            - name: DEFAULT_BACKEND_IMAGE
              value: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
            - name: BENCHMARKER_IMAGE
              value: "{{ .Values.benchmarker.image.repository }}:{{ .Values.benchmarker.image.tag }}"
            - name: BENCHMARK_SERVICE_ACCOUNT
              value: {{ include "flexinfer.benchmarkerServiceAccountName" . | quote }}
            {{- if .Values.benchmarker.postgresDsn }}
            - name: POSTGRES_DSN
              value: {{ .Values.benchmarker.postgresDsn | quote }}
            {{- end }}
            {{- if .Values.controller.runtime.shmSizeLimit }}
            - name: DEFAULT_SHM_SIZE_LIMIT
              value: {{ .Values.controller.runtime.shmSizeLimit | quote }}
            {{- end }}
            {{- if .Values.controller.runtime.flashLoader }}
            - name: DEFAULT_FLASH_LOADER_ENABLED
              value: {{ .Values.controller.runtime.flashLoader.enabled | quote }}
            {{- if .Values.controller.runtime.flashLoader.image }}
            - name: DEFAULT_FLASH_LOADER_IMAGE
              value: {{ .Values.controller.runtime.flashLoader.image | quote }}
            {{- end }}
            {{- if .Values.controller.runtime.flashLoader.concurrency }}
            - name: DEFAULT_FLASH_LOADER_CONCURRENCY
              value: {{ .Values.controller.runtime.flashLoader.concurrency | quote }}
            {{- end }}
            {{- if .Values.controller.runtime.flashLoader.tmpfsSizeLimit }}
            - name: DEFAULT_FLASH_LOADER_TMPFS_SIZE_LIMIT
              value: {{ .Values.controller.runtime.flashLoader.tmpfsSizeLimit | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.observability.tracing.enabled }}
            - name: FLEXINFER_OTEL_ENABLED
              value: "true"
            {{- if .Values.observability.tracing.otlpEndpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.observability.tracing.otlpEndpoint | quote }}
            {{- end }}
            {{- if .Values.observability.tracing.serviceNamespace }}
            - name: FLEXINFER_OTEL_SERVICE_NAMESPACE
              value: {{ .Values.observability.tracing.serviceNamespace | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.mlcllm.cudaImage }}
            - name: DEFAULT_MLC_LLM_IMAGE
              value: {{ .Values.mlcllm.cudaImage | quote }}
            {{- end }}
            {{- if .Values.mlcllm.rocmImage }}
            - name: DEFAULT_MLC_LLM_IMAGE_AMD
              value: {{ .Values.mlcllm.rocmImage | quote }}
            {{- end }}
            {{- if .Values.mlcllm.maxwellImage }}
            - name: DEFAULT_MLC_LLM_IMAGE_MAXWELL
              value: {{ .Values.mlcllm.maxwellImage | quote }}
            {{- end }}
            {{- if .Values.mlcllm.gfx1100Image }}
            - name: DEFAULT_MLC_LLM_IMAGE_GFX1100
              value: {{ .Values.mlcllm.gfx1100Image | quote }}
            {{- end }}
            {{- if .Values.mlcllm.gfx906Image }}
            - name: DEFAULT_MLC_LLM_IMAGE_GFX906
              value: {{ .Values.mlcllm.gfx906Image | quote }}
            {{- end }}
            {{- if .Values.mlcllm.defaults.mode }}
            - name: DEFAULT_MLC_LLM_MODE
              value: {{ .Values.mlcllm.defaults.mode | quote }}
            {{- end }}
            {{- if .Values.mlcllm.defaults.gpuMemoryBytes }}
            - name: DEFAULT_MLC_GPU_SIZE_BYTES
              value: {{ .Values.mlcllm.defaults.gpuMemoryBytes | quote }}
            {{- end }}
            {{- if .Values.mlcllm.defaults.jitPolicy }}
            - name: DEFAULT_MLC_JIT_POLICY
              value: {{ .Values.mlcllm.defaults.jitPolicy | quote }}
            {{- end }}
            {{- if .Values.mlcllm.defaults.modelLibPath }}
            - name: DEFAULT_MLC_LLM_MODEL_LIB
              value: {{ .Values.mlcllm.defaults.modelLibPath | quote }}
            {{- end }}
            {{- if .Values.mlcllm.defaults.args }}
            - name: DEFAULT_MLC_LLM_ARGS
              value: {{ .Values.mlcllm.defaults.args | quote }}
            {{- end }}
            {{- if .Values.vllm.cudaImage }}
            - name: DEFAULT_VLLM_IMAGE
              value: {{ .Values.vllm.cudaImage | quote }}
            {{- end }}
            {{- if .Values.vllm.rocmImage }}
            - name: DEFAULT_VLLM_IMAGE_AMD
              value: {{ .Values.vllm.rocmImage | quote }}
            {{- end }}
            {{- if .Values.vllm.gfx1100Image }}
            - name: DEFAULT_VLLM_IMAGE_GFX1100
              value: {{ .Values.vllm.gfx1100Image | quote }}
            {{- end }}
            {{- if .Values.vllm.gfx906Image }}
            - name: DEFAULT_VLLM_IMAGE_GFX906
              value: {{ .Values.vllm.gfx906Image | quote }}
            {{- end }}
            {{- if .Values.vllm.defaults.args }}
            - name: DEFAULT_VLLM_ARGS
              value: {{ .Values.vllm.defaults.args | quote }}
            {{- end }}
            {{- if .Values.ollama }}
            {{- if .Values.ollama.maxwellImage }}
            - name: DEFAULT_BACKEND_IMAGE_MAXWELL
              value: {{ .Values.ollama.maxwellImage | quote }}
            {{- end }}
            {{- if .Values.ollama.gfx1100Image }}
            - name: DEFAULT_OLLAMA_IMAGE_GFX1100
              value: {{ .Values.ollama.gfx1100Image | quote }}
            {{- end }}
            {{- if .Values.ollama.gfx906Image }}
            - name: DEFAULT_OLLAMA_IMAGE_GFX906
              value: {{ .Values.ollama.gfx906Image | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.llamacpp.cudaImage }}
            - name: DEFAULT_LLAMA_CPP_IMAGE
              value: {{ .Values.llamacpp.cudaImage | quote }}
            {{- end }}
            {{- if .Values.llamacpp.rocmImage }}
            - name: DEFAULT_LLAMA_CPP_IMAGE_AMD
              value: {{ .Values.llamacpp.rocmImage | quote }}
            {{- end }}
            {{- if .Values.llamacpp.gfx1100Image }}
            - name: DEFAULT_LLAMA_CPP_IMAGE_GFX1100
              value: {{ .Values.llamacpp.gfx1100Image | quote }}
            {{- end }}
            {{- if .Values.llamacpp.gfx906Image }}
            - name: DEFAULT_LLAMA_CPP_IMAGE_GFX906
              value: {{ .Values.llamacpp.gfx906Image | quote }}
            {{- end }}
            {{- if .Values.llamacpp.maxwellImage }}
            - name: DEFAULT_LLAMA_CPP_IMAGE_MAXWELL
              value: {{ .Values.llamacpp.maxwellImage | quote }}
            {{- end }}
            {{- if .Values.llamacpp.defaults.args }}
            - name: DEFAULT_LLAMA_CPP_ARGS
              value: {{ .Values.llamacpp.defaults.args | quote }}
            {{- end }}
            {{- if .Values.diffusers }}
            {{- if .Values.diffusers.cudaImage }}
            - name: DEFAULT_DIFFUSERS_IMAGE
              value: {{ .Values.diffusers.cudaImage | quote }}
            {{- end }}
            {{- if .Values.diffusers.rocmImage }}
            - name: DEFAULT_DIFFUSERS_IMAGE_AMD
              value: {{ .Values.diffusers.rocmImage | quote }}
            {{- end }}
            {{- if .Values.diffusers.gfx1100Image }}
            - name: DEFAULT_DIFFUSERS_IMAGE_GFX1100
              value: {{ .Values.diffusers.gfx1100Image | quote }}
            {{- end }}
            {{- if .Values.diffusers.gfx906Image }}
            - name: DEFAULT_DIFFUSERS_IMAGE_GFX906
              value: {{ .Values.diffusers.gfx906Image | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.comfyui }}
            {{- if .Values.comfyui.rocmImage }}
            - name: DEFAULT_COMFYUI_IMAGE_AMD
              value: {{ .Values.comfyui.rocmImage | quote }}
            {{- end }}
            {{- if .Values.comfyui.gfx1100Image }}
            - name: DEFAULT_COMFYUI_IMAGE_GFX1100
              value: {{ .Values.comfyui.gfx1100Image | quote }}
            {{- end }}
            {{- if .Values.comfyui.gfx906Image }}
            - name: DEFAULT_COMFYUI_IMAGE_GFX906
              value: {{ .Values.comfyui.gfx906Image | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.oras.image }}
            - name: ORAS_DOWNLOADER_IMAGE
              value: {{ .Values.oras.image | quote }}
            {{- end }}
            {{- if .Values.quantization.images.gguf }}
            - name: FLEXINFER_QUANTIZER_GGUF_IMAGE
              value: {{ .Values.quantization.images.gguf | quote }}
            {{- end }}
            {{- if .Values.quantization.images.awq }}
            - name: FLEXINFER_QUANTIZER_AWQ_IMAGE
              value: {{ .Values.quantization.images.awq | quote }}
            {{- end }}
            {{- if .Values.quantization.images.gptq }}
            - name: FLEXINFER_QUANTIZER_GPTQ_IMAGE
              value: {{ .Values.quantization.images.gptq | quote }}
            {{- end }}
            {{- if .Values.quantization.images.exl2 }}
            - name: FLEXINFER_QUANTIZER_EXL2_IMAGE
              value: {{ .Values.quantization.images.exl2 | quote }}
            {{- end }}
            {{- if .Values.quantization.images.fp8 }}
            - name: FLEXINFER_QUANTIZER_FP8_IMAGE
              value: {{ .Values.quantization.images.fp8 | quote }}
            {{- end }}
{{- end }}

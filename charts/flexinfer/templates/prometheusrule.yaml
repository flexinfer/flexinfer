{{- $alerting := default (dict) .Values.alerting -}}
{{- $thresholds := default (dict) $alerting.thresholds -}}
{{- $buildNodeDisk := default (dict) $alerting.buildNodeDisk -}}
{{- if default false $alerting.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "flexinfer.fullname" . }}
  labels:
    {{- include "flexinfer.labels" . | nindent 4 }}
    {{- with $alerting.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: flexinfer-proxy
      rules:
        # High request error rate (>5% of requests failing over 5 minutes)
        - alert: FlexInferProxyHighErrorRate
          expr: |
            (
              sum(rate(flexinfer_proxy_requests_total{status="error"}[5m])) by (model)
              /
              sum(rate(flexinfer_proxy_requests_total[5m])) by (model)
            ) > {{ default 0.05 $thresholds.errorRatePercent }}
          for: {{ default "5m" $thresholds.errorRateFor }}
          labels:
            severity: warning
          annotations:
            summary: "High error rate for model {{ "{{ $labels.model }}" }}"
            description: "Model {{ "{{ $labels.model }}" }} has an error rate of {{ "{{ $value | humanizePercentage }}" }} over the last 5 minutes."

        # Request queue depth too high (requests waiting for cold start)
        - alert: FlexInferProxyQueueDepthHigh
          expr: |
            flexinfer_proxy_queue_depth > {{ default 50 $thresholds.queueDepth }}
          for: {{ default "2m" $thresholds.queueDepthFor }}
          labels:
            severity: warning
          annotations:
            summary: "High queue depth for model {{ "{{ $labels.model }}" }}"
            description: "Model {{ "{{ $labels.model }}" }} has {{ "{{ $value }}" }} requests waiting in queue."

        # Cold start timeout rate (models failing to become ready)
        - alert: FlexInferColdStartTimeouts
          expr: |
            sum(rate(flexinfer_proxy_requests_total{status="error"}[10m])) by (model)
            > {{ default 0.1 $thresholds.coldStartTimeoutRate }}
          for: {{ default "5m" $thresholds.coldStartTimeoutFor }}
          labels:
            severity: critical
          annotations:
            summary: "Cold start timeouts for model {{ "{{ $labels.model }}" }}"
            description: "Model {{ "{{ $labels.model }}" }} is experiencing cold start failures at {{ "{{ $value }}" }}/s."

        # Rate limiting triggered (potential abuse or misconfiguration)
        - alert: FlexInferRateLimitTriggered
          expr: |
            sum(rate(flexinfer_proxy_rate_limited_total[5m])) by (model, scope) > 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Rate limiting active for model {{ "{{ $labels.model }}" }}"
            description: "Rate limiter ({{ "{{ $labels.scope }}" }}) is rejecting requests for model {{ "{{ $labels.model }}" }} at {{ "{{ $value }}" }}/s."

        # Queue rejections (capacity exhausted)
        - alert: FlexInferQueueRejections
          expr: |
            sum(rate(flexinfer_proxy_queue_rejected_total[5m])) by (model) > 0.5
          for: 3m
          labels:
            severity: critical
          annotations:
            summary: "Queue rejections for model {{ "{{ $labels.model }}" }}"
            description: "Model {{ "{{ $labels.model }}" }} is rejecting requests due to queue overflow at {{ "{{ $value }}" }}/s."

        # A proxy replica exceeded its graceful-shutdown drain deadline
        # (default 10m, PROXY_GRACEFUL_SHUTDOWN_TIMEOUT). A timeout means
        # in-flight requests were cut off mid-flight instead of draining
        # cleanly. Fires on any NEW timeout in the window (increase > 0),
        # matching the fresh-failure style of FlexInferQuantizationJobFailed.
        - alert: FlexInferProxyGracefulShutdownTimeout
          expr: |
            increase(flexinfer_proxy_shutdowns_total{result="timeout"}[15m]) > 0
          labels:
            severity: warning
          annotations:
            summary: "Proxy graceful shutdown timed out"
            description: "A flexinfer-proxy replica exceeded its graceful-shutdown drain deadline in the last 15 minutes, forcing in-flight requests to be cut off. Check for long-running/streaming requests, the pod's terminationGracePeriodSeconds vs PROXY_GRACEFUL_SHUTDOWN_TIMEOUT, and `kubectl describe pod` events. See docs/user/proxy-observability.md."

        # p99 drain duration is climbing toward the 600s (10m) deadline.
        # Warn before drains actually start timing out so an operator can
        # investigate long-lived requests or raise the deadline in advance.
        - alert: FlexInferProxyDrainDurationHigh
          expr: |
            histogram_quantile(0.99, sum by (le) (rate(flexinfer_proxy_shutdown_duration_seconds_bucket[1h]))) > {{ default 480 $thresholds.proxyDrainSecondsWarn }}
          for: {{ default "5m" $thresholds.proxyDrainDurationFor }}
          labels:
            severity: warning
          annotations:
            summary: "Proxy drain duration approaching timeout"
            description: "p99 graceful-shutdown drain duration is {{ "{{ $value | humanizeDuration }}" }}, approaching the 600s (10m) drain deadline. Replicas may soon time out drains and cut off in-flight requests. Investigate long-running/streaming requests on the proxy or raise PROXY_GRACEFUL_SHUTDOWN_TIMEOUT."

    - name: flexinfer-gpu
      rules:
        # GPU temperature too high
        - alert: FlexInferGPUTemperatureHigh
          expr: |
            flexinfer_gpu_temperature_celsius > {{ default 85 $thresholds.gpuTempCelsius }}
          for: {{ default "5m" $thresholds.gpuTempFor }}
          labels:
            severity: warning
          annotations:
            summary: "GPU temperature high on node {{ "{{ $labels.node }}" }}"
            description: "GPU {{ "{{ $labels.gpu }}" }} on node {{ "{{ $labels.node }}" }} is at {{ "{{ $value }}" }}°C."

        # GPU temperature critical
        - alert: FlexInferGPUTemperatureCritical
          expr: |
            flexinfer_gpu_temperature_celsius > {{ default 95 $thresholds.gpuTempCriticalCelsius }}
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "GPU temperature critical on node {{ "{{ $labels.node }}" }}"
            description: "GPU {{ "{{ $labels.gpu }}" }} on node {{ "{{ $labels.node }}" }} is at {{ "{{ $value }}" }}°C — thermal throttling likely."

        # VRAM nearly exhausted
        - alert: FlexInferGPUVRAMLow
          expr: |
            (
              flexinfer_gpu_vram_free_bytes
              /
              flexinfer_gpu_vram_total_bytes
            ) < {{ default 0.1 $thresholds.vramFreeRatio }}
          for: {{ default "5m" $thresholds.vramLowFor }}
          labels:
            severity: warning
          annotations:
            summary: "Low VRAM on GPU {{ "{{ $labels.gpu }}" }} (node {{ "{{ $labels.node }}" }})"
            description: "GPU {{ "{{ $labels.gpu }}" }} on node {{ "{{ $labels.node }}" }} has only {{ "{{ $value | humanizePercentage }}" }} VRAM free."

{{- if default false $buildNodeDisk.enabled }}
    - name: flexinfer-build-node-disk
      rules:
        - alert: FlexInferBuildNodeDiskSpaceWarning
          expr: |
            (
              1 - (
                node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs",instance=~{{ default ".*" $buildNodeDisk.instanceRegex | quote }},mountpoint=~{{ default "/var/lib/docker|/var/lib/buildkit|/" $buildNodeDisk.mountpointRegex | quote }}}
                /
                node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs",instance=~{{ default ".*" $buildNodeDisk.instanceRegex | quote }},mountpoint=~{{ default "/var/lib/docker|/var/lib/buildkit|/" $buildNodeDisk.mountpointRegex | quote }}}
              )
            ) > {{ default 0.80 $buildNodeDisk.warningUsedRatio }}
            or
            node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs",instance=~{{ default ".*" $buildNodeDisk.instanceRegex | quote }},mountpoint=~{{ default "/var/lib/docker|/var/lib/buildkit|/" $buildNodeDisk.mountpointRegex | quote }}} < {{ default 161061273600 $buildNodeDisk.warningFreeBytes }}
          for: {{ default "30m" $buildNodeDisk.warningFor }}
          labels:
            severity: warning
          annotations:
            summary: "Build node disk headroom low on {{ "{{ $labels.instance }}" }}"
            description: "Filesystem {{ "{{ $labels.mountpoint }}" }} on {{ "{{ $labels.instance }}" }} is above the warning threshold or has less than the configured warning free-space floor."

        - alert: FlexInferBuildNodeDiskSpaceCritical
          expr: |
            (
              1 - (
                node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs",instance=~{{ default ".*" $buildNodeDisk.instanceRegex | quote }},mountpoint=~{{ default "/var/lib/docker|/var/lib/buildkit|/" $buildNodeDisk.mountpointRegex | quote }}}
                /
                node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs",instance=~{{ default ".*" $buildNodeDisk.instanceRegex | quote }},mountpoint=~{{ default "/var/lib/docker|/var/lib/buildkit|/" $buildNodeDisk.mountpointRegex | quote }}}
              )
            ) > {{ default 0.90 $buildNodeDisk.criticalUsedRatio }}
            or
            node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs",instance=~{{ default ".*" $buildNodeDisk.instanceRegex | quote }},mountpoint=~{{ default "/var/lib/docker|/var/lib/buildkit|/" $buildNodeDisk.mountpointRegex | quote }}} < {{ default 85899345920 $buildNodeDisk.criticalFreeBytes }}
          for: {{ default "10m" $buildNodeDisk.criticalFor }}
          labels:
            severity: critical
          annotations:
            summary: "Build node disk headroom critical on {{ "{{ $labels.instance }}" }}"
            description: "Filesystem {{ "{{ $labels.mountpoint }}" }} on {{ "{{ $labels.instance }}" }} is above the critical threshold or has less than the configured critical free-space floor. Prune old BuildKit/Docker cache before starting large ROCm builds."
{{- end }}

    - name: flexinfer-scheduler
      rules:
        # Scheduler extender not responding
        - alert: FlexInferSchedulerDown
          expr: |
            up{job=~".*flexinfer-scheduler.*"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "FlexInfer scheduler is down"
            description: "The FlexInfer scheduler extender has been unreachable for 2 minutes. GPU-aware scheduling is disabled."

    - name: flexinfer-quantization
      rules:
        # Elapsed-time-based progress is approaching the job deadline while
        # the job is still running. Gives us a heads-up hour or so before
        # the kubelet kills the pod with DeadlineExceeded — enough time to
        # either raise the timeout or accept the loss.
        - alert: FlexInferQuantizationDeadlineApproaching
          expr: |
            flexinfer_job_progress_percent{job_type="quantize"} > {{ default 80 $thresholds.quantDeadlineWarnPercent }}
          for: {{ default "5m" $thresholds.quantDeadlineWarnFor }}
          labels:
            severity: warning
          annotations:
            summary: "Quantization for {{ "{{ $labels.model }}" }} nearing deadline ({{ "{{ $value | humanize }}" }}%)"
            description: "The quantize job for ModelCache {{ "{{ $labels.model }}" }} in {{ "{{ $labels.namespace }}" }} has consumed {{ "{{ $value | humanize }}" }}% of its configured timeoutSeconds. Consider raising spec.quantization.timeoutSeconds or investigating why the job is slow."

        # At 95%+ of deadline, the job is almost certainly about to be
        # killed by the kubelet. Page so the operator can decide whether
        # to extend the timeout before losing the whole run.
        - alert: FlexInferQuantizationDeadlineCritical
          expr: |
            flexinfer_job_progress_percent{job_type="quantize"} > {{ default 95 $thresholds.quantDeadlineCriticalPercent }}
          for: {{ default "2m" $thresholds.quantDeadlineCriticalFor }}
          labels:
            severity: critical
          annotations:
            summary: "Quantization for {{ "{{ $labels.model }}" }} about to hit deadline ({{ "{{ $value | humanize }}" }}%)"
            description: "The quantize job for ModelCache {{ "{{ $labels.model }}" }} in {{ "{{ $labels.namespace }}" }} will be killed with DeadlineExceeded within minutes. GPTQModel does not resume mid-run, so all progress will be lost. Raise spec.quantization.timeoutSeconds now or accept the loss and plan a retry."

        # A fresh quantization job failure. Different from the accumulated
        # failure counter — we only want alerts on NEW failures, not
        # historical ones.
        - alert: FlexInferQuantizationJobFailed
          expr: |
            increase(flexinfer_quantization_jobs_total{result="failed"}[15m]) > 0
          labels:
            severity: warning
          annotations:
            summary: "Quantization job failed for {{ "{{ $labels.model }}" }}"
            description: "A quantize job for ModelCache {{ "{{ $labels.model }}" }} failed in the last 15 minutes. Check controller logs and pod termination message for the cause (OOM, DeadlineExceeded, HIP error, etc.)."

        # No forward progress on per-layer completion for a long time while
        # the job is still active. Catches the "stuck in Hessian recovery"
        # pattern we saw on gfx906 before the MR !156 fix — the time-based
        # progress keeps climbing, but the layer index hasn't moved.
        # `changes()` counts distinct values in the window; if the layer
        # index series exists but never changed, stall is real.
        - alert: FlexInferQuantizationStalled
          expr: |
            (
              changes(flexinfer_quantization_layer_index[45m]) == 0
            )
            and
            (
              flexinfer_job_progress_percent{job_type="quantize"} > 0
            )
          for: {{ default "5m" $thresholds.quantStalledFor }}
          labels:
            severity: warning
          annotations:
            summary: "Quantization for {{ "{{ $labels.model }}" }} stalled at layer {{ "{{ $value }}" }}"
            description: "No layer completion in the last 45 minutes for ModelCache {{ "{{ $labels.model }}" }} in {{ "{{ $labels.namespace }}" }}. Likely causes: Hessian recovery exhaustion, a stuck Cholesky on a pathological module, or a HIP/GPU driver fault. Inspect the quantize pod logs for the module currently being processed."
{{- end }}

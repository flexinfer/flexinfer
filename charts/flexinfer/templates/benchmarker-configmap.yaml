{{- if .Values.benchmarker.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "flexinfer.fullname" . }}-benchmarks
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "flexinfer.labels" . | nindent 4 }}
    app.kubernetes.io/component: benchmarker
data:
  # This helps ensure the ConfigMap exists even if empty initially
  ".keep": ""
{{- end }}

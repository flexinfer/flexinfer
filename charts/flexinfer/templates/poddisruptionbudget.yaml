{{- $pdb := default (dict) .Values.podDisruptionBudget -}}
{{- $controllerPDB := default (dict) $pdb.controller -}}
{{- $proxyPDB := default (dict) $pdb.proxy -}}
{{- $schedulerPDB := default (dict) $pdb.scheduler -}}
{{- $proxy := default (dict) .Values.proxy -}}
{{- $scheduler := default (dict) .Values.scheduler -}}
{{- if default false $pdb.enabled }}
{{- if .Values.controller.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "flexinfer.fullname" . }}-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "flexinfer.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  {{- if $controllerPDB.minAvailable }}
  minAvailable: {{ $controllerPDB.minAvailable }}
  {{- else if $controllerPDB.maxUnavailable }}
  maxUnavailable: {{ $controllerPDB.maxUnavailable }}
  {{- else }}
  maxUnavailable: 1
  {{- end }}
  selector:
    matchLabels:
      {{- include "flexinfer.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: controller
{{- end }}
---
{{- if $proxy.enabled }}
{{- if gt (int (default 1 $proxy.replicaCount)) 1 }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "flexinfer.fullname" . }}-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "flexinfer.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
spec:
  {{- if $proxyPDB.minAvailable }}
  minAvailable: {{ $proxyPDB.minAvailable }}
  {{- else if $proxyPDB.maxUnavailable }}
  maxUnavailable: {{ $proxyPDB.maxUnavailable }}
  {{- else }}
  minAvailable: 1
  {{- end }}
  selector:
    matchLabels:
      {{- include "flexinfer.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: proxy
{{- end }}
{{- end }}
---
{{- if $scheduler.enabled }}
{{- if gt (int (default 1 $scheduler.replicas)) 1 }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "flexinfer.fullname" . }}-scheduler
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "flexinfer.labels" . | nindent 4 }}
    app.kubernetes.io/component: scheduler
spec:
  {{- if $schedulerPDB.minAvailable }}
  minAvailable: {{ $schedulerPDB.minAvailable }}
  {{- else if $schedulerPDB.maxUnavailable }}
  maxUnavailable: {{ $schedulerPDB.maxUnavailable }}
  {{- else }}
  minAvailable: 1
  {{- end }}
  selector:
    matchLabels:
      {{- include "flexinfer.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: scheduler
{{- end }}
{{- end }}
{{- end }}

{{- if .Values.grafanaDashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "flexinfer.fullname" . }}-grafana-dashboard-global-routing
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "flexinfer.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  flexinfer-global-routing.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": "-- Grafana --",
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "panels": [
        {
          "title": "Global Cluster Summary",
          "type": "row",
          "gridPos": { "x": 0, "y": 0, "w": 24, "h": 1 },
          "collapsed": false
        },
        {
          "title": "Configured Clusters",
          "type": "stat",
          "gridPos": { "x": 0, "y": 1, "w": 6, "h": 4 },
          "targets": [
            {
              "expr": "flexinfer_global_clusters_total",
              "legendFormat": "total",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": { "mode": "palette-classic" }
            }
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "orientation": "horizontal",
            "textMode": "value_and_name"
          }
        },
        {
          "title": "Healthy Clusters",
          "type": "stat",
          "gridPos": { "x": 6, "y": 1, "w": 6, "h": 4 },
          "targets": [
            {
              "expr": "flexinfer_global_clusters_healthy",
              "legendFormat": "healthy",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "yellow", "value": 1 },
                  { "color": "green", "value": 2 }
                ]
              },
              "color": { "mode": "thresholds" }
            }
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "orientation": "horizontal",
            "textMode": "value_and_name",
            "colorMode": "background"
          }
        },
        {
          "title": "Routing Decisions by Cluster",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 1, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "sum by (strategy, cluster) (rate(flexinfer_global_routing_decisions_total[5m]))",
              "legendFormat": "{{ "{{" }}strategy{{ "}}" }} → {{ "{{" }}cluster{{ "}}" }}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "fillOpacity": 8,
                "lineWidth": 2,
                "showPoints": "auto"
              }
            }
          }
        },
        {
          "title": "Per-Cluster Health",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 5, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "flexinfer_global_cluster_health",
              "legendFormat": "{{ "{{" }}cluster{{ "}}" }}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "max": 1,
              "unit": "none"
            }
          }
        },
        {
          "title": "Per-Cluster Latency",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 13, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "flexinfer_global_cluster_latency_seconds",
              "legendFormat": "{{ "{{" }}cluster{{ "}}" }}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            }
          }
        },
        {
          "title": "Available GPUs by Cluster/Vendor",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 9, "w": 12, "h": 6 },
          "targets": [
            {
              "expr": "flexinfer_global_cluster_available_gpus",
              "legendFormat": "{{ "{{" }}cluster{{ "}}" }} ({{ "{{" }}vendor{{ "}}" }})",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            }
          }
        },
        {
          "title": "GPU Capacity by Cluster/Vendor",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 15, "w": 12, "h": 6 },
          "targets": [
            {
              "expr": "flexinfer_global_cluster_capacity_gpus",
              "legendFormat": "{{ "{{" }}cluster{{ "}}" }} ({{ "{{" }}vendor{{ "}}" }})",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            }
          }
        }
      ],
      "schemaVersion": 39,
      "style": "dark",
      "tags": ["flexinfer", "global-routing", "multi-cluster"],
      "templating": { "list": [] },
      "time": { "from": "now-6h", "to": "now" },
      "title": "FlexInfer Global Routing",
      "version": 1
    }
{{- end }}

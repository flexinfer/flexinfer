{{- if .Values.agent.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "flexinfer.fullname" . }}-agent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "flexinfer.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  selector:
    matchLabels:
      {{- include "flexinfer.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: agent
  template:
    metadata:
      labels:
        {{- include "flexinfer.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: agent
    spec:
      serviceAccountName: {{ include "flexinfer.agentServiceAccountName" . }}
      hostPID: true # Required for some hardware detection
      containers:
        - name: agent
          image: "{{ .Values.agent.image.repository }}:{{ .Values.agent.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.agent.image.pullPolicy }}
          securityContext:
            privileged: true # Required for hardware access
            runAsUser: 0     # Must run as root for GPU access
          ports:
            - name: metrics
              containerPort: 9100
              protocol: TCP
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: PATH
              value: "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/opt/rocm/bin"
            - name: LD_LIBRARY_PATH
              value: "/opt/rocm/lib:/usr/local/nvidia/lib64"
          volumeMounts:
            # AMD ROCm tools and libraries
            - name: rocm
              mountPath: /opt/rocm
              readOnly: true
            # GPU device files
            - name: dev-dri
              mountPath: /dev/dri
            # NVIDIA tools (if available)
            - name: nvidia-bin
              mountPath: /usr/bin/nvidia-smi
              readOnly: true
            # NVIDIA libraries (if available)
            - name: nvidia-lib
              mountPath: /usr/local/nvidia
              readOnly: true
            # Host sysfs for GPU metrics fallback
            - name: sys
              mountPath: /sys
              readOnly: true
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}
      volumes:
        # AMD ROCm installation from host
        - name: rocm
          hostPath:
            path: /opt/rocm
            type: DirectoryOrCreate
        # GPU device files
        - name: dev-dri
          hostPath:
            path: /dev/dri
            type: DirectoryOrCreate
        # NVIDIA nvidia-smi binary
        - name: nvidia-bin
          hostPath:
            path: /usr/bin/nvidia-smi
            type: FileOrCreate
        # NVIDIA libraries
        - name: nvidia-lib
          hostPath:
            path: /usr/local/nvidia
            type: DirectoryOrCreate
        # Host sysfs for GPU metrics fallback
        - name: sys
          hostPath:
            path: /sys
            type: Directory
      {{- with .Values.agent.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agent.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

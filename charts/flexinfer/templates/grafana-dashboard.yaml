{{- if .Values.grafanaDashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "flexinfer.fullname" . }}-grafana-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "flexinfer.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  flexinfer-mission-control.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": "-- Grafana --",
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "panels": [
        {
          "title": "Shared GPU Groups",
          "type": "row",
          "gridPos": { "x": 0, "y": 0, "w": 24, "h": 1 },
          "collapsed": false
        },
        {
          "title": "Shared Group Leaders",
          "description": "Active model per shared GPU group",
          "type": "table",
          "gridPos": { "x": 0, "y": 1, "w": 12, "h": 7 },
          "targets": [
            {
              "expr": "flexinfer_sharedgroup_state{state=\"Active\"} == 1",
              "legendFormat": "",
              "refId": "A",
              "format": "table",
              "instant": true
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": { "Time": true, "Value": true, "__name__": true, "namespace": true, "job": true, "instance": true, "service": true, "pod": true, "container": true, "endpoint": true, "state": true },
                "renameByName": { "group": "GPU Group", "model": "Active Model" }
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": { "align": "left", "cellOptions": { "type": "color-text" } },
              "color": { "mode": "fixed", "fixedColor": "green" }
            }
          },
          "options": { "showHeader": true, "cellHeight": "sm" }
        },
        {
          "title": "Preemptions",
          "description": "Shared GPU group preemption activity",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 1, "w": 12, "h": 7 },
          "targets": [
            {
              "expr": "sum by (group) (rate(flexinfer_sharedgroup_preemptions_total[5m]))",
              "legendFormat": "{{ "{{" }}group{{ "}}" }}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "bars",
                "fillOpacity": 50,
                "lineWidth": 1,
                "showPoints": "never",
                "stacking": { "mode": "none" }
              },
              "color": { "mode": "palette-classic" }
            }
          }
        },
        {
          "title": "VRAM & GPU Health",
          "type": "row",
          "gridPos": { "x": 0, "y": 8, "w": 24, "h": 1 },
          "collapsed": false
        },
        {
          "title": "VRAM Usage per GPU",
          "description": "Used vs total VRAM for each GPU",
          "type": "bargauge",
          "gridPos": { "x": 0, "y": 9, "w": 10, "h": 8 },
          "targets": [
            {
              "expr": "flexinfer_gpu_vram_used_bytes / flexinfer_gpu_vram_total_bytes * 100",
              "legendFormat": "{{ "{{" }}node{{ "}}" }} / {{ "{{" }}gpu{{ "}}" }}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 80 },
                  { "color": "red", "value": 95 }
                ]
              },
              "color": { "mode": "thresholds" }
            }
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "orientation": "horizontal",
            "displayMode": "gradient",
            "showUnfilled": true
          }
        },
        {
          "title": "VRAM (GiB)",
          "description": "Used and free VRAM per GPU in GiB",
          "type": "timeseries",
          "gridPos": { "x": 10, "y": 9, "w": 6, "h": 8 },
          "targets": [
            {
              "expr": "flexinfer_gpu_vram_used_bytes / 1073741824",
              "legendFormat": "{{ "{{" }}node{{ "}}" }}/{{ "{{" }}gpu{{ "}}" }} used",
              "refId": "A"
            },
            {
              "expr": "flexinfer_gpu_vram_total_bytes / 1073741824",
              "legendFormat": "{{ "{{" }}node{{ "}}" }}/{{ "{{" }}gpu{{ "}}" }} total",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "decgbytes",
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "fillOpacity": 10,
                "lineWidth": 2,
                "showPoints": "never",
                "spanNulls": true,
                "stacking": { "mode": "none" }
              },
              "color": { "mode": "palette-classic" }
            },
            "overrides": [
              {
                "matcher": { "id": "byRegexp", "options": ".*total" },
                "properties": [
                  { "id": "custom.lineStyle", "value": { "fill": "dash", "dash": [10, 10] } },
                  { "id": "custom.fillOpacity", "value": 0 }
                ]
              }
            ]
          }
        },
        {
          "title": "GPU Temperature",
          "description": "GPU core temperature per node",
          "type": "gauge",
          "gridPos": { "x": 16, "y": 9, "w": 4, "h": 8 },
          "targets": [
            {
              "expr": "max by (node) (flexinfer_gpu_temperature_celsius)",
              "legendFormat": "{{ "{{" }}node{{ "}}" }}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "celsius",
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "#EAB839", "value": 70 },
                  { "color": "red", "value": 85 }
                ]
              }
            }
          }
        },
        {
          "title": "/dev/shm Utilization",
          "description": "tmpfs cache pressure per node",
          "type": "gauge",
          "gridPos": { "x": 20, "y": 9, "w": 4, "h": 8 },
          "targets": [
            {
              "expr": "flexinfer_dev_shm_utilization_percent",
              "legendFormat": "{{ "{{" }}node{{ "}}" }}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 70 },
                  { "color": "red", "value": 90 }
                ]
              }
            }
          }
        },
        {
          "title": "Throughput & Cold Start",
          "type": "row",
          "gridPos": { "x": 0, "y": 17, "w": 24, "h": 1 },
          "collapsed": false
        },
        {
          "title": "Tokens/sec by Model",
          "description": "Real-time inference throughput",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 18, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "sum by (model, node) (flexinfer_tokens_per_second)",
              "legendFormat": "{{ "{{" }}model{{ "}}" }} ({{ "{{" }}node{{ "}}" }})",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "fillOpacity": 15,
                "lineWidth": 2,
                "showPoints": "auto",
                "spanNulls": false,
                "stacking": { "mode": "none" },
                "axisLabel": "tok/s"
              },
              "color": { "mode": "palette-classic" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "yellow", "value": 5 },
                  { "color": "green", "value": 20 }
                ]
              }
            }
          }
        },
        {
          "title": "Cold Start Duration (p95)",
          "description": "Time from activation to Ready",
          "type": "stat",
          "gridPos": { "x": 12, "y": 18, "w": 4, "h": 4 },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le, model) (rate(flexinfer_model_cold_start_duration_seconds_bucket[1h])))",
              "legendFormat": "{{ "{{" }}model{{ "}}" }}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 30 },
                  { "color": "red", "value": 120 }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "textMode": "value_and_name",
            "colorMode": "value"
          }
        },
        {
          "title": "Swap Duration (p95)",
          "description": "GPU group swap-in latency",
          "type": "stat",
          "gridPos": { "x": 16, "y": 18, "w": 4, "h": 4 },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le, group) (rate(flexinfer_model_swap_duration_seconds_bucket[1h])))",
              "legendFormat": "{{ "{{" }}group{{ "}}" }}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 10 },
                  { "color": "red", "value": 60 }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "textMode": "value_and_name",
            "colorMode": "value"
          }
        },
        {
          "title": "Model Load Time",
          "description": "Time to pull model from cache",
          "type": "stat",
          "gridPos": { "x": 20, "y": 18, "w": 4, "h": 4 },
          "targets": [
            {
              "expr": "avg by (model) (flexinfer_model_load_seconds)",
              "legendFormat": "{{ "{{" }}model{{ "}}" }}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 30 },
                  { "color": "red", "value": 120 }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "textMode": "value_and_name",
            "colorMode": "value"
          }
        },
        {
          "title": "Cold Start Over Time",
          "description": "Cold start duration history",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 22, "w": 12, "h": 4 },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum by (le, model) (rate(flexinfer_model_cold_start_duration_seconds_bucket[5m])))",
              "legendFormat": "p50 {{ "{{" }}model{{ "}}" }}",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.95, sum by (le, model) (rate(flexinfer_model_cold_start_duration_seconds_bucket[5m])))",
              "legendFormat": "p95 {{ "{{" }}model{{ "}}" }}",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "fillOpacity": 5,
                "lineWidth": 2,
                "showPoints": "auto",
                "spanNulls": false,
                "stacking": { "mode": "none" }
              },
              "color": { "mode": "palette-classic" }
            }
          }
        },
        {
          "title": "Queue & Cache",
          "type": "row",
          "gridPos": { "x": 0, "y": 26, "w": 24, "h": 1 },
          "collapsed": false
        },
        {
          "title": "Queued Models",
          "description": "Models queued behind the active leader in each shared GPU group",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 27, "w": 16, "h": 7 },
          "targets": [
            {
              "expr": "sum by (group) (flexinfer_sharedgroup_state{state=\"Queued\"})",
              "legendFormat": "{{ "{{" }}group{{ "}}" }}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "stepAfter",
                "fillOpacity": 20,
                "lineWidth": 2,
                "showPoints": "never",
                "stacking": { "mode": "none" }
              },
              "color": { "mode": "palette-classic" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 2 },
                  { "color": "red", "value": 4 }
                ]
              }
            }
          }
        },
        {
          "title": "Cache Hit Rate",
          "description": "Model cache effectiveness",
          "type": "stat",
          "gridPos": { "x": 16, "y": 27, "w": 4, "h": 7 },
          "targets": [
            {
              "expr": "flexinfer_modelcache_hit_rate * 100",
              "legendFormat": "{{ "{{" }}cache{{ "}}" }}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "yellow", "value": 50 },
                  { "color": "green", "value": 80 }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "textMode": "value_and_name",
            "colorMode": "value"
          }
        },
        {
          "title": "Cache Evictions",
          "description": "LRU cache eviction activity",
          "type": "timeseries",
          "gridPos": { "x": 20, "y": 27, "w": 4, "h": 7 },
          "targets": [
            {
              "expr": "sum by (cache) (rate(flexinfer_modelcache_evictions_total[5m]))",
              "legendFormat": "{{ "{{" }}cache{{ "}}" }}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "bars",
                "fillOpacity": 50,
                "lineWidth": 1,
                "showPoints": "never",
                "stacking": { "mode": "none" }
              },
              "color": { "mode": "palette-classic" }
            }
          }
        },
        {
          "title": "Opportunistic Model Backfill",
          "type": "row",
          "gridPos": { "x": 0, "y": 34, "w": 24, "h": 1 },
          "collapsed": false
        },
        {
          "title": "Backfill Attempts",
          "description": "Starts and terminal results during the selected dashboard range",
          "type": "stat",
          "gridPos": { "x": 0, "y": 35, "w": 8, "h": 6 },
          "targets": [
            {
              "expr": "sum(increase(flexinfer_model_backfill_starts_total[$__range])) or vector(0)",
              "legendFormat": "Started",
              "refId": "A"
            },
            {
              "expr": "sum by (result) (increase(flexinfer_model_backfill_completions_total[$__range]))",
              "legendFormat": "{{ "{{" }}result{{ "}}" }}",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": { "mode": "palette-classic" }
            }
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "orientation": "horizontal",
            "textMode": "value_and_name",
            "colorMode": "value"
          }
        },
        {
          "title": "Backfill Preemptions",
          "description": "Foreground and gaming cancellations; repeated growth means the idle gate or template needs tuning",
          "type": "timeseries",
          "gridPos": { "x": 8, "y": 35, "w": 8, "h": 6 },
          "targets": [
            {
              "expr": "sum by (reason) (increase(flexinfer_model_backfill_preemptions_total[$__rate_interval]))",
              "legendFormat": "{{ "{{" }}reason{{ "}}" }}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "bars",
                "fillOpacity": 50,
                "lineWidth": 1,
                "showPoints": "never",
                "stacking": { "mode": "normal" }
              },
              "color": { "mode": "palette-classic" }
            }
          }
        },
        {
          "title": "Useful Backfill Time",
          "description": "Cumulative background Job runtime in the selected range; waiting-for-idle time is excluded",
          "type": "stat",
          "gridPos": { "x": 16, "y": 35, "w": 8, "h": 6 },
          "targets": [
            {
              "expr": "sum(increase(flexinfer_model_backfill_useful_running_seconds_total[$__range])) or vector(0)",
              "legendFormat": "Useful runtime",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "color": { "mode": "fixed", "fixedColor": "blue" }
            }
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "textMode": "value_and_name",
            "colorMode": "value"
          }
        }
      ],
      "refresh": "10s",
      "schemaVersion": 36,
      "style": "dark",
      "tags": ["flexinfer", "gpu", "operations"],
      "templating": {
        "list": [
          {
            "allValue": ".*",
            "current": { "selected": true, "text": "All", "value": "$__all" },
            "datasource": "Prometheus",
            "definition": "label_values(flexinfer_gpu_vram_used_bytes, node)",
            "hide": 0,
            "includeAll": true,
            "label": "Node",
            "multi": true,
            "name": "node",
            "query": "label_values(flexinfer_gpu_vram_used_bytes, node)",
            "refresh": 2,
            "sort": 1,
            "type": "query"
          },
          {
            "allValue": ".*",
            "current": { "selected": true, "text": "All", "value": "$__all" },
            "datasource": "Prometheus",
            "definition": "label_values(flexinfer_sharedgroup_state, group)",
            "hide": 0,
            "includeAll": true,
            "label": "GPU Group",
            "multi": true,
            "name": "group",
            "query": "label_values(flexinfer_sharedgroup_state, group)",
            "refresh": 2,
            "sort": 1,
            "type": "query"
          }
        ]
      },
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timepicker": {},
      "timezone": "",
      "title": "FlexInfer Mission Control",
      "uid": "flexinfer-main",
      "version": 3,
      "weekStart": ""
    }
{{- end }}

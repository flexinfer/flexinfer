apiVersion: v1
kind: Service
metadata:
  name: {{ include "flexinfer.fullname" . }}-proxy
  labels:
    {{- include "flexinfer.labels" . | nindent 4 }}
    app: flexinfer-proxy
spec:
  type: {{ .Values.proxy.service.type }}
  ports:
    - port: {{ .Values.proxy.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "flexinfer.selectorLabels" . | nindent 4 }}
    app: flexinfer-proxy

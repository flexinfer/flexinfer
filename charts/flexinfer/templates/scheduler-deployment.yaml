{{- $scheduler := default (dict) .Values.scheduler -}}
{{- $schedulerImage := default (dict) $scheduler.image -}}
{{- $weights := default (dict) $scheduler.weights -}}
{{- $tenantFairShare := default (dict) $scheduler.tenantFairShare -}}
{{- $kubeScheduler := default (dict) $scheduler.kubeScheduler -}}
{{- $kubeSchedulerImage := default (dict) $kubeScheduler.image -}}
{{- $kubeconfigInit := default (dict) $scheduler.kubeconfigInit -}}
{{- $kubeconfigInitImage := default (dict) $kubeconfigInit.image -}}
{{- if $scheduler.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flexinfer.fullname" . }}-scheduler
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "flexinfer.labels" . | nindent 4 }}
    app.kubernetes.io/component: scheduler
spec:
  replicas: {{ default 1 $scheduler.replicas }}
  selector:
    matchLabels:
      {{- include "flexinfer.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: scheduler
  template:
    metadata:
      annotations:
        flexinfer.ai/chart-version: {{ .Chart.Version | quote }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "flexinfer.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: scheduler
    spec:
      serviceAccountName: {{ include "flexinfer.schedulerServiceAccountName" . }}
      {{- with $scheduler.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $scheduler.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $scheduler.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: kubeconfig-init
          image: "{{ default "busybox" $kubeconfigInitImage.repository }}:{{ default "1.37" $kubeconfigInitImage.tag }}"
          imagePullPolicy: {{ include "flexinfer.imagePullPolicy" $kubeconfigInitImage }}
          command:
            - /bin/sh
            - -ec
            - |
              cat > /etc/kubernetes/kubeconfig <<'EOF'
              apiVersion: v1
              kind: Config
              clusters:
              - name: in-cluster
                cluster:
                  server: https://kubernetes.default.svc
                  certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              users:
              - name: sa
                user:
                  tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              contexts:
              - name: default
                context:
                  cluster: in-cluster
                  user: sa
              current-context: default
              EOF
          volumeMounts:
            - name: scheduler-workdir
              mountPath: /etc/kubernetes
      containers:
        - name: flexinfer-scheduler
          image: {{ include "flexinfer.imageRef" (merge (deepCopy $schedulerImage) (dict "tag" (.Chart.AppVersion | toString))) | quote }}
          imagePullPolicy: {{ include "flexinfer.imagePullPolicy" $schedulerImage }}
          args:
            - --port={{ default 8082 $scheduler.port }}
          ports:
            - name: http
              containerPort: {{ default 8082 $scheduler.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml $scheduler.resources | nindent 12 }}
          env:
            - name: SCHED_TPS_WEIGHT
              value: "{{ default 0.7 $weights.tps }}"
            - name: SCHED_UTIL_WEIGHT
              value: "{{ default 0.2 $weights.util }}"
            - name: SCHED_COST_WEIGHT
              value: "{{ default 0.1 $weights.cost }}"
            - name: SCHED_CACHE_WEIGHT
              value: "{{ default 0.3 $weights.cache }}"
            - name: SCHED_VRAM_FREE_WEIGHT
              value: "{{ default 10.0 $weights.vramFree }}"
            - name: SCHED_TENANT_FAIRSHARE_ENABLED
              value: "{{ default false $tenantFairShare.enabled }}"
            - name: SCHED_TENANT_FAIRSHARE_WEIGHT
              value: "{{ default 5.0 $tenantFairShare.weight }}"
            - name: SCHED_TENANT_FAIRSHARE_BUDGET_GPUS
              value: "{{ default 1.0 $tenantFairShare.gpuBudget }}"
            - name: SCHED_TENANT_LABEL_KEY
              value: "{{ default "" $tenantFairShare.tenantLabelKey }}"
        - name: kube-scheduler
          image: "{{ default "registry.k8s.io/kube-scheduler" $kubeSchedulerImage.repository }}:{{ default "v1.35.2" $kubeSchedulerImage.tag }}"
          imagePullPolicy: {{ include "flexinfer.imagePullPolicy" $kubeSchedulerImage }}
          command:
            - kube-scheduler
          args:
            - --config=/etc/kubernetes/scheduler-config.yaml
            - --kubeconfig=/etc/kubernetes/kubeconfig
            - --secure-port=0
            - --v=2
          volumeMounts:
            - name: scheduler-workdir
              mountPath: /etc/kubernetes
            - name: scheduler-config
              mountPath: /etc/kubernetes/scheduler-config.yaml
              subPath: scheduler-config.yaml
              readOnly: true
      volumes:
        - name: scheduler-workdir
          emptyDir: {}
        - name: scheduler-config
          configMap:
            name: {{ include "flexinfer.fullname" . }}-scheduler-config
            items:
              - key: scheduler-config.yaml
                path: scheduler-config.yaml
{{- end }}

{{- if .Values.proxy.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flexinfer.fullname" . }}-proxy
  labels:
    {{- include "flexinfer.labels" . | nindent 4 }}
    app: flexinfer-proxy
spec:
  replicas: {{ .Values.proxy.replicaCount }}
  selector:
    matchLabels:
      {{- include "flexinfer.selectorLabels" . | nindent 6 }}
      app: flexinfer-proxy
  template:
    metadata:
      annotations:
        flexinfer.ai/chart-version: {{ .Chart.Version | quote }}
      labels:
        {{- include "flexinfer.selectorLabels" . | nindent 8 }}
        app: flexinfer-proxy
    spec:
      serviceAccountName: {{ include "flexinfer.proxyServiceAccountName" . }}
      containers:
        - name: proxy
          image: "{{ .Values.proxy.image.repository }}:{{ .Values.proxy.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ include "flexinfer.imagePullPolicy" .Values.proxy.image }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- if .Values.observability.tracing.enabled }}
            - name: FLEXINFER_OTEL_ENABLED
              value: "true"
            {{- if .Values.observability.tracing.otlpEndpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.observability.tracing.otlpEndpoint | quote }}
            {{- end }}
            {{- if .Values.observability.tracing.serviceNamespace }}
            - name: FLEXINFER_OTEL_SERVICE_NAMESPACE
              value: {{ .Values.observability.tracing.serviceNamespace | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.proxy.timeouts }}
            {{- if .Values.proxy.timeouts.queue }}
            - name: PROXY_QUEUE_TIMEOUT
              value: {{ .Values.proxy.timeouts.queue | quote }}
            {{- end }}
            {{- if .Values.proxy.timeouts.coldStart }}
            - name: PROXY_COLD_START_TIMEOUT
              value: {{ .Values.proxy.timeouts.coldStart | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.proxy.routing }}
            {{- if .Values.proxy.routing.explicitKeyMaxLength }}
            - name: PROXY_ROUTING_EXPLICIT_KEY_MAX_LENGTH
              value: {{ .Values.proxy.routing.explicitKeyMaxLength | quote }}
            {{- end }}
            {{- if .Values.proxy.routing.systemSegmentMaxLength }}
            - name: PROXY_ROUTING_SYSTEM_SEGMENT_MAX_LENGTH
              value: {{ .Values.proxy.routing.systemSegmentMaxLength | quote }}
            {{- end }}
            {{- if .Values.proxy.routing.documentSegmentMaxLength }}
            - name: PROXY_ROUTING_DOCUMENT_SEGMENT_MAX_LENGTH
              value: {{ .Values.proxy.routing.documentSegmentMaxLength | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.proxy.rateLimit }}
            {{- if .Values.proxy.rateLimit.enabled }}
            - name: PROXY_RATE_LIMIT_ENABLED
              value: "true"
            {{- end }}
            {{- if .Values.proxy.rateLimit.perModelRPS }}
            - name: PROXY_RATE_LIMIT_PER_MODEL
              value: {{ .Values.proxy.rateLimit.perModelRPS | quote }}
            {{- end }}
            {{- if .Values.proxy.rateLimit.burst }}
            - name: PROXY_RATE_LIMIT_BURST
              value: {{ .Values.proxy.rateLimit.burst | quote }}
            {{- end }}
            {{- if .Values.proxy.rateLimit.globalRPS }}
            - name: PROXY_RATE_LIMIT_GLOBAL
              value: {{ .Values.proxy.rateLimit.globalRPS | quote }}
            {{- end }}
            {{- if .Values.proxy.rateLimit.globalBurst }}
            - name: PROXY_RATE_LIMIT_GLOBAL_BURST
              value: {{ .Values.proxy.rateLimit.globalBurst | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.proxy.auth }}
            {{- if .Values.proxy.auth.enabled }}
            - name: PROXY_AUTH_ENABLED
              value: "true"
            {{- if .Values.proxy.auth.tokenSecretName }}
            - name: PROXY_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.proxy.auth.tokenSecretName }}
                  key: {{ .Values.proxy.auth.tokenSecretKey | default "token" }}
            {{- end }}
            {{- end }}
            {{- end }}
          resources:
            {{- toYaml .Values.proxy.resources | nindent 12 }}
{{- end }}

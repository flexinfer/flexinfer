{{- $proxy := default (dict) .Values.proxy -}}
{{- $proxyImage := default (dict) $proxy.image -}}
{{- $observability := default (dict) .Values.observability -}}
{{- $tracing := default (dict) $observability.tracing -}}
{{- if $proxy.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flexinfer.fullname" . }}-proxy
  labels:
    {{- include "flexinfer.labels" . | nindent 4 }}
    app: flexinfer-proxy
spec:
  replicas: {{ default 1 $proxy.replicaCount }}
  selector:
    matchLabels:
      {{- include "flexinfer.selectorLabels" . | nindent 6 }}
      app: flexinfer-proxy
  template:
    metadata:
      annotations:
        flexinfer.ai/chart-version: {{ .Chart.Version | quote }}
      labels:
        {{- include "flexinfer.selectorLabels" . | nindent 8 }}
        app: flexinfer-proxy
    spec:
      serviceAccountName: {{ include "flexinfer.proxyServiceAccountName" . }}
      containers:
        - name: proxy
          image: "{{ $proxyImage.repository }}:{{ $proxyImage.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ include "flexinfer.imagePullPolicy" $proxyImage }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- if $tracing.enabled }}
            - name: FLEXINFER_OTEL_ENABLED
              value: "true"
            {{- if $tracing.otlpEndpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ $tracing.otlpEndpoint | quote }}
            {{- end }}
            {{- if $tracing.serviceNamespace }}
            - name: FLEXINFER_OTEL_SERVICE_NAMESPACE
              value: {{ $tracing.serviceNamespace | quote }}
            {{- end }}
            {{- end }}
            {{- if $proxy.timeouts }}
            {{- if $proxy.timeouts.queue }}
            - name: PROXY_QUEUE_TIMEOUT
              value: {{ $proxy.timeouts.queue | quote }}
            {{- end }}
            {{- if $proxy.timeouts.coldStart }}
            - name: PROXY_COLD_START_TIMEOUT
              value: {{ $proxy.timeouts.coldStart | quote }}
            {{- end }}
            {{- end }}
            {{- if $proxy.routing }}
            {{- if $proxy.routing.explicitKeyMaxLength }}
            - name: PROXY_ROUTING_EXPLICIT_KEY_MAX_LENGTH
              value: {{ $proxy.routing.explicitKeyMaxLength | quote }}
            {{- end }}
            {{- if $proxy.routing.systemSegmentMaxLength }}
            - name: PROXY_ROUTING_SYSTEM_SEGMENT_MAX_LENGTH
              value: {{ $proxy.routing.systemSegmentMaxLength | quote }}
            {{- end }}
            {{- if $proxy.routing.documentSegmentMaxLength }}
            - name: PROXY_ROUTING_DOCUMENT_SEGMENT_MAX_LENGTH
              value: {{ $proxy.routing.documentSegmentMaxLength | quote }}
            {{- end }}
            {{- end }}
            {{- if $proxy.maxTokensClamp }}
            - name: PROXY_MAX_TOKENS_CLAMP_ENABLED
              value: {{ $proxy.maxTokensClamp.enabled | quote }}
            {{- if $proxy.maxTokensClamp.promptReserveTokens }}
            - name: PROXY_MAX_TOKENS_CLAMP_PROMPT_RESERVE_TOKENS
              value: {{ $proxy.maxTokensClamp.promptReserveTokens | quote }}
            {{- end }}
            {{- end }}
            {{- if $proxy.admission }}
            - name: PROXY_ADMISSION_ENABLED
              value: {{ $proxy.admission.enabled | quote }}
            {{- if $proxy.admission.safetyMarginPercent }}
            - name: PROXY_ADMISSION_SAFETY_MARGIN_PERCENT
              value: {{ $proxy.admission.safetyMarginPercent | quote }}
            {{- end }}
            {{- if $proxy.admission.defaultMaxTokens }}
            - name: PROXY_ADMISSION_DEFAULT_MAX_TOKENS
              value: {{ $proxy.admission.defaultMaxTokens | quote }}
            {{- end }}
            {{- end }}
            {{- if $proxy.rateLimit }}
            {{- if $proxy.rateLimit.enabled }}
            - name: PROXY_RATE_LIMIT_ENABLED
              value: "true"
            {{- end }}
            {{- if $proxy.rateLimit.perModelRPS }}
            - name: PROXY_RATE_LIMIT_PER_MODEL
              value: {{ $proxy.rateLimit.perModelRPS | quote }}
            {{- end }}
            {{- if $proxy.rateLimit.burst }}
            - name: PROXY_RATE_LIMIT_BURST
              value: {{ $proxy.rateLimit.burst | quote }}
            {{- end }}
            {{- if $proxy.rateLimit.globalRPS }}
            - name: PROXY_RATE_LIMIT_GLOBAL
              value: {{ $proxy.rateLimit.globalRPS | quote }}
            {{- end }}
            {{- if $proxy.rateLimit.globalBurst }}
            - name: PROXY_RATE_LIMIT_GLOBAL_BURST
              value: {{ $proxy.rateLimit.globalBurst | quote }}
            {{- end }}
            {{- end }}
            {{- if $proxy.auth }}
            {{- if $proxy.auth.enabled }}
            - name: PROXY_AUTH_ENABLED
              value: "true"
            {{- if $proxy.auth.tokenSecretName }}
            - name: PROXY_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $proxy.auth.tokenSecretName }}
                  key: {{ $proxy.auth.tokenSecretKey | default "token" }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if $proxy.pyannoteUpstream }}
            - name: FLEXINFER_PYANNOTE_UPSTREAM
              value: {{ $proxy.pyannoteUpstream | quote }}
            {{- end }}
            {{- if $proxy.kokoroUpstream }}
            - name: FLEXINFER_KOKORO_UPSTREAM
              value: {{ $proxy.kokoroUpstream | quote }}
            {{- end }}
          resources:
            {{- toYaml $proxy.resources | nindent 12 }}
      {{- with $proxy.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $proxy.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

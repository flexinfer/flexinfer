apiVersion: v1
kind: Service
metadata:
  name: {{ include "flexinfer.fullname" . }}-controller-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "flexinfer.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  selector:
    {{- include "flexinfer.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: controller
  ports:
    - port: 8080
      targetPort: metrics
      protocol: TCP
      name: metrics

{{- /*
ServiceAccounts + RBAC for FlexInfer components.
Each component runs under its own ServiceAccount to support least-privilege defaults.
*/ -}}

{{- $ns := .Release.Namespace -}}
{{- $fullname := include "flexinfer.fullname" . -}}

{{- if and .Values.controller.enabled .Values.serviceAccounts.controller.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "flexinfer.controllerServiceAccountName" . }}
  namespace: {{ $ns }}
  labels:
    {{- include "flexinfer.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
  {{- with .Values.serviceAccounts.controller.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
{{- end }}

{{- if and .Values.agent.enabled .Values.serviceAccounts.agent.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "flexinfer.agentServiceAccountName" . }}
  namespace: {{ $ns }}
  labels:
    {{- include "flexinfer.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
  {{- with .Values.serviceAccounts.agent.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
{{- end }}

{{- if and .Values.scheduler.enabled .Values.serviceAccounts.scheduler.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "flexinfer.schedulerServiceAccountName" . }}
  namespace: {{ $ns }}
  labels:
    {{- include "flexinfer.labels" . | nindent 4 }}
    app.kubernetes.io/component: scheduler
  {{- with .Values.serviceAccounts.scheduler.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
{{- end }}

{{- if and .Values.proxy.enabled .Values.serviceAccounts.proxy.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "flexinfer.proxyServiceAccountName" . }}
  namespace: {{ $ns }}
  labels:
    {{- include "flexinfer.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
  {{- with .Values.serviceAccounts.proxy.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
{{- end }}

{{- if and .Values.controller.enabled .Values.serviceAccounts.benchmarker.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "flexinfer.benchmarkerServiceAccountName" . }}
  namespace: {{ $ns }}
  labels:
    {{- include "flexinfer.labels" . | nindent 4 }}
    app.kubernetes.io/component: benchmarker
  {{- with .Values.serviceAccounts.benchmarker.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
{{- end }}

{{- if .Values.controller.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fullname }}-controller
  labels:
    {{- include "flexinfer.labels" . | nindent 4 }}
rules:
  - apiGroups: ["ai.flexinfer"]
    resources:
      - modeldeployments
      - modeldeployments/status
      - modeldeployments/finalizers
      - modelcaches
      - modelcaches/status
      - modelcaches/finalizers
      - gpugroups
      - gpugroups/status
      - gpugroups/finalizers
      - models
      - models/status
      - models/finalizers
      - modelcatalogs
      - modelcatalogs/status
      - modelcatalogs/finalizers
      - loraadapters
      - loraadapters/status
      - loraadapters/finalizers
      - clusters
      - clusters/status
      - clusters/finalizers
      - federatedmodels
      - federatedmodels/status
      - federatedmodels/finalizers
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "daemonsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "persistentvolumeclaims", "configmaps", "events", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # v1alpha2 Model scheduling requires inspecting cluster nodes to detect GPU vendor/arch.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $fullname }}-controller
  labels:
    {{- include "flexinfer.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "flexinfer.controllerServiceAccountName" . }}
    namespace: {{ $ns }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $fullname }}-controller
---
{{- end }}

{{- if .Values.agent.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fullname }}-agent
  labels:
    {{- include "flexinfer.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $fullname }}-agent
  labels:
    {{- include "flexinfer.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "flexinfer.agentServiceAccountName" . }}
    namespace: {{ $ns }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $fullname }}-agent
---
# Allow the agent to list pods in its own namespace for metrics scraping.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullname }}-agent-pods
  namespace: {{ $ns }}
  labels:
    {{- include "flexinfer.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullname }}-agent-pods
  namespace: {{ $ns }}
  labels:
    {{- include "flexinfer.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "flexinfer.agentServiceAccountName" . }}
    namespace: {{ $ns }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $fullname }}-agent-pods
---
{{- end }}

{{- if .Values.scheduler.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fullname }}-scheduler
  labels:
    {{- include "flexinfer.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete", "update"]
  - apiGroups: [""]
    resources: ["pods/status"]
    verbs: ["patch", "update"]
  - apiGroups: [""]
    resources: ["bindings", "pods/binding"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["replicasets", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "csinodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims", "persistentvolumes"]
    verbs: ["get", "list", "watch", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $fullname }}-scheduler
  labels:
    {{- include "flexinfer.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "flexinfer.schedulerServiceAccountName" . }}
    namespace: {{ $ns }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $fullname }}-scheduler
---
# The kube-scheduler sidecar needs full scheduler permissions.
# Bind to system:kube-scheduler for kube-scheduler compatibility.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $fullname }}-scheduler-system
  labels:
    {{- include "flexinfer.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "flexinfer.schedulerServiceAccountName" . }}
    namespace: {{ $ns }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:kube-scheduler
---
{{- end }}

{{- if .Values.proxy.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullname }}-proxy
  namespace: {{ $ns }}
  labels:
    {{- include "flexinfer.labels" . | nindent 4 }}
rules:
  - apiGroups: ["ai.flexinfer"]
    resources: ["modeldeployments"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["ai.flexinfer"]
    resources: ["modeldeployments/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["ai.flexinfer"]
    resources: ["gpugroups"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["ai.flexinfer"]
    resources: ["models"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["ai.flexinfer"]
    resources: ["models/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullname }}-proxy
  namespace: {{ $ns }}
  labels:
    {{- include "flexinfer.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "flexinfer.proxyServiceAccountName" . }}
    namespace: {{ $ns }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $fullname }}-proxy
---
{{- end }}

{{- if .Values.controller.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fullname }}-benchmarker
  labels:
    {{- include "flexinfer.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $fullname }}-benchmarker
  labels:
    {{- include "flexinfer.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "flexinfer.benchmarkerServiceAccountName" . }}
    namespace: {{ $ns }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $fullname }}-benchmarker
{{- end }}

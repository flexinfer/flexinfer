{{- /*
ServiceAccounts + RBAC for FlexInfer components.
Each component runs under its own ServiceAccount to support least-privilege defaults.
*/ -}}

{{- $ns := .Release.Namespace -}}
{{- $fullname := include "flexinfer.fullname" . -}}
{{- $serviceAccounts := default (dict) .Values.serviceAccounts -}}
{{- $controllerSA := default (dict) (get $serviceAccounts "controller") -}}
{{- $agentSA := default (dict) (get $serviceAccounts "agent") -}}
{{- $schedulerSA := default (dict) (get $serviceAccounts "scheduler") -}}
{{- $proxySA := default (dict) (get $serviceAccounts "proxy") -}}
{{- $benchmarkerSA := default (dict) (get $serviceAccounts "benchmarker") -}}

{{- if and .Values.controller.enabled (default true (get $controllerSA "create")) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "flexinfer.controllerServiceAccountName" . }}
  namespace: {{ $ns }}
  labels:
    {{- include "flexinfer.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
  {{- with (get $controllerSA "annotations") }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- with (get $controllerSA "imagePullSecrets") }}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
---
{{- end }}

{{- if and .Values.agent.enabled (default true (get $agentSA "create")) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "flexinfer.agentServiceAccountName" . }}
  namespace: {{ $ns }}
  labels:
    {{- include "flexinfer.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
  {{- with (get $agentSA "annotations") }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- with (get $agentSA "imagePullSecrets") }}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
---
{{- end }}

{{- if and .Values.scheduler.enabled (default true (get $schedulerSA "create")) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "flexinfer.schedulerServiceAccountName" . }}
  namespace: {{ $ns }}
  labels:
    {{- include "flexinfer.labels" . | nindent 4 }}
    app.kubernetes.io/component: scheduler
  {{- with (get $schedulerSA "annotations") }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- with (get $schedulerSA "imagePullSecrets") }}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
---
{{- end }}

{{- if and .Values.proxy.enabled (default true (get $proxySA "create")) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "flexinfer.proxyServiceAccountName" . }}
  namespace: {{ $ns }}
  labels:
    {{- include "flexinfer.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
  {{- with (get $proxySA "annotations") }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- with (get $proxySA "imagePullSecrets") }}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
---
{{- end }}

{{- if and .Values.controller.enabled (default true (get $benchmarkerSA "create")) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "flexinfer.benchmarkerServiceAccountName" . }}
  namespace: {{ $ns }}
  labels:
    {{- include "flexinfer.labels" . | nindent 4 }}
    app.kubernetes.io/component: benchmarker
  {{- with (get $benchmarkerSA "annotations") }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- with (get $benchmarkerSA "imagePullSecrets") }}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
---
{{- end }}

{{- if .Values.controller.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fullname }}-controller
  labels:
    {{- include "flexinfer.labels" . | nindent 4 }}
rules:
  - apiGroups: ["ai.flexinfer"]
    resources:
      - modeldeployments
      - modeldeployments/status
      - modeldeployments/finalizers
      - modelcaches
      - modelcaches/status
      - modelcaches/finalizers
      - gpugroups
      - gpugroups/status
      - gpugroups/finalizers
      - gpuprofiles
      - gpuprofiles/status
      - gpuprofiles/finalizers
      - models
      - models/status
      - models/finalizers
      - modelcatalogs
      - modelcatalogs/status
      - modelcatalogs/finalizers
      - loraadapters
      - loraadapters/status
      - loraadapters/finalizers
      - clusters
      - clusters/status
      - clusters/finalizers
      - federatedmodels
      - federatedmodels/status
      - federatedmodels/finalizers
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "daemonsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "persistentvolumeclaims", "configmaps", "events", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # v1alpha2 Model scheduling requires inspecting cluster nodes to detect GPU vendor/arch.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $fullname }}-controller
  labels:
    {{- include "flexinfer.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "flexinfer.controllerServiceAccountName" . }}
    namespace: {{ $ns }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $fullname }}-controller
---
{{- end }}

{{- if .Values.agent.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fullname }}-agent
  labels:
    {{- include "flexinfer.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $fullname }}-agent
  labels:
    {{- include "flexinfer.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "flexinfer.agentServiceAccountName" . }}
    namespace: {{ $ns }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $fullname }}-agent
---
# Allow the agent to list pods in its own namespace for metrics scraping.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullname }}-agent-pods
  namespace: {{ $ns }}
  labels:
    {{- include "flexinfer.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullname }}-agent-pods
  namespace: {{ $ns }}
  labels:
    {{- include "flexinfer.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "flexinfer.agentServiceAccountName" . }}
    namespace: {{ $ns }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $fullname }}-agent-pods
---
{{- end }}

{{- if .Values.scheduler.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fullname }}-scheduler
  labels:
    {{- include "flexinfer.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete", "update"]
  - apiGroups: [""]
    resources: ["pods/status"]
    verbs: ["patch", "update"]
  - apiGroups: [""]
    resources: ["bindings", "pods/binding"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["replicasets", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "csinodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims", "persistentvolumes"]
    verbs: ["get", "list", "watch", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $fullname }}-scheduler
  labels:
    {{- include "flexinfer.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "flexinfer.schedulerServiceAccountName" . }}
    namespace: {{ $ns }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $fullname }}-scheduler
---
# Dedicated ClusterRole for the kube-scheduler sidecar container.
# Replaces the overly-broad system:kube-scheduler binding with least-privilege.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fullname }}-kube-scheduler
  labels:
    {{- include "flexinfer.labels" . | nindent 4 }}
rules:
  # Core scheduling: read pods, nodes, namespaces
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete", "update"]
  - apiGroups: [""]
    resources: ["pods/status"]
    verbs: ["patch", "update"]
  # Bind pods to nodes (the core scheduling action)
  - apiGroups: [""]
    resources: ["bindings", "pods/binding"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  # Leader election
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Emit scheduling events
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch", "update"]
  # Volume-aware scheduling
  - apiGroups: [""]
    resources: ["persistentvolumeclaims", "persistentvolumes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "csinodes", "csidrivers"]
    verbs: ["get", "list", "watch"]
  # Topology-aware scheduling
  - apiGroups: ["apps"]
    resources: ["replicasets", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch"]
  # Configmaps for scheduler policy
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  # Endpoints for leader election (legacy path)
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get", "list", "watch", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $fullname }}-kube-scheduler
  labels:
    {{- include "flexinfer.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "flexinfer.schedulerServiceAccountName" . }}
    namespace: {{ $ns }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $fullname }}-kube-scheduler
---
{{- end }}

{{- if .Values.proxy.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullname }}-proxy
  namespace: {{ $ns }}
  labels:
    {{- include "flexinfer.labels" . | nindent 4 }}
rules:
  - apiGroups: ["ai.flexinfer"]
    resources: ["modeldeployments"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["ai.flexinfer"]
    resources: ["modeldeployments/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["ai.flexinfer"]
    resources: ["gpugroups"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["ai.flexinfer"]
    resources: ["models"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["ai.flexinfer"]
    resources: ["models/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["ai.flexinfer"]
    resources: ["loraadapters"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["services", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullname }}-proxy
  namespace: {{ $ns }}
  labels:
    {{- include "flexinfer.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "flexinfer.proxyServiceAccountName" . }}
    namespace: {{ $ns }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $fullname }}-proxy
---
# ClusterRole for proxy — nodes are cluster-scoped, cannot be granted via a namespace Role.
# Required by RuntimeCache.nodeMatches() for direct runtime load path.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fullname }}-proxy
  labels:
    {{- include "flexinfer.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $fullname }}-proxy
  labels:
    {{- include "flexinfer.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "flexinfer.proxyServiceAccountName" . }}
    namespace: {{ $ns }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $fullname }}-proxy
---
{{- end }}

{{- if .Values.controller.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fullname }}-benchmarker
  labels:
    {{- include "flexinfer.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $fullname }}-benchmarker
  labels:
    {{- include "flexinfer.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "flexinfer.benchmarkerServiceAccountName" . }}
    namespace: {{ $ns }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $fullname }}-benchmarker
{{- end }}

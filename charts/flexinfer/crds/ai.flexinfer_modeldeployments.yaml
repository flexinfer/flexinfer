                  tokensPerSecond:
                    description: TokensPerSecond is the current generation speed.
                    type: string
                type: object
              phase:
                description: Phase represents the current phase of the ModelDeployment
                type: string
              tokensPerSecond:
                description: |-
                  TokensPerSecond is the measured tokens per second for the model on a specific device class.
                  Stored as a string to avoid precision issues with floats.
                type: string
            type: object

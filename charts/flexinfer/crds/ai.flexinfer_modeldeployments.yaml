  names:
    kind: ModelDeployment
    listKind: ModelDeploymentList
    plural: modeldeployments
    singular: modeldeployment
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.backend
      name: Backend
      type: string
    - jsonPath: .spec.model
      name: Model
      type: string
    - jsonPath: .spec.replicas
      name: Replicas
      type: integer
    - jsonPath: .status.tokensPerSecond
      name: TPS
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ModelDeployment is the Schema for the modeldeployments API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ModelDeploymentSpec defines the desired state of ModelDeployment
            properties:
              backend:
                description: Backend is the name of the LLM backend to use (e.g.,
                  ollama, vllm).
                type: string
              benchmark:
                description: Benchmark defines tuning knobs for the benchmarking process.
                properties:
                  batchSize:
                    default: 128
                    description: BatchSize is the target number of tokens to generate
                      per benchmark request.
                    format: int32
                    minimum: 1
                    type: integer
                  iterations:
                    default: 5
                    description: |-
                      Iterations is the number of measurement iterations to run (in addition to warmup).
                      The benchmark may run longer than this if MinDuration has not been satisfied.
                    format: int32
                    minimum: 1
                    type: integer
                  minDuration:
                    description: |-
                      MinDuration is the minimum duration for the benchmark.
                      The benchmark will run for at least this duration or for a minimum number of iterations, whichever comes first.
                    type: string
                  warmupIterations:
                    default: 2
                    description: WarmupIterations is the number of warmup iterations
                      to run before the main benchmark.
                    format: int32
                    type: integer
                type: object
              idleTimeoutSeconds:
                default: 300
                description: IdleTimeoutSeconds is the duration in seconds before
                  scaling down to MinReplicas.
                format: int32
                minimum: 0
                type: integer
              litellm:
                description: |-
                  LiteLLM configures integration with the LiteLLM proxy.
                  When enabled, the controller adds annotations that allow LiteLLM to discover this model.
                properties:
                  aliases:
                    description: Aliases is a list of additional model aliases that
                      LiteLLM will route to this deployment.
                    items:
                      type: string
                    type: array
                  copilotAlias:
                    description: CopilotAlias is an alias with drop_params=true for
                      Copilot/IDE compatibility.
                    type: string
                  enabled:
                    default: true
                    description: |-
                      Enabled controls whether LiteLLM annotations are added to the deployment.
                      When true, the controller adds litellm.flexinfer.ai/* annotations.
                    type: boolean
                  servedModelName:
                    description: |-
                      ServedModelName is the model name exposed to LiteLLM clients.
                      Defaults to the deployment name if not specified.
                    type: string
                type: object
              minReplicas:
                default: 0
                description: MinReplicas is the minimum number of replicas to scale
                  down to (e.g., 0 for serverless).
                format: int32
                minimum: 0
                type: integer
              model:
                description: Model is the identifier for the model to be deployed
                  (e.g., llama3:8b).
                type: string
              modelCacheRef:
                description: |-
                  ModelCacheRef references a ModelCache object to use for model storage.
                  If set, the deployment will use the cached model volume instead of creating its own.
                type: string
              nodeSelector:
                additionalProperties:
                  type: string
                description: |-
                  NodeSelector is a map of key-value pairs used to select nodes for scheduling.
                  This maps directly to the pod's nodeSelector field.
                type: object
              replicas:
                default: 1
                description: Replicas is the number of desired pods.
                format: int32
                minimum: 0
                type: integer
              resources:
                description: Resources defines the resources required by the model.
                properties:
                  claims:
                    description: |-
                      Claims lists the names of resources, defined in spec.resourceClaims,
                      that are used by this container.

                      This is an alpha field and requires enabling the
                      DynamicResourceAllocation feature gate.

                      This field is immutable. It can only be set for containers.
                    items:
                      description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                      properties:
                        name:
                          description: |-
                            Name must match the name of one entry in pod.spec.resourceClaims of
                            the Pod where this field is used. It makes that resource available
                            inside a container.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  limits:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Limits describes the maximum amount of compute resources allowed.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                  requests:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Requests describes the minimum amount of compute resources required.
                      If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                      otherwise to an implementation-defined value. Requests cannot exceed Limits.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                type: object
            required:
            - backend
            - model
            type: object
          status:
            description: ModelDeploymentStatus defines the observed state of ModelDeployment
            properties:
              allocatedGPU:
                description: AllocatedGPU contains information about the allocated
                  GPU
                properties:
                  device:
                    description: Device is the GPU device index
                    type: string
                  memoryMB:
                    description: MemoryMB is the GPU memory in megabytes
                    format: int64
                    type: integer
                  node:
                    description: Node is the name of the node where the GPU is allocated
                    type: string
                  type:
                    description: Type is the GPU type/model
                    type: string
                type: object
              conditions:
                description: Conditions represent the latest available observations
                  of the ModelDeployment's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              endpoints:
                description: Endpoints defines the access endpoints for the model.
                properties:
                  external:
                    description: External is the external endpoint if exposed
                    type: string
                  internal:
                    description: Internal is the internal cluster endpoint
                    type: string
                type: object
              lastAccessTime:
                description: LastAccessTime is the timestamp of the last request to
                  the model.
                format: date-time
                type: string
              metrics:
                description: Metrics contains runtime metrics for the deployment
                properties:
                  avgLatencyMs:
                    description: AvgLatencyMs is the average latency in milliseconds
                    type: string
                  avgModelLoadTime:
                    description: AvgModelLoadTime is the average time to load the

                type: string
              failoverOrder:
                description: FailoverOrder is consulted only when strategy=Failover.
                items:
                  type: string
                type: array
              strategy:
                default: RoundRobin
                description: Strategy configures routing behavior.
                enum:
                - RoundRobin
                - Failover
                type: string
              tls:
                description: TLS configures public and downstream TLS behavior.
                properties:
                  insecureSkipVerify:
                    description: InsecureSkipVerify controls downstream TLS certificate

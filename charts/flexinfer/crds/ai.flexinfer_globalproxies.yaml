    shortNames:
    - gproxy
    singular: globalproxy
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.strategy
      name: Strategy
      type: string
    - jsonPath: .status.healthyClusters
      name: Healthy
      type: integer
    - jsonPath: .status.totalClusters
      name: Total
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha2
    schema:
      openAPIV3Schema:
        description: GlobalProxy is the Schema for globally routing requests across
          cluster-local proxies.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: GlobalProxySpec defines desired state for global cross-cluster
              routing.
            properties:
              clusters:
                description: Clusters are eligible downstream cluster proxy endpoints.
                items:
                  description: GlobalProxyClusterEndpoint configures one downstream
                    cluster proxy endpoint.
                  properties:
                    endpoint:
                      description: |-
                        Endpoint is the cluster proxy URL.
                        Must be an absolute http(s) URL.
                      pattern: ^https?://
                      type: string
                    name:
                      description: Name is the logical cluster name.
                      type: string
                    weight:
                      description: Weight is reserved for future weighted routing.

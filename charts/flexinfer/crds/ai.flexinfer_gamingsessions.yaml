---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: gamingsessions.ai.flexinfer
spec:
  group: ai.flexinfer
  names:
    kind: GamingSession
    listKind: GamingSessionList
    plural: gamingsessions
    shortNames:
    - gs
    - gamesession
    singular: gamingsession
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.nodeName
      name: Node
      type: string
    - jsonPath: .spec.mode
      name: Mode
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.observedMode
      name: Observed
      type: string
    - jsonPath: .spec.owner
      name: Owner
      type: string
    - jsonPath: .spec.expiresAt
      name: Expires
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha2
    schema:
      openAPIV3Schema:
        description: |-
          GamingSession is the declarative carrier for putting a GPU node into gaming
          mode. Creating one drains inference on the node and starts the Sunshine
          gaming host; deleting it returns the node to the inference fleet.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              GamingSessionSpec declares that a GPU node should be placed in a given mode.
              Creating a GamingSession drives the node to spec.mode (default "gaming"),
              which drains inference; deleting it always reverts the node to "inference".
            properties:
              expiresAt:
                description: |-
                  ExpiresAt is the lease deadline for this gaming session. Once now >=
                  ExpiresAt, the controller drives the node back to inference mode and keeps
                  the session Expired until the object is deleted or the deadline is
                  extended. A nil value means the session persists until explicit deletion
                  or runtime idle-revert policy.
                format: date-time
                type: string
              mode:
                default: gaming
                description: |-
                  Mode is the desired node mode while this session exists. Normal usage is
                  "gaming"; deleting the session reverts the node to "inference" regardless.
                enum:
                - inference
                - gaming
                type: string
              nodeName:
                description: NodeName is the GPU node to switch (matched via kubernetes.io/hostname).
                minLength: 1
                type: string
              owner:
                description: |-
                  Owner identifies the person, tool, or workflow that requested the gaming
                  lease. It is informational and used in events/status so stuck sessions can
                  be attributed.
                type: string
            required:
            - nodeName
            type: object
          status:
            description: GamingSessionStatus is the observed state of a gaming session.
            properties:
              activatedAt:
                description: ActivatedAt is when the node first reached the desired
                  gaming mode.
                format: date-time
                type: string
              expiredAt:
                description: |-
                  ExpiredAt is when the controller first observed the session past its
                  lease deadline and began reverting the node to inference.
                format: date-time
                type: string
              message:
                description: Message is a human-readable detail for the current phase.
                type: string
              observedMode:
                description: ObservedMode is the mode the node's runtime last reported.
                type: string
              phase:
                description: Phase is the coarse lifecycle phase.
                type: string
              runtimePod:
                description: RuntimePod is the runtime pod the controller is driving
                  on the node.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}

      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.nodeName
      name: Node
      type: string
    - jsonPath: .status.jobName
      name: Job
      type: string
    - jsonPath: .status.attempts
      name: Attempts
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha2
    schema:
      openAPIV3Schema:
        description: ModelBackfill declares opportunistic work against an already-warm
          model.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ModelBackfillSpec runs CPU-side background work against an already-warm
              Model. It deliberately cannot claim a GPU; exclusive GPU work requires a
              separate GPULease-backed contract and live promotion gate.
            properties:
              idleFor:
                description: |-
                  IdleFor is the continuous foreground-idle window required before a Job is
                  admitted. Zero defaults to ten minutes.
                type: string
              maxRunDuration:
                description: MaxRunDuration bounds each Job attempt. Zero defaults
                  to thirty minutes.
                type: string
              modelRef:
                description: ModelRef names the v1alpha2 Model whose idle window gates
                  this work.
                minLength: 1
                type: string
              suspend:
                description: Suspend prevents new work and cancels a running attempt.
                type: boolean
              templateRef:
                description: |-
                  TemplateRef names a CronJob in the same namespace. Its Job template is
                  copied into an owner-referenced Job after the idle gate. GPU resource
                  requests are rejected: this first version consumes an existing warm model
                  endpoint rather than evicting it.
                minLength: 1
                type: string
            required:
            - modelRef
            - templateRef
            type: object
          status:
            description: ModelBackfillStatus reports the current admission/execution
              state.
            properties:
              attempts:
                description: |-
                  Attempts counts Jobs created for this declaration, including attempts
                  preempted by foreground demand.
                format: int32
                type: integer
              completionTime:
                description: CompletionTime is when the work reached a terminal result.
                format: date-time
                type: string
              conditions:
                description: Conditions carry detailed readiness and execution transitions.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              idleSince:
                description: IdleSince is the beginning of the currently observed
                  foreground-idle span.
                format: date-time
                type: string
              jobName:
                description: JobName is the active or most recent owned Job.
                type: string
              message:
                description: Message is a human-readable phase detail.
                type: string
              nodeName:
                description: NodeName is the node hosting the referenced warm Model.
                type: string
              observedGeneration:
                description: ObservedGeneration is the spec generation represented
                  by this status.
                format: int64
                type: integer
              phase:
                description: Phase is the coarse lifecycle phase.
                type: string
              reason:
                description: Reason is a stable machine-readable explanation for the
                  phase.
                type: string
              startedAt:
                description: StartedAt is when the current/most recent Job attempt
                  started.
                format: date-time
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:

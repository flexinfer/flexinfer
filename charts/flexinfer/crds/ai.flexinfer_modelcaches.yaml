---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: modelcaches.ai.flexinfer
spec:
  group: ai.flexinfer
  names:
    kind: ModelCache
    listKind: ModelCacheList
    plural: modelcaches
    singular: modelcache
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.storageStrategy
      name: Strategy
      type: string
    - jsonPath: .status.path
      name: Path
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ModelCache is the Schema for the modelcaches API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ModelCacheSpec defines the desired state of ModelCache
            properties:
              clusterStorageClassName:
                description: ClusterStorageClassName is the storage class to use for
                  SharedPVC strategy
                type: string
              existingClaimName:
                description: |-
                  ExistingClaimName references an existing PVC to use instead of creating one.
                  When set, the controller skips PVC creation and uses the referenced claim.
                  The model will be downloaded to a subdirectory named after the ModelCache.
                type: string
              modelPath:
                description: |-
                  ModelPath is the subdirectory within the PVC where the model is stored.
                  Defaults to the ModelCache name if not specified.
                type: string
              secretRef:
                description: 'SecretRef is the name of the secret containing authentication
                  credentials (key: HF_TOKEN)'
                type: string
              source:
                description: |-
                  Source is the URI of the model to cache.
                  Formats:
                    - huggingface://meta-llama/Llama-2-7b-chat-hf (standard HF models)
                    - mlc://mlc-ai/Qwen3-0.6B-q4f16_1-MLC (MLC-compiled models)
                    - HF://mlc-ai/Qwen3-0.6B-q4f16_1-MLC (MLC shorthand for HuggingFace)
                type: string
              storageSize:
                default: 50Gi
                description: |-
                  StorageSize is the requested storage size for newly created PVCs.
                  Ignored when existingClaimName is set.
                type: string
              storageStrategy:
                default: Auto
                description: StorageStrategy defines the caching strategy
                type: string
            required:
            - source
            type: object
          status:
            description: ModelCacheStatus defines the observed state of ModelCache
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of the state
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              path:
                description: Path is the path where the model is accessible (volume
                  name or host path)
                type: string
              phase:
                description: Phase represents the current lifecycle state
                type: string
              sizeBytes:
                description: SizeBytes is the size of the cached model

---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: modelcaches.ai.flexinfer
spec:
  group: ai.flexinfer
  names:
    kind: ModelCache
    listKind: ModelCacheList
    plural: modelcaches
    singular: modelcache
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.storageStrategy
      name: Strategy
      type: string
    - jsonPath: .status.readyNodes
      name: Ready
      type: integer
    - jsonPath: .status.totalNodes
      name: Total
      type: integer
    - jsonPath: .status.path
      name: Path
      type: string
    - jsonPath: .status.retryCount
      name: Retries
      priority: 1
      type: integer
    - jsonPath: .status.cacheSizeBytes
      name: Size
      priority: 1
      type: integer
    - jsonPath: .status.lastAccessTime
      name: LastAccess
      priority: 1
      type: date
    - jsonPath: .status.evictionCount
      name: Evictions
      priority: 1
      type: integer
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ModelCache is the Schema for the modelcaches API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ModelCacheSpec defines the desired state of ModelCache
            properties:
              abliteration:
                description: |-
                  Abliteration configures pre-quantization abliteration of model weights.
                  When set, the controller creates an abliteration Job after download completes
                  (and before quantization if both are set). Abliteration removes the "refusal
                  direction" from transformer weights via contrastive activation analysis.
                properties:
                  ablitateLmHead:
                    default: true
                    description: |-
                      AblitateLmHead controls whether the lm_head output projection is abliterated.
                      Set to false to skip lm_head modification (safer for hybrid architectures).
                    type: boolean
                  maxMemoryGB:
                    description: MaxMemoryGB for the abliteration container. Default
                      56 (27B BF16 + overhead).
                    format: int32
                    type: integer
                  nodeSelector:
                    additionalProperties:
                      type: string
                    description: NodeSelector overrides spec.nodeSelector for abliteration
                      jobs.
                    type: object
                  normThreshold:
                    default: "100"
                    description: |-
                      NormThreshold is the max allowed L2 norm of the refusal direction.
                      Abliteration aborts if any layer's norm exceeds this value.
                      The controller also validates this after the job completes.
                      Format: numeric string (e.g., "100"). Default "100".
                    type: string
                  numSamples:
                    default: 128
                    description: NumSamples is the number of contrastive prompt pairs
                      for activation collection.
                    format: int32
                    maximum: 512
                    minimum: 16
                    type: integer
                  skipGDNLayers:
                    default: true
                    description: |-
                      SkipGDNLayers excludes GDN (Gated Delta Network) linear attention layers from
                      abliteration. Qwen3.5 uses a hybrid architecture where 48 of 64 layers are GDN
                      (linear attention) and 16 are standard self-attention. Abliterating GDN layers
                      destroys the recurrence mechanics (out_proj feedback into decay/gate computation).
                      When true (default), the script auto-detects GDN layers via decoder_sparse_step
                      from config.json and abliterates only the full-attention layers.
                    type: boolean
                  skipVisionLayers:
                    default: true
                    description: SkipVisionLayers excludes vision encoder layers from
                      abliteration (VLMs like Qwen3.5).
                    type: boolean
                  targetLayers:
                    default: auto
                    description: |-
                      TargetLayers selects which decoder layers to abliterate.
                      "auto" (default) = all decoder layers, "10-55" = range, "0,1,5,10" = explicit indices.
                    type: string
                  timeoutSeconds:
                    description: TimeoutSeconds overrides the default 2-hour deadline.
                    format: int64
                    maximum: 172800
                    minimum: 300
                    type: integer
                  useGPU:
                    description: 'UseGPU: when true, loads model with device_map="auto"
                      (GPU+CPU offload).'
                    type: boolean
                  weightMatrices:
                    description: |-
                      WeightMatrices to orthogonalize against the refusal direction.
                      Defaults to ["o_proj", "down_proj"] if empty.
                    items:
                      type: string
                    type: array
                type: object
              clusterStorageClassName:
                description: ClusterStorageClassName is the storage class to use for
                  SharedPVC strategy
                type: string
              download:
                description: |-
                  Download configures the model download job (memory, hf_transfer, retries).
                  When nil, defaults are applied: 16Gi memory, hf_transfer auto-enabled, 3 retries.
                properties:
                  backoffLimit:
                    description: |-
                      BackoffLimit is the number of retries before marking the download as failed.
                      Defaults to 3.
                    format: int32
                    maximum: 10
                    minimum: 0
                    type: integer
                  hfTransfer:
                    description: |-
                      HFTransfer enables the hf_transfer Rust extension for faster parallel downloads.
                      nil = auto (enabled when MaxMemoryGB >= 16), true/false = explicit override.
                      hf_transfer uses ~4-8Gi for parallel connections on large models.
                    type: boolean
                  maxMemoryGB:
                    description: |-
                      MaxMemoryGB limits the memory available to the download job container.
                      Defaults to 16. Set higher for hf_transfer with very large models.
                    format: int32
                    maximum: 128
                    minimum: 1
                    type: integer
                  timeoutSeconds:
                    description: TimeoutSeconds overrides the default job deadline
                      for downloads.
                    format: int64
                    maximum: 86400
                    minimum: 300
                    type: integer
                type: object
              evictionPolicy:
                default: LRU
                description: |-
                  EvictionPolicy defines the cache eviction strategy when storage pressure occurs.
                  Supports LRU (least recently used), LFU (least frequently used), FIFO (oldest first),
                  or None to disable automatic eviction.
                enum:
                - LRU
                - LFU
                - FIFO
                - None
                type: string
              evictionThresholdPercent:
                default: 85
                description: |-
                  EvictionThresholdPercent is the storage utilization percentage that triggers eviction.
                  When /dev/shm usage exceeds this threshold, the controller evicts caches based on policy.
                  Only applies to Memory storage strategy.
                format: int32
                maximum: 99
                minimum: 50
                type: integer
              existingClaimName:
                description: |-
                  ExistingClaimName references an existing PVC to use instead of creating one.
                  When set, the controller skips PVC creation and uses the referenced claim.
                  The model will be downloaded to a subdirectory named after the ModelCache.
                type: string
              finetune:
                description: |-
                  Finetune configures post-abliteration finetuning of model weights.
                  When set, the controller creates a finetune Job after abliteration (if set)
                  or download completes (and before quantization if set).
                  Pipeline: Download → [Abliterate] → [Finetune] → [Quantize] → Ready.
                properties:
                  batchSize:
                    description: BatchSize is the per-device training batch size.
                      Default 4.
                    format: int32
                    type: integer
                  dataset:
                    description: Dataset configures the training data source.
                    properties:
                      huggingFace:
                        description: HuggingFace is a HF dataset ID (e.g., "tatsu-lab/alpaca").
                        type: string
                      maxSamples:
                        description: MaxSamples limits the number of training samples
                          (nil = all).
                        format: int32
                        type: integer
                      pvcName:
                        description: PVCName references a PVC containing the dataset.
                        type: string
                      pvcSubPath:
                        description: PVCSubPath is the path within the dataset PVC.
                        type: string
                      split:
                        description: Split selects the dataset split (default "train").
                        type: string
                    type: object
                  epochs:
                    description: Epochs is the number of training epochs. Default
                      3.
                    format: int32
                    maximum: 100
                    minimum: 1
                    type: integer
                  gradientCheckpointing:
                    description: |-
                      GradientCheckpointing enables gradient checkpointing to reduce VRAM.
                      Default true.
                    type: boolean
                  learningRate:
                    description: LearningRate (e.g., "2e-4"). Default "2e-4".
                    type: string
                  lora:
                    description: |-
                      LoRA configures LoRA/QLoRA adapter parameters.
                      Ignored when mode is "full".
                    properties:
                      alpha:
                        description: Alpha scaling factor. Default 32.
                        format: int32
                        type: integer
                      dropout:
                        description: Dropout probability. Default 0.05.
                        type: string
                      rank:
                        description: Rank (r) for LoRA decomposition. Default 16.
                        format: int32
                        maximum: 256
                        minimum: 1
                        type: integer
                      targetModules:
                        description: |-
                          TargetModules overrides which modules get LoRA adapters.
                          Default: Unsloth auto-selection.
                        items:
                          type: string
                        type: array
                    type: object
                  maxMemoryGB:
                    description: |-
                      MaxMemoryGB limits memory for the finetune job container.
                      Default 56.
                    format: int32
                    type: integer
                  maxSeqLen:
                    description: MaxSeqLen for training. Default 2048.
                    format: int32
                    maximum: 32768
                    minimum: 128
                    type: integer
                  mergeAdapter:
                    description: |-
                      MergeAdapter merges the LoRA adapter back into the base model after training.
                      Required for quantization to see the finetuned weights. Default true.
                    type: boolean
                  mode:
                    default: qlora
                    description: Mode selects LoRA, QLoRA, or full finetuning. Default
                      "qlora".
                    enum:
                    - lora
                    - qlora
                    - full
                    type: string
                  timeoutSeconds:
                    description: TimeoutSeconds overrides the default 6-hour deadline.
                    format: int64
                    maximum: 86400
                    minimum: 300
                    type: integer
                  useGPU:
                    description: UseGPU enables GPU-accelerated finetuning. Default
                      true.
                    type: boolean
                required:
                - dataset
                type: object
              flashLoader:
                description: |-
                  FlashLoader configures the flash-loader init container for fast model loading.
                  When enabled, model files are parallel-copied from PVC to tmpfs before
                  the inference container starts, dramatically reducing cold start time.
                properties:
                  concurrency:
                    default: 4
                    description: Concurrency is the number of parallel copy goroutines.
                    maximum: 32
                    minimum: 1
                    type: integer
                  enabled:
                    description: Enabled activates flash-loader for this cache.
                    type: boolean
                  image:
                    description: Image overrides the flash-loader init container image.
                    type: string
                  p2p:
                    description: P2P enables peer-to-peer transfer between pods on
                      the same node.
                    type: boolean
                  p2pPort:
                    default: 9876
                    description: P2PPort is the port used for peer-to-peer transfer.
                    type: integer
                  tmpfsSizeLimit:
                    description: |-
                      TmpfsSizeLimit is the maximum size of the tmpfs volume.
                      Defaults to 2x the model size if not specified.
                    type: string
                type: object
              hostPath:
                description: |-
                  HostPath is the base directory for NodeLocal storage.
                  Defaults to /var/lib/flexinfer/models if not specified.
                type: string
              maxCacheSizeBytes:
                description: |-
                  MaxCacheSizeBytes limits the maximum size this cache can occupy.
                  Used for capacity planning and eviction decisions.
                format: int64
                type: integer
              maxRetries:
                description: |-
                  MaxRetries is the maximum number of automatic retries before marking as permanently failed.
                  Applies to all pipeline phases (download, abliteration, finetune, quantization, publish).
                  Uses exponential backoff between retries: min(30s * 2^retryCount, 10m).
                  Default: 3.
                format: int32
                maximum: 10
                minimum: 0
                type: integer
              modelGroup:
                description: |-
                  ModelGroup associates this cache with a named group for coordinated eviction.
                  Caches in the same group are evicted together when any member exceeds thresholds.
                  Useful for models with shared tokenizers or adapters.
                type: string
              modelPath:
                description: |-
                  ModelPath is the subdirectory within the PVC where the model is stored.
                  Defaults to the ModelCache name if not specified.
                type: string
              nodeSelector:
                additionalProperties:
                  type: string
                description: |-
                  NodeSelector restricts which nodes should cache the model.
                  Used with NodeLocal strategy. Defaults to nodes with nvidia.com/gpu.present=true.
                type: object
              ociPollInterval:
                description: |-
                  OCIPollInterval enables periodic freshness checks for OCI sources.
                  When set (e.g. "1h", "30m"), the controller resolves the remote OCI tag digest
                  and triggers a re-download if the upstream has changed.
                  Disabled by default (nil or empty string).
                type: string
              ociRegistrySecretRef:
                description: |-
                  OCIRegistrySecretRef is the name of a kubernetes.io/dockerconfigjson secret
                  for authenticating to OCI registries. Used when source begins with oci:// or oras://
                type: string
              publish:
                description: |-
                  Publish configures post-pipeline publishing of model artifacts to OCI or HuggingFace.
                  When set, the controller creates a publish Job after the last pipeline phase succeeds.
                  Pipeline: Download → [Abliterate] → [Finetune] → [Quantize] → [Publish] → Ready.
                properties:
                  additionalTags:
                    description: |-
                      AdditionalTags lists extra tags to apply after push (server-side via oras tag, no re-upload).
                      Example: ["latest", "stable"].
                    items:
                      type: string
                    type: array
                  huggingFaceRepo:
                    description: |-
                      HuggingFaceRepo is the HuggingFace repository to upload to (e.g. "myorg/qwen3-gptq-int4").
                      Required when targets includes "huggingface".
                    type: string
                  maxMemoryGB:
                    description: |-
                      MaxMemoryGB limits the memory for the publish job container.
                      Publish is CPU+network only. Default 8.
                    format: int32
                    type: integer
                  ociRef:
                    description: |-
                      OCIRef is the OCI artifact reference to push to (e.g. "registry.harbor.lan/models/qwen3:gptq-int4").
                      Required when targets includes "oci".
                    type: string
                  secretRef:
                    description: |-
                      SecretRef is the name of the K8s secret containing credentials.
                      Expected keys: OCI_USERNAME, OCI_PASSWORD (for OCI), HF_TOKEN (for HuggingFace).
                    type: string
                  tagPolicy:
                    default: overwrite
                    description: |-
                      TagPolicy controls how OCI tags are generated during publish.
                        - "overwrite" (default): push to the exact tag in OCIRef.
                        - "timestamp": append -YYYYMMDD-HHMMSS to the base tag.
                        - "digest-suffix": append -sha256-<first12> of the pushed digest.
                    enum:
                    - overwrite
                    - timestamp
                    - digest-suffix
                    type: string
                  targets:
                    description: Targets lists the publish destinations.
                    items:
                      description: PublishTarget identifies where to publish the model.
                      enum:
                      - oci
                      - huggingface
                      type: string
                    minItems: 1
                    type: array
                  timeoutSeconds:
                    description: TimeoutSeconds overrides the default 2-hour deadline
                      for publish jobs.
                    format: int64
                    maximum: 172800
                    minimum: 300
                    type: integer
                  validate:
                    description: |-
                      Validate, when set with Enabled=true, runs the artifact validator
                      (build/scripts/validate_quantized_artifact.py) as a one-shot Job before
                      the publish job is created. Publish only proceeds if the validator
                      returns ok=true. Failure marks the publish phase failed and emits a
                      PublishValidationFailed event with the validator's error list.
                    properties:
                      enabled:
                        default: false
                        description: |-
                          Enabled gates whether the validator runs. Defaults to false so existing
                          PublishSpecs without a Validate block keep their previous behavior.
                        type: boolean
                      failOnWarnings:
                        default: false
                        description: |-
                          FailOnWarnings, when true, treats validator warnings as errors and
                          blocks publish. Defaults to false (warnings are recorded in status
                          but do not block).
                        type: boolean
                      family:
                        default: auto
                        description: |-
                          Family selects the model family for family-specific validation rules.
                          "auto" lets the validator infer from config.json. Use a registered
                          family ID (e.g. "gemma4-26b-a4b") to enforce family-specific checks.
                        type: string
                      image:
                        description: |-
                          Image overrides the validator container image. Defaults to the runtime
                          image (which bundles the validator script at
                          /opt/flexinfer/scripts/validate_quantized_artifact.py).
                        type: string
                      layout:
                        default: auto
                        description: |-
                          Layout selects the artifact layout the validator should expect. "auto"
                          lets the validator infer it from tensor patterns. Use a specific value
                          (e.g. "vllm-gptq") to require that layout.
                        enum:
                        - auto
                        - hf-native
                        - vllm-gptq
                        - compressed-tensors
                        type: string
                      maxMemoryGB:
                        description: |-
                          MaxMemoryGB caps the validator container memory. Validator is CPU-only,
                          reads safetensors metadata, and parses tensor shape headers — 4 GB is
                          generous. Defaults to 4.
                        format: int32
                        maximum: 64
                        minimum: 1
                        type: integer
                      timeoutSeconds:
                        description: |-
                          TimeoutSeconds caps the validator job runtime. Defaults to 600
                          (10 min) which is comfortably above the observed ~10s metadata pass
                          for a 26B GPTQ artifact.
                        format: int64
                        maximum: 3600
                        minimum: 60
                        type: integer
                    required:
                    - enabled
                    type: object
                required:
                - targets
                type: object
              quantization:
                description: |-
                  Quantization configures post-download quantization of model weights.
                  When set, the controller creates a quantization Job after the download
                  completes, converting the model to the specified format before marking Ready.
                properties:
                  bits:
                    description: Bits is the quantization bit width for AWQ/GPTQ/COMPRESSED_TENSORS
                      formats.
                    format: int32
                    type: integer
                  calibration:
                    description: |-
                      Calibration configures calibration parameters for AWQ/GPTQ quantization.
                      Ignored for GGUF and EXL2 formats.
                    properties:
                      dataset:
                        description: |-
                          Dataset is the HuggingFace dataset used for calibration samples.
                          Defaults to "mit-han-lab/pile-val-backup".
                        type: string
                      maxSamples:
                        description: |-
                          MaxSamples is the number of calibration samples to use.
                          Defaults to 256.
                        format: int32
                        maximum: 2048
                        minimum: 8
                        type: integer
                      maxSeqLen:
                        description: |-
                          MaxSeqLen is the maximum sequence length for calibration samples.
                          Defaults to 4096.
                        format: int32
                        maximum: 32768
                        minimum: 128
                        type: integer
                      nParallelCalibSamples:
                        description: |-
                          NParallelCalibSamples controls how many calibration samples are processed
                          in parallel during AWQ quantization. Lower values reduce peak VRAM usage.
                          Defaults to 16 for models >10B params on <=24GB VRAM.
                        format: int32
                        maximum: 256
                        minimum: 1
                        type: integer
                    type: object
                  denseModuleCosineThreshold:
                    description: |-
                      DenseModuleCosineThreshold is the minimum cosine similarity required when
                      DenseModulePolicy is "validate". It is formatted as a string to avoid
                      floating-point serialization drift in CRD specs. Defaults to "0.98".
                      Only used for GPTQ format.
                    type: string
                  denseModulePolicy:
                    description: |-
                      DenseModulePolicy controls how GPTQ dense linear module families are
                      handled after quantization when a family-specific validator is available.
                      Defaults to "fallback", which restores dense modules to source precision.
                      "validate" keeps dense GPTQ modules only after the validator accepts every
                      layer in the family. Only used for GPTQ format.
                    enum:
                    - fallback
                    - validate
                    type: string
                  descAct:
                    description: |-
                      DescAct enables activation reordering (desc_act) for GPTQ (default false).
                      desc_act=false gives faster inference; true gives slightly better quality.
                      Ignored for non-GPTQ formats.
                    type: boolean
                  dynamicExclusion:
                    description: |-
                      DynamicExclusion controls which module patterns are excluded from
                      quantization (kept at full precision). Defaults to "auto".
                        - "auto": auto-detect hybrid architectures and exclude attention/expert/
                          vision/MTP modules (matches official Qwen GPTQ-Int4 approach).
                          Produces larger models (~25 GB for 27B) — needs multi-GPU.
                        - "gdn": exclude only GDN (linear_attn) layers but keep full attention
                          quantized. Fits single-GPU (24 GB) while preserving GDN recurrence
                          quality. Use for Qwen3.5 on single-GPU deployments.
                        - "none": quantize all modules to the target bit width (pure INT4).
                          WARNING: corrupts GDN recurrence in Qwen3.5 — produces garbage.
                      Only used for GPTQ format.
                    enum:
                    - auto
                    - gdn
                    - none
                    type: string
                  format:
                    description: Format is the target quantization format.
                    enum:
                    - GGUF
                    - AWQ
                    - GPTQ
                    - EXL2
                    - FP8
                    - COMPRESSED_TENSORS
                    type: string
                  ggufType:
                    description: |-
                      GGUFType is the GGUF quantization level (e.g., Q4_K_M, Q5_K_M, Q8_0).
                      Only used when Format is GGUF.
                    type: string
                  gpuMemoryFraction:
                    description: |-
                      GPUMemoryFraction caps the fraction of GPU VRAM available to the
                      quantization process (e.g. "0.80"). Defaults to "0.80".
                      Lower values leave more headroom for GPU driver overhead (important on ROCm
                      where HIP/GTT allocations bypass container cgroup limits).
                      Only used for GPTQ format.
                    type: string
                  groupSize:
                    description: GroupSize is the quantization group size for AWQ/GPTQ/COMPRESSED_TENSORS
                      formats.
                    format: int32
                    type: integer
                  maxMemoryGB:
                    description: |-
                      MaxMemoryGB limits the memory available to the quantization job.
                      Defaults to 32GB for GGUF, 48GB for AWQ/GPTQ/COMPRESSED_TENSORS.
                    format: int32
                    type: integer
                  nodeSelector:
                    additionalProperties:
                      type: string
                    description: |-
                      NodeSelector overrides spec.nodeSelector for quantization jobs.
                      Useful when quantization needs a different node (e.g., more RAM).
                    type: object
                  sym:
                    description: |-
                      Sym enables symmetric quantization for GPTQ (default true).
                      sym=true is required for ExLlama kernels (best ROCm performance).
                      Ignored for non-GPTQ formats.
                    type: boolean
                  timeoutSeconds:
                    description: TimeoutSeconds overrides the default 2-hour deadline
                      for quantization jobs.
                    format: int64
                    maximum: 172800
                    minimum: 300
                    type: integer
                  useGPU:
                    description: |-
                      UseGPU enables GPU-accelerated quantization
                      (required for AWQ/GPTQ/COMPRESSED_TENSORS).
                      GGUF quantization runs on CPU only.
                    type: boolean
                required:
                - format
                type: object
              retentionPriority:
                default: 50
                description: |-
                  RetentionPriority influences eviction order within the same policy tier.
                  Higher values (0-100) mean the cache is kept longer.
                  Production models should have higher priority than experimental ones.
                format: int32
                maximum: 100
                minimum: 0
                type: integer
              secretRef:
                description: 'SecretRef is the name of the secret containing authentication
                  credentials (key: HF_TOKEN)'
                type: string
              source:
                description: |-
                  Source is the URI of the model to cache.
                  Formats:
                    - huggingface://meta-llama/Llama-2-7b-chat-hf (standard HF models)
                    - mlc://mlc-ai/Qwen3-0.6B-q4f16_1-MLC (MLC-compiled models)
                    - HF://mlc-ai/Qwen3-0.6B-q4f16_1-MLC (MLC shorthand for HuggingFace)
                    - oci://registry.example.com/models/llama3:v1 (OCI artifact)
                    - oras://registry.example.com/models/llama3@sha256:... (OCI with digest)
                type: string
              storageSize:
                default: 50Gi
                description: |-
                  StorageSize is the requested storage size for newly created PVCs.
                  Ignored when existingClaimName is set.
                type: string
              storageStrategy:
                default: Auto
                description: StorageStrategy defines the caching strategy
                type: string
            required:
            - source
            type: object
          status:
            description: ModelCacheStatus defines the observed state of ModelCache
            properties:
              abliteration:
                description: |-
                  Abliteration records the result of model abliteration.
                  Only populated when spec.abliteration is set and the job completes.
                properties:
                  abliterationTime:
                    description: AbliterationTime is the wall-clock duration of the
                      abliteration job.
                    type: string
                  failureMessage:
                    description: FailureMessage contains the last lines of pod logs
                      on failure.
                    type: string
                  layersModified:
                    description: LayersModified is the number of decoder layers that
                      were abliterated.
                    format: int32
                    type: integer
                  progress:
                    description: Progress is the current job progress percentage (0-100),
                      read from structured telemetry.
                    format: int32
                    type: integer
                  progressDetail:
                    description: ProgressDetail is a human-readable description of
                      current progress.
                    type: string
                  refusalDirNorm:
                    description: RefusalDirNorm is the L2 norm of the mean refusal
                      direction vector (diagnostic).
                    type: string
                  startedAt:
                    description: StartedAt is the timestamp when the abliteration
                      job started.
                    format: date-time
                    type: string
                type: object
              accessCount:
                description: |-
                  AccessCount tracks total number of accesses to this cache.
                  Used for LFU eviction policy and hit rate calculations.
                format: int64
                type: integer
              cacheHitRate:
                description: |-
                  CacheHitRate is the ratio of successful cache lookups to total requests.
                  Format: "0.95" (95% hit rate). Useful for tuning eviction policies.
                type: string
              cacheSizeBytes:
                description: |-
                  CacheSizeBytes is the actual size of the cached model data.
                  Updated during provisioning and periodically during reconciliation.
                format: int64
                type: integer
              conditions:
                description: Conditions represent the latest available observations
                  of the state
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              currentPhase:
                description: |-
                  CurrentPhase tracks which pipeline phase is currently active.
                  Values: "download", "abliteration", "finetune", "quantization", "publish", "ready".
                  Used by phase guards to enforce strict pipeline ordering.
                type: string
              evictionCount:
                description: |-
                  EvictionCount tracks how many times this cache has been evicted since creation.
                  Useful for identifying hot/cold models and tuning retention priorities.
                format: int64
                type: integer
              finetune:
                description: |-
                  Finetune records the result of model finetuning.
                  Only populated when spec.finetune is set and the job completes.
                properties:
                  epochsCompleted:
                    description: EpochsCompleted is the number of epochs completed.
                    format: int32
                    type: integer
                  failureMessage:
                    description: FailureMessage on error.
                    type: string
                  finetuneTime:
                    description: FinetuneTime is the wall-clock duration.
                    type: string
                  progress:
                    description: Progress is the current job progress percentage (0-100),
                      read from structured telemetry.
                    format: int32
                    type: integer
                  progressDetail:
                    description: ProgressDetail is a human-readable description of
                      current progress.
                    type: string
                  samplesPerSecond:
                    description: SamplesPerSecond is the training throughput.
                    type: string
                  startedAt:
                    description: StartedAt timestamp.
                    format: date-time
                    type: string
                  totalSteps:
                    description: TotalSteps is the total training steps completed.
                    format: int32
                    type: integer
                  trainLoss:
                    description: TrainLoss is the final training loss.
                    type: string
                type: object
              lastAccessTime:
                description: |-
                  LastAccessTime is the most recent time this cache was accessed by a ModelDeployment.
                  Updated when a deployment references this cache.
                format: date-time
                type: string
              lastFailurePhase:
                description: LastFailurePhase records which phase last failed
                type: string
              lastFailureTime:
                description: LastFailureTime records when the last failure occurred
                format: date-time
                type: string
              ociDigest:
                description: |-
                  OCIDigest is the immutable digest of the OCI artifact that was pulled.
                  Format: sha256:<hash>. Only set for OCI/ORAS sources.
                type: string
              ociLastProbeAt:
                description: OCILastProbeAt is the timestamp of the last OCI freshness
                  probe.
                format: date-time
                type: string
              ociPulledAt:
                description: |-
                  OCIPulledAt is the timestamp when the OCI artifact was last pulled.
                  Useful for tracking freshness and triggering re-pulls on tag updates.
                format: date-time
                type: string
              ociRegistry:
                description: |-
                  OCIRegistry is the registry hostname where the artifact was pulled from.
                  Extracted from the source URL for observability.
                type: string
              ociRemoteDigest:
                description: |-
                  OCIRemoteDigest is the most recently observed remote OCI digest.
                  Compared against OCIDigest to detect upstream changes.
                type: string
              path:
                description: Path is the path where the model is accessible (volume
                  name or host path)
                type: string
              phase:
                description: Phase represents the current lifecycle state
                type: string
              publish:
                description: |-
                  Publish records the result of model publishing.
                  Only populated when spec.publish is set and the job completes.
                properties:
                  failureMessage:
                    description: FailureMessage contains the error message on failure.
                    type: string
                  huggingFaceCommit:
                    description: HuggingFaceCommit is the commit hash from the HuggingFace
                      upload.
                    type: string
                  ociDigest:
                    description: OCIDigest is the digest of the published OCI artifact.
                    type: string
                  previousDigests:
                    description: |-
                      PreviousDigests tracks the last 5 published OCI digests for rollback visibility.
                      Most recent digest is first.
                    items:
                      type: string
                    type: array
                  progress:
                    description: Progress is the current job progress percentage (0-100).
                    format: int32
                    type: integer
                  progressDetail:
                    description: ProgressDetail is a human-readable description of
                      current progress.
                    type: string
                  publishedAt:
                    description: PublishedAt is the timestamp when publishing completed.
                    format: date-time
                    type: string
                  publishedTags:
                    description: |-
                      PublishedTags lists all OCI tags that were applied during the last publish.
                      Includes the primary tag and any additional tags from spec.publish.additionalTags.
                    items:
                      type: string
                    type: array
                  startedAt:
                    description: StartedAt is the timestamp when the publish job started.
                    format: date-time
                    type: string
                  validate:
                    description: |-
                      Validate records the result of the pre-publish artifact validation gate
                      when spec.publish.validate.enabled=true. Always populated for gated
                      publishes, regardless of pass/fail.
                    properties:
                      errors:
                        description: Errors is the list of validator errors that gated
                          publish. Empty when Ok.
                        items:
                          type: string
                        type: array
                      family:
                        description: Family is the resolved model family the validator
                          detected or used.
                        type: string
                      layout:
                        description: Layout is the resolved artifact layout the validator
                          detected or used.
                        type: string
                      ok:
                        description: |-
                          Ok is true when the validator returned ok=true (no errors, and no
                          warnings if FailOnWarnings was set).
                        type: boolean
                      validatedAt:
                        description: ValidatedAt records when the validator job completed.
                        format: date-time
                        type: string
                      warnings:
                        description: |-
                          Warnings is the list of validator warnings (non-blocking unless
                          FailOnWarnings was set in the spec).
                        items:
                          type: string
                        type: array
                    required:
                    - ok
                    type: object
                type: object
              quantization:
                description: |-
                  Quantization records the result of model quantization.
                  Only populated when spec.quantization is set and the job completes.
                properties:
                  calibrationParams:
                    description: CalibrationParams records the calibration parameters
                      that were actually used.
                    properties:
                      dataset:
                        description: |-
                          Dataset is the HuggingFace dataset used for calibration samples.
                          Defaults to "mit-han-lab/pile-val-backup".
                        type: string
                      maxSamples:
                        description: |-
                          MaxSamples is the number of calibration samples to use.
                          Defaults to 256.
                        format: int32
                        maximum: 2048
                        minimum: 8
                        type: integer
                      maxSeqLen:
                        description: |-
                          MaxSeqLen is the maximum sequence length for calibration samples.
                          Defaults to 4096.
                        format: int32
                        maximum: 32768
                        minimum: 128
                        type: integer
                      nParallelCalibSamples:
                        description: |-
                          NParallelCalibSamples controls how many calibration samples are processed
                          in parallel during AWQ quantization. Lower values reduce peak VRAM usage.
                          Defaults to 16 for models >10B params on <=24GB VRAM.
                        format: int32
                        maximum: 256
                        minimum: 1
                        type: integer
                    type: object
                  completedAt:
                    description: CompletedAt is the timestamp when the quantization
                      job completed.
                    format: date-time
                    type: string
                  compressedSizeBytes:
                    description: CompressedSizeBytes is the size of the model after
                      quantization.
                    format: int64
                    type: integer
                  compressionRatio:
                    description: CompressionRatio is the ratio of original to compressed
                      size (e.g., "3.75").
                    type: string
                  failureMessage:
                    description: FailureMessage contains the last lines of pod logs
                      on failure.
                    type: string
                  format:
                    description: Format is the quantization format that was applied.
                    type: string
                  originalSizeBytes:
                    description: OriginalSizeBytes is the size of the model before
                      quantization.
                    format: int64
                    type: integer
                  progress:
                    description: Progress is the current job progress percentage (0-100),
                      read from structured telemetry.
                    format: int32
                    type: integer
                  progressDetail:
                    description: ProgressDetail is a human-readable description of
                      current progress (e.g., "layer 152/336").
                    type: string
                  quantizationTime:
                    description: QuantizationTime is the wall-clock duration of the
                      quantization job.
                    type: string
                  startedAt:
                    description: StartedAt is the timestamp when the quantization
                      job started.
                    format: date-time
                    type: string
                  type:
                    description: Type is the specific quantization type (e.g., Q4_K_M
                      for GGUF).
                    type: string
                type: object
              readyNodes:
                description: ReadyNodes is the count of nodes where the model is fully
                  cached (NodeLocal strategy)
                format: int32
                type: integer
              residencySeconds:
                description: |-
                  ResidencySeconds is the cumulative time this cache has been resident in memory.
                  Resets when cache is evicted. Useful for cost attribution.
                format: int64
                type: integer
              residentSince:
                description: |-
                  ResidentSince is the timestamp when this cache became resident in memory.
                  Nil when cache is not currently resident. Used for residency calculations.
                format: date-time
                type: string
              retryCount:
                description: RetryCount tracks how many times the current phase has
                  been retried
                format: int32
                type: integer
              sizeBytes:
                description: SizeBytes is the size of the cached model
                type: string
              totalNodes:
                description: TotalNodes is the count of nodes that should have the
                  model cached (NodeLocal strategy)
                format: int32
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}

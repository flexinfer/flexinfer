# Default values for flexinfer.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

nameOverride: ""
fullnameOverride: ""

# Legacy: prefer serviceAccounts.* going forward.
serviceAccount:
  create: true
  annotations: {}
  name: ""

serviceAccounts:
  controller:
    create: true
    annotations: {}
    imagePullSecrets: []
    name: ""
  agent:
    create: true
    annotations: {}
    imagePullSecrets: []
    name: ""
  scheduler:
    create: true
    annotations: {}
    imagePullSecrets: []
    name: ""
  proxy:
    create: true
    annotations: {}
    imagePullSecrets: []
    name: ""
  benchmarker:
    create: true
    annotations: {}
    imagePullSecrets: []
    name: ""

podAnnotations: {}

controller:
  enabled: true
  replicas: 1
  image:
    repository: ghcr.io/flexinfer/flexinfer-controller
    # Optional immutable digest. When set, Helm renders repository@digest and
    # pullPolicy defaults to IfNotPresent.
    digest: ""
    # pullPolicy auto-detected from tag: Always for mutable (latest/master), IfNotPresent for SHA tags.
    # Override with an explicit pullPolicy to disable auto-detection.
    tag: "latest"
  # Optional scheduling controls for the controller Deployment.
  # Useful when your cluster has mixed architectures (e.g., arm64 nodes).
  nodeSelector: {}
  tolerations: []
  affinity: {}
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi
  runtime:
    # Shared memory volume size mounted at /dev/shm for model pods created by the v1alpha2 controller.
    shmSizeLimit: "8Gi"
    # Optional imagePullSecrets applied to model pods created by the v1alpha2 controller.
    # Use this when backend/runtime images live in a private registry.
    imagePullSecrets: []
    # Flash-loader defaults used by v1alpha2 model deployments when enabled globally
    # or when a matching v1alpha1 ModelCache enables flashLoader.
    flashLoader:
      enabled: false
      image: "registry.harbor.lan/flexinfer/flash-loader:latest"
      concurrency: 4
      # Optional tmpfs size limit for flash-loader staging volume.
      tmpfsSizeLimit: ""

# Persistent runtime containers — one per GPU node for near-instant model swapping.
# When enabled, the controller loads models via the runtime API instead of creating
# separate Deployments for each model.
runtime:
  enabled: false
  # Always pull runtime images since tags are mutable (e.g., :rocm-gfx1100).
  imagePullPolicy: Always
  # Default host path for model storage (overridden per-profile via modelVolume).
  modelHostPath: "/var/lib/flexinfer/models"
  terminationGracePeriodSeconds: 60
  # Per-GPU-profile runtime configurations.
  # Each entry creates a DaemonSet targeting nodes with that GPU architecture.
  profiles: []
  # Example profiles:
  # - name: gfx1100
  #   image: "registry.harbor.lan/flexinfer/runtime:rocm-gfx1100"
  #   gpuVendor: amd
  #   gpuArch: gfx1100
  #   gpuCount: 1
  #   shmSize: "8Gi"
  #   memoryLimit: "4Gi"
  #   memoryRequest: "1Gi"
  #   nodeSelector:
  #     kubernetes.io/hostname: cblevins-7900xtx
  # - name: gfx906
  #   image: "registry.harbor.lan/flexinfer/runtime:rocm-gfx906"
  #   gpuVendor: amd
  #   gpuArch: gfx906
  #   gpuCount: 1
  #   nodeSelector:
  #     kubernetes.io/hostname: cblevins-radeonvii
  # - name: cuda-maxwell
  #   image: "registry.harbor.lan/flexinfer/runtime:cuda-maxwell"
  #   gpuVendor: nvidia
  #   gpuArch: sm_52
  #   gpuCount: 1
  #   nodeSelector:
  #     kubernetes.io/hostname: cblevins-5930k

# Optional image prewarming DaemonSets. Use this for large serving images that
# are not otherwise kept warm by the persistent runtime DaemonSet on every GPU
# node. Containers sleep after kubelet pulls the image, keeping the image in-use
# so node image GC does not immediately reclaim it.
imagePrewarm:
  enabled: false
  imagePullPolicy: IfNotPresent
  # Release-gated profiles are held Ready for this long before promotion can
  # proceed. Per-profile releaseGate enables immutable digest validation.
  minReadySeconds: 30
  priorityClassName: flexinfer-modelcache-warmup
  terminationGracePeriodSeconds: 5
  maxUnavailable: 1
  resources:
    requests:
      cpu: 5m
      memory: 16Mi
    limits:
      memory: 64Mi
  tolerations: []
  profiles: []
  # Example:
  # - name: gfx1100-textgen
  #   releaseGate: true
  #   nodeSelector:
  #     kubernetes.io/hostname: cblevins-5930k
  #   images:
  #     - registry.harbor.lan/flexinfer/vllm@sha256:...

agent:
  enabled: true
  image:
    repository: ghcr.io/flexinfer/flexinfer-agent
    tag: "latest"
    # Pin to an immutable digest (repository@sha256:...) for reproducible
    # deploys; when set it overrides tag. Resolve with `flexinfer image pin`.
    digest: ""
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 100m
      memory: 128Mi

proxy:
  enabled: true
  replicaCount: 1
  # Front-door for the codebase-answer read-path sibling (F3 Slice 2.1). When
  # set, the proxy reverse-proxies POST /v1/rag to it. Empty → /v1/rag returns 503.
  codebaseAnswerUpstream: "http://codebase-answer.flexinfer-system.svc:8000"
  image:
    repository: ghcr.io/flexinfer/flexinfer-proxy
    tag: "latest"
    # Pin to an immutable digest (repository@sha256:...) for reproducible
    # deploys; when set it overrides tag. Resolve with `flexinfer image pin`.
    digest: ""
  service:
    type: ClusterIP
    port: 80
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 100m
      memory: 128Mi
  # Cold-start behavior for serverless models.
  # Increase these to accommodate image pulls + backend bootstrap on first activation.
  timeouts:
    queue: 10m
    coldStart: 10m
  # Prefix-routing key strictness knobs.
  # Tune these to reduce key cardinality or allow longer context-derived segments.
  routing:
    # Shared service-label selection. Supported modes: round-robin,
    # least-loaded, prefix-or-rr, session-or-rr, prefix-session-or-rr.
    labelGroupMode: ""
    explicitKeyMaxLength: 128
    systemSegmentMaxLength: 512
    documentSegmentMaxLength: 256
  # Clamp inbound OpenAI max_tokens so clients that request the full context
  # window still leave room for prompt tokens.
  maxTokensClamp:
    enabled: true
    promptReserveTokens: 512
  # Context-bounded admission (CC-6a-2). Refuses chat-completion requests at
  # the proxy edge when the estimated prompt + max_tokens exceeds the per-Model
  # context ceiling. Default off globally; opt-in per Model via the
  # `flexinfer.ai/admission: context-bounded` annotation. See
  # docs/planning/context-bounded-admission-spec.md.
  admission:
    enabled: false
    # 5% safety margin against the declared context window. Bump to 20 on
    # lanes serving mostly long-form English (the estimator over-counts by
    # ~70% on that shape; see the kill-test B verdict in the spec).
    safetyMarginPercent: 5
    # Assumed max_tokens when the request omits the field.
    defaultMaxTokens: 256
  # Rate limiting configuration
  # Protects K8s API server from excessive per-request API calls
  rateLimit:
    enabled: false
    # Per-model requests per second (token bucket rate)
    perModelRPS: 100
    # Per-model burst size (token bucket capacity)
    burst: 50
    # Global requests per second across all models (API server protection)
    globalRPS: 1000
    # Global burst size
    globalBurst: 200
  # Authentication configuration
  auth:
    enabled: false
    # Name of the Kubernetes Secret containing the bearer token
    tokenSecretName: ""
    # Key within the Secret (default: "token")
    tokenSecretKey: "token"

# Backend images - controller auto-detects GPU vendor and selects appropriate image
# Ollama backend (default):
# - AMD (amd.com/gpu): ollama/ollama:rocm
# - NVIDIA (nvidia.com/gpu): ollama/ollama:latest
# - Intel (intel.com/gpu): ollama/ollama:latest
backend:
  image:
    repository: ollama/ollama
    tag: "latest"

# Ollama backend configuration (used when spec.backend=ollama)
ollama:
  # Maxwell-specific image for older NVIDIA GPUs (compute 5.x)
  # Pre-built ollama CUDA 12.x binaries do not include sm_52 support.
  # Build from source with CUDA 11.8 and CUDA_ARCHITECTURES="50;52".
  maxwellImage: ""
  # Architecture-specific AMD images (override generic ollama:rocm for specific GPU families)
  gfx1100Image: ""   # AMD RX 7900 series (RDNA3)
  gfx906Image: ""    # AMD Radeon VII (Vega20)

# MLC-LLM backend configuration (used when spec.backend=mlc-llm)
# Set these to your custom values or leave empty to use defaults
mlcllm:
  # Images - set to custom images or leave empty for defaults
  # CUDA image for NVIDIA GPUs (default: ghcr.io/mlc-ai/mlc-llm:cuda)
  cudaImage: ""
  # ROCm image for AMD GPUs (default: ghcr.io/mlc-ai/mlc-llm:rocm)
  rocmImage: ""
  # Maxwell-specific image for older NVIDIA GPUs (compute 5.x)
  maxwellImage: ""
  # GFX1100-specific image for AMD RX 7900 series (RDNA3)
  # Built with ROCm 6.4 and RDNA3-specific optimizations
  gfx1100Image: ""
  # GFX906-specific image for AMD Radeon VII (Vega20)
  # Built with ROCm 6.4 and Vega20-specific optimizations
  gfx906Image: ""

  # Operator-level defaults (can be overridden per-deployment via CRD)
  defaults:
    # Serve mode: local (low memory), server (high throughput), interactive
    # Empty = default to "local"
    mode: ""
    # GPU memory limit in bytes. Empty = auto-detect (23GB default, 5GB for Maxwell)
    gpuMemoryBytes: ""
    # JIT compilation policy: ON, OFF, REDO, READONLY. Empty = MLC-LLM default
    jitPolicy: ""
    # Path to pre-compiled model library (.so). Usually set per-deployment
    modelLibPath: ""
    # Complete args override (bypasses all other settings). Use for advanced cases only
    args: ""

# vLLM backend configuration (used when spec.backend=vllm)
vllm:
  # Images - auto-selected based on GPU vendor, or set custom images
  # CUDA image for NVIDIA GPUs (default: vllm/vllm-openai:latest)
  cudaImage: ""
  # ROCm image for AMD GPUs (default: rocm/vllm:latest)
  rocmImage: ""
  # GFX1100-specific image for AMD RX 7900 series (RDNA3)
  # Built with flash attention disabled for stability
  gfx1100Image: ""
  # GFX906-specific image for AMD Radeon VII (Vega20)
  # Built with flash attention disabled for stability
  gfx906Image: ""
  # Operator-level defaults (can be overridden per-deployment via CRD)
  defaults:
    # Complete args override. Use for advanced cases only
    args: ""

# llama.cpp backend configuration (used when spec.backend=llamacpp)
llamacpp:
  # Images - auto-selected based on GPU vendor, or set custom images
  # CUDA image for NVIDIA GPUs (default: ghcr.io/ggml-org/llama.cpp:server-cuda)
  cudaImage: ""
  # ROCm image for AMD GPUs (default: ghcr.io/ggml-org/llama.cpp:server-rocm)
  rocmImage: ""
  # Architecture-specific AMD images (override rocmImage for specific GPU families)
  gfx1100Image: ""   # AMD RX 7900 series (RDNA3)
  gfx906Image: ""    # AMD Radeon VII (Vega20)
  # Maxwell-specific image for older NVIDIA GPUs (compute 5.x)
  # Requires CUDA 11.8 build with CUDA_ARCHITECTURES="50;52"
  maxwellImage: ""
  # Operator-level defaults (can be overridden per-deployment via CRD)
  defaults:
    # Complete args override. Use for advanced cases only
    args: ""

# Diffusers backend configuration (used when spec.backend=diffusers)
diffusers:
  # Images - auto-selected based on GPU vendor, or set custom images
  # CUDA image for NVIDIA GPUs (default: registry.harbor.lan/library/diffusers-api:cuda)
  cudaImage: ""
  # ROCm image for AMD GPUs (default: registry.harbor.lan/library/diffusers-api:rocm-latest)
  rocmImage: ""
  # Architecture-specific AMD images (override rocmImage for specific GPU families)
  gfx1100Image: ""   # AMD RX 7900 series (RDNA3)
  gfx906Image: ""    # AMD Radeon VII (Vega20)

# ComfyUI backend configuration (used when spec.backend=comfyui)
comfyui:
  # ROCm image for AMD GPUs (default: registry.harbor.lan/library/comfyui:rocm6.2.3-v8)
  rocmImage: ""
  # Architecture-specific AMD images (override rocmImage for specific GPU families)
  gfx1100Image: ""   # AMD RX 7900 series (RDNA3)
  gfx906Image: ""    # AMD Radeon VII (Vega20)

# ORAS configuration for OCI artifact downloads (ModelCache with oci:// or oras:// sources)
oras:
  # Image used for downloading OCI artifacts in ModelCache jobs
  # Uses official ORAS image from GitHub Container Registry
  image: ghcr.io/oras-project/oras:v1.3.0

scheduler:
  enabled: true
  replicas: 1
  port: 8082
  image:
    repository: ghcr.io/flexinfer/flexinfer-scheduler
    tag: "latest"
    # Pin to an immutable digest (repository@sha256:...) for reproducible
    # deploys; when set it overrides tag. Resolve with `flexinfer image pin`.
    digest: ""
  # Optional scheduling controls for the scheduler Deployment.
  # Useful when your cluster has mixed architectures (e.g., arm64 nodes).
  nodeSelector: {}
  tolerations: []
  affinity: {}
  kubeScheduler:
    image:
      repository: registry.k8s.io/kube-scheduler
      tag: "v1.35.2"
      pullPolicy: IfNotPresent
  kubeconfigInit:
    image:
      repository: busybox
      tag: "1.37"
      pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi
  weights:
    tps: 0.7
    util: 0.2
    cost: 0.1
    cache: 0.3
    # Bonus term for scheduling headroom: (free_vram / total_vram) * vramFree.
    # Keep this in the same magnitude as util/cache penalties.
    vramFree: 10.0
  tenantFairShare:
    enabled: false
    # Score adjustment magnitude for fair-share balancing.
    weight: 5.0
    # Per-tenant GPU budget used to compute usage ratio.
    gpuBudget: 1.0
    # Optional tenant label override key (defaults to namespace when empty).
    tenantLabelKey: ""

benchmarker:
  enabled: true
  postgresDsn: ""
  image:
    repository: ghcr.io/flexinfer/flexinfer-bench
    tag: "latest"

# Quantization runtime images used by ModelCache quantization jobs.
# Override these when publishing images to a private registry.
quantization:
  # Lightweight CPU-only image used by ModelCache publish and publish-validator
  # jobs. It includes oras, safetensors, huggingface_hub, and FlexInfer helper
  # scripts so post-quantization jobs do not pull GPU runtime images.
  modelToolsImage: ghcr.io/flexinfer/model-tools:latest
  # Optional specific overrides. Leave empty to use modelToolsImage.
  publishImage: ""
  validatorImage: ""
  # Unified runtime: use the per-profile runtime image for quantization jobs
  # instead of separate 60GB+ quantizer images.
  # Requires INCLUDE_QUANTIZER=true in the runtime image build.
  useRuntimeForQuantize: false
  # Runtime image to use when useRuntimeForQuantize=true.
  # Usually matches the profile runtime image (e.g., registry.harbor.lan/flexinfer/runtime:rocm-gfx1100).
  runtimeImage: ""
  # Device map strategy for GPTQ quantize jobs.
  # "cpu" = load entire model on CPU (default, needs enough RAM).
  # "auto" = split model across GPU+CPU via accelerate (reduces CPU memory).
  gptqDeviceMap: ""
  # Optional controller-side policy overrides serialized into
  # FLEXINFER_GPTQ_MODEL_POLICIES for quantize jobs.
  gptqModelPolicies:
    - name: qwen3.5-moe-text
      match_model_types:
        - qwen3_5_moe_text
        - qwen3_5_moe
      extract_text_config: true
      copy_root_keys:
        - bos_token_id
        - eos_token_id
        - pad_token_id
      # Preserve the Transformers text config so MoE router/GDN defaults are
      # populated; the quantizer registers this alias to GPTQModel's MoE class.
      remap_model_type: qwen3_5_moe_text
      architectures:
        - Qwen3_5MoeForCausalLM
      loader: gptqmodel
      python_packages:
        - git+https://github.com/huggingface/transformers.git@529504b2fa98970c6c44d3fafaeb07a39c40e7ea
      quantize_config_overrides:
        offload_to_disk: true
      calibration_overrides:
        max_samples: 16
        max_seq_len: 512
        max_tokens: 8192
      runtime_overrides:
        attn_implementation: eager
        disable_qwen35_fla: true
        fix_mistral_regex: true
    - name: qwen3.6-text
      match_path_substrings:
        - qwen36
        - qwen3.6
      extract_text_config: true
      copy_root_keys:
        - bos_token_id
        - eos_token_id
        - pad_token_id
      remap_model_type: qwen3_5_text
      architectures:
        - Qwen3_5ForCausalLM
      loader: gptqmodel
      python_packages:
        - git+https://github.com/huggingface/transformers.git@529504b2fa98970c6c44d3fafaeb07a39c40e7ea
      quantize_config_overrides:
        offload_to_disk: true
      calibration_overrides:
        max_samples: 16
        max_seq_len: 512
        max_tokens: 8192
      runtime_overrides:
        attn_implementation: eager
        disable_qwen35_fla: true
        fix_mistral_regex: true
    - name: qwen3.5-text
      match_model_types:
        - qwen3_5_text
      match_path_substrings:
        - qwen35
        - qwen3.5
        - qwen36
        - qwen3.6
      extract_text_config: true
      copy_root_keys:
        - bos_token_id
        - eos_token_id
        - pad_token_id
      remap_model_type: qwen3_5_text
      architectures:
        - Qwen3_5ForCausalLM
      # 2026-05-09: switched manual_sharded_state_dict -> gptqmodel.
      # See pkg/quantization/gptq.go default policies block + MR !300 for
      # the rationale (stock loader sets turtle_model=LazyTurtle so
      # shell_module_materialize handles disk-offloaded layers correctly).
      loader: gptqmodel
      python_packages:
        - git+https://github.com/huggingface/transformers.git@529504b2fa98970c6c44d3fafaeb07a39c40e7ea
      quantize_config_overrides:
        offload_to_disk: true
      calibration_overrides:
        max_samples: 64
        max_seq_len: 1024
  images:
    gguf: ghcr.io/flexinfer/quantizer:gguf
    awq: ghcr.io/flexinfer/quantizer:awq
    gptq: ghcr.io/flexinfer/quantizer:gptq
    gptqRocm: ""  # ROCm variant for AMD GPUs (e.g., registry.harbor.lan/flexinfer/quantizer:gptq-rocm-gfx1100)
    exl2: ghcr.io/flexinfer/quantizer:exl2
    fp8: ghcr.io/flexinfer/quantizer:fp8

observability:
  tracing:
    enabled: false
    # Optional OTLP endpoint (for example: http://otel-collector.observability:4318).
    # When empty, OpenTelemetry SDK defaults are used.
    otlpEndpoint: ""
    # Optional service namespace label for traces (for example: "flexinfer-system").
    serviceNamespace: ""

grafanaDashboard:
  enabled: true
  runtimeEnabled: true
  benchmarksEnabled: true

# PrometheusRule alerting configuration
# Requires Prometheus Operator (monitoring.coreos.com/v1 CRD)
alerting:
  enabled: false
  # Extra labels to add to the PrometheusRule (e.g., for routing)
  labels: {}
  # Alert thresholds (tune for your environment)
  thresholds:
    # Proxy alerts
    errorRatePercent: 0.05  # 5% error rate triggers warning
    errorRateFor: "5m"
    queueDepth: 50
    queueDepthFor: "2m"
    coldStartTimeoutRate: 0.1  # >0.1 timeout/s
    coldStartTimeoutFor: "5m"
    # GPU alerts
    gpuTempCelsius: 85
    gpuTempCriticalCelsius: 95
    gpuTempFor: "5m"
    vramFreeRatio: 0.1  # <10% free VRAM
    vramLowFor: "5m"
  # Optional node-exporter alerts for Docker/BuildKit builder filesystems.
  # Enable only in clusters where Prometheus can see node_filesystem_* metrics.
  buildNodeDisk:
    enabled: false
    instanceRegex: ".*"
    mountpointRegex: "/var/lib/docker|/var/lib/buildkit|/"
    warningUsedRatio: 0.80
    warningFreeBytes: 161061273600   # 150 GiB
    warningFor: "30m"
    criticalUsedRatio: 0.90
    criticalFreeBytes: 85899345920   # 80 GiB
    criticalFor: "10m"

# Network Policy configuration
# Restricts pod communication for improved security
networkPolicy:
  # Enable NetworkPolicy resources
  enabled: false
  # Namespace where Prometheus is deployed (for metrics scraping)
  prometheusNamespace: monitoring

# Multi-tenancy baseline bundle.
# This is an opt-in "foundation" for namespace isolation and policy guardrails.
# It does not provide hard GPU partitioning or billing isolation.
tenancy:
  # Enable tenant baseline resources from tenants[].
  enabled: false
  # Create tenant namespaces if they do not exist.
  # Set false if namespaces are managed externally (GitOps/platform team).
  createNamespaces: false

  # Namespace defaults applied when creating namespaces.
  # Pod Security Admission labels follow Kubernetes defaults:
  # enforce=baseline, warn/audit=restricted.
  namespaceLabels: {}
  podSecurity:
    enforce: baseline
    warn: restricted
    audit: restricted

  # Default ResourceQuota hard limits. Override per-tenant via tenants[].quotaHard.
  quotaHard:
    requests.cpu: "8"
    requests.memory: 32Gi
    limits.cpu: "16"
    limits.memory: 64Gi
    requests.storage: 200Gi
    persistentvolumeclaims: "20"
    services: "20"
    pods: "40"

  # Default LimitRange entries. Override per-tenant via tenants[].limitRangeLimits.
  limitRangeLimits:
    - type: Container
      defaultRequest:
        cpu: 250m
        memory: 512Mi
      default:
        cpu: "2"
        memory: 4Gi
      max:
        cpu: "8"
        memory: 16Gi

  # Optional tenant default-deny network policy.
  # mode: "disabled" | "default-deny"
  networkPolicy:
    mode: disabled
    # Adds an egress exception for kube-dns when mode=default-deny.
    allowDNS: true

  # Namespaced least-privilege Role for tenant operators (CRD management only).
  # Binding is only created when a tenant has subjects[] configured.
  rbac:
    roleName: flexinfer-tenant-operator

  # Optional MT-2 admission guardrails.
  # Rendered only when:
  # - tenancy.enabled=true
  # - tenancy.admission.enabled=true
  # - cluster supports admissionregistration.k8s.io/v1 ValidatingAdmissionPolicy
  admission:
    enabled: false
    # FailurePolicy for ValidatingAdmissionPolicy: Fail | Ignore
    failurePolicy: Fail
    # Validation actions for policy bindings: Deny | Warn | Audit
    validationActions:
      - Deny
    namespaceGuard:
      # When true, restrict FlexInfer workloads to tenant-labeled namespaces
      # or explicit allowlisted namespaces.
      enforceTenantNamespaces: true
      tenantLabelKey: flexinfer.ai/tenant
      tenantLabelValue: "true"
      # Platform namespace allowlist; tenant namespaces from tenancy.tenants[] are added automatically.
      allowedNamespaces:
        - flexinfer-system
        - kube-system

  # Tenant definitions.
  # - namespace: required
  # - createNamespace: optional override for this tenant
  # - labels: optional extra namespace labels (merge with tenancy.namespaceLabels)
  # - podSecurity: optional overrides for enforce/warn/audit labels
  # - quotaHard: optional full override map for ResourceQuota.spec.hard
  # - limitRangeLimits: optional full override list for LimitRange.spec.limits
  # - networkPolicyMode: optional override ("disabled"|"default-deny")
  # - subjects: optional RoleBinding subjects (ServiceAccount/User/Group)
  #   - kind: ServiceAccount|User|Group
  #     name: required
  #     namespace: required for ServiceAccount subjects
  #     apiGroup: optional (defaults to rbac.authorization.k8s.io for User/Group)
  tenants: []

# Pod Disruption Budget configuration
# Ensures availability during voluntary disruptions (upgrades, node drains)
podDisruptionBudget:
  # Enable PDB resources
  enabled: false
  controller:
    # minAvailable: 1
    maxUnavailable: 1
  proxy:
    minAvailable: 1
    # maxUnavailable: 1
  scheduler:
    minAvailable: 1
    # maxUnavailable: 1

# Default values for flexinfer.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

nameOverride: ""
fullnameOverride: ""

# Legacy: prefer serviceAccounts.* going forward.
serviceAccount:
  create: true
  annotations: {}
  name: ""

serviceAccounts:
  controller:
    create: true
    annotations: {}
    name: ""
  agent:
    create: true
    annotations: {}
    name: ""
  scheduler:
    create: true
    annotations: {}
    name: ""
  proxy:
    create: true
    annotations: {}
    name: ""
  benchmarker:
    create: true
    annotations: {}
    name: ""

podAnnotations: {}

controller:
  enabled: true
  replicas: 1
  image:
    repository: ghcr.io/flexinfer/flexinfer-controller
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: "latest"
  # Optional scheduling controls for the controller Deployment.
  # Useful when your cluster has mixed architectures (e.g., arm64 nodes).
  nodeSelector: {}
  tolerations: []
  affinity: {}
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi

agent:
  enabled: true
  image:
    repository: ghcr.io/flexinfer/flexinfer-agent
    pullPolicy: IfNotPresent
    tag: "latest"
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 100m
      memory: 128Mi

proxy:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/flexinfer/flexinfer-proxy
    pullPolicy: IfNotPresent
    tag: "latest"
  service:
    type: ClusterIP
    port: 80
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 100m
      memory: 128Mi
  # Rate limiting configuration
  # Protects K8s API server from excessive per-request API calls
  rateLimit:
    enabled: false
    # Per-model requests per second (token bucket rate)
    perModelRPS: 100
    # Per-model burst size (token bucket capacity)
    burst: 50
    # Global requests per second across all models (API server protection)
    globalRPS: 1000
    # Global burst size
    globalBurst: 200
  # Authentication configuration
  auth:
    enabled: false
    # Name of the Kubernetes Secret containing the bearer token
    tokenSecretName: ""
    # Key within the Secret (default: "token")
    tokenSecretKey: "token"

# Backend images - controller auto-detects GPU vendor and selects appropriate image
# Ollama backend (default):
# - AMD (amd.com/gpu): ollama/ollama:rocm
# - NVIDIA (nvidia.com/gpu): ollama/ollama:latest
# - Intel (intel.com/gpu): ollama/ollama:latest
backend:
  image:
    repository: ollama/ollama
    tag: "latest"

# MLC-LLM backend configuration (used when spec.backend=mlc-llm)
# Set these to your custom values or leave empty to use defaults
mlcllm:
  # Images - set to custom images or leave empty for defaults
  # CUDA image for NVIDIA GPUs (default: ghcr.io/mlc-ai/mlc-llm:cuda)
  cudaImage: ""
  # ROCm image for AMD GPUs (default: ghcr.io/mlc-ai/mlc-llm:rocm)
  rocmImage: ""
  # Maxwell-specific image for older NVIDIA GPUs (compute 5.x)
  maxwellImage: ""
  # GFX1100-specific image for AMD RX 7900 series (RDNA3)
  # Built with ROCm 6.4 and RDNA3-specific optimizations
  gfx1100Image: ""

  # Operator-level defaults (can be overridden per-deployment via CRD)
  defaults:
    # Serve mode: local (low memory), server (high throughput), interactive
    # Empty = default to "local"
    mode: ""
    # GPU memory limit in bytes. Empty = auto-detect (23GB default, 5GB for Maxwell)
    gpuMemoryBytes: ""
    # JIT compilation policy: ON, OFF, REDO, READONLY. Empty = MLC-LLM default
    jitPolicy: ""
    # Path to pre-compiled model library (.so). Usually set per-deployment
    modelLibPath: ""
    # Complete args override (bypasses all other settings). Use for advanced cases only
    args: ""

# vLLM backend configuration (used when spec.backend=vllm)
vllm:
  # Images - auto-selected based on GPU vendor, or set custom images
  # CUDA image for NVIDIA GPUs (default: vllm/vllm-openai:latest)
  cudaImage: ""
  # ROCm image for AMD GPUs (default: rocm/vllm:latest)
  rocmImage: ""
  # GFX1100-specific image for AMD RX 7900 series (RDNA3)
  # Built with flash attention disabled for stability
  gfx1100Image: ""
  # Operator-level defaults (can be overridden per-deployment via CRD)
  defaults:
    # Complete args override. Use for advanced cases only
    args: ""

# llama.cpp backend configuration (used when spec.backend=llamacpp)
llamacpp:
  # Images - auto-selected based on GPU vendor, or set custom images
  # CUDA image for NVIDIA GPUs (default: ghcr.io/ggerganov/llama.cpp:server-cuda)
  cudaImage: ""
  # ROCm image for AMD GPUs (default: ghcr.io/ggerganov/llama.cpp:server-rocm)
  rocmImage: ""
  # Operator-level defaults (can be overridden per-deployment via CRD)
  defaults:
    # Complete args override. Use for advanced cases only
    args: ""

# Diffusers backend configuration (used when spec.backend=diffusers)
diffusers:
  # Images - auto-selected based on GPU vendor, or set custom images
  # CUDA image for NVIDIA GPUs (default: registry.harbor.lan/library/diffusers-api:cuda)
  cudaImage: ""
  # ROCm image for AMD GPUs (default: registry.harbor.lan/library/diffusers-api:rocm-latest)
  rocmImage: ""

# ORAS configuration for OCI artifact downloads (ModelCache with oci:// or oras:// sources)
oras:
  # Image used for downloading OCI artifacts in ModelCache jobs
  # Uses official ORAS image from GitHub Container Registry
  image: ghcr.io/oras-project/oras:v1.2.2

scheduler:
  enabled: true
  replicas: 1
  port: 8082
  image:
    repository: ghcr.io/flexinfer/flexinfer-scheduler
    pullPolicy: IfNotPresent
    tag: "latest"
  # Optional scheduling controls for the scheduler Deployment.
  # Useful when your cluster has mixed architectures (e.g., arm64 nodes).
  nodeSelector: {}
  tolerations: []
  affinity: {}
  kubeScheduler:
    image:
      repository: registry.k8s.io/kube-scheduler
      tag: "v1.28.0"
      pullPolicy: IfNotPresent
  kubeconfigInit:
    image:
      repository: busybox
      tag: "1.36"
      pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi
  weights:
    tps: 0.7
    util: 0.2
    cost: 0.1
    cache: 0.3
    # Bonus term for scheduling headroom: (free_vram / total_vram) * vramFree.
    # Keep this in the same magnitude as util/cache penalties.
    vramFree: 10.0

benchmarker:
  enabled: true
  image:
    repository: ghcr.io/flexinfer/flexinfer-bench
    pullPolicy: IfNotPresent
    tag: "latest"

grafanaDashboard:
  enabled: true

# PrometheusRule alerting configuration
# Requires Prometheus Operator (monitoring.coreos.com/v1 CRD)
alerting:
  enabled: false
  # Extra labels to add to the PrometheusRule (e.g., for routing)
  labels: {}
  # Alert thresholds (tune for your environment)
  thresholds:
    # Proxy alerts
    errorRatePercent: 0.05  # 5% error rate triggers warning
    errorRateFor: "5m"
    queueDepth: 50
    queueDepthFor: "2m"
    coldStartTimeoutRate: 0.1  # >0.1 timeout/s
    coldStartTimeoutFor: "5m"
    # GPU alerts
    gpuTempCelsius: 85
    gpuTempCriticalCelsius: 95
    gpuTempFor: "5m"
    vramFreeRatio: 0.1  # <10% free VRAM
    vramLowFor: "5m"

# Network Policy configuration
# Restricts pod communication for improved security
networkPolicy:
  # Enable NetworkPolicy resources
  enabled: false
  # Namespace where Prometheus is deployed (for metrics scraping)
  prometheusNamespace: monitoring

# Multi-tenancy baseline bundle.
# This is an opt-in "foundation" for namespace isolation and policy guardrails.
# It does not provide hard GPU partitioning or billing isolation.
tenancy:
  # Enable tenant baseline resources from tenants[].
  enabled: false
  # Create tenant namespaces if they do not exist.
  # Set false if namespaces are managed externally (GitOps/platform team).
  createNamespaces: false

  # Namespace defaults applied when creating namespaces.
  # Pod Security Admission labels follow Kubernetes defaults:
  # enforce=baseline, warn/audit=restricted.
  namespaceLabels: {}
  podSecurity:
    enforce: baseline
    warn: restricted
    audit: restricted

  # Default ResourceQuota hard limits. Override per-tenant via tenants[].quotaHard.
  quotaHard:
    requests.cpu: "8"
    requests.memory: 32Gi
    limits.cpu: "16"
    limits.memory: 64Gi
    requests.storage: 200Gi
    persistentvolumeclaims: "20"
    services: "20"
    pods: "40"

  # Default LimitRange entries. Override per-tenant via tenants[].limitRangeLimits.
  limitRangeLimits:
    - type: Container
      defaultRequest:
        cpu: 250m
        memory: 512Mi
      default:
        cpu: "2"
        memory: 4Gi
      max:
        cpu: "8"
        memory: 16Gi

  # Optional tenant default-deny network policy.
  # mode: "disabled" | "default-deny"
  networkPolicy:
    mode: disabled
    # Adds an egress exception for kube-dns when mode=default-deny.
    allowDNS: true

  # Namespaced least-privilege Role for tenant operators (CRD management only).
  # Binding is only created when a tenant has subjects[] configured.
  rbac:
    roleName: flexinfer-tenant-operator

  # Optional MT-2 admission guardrails.
  # Rendered only when:
  # - tenancy.enabled=true
  # - tenancy.admission.enabled=true
  # - cluster supports admissionregistration.k8s.io/v1 ValidatingAdmissionPolicy
  admission:
    enabled: false
    # FailurePolicy for ValidatingAdmissionPolicy: Fail | Ignore
    failurePolicy: Fail
    # Validation actions for policy bindings: Deny | Warn | Audit
    validationActions:
      - Deny
    namespaceGuard:
      # When true, restrict FlexInfer workloads to tenant-labeled namespaces
      # or explicit allowlisted namespaces.
      enforceTenantNamespaces: true
      tenantLabelKey: flexinfer.ai/tenant
      tenantLabelValue: "true"
      # Platform namespace allowlist; tenant namespaces from tenancy.tenants[] are added automatically.
      allowedNamespaces:
        - flexinfer-system
        - kube-system

  # Tenant definitions.
  # - namespace: required
  # - createNamespace: optional override for this tenant
  # - labels: optional extra namespace labels (merge with tenancy.namespaceLabels)
  # - podSecurity: optional overrides for enforce/warn/audit labels
  # - quotaHard: optional full override map for ResourceQuota.spec.hard
  # - limitRangeLimits: optional full override list for LimitRange.spec.limits
  # - networkPolicyMode: optional override ("disabled"|"default-deny")
  # - subjects: optional RoleBinding subjects (ServiceAccount/User/Group)
  #   - kind: ServiceAccount|User|Group
  #     name: required
  #     namespace: required for ServiceAccount subjects
  #     apiGroup: optional (defaults to rbac.authorization.k8s.io for User/Group)
  tenants: []

# Pod Disruption Budget configuration
# Ensures availability during voluntary disruptions (upgrades, node drains)
podDisruptionBudget:
  # Enable PDB resources
  enabled: false
  controller:
    # minAvailable: 1
    maxUnavailable: 1
  proxy:
    minAvailable: 1
    # maxUnavailable: 1
  scheduler:
    minAvailable: 1
    # maxUnavailable: 1

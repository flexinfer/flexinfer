# Default values for flexinfer.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

controller:
  replicas: 1
  image:
    repository: flexinfer/flexinfer-manager
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: "latest"
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi

agent:
  image:
    repository: flexinfer/flexinfer-agent
    pullPolicy: IfNotPresent
    tag: "latest"
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 100m
      memory: 128Mi

proxy:
  replicaCount: 1
  image:
    repository: ghcr.io/flexinfer/flexinfer-proxy
    pullPolicy: IfNotPresent
    tag: "latest"
  service:
    type: ClusterIP
    port: 80
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 100m
      memory: 128Mi

backend:
  image:
    repository: ghcr.io/flexinfer/ollama
    tag: "latest"

scheduler:
  replicas: 1
  port: 8082
  image:
    repository: flexinfer/flexinfer-sched
    pullPolicy: IfNotPresent
    tag: "latest"
  kubeScheduler:
    image:
      repository: registry.k8s.io/kube-scheduler
      tag: "v1.28.0"
      pullPolicy: IfNotPresent
  kubeconfigInit:
    image:
      repository: busybox
      tag: "1.36"
      pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi
  weights:
    tps: 0.7
    util: 0.2
    cost: 0.1
    cache: 0.3

benchmarker:
  image:
    repository: flexinfer/flexinfer-bench
    pullPolicy: IfNotPresent
    tag: "latest"

# Default values for flexinfer.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

nameOverride: ""
fullnameOverride: ""

# Legacy: prefer serviceAccounts.* going forward.
serviceAccount:
  create: true
  annotations: {}
  name: ""

serviceAccounts:
  controller:
    create: true
    annotations: {}
    name: ""
  agent:
    create: true
    annotations: {}
    name: ""
  scheduler:
    create: true
    annotations: {}
    name: ""
  proxy:
    create: true
    annotations: {}
    name: ""
  benchmarker:
    create: true
    annotations: {}
    name: ""

podAnnotations: {}

controller:
  enabled: true
  replicas: 1
  image:
    repository: ghcr.io/flexinfer/flexinfer-controller
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: "latest"
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi

agent:
  enabled: true
  image:
    repository: ghcr.io/flexinfer/flexinfer-agent
    pullPolicy: IfNotPresent
    tag: "latest"
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 100m
      memory: 128Mi

proxy:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/flexinfer/flexinfer-proxy
    pullPolicy: IfNotPresent
    tag: "latest"
  service:
    type: ClusterIP
    port: 80
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 100m
      memory: 128Mi

# Backend image - controller auto-detects GPU vendor and selects appropriate image:
# - AMD (amd.com/gpu): ollama/ollama:rocm
# - NVIDIA (nvidia.com/gpu): ollama/ollama:latest
# - Intel (intel.com/gpu): ollama/ollama:latest
# This value is the fallback for NVIDIA when no spec.resources GPU is specified
backend:
  image:
    repository: ollama/ollama
    tag: "latest"

scheduler:
  enabled: true
  replicas: 1
  port: 8082
  image:
    repository: ghcr.io/flexinfer/flexinfer-scheduler
    pullPolicy: IfNotPresent
    tag: "latest"
  kubeScheduler:
    image:
      repository: registry.k8s.io/kube-scheduler
      tag: "v1.28.0"
      pullPolicy: IfNotPresent
  kubeconfigInit:
    image:
      repository: busybox
      tag: "1.36"
      pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi
  weights:
    tps: 0.7
    util: 0.2
    cost: 0.1
    cache: 0.3

benchmarker:
  enabled: true
  image:
    repository: ghcr.io/flexinfer/flexinfer-bench
    pullPolicy: IfNotPresent
    tag: "latest"

grafanaDashboard:
  enabled: true

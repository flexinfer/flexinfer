# Build matrix for flexinfer-runtime images.
# Single source of truth for GPU profiles, base images, backends, and env vars.
# ComfyUI is intentionally kept on its dedicated image path; this matrix only
# bundles the backends that the unified runtime actually ships.
#
# Usage:
#   ./build/build-runtime.sh gfx1100          # build one profile
#   ./build/build-runtime.sh all --push       # build + push all
#   ./build/build-runtime.sh gfx1100 --dry-run  # print docker command
#
# Parsed by build-runtime.sh via yq.

registry: registry.harbor.lan/flexinfer
go_version: "1.26.0"
llamacpp_version: "b8173"
ollama_version: "v0.17.4"
ollama_go_version: "1.25.7"

profiles:
  gfx1100:
    tag: "runtime:rocm-gfx1100"
    promotion:
      # The managed DaemonSet lanes use the slimmer gfx1100-serving persona.
      # Keep the broad unified image scoped to the GPUProfile fallback surface.
      values_runtime_profiles: false
    gpu_vendor: amd
    gpu_arch: gfx1100
    # Pre-built vLLM navi image — vLLM compiled for RDNA3.
    # Source build fails: topKPerRowDecode exceeds 64KB LDS limit on RDNA3.
    base_image: "rocm/vllm-dev:rocm7.2_navi_ubuntu24.04_py3.12_pytorch_2.9_vllm_0.14.0rc0"
    rocm_dev_image: "rocm/dev-ubuntu-24.04:6.4.4"
    amdgpu_targets: gfx1100
    backends:
      vllm: true        # already in base image
      llamacpp: true
      ollama: true
      diffusers: true
      # Gaming mode v2: Sunshine + gamescope + Mesa RADV/VA-API HW encode,
      # validated on this gfx1100 host by the Slice 1 kill-test. Supersedes the
      # never-worked Xvfb `steam` layer, which stays off (opt into it only for
      # the legacy Remote Play backend).
      gaming: true
      steam: false
    # bitsandbytes pip wheel ships gfx1100 HIP kernels
    include_bitsandbytes: true
    # Include quantizer packages (GPTQModel, datasets, oras CLI) in the runtime image.
    # Eliminates separate 60GB+ quantizer images for this profile.
    include_quantizer: true
    transformers_constraint: ">=5.0"
    env:
      ROCM_PATH: /opt/rocm
      HIP_PATH: /opt/rocm
      HSA_OVERRIDE_GFX_VERSION: "11.0.0"
      PYTORCH_ROCM_ARCH: gfx1100
      TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL: "1"
      HIP_FORCE_DEV_KERNARG: "1"
      TORCH_BLAS_PREFER_HIPBLASLT: "1"
      VLLM_USE_TRITON_FLASH_ATTN: "0"
      VLLM_ROCM_USE_AITER: "0"
      VLLM_TARGET_DEVICE: rocm
      MIOPEN_FIND_MODE: "2"
      PYTORCH_HIP_ALLOC_CONF: "garbage_collection_threshold:0.9,max_split_size_mb:512"
    build_context: 7900xtx

  gfx1100-serving:
    tag: "runtime:rocm-gfx1100-serving"
    promotion:
      # Serving-profile promotion updates the persistent runtime DaemonSets.
      # GPUProfile fallback/runtime defaults stay on the broad unified image.
      gpuprofile: false
      values_runtime_profiles: true
    # Serving persona for persistent runtime pods. This keeps vLLM/diffusers
    # changes away from the legacy utility layers: quantizer, Steam,
    # llama.cpp, and Ollama.
    dockerfile: build/Dockerfile.runtime-serving
    gpu_vendor: amd
    gpu_arch: gfx1100
    base_image: "rocm/vllm-dev:rocm7.2_navi_ubuntu24.04_py3.12_pytorch_2.9_vllm_0.14.0rc0"
    rocm_dev_image: "rocm/dev-ubuntu-24.04:6.4.4"
    amdgpu_targets: gfx1100
    backends:
      vllm: true
      llamacpp: false
      ollama: false
      diffusers: true
      steam: false
    include_bitsandbytes: true
    include_quantizer: false
    transformers_constraint: ">=5.0"
    env:
      ROCM_PATH: /opt/rocm
      HIP_PATH: /opt/rocm
      HSA_OVERRIDE_GFX_VERSION: "11.0.0"
      PYTORCH_ROCM_ARCH: gfx1100
      TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL: "1"
      HIP_FORCE_DEV_KERNARG: "1"
      TORCH_BLAS_PREFER_HIPBLASLT: "1"
      VLLM_USE_TRITON_FLASH_ATTN: "0"
      VLLM_ROCM_USE_AITER: "0"
      VLLM_TARGET_DEVICE: rocm
      MIOPEN_FIND_MODE: "2"
      PYTORCH_HIP_ALLOC_CONF: "garbage_collection_threshold:0.9,max_split_size_mb:512"
    build_context: 7900xtx

  gfx1100-gemma4-experimental:
    tag: "runtime:rocm-gfx1100-gemma4-experimental"
    gpu_vendor: amd
    gpu_arch: gfx1100
    # Start from AMD's Navi image so we inherit a ROCm/PyTorch stack known to
    # boot on RDNA3, then replace the bundled vLLM install from source.
    base_image: "rocm/vllm-dev:rocm7.2_navi_ubuntu24.04_py3.12_pytorch_2.9_vllm_0.14.0rc0"
    rocm_dev_image: "rocm/dev-ubuntu-24.04:6.4.4"
    amdgpu_targets: gfx1100
    backends:
      vllm: true
      llamacpp: false
      ollama: false
      diffusers: false
      steam: false
    include_bitsandbytes: false
    include_quantizer: false
    vllm_install_mode: source
    vllm_extra_deps_profile: minimal
    install_qwen35_fastpath: false
    vllm_repo: "https://github.com/vllm-project/vllm.git"
    vllm_ref: "50cd5674b39c69e60fefd0ec1d61652d693e6a06"  # pinned 2026-05-03: vLLM main drifted past patch_vllm_env_override_torch29.py expected hunks (kernel_block_size→shape_block_size + view refactor); 50cd567 = last commit before our patch was authored
    vllm_source_patch_script: "build/scripts/patch_vllm_env_override_torch29.py"
    transformers_install_mode: source
    transformers_repo: "https://github.com/huggingface/transformers.git"
    # Pin the Gemma4 support path to a known-good commit instead of resolving
    # whatever happens to be on transformers/main at job runtime.
    transformers_ref: "f965b10bcc979e6ad5f02a46f6d074206eccbe75"
    env:
      ROCM_PATH: /opt/rocm
      HIP_PATH: /opt/rocm
      HSA_OVERRIDE_GFX_VERSION: "11.0.0"
      PYTORCH_ROCM_ARCH: gfx1100
      TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL: "1"
      HIP_FORCE_DEV_KERNARG: "1"
      TORCH_BLAS_PREFER_HIPBLASLT: "1"
      VLLM_ROCM_USE_AITER: "0"
      VLLM_TARGET_DEVICE: rocm
      MIOPEN_FIND_MODE: "2"
      PYTORCH_ALLOC_CONF: "garbage_collection_threshold:0.9,max_split_size_mb:512"
      FLEXINFER_EXPERIMENTAL_MODEL_FAMILY: gemma4
      # Plumbing only. This image does not yet patch vLLM kernels to enable
      # TurboQuant; the flag exists so test pods can carry the intent explicitly.
      FLEXINFER_EXPERIMENTAL_KV_CACHE_CODEC: turboquant
      FLEXINFER_EXPERIMENTAL_KV_CACHE_CODEC_STATUS: planned
    build_context: 7900xtx

  # Wave 1 Slice 2 sandbox profile (spec .loom/21-product-spec-vllm-feature-parity-2026-05-15.md).
  # Targets vLLM 0.19.1 to validate native gemma4 FusedMoE (merged in 0.19.0 via PR #38826)
  # so the GEMMA4_MOE_ROCM_REFERENCE_PATCH can be retired for BF16 (V2a) and conditionally
  # for GPTQ-INT4 (V2b). NOT promoted to GPUProfile / values-runtime / model manifests —
  # this image is a sandbox-only artifact for Slice 3/4/5 validation.
  gfx1100-sandbox-019:
    tag: "runtime:rocm-gfx1100-sandbox-019"
    promotion:
      gpuprofile: false
      values_runtime_profiles: false
      model_manifests: []
    gpu_vendor: amd
    gpu_arch: gfx1100
    # Same Navi base as the production profile so we inherit the ROCm/PyTorch
    # stack known to boot on RDNA3, then replace vLLM with the 0.19.x source build.
    base_image: "rocm/vllm-dev:rocm7.2_navi_ubuntu24.04_py3.12_pytorch_2.9_vllm_0.14.0rc0"
    rocm_dev_image: "rocm/dev-ubuntu-24.04:6.4.4"
    amdgpu_targets: gfx1100
    backends:
      vllm: true
      llamacpp: false
      ollama: false
      diffusers: false
      steam: false
    include_bitsandbytes: false
    include_quantizer: false
    # transformers >= 5.5.0 is required by vLLM 0.19+ for the gemma4 model file
    # (vllm/model_executor/models/gemma4.py imports transformers.models.gemma4).
    # R1 risk in the spec: validate against GPTQModel + abliteration pipeline before
    # promoting; if compat breaks for non-runtime jobs the constraint can split per-profile.
    transformers_constraint: ">=5.5.0"
    vllm_install_mode: source
    vllm_extra_deps_profile: minimal
    install_qwen35_fastpath: false
    vllm_repo: "https://github.com/vllm-project/vllm.git"
    # vLLM v0.19.1 (2026-05 patch release). Commit sha verified via:
    #   git ls-remote https://github.com/vllm-project/vllm.git refs/tags/v0.19.1
    # v0.19.0 (commit 2a69949bdadf0e8942b7a1619b229cb475beef20) was the release that
    # merged native gemma4 FusedMoE (PR #38826); 0.19.1 carries the bugfix tail.
    vllm_ref: "b1388b1fbf5aaef47937fabe98931211684666a6"
    # Single source patch (added 2026-05-15 after live swap falsification):
    # vLLM 0.19's RMSNorm.forward_hip() calls the ROCm rms_norm C++ custom op,
    # which rejects FP16/BF16 weights with "expected scalar type Float but
    # found Half". Patch routes forward_hip → forward_native (pure-PyTorch
    # path that handles any dtype). Remove when upstream vllm-project/vllm
    # fixes the dtype mismatch. Falsification doc:
    #   .loom/slice3-v1-sandbox-rms-norm-falsified-2026-05-15.md
    # The GEMMA4_MOE_ROCM_REFERENCE_PATCH is intentionally NOT applied here —
    # Slice 4/5 canaries validate that upstream native FusedMoE supplants it.
    vllm_source_patch_script: "build/scripts/patch_vllm_rocm_rms_norm_dtype.py"
    # Skip the legacy gemma4_moe_gptq build-time patch. That patch targets vLLM
    # 0.17 code structure; partial-apply against 0.19 source corrupts the
    # native FusedMoE path and causes container exits at init. Discovered in
    # the second retry attempt on 2026-05-15 (see falsification doc, the
    # "Post-Z2/Z1 retry failure" section).
    skip_gemma4_moe_patch: true
    env:
      ROCM_PATH: /opt/rocm
      HIP_PATH: /opt/rocm
      HSA_OVERRIDE_GFX_VERSION: "11.0.0"
      PYTORCH_ROCM_ARCH: gfx1100
      TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL: "1"
      HIP_FORCE_DEV_KERNARG: "1"
      TORCH_BLAS_PREFER_HIPBLASLT: "1"
      # AITER stays off — MI300X-tuned, not RDNA3 (per Dockerfile.vllm-* comments).
      VLLM_ROCM_USE_AITER: "0"
      VLLM_TARGET_DEVICE: rocm
      MIOPEN_FIND_MODE: "2"
      PYTORCH_HIP_ALLOC_CONF: "garbage_collection_threshold:0.9,max_split_size_mb:512"
      # V1 engine on 0.19 is mandatory (V0 removed in >=0.18).
      # Force eager mode until upstream piecewise-graph bugs (#39010, #41622) close.
      # Wave 2 will flip this to PIECEWISE.
      VLLM_USE_V1: "1"
    build_context: 7900xtx

  gfx1100-gemma4-turboquant-experimental:
    tag: "runtime:rocm-gfx1100-gemma4-turboquant-experimental"
    promotion:
      gpuprofile: false
      values_runtime_profiles: false
      model_manifests:
        - deploy/models/gemma4-e4b-turboquant.yaml
        - deploy/models/gemma4-31b-gptq-long.yaml
    gpu_vendor: amd
    gpu_arch: gfx1100
    base_image: "rocm/vllm-dev:rocm7.2_navi_ubuntu24.04_py3.12_pytorch_2.9_vllm_0.14.0rc0"
    rocm_dev_image: "rocm/dev-ubuntu-24.04:6.4.4"
    amdgpu_targets: gfx1100
    backends:
      vllm: true
      llamacpp: false
      ollama: false
      diffusers: false
      steam: false
    include_bitsandbytes: false
    include_quantizer: false
    include_turboquant: true
    vllm_install_mode: source
    vllm_extra_deps_profile: minimal
    install_qwen35_fastpath: false
    vllm_repo: "https://github.com/vllm-project/vllm.git"
    vllm_ref: "50cd5674b39c69e60fefd0ec1d61652d693e6a06"  # pinned 2026-05-03: vLLM main drifted past patch_vllm_env_override_torch29.py expected hunks (kernel_block_size→shape_block_size + view refactor); 50cd567 = last commit before our patch was authored
    vllm_source_patch_script: "build/scripts/patch_vllm_env_override_torch29.py"
    transformers_install_mode: source
    transformers_repo: "https://github.com/huggingface/transformers.git"
    transformers_ref: "f965b10bcc979e6ad5f02a46f6d074206eccbe75"
    turboquant_install_mode: source
    turboquant_repo: "https://github.com/Alberto-Codes/turboquant-vllm.git"
    turboquant_ref: "9d19b87cef462cf0abd5643f6d052ac5a3bc99b6"
    turboquant_source_patch_script: "build/scripts/patch_turboquant_quantizer_gpu_qr.py"
    env:
      ROCM_PATH: /opt/rocm
      HIP_PATH: /opt/rocm
      HSA_OVERRIDE_GFX_VERSION: "11.0.0"
      PYTORCH_ROCM_ARCH: gfx1100
      TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL: "1"
      HIP_FORCE_DEV_KERNARG: "1"
      TORCH_BLAS_PREFER_HIPBLASLT: "1"
      VLLM_ROCM_USE_AITER: "0"
      VLLM_TARGET_DEVICE: rocm
      MIOPEN_FIND_MODE: "2"
      PYTORCH_ALLOC_CONF: "garbage_collection_threshold:0.9,max_split_size_mb:512"
      FLEXINFER_EXPERIMENTAL_MODEL_FAMILY: gemma4
      FLEXINFER_EXPERIMENTAL_KV_CACHE_CODEC: turboquant
      FLEXINFER_EXPERIMENTAL_KV_CACHE_CODEC_STATUS: plugin
      TQ4_USE_FUSED_PAGED: "0"
      TQ4_USE_INT8_PREFILL: "0"
      TQ4_USE_PYTORCH_CODEC: "1"
      TQ4_SHARE_PRIMITIVES: "1"
      TQ4_K_BITS: "4"
      TQ4_V_BITS: "4"
    build_context: 7900xtx

  gfx1100-textgen-turboquant:
    tag: "runtime:rocm-gfx1100-textgen-turboquant"
    gpu_vendor: amd
    gpu_arch: gfx1100
    # Dedicated managed runtime for cblevins-7900xtx text generation. Keep the
    # surface area narrow: vLLM + Gemma4 + TurboQuant plugin only.
    base_image: "rocm/vllm-dev:rocm7.2_navi_ubuntu24.04_py3.12_pytorch_2.9_vllm_0.14.0rc0"
    rocm_dev_image: "rocm/dev-ubuntu-24.04:6.4.4"
    amdgpu_targets: gfx1100
    backends:
      vllm: true
      llamacpp: false
      ollama: false
      diffusers: false
      steam: false
    include_bitsandbytes: false
    include_quantizer: false
    include_turboquant: true
    vllm_install_mode: source
    vllm_extra_deps_profile: minimal
    install_qwen35_fastpath: false
    vllm_repo: "https://github.com/vllm-project/vllm.git"
    vllm_ref: "50cd5674b39c69e60fefd0ec1d61652d693e6a06"  # pinned 2026-05-03: vLLM main drifted past patch_vllm_env_override_torch29.py expected hunks (kernel_block_size→shape_block_size + view refactor); 50cd567 = last commit before our patch was authored
    vllm_source_patch_script: "build/scripts/patch_vllm_env_override_torch29.py"
    transformers_install_mode: source
    transformers_repo: "https://github.com/huggingface/transformers.git"
    transformers_ref: "f965b10bcc979e6ad5f02a46f6d074206eccbe75"
    turboquant_install_mode: source
    turboquant_repo: "https://github.com/Alberto-Codes/turboquant-vllm.git"
    turboquant_ref: "9d19b87cef462cf0abd5643f6d052ac5a3bc99b6"
    turboquant_source_patch_script: "build/scripts/patch_turboquant_quantizer_gpu_qr.py"
    env:
      ROCM_PATH: /opt/rocm
      HIP_PATH: /opt/rocm
      HSA_OVERRIDE_GFX_VERSION: "11.0.0"
      PYTORCH_ROCM_ARCH: gfx1100
      TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL: "1"
      HIP_FORCE_DEV_KERNARG: "1"
      TORCH_BLAS_PREFER_HIPBLASLT: "1"
      VLLM_ROCM_USE_AITER: "0"
      VLLM_TARGET_DEVICE: rocm
      MIOPEN_FIND_MODE: "2"
      PYTORCH_ALLOC_CONF: "garbage_collection_threshold:0.9,max_split_size_mb:512"
      FLEXINFER_EXPERIMENTAL_MODEL_FAMILY: gemma4
      FLEXINFER_EXPERIMENTAL_KV_CACHE_CODEC: turboquant
      FLEXINFER_EXPERIMENTAL_KV_CACHE_CODEC_STATUS: plugin
      TQ4_USE_FUSED_PAGED: "0"
      TQ4_USE_INT8_PREFILL: "0"
      TQ4_USE_PYTORCH_CODEC: "1"
      TQ4_SHARE_PRIMITIVES: "1"
      TQ4_K_BITS: "4"
      TQ4_V_BITS: "4"
    build_context: 7900xtx

  gfx906:
    tag: "runtime:rocm-gfx906"
    # Dedicated Dockerfile: swaps the runtime base to mixa3607/pytorch-gfx906
    # (community-maintained PyTorch with rebuilt rocBLAS+Tensile for gfx906)
    # and applies cycle-1 cleanup techniques (pycache purge, single-layer pip,
    # apt cache strip). Cuts the deployed runtime from 59.2GB → target <40GB
    # so it fits on the radeonvii node's 56GB free root LVM without tripping
    # kubelet DiskPressure.
    dockerfile: build/Dockerfile.runtime-gfx906
    gpu_vendor: amd
    gpu_arch: gfx906
    base_image: "docker.io/mixa3607/pytorch-gfx906:v2.9.0-rocm-6.3.3"
    rocm_dev_image: "rocm/dev-ubuntu-22.04:6.2"
    amdgpu_targets: gfx906
    backends:
      vllm: false        # no compiled vLLM wheels for gfx906
      llamacpp: true
      ollama: true
      diffusers: true
    # bitsandbytes pip wheel lacks gfx906 HIP kernels — Dockerfile builds
    # from source (COMPUTE_BACKEND=hip) in a dedicated stage and copies the
    # wheel into the runtime image when this is true.
    include_bitsandbytes: true
    # mixa3607 ships PyTorch 2.9 → modern transformers stack works.
    transformers_constraint: ">=5.0"
    install_qwen35_fastpath: false
    env:
      ROCM_PATH: /opt/rocm
      HIP_PATH: /opt/rocm
      HSA_OVERRIDE_GFX_VERSION: "9.0.6"
      HSA_ENABLE_SDMA: "0"
      HSA_USE_SVM: "0"
      PYTORCH_ROCM_ARCH: gfx906
      # mixa3607 base lacks hipBLASLt; force-disable so PyTorch picks
      # rocBLAS instead (matches build/Dockerfile.unified-gfx906).
      TORCH_BLAS_PREFER_HIPBLASLT: "0"
      MIOPEN_FIND_MODE: "2"
      HF_HUB_DISABLE_XET: "1"
    build_context: 7900xtx

  cuda-maxwell:
    tag: "runtime:cuda-maxwell"
    gpu_vendor: nvidia
    gpu_arch: sm_52
    base_image: "nvidia/cuda:11.8.0-runtime-ubuntu22.04"
    cuda_dev_image: "nvidia/cuda:11.8.0-devel-ubuntu22.04"
    backends:
      vllm: false
      llamacpp: true
      ollama: true
      diffusers: false
    env:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
    build_context: 7900xtx

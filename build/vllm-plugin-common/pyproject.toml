[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flexinfer-vllm-plugin-common"
version = "0.2.0"
description = "Shared helpers for FlexInfer's vLLM general plugins (ROCm autotune pruning, composite-config label resolution, hybrid-state wiring)"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

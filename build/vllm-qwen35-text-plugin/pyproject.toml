[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flexinfer-vllm-qwen35-text"
version = "0.3.0"
description = "Register vLLM's Qwen3.5 MoE text-only runtime as a hybrid model"
requires-python = ">=3.10"

[project.entry-points."vllm.general_plugins"]
flexinfer_qwen35_text = "flexinfer_vllm_qwen35_text:register"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

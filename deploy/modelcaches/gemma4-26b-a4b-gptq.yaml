# Gemma4 26B-A4B (MoE + GDN hybrid) → Abliteration → GPTQ INT4 Pipeline
# Mixture-of-Experts: 25.2B total / 3.8B active, 128 experts top-8, 30 layers.
# Same Gemma4ForConditionalGeneration architecture as E4B, vision+video capable.
# Hybrid arch: 25 GDN layers + 5 full-attention layers [5,11,17,23,29].
#
# Pipeline: Download BF16 (~27 GB) → Abliterate → GPTQ INT4 hybrid → Ready
# Node class: pin to the live RDNA3 host.
#
# MoE abliteration safety:
#   - weightMatrices: ["o_proj"] ONLY — shared attention output projection.
#     Expert FFN weights (block_sparse_moe/experts) are skipped by abliterate.py.
#   - targetLayers: "auto" — 30 layers, GDN layers auto-skipped (5 full-attn remain).
#   - Double protection: CRD restricts to o_proj + code skips expert params.
#
# MoE quantization:
#   - dynamicExclusion: "auto" — detects MoE architecture. For Gemma4 26B-A4B,
#     the quantizer emits a versioned hybrid directory. MoE experts are GPTQ
#     INT4, while dense attention/MLP weights default to source precision for
#     vLLM/ROCm. Dense GPTQ can pass offline dequantization checks but still
#     trips vLLM's ROCm GPTQ dense kernel path, so it remains opt-in only.
#   - denseModulePolicy: "validate" is the next canary-only path. It keeps a
#     dense GPTQ module family only if offline dequantization cosine checks pass
#     for every layer, and still requires runtime generation validation before
#     alias promotion.
#
# Disk: the upstream BF16 cache expands to roughly 30 Gi on Longhorn/Xet-backed
# downloads, and streaming in-place save needs another full set of shards plus
# cache/log headroom. 60 Gi has proven too tight in practice; use 96 Gi.
# Storage tier: keep the source cache on GPU-local NVMe. The bulk/stable pool has
# proven fragile for rebuildable Gemma source caches after dead-node events, and
# forcing Longhorn onto a GPU/NVMe replica pool keeps download/ablit/quant closer
# to the nodes that actually run the pipeline.
# GPU: 1x RX 7900 XTX (gfx1100, 24GB VRAM) for abliteration + quantization.
# cblevins-5930k is currently NotReady, so keep 26B on the healthy RDNA3 node.
# SysRAM: 64GB node, so keep save/offload in streaming mode via GPUProfile overrides.
---
apiVersion: ai.flexinfer/v1alpha1
kind: ModelCache
metadata:
  name: gemma4-26b-a4b-gptq
  namespace: flexinfer-system
spec:
  source: "google/gemma-4-26B-A4B-it"
  storageStrategy: SharedPVC
  storageSize: "96Gi"
  clusterStorageClassName: nvme-1r-gpu
  secretRef: "hf-token"
  nodeSelector:
    flexinfer.ai/gpu.arch: gfx1100
    kubernetes.io/hostname: cblevins-7900xtx
  download:
    maxMemoryGB: 16
    hfTransfer: false
    backoffLimit: 3
  abliteration:
    numSamples: 256
    targetLayers: "auto"
    weightMatrices:
      - o_proj
    useGPU: true
    maxMemoryGB: 56
    timeoutSeconds: 14400
    nodeSelector:
      flexinfer.ai/gpu.arch: gfx1100
      kubernetes.io/hostname: cblevins-7900xtx
    normThreshold: "100"
    ablitateLmHead: false
  quantization:
    format: GPTQ
    bits: 4
    groupSize: 128
    sym: true
    descAct: false
    # Omit for the conservative fallback path. Set to "validate" only in a
    # canary rebuild when testing fuller dense GPTQ coverage.
    # denseModulePolicy: validate
    # denseModuleCosineThreshold: "0.98"
    useGPU: true
    maxMemoryGB: 48
    # Full MoE GPTQ: 128 experts × 3 modules × 30 layers → 12-24h estimated.
    # CRD max is 43200 (12h). DefaultActiveDeadlineSeconds in controller is 86400.
    timeoutSeconds: 43200
    nodeSelector:
      flexinfer.ai/gpu.arch: gfx1100
      kubernetes.io/hostname: cblevins-7900xtx
    calibration:
      maxSeqLen: 2048
      # Increase samples for better MoE expert coverage (128 experts × top-8).
      maxSamples: 512
  # 2026-05-13: OCI publish DISABLED — adding `publish:` triggered the cache's
  # `Publishing` phase, which moved the serving Model to `Pending` ("Waiting
  # for cache to be ready") and tore down instance #1's pod for the full
  # ~2-3h publish lifecycle (source -> abliterated -> quantize). For a live
  # warm primary, that's an unacceptable outage. The 5930k OCI-pull cache
  # is seeded out-of-band (`crane copy` directly from the on-disk PVC layout
  # OR an NFS share) so we never block the serving path on a publish job.
  # publish:
  #   targets:
  #     - oci
  #   ociRef: "registry.harbor.lan/flexinfer/gemma4-26b-a4b:gptq-w4-g128-attnfp16-clean"
  #   secretRef: "harbor-oci-creds"
  #   maxMemoryGB: 8
  #   timeoutSeconds: 7200
  #   validate:
  #     enabled: false

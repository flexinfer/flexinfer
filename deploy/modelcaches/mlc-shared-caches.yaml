# SharedPVC ModelCaches for MLC-LLM models stored on NFS (mlc-models-nfs PVC)
---
apiVersion: ai.flexinfer/v1alpha1
kind: ModelCache
metadata:
  name: qwen3-4b-mlc
  namespace: flexinfer-system
spec:
  existingClaimName: mlc-models-nfs
  modelPath: Qwen3-4B-q4f16_1-MLC
  source: mlc://mlc-ai/Qwen3-4B-q4f16_1-MLC
  storageSize: 50Gi
  storageStrategy: SharedPVC

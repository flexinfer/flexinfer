apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: flexinfer-system
resources:
  # MLC compiled model references (shared NFS PVC)
  - mlc-shared-caches.yaml

  # === Legacy pipelines disabled during Gemma rollout ===
  # Keep the manifests on disk for rebuild/reference, but stop reconciling the
  # old source caches so their detached Longhorn volumes can be pruned.
  # - abliteration-gptq.yaml         # qwen35-27b-opus-distill-gptq (disabled)
  # - qwen35-9b-gptq.yaml            # qwen35-9b-gptq (disabled; radeonvii artifact)
  # - qwen35-9b-gptq-gfx1100.yaml    # qwen35-9b-gptq-gfx1100 (staged; Slice B — enable to trigger build on cblevins-5930k)
  # - omnicoder-9b-gptq.yaml         # omnicoder-9b-gptq (disabled; OCI cache in use)

  # === Active Abliteration + GPTQ pipelines (Download → Abliterate → Quantize → Publish) ===
  - gemma4-26b-a4b-gptq.yaml        # gemma4-26b-a4b-gptq (cblevins-7900xtx) — pipeline + OCI publish source
  # Dense rebuild paused 2026-05-03: it monopolizes cblevins-5930k and blocks
  # active serving validation for Omnicoder. Re-enable only during a dedicated
  # rebuild window or after ModelCache grows a first-class suspend knob.
  # - gemma4-26b-a4b-gptq-dense.yaml  # gemma4-26b-a4b-gptq-dense (cblevins-5930k, denseModulePolicy=validate canary — issue #53 C)
  - gemma4-31b-gptq.yaml            # gemma4-31b-gptq (radeonvii)

  # === Pre-quantized HF artifacts (download-only, no Abliteration/Quantization) ===
  # 2026-05-05: replaced by qwen36-27b-oci. The old canary requested
  # gpu.count=2 and is unschedulable now that gfx1100 nodes advertise one
  # discrete GPU slot.
  # - qwen3-30b-a3b-gptq-int4.yaml  # disabled; busted old Qwen canary

  # 2026-05-03: Qwen3.6-27B (UPSTREAM) → abliterate → GPTQ INT4. Quant on
  # cblevins-5930k (avoids preempting 7900xtx textgen lanes); artifact
  # publishes to OCI then pulls to 7900xtx for serving. Qwen3.6 is Qwen3.5
  # modeling code under the hood (verified upstream config.json) — existing
  # Qwen3.5 patch stack covers it. See .loom/qwen36-27b-hauhaucs-gptq-plan.md.
  - qwen36-27b-gptq-gfx1100.yaml    # qwen36-27b-gptq-gfx1100 (cblevins-5930k, ~8-14 hr cycle)

  # === Legacy OCI pull caches disabled with the old Qwen rollout ===
  # - qwen35-27b-opus-distill-oci.yaml # disabled
  # - qwen35-9b-oci.yaml               # disabled

  # === Deprecated OCI pull caches ===
  # Deprecated 2026-05-03 with omnicoder-9b Model: staged GPTQ artifact serves
  # corrupted text. Keep the pull-cache manifest for forensic rebuilds only.
  # - omnicoder-9b-oci.yaml

  # === Active OCI pull caches (Harbor → local PVC → Model CRs) ===
  - qwen36-27b-oci.yaml             # qwen36-27b (cblevins-5930k, artifact-only serving cache)
  - gemma4-26b-a4b-gptq-oci-5930k.yaml  # gemma4-26b-a4b-gptq (cblevins-5930k, instance #2 OCI-pull from 7900xtx publish)

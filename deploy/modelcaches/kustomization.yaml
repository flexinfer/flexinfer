  # OCI pull of the abliterated Qwen3.5-9B GPTQ artifact onto cblevins-7900xtx,
  # for the qwen35-9b-ablit-rp psyche-simulator test model.
  - qwen35-9b-oci-gfx1100.yaml

  # === Legacy pipelines disabled during Gemma rollout ===
  # Keep the manifests on disk for rebuild/reference, but stop reconciling the
  # old source caches so their detached Longhorn volumes can be pruned.
  # - abliteration-gptq.yaml         # qwen35-27b-opus-distill-gptq (disabled)
  # - qwen35-9b-gptq.yaml            # qwen35-9b-gptq (disabled; radeonvii artifact)
  # - qwen35-9b-gptq-gfx1100.yaml    # qwen35-9b-gptq-gfx1100 (staged; Slice B — enable to trigger build on cblevins-5930k)
  # - omnicoder-9b-gptq.yaml         # omnicoder-9b-gptq (disabled; OCI cache in use)

  # === Active Abliteration + GPTQ pipelines (Download → Abliterate → Quantize → Publish) ===
  - gemma4-26b-a4b-gptq.yaml        # gemma4-26b-a4b-gptq (cblevins-7900xtx) — pipeline + OCI publish source
  # Dense rebuild paused 2026-05-03: it monopolizes cblevins-5930k and blocks
  # active serving validation for Omnicoder. Re-enable only during a dedicated
  # rebuild window or after ModelCache grows a first-class suspend knob.
  # - gemma4-26b-a4b-gptq-dense.yaml  # gemma4-26b-a4b-gptq-dense (cblevins-5930k, denseModulePolicy=validate canary — issue #53 C)
  - gemma4-31b-gptq.yaml            # gemma4-31b-gptq (radeonvii)

  # === Pre-quantized HF artifacts (download-only, no Abliteration/Quantization) ===
  # 2026-05-05: replaced by qwen36-27b-oci. The old canary requested
  # gpu.count=2 and is unschedulable now that gfx1100 nodes advertise one
  # discrete GPU slot.
  # - qwen3-30b-a3b-gptq-int4.yaml  # disabled; busted old Qwen canary

  # 2026-05-03: Qwen3.6-27B (UPSTREAM) → abliterate → GPTQ INT4. Quant on
  # cblevins-5930k (avoids preempting 7900xtx textgen lanes); artifact
  # publishes to OCI then pulls to 7900xtx for serving. Qwen3.6 is Qwen3.5
  # modeling code under the hood (verified upstream config.json) — existing
  # Qwen3.5 patch stack covers it. See .loom/qwen36-27b-hauhaucs-gptq-plan.md.
  #
  # PAUSED 2026-06-27: the note above is stale — this cache's quantization stage
  # is pinned to cblevins-radeonvii/gfx906 (quantization.nodeSelector) for host-RAM
  # headroom during the full lm_head solve. That Job requests the Radeon VII's
  # single amd.com/gpu at PriorityClass flexinfer-modelcache-transform (100000),
  # which outranks the embed/rerank serving plane — so it starves
  # bge-large-radeonvii + bge-reranker-radeonvii and 502s the retrieval lane (it
  # killed a codebase-reembed run on 2026-06-27, and was itself failing 3/3 at the
  # lm_head offloaded-tensor save bug). Re-enable only in a dedicated window with
  # the retrieval plane scaled down, or after the GPTQ stage is rehomed off the
  # retrieval card. Retrieval plane: deploy/models/{bge-radeonvii,bge-reranker-radeonvii}.yaml.
  # - qwen36-27b-gptq-gfx1100.yaml    # PAUSED: GPTQ stage on radeonvii starves the embed/rerank plane (~8-14 hr cycle)

  # 2026-07-20: exact BF16 source for DavidAU's Qwen3.6-27B Fable Fusion 711
  # GGUF -> text-only GPTQ W4_G128 candidate. Build window ACTIVE: the warm
  # Radeon VII retrieval lanes and pyannote are parked for this 96 GiB job.
  # After publish, pin the OCI digest before enabling the pull cache.
  - qwen36-27b-fable-gptq.yaml
  # - qwen36-27b-fable-oci.yaml

  # === Track B: 70B daily-driver self-quant (Download → Quantize only) ===
  # 2026-06-10: huihui-ai/Llama-3.3-70B-Instruct-abliterated → GPTQ INT4 on
  # cblevins-5930k, staged on llm-models-nfs (existingClaimName). Source is
  # pre-abliterated; artifact serves on the PP=2 gfx1100 topology. See
  # docs/f5-daily-driver-70b-eval-2026-06-10.md (Track B).
  - llama33-70b-abliterated-gptq.yaml

  # === Clean long-context council workhorse ===
  # Official Qwen3.5 BF16 -> text-only GPTQ W4A16 on the high-RAM Radeon VII;
  # the resulting shared artifact serves independently on both gfx1100 nodes.
  - qwen35-35b-a3b-clean-gptq.yaml

  # === Legacy OCI pull caches disabled with the old Qwen rollout ===
  # - qwen35-27b-opus-distill-oci.yaml # disabled
  # - qwen35-9b-oci.yaml               # disabled

  # === Deprecated OCI pull caches ===
  # Deprecated 2026-05-03 with omnicoder-9b Model: staged GPTQ artifact serves
  # corrupted text. Keep the pull-cache manifest for forensic rebuilds only.
  # - omnicoder-9b-oci.yaml

  # === Active OCI pull caches (Harbor → local PVC → Model CRs) ===
  - qwen36-27b-oci.yaml             # qwen36-27b (cblevins-5930k, artifact-only serving cache)
  - gemma4-26b-a4b-gptq-oci-5930k.yaml  # gemma4-26b-a4b-gptq (cblevins-5930k, artifact-only serving cache). OCI artifact seeded 2026-05-13 via one-off oras push from cblevins-7900xtx cache PVC (digest sha256:ef26e6c7...).

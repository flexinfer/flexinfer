# OCI Pull Cache for Qwen3.6-27B abliterated GPTQ INT4.
#
# Pipeline: ModelCache(qwen36-27b-gptq-gfx1100) -> Publish -> Harbor OCI
# -> ModelCache(qwen36-27b-oci) -> Model(qwen36-27b-gptq).
#
# The build cache lives on the 5930k NVMe PVC and preserves source weights for
# rebuilds. This pull cache gives serving a compact artifact-only PVC from the
# published digest/tag.
---
apiVersion: ai.flexinfer/v1alpha1
kind: ModelCache
metadata:
  name: qwen36-27b-oci
  namespace: flexinfer-system
  annotations:
    flexinfer.ai/promotion-state: qwen36-ready-replaces-busted-qwen-canary
    flexinfer.ai/source-digest: sha256:fe3a6bea0cd2cdf254a5db6194e01402f1f7f93c4b86d8c717695470fdd3849d
spec:
  source: "oci://registry.harbor.lan/flexinfer/qwen36-27b:gptq-w4-g128-gfx1100"
  modelPath: "qwen36-27b"
  storageStrategy: SharedPVC
  storageSize: "30Gi"
  clusterStorageClassName: local-path
  secretRef: "harbor-oci-creds"
  nodeSelector:
    kubernetes.io/hostname: cblevins-5930k
  download:
    maxMemoryGB: 8
    backoffLimit: 3
  retentionPriority: 85
  evictionPolicy: LRU
  evictionThresholdPercent: 85

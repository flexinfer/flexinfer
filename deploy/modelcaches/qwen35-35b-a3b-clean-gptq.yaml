# Clean Qwen3.5-35B-A3B text-only GPTQ workhorse artifact.
#
# The official GPTQ checkpoint keeps every attention module in full precision
# and loads at 20.15 GiB, leaving too little room for hybrid GDN/full-attention
# KV cache on a 24 GiB RX 7900 XTX. This pipeline starts from the clean BF16
# source and uses FlexInfer's proven Qwen3.5 MoE policy: extract text_config,
# quantize routed experts through GPTQModel's native MoE lifecycle, explicitly
# preserve every GDN/linear-attention projection, and emit a fused text-only
# W4A16 artifact. The native MoE lifecycle is already proven by the existing
# Qwen3.6 artifacts; this rebuild adds the stricter recurrence-safety policy.
#
# Quantization runs on the Radeon VII because the 72 GB source plus GPTQModel
# working set needs ~100 GiB host RAM. The finished artifact is stored on the
# shared NFS claim and will serve independently on both RX 7900 XTX nodes.
apiVersion: ai.flexinfer/v1alpha1
kind: ModelCache
metadata:
  name: qwen35-35b-a3b-clean-gptq
  namespace: flexinfer-system
  annotations:
    # This cache only needs the validated final GPTQ artifact. Avoid an
    # implicit 72 GB BF16 source mirror before the active quantization phase.
    flexinfer.ai/publish-intermediate-stages: "false"
    # Retry only the publish validation stage after the validator delivery fix.
    # The controller preserves the completed GPTQ artifact and quantization status.
    flexinfer.ai/revalidate: "validator-d1515f57"
spec:
  source: Qwen/Qwen3.5-35B-A3B
  storageStrategy: SharedPVC
  existingClaimName: llm-models-nfs
  modelPath: qwen35-35b-a3b-clean
  storageSize: 240Gi
  secretRef: hf-token
  retentionPriority: 90
  evictionPolicy: LRU
  evictionThresholdPercent: 90
  download:
    maxMemoryGB: 8
    hfTransfer: false
    backoffLimit: 3
  quantization:
    format: GPTQ
    bits: 4
    groupSize: 128
    sym: true
    descAct: false
    # The first completed cycle used "auto", which correctly exercised the
    # native MoE defuse/refuse lifecycle but also quantized in_proj_qkv,
    # in_proj_z, and out_proj on all 30 GDN layers. That is the exact artifact
    # shape previously correlated with recurrent-state/logit collapse. Use the
    # explicit GDN policy: GPTQModel still quantizes routed/shared experts and
    # full-attention projections, while every linear_attn module remains BF16.
    # The controller isolates this shape under gptq-w4-g128-gdn so the rebuild
    # cannot reuse the rejected auto-policy artifact's .save-complete marker.
    dynamicExclusion: gdn
    useGPU: true
    maxMemoryGB: 102
    gpuMemoryFraction: "0.85"
    timeoutSeconds: 86400
    nodeSelector:
      kubernetes.io/hostname: cblevins-radeonvii
    calibration:
      # The Qwen3.5-MoE policy clamps this to its validated 16x512/8192-token
      # calibration budget; keep the requested envelope explicit for provenance.
      maxSeqLen: 2048
      maxSamples: 256
  # Ready is only safe after the GDN-preserving artifact passes the strict
  # family/layout gate. Publish with a digest-suffixed tag so downstream
  # prewarm and promotion can pin the immutable content rather than this RWX
  # PVC path.
  publish:
    targets:
      - oci
    ociRef: "registry.harbor.lan/flexinfer/qwen35-35b-a3b-clean:gptq-w4-g128-gdn"
    secretRef: "harbor-oci-creds"
    tagPolicy: digest-suffix
    maxMemoryGB: 8
    timeoutSeconds: 7200
    validate:
      enabled: true
      # Re-run the failed publish gate with the current validator without
      # touching the completed 22.75 GB GPTQ artifact.
      image: "registry.harbor.lan/flexinfer/model-tools@sha256:d1515f57e5e92ad62a8f3820eb428fc32436cf979fa130817fbe3f038edd14d1"
      layout: vllm-gptq
      family: qwen35-35b-a3b
      failOnWarnings: true
  tolerations:
    - key: node.flexstack.io/gpu-shared
      operator: Equal
      value: "true"
      effect: PreferNoSchedule

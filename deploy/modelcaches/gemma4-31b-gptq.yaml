# Gemma4 31B (Dense) → Abliteration → GPTQ INT4 Pipeline
# Dense model: 30.7B params, 60 layers, all standard attention (no MoE, no GDN).
# Same Gemma4ForConditionalGeneration architecture, vision+video capable.
#
# Pipeline: Download BF16 (~61 GB) → Abliterate → GPTQ INT4 (~16 GB) → Ready
# Node: cblevins-radeonvii (gfx906, 128GB RAM)
#
# Abliteration:
#   - weightMatrices: ["o_proj", "down_proj"] — dense model, safe to use both (no experts).
#   - targetLayers: "auto" — 60 layers, all standard attention.
#
# Disk: 61 GB BF16 + ~16 GB GPTQ INT4 + headroom → 120 Gi PVC
# Storage tier: use GPU/NVMe 1R cache storage. The stable bulk pool no longer has
# enough schedulable headroom for a new 120Gi Tier-C cache volume.
# GPU: 1x Radeon VII (gfx906, 16GB VRAM) for abliteration + quantization
# Quantization timeout: 8 hours (larger model, ~2x layers vs 26B-A4B)
---
apiVersion: ai.flexinfer/v1alpha1
kind: ModelCache
metadata:
  name: gemma4-31b-gptq
  namespace: flexinfer-system
spec:
  source: "google/gemma-4-31B-it"
  storageStrategy: SharedPVC
  storageSize: "120Gi"
  clusterStorageClassName: nvme-1r-gpu
  secretRef: "hf-token"
  nodeSelector:
    kubernetes.io/hostname: cblevins-radeonvii
  download:
    maxMemoryGB: 16
    hfTransfer: false
    backoffLimit: 3
  abliteration:
    numSamples: 256
    targetLayers: "auto"
    weightMatrices:
      - o_proj
      - down_proj
    useGPU: true
    maxMemoryGB: 96
    timeoutSeconds: 14400
    nodeSelector:
      kubernetes.io/hostname: cblevins-radeonvii
    normThreshold: "100"
    ablitateLmHead: false
  quantization:
    format: GPTQ
    bits: 4
    groupSize: 128
    sym: true
    descAct: false
    useGPU: true
    maxMemoryGB: 96
    timeoutSeconds: 28800
    nodeSelector:
      kubernetes.io/hostname: cblevins-radeonvii
    calibration:
      maxSeqLen: 2048
      maxSamples: 256

# Gemma4 31B (Dense, GDN hybrid) → Abliteration → GPTQ INT4 Pipeline
# Dense model: 30.7B params, 60 layers, GDN hybrid architecture (no MoE).
# Same Gemma4ForConditionalGeneration architecture, vision+video capable.
# Hybrid arch: 50 GDN layers + 10 full-attention layers [5,11,17,23,29,35,41,47,53,59].
#
# Pipeline: Download BF16 (~61 GB) → Abliterate → GPTQ INT4 (~16 GB) → Ready
# Node: cblevins-radeonvii (gfx906, 128GB RAM)
# 64GB gfx1100 nodes are not a safe target for this model today: the dense 31B
# checkpoint already drives ~60GiB host RSS during abliteration before save-time
# overhead, so keep it on the 128GB Radeon VII host.
#
# Abliteration:
#   - weightMatrices: ["o_proj", "down_proj"] — dense model, safe to use both (no experts).
#   - targetLayers: "auto" — 60 layers, GDN layers auto-skipped (10 full-attn remain).
#
# Disk: 61 GB BF16 + ~16 GB GPTQ INT4 + headroom → 120 Gi PVC
# Storage tier: use the NAS-backed RWX pool for the source cache. The GPU/NVMe
# 1R pool no longer has enough schedulable headroom for a clean 31B rebuild,
# and the bulk Longhorn pool is currently failing replica prechecks.
# GPU: 1x Radeon VII (gfx906, 16GB VRAM) for abliteration + quantization
# Quantization timeout: 12 hours (CRD max). Original 8h was too tight — on
# gfx906 the per-layer rate is ~9-10 min with the Hessian recovery fix,
# giving a quantize floor of ~10 h + ~30 min save for 59 layers. 2026-04-20
# run hit 8h deadline at layer 52/59 (90%) and the retry budget (3)
# exhausted at the same point. 12h leaves some headroom for ROCm LAPACK
# fallback variance; if we need more, the CRD validation cap
# (QuantizationSpec.TimeoutSeconds kubebuilder:validation:Maximum=43200)
# must be raised too.
---
apiVersion: ai.flexinfer/v1alpha1
kind: ModelCache
metadata:
  name: gemma4-31b-gptq
  namespace: flexinfer-system
spec:
  source: "google/gemma-4-31B-it"
  storageStrategy: SharedPVC
  storageSize: "120Gi"
  clusterStorageClassName: nas-bulk-rwx
  secretRef: "hf-token"
  nodeSelector:
    kubernetes.io/hostname: cblevins-radeonvii
  download:
    maxMemoryGB: 16
    hfTransfer: false
    backoffLimit: 3
  abliteration:
    numSamples: 256
    targetLayers: "auto"
    weightMatrices:
      - o_proj
      - down_proj
    useGPU: true
    maxMemoryGB: 96
    timeoutSeconds: 14400
    nodeSelector:
      kubernetes.io/hostname: cblevins-radeonvii
    normThreshold: "100"
    ablitateLmHead: false
  quantization:
    format: GPTQ
    bits: 4
    groupSize: 128
    sym: true
    descAct: false
    useGPU: true
    maxMemoryGB: 96
    timeoutSeconds: 43200
    nodeSelector:
      kubernetes.io/hostname: cblevins-radeonvii
    calibration:
      maxSeqLen: 2048
      maxSamples: 256
      # Halved from default 16 → 8 after the 2026-04-21 run produced a
      # corrupt artifact: layers 0-39 quantized distinctly but layers
      # 40-59 had qweight hashes identical across every sliding-window
      # set and every full-attention set — the canonical "Hessian
      # recovery exhaustion" failure mode where the quantizer bailed
      # and wrote copies of the last-succeeded layer's tensors. Lower
      # parallel batch reduces peak GPU+CPU memory during Hessian
      # inverse compute. MEMORY.md explicitly recommends reducing
      # calibration samples over bumping container memory because
      # ROCm HIP driver allocations are outside the cgroup.
      nParallelCalibSamples: 8

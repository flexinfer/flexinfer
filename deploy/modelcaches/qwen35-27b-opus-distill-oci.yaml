# OCI Pull Cache for Qwen3.5-27B-Opus-Distill GPTQ INT4
# Pulls quantized model from Harbor OCI registry into local-path PVC on 7900xtx.
# Model CR sources from this PVC for serving.
#
# Pipeline: ModelCache(gptq) → Publish → Harbor OCI → ModelCache(oci) → Model CR
---
apiVersion: ai.flexinfer/v1alpha1
kind: ModelCache
metadata:
  name: qwen35-27b-opus-distill-oci
  namespace: flexinfer-system
spec:
  source: "oci://registry.harbor.lan/flexinfer/qwen35-27b-opus-distill:gptq-w4-g128"
  modelPath: "qwen35-27b-opus-distill"
  storageStrategy: SharedPVC
  storageSize: "30Gi"
  clusterStorageClassName: local-path
  secretRef: "harbor-oci-creds"
  nodeSelector:
    kubernetes.io/hostname: cblevins-7900xtx
  download:
    maxMemoryGB: 8
    backoffLimit: 3
  retentionPriority: 80
  evictionPolicy: LRU
  evictionThresholdPercent: 85

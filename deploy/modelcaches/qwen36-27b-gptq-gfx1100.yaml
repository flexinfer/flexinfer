# Qwen3.6-27B (UPSTREAM BASE) → Abliterate → GPTQ INT4 → gfx1100 serving tag.
#
# Critical reframe (verified 2026-05-03): "Qwen3.6" is just Qwen3.5 modeling
# code with vocab_size=248320 and head_dim=256. config.json says
# model_type=qwen3_5 and architectures=[Qwen3_5ForConditionalGeneration].
# Our existing Qwen3.5 patch stack covers this with no code changes (only
# smoke-time verification).
#
# Source: Qwen/Qwen3.6-27B (BF16 safetensors, ~55.6 GB, 15 shards). NOT the
# HauhauCS GGUF — see .loom/qwen36-27b-hauhaucs-gptq-plan.md for the
# Path A vs Path B analysis. Path A chosen because Path B requires
# GGUF→BF16 dequant tooling (not yet built) and HauhauCS's specific
# abliteration tuning is empirically untested vs our pipeline.
#
# Pipeline: Download BF16 → Abliterate (skipGDNLayers=true) → GPTQ INT4 → OCI publish
#
# Architecture details (verified against upstream config.json on 2026-05-03):
#   - 64 layers: 16x [3 linear_attention + 1 full_attention] = 48 GDN + 16 GA
#   - Full-attention layer indices: 3, 7, 11, ..., 63 (every 4th, 16 total)
#   - hidden_size=5120, intermediate_size=17408, head_dim=256
#   - num_attention_heads=24, num_key_value_heads=4 (GQA 6:1)
#   - vocab_size=248320 (multilingual VLM vocab)
#   - max_position_embeddings=262144 (raise after smoke; cap initially)
#   - tie_word_embeddings=false (lm_head = separate 248320 x 5120 tensor)
#   - rope_theta=10000000 (1e7, vs Qwen3.5-9B's 1e6 — verify vLLM honors)
#   - VLM with vision_config; we serve text-only (text_config promoted)
#
# Storage envelope:
#   BF16 source ~56 GB + abliterate inplace (modifies in place) +
#   GPTQ output ~14 GB + checkpoint cache ~2 GB → 90 Gi minimum.
#   Use 120Gi for safety; matches Qwen3.5-27B opus distill envelope.
#
# Node placement: download and abliteration stay on cblevins-5930k/gfx1100.
# GPTQ runs on cblevins-radeonvii/gfx906 for host-memory headroom during the
# full lm_head-inclusive solve/pack. After publish to OCI, the Model CR pulls
# the artifact onto cblevins-7900xtx for gfx1100 serving.
---
apiVersion: ai.flexinfer/v1alpha1
kind: ModelCache
metadata:
  name: qwen36-27b-gptq-gfx1100
  namespace: flexinfer-system
  annotations:
    flexinfer.ai/promotion-state: pending-quant-cycle
    flexinfer.ai/promotion-requires: ".loom/qwen36-27b-hauhaucs-gptq-plan.md"
spec:
  source: "Qwen/Qwen3.6-27B"
  storageStrategy: SharedPVC
  storageSize: "120Gi"
  clusterStorageClassName: nvme-1r-gpu
  secretRef: "hf-token"
  nodeSelector:
    flexinfer.ai/gpu.arch: gfx1100
    kubernetes.io/hostname: cblevins-5930k
  download:
    maxMemoryGB: 8
    hfTransfer: false
    backoffLimit: 3
  abliteration:
    # 48 GDN layers — skip per the GDN-layer guard added in commit 14c9b88.
    skipGDNLayers: true
    numSamples: 256
    # Middle full-attention layers carry the strongest refusal direction.
    # Full-attention layer indices for Qwen3.6-27B: 3,7,11,15,19,23,27,31,35,
    # 39,43,47,51,55,59,63. Picking 27/31/35 (mid-stack of full-attn).
    targetLayers: "27,31,35"
    useGPU: true
    # 40 GiB job budget + 12 GiB gfx1100 driver reservation keeps the pod
    # within the 5930k's ~56 GiB allocatable memory.
    maxMemoryGB: 40
    timeoutSeconds: 21600  # 6 h upper bound; 27B abliteration on gfx1100 is ~2-4 h
    nodeSelector:
      flexinfer.ai/gpu.arch: gfx1100
      kubernetes.io/hostname: cblevins-5930k
    normThreshold: "100"
    # KEEP FALSE: streaming-save corrupts lm_head when accelerate offload is on.
    # See CLAUDE.md memory: "Qwen3.5 GPTQ Root Cause + Fix" (2026-04-01).
    ablitateLmHead: false
  quantization:
    format: GPTQ
    bits: 4
    groupSize: 128
    sym: true       # ExllamaLinearKernel (HIP-compiled, 72-73 tok/s on gfx1100)
    descAct: false
    # Exclude GDN linear-attention sub-modules from int4 quantization. The
    # 2026-05-03 cycle ran with `dynamicExclusion: "none"`, which produced an
    # artifact with int4 `linear_attn.in_proj_qkv`, `in_proj_z`, and
    # `out_proj` on all 48 GDN layers (Track D-1 evidence in
    # `.loom/60-validation-matrix.md`). At runtime, vLLM's GDN
    # `gdn_attention_core` and FLA chunk/recurrent kernels expect FP weights
    # for these projections; serving the int4-quantized variant collapsed
    # logits to flat punctuation.
    #
    # 2026-05-09 path:
    #   - Cycles 4-5 hit GPTQModel.shell_module_materialize crashing on
    #     accelerate disk-offloaded meta tensors. Root cause was the
    #     manual_sharded_state_dict loader constructing GPTQModel with
    #     turtle_model=None, forcing the .to(device) fallthrough.
    #   - Briefly tried `gdn-min` to dodge memory pressure, but the CRD
    #     enum (debt/DEBT-302 commit 10d4a7ef) only accepts auto;gdn;none.
    #     Flux blocked the modelcache update; live spec stayed at "gdn".
    #   - Real fix landed in MR !300: qwen3.5-text policy uses stock
    #     GPTQModel.load(offload_to_disk=true) which sets turtle_model
    #     to LazyTurtle. shell_module_materialize then routes through
    #     undo_offload_to_disk to materialize layers on demand. This
    #     handles disk-offloaded layers cleanly so the full "gdn" mode
    #     no longer needs to fit in physical memory.
    dynamicExclusion: "gdn"
    useGPU: true
    # Run GPTQ on the Radeon VII host for memory headroom. The generated GPTQ
    # artifact is backend/layout portable and is still published to the
    # gfx1100 serving tag below.
    # 2026-05-08: 40 -> 56 to give the dynamicExclusion: gdn cycle headroom
    # for the 48 GDN linear-attn FP submodules; 56 -> 48 because cblevins-5930k
    # only has ~54.7 GiB allocatable (64 GiB - kernel/system - 8 GiB hugepages),
    # AND ROCm/HIP GPU driver memory (~15-20 GiB) lives outside the cgroup.
    # 2026-05-11: after direct lm_head tensor handoff, the 5930k canary
    # completed all 64 decoder layers and freed GPU memory, then exceeded the
    # 64-GiB host during the stock GPTQ lm_head CPU solve/pack. Radeon VII has
    # 128 GiB host RAM available, so use the gfx906 quantizer to finish the full
    # lm_head-inclusive quant while preserving the gfx1100 publish target.
    maxMemoryGB: 96
    # Qwen3.6 lm_head quantization needs ~4.7 GiB of temporary VRAM after the
    # decoder stack is already packed. The default 0.80 cap OOMs there even
    # though physical VRAM is still available.
    gpuMemoryFraction: "0.95"
    timeoutSeconds: 28800  # 8 h upper bound; 27B GPTQ on gfx1100 is ~3-6 h
    nodeSelector:
      flexinfer.ai/gpu.arch: gfx906
      kubernetes.io/hostname: cblevins-radeonvii
    calibration:
      maxSeqLen: 2048
      maxSamples: 128
  publish:
    targets:
      - oci
    ociRef: "registry.harbor.lan/flexinfer/qwen36-27b:gptq-w4-g128-gfx1100"
    secretRef: "harbor-oci-creds"
    maxMemoryGB: 8
    timeoutSeconds: 7200
    validate:
      enabled: true
      layout: vllm-gptq
      family: qwen36-27b
      # DEBT-302: warning-first while qwen36 recovery is still canary-only.
      # Set true after the first dynamicExclusion=gdn artifact proves clean.
      failOnWarnings: false
  retentionPriority: 60
  evictionPolicy: LRU
  evictionThresholdPercent: 85

# GPTQ Quantization ModelCaches
# Downloads BF16 models and quantizes to GPTQ INT4.
#
# Pipeline lifecycle:
#   1. Controller creates PVC and download job (Provisioning)
#   2. After download, controller creates GPTQ quantization job (Quantizing)
#   3. Quantized files stored in gptq-w4-g128/ subdirectory on PVC (Ready)
#
# Abliteration DISABLED (2026-03-30):
#   Previous abliteration corrupted model weights (norm=152.96 across all 64 layers).
#   The abliteration job also fails on radeonvii for the 27B model (timeout after 4h).
#   Re-quantizing from clean FP16 without abliteration to get a working model first.
#   Re-enable abliteration after the model is verified working.
#
# Disk requirements:
#   27B BF16: ~54 GB download + ~10 GB GPTQ output + working headroom → 160 GB PVC
#
# GPU requirements: 1x AMD GPU for quantization
# Node: cblevins-radeonvii (gfx906, 128GB RAM) — uses community PyTorch build
#   (mixa3607/pytorch-gfx906) with transformers>=5 for Qwen3.5 support.
---
# Qwen3.5-27B Opus-Reasoning-Distilled → GPTQ INT4
# SFT from Claude 4.6 Opus reasoning, BF16 ~54 GB.
apiVersion: ai.flexinfer/v1alpha1
kind: ModelCache
metadata:
  name: qwen35-27b-opus-distill-gptq
  namespace: flexinfer-system
spec:
  source: "Jackrong/Qwen3.5-27B-Claude-4.6-Opus-Reasoning-Distilled"
  storageStrategy: SharedPVC
  storageSize: "160Gi"
  clusterStorageClassName: nvme-1r-gpu
  secretRef: "hf-token"
  nodeSelector:
    kubernetes.io/hostname: cblevins-radeonvii
  download:
    maxMemoryGB: 16
    hfTransfer: false
    backoffLimit: 3
  # abliteration: disabled — re-enable after model is verified working
  # See git history for previous abliteration config with safeguards
  quantization:
    format: GPTQ
    bits: 4
    groupSize: 128
    sym: true
    descAct: false
    dynamicExclusion: "none"
    useGPU: true
    maxMemoryGB: 96            # 128GB node, 54GB model + GPTQ overhead
    timeoutSeconds: 28800
    nodeSelector:
      kubernetes.io/hostname: cblevins-radeonvii
    calibration:
      maxSeqLen: 2048
      maxSamples: 128
  publish:
    targets:
      - oci
    ociRef: "registry.harbor.lan/flexinfer/qwen35-27b-opus-distill:gptq-w4-g128"
    secretRef: "harbor-oci-creds"
    maxMemoryGB: 8
    timeoutSeconds: 7200

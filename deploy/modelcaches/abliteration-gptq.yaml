# GPTQ Quantization ModelCaches
# Downloads BF16 models and quantizes to GPTQ INT4.
#
# Pipeline lifecycle:
#   1. Controller creates PVC and download job (Provisioning)
#   2. After download, controller creates GPTQ quantization job (Quantizing)
#   3. Quantized files stored in gptq-w4-g128/ subdirectory on PVC (Ready)
#
# Abliteration RE-ENABLED (2026-03-25) with layered safeguards:
#   1. GDN layer skip (skipGDNLayers: true) — never touch the 48 GDN linear-attention
#      layers whose out_proj participates in recurrence
#   2. Core-layer targeting — only edit the middle full-attention layers where refusal
#      steering is strongest; leave early/late full-attention blocks untouched
#   2. Norm guard — aborts if refusal direction norm > 100 (original run was 152.96)
#   3. Perplexity validation — aborts before save if model perplexity > 50
# See docs/dev/qwen35-gptq-root-cause.md for full root cause analysis.
#
# Disk requirements:
#   27B BF16: ~54 GB download + ~15 GB GPTQ output + working headroom → 160 GB PVC
#
# GPU requirements: 1x AMD GPU for abliteration + quantization
# Node: cblevins-radeonvii (gfx906, 128GB RAM) — uses community PyTorch build
#   (mixa3607/pytorch-gfx906) with transformers>=5 for Qwen3.5 support.
---
# Qwen3.5-27B Opus-Reasoning-Distilled → GPTQ INT4
# SFT from Claude 4.6 Opus reasoning, BF16 ~54 GB.
apiVersion: ai.flexinfer/v1alpha1
kind: ModelCache
metadata:
  name: qwen35-27b-opus-distill-gptq
  namespace: flexinfer-system
spec:
  source: "Jackrong/Qwen3.5-27B-Claude-4.6-Opus-Reasoning-Distilled"
  storageStrategy: SharedPVC
  storageSize: "160Gi"
  clusterStorageClassName: nvme-1r-gpu
  secretRef: "hf-token"
  nodeSelector:
    kubernetes.io/hostname: cblevins-radeonvii
  download:
    maxMemoryGB: 16
    hfTransfer: false
    backoffLimit: 3
  abliteration:
    skipGDNLayers: true        # Skip all 48 GDN layers
    numSamples: 128
    # Qwen3.5 full-attention blocks are every 4th layer. Keep the intervention in
    # the middle of the network where refusal steering tends to be strongest, and
    # avoid the early/late full-attention blocks that previously produced extreme
    # refusal norms and coherence collapse.
    targetLayers: "27,31,35"
    # gfx906 repeatedly fails during accelerate.dispatch_model() when the
    # abliterator tries to shard the BF16 model onto the GPU. Keep the job on
    # the radeonvii node, but run the abliteration step on CPU to get a stable
    # custom source model; quantization still uses the GPU below.
    useGPU: false
    maxMemoryGB: 96            # 128GB node, 54GB model + GPU offload headroom
    timeoutSeconds: 14400
    nodeSelector:
      kubernetes.io/hostname: cblevins-radeonvii
  quantization:
    format: GPTQ
    bits: 4
    groupSize: 128
    sym: true
    descAct: false
    dynamicExclusion: "none"
    useGPU: true
    maxMemoryGB: 96            # 128GB node, 54GB model + GPTQ overhead
    timeoutSeconds: 28800
    nodeSelector:
      kubernetes.io/hostname: cblevins-radeonvii
    calibration:
      maxSeqLen: 2048
      maxSamples: 128
  publish:
    targets:
      - oci
    ociRef: "registry.harbor.lan/flexinfer/qwen35-27b-opus-distill:gptq-w4-g128"
    secretRef: "harbor-oci-creds"
    maxMemoryGB: 8
    timeoutSeconds: 7200

# GPTQ Quantization ModelCaches
# Downloads BF16 models and quantizes to GPTQ INT4.
#
# Pipeline lifecycle:
#   1. Controller creates PVC and download job (Provisioning)
#   2. After download, controller creates GPTQ quantization job (Quantizing)
#   3. Quantized files stored in gptq-w4-g128/ subdirectory on PVC (Ready)
#
# NOTE: Abliteration REMOVED (2026-03-24). Refusal direction removal with
# norm=152.96 applied to all 64 layers (including 48 GDN layers) catastrophically
# corrupted the Qwen3.5 hybrid GatedDeltaNet model. See docs/dev/qwen35-gptq-root-cause.md.
# Abliteration needs architecture-aware layer targeting before re-enabling on GDN models.
#
# Disk requirements:
#   27B BF16: ~54 GB download + ~15 GB GPTQ output + working headroom → 160 GB PVC
#
# GPU requirements: 1x AMD GPU for quantization
---
# Qwen3.5-27B Opus-Reasoning-Distilled → GPTQ INT4
# SFT from Claude 4.6 Opus reasoning, BF16 ~54 GB.
apiVersion: ai.flexinfer/v1alpha1
kind: ModelCache
metadata:
  name: qwen35-27b-opus-distill-gptq
  namespace: flexinfer-system
spec:
  source: "Jackrong/Qwen3.5-27B-Claude-4.6-Opus-Reasoning-Distilled"
  storageStrategy: SharedPVC
  storageSize: "160Gi"
  clusterStorageClassName: nvme-1r-gpu
  secretRef: "hf-token"
  nodeSelector:
    kubernetes.io/hostname: cblevins-7900xtx
  download:
    maxMemoryGB: 16
    hfTransfer: false
    backoffLimit: 3
  # abliteration: DISABLED — corrupts Qwen3.5 GDN layers (see docs/dev/qwen35-gptq-root-cause.md)
  quantization:
    format: GPTQ
    bits: 4
    groupSize: 128
    sym: true
    descAct: false
    dynamicExclusion: "none"
    useGPU: true
    maxMemoryGB: 48
    timeoutSeconds: 28800
    calibration:
      maxSeqLen: 2048
      maxSamples: 128
  publish:
    targets:
      - oci
    ociRef: "registry.harbor.lan/flexinfer/qwen35-27b-opus-distill:gptq-w4-g128"
    secretRef: "harbor-oci-creds"
    maxMemoryGB: 8
    timeoutSeconds: 7200

# GPTQ Quantization ModelCaches
# Downloads BF16 models and quantizes to GPTQ INT4.
#
# Pipeline lifecycle:
#   1. Controller creates PVC and download job (Provisioning)
#   2. After download, controller creates abliteration job (Abliterating)
#   3. After abliteration, controller creates GPTQ quantization job (Quantizing)
#   4. Quantized files stored in gptq-w4-g128/ subdirectory on PVC (Ready)
#
# Abliteration RE-ENABLED (2026-03-30) with layered safeguards:
#   1. GDN layer skip (skipGDNLayers: true) — never touch the 48 GDN linear-attention
#      layers whose out_proj participates in recurrence
#   2. Core-layer targeting — only edit the middle full-attention layers where refusal
#      steering is strongest; leave early/late full-attention blocks untouched
#   3. Norm guard — aborts if refusal direction norm > 100 (original run was 152.96)
#   4. Perplexity validation — aborts before save if model perplexity > 50
#
# Key insight: abliteration and quantization exclusions are INDEPENDENT.
#   - Abliteration skips GDN layers (skipGDNLayers: true) — safe, only 16 layers modified
#   - Quantization quantizes ALL layers (dynamicExclusion: none) — ~10 GB output fits 24 GB VRAM
#   The unmodified GDN layers get quantized to INT4 without issue.
#
# Disk requirements:
#   27B BF16: ~54 GB download + ~10 GB GPTQ output + working headroom → 160 GB PVC
#
# GPU requirements: 1x AMD GPU for abliteration + quantization
# Node: cblevins-radeonvii (gfx906, 128GB RAM) — uses community PyTorch build
#   (mixa3607/pytorch-gfx906) with transformers>=5 for Qwen3.5 support.
#
# Abliteration GPU memory (gfx906-specific):
#   useGPU: true → device_map=auto, splits model across GPU+CPU.
#   Radeon VII = 16 GB VRAM. Controller env var overrides required:
#     FLEXINFER_ABLITERATION_GPU_MAX_MEMORY_GB=12  (default 20 exceeds VRAM → HIP crash)
#     FLEXINFER_ABLITERATION_CPU_MAX_MEMORY_GB=56  (default caps at 32 → disk offload stall)
#   GPU+CPU split: ~9s/prompt steady-state (vs ~16s/prompt pure CPU).
#
# PVC contention:
#   SharedPVC is RWO. Runtime pod on 7900xtx must be paused during abliteration.
#   Patch runtime deployment nodeSelector to nonexistent node before starting.
---
# Qwen3.5-27B Opus-Reasoning-Distilled → GPTQ INT4
# SFT from Claude 4.6 Opus reasoning, BF16 ~54 GB.
apiVersion: ai.flexinfer/v1alpha1
kind: ModelCache
metadata:
  name: qwen35-27b-opus-distill-gptq
  namespace: flexinfer-system
spec:
  source: "Jackrong/Qwen3.5-27B-Claude-4.6-Opus-Reasoning-Distilled"
  storageStrategy: SharedPVC
  storageSize: "160Gi"
  clusterStorageClassName: nvme-1r-gpu
  secretRef: "hf-token"
  nodeSelector:
    kubernetes.io/hostname: cblevins-radeonvii
  download:
    maxMemoryGB: 16
    hfTransfer: false
    backoffLimit: 3
  abliteration:
    skipGDNLayers: true        # Skip all 48 GDN layers — only abliterate 16 full-attention layers
    numSamples: 256
    # Qwen3.5 full-attention blocks are every 4th layer. Keep the intervention in
    # the middle of the network where refusal steering is strongest.
    targetLayers: "27,31,35"
    useGPU: true
    maxMemoryGB: 96            # 128GB node, 54GB model + GPU offload headroom
    timeoutSeconds: 14400
    nodeSelector:
      kubernetes.io/hostname: cblevins-radeonvii
    normThreshold: "100"       # Abort if refusal direction norm > 100
    ablitateLmHead: true       # Abliterate lm_head using only full-attention layer directions
  quantization:
    format: GPTQ
    bits: 4
    groupSize: 128
    sym: true
    descAct: false
    dynamicExclusion: "none"   # Quantize ALL layers (GDN safe from abliteration via skipGDNLayers)
    useGPU: true
    maxMemoryGB: 96            # 128GB node, 54GB model + GPTQ overhead
    timeoutSeconds: 28800
    nodeSelector:
      kubernetes.io/hostname: cblevins-radeonvii
    calibration:
      maxSeqLen: 2048
      maxSamples: 128
  publish:
    targets:
      - oci
    ociRef: "registry.harbor.lan/flexinfer/qwen35-27b-opus-distill:gptq-w4-g128"
    secretRef: "harbor-oci-creds"
    maxMemoryGB: 8
    timeoutSeconds: 7200

# OCI Pull Cache for Qwen3.5-9B GPTQ INT4
# Pulls quantized model from Harbor OCI registry into shared PVC.
# Model CRs source from this PVC for serving.
#
# Pipeline: ModelCache(qwen35-9b-gptq) → Publish → Harbor OCI → ModelCache(oci) → Model CR
#
# This cache depends on the publish step completing first.
# The OCI artifact is published by the qwen35-9b-gptq ModelCache.
---
apiVersion: ai.flexinfer/v1alpha1
kind: ModelCache
metadata:
  name: qwen35-9b-oci
  namespace: flexinfer-system
spec:
  source: "oci://registry.harbor.lan/flexinfer/qwen35-9b:gptq-w4-g128"
  modelPath: "qwen35-9b"
  storageStrategy: SharedPVC
  storageSize: "10Gi"
  clusterStorageClassName: local-path
  secretRef: "harbor-oci-creds"
  nodeSelector:
    kubernetes.io/hostname: cblevins-5930k
  download:
    maxMemoryGB: 4
    backoffLimit: 3
  retentionPriority: 50
  evictionPolicy: LRU
  evictionThresholdPercent: 85

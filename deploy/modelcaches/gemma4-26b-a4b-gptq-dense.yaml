# Gemma4 26B-A4B dense GPTQ rebuild on cblevins-5930k
# ("option C" / issue #53 A1-full / quantized-artifact promotion gate).
#
# Parallel to deploy/modelcaches/gemma4-26b-a4b-gptq.yaml: same source
# (google/gemma-4-26B-A4B-it), same MoE abliteration config, but pinned to the
# currently-idle cblevins-5930k node and with denseModulePolicy=validate
# enabled. The intent is to prove (or disprove) that a fully-quantized
# attention/MLP dense GPTQ artifact passes per-layer cosine ≥ 0.98 vs the FP16
# baseline. If it does:
#   - artifact size shrinks from ~17.7 GiB (MoE INT4 + FP16 attention) to
#     ~10 GiB (fully INT4), freeing VRAM budget for 32K+ context on the
#     primary serving manifest without long-context kernel fallbacks,
#   - the existing gemma4-26b-a4b-gptq ModelCache on cblevins-7900xtx stays
#     untouched and keeps serving until we explicitly swap the Model CR's
#     source path.
#
# History (2026-04-19/20):
#   - Originally pinned to cblevins-5930k (this file's original state).
#   - 5099ab17 relocated to cblevins-7900xtx after abliterate starved 5930k's
#     kubelet (control-plane conditions went Unknown; flexinfer controller
#     lost its leader lease). 7900xtx was idle at that point.
#   - Later the same day, MR !151 restored the primary serving pod on
#     cblevins-7900xtx with gpu.count=2 (both amd.com/gpu plugin slots
#     reserved to pin hipVisibleDevices onto the dGPU). That left no slot
#     on 7900xtx for a co-tenant quant job → every retry fought the primary
#     for GPU and the primary crashed on the iGPU. Moving dense back to
#     5930k is the only gfx1100 slot left.
#   - Abliteration is already complete (49m51s, started 2026-04-19T16:21Z,
#     status.abliteration.refusalDirNorm=8.26). The 5930k starvation risk
#     from 5099ab17 applied to abliterate specifically; only quantization
#     remains, and its steady-state memory footprint is lower than
#     abliterate's. maxMemoryGB tightened from 44→28 to stay within the
#     control-plane's safety margin.
#
# Why cblevins-5930k and not cblevins-7900xtx or radeonvii:
#   - 7900xtx: primary Model CR claims amd.com/gpu=2 (iGPU block), 0 slots free.
#   - radeonvii: gfx906, Gemma4 tooling not validated on that PyTorch 2.3 /
#     transformers<5 stack; also currently running gemma4-31b-gptq quantize.
#   - 5930k: gfx1100 (single dGPU, no iGPU), shared group 5930k-imagegen-textgen
#     with FluxPony/opus-distill fast-swap. Quant Job sits Pending until
#     FluxPony idle-scales; accept the tradeoff as a known scheduling window.
#
# Why not radeonvii:
#   - Currently running gemma4-31b-gptq quantization (phase=Quantizing). GPU
#     free-memory reports 36 MiB. No room for a second large quant job.
#   - 16 GB VRAM vs 5930k's 24 GB; 26B-A4B quant benefits from the extra VRAM
#     headroom under GPTQModel's per-layer flow.
#
# Output location:
#   The controller writes to a format-derived subdirectory of the source cache
#   PVC. denseModulePolicy=validate triggers the "versioned hybrid" directory
#   naming convention (e.g. gptq-w4-g128-dense-v1) — separate from the
#   attnfp16-clean / hybrid-v10 artifacts on the 7900xtx PVC so there's no
#   collision even if the two PVCs are ever merged.
#
# Budget:
#   - Download BF16 ≈ 27–30 GiB (HF → PVC). 60–90 min on local-path NFS.
#   - Abliteration ≈ 1–2 h on gfx1100 with 44 GiB CPU + disk-offload save.
#   - GPTQ quant ≈ 12–24 h (128 experts × 3 modules × 30 layers per memory
#     gemma4-moe-quant.md). CRD timeout budget is 43200 (12 h). Controller
#     DefaultActiveDeadlineSeconds is 86400 (24 h) so we can go to ~24 h total
#     if needed by raising timeoutSeconds later.
#
# Safety:
#   - ablitateLmHead remains false (streaming safetensors save corruption bug
#     for lm_head under disk-offload is still outstanding).
#   - normThreshold=100 aborts abliteration if refusal norm > 100 (matches the
#     main manifest).
#   - denseModulePolicy=validate is the gate: any layer with dense cosine
#     < denseModuleCosineThreshold is dropped from the GPTQ module set and
#     stays at source precision. A failed sweep produces an artifact that is
#     still usable but falls back to the hybrid layout.
---
apiVersion: ai.flexinfer/v1alpha1
kind: ModelCache
metadata:
  name: gemma4-26b-a4b-gptq-dense
  namespace: flexinfer-system
spec:
  source: "google/gemma-4-26B-A4B-it"
  storageStrategy: SharedPVC
  storageSize: "96Gi"
  clusterStorageClassName: nvme-1r-gpu
  secretRef: "hf-token"
  nodeSelector:
    flexinfer.ai/gpu.arch: gfx1100
    kubernetes.io/hostname: cblevins-5930k
  download:
    maxMemoryGB: 16
    hfTransfer: false
    backoffLimit: 3
  abliteration:
    numSamples: 256
    targetLayers: "auto"
    weightMatrices:
      - o_proj
    useGPU: true
    # Abliteration already completed on cblevins-7900xtx (2026-04-19 16:21Z,
    # 49m51s). This stanza is kept aligned with quantization.nodeSelector for
    # any future re-run; it will not trigger unless the abliterated artifact
    # on the PVC is invalidated. maxMemoryGB lowered from 44→28 because the
    # 5099ab17 incident (5930k kubelet starvation) showed the old ceiling
    # could push this 57 GiB node past the control-plane's cgroup safety
    # margin. Keep tighter caps on 5930k; raise only if node is quiesced.
    maxMemoryGB: 28
    timeoutSeconds: 14400
    nodeSelector:
      flexinfer.ai/gpu.arch: gfx1100
      kubernetes.io/hostname: cblevins-5930k
    normThreshold: "100"
    ablitateLmHead: false
  quantization:
    format: GPTQ
    bits: 4
    groupSize: 128
    sym: true
    descAct: false
    # The whole point of this rebuild: validate dense (attention + MLP) GPTQ
    # per-layer cosine against the FP16 baseline. Layers passing the threshold
    # get emitted as INT4; layers below it stay at source precision. Produces
    # an artifact that is safe to promote only if the full module set passes.
    denseModulePolicy: validate
    denseModuleCosineThreshold: "0.98"
    useGPU: true
    # Was 28 (tightened from 44) to keep the 5930k kubelet stable — the
    # per-layer quantize phase only needs ~18 GiB RSS + VRAM. BUT the save
    # phase loads all shards to rewrite the output and blew past the 40 GiB
    # container limit → OOMKilled at stage=saving, completed_layers=30 on
    # 2026-04-20, and the resume path doesn't handle stage=saving so the
    # whole quantize had to restart from layer 0 (~5 h of work lost). Bump
    # to 40 GiB for save-phase headroom. Container limit becomes 52 GiB
    # (40 + 12 GiB GPU driver overhead), which still leaves ~5 GiB on a 57
    # GiB node — tight but workable for a short save window on a dedicated
    # quant node.
    maxMemoryGB: 40
    timeoutSeconds: 43200
    nodeSelector:
      flexinfer.ai/gpu.arch: gfx1100
      kubernetes.io/hostname: cblevins-5930k
    calibration:
      maxSeqLen: 2048
      maxSamples: 512
  retentionPriority: 40
  evictionPolicy: LRU
  evictionThresholdPercent: 85

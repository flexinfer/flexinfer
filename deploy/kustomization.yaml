apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: flexinfer-system
resources:
  - models/
  - modelcaches/
  - loras/
  - gpuprofiles/
  - gpugroups.yaml
  # Gaming sessions are NOT GitOps-authored: `flexinfer game start` creates
  # the ephemeral, TTL-bound GamingSession directly, gated by the gaming
  # policy in system/values-k3s.yaml (docs/user/gaming-mode-runbook.md).
  # Only the node's gaming capability and that policy live in git.
  # Bounded, one-shot long-context qualification. The experiment deletes its
  # candidate after the retained 96K/128K recall gauntlet reaches a verdict.
  - experiments/
  # One-shot, Flux-managed artifact-transform tasks. Each subdirectory
  # is idempotent so Flux re-reconciles are no-ops once complete.
  # tasks/gemma4-31b-keqv/: REMOVED 2026-08-22 — the 2026-08-19 31B retirement
  # (modelcaches) cascaded away the gemma4-31b-gptq PVC this Job mounts, so
  # Flux kept recreating a Job whose pod sat Pending forever on a missing
  # claim (47h+, 569 FailedScheduling events). Directory kept on disk as the
  # recipe alongside the retired modelcache manifest.
  # Idle-time batch appliance (Sprint 2 / S2.2): nightly codebase re-embed
  # through the gfx906 bge HBM2 retrieval plane -> Qdrant codebase_memory_bge_v1.
  - tasks/codebase-reembed/
  # Offline model-eval gauntlet (Sprint 2 / S2.3): weekly flexinfer-bench runs
  # -> Postgres benchmarks table (#34) + per-model ConfigMaps (#27).
  - tasks/model-eval-gauntlet/
  # Opportunistic one-shot evaluation: reuse the gauntlet template only after
  # the warm 5930k model has been foreground-idle for a bounded window.
  - tasks/model-backfill/

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: flexinfer-system
resources:
  - models/
  - modelcaches/
  - gpuprofiles/
  - gpugroups.yaml
  # Declarative node gaming mode (Sunshine/Moonlight). Deleting the GamingSession
  # reverts the node to inference (controller finalizer).
  - gaming/
  # One-shot, Flux-managed artifact-transform tasks. Each subdirectory
  # is idempotent so Flux re-reconciles are no-ops once complete.
  - tasks/gemma4-31b-keqv/
  # Idle-time batch appliance (Sprint 2 / S2.2): nightly codebase re-embed
  # through the gfx906 bge HBM2 retrieval plane -> Qdrant codebase_memory_bge_v1.
  - tasks/codebase-reembed/
  # Offline model-eval gauntlet (Sprint 2 / S2.3): weekly flexinfer-bench runs
  # -> Postgres benchmarks table (#34) + per-model ConfigMaps (#27).
  - tasks/model-eval-gauntlet/
  # Opportunistic one-shot evaluation: reuse the gauntlet template only after
  # the warm 5930k model has been foreground-idle for a bounded window.
  - tasks/model-backfill/

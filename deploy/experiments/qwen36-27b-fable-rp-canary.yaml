# Fable 27B replacement canary for the warm qwen35-9b-ablit-rp lane.
#
# Generation 1 passed the exact qualified 8K eager/FP16-KV sentinel on the same
# physical 7900 XTX used by the 9B lane. Generation 2 passed the matched 32K
# eager/FP16-KV control with exact 19,841-token recall. Generation 3's combined
# bounded-graph/FP8-KV arm improved short decode but failed the multi-turn and
# long-context no-regression gates. Generation 4 proved bounded graphs with
# FP16 KV are faster, but a cold compile left too little KV headroom and forced
# one restart before the cached compile loaded cleanly. Generation 5 raises the
# dedicated engine budget and uses a fresh compile-cache path to certify a
# clean cold start. Generation 6 keeps that winner and adds two-session
# scheduling, partial-prefill guards, and graph shape two. The
# ModelExperiment controller removes every candidate at verdict, after which
# the existing 9B parent Model resumes its warm-primary shared-group lease.
apiVersion: ai.flexinfer/v1alpha2
kind: ModelExperiment
metadata:
  name: qwen36-27b-fable-rp-canary
  namespace: flexinfer-system
  annotations:
    flexinfer.ai/canary: qwen36-fable-rp-replacement
    flexinfer.ai/artifact-digest: sha256:285a044529f6321f954353c93c5a91f771cfdfc7445ad25af5d64b7926d83710
    flexinfer.ai/runtime-digest: sha256:2e9652edee30ed078843935ce5672280efd3585de0527d27703dd6880592981d
    flexinfer.ai/kill-test: .loom/brainstorm-fable-rp-lane-optimization-2026-07-21.md#riskiest-assumption--kill-test
spec:
  timeout: 45m
  artifactGate:
    modelCacheRef: qwen36-27b-fable-oci-7900xtx
    requireSourceMatch: true
  candidate:
    backend: vllm
    image: registry.harbor.lan/flexinfer/runtime@sha256:2e9652edee30ed078843935ce5672280efd3585de0527d27703dd6880592981d
    source: pvc://qwen36-27b-fable-oci-7900xtx/qwen36-27b-fable
    cache:
      strategy: None
      compilationCache:
        enabled: true
        # A fresh namespace makes generation 5 exercise the cold compile path;
        # reusing the prior cache would hide the startup-memory regression.
        hostPath: /var/lib/flexinfer/compile-cache-fable-cold-v1
        sizeLimit: 4Gi
    gpu:
      vendor: amd
      # This node exposes its Raphael iGPU alongside the discrete card. Match
      # the previously certified graph probes: claim both plugin resources and
      # select the discrete gfx1100 as HIP ordinal zero.
      count: 2
      shared: 7900xtx-textgen
      priority: 650
      forcePromotion: true
      vramEstimateMB: 22000
    serverless:
      enabled: true
      minReplicas: 1
      idleTimeout: 30m
      coldStartTimeout: 20m
    config:
      dedicatedDeployment: true
      quantization: gptq
      dtype: half
      languageModelOnly: true
      hfOverrides: '{"architectures":["Qwen3_5ForCausalLM"],"rope_parameters":{"rope_type":"default","rope_theta":10000000,"partial_rotary_factor":0.25}}'
      maxModelLen: 32768
      maxInputTokens: 28672
      maxOutputTokens: 2048
      maxNumSeqs: 2
      maxNumBatchedTokens: 4096
      enableChunkedPrefill: true
      maxNumPartialPrefills: 2
      maxLongPartialPrefills: 1
      longPrefillTokenThreshold: 4096
      # Cold graph compilation left only 1.52 GiB for KV at 0.90 while 32K
      # FP16 KV needs 2.08 GiB. 0.94 adds about 0.96 GiB of bounded headroom;
      # this dedicated pod has exclusive use of the discrete card.
      gpuMemoryUtilization: "0.94"
      kvCacheDtype: auto
      calculateKvScales: false
      enforceEager: false
      # Generation 6 exercises one and two simultaneous decode streams only.
      cudagraphCaptureSizes: "1,2"
      maxCudagraphCaptureSize: 2
      gdnPrefillBackend: triton
      cudagraphMetrics: true
      kvCacheMetrics: true
      kvCacheMetricsSample: "1.0"
      enablePrefixCaching: false
      disableAiter: true
      rocmCustomPagedAttn: false
      hipVisibleDevices: "0"
      trustRemoteCode: true
      enableToolCalling: true
      toolCallParser: qwen3_coder
      servedModelName: qwen36-27b-fable-rp-canary
      disableLogStats: false
      failOnEnvironValidation: false
      warmPolicy: primary
    nodeSelector:
      kubernetes.io/hostname: cblevins-7900xtx
    resources:
      requests:
        cpu: "4"
        memory: 16Gi
      limits:
        cpu: "8"
        memory: 40Gi
    tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
        operator: Exists
  gauntlet:
    templateRef: fable-rp-performance-gauntlet
    env:
      FLEXINFER_EXPERIMENT_REVISION: "32k-graph-fp16kv-two-session-v1"
      EXPERIMENT_PHASE: "32k_graph_fp16kv_two_session"
      ITERS: "3"
      RP_OUTPUT_TOKENS: "192"
      LONG_CONTEXT_TOKENS: "18000"
      MIN_MEDIAN_TPS: "7.5"
      MAX_P95_TTFT: "30"
      CONCURRENT_STREAMS: "2"
      MIN_CONCURRENT_AGGREGATE_TPS: "15"
      MAX_CONCURRENT_P95_ELAPSED: "25"

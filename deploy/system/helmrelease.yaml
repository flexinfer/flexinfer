apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flexinfer
  namespace: flexinfer-system
spec:
  interval: 10m
  timeout: 15m
  releaseName: flexinfer
  chart:
    spec:
      chart: charts/flexinfer
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flexinfer
        namespace: flux-system
      valuesFiles:
        - deploy/system/values-k3s.yaml
  install:
    disableWait: true
    createNamespace: true
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    disableWait: true
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      retries: 3
  rollback:
    disableWait: true

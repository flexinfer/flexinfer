# Kokoro-82M text-to-speech sibling Deployment (voice-stack conversational-loop
# Slice 2). NOT a Model CR — a pre-built OpenAI-compatible FastAPI service
# (remsky/Kokoro-FastAPI) routed by the proxy's static /v1/audio/speech path.
#
# CPU-ONLY by design. The 2026-06-02 kill-test
# (.loom/tts-killtest-plan-2026-06-02.md) measured RTF 0.116 (~8.6x faster than
# real-time) on CPU, so TTS needs no GPU at all — sidestepping both the gfx906
# community-fork fragility and the gfx1100 26B-textgen contention that the
# brainstorm worried about. Models are baked into the image; no HF token, no
# gated download, no persistent cache required.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kokoro-tts
  namespace: flexinfer-system
  labels:
    app: kokoro-tts
    app.kubernetes.io/part-of: flexinfer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kokoro-tts
  template:
    metadata:
      labels:
        app: kokoro-tts
    spec:
      # amd64 only (the published image is linux/amd64).
      nodeSelector:
        kubernetes.io/arch: amd64
      # Kokoro is CPU-bound (torch 2.8.0+cpu, 82M StyleTTS2). Warm RTF is
      # per-core-clock-bound: on the weak k3s-w-10 VM it was ~1.07 (slower than
      # real-time) and the gtx980ti host has an even worse Ivy Bridge CPU
      # (no AVX2/FMA), while the kill-test hit RTF 0.116 on the cblevins-7900xtx
      # host CPU. So the REQUIRED term below is an allow-list of strong hosts,
      # not a soft preference alone: a soft preference lost to the scheduler's
      # resource-balancing score and drifted to the emptier but slower gtx980ti
      # (both GPU nodes share the dedicated=gpu taint our toleration opens).
      #
      # 2026-10-22: the original single-host pin assumed TTS shared fate with
      # gemma4-26b on this node. That lane is retired and the rest of the voice
      # stack (orpheus, pyannote) runs on the Radeon VII, so when
      # cblevins-7900xtx went NotReady the replacement sat Pending for 12h and
      # /v1/audio/speech was down cluster-wide for no reason. cblevins-5930k is
      # the 7900xtx's gfx1100 twin (28 threads, already the fleet's stable CPU
      # host for the gte-qwen2 CPU lane) and is the only fallback; the 7900xtx
      # stays preferred (weight 100) so steady-state placement is unchanged.
      # Kokoro RTF on the 5930k is not yet kill-tested — re-run
      # .loom/tts-killtest-plan-2026-06-02.md there if it ever becomes the
      # steady-state host. GPU serving is GPU-bound (~16/24 cores
      # requested), so a 2-core request / 8-core cap does not starve it on
      # either host; the conversational loop is sequential (LLM finishes, then
      # TTS) so the two barely overlap anyway.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - cblevins-7900xtx
                      - cblevins-5930k
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - cblevins-7900xtx
      # Tolerate the 7900xtx's dedicated=gpu taint so the preferred host can
      # land. The 5930k only carries a PreferNoSchedule gpu-shared taint, which
      # never blocks scheduling. This is the only taint we accept.
      tolerations:
        - key: dedicated
          operator: Equal
          value: gpu
          effect: NoSchedule
      imagePullSecrets:
        - name: harbor-creds
      containers:
        - name: kokoro
          # Digest-pinned mirror of ghcr.io/remsky/kokoro-fastapi-cpu:v0.4.0-amd64
          # (tag is mutable; pin the kill-tested build). Re-mirror + repin on bump.
          image: registry.harbor.lan/flexinfer/kokoro-fastapi-cpu@sha256:11f49aafe8a0b7ad57347a7a528f64e5078911fad715087d2e2d37c505f7afb3
          imagePullPolicy: IfNotPresent
          env:
            # torch CPU intra-op threads. torch auto-detects the cgroup quota
            # (it read 4 on k3s-w-10), but we pin it to the CPU limit so the
            # 82M model parallelizes across the cores we reserve without
            # oversubscribing the 24-core 7900xtx host and contending with GPU
            # serving. Keep this in lock-step with resources.limits.cpu below.
            - name: OMP_NUM_THREADS
              value: "8"
          ports:
            - name: http
              containerPort: 8880
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 4
          resources:
            requests:
              # Reserve 2 cores so the scheduler guarantees steady cycles; the
              # 7900xtx has 24 cores at ~1% baseline so this is comfortable.
              cpu: "2"
              memory: 2Gi
            limits:
              # Burst to 8 cores for long-form synthesis (was 4). Leaves 16
              # cores on the 7900xtx for GPU serving + system daemons.
              # Keep in lock-step with OMP_NUM_THREADS above.
              cpu: "8"
              memory: 6Gi

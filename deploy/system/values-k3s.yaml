    - name: gfx906
      # Humanizer qualification: unified gfx906 runtime with llama.cpp b11335.
      # The entrypoint unsets HSA_OVERRIDE_GFX_VERSION so HIP sees Vega20.
      # Rollback: 171081dee2b593153b1e2b999f77d080f5a86e42144c3b20b4153a7b3b73910b.
      image: "registry.harbor.lan/flexinfer/runtime@sha256:8181b6901ab0ed1244a9035d88677c2c729094b847f60d63368faca147a21585"
      gpuVendor: amd
      gpuArch: gfx906
      gpuCount: 1
      shmSize: "8Gi"
      # 2026-09-13 disk-pressure guard: see the gfx1100 profile comment. This
      # pod is the whole retrieval plane (bge-large, bge-reranker, gte-qwen2)
      # plus the only voice tier, on a 127G root that CI job pods also use
      # (34 job pods peaked here today; 25 GB of ephemeral at one point).
      priorityClassName: flexinfer-serving-critical
      resources:
        limits:
          memory: "24Gi"
        requests:
          memory: "4Gi"
          ephemeral-storage: "2Gi"
      env:
        # R5 (hardware-utilization arc): the gfx906 runtime holds a VRAM-bounded
        # set of concurrent model subprocesses (per-model ports) instead of a
        # single active model, so the bge embeddings lane and the bge-reranker
        # lane stay GPU-resident together. Pairs with features.multiModel:true on
        # the gfx906 GPUProfile (the controller's multi-Active election). Default
        # off everywhere else — additive, single-slot behavior is unchanged.
        - name: FLEXINFER_RUNTIME_MULTI_MODEL
          value: "true"
        # Accepted streams finish before a subprocess releases the GPU.
        - name: FLEXINFER_RUNTIME_REQUEST_DRAIN
          value: "true"
      nodeSelector:
        kubernetes.io/hostname: cblevins-radeonvii
        # 2026-05-07: pause lifted after Track B-3 cycle 2 slim image
        # (sha256:94045d0c, 36.9 GB extracted vs 59.2 GB before) plus moving

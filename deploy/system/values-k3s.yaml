# FlexInfer Helm values override for K3s cluster
# Uses Harbor registry instead of ghcr.io defaults

serviceAccount:
  create: true
  annotations: {}
  name: ""

serviceAccounts:
  controller:
    create: true
    imagePullSecrets:
      - name: harbor-creds
  agent:
    create: true
    imagePullSecrets:
      - name: harbor-creds
  scheduler:
    create: true
    imagePullSecrets:
      - name: harbor-creds
  proxy:
    create: true
    imagePullSecrets:
      - name: harbor-creds
  benchmarker:
    create: true
    imagePullSecrets:
      - name: harbor-creds

controller:
  enabled: true
  replicas: 1
  image:
    repository: registry.harbor.lan/flexinfer/flexinfer-controller
    # Use the mutable master tag for homelab continuous deployment; publish
    # refreshes this tag on every merged master pipeline, and imagePullPolicy
    # resolves to Always when digest is empty.
    digest: ""
    tag: "master"
  resources:
    limits:
      cpu: 1000m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  # Keep the controller on any healthy amd64 control-plane node. Host pinning
  # makes rollouts fragile when a single node is down or rebooting.
  nodeSelector:
    kubernetes.io/arch: amd64
    node-role.kubernetes.io/control-plane: "true"
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
    - key: dedicated
      operator: Equal
      value: gpu
      effect: NoSchedule
  runtime:
    imagePullSecrets:
      - harbor-creds

agent:
  enabled: true
  image:
    repository: registry.harbor.lan/flexinfer/flexinfer-agent
    tag: "master"
  resources:
    limits:
      cpu: 1000m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  # Tolerate GPU node taints so agents can label GPU nodes
  tolerations:
    - key: "dedicated"
      operator: "Equal"
      value: "gpu"
      effect: "NoSchedule"
  # Only run on amd64 nodes (no ARM64 images available)
  nodeSelector:
    kubernetes.io/arch: amd64
    flexinfer.ai/gpu-present: "true"

proxy:
  enabled: true
  replicaCount: 1
  image:
    repository: registry.harbor.lan/flexinfer/flexinfer-proxy
    tag: "master"
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 80
  # Explicit in the cluster values file because Flux HelmChart valuesFiles are
  # packaged as chart defaults; relying only on charts/flexinfer/values.yaml
  # left FLEXINFER_CODEBASE_ANSWER_UPSTREAM absent from the live proxy.
  codebaseAnswerUpstream: "http://codebase-answer.flexinfer-system.svc:8000"
  # Static upstream for the /diarize route → pyannote diarization sibling
  # Deployment on gfx906 (deploy/system/pyannote-diarization/). Gives ICC one
  # base URL for ASR + diarization. Empty disables the route (503).
  pyannoteUpstream: "http://pyannote-diarization.flexinfer-system.svc:8000"
  # Static upstream for the /v1/audio/speech route → Kokoro TTS sibling
  # Deployment (deploy/system/kokoro-tts/, CPU-only). Completes the voice stack
  # (ASR + diarization + TTS) under one base URL. Empty disables the route (503).
  kokoroUpstream: "http://kokoro-tts.flexinfer-system.svc:8880"
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi
  # Large models (18GB+ GGUF via Longhorn mmap) need 15-20min to load.
  # Set proxy timeouts above worst-case load time.
  timeouts:
    queue: "25m"
    coldStart: "25m"
  # Rollout draining (issue #65). SIGTERM flips /readyz to 503 (pod leaves
  # Service endpoints), waits drainDelay for propagation, then drains in-flight
  # requests up to timeout before closing the listener.
  # terminationGracePeriodSeconds must exceed timeout + drainDelay so the
  # kubelet does not SIGKILL the proxy mid-drain.
  gracefulShutdown:
    timeout: "10m"
    drainDelay: "5s"
    terminationGracePeriodSeconds: 640
  # Both 128K workhorse members are maxNumSeqs=1. Enable only after image
  # automation pins a proxy binary that supports least-loaded routing
  # (first verified tag: 20260714-234146).
  routing:
    labelGroupMode: "least-loaded"
  # Keep the proxy on any healthy amd64 control-plane node. Host pinning makes
  # control-plane service recovery depend on a single machine.
  nodeSelector:
    kubernetes.io/arch: amd64
    node-role.kubernetes.io/control-plane: "true"
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
    - key: dedicated
      operator: Equal
      value: gpu
      effect: NoSchedule
  # Enable context-bounded admission for Models that opt in via the
  # `flexinfer.ai/admission: context-bounded` annotation. Currently only
  # `qwen3-8b-radeonvii` (the gfx906 tertiary fast-chat-fallback lane) is
  # opted in; other Models see no behavior change. See
  # docs/planning/context-bounded-admission-spec.md.
  admission:
    enabled: true
    safetyMarginPercent: 5
    defaultMaxTokens: 256

tenancy:
  enabled: false

# Backend images are now auto-detected by the controller based on GPU vendor:
# - AMD (amd.com/gpu): ollama/ollama:rocm
# - NVIDIA (nvidia.com/gpu): ollama/ollama:latest
# - Intel (intel.com/gpu): ollama/ollama:latest
# To override, set DEFAULT_BACKEND_IMAGE_{AMD,NVIDIA,INTEL} env vars

# Ollama backend images
# Custom Maxwell image built with CUDA 11.8 + sm_52 (pre-built binaries lack sm_52)
ollama:
  maxwellImage: registry.harbor.lan/flexinfer/ollama:cuda-maxwell

scheduler:
  enabled: true
  replicas: 1
  port: 8082
  image:
    repository: registry.harbor.lan/flexinfer/flexinfer-scheduler
    tag: "master"
    pullPolicy: IfNotPresent
  # kube-scheduler sidecar uses upstream k8s image (keep as-is)
  kubeScheduler:
    image:
      repository: registry.k8s.io/kube-scheduler
      tag: "v1.28.0"
  kubeconfigInit:
    image:
      repository: busybox
      tag: "1.37"
      pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  # Pin the scheduler to a healthy control-plane GPU node with the image cached.
  nodeSelector:
    kubernetes.io/arch: amd64
    kubernetes.io/hostname: cblevins-7900xtx
    node-role.kubernetes.io/control-plane: "true"
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
    - key: dedicated
      operator: Equal
      value: gpu
      effect: NoSchedule
  weights:
    tps: 0.7
    util: 0.2
    cost: 0.1
    cache: 0.3
    vramFree: 10.0
  tenantFairShare:
    enabled: false
    weight: 5.0
    gpuBudget: 1.0
    tenantLabelKey: ""

benchmarker:
  enabled: true
  image:
    repository: registry.harbor.lan/flexinfer/flexinfer-bench
    tag: "master"
  postgresDsn: "postgres://langgraph:changeme-app@langgraph-postgres-postgresql.ai.svc:5432/flexinfer_benchmarks?sslmode=disable"

mlcllm:
  rocmImage: registry.harbor.lan/library/mlc-llm:rocm64-llvm19
  defaults:
    jitPolicy: "READONLY"

llamacpp:
  rocmImage: registry.harbor.lan/flexinfer/llamacpp:rocm6.4.4-gfx1100-b8173-v2
  gfx1100Image: registry.harbor.lan/flexinfer/llamacpp:rocm6.4.4-gfx1100-b8173-v2
  gfx906Image: registry.harbor.lan/library/llamacpp:rocm-gfx906-patched-v3

vllm:
  rocmImage: registry.harbor.lan/library/vllm-api:rocm-navi-fp8e5-v2
  gfx1100Image: registry.harbor.lan/flexinfer/vllm@sha256:a9b306af9122e39d2554d090fcc63e6f4317c4a69c5e0bf1055027f0f11345ba
  gfx906Image: registry.harbor.lan/flexinfer/vllm:rocm-gfx906@sha256:2139c92b3ca00716216f9e5644e9fbd29b2bba7237dc0459017c86012ece51c3

diffusers:
  rocmImage: registry.harbor.lan/library/diffusers-api:rocm-0cbf9b7
  gfx1100Image: registry.harbor.lan/flexinfer/diffusers:rocm-gfx1100-66af64f
  cudaImage: registry.harbor.lan/library/diffusers-api@sha256:a2f768a4205870422929fbba0da2dc5cb195033ccb16275fb63d888ce271cd40

imagePrewarm:
  enabled: true
  imagePullPolicy: IfNotPresent
  profiles:
    - name: 5930k-gfx1100-serving
      nodeSelector:
        kubernetes.io/hostname: cblevins-5930k
      images:
        - registry.harbor.lan/flexinfer/vllm@sha256:a9b306af9122e39d2554d090fcc63e6f4317c4a69c5e0bf1055027f0f11345ba
        # Keep the 64K Qwen workhorse overlay referenced across containerd GC;
        # its first cold pull/unpack took 9m05s on this node.
        - registry.harbor.lan/flexinfer/vllm@sha256:7bc680b43ab91e60ea120d65e5af5d0d70300602ac881790ca5cbcfebad90604
        - registry.harbor.lan/flexinfer/diffusers:rocm-gfx1100-66af64f
    - name: 7900xtx-gfx1100-serving
      nodeSelector:
        kubernetes.io/hostname: cblevins-7900xtx
      images:
        - registry.harbor.lan/flexinfer/vllm@sha256:a9b306af9122e39d2554d090fcc63e6f4317c4a69c5e0bf1055027f0f11345ba
        # Exact Qwen3.5 text-MoE overlay used by the 128K qualification and
        # subsequent second workhorse replica. Keep it resident across GC.
        - registry.harbor.lan/flexinfer/vllm@sha256:7bc680b43ab91e60ea120d65e5af5d0d70300602ac881790ca5cbcfebad90604
        - registry.harbor.lan/flexinfer/diffusers:rocm-gfx1100-66af64f
quantization:
  # Phase-0 rollback anchor for the Python 3.14 candidate. Keep production on
  # this resolved Python 3.11 image until a commit-tagged candidate passes its
  # job canary; never use the mutable master tag as the rollback target.
  modelToolsImage: "registry.harbor.lan/flexinfer/model-tools@sha256:fe048a433779b7c1f6f8e9cfa4373117e846f071440eaf8575762a640125bf5a"
  # Explicitly overwrite a legacy live Deployment field that pointed publish
  # validation at a stale ROCm runtime. Model tools is the canonical CPU-only
  # image and carries the validator from the same FlexInfer revision.
  validatorImage: "registry.harbor.lan/flexinfer/model-tools@sha256:d1515f57e5e92ad62a8f3820eb428fc32436cf979fa130817fbe3f038edd14d1"
  useRuntimeForQuantize: false
  runtimeImage: "registry.harbor.lan/flexinfer/runtime@sha256:6ee8b3ed6bd0f80ba669f9a5a8525c9323592d1aa84fdf64b2a48f061fa4220e"
  gptqDeviceMap: "auto"
  gptqModelPolicies:
    # Exact-source Fable Fusion candidate gets a larger calibration corpus than
    # the generic Qwen3.6 recovery path. Keep before qwen3.6-text: policy
    # selection is first-match and modelPath=qwen36-27b-fable matches both.
    - name: qwen3.6-fable-text
      match_path_substrings:
        - qwen36-27b-fable
      extract_text_config: true
      copy_root_keys:
        - bos_token_id
        - eos_token_id
        - pad_token_id
      remap_model_type: qwen3_5_text
      architectures:
        - Qwen3_5ForCausalLM
      loader: gptqmodel
      python_packages:
        - git+https://github.com/huggingface/transformers.git@529504b2fa98970c6c44d3fafaeb07a39c40e7ea
      quantize_config_overrides:
        offload_to_disk: true
      calibration_overrides:
        max_samples: 128
        max_seq_len: 1024
        max_tokens: 131072
      runtime_overrides:
        attn_implementation: eager
        disable_qwen35_fla: true
        fix_mistral_regex: true
    - name: qwen3.5-moe-text
      match_model_types:
        - qwen3_5_moe_text
        - qwen3_5_moe
      extract_text_config: true
      copy_root_keys:
        - bos_token_id
        - eos_token_id
        - pad_token_id
      # Preserve the Transformers text config so MoE router/GDN defaults are
      # populated; the quantizer registers this alias to GPTQModel's MoE class.
      remap_model_type: qwen3_5_moe_text
      architectures:
        - Qwen3_5MoeForCausalLM
      loader: gptqmodel
      python_packages:
        - git+https://github.com/huggingface/transformers.git@529504b2fa98970c6c44d3fafaeb07a39c40e7ea
      quantize_config_overrides:
        offload_to_disk: true
      calibration_overrides:
        max_samples: 16
        max_seq_len: 512
        max_tokens: 8192
      runtime_overrides:
        attn_implementation: eager
        disable_qwen35_fla: true
        fix_mistral_regex: true
    - name: qwen3.6-text
      match_path_substrings:
        - qwen36
        - qwen3.6
      extract_text_config: true
      copy_root_keys:
        - bos_token_id
        - eos_token_id
        - pad_token_id
      remap_model_type: qwen3_5_text
      architectures:
        - Qwen3_5ForCausalLM
      loader: gptqmodel
      python_packages:
        - git+https://github.com/huggingface/transformers.git@529504b2fa98970c6c44d3fafaeb07a39c40e7ea
      quantize_config_overrides:
        offload_to_disk: true
      calibration_overrides:
        max_samples: 16
        max_seq_len: 512
        max_tokens: 8192
      runtime_overrides:
        attn_implementation: eager
        disable_qwen35_fla: true
        fix_mistral_regex: true
    - name: qwen3.5-text
      match_model_types:
        - qwen3_5_text
      match_path_substrings:
        - qwen35
        - qwen3.5
        - qwen36
        - qwen3.6
      extract_text_config: true
      copy_root_keys:
        - bos_token_id
        - eos_token_id
        - pad_token_id
      remap_model_type: qwen3_5_text
      architectures:
        - Qwen3_5ForCausalLM
      # 2026-05-09: switched manual_sharded_state_dict -> gptqmodel.
      # Stock GPTQModel.load(offload_to_disk=true) sets turtle_model=LazyTurtle
      # which routes shell_module_materialize through undo_offload_to_disk
      # so disk-offloaded layers materialize on demand instead of crashing.
      # Architectures pin above prevents the multimodal loader regression
      # that originally motivated the manual_sharded_state_dict workaround.
      # See pkg/quantization/gptq.go default policies block + MR !300.
      loader: gptqmodel
      python_packages:
        - git+https://github.com/huggingface/transformers.git@529504b2fa98970c6c44d3fafaeb07a39c40e7ea
      quantize_config_overrides:
        offload_to_disk: true
      calibration_overrides:
        max_samples: 16
        max_seq_len: 512
        max_tokens: 8192
      runtime_overrides:
        attn_implementation: eager
        disable_qwen35_fla: true
        fix_mistral_regex: true
    - name: gemma4-text
      match_model_types: [gemma4_text]
      match_path_substrings: [gemma4, gemma-4]
      extract_text_config: true
      copy_root_keys: [bos_token_id, eos_token_id, pad_token_id]
      remap_model_type: gemma4_text
      architectures: [Gemma4ForCausalLM]
      loader: gptqmodel
      python_packages:
        - git+https://github.com/huggingface/transformers.git
      quantize_config_overrides:
        offload_to_disk: false
      calibration_overrides:
        max_samples: 64
        max_seq_len: 2048
        max_tokens: 262144
      runtime_overrides:
        attn_implementation: eager
  images:
    awq: registry.harbor.lan/flexinfer/quantizer:awq-rocm-gfx1100
    gptqRocm: registry.harbor.lan/flexinfer/quantizer:gptq-rocm-gfx1100

runtime:
  enabled: true
  imagePullPolicy: IfNotPresent
  modelHostPath: "/var/lib/flexinfer/models"
  terminationGracePeriodSeconds: 60
  profiles:
    # cblevins-7900xtx returned to inference on 2026-07-14. Its persistent
    # Sunshine/Steam data remains under /home/flexinfer-gaming for the next
    # explicit gaming lease, but the runtime no longer exposes or starts it.
    - name: gfx1100
      image: "registry.harbor.lan/flexinfer/runtime@sha256:6ee8b3ed6bd0f80ba669f9a5a8525c9323592d1aa84fdf64b2a48f061fa4220e"
      gpuVendor: amd
      gpuArch: gfx1100
      gpuCount: 2
      shmSize: "8Gi"
      memoryLimit: "48Gi"
      memoryRequest: "8Gi"
      nodeSelector:
        kubernetes.io/hostname: cblevins-7900xtx
      env:
        - name: HIP_VISIBLE_DEVICES
          value: "0"
        - name: ROCR_VISIBLE_DEVICES
          value: "0"
        - name: MIOPEN_CUSTOM_CACHE_DIR
          value: "/var/lib/flexinfer/compile-cache/runtime/miopen"
        - name: MIOPEN_USER_DB_PATH
          value: "/var/lib/flexinfer/compile-cache/runtime/miopen/user.db"
        - name: VLLM_CACHE_ROOT
          value: "/var/lib/flexinfer/compile-cache/runtime/vllm"
        - name: XDG_CACHE_HOME
          value: "/var/lib/flexinfer/compile-cache/runtime/xdg"
        - name: TORCHINDUCTOR_CACHE_DIR
          value: "/var/lib/flexinfer/compile-cache/runtime/inductor"
        - name: TRITON_CACHE_DIR
          value: "/var/lib/flexinfer/compile-cache/runtime/triton"
        - name: TORCH_HOME
          value: "/var/lib/flexinfer/compile-cache/runtime/torch"
        - name: PYTORCH_ALLOC_CONF
          value: "garbage_collection_threshold:0.7,max_split_size_mb:256,expandable_segments:True"
        - name: VLLM_ALLOW_CHUNKED_LOCAL_ATTN_WITH_HYBRID_KV_CACHE
          value: "1"
    - name: gfx1100-5930k
      image: "registry.harbor.lan/flexinfer/runtime@sha256:6ee8b3ed6bd0f80ba669f9a5a8525c9323592d1aa84fdf64b2a48f061fa4220e"
      gpuVendor: amd
      gpuArch: gfx1100
      gpuCount: 1
      shmSize: "8Gi"
      memoryLimit: "48Gi"
      memoryRequest: "8Gi"
      nodeSelector:
        kubernetes.io/hostname: cblevins-5930k
      env:
        - name: MIOPEN_CUSTOM_CACHE_DIR
          value: "/var/lib/flexinfer/compile-cache/runtime/miopen"
        - name: MIOPEN_USER_DB_PATH
          value: "/var/lib/flexinfer/compile-cache/runtime/miopen/user.db"
        - name: VLLM_CACHE_ROOT
          value: "/var/lib/flexinfer/compile-cache/runtime/vllm"
        - name: XDG_CACHE_HOME
          value: "/var/lib/flexinfer/compile-cache/runtime/xdg"
        - name: TORCHINDUCTOR_CACHE_DIR
          value: "/var/lib/flexinfer/compile-cache/runtime/inductor"
        - name: TRITON_CACHE_DIR
          value: "/var/lib/flexinfer/compile-cache/runtime/triton"
        - name: TORCH_HOME
          value: "/var/lib/flexinfer/compile-cache/runtime/torch"
        - name: PYTORCH_ALLOC_CONF
          value: "garbage_collection_threshold:0.7,max_split_size_mb:256,expandable_segments:True"
        - name: VLLM_ALLOW_CHUNKED_LOCAL_ATTN_WITH_HYBRID_KV_CACHE
          value: "1"
    - name: gfx906
      image: "registry.harbor.lan/flexinfer/runtime@sha256:89e8d0dc6757ffc318202e98c75372ba32567eb4487fdf585e5648f66acabd8e"
      gpuVendor: amd
      gpuArch: gfx906
      gpuCount: 1
      shmSize: "8Gi"
      memoryLimit: "24Gi"
      memoryRequest: "4Gi"
      env:
        # R5 (hardware-utilization arc): the gfx906 runtime holds a VRAM-bounded
        # set of concurrent model subprocesses (per-model ports) instead of a
        # single active model, so the bge embeddings lane and the bge-reranker
        # lane stay GPU-resident together. Pairs with features.multiModel:true on
        # the gfx906 GPUProfile (the controller's multi-Active election). Default
        # off everywhere else — additive, single-slot behavior is unchanged.
        - name: FLEXINFER_RUNTIME_MULTI_MODEL
          value: "true"
      nodeSelector:
        kubernetes.io/hostname: cblevins-radeonvii
        # 2026-05-07: pause lifted after Track B-3 cycle 2 slim image
        # (sha256:94045d0c, 36.9 GB extracted vs 59.2 GB before) plus moving
        # /var/lib/flexinfer/models to /mnt/nvme/longhorn/flexinfer/models via
        # bind-mount on the Radeon VII node. Pre-pull verified root holds at
        # 65% (78G/127G used) post-pull. Re-pause via this annotation if the
        # runtime image grows back into root-pressure territory.

grafanaDashboard:
  enabled: true
  runtimeEnabled: false

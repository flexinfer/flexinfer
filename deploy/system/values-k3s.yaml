# FlexInfer Helm values override for K3s cluster
# Uses Harbor registry instead of ghcr.io defaults

serviceAccount:
  create: true
  annotations: {}
  name: ""

serviceAccounts:
  controller:
    create: true
    imagePullSecrets:
      - name: harbor-creds
  agent:
    create: true
    imagePullSecrets:
      - name: harbor-creds
  scheduler:
    create: true
    imagePullSecrets:
      - name: harbor-creds
  proxy:
    create: true
    imagePullSecrets:
      - name: harbor-creds
  benchmarker:
    create: true
    imagePullSecrets:
      - name: harbor-creds

controller:
  enabled: true
  replicas: 1
  image:
    repository: registry.harbor.lan/flexinfer/flexinfer-controller
    # Keep controller/runtime drain contracts on the same tested revision.
    # 2026-10-30: master 3cb6cde0 (master pipeline 36196) = the badcb8c3 build
    # below plus round 2 of the unified-runtime work. !1199: runtime-path
    # eligibility refuses lanes with a spec.config.command wrapper
    # (RuntimeEligible=False/LaunchOverride), the controller and the proxy build
    # one load payload (NewModelLoadPayload, LoRA + generation + specHash), a
    # verified cache stays ready while its check Job re-runs (no Idle->Pending
    # flap after the 6-hourly Job cleanup), and a per-group lock around the
    # Service label sync (the --model-max-concurrent-reconciles flag exists but
    # stays at 1 here). !1198: shared-group election and Schedulable check
    # against the GPUProfile HWS queue budget (gfx906 24/2). !1200: opt-in
    # image-scoped compile cache (no lane opts in). The live-lane golden test
    # pins the dedicated pod templates, so no lane restart is expected. Rollback
    # = the badcb8c3 build: tag 20261027-221332,
    # sha256:4ee892319db7b13138b6b4545b28923d02f605fc0f836fa2142d206544dddda4.
    #
    # 2026-10-27: master badcb8c3 (master pipeline 35422) = the 68f6cda7 build
    # below plus !1137, !1138, !1186 and !1187 (S6b controller pre-work). Caches:
    # !1137 keys the Local HF stage marker on source + sorted allow/ignore
    # patterns + revision and adopts a legacy sha256(source) marker when the
    # staged files still satisfy the options; !1138 does the same for the
    # SharedPVC HF prefetch Job (marker annotation, stale Job replaced,
    # quantize re-run after a re-fetch). Neither starts a Job on the roll:
    # !1137 reads an unannotated stage Job as before, !1138 rebuilds a
    # pre-roll prefetch Job's marker from its env and leaves a current one
    # alone, and a Ready stagedKey cache is never deferred. Runtime path:
    # !1186 (b834275d6) reloads
    # a runtime-served Model when its generation and launch hash both move
    # (RuntimeReloading, drain-aware); unknown hashes from today's runtime
    # images are adopted, so nothing reloads on the roll. 2f1f6134f maps the
    # runtime's loadingSubstage and the 0.75 x maxNumSeqs KV recheck onto
    # runtime loads (only once the runtime image reports them). 9db01a181:
    # cold-start buckets to 1800 s, swap to 900 s, serving_path label.
    # 918da5fcd: ExperimentalGPUSupport gets the VRAMPressure cooldown.
    # No live Model renders differently. 37317c95 (68f6cda7) is the safe
    # fallback.
    # 2026-10-26: master 68f6cda7 (master pipeline 34921) = the dc73879c build
    # below plus !1172 and 8326613d (via d5d1365e). !1172: spec.config.env sets
    # extra backend-process env on both launch paths (over backend and
    # GPUProfile env); device visibility, PORT and the cache paths stay
    # controller-owned and fail validation with ConfigInvalid; vLLM
    # kernelConfig renders --kernel-config. No live Model sets env or
    # kernelConfig, so nothing renders differently. 8326613d: a staged Local
    # HF cache stays ready across a config-only spec edit
    # (status.cache.stagedKey, already in the live CRD); expect one status
    # write per staged Local HF Model on the first pass and no stage Jobs.
    # 4ba76b65 (dc73879c) is the safe fallback.
    # 2026-10-25: master dc73879c (master pipeline 34797) = the b02367ad build
    # below plus !1156 and !1139. llama.cpp: draftMax/draftMin render as
    # --spec-draft-n-max/--spec-draft-n-min for draft-* spec types and for a
    # declared llamacppBuild >= 8955 (the b8955 rename), and an explicit
    # draft-mtp window is its own certificate capability
    # (draft-mtp-draft<N>-min<M>). vLLM: calculateKvScales: false no longer
    # renders --no-calculate-kv-scales (removed in vLLM 0.28). Also carries
    # !1153 (flashAttention: false renders --flash-attn off). No running lane
    # sets any affected key; the nine calculateKvScales lanes are scaled to
    # zero. 113eb124 (b02367ad) is the safe fallback.
    # 2026-10-24: master b02367ad = the 60009c34 build below plus !1133: the
    # certified llama.cpp feature surface accepts specType draft-mtp behind a
    # flexinfer.ai/backend-certificate-llamacpp-draft-mtp GPUProfile triple
    # (draftMax/draftMin rejected with it). No GPUProfile carries that triple
    # at roll time, so admission is unchanged; 65d99ead (60009c34) is the
    # safe fallback.
    # 2026-10-23: master 60009c34 (!1122 reconcile hot-loop fix, !1125 and
    # !1127 cache-status patch churn fixes, !1129 parked-lane cadence, on top
    # of the b8637f35 GPU health sentinel build): a steady shared-GPU member
    # re-elects every 30 s instead of 3 s, a parked Deployment lane requeues
    # at that cadence instead of every 10 s, every status writer on the Model
    # reconcile path skips the write when the pass changed nothing, none of
    # the four status.cache rebuilds in ensureCacheStaging removes and
    # restores prefetchPolicy/lastPrefetchTime any more (two writes and two
    # watch events per pass, which the proxy's per-request lastActiveTime
    # stamps turned into a loop on gte-qwen2 on build e2731314 and on
    # qwen36-35b's cache-copy branch on build a4495e0c, each pinning the
    # single reconcile worker and starving every other Model), and a
    # lastActiveTime-only stamp on a Ready model no longer reconciles it. The
    # sibling watch fans out phase/sharedGroup.state transitions and a
    # GPULease watch re-enqueues the group on lease changes, so swap, park
    # and release latency stay event-driven. Measured on a517165a (the
    # previous pin): 1.5 reconciles/s, 0 conflicts, workqueue depth 0, 43 ms
    # per reconcile; expected on this build: under 1/s. Only the controller
    # binary changed; no lane restart is expected from the roll. Rollback
    # anchor (b8637f35, the sentinel build; skip e2731314 and a4495e0c;
    # a517165a is also safe):
    # sha256:39581256217d78a9f0a9698547d3596d0dd31648d43f6598e159d53a5d5b4376
    # (tag 20261023-142445).
    # 2026-11-02: master d5aa35a7 (tag 20261102-144015; the controller binary
    # last changed in the 1411f5a2 build, so this digest also carries
    # 20261102-001509). The 3cb6cde0 build below plus every merge from
    # 2026-10-30 21:00Z to 2026-11-02: !1206 whispercpp backend (needed by the
    # !1207 lane), !1204 election failover-for (G2), D2 async-jobs API +
    # InferenceJob reconciler (!1216/!1219; the API stays off, see !1221),
    # D4 structured-output certificate gate (!1226, inert without the
    # annotation), D5-a pyannote backend (!1244, certificate-gated), D1 runtime
    # pin contract (!1224, CI only), D7 certify tooling. No pod template
    # changes: no lane restarts expected. Rollback = the 3cb6cde0 build:
    # tag 20261030-153940, sha256:cb4531508c426bdcbce648a71d5c21ac2872d8b2323ba0f728414a36368e3164.
    # 2026-11-05: master 51e6bd81 (tag 20261105-153904). The d5aa35a7 build
    # above plus four controller-side commits; the controller sources are
    # identical from 470d0fe9 to 51e6bd81. !1281 renders vLLM flags and VLLM_*
    # env for a declared spec.config.vllmVersion (unset = the pre-!1281 render,
    # frozen in backend/testdata/vllm-render-golden.json) and refuses
    # maxNumPartialPrefills, maxLongPartialPrefills and an unreadable
    # vllmVersion as ConfigInvalid. !1291 (95e96f66) drops the VLLM_* names a
    # declared vllmVersion removed on vllm-omni too and refuses an unreadable
    # one there, renders enableAiter only on gfx942/gfx950, and certifies the
    # structured-output backend `auto` only (never LM-Format-Enforcer).
    # 3a502a43 unloads an in-pod lane from its runtime when the VRAM or
    # HW-queue fit check refuses it. bf035c08 changes comments only. All 28
    # live Models without vllmVersion and the 3 live GPUProfiles (snapshot
    # 2026-11-05 16:14Z) render byte-identical pod templates and runtime launch
    # payloads (specHash) on both builds; a Model that declares vllmVersion
    # re-renders and restarts, so merge only when none exists. The proxy stays
    # on the 72628e0e build, and its direct-load path renders the runtime
    # payload with the pre-!1281 code, so declare vllmVersion on
    # Deployment-path lanes only until the proxy runs a !1281 build too.
    # Rollback = the d5aa35a7 build: tag 20261102-144015,
    # sha256:1286a2f15c0a5a9f95de19275ce57bfa564ddcbd75517be4b80cf306d29b7c0f.
    digest: "sha256:6a3ad9e603110df8207a59f815d4e809e4b4a3357138302fd2faa39cfc5ccdcd"
    tag: "20261105-153904"
  resources:
    limits:
      cpu: 1000m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  # Keep the controller on any healthy amd64 control-plane node. Host pinning
  # makes rollouts fragile when a single node is down or rebooting.
  nodeSelector:
    kubernetes.io/arch: amd64
    node-role.kubernetes.io/control-plane: "true"
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
    - key: dedicated
      operator: Equal
      value: gpu
      effect: NoSchedule
  runtime:
    imagePullSecrets:
      - harbor-creds
    # 2026-09-14 (issue #74): every dedicated serving pod preempts priority-0
    # CI job pods and ranks behind them for disk-pressure eviction. Explicit
    # here (not only in the chart defaults) because this file is the values
    # the HelmRelease renders with; the two Mills lanes carried these by hand
    # since 2026-09-13 (!1035/!1036) and stay unchanged.
    servingDefaults:
      priorityClass: flexinfer-serving-critical
      ephemeralStorageRequest: "2Gi"

agent:
  enabled: true
  image:
    repository: registry.harbor.lan/flexinfer/flexinfer-agent
    # Pinned by digest like the controller and proxy. Without a digest the
    # rendered image is :${FLEXINFER_AGENT_TAG}, the timestamp tag Flux image
    # automation substitutes in platform/gitops k3s/flux/apps/flexinfer-system.yaml,
    # so every master build rolled the agent on every GPU node. The digest wins
    # over that tag (flexinfer.imageRef) and sets imagePullPolicy IfNotPresent.
    # 2026-11-04: the build the agents ran when this landed (tags master,
    # 20261104-190946 / ac73e607, 20261104-185809 / 71a768e9); drafted
    # 2026-11-01 on de13ce8f (62c87123), which image automation had since
    # replaced. Rollback: delete the digest line (the agent then follows image
    # automation again).
    digest: "sha256:6b832f384c69063dc33248709ae715f3398190b8ed00990501bcca3a139d7b8a"
    tag: "20261104-190946"
  resources:
    limits:
      cpu: 1000m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  # Tolerate GPU node taints so agents can label GPU nodes
  tolerations:
    - key: "dedicated"
      operator: "Equal"
      value: "gpu"
      effect: "NoSchedule"
  # Only run on amd64 nodes (no ARM64 images available)
  nodeSelector:
    kubernetes.io/arch: amd64
    flexinfer.ai/gpu-present: "true"
  # D7 GPU power sampling: flexinfer_gpu_power_watts from sysfs hwmon
  # power1_average at 1 Hz, and flexinfer_lane_energy_joules_total split
  # equally among the Models Ready on the card (docs/specs/metrics.md). Read
  # only, never rocm-smi; the sampler stops itself on a degraded sentinel
  # verdict, a device I/O error or 5 failed reads in a row.
  #
  # cblevins-7900xtx stays OFF until the owner's PCIe/SMU soak verdict
  # (2026-11-06 00:15Z): its hwmon power reads go through the SMU that
  # wedged the card before. Do not add it here before that verdict.
  #
  # Pass rule (validation matrix row gpu-power-sampling-1hz-2026-11-01) and
  # the off switch (empty this list): docs/agents/operations.md#gpu-power-sampling.
  gpuPower:
    nodes:
      - cblevins-5930k
      - cblevins-radeonvii
    interval: 1s

proxy:
  enabled: true
  replicaCount: 1
  image:
    repository: registry.harbor.lan/flexinfer/flexinfer-proxy
    # 2026-10-30: master 3cb6cde0 (master pipeline 36196) = the 2f421569 build
    # below plus !1199: a direct runtime load the proxy wins now posts the
    # controller's payload (pkg/runtime NewModelLoadPayload: LoRA options,
    # generation, specHash, the GPUProfile HWS queue budget from !1198), so the
    # controller no longer reloads it or no-ops without adapters, and the wait
    # uses the Model's serverless.coldStartTimeout instead of the proxy-wide
    # 25 min. Lanes with a spec.config.command wrapper are never direct-loaded.
    # Rollback = the 2f421569 build: tag 20261029-154953,
    # sha256:962427834ea973baec38bf6b94d110edf6a90e7987a674664074385d6686bf61.
    #
    # 2026-10-29: master 2f421569 (master pipeline 35845) = the 2ecf68cc build
    # below plus !1193 and the shared packages that moved since (!1165
    # backend/diffusers, !1186 runtime-load payload generation + spec hash, !1187
    # runtime api types; none change routing). !1193: the lane breaker's
    # recovery probe follows flexinfer.ai/serve-paths, so images/audio/rerank
    # lanes are probed with GET /health instead of a chat completion that
    # answered 404 and kept the Qwen-Image lane's breaker open for ever; and a
    # client that cancels before the lane's first-byte budget runs out no
    # longer counts as a lane failure (the studio's 600 s timeout on queued
    # renders opened the breaker three times on 2026-10-29). Rollback = the
    # 2ecf68cc build: tag 20261026-210805,
    # sha256:dbbf714133cbd356cb5dda715d0b8c8e0e543796fc68986e9f2f18e39dc3be45.
    #
    # 2026-10-26 (later): master 2ecf68cc (master pipeline 35148) = the
    # d8758301 build below plus !1182: a context-overflow replay now loads the
    # target lane's flexinfer.ai/lane-first-byte-budget (it kept the last
    # direct request's budget, the 120 s default after a restart) and skips a
    # target whose breaker is open. Pairs with the 480 s budget on
    # qwen38-27b-xtx-warm-canary from the same MR. Nothing else changed in the
    # proxy's import graph. Rollback = the d8758301 build: tag
    # 20261026-150117,
    # sha256:d0dc2dbc72d15a523abf5af63b7b9b0bbfc00517a33f4d47ad27dcaae8feb77a.
    #
    # 2026-10-26: master d8758301 (master pipeline 35011) = the fe31c9ee build
    # below plus !1177, the context-overflow reroute (CC-6a-3): a Model
    # annotated flexinfer.ai/context-overflow-to has vLLM's prompt-length 400
    # replayed once to that Ready lane. No Model carries the annotation until
    # gfx1100 S4b (!1178), so routing is otherwise unchanged. The only other
    # change in the proxy's import graph is !1172 (spec.config.env in direct
    # runtime-load payloads, as on controller 37317c95). Rollback = the
    # fe31c9ee build: tag 20261025-163057,
    # sha256:1b2ffd4128b79a357d92ed4f8c65fc732f6cb8d9e8c32a69bd891ba3d88d3654.
    #
    # 2026-10-25: master fe31c9ee = !1161 on top of the cc7273917 pin. Demand
    # (lastActiveTime) writes leave the request path: one coalescing writer
    # per model, status merge patches. Model/Service/LoRAAdapter reads come
    # from an informer cache, with direct reads if watch is refused. Direct-load
    # targets follow runtime port moves; on 2026-10-25 a group reload swapped
    # two lanes' ports and every rerank through the proxy got HTTP 501. Also
    # carries 6e3159fec (queued requests keep demand). Needs the chart's
    # loraadapters watch from !1161. Rollback anchor: tag
    # humanizer-fastswaps-cc7273917,
    # sha256:db4c70c04e4196bf26da174d6e529380000678be76ac8315916e7a62452f18c8.
    tag: "20261030-153940"
    # 2026-11-02: master d5aa35a7 (tag 20261102-144015) = the 3cb6cde0 build
    # below plus D2 typed error envelope + cold descriptor (!1210/!1213; Mills
    # classifies by error.code since loom-core!3289), D3 QoS classes (!1209/
    # !1212, opt-in), D6-a swap replay (!1215, on by default) and D6-c gte
    # reroute via !1204 (G1, annotation-driven: gte-qwen2-1p5b-radeonvii ->
    # its CPU twin, !1217), D4 structured-output pass-through (!1229), D5-a
    # diarize=true as a job (!1245, needs the jobs API, off), lane first-byte
    # budgets for the Wan lanes (!1247). Rollback = the 3cb6cde0 build:
    # tag 20261030-153940, sha256:e345d649ce009ea75a6d5f5370e51d4f4e6f5b8176ce2a7f874e92950549cad6.
    # 2026-11-03: master c500a1fd (tag 20261103-053612) = the d5aa35a7 build
    # below plus !1264: cold-started requests run under the lane's
    # flexinfer.ai/lane-first-byte-budget instead of the 120 s default (KT-FLEX
    # rerun: a cold Wan clip was cut at 120 s while the card rendered). Rollback
    # = the d5aa35a7 digest sha256:b07a52ce3c72200cd961ad2903a86485387da7a051ea06258db0001aa7580a87.
    # 2026-11-03: master 72628e0e (tag 20261103-172712) = the c500a1fd build
    # above plus !1270: a request drained from the cold-start queue retries a
    # refused dial for up to 5 s. The Model turns Ready before its Service has
    # endpoints, so the 2x50 ms retry hit a ClusterIP that still REJECTed and a
    # cold Wan clip came back 502. Ready lanes keep the 2x50 ms retry. Rollback
    # = the c500a1fd digest sha256:ce24751b46e3732be06f221937c0f1edaa2af355cb135da560fba3ed7643232d.
    # 2026-11-05: master 51e6bd81 (tag 20261105-153904), rolled in the same
    # restart that turns the jobs API on (owner window 2026-11-06, Q2). The
    # 72628e0e build above plus !1281 and !1291: the proxy's direct-load path
    # now renders a declared spec.config.vllmVersion the way the controller
    # does (!1289), so in-pod vLLM lanes may declare it. Between 72628e0e and
    # 51e6bd81 the proxy's sources differ only in backend/vllm.go,
    # backend/vllm_omni.go (the vllmVersion-gated render) and a comment in
    # api/v1alpha2/gpuprofile_types.go; the 2026-11-05 16:14Z live-snapshot
    # render gives byte-identical runtime payloads for all 28 Models without
    # vllmVersion. Rollback = the 72628e0e digest
    # sha256:bdd4bd256cc43c0fb0e23f05b5a62f9eefb984e70caf8af26cde4fb6a2eb60f8.
    digest: "sha256:d0439aacec17a4dc7655a99bd06c72f3dd65018fb9aaf4fc7ac226328fe3cc72"
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 80
  # Explicit in the cluster values file because Flux HelmChart valuesFiles are
  # packaged as chart defaults; relying only on charts/flexinfer/values.yaml
  # left FLEXINFER_CODEBASE_ANSWER_UPSTREAM absent from the live proxy.
  codebaseAnswerUpstream: "http://codebase-answer.flexinfer-system.svc:8000"
  # Static upstream for the /diarize route → pyannote diarization sibling
  # Deployment on gfx906 (deploy/system/pyannote-diarization/). Gives ICC one
  # base URL for ASR + diarization. Empty disables the route (503).
  pyannoteUpstream: "http://pyannote-diarization.flexinfer-system.svc:8000"
  # Static upstream for the /v1/audio/speech route → Kokoro TTS sibling
  # Deployment (deploy/system/kokoro-tts/, CPU-only). Completes the voice stack
  # (ASR + diarization + TTS) under one base URL. Empty disables the route (503).
  kokoroUpstream: "http://kokoro-tts.flexinfer-system.svc:8880"
  # Async jobs (D2, !1218/!1219): `background: true` (or Prefer:
  # respond-async) on chat/completions, images/generations|edits,
  # audio/transcriptions|speech|generations and videos/generations, plus
  # POST/GET /v1/jobs*, run by the proxy as InferenceJobs. The job API and
  # the runner have been in the proxy since the d5aa35a7 build (!1251); this
  # block switches them on, in the same restart as the 51e6bd81 repin above. Store = MinIO in daemon
  # (ClusterIP Service minio, S3 API on 9000; 9001 is the console), bucket
  # flexinfer-jobs, credentials from Secret flexinfer-jobs-minio in
  # flexinfer-system (keys accessKey, secretKey; platform/gitops!1024, bucket
  # bootstrap Job 2026-10-31). The proxy fails to start when the Secret is
  # missing (secretKeyRef is required). Limits are the binary defaults, written
  # out because this file replaces the chart's values.yaml under Flux.
  # Live consequences: imagegen-ui (services/imagegen-ui!24) renders videos as
  # jobs instead of its synchronous fallback, and diarize=true on
  # /v1/audio/transcriptions answers 501 diarization_not_certified instead of
  # jobs_disabled until a lane carries flexinfer.ai/diarization-model (D5-a).
  # Rollback: enabled: false (queued InferenceJobs stay until re-enabled or
  # deleted; the synchronous paths do not change either way).
  jobs:
    enabled: true
    store: s3
    s3:
      endpoint: "http://minio.daemon.svc:9000"
      bucket: flexinfer-jobs
      region: us-east-1
      credentialsSecret: flexinfer-jobs-minio
    perModel: 2               # running jobs per lane; diffusers lanes run 1
    maxRunning: 8             # running jobs per proxy replica
    maxOutputBytes: 1Gi
    maxWait: 6h               # how long a job may wait for its lane
    spoolSizeLimit: 4Gi       # emptyDir holding a response until it is stored
  # 2026-10-24: CPU limit 200m -> 2000m, request 50m -> 100m. Go 1.26 sizes
  # GOMAXPROCS from the cgroup quota with a floor of 2, so under a 200m limit
  # two Ps burned the 20 ms per-100 ms quota in bursts and then stalled for
  # the rest of the period: 14% of CFS periods throttled over 7 days (21-26%
  # on 2026-10-24) at a 33m average. Through-proxy embeddings at idle took
  # p50 52-68 ms / p90 150-170 ms against 14-18 ms direct to the lane Service,
  # and 0.8 s p50 / 10 s max under ~5 req/s at 16:03Z. A 2000m limit matches
  # GOMAXPROCS=2, so the runtime cannot outrun its quota; it is a ceiling, not
  # a reservation, on the 4-core k3s-cp-1 (16% CPU requested). The request
  # covers the 7-day p99 of 1-minute usage (94m, already capped by the old
  # limit). Memory is unchanged: 7-day max working set 38 MiB.
  resources:
    limits:
      cpu: 2000m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  # Large models (18GB+ GGUF via Longhorn mmap) need 15-20min to load.
  # Set proxy timeouts above worst-case load time.
  timeouts:
    queue: "25m"
    coldStart: "25m"
  # Rollout draining (issue #65). SIGTERM flips /readyz to 503 (pod leaves
  # Service endpoints), waits drainDelay for propagation, then drains in-flight
  # requests up to timeout before closing the listener.
  # terminationGracePeriodSeconds must exceed timeout + drainDelay so the
  # kubelet does not SIGKILL the proxy mid-drain.
  gracefulShutdown:
    timeout: "10m"
    drainDelay: "5s"
    terminationGracePeriodSeconds: 640
  # Both 128K workhorse members are maxNumSeqs=1. Enable only after image
  # automation pins a proxy binary that supports least-loaded routing
  # (first verified tag: 20260714-234146).
  routing:
    labelGroupMode: "least-loaded"
  # Keep the proxy on any healthy amd64 control-plane node. Host pinning makes
  # control-plane service recovery depend on a single machine.
  nodeSelector:
    kubernetes.io/arch: amd64
    node-role.kubernetes.io/control-plane: "true"
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
    - key: dedicated
      operator: Equal
      value: gpu
      effect: NoSchedule
  # Enable context-bounded admission for Models that opt in via the
  # `flexinfer.ai/admission: context-bounded` annotation. Currently only
  # `qwen3-8b-radeonvii` (the gfx906 tertiary fast-chat-fallback lane) is
  # opted in; other Models see no behavior change. See
  # docs/planning/context-bounded-admission-spec.md.
  admission:
    enabled: true
    safetyMarginPercent: 5
    defaultMaxTokens: 256

tenancy:
  enabled: false

# Backend images are now auto-detected by the controller based on GPU vendor:
# - AMD (amd.com/gpu): ollama/ollama:rocm
# - NVIDIA (nvidia.com/gpu): ollama/ollama:latest
# - Intel (intel.com/gpu): ollama/ollama:latest
# To override, set DEFAULT_BACKEND_IMAGE_{AMD,NVIDIA,INTEL} env vars

# Ollama backend images
# Custom Maxwell image built with CUDA 11.8 + sm_52 (pre-built binaries lack sm_52)
ollama:
  maxwellImage: registry.harbor.lan/flexinfer/ollama:cuda-maxwell

scheduler:
  enabled: true
  replicas: 1
  port: 8082
  image:
    repository: registry.harbor.lan/flexinfer/flexinfer-scheduler
    # Pinned by digest like the controller, proxy and agent. Without a digest
    # the rendered image is :${FLEXINFER_SCHEDULER_TAG}, the timestamp tag Flux
    # image automation substitutes in platform/gitops
    # k3s/flux/apps/flexinfer-system.yaml, so every master build rolled the
    # scheduler ~20-30 min later. The digest wins over that tag
    # (flexinfer.imageRef). 2026-11-06: master 4546a85d (tag 20261106-171118),
    # the build the scheduler pod ran when this was pinned. Rollback: delete
    # the digest line (the scheduler then follows image automation again).
    digest: "sha256:f76cc08cd3bfd40c4b7f84ee52fdb73b0667ca478b5e9e0fad8007449d363cc8"
    tag: "20261106-171118"
    pullPolicy: IfNotPresent
  # kube-scheduler sidecar uses upstream k8s image (keep as-is)
  kubeScheduler:
    image:
      repository: registry.k8s.io/kube-scheduler
      tag: "v1.28.0"
  kubeconfigInit:
    image:
      repository: busybox
      tag: "1.37"
      pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  # Any healthy amd64 control-plane node, preferring cblevins-7900xtx (image
  # already cached there). The scheduler mounts only an emptyDir and its own
  # ConfigMap and needs no GPU, so the former hostname pin had no hard
  # dependency behind it — it only turned that host's outage into a
  # cluster-wide control-plane outage (2026-10-22: NotReady at 00:37Z, the
  # replacement pod sat Pending >11h on "didn't match Pod's node
  # affinity/selector"). Same shape as controller/proxy above.
  nodeSelector:
    kubernetes.io/arch: amd64
    node-role.kubernetes.io/control-plane: "true"
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - cblevins-7900xtx
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
    - key: dedicated
      operator: Equal
      value: gpu
      effect: NoSchedule
  weights:
    tps: 0.7
    util: 0.2
    cost: 0.1
    cache: 0.3
    vramFree: 10.0
  tenantFairShare:
    enabled: false
    weight: 5.0
    gpuBudget: 1.0
    tenantLabelKey: ""

benchmarker:
  enabled: true
  image:
    repository: registry.harbor.lan/flexinfer/flexinfer-bench
    tag: "master"
  # No postgresDsn: the controller has not read POSTGRES_DSN since the
  # v1alpha1 benchmark controllers were removed (DEBT-02). The gauntlet CronJob
  # takes its DSN from the flexinfer-benchmarks-postgres Secret instead.

mlcllm:
  rocmImage: registry.harbor.lan/library/mlc-llm:rocm64-llvm19
  defaults:
    jitPolicy: "READONLY"

llamacpp:
  rocmImage: registry.harbor.lan/flexinfer/llamacpp:rocm6.4.4-gfx1100-b8173-v2
  gfx1100Image: registry.harbor.lan/flexinfer/llamacpp:rocm6.4.4-gfx1100-b8173-v2
  gfx906Image: registry.harbor.lan/library/llamacpp:rocm-gfx906-patched-v3

vllm:
  rocmImage: registry.harbor.lan/library/vllm-api:rocm-navi-fp8e5-v2
  gfx1100Image: registry.harbor.lan/flexinfer/vllm@sha256:7ac257f3f04246b02c2cb05c610aeb56b19c2f57ef4ac4273c35d592a8ef1464
  gfx906Image: registry.harbor.lan/flexinfer/vllm:rocm-gfx906@sha256:2139c92b3ca00716216f9e5644e9fbd29b2bba7237dc0459017c86012ece51c3

diffusers:
  rocmImage: registry.harbor.lan/library/diffusers-api:rocm-0cbf9b7
  gfx1100Image: registry.harbor.lan/flexinfer/diffusers:rocm-gfx1100-66af64f

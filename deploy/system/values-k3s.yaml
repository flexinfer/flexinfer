# FlexInfer Helm values override for K3s cluster
# Uses Harbor registry instead of ghcr.io defaults

serviceAccount:
  create: true
  annotations: {}
  name: ""

serviceAccounts:
  controller:
    create: true
  agent:
    create: true
  scheduler:
    create: true
  proxy:
    create: true
  benchmarker:
    create: true

controller:
  enabled: true
  replicas: 1
  image:
    repository: registry.harbor.lan/flexinfer/flexinfer-controller
    # Use the mutable master tag for homelab continuous deployment; publish
    # refreshes this tag on every merged master pipeline, and imagePullPolicy
    # resolves to Always when digest is empty.
    digest: ""
    tag: "master"
  resources:
    limits:
      cpu: 1000m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  # Keep the controller on any healthy amd64 control-plane node. Host pinning
  # makes rollouts fragile when a single node is down or rebooting.
  nodeSelector:
    kubernetes.io/arch: amd64
    node-role.kubernetes.io/control-plane: "true"
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
    - key: dedicated
      operator: Equal
      value: gpu
      effect: NoSchedule

agent:
  enabled: true
  image:
    repository: registry.harbor.lan/flexinfer/flexinfer-agent
    tag: "master"
  resources:
    limits:
      cpu: 1000m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  # Tolerate GPU node taints so agents can label GPU nodes
  tolerations:
    - key: "dedicated"
      operator: "Equal"
      value: "gpu"
      effect: "NoSchedule"
  # Only run on amd64 nodes (no ARM64 images available)
  nodeSelector:
    kubernetes.io/arch: amd64
    flexinfer.ai/gpu-present: "true"

proxy:
  enabled: true
  replicaCount: 1
  image:
    repository: registry.harbor.lan/flexinfer/flexinfer-proxy
    tag: "master"
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 80
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi
  # Large models (18GB+ GGUF via Longhorn mmap) need 15-20min to load.
  # Set proxy timeouts above worst-case load time.
  timeouts:
    queue: "25m"
    coldStart: "25m"
  # Keep the proxy on any healthy amd64 control-plane node. Host pinning makes
  # control-plane service recovery depend on a single machine.
  nodeSelector:
    kubernetes.io/arch: amd64
    node-role.kubernetes.io/control-plane: "true"
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
    - key: dedicated
      operator: Equal
      value: gpu
      effect: NoSchedule

tenancy:
  enabled: false

# Backend images are now auto-detected by the controller based on GPU vendor:
# - AMD (amd.com/gpu): ollama/ollama:rocm
# - NVIDIA (nvidia.com/gpu): ollama/ollama:latest
# - Intel (intel.com/gpu): ollama/ollama:latest
# To override, set DEFAULT_BACKEND_IMAGE_{AMD,NVIDIA,INTEL} env vars

# Ollama backend images
# Custom Maxwell image built with CUDA 11.8 + sm_52 (pre-built binaries lack sm_52)
ollama:
  maxwellImage: registry.harbor.lan/flexinfer/ollama:cuda-maxwell

scheduler:
  enabled: true
  replicas: 1
  port: 8082
  image:
    repository: registry.harbor.lan/flexinfer/flexinfer-scheduler
    tag: "master"
    pullPolicy: IfNotPresent
  # kube-scheduler sidecar uses upstream k8s image (keep as-is)
  kubeScheduler:
    image:
      repository: registry.k8s.io/kube-scheduler
      tag: "v1.28.0"
  kubeconfigInit:
    image:
      repository: busybox
      tag: "1.37"
      pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  # Pin the scheduler to a healthy control-plane GPU node with the image cached.
  nodeSelector:
    kubernetes.io/arch: amd64
    kubernetes.io/hostname: cblevins-7900xtx
    node-role.kubernetes.io/control-plane: "true"
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
    - key: dedicated
      operator: Equal
      value: gpu
      effect: NoSchedule
  weights:
    tps: 0.7
    util: 0.2
    cost: 0.1
    cache: 0.3
    vramFree: 10.0
  tenantFairShare:
    enabled: false
    weight: 5.0
    gpuBudget: 1.0
    tenantLabelKey: ""

benchmarker:
  enabled: true
  image:
    repository: registry.harbor.lan/flexinfer/flexinfer-bench
    tag: "master"
  postgresDsn: "postgres://langgraph:changeme-app@langgraph-postgres-postgresql.ai.svc:5432/flexinfer_benchmarks?sslmode=disable"

mlcllm:
  rocmImage: registry.harbor.lan/library/mlc-llm:rocm64-llvm19
  defaults:
    jitPolicy: "READONLY"

llamacpp:
  rocmImage: registry.harbor.lan/flexinfer/llamacpp:rocm6.4.4-gfx1100-b8173-v2
  gfx1100Image: registry.harbor.lan/flexinfer/llamacpp:rocm6.4.4-gfx1100-b8173-v2
  gfx906Image: registry.harbor.lan/library/llamacpp:rocm-gfx906-patched-v3

vllm:
  rocmImage: registry.harbor.lan/library/vllm-api:rocm-navi-fp8e5-v2
  gfx1100Image: registry.harbor.lan/flexinfer/vllm@sha256:c627593948c3180de05ad636e9fc709b3b8bbfa45f8822befa0fb753e10dda12

diffusers:
  rocmImage: registry.harbor.lan/library/diffusers-api:rocm-0cbf9b7
  gfx1100Image: registry.harbor.lan/flexinfer/diffusers:rocm-gfx1100-66af64f
  cudaImage: registry.harbor.lan/library/diffusers-api@sha256:a2f768a4205870422929fbba0da2dc5cb195033ccb16275fb63d888ce271cd40

quantization:
  useRuntimeForQuantize: false
  runtimeImage: "registry.harbor.lan/flexinfer/runtime@sha256:5bdb065f3e143951086056f4a81378e0cb02cb6d5549114913e56a031c028109"
  gptqDeviceMap: "auto"
  gptqModelPolicies:
    - name: qwen3.5-text
      match_model_types:
        - qwen3_5_text
      match_path_substrings:
        - qwen35
        - qwen3.5
      extract_text_config: true
      copy_root_keys:
        - bos_token_id
        - eos_token_id
        - pad_token_id
      remap_model_type: qwen3_5_text
      architectures:
        - Qwen3_5ForCausalLM
      loader: manual_sharded_state_dict
      python_packages:
        - git+https://github.com/huggingface/transformers.git@529504b2fa98970c6c44d3fafaeb07a39c40e7ea
      quantize_config_overrides:
        offload_to_disk: false
      calibration_overrides:
        max_samples: 16
        max_seq_len: 512
        max_tokens: 8192
      runtime_overrides:
        attn_implementation: eager
        disable_qwen35_fla: true
        fix_mistral_regex: true
    - name: gemma4-text
      match_model_types: [gemma4_text]
      match_path_substrings: [gemma4, gemma-4]
      extract_text_config: true
      copy_root_keys: [bos_token_id, eos_token_id, pad_token_id]
      remap_model_type: gemma4_text
      architectures: [Gemma4ForCausalLM]
      loader: gptqmodel
      python_packages:
        - git+https://github.com/huggingface/transformers.git
      quantize_config_overrides:
        offload_to_disk: false
      calibration_overrides:
        max_samples: 64
        max_seq_len: 2048
        max_tokens: 262144
      runtime_overrides:
        attn_implementation: eager
  images:
    awq: registry.harbor.lan/flexinfer/quantizer:awq-rocm-gfx1100
    gptqRocm: registry.harbor.lan/flexinfer/quantizer:gptq-rocm-gfx1100

runtime:
  enabled: true
  imagePullPolicy: IfNotPresent
  modelHostPath: "/var/lib/flexinfer/models"
  terminationGracePeriodSeconds: 60
  profiles:
    - name: gfx1100
      image: "registry.harbor.lan/flexinfer/runtime@sha256:9fbf14371fd2d8d394c452d849f5b3eb26d8b702ba763dbeaa820df839664061"
      gpuVendor: amd
      gpuArch: gfx1100
      gpuCount: 2
      shmSize: "8Gi"
      memoryLimit: "48Gi"
      memoryRequest: "8Gi"
      nodeSelector:
        kubernetes.io/hostname: cblevins-7900xtx
      env:
        - name: HIP_VISIBLE_DEVICES
          value: "0"
        - name: ROCR_VISIBLE_DEVICES
          value: "0"
        - name: MIOPEN_CUSTOM_CACHE_DIR
          value: "/var/lib/flexinfer/compile-cache/runtime/miopen"
        - name: MIOPEN_USER_DB_PATH
          value: "/var/lib/flexinfer/compile-cache/runtime/miopen/user.db"
        - name: VLLM_CACHE_ROOT
          value: "/var/lib/flexinfer/compile-cache/runtime/vllm"
        - name: XDG_CACHE_HOME
          value: "/var/lib/flexinfer/compile-cache/runtime/xdg"
        - name: TORCHINDUCTOR_CACHE_DIR
          value: "/var/lib/flexinfer/compile-cache/runtime/inductor"
        - name: TRITON_CACHE_DIR
          value: "/var/lib/flexinfer/compile-cache/runtime/triton"
        - name: TORCH_HOME
          value: "/var/lib/flexinfer/compile-cache/runtime/torch"
        - name: PYTORCH_ALLOC_CONF
          value: "garbage_collection_threshold:0.7,max_split_size_mb:256,expandable_segments:True"
        - name: VLLM_ALLOW_CHUNKED_LOCAL_ATTN_WITH_HYBRID_KV_CACHE
          value: "1"
    - name: gfx1100-5930k
      image: "registry.harbor.lan/flexinfer/runtime@sha256:9fbf14371fd2d8d394c452d849f5b3eb26d8b702ba763dbeaa820df839664061"
      gpuVendor: amd
      gpuArch: gfx1100
      gpuCount: 1
      shmSize: "8Gi"
      memoryLimit: "48Gi"
      memoryRequest: "8Gi"
      nodeSelector:
        kubernetes.io/hostname: cblevins-5930k
      env:
        - name: MIOPEN_CUSTOM_CACHE_DIR
          value: "/var/lib/flexinfer/compile-cache/runtime/miopen"
        - name: MIOPEN_USER_DB_PATH
          value: "/var/lib/flexinfer/compile-cache/runtime/miopen/user.db"
        - name: VLLM_CACHE_ROOT
          value: "/var/lib/flexinfer/compile-cache/runtime/vllm"
        - name: XDG_CACHE_HOME
          value: "/var/lib/flexinfer/compile-cache/runtime/xdg"
        - name: TORCHINDUCTOR_CACHE_DIR
          value: "/var/lib/flexinfer/compile-cache/runtime/inductor"
        - name: TRITON_CACHE_DIR
          value: "/var/lib/flexinfer/compile-cache/runtime/triton"
        - name: TORCH_HOME
          value: "/var/lib/flexinfer/compile-cache/runtime/torch"
        - name: PYTORCH_ALLOC_CONF
          value: "garbage_collection_threshold:0.7,max_split_size_mb:256,expandable_segments:True"
        - name: VLLM_ALLOW_CHUNKED_LOCAL_ATTN_WITH_HYBRID_KV_CACHE
          value: "1"
    - name: gfx906
      image: "registry.harbor.lan/flexinfer/runtime@sha256:7c05960614517dbd5d6453944125a01e78f0451f6695467a8eaf6a6859d461dd"
      gpuVendor: amd
      gpuArch: gfx906
      gpuCount: 1
      shmSize: "8Gi"
      memoryLimit: "24Gi"
      memoryRequest: "4Gi"
      nodeSelector:
        kubernetes.io/hostname: cblevins-radeonvii

grafanaDashboard:
  enabled: true

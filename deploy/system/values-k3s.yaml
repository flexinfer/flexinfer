quantization:
  # Python 3.14 candidate promoted after the isolated ModelCache validator and
  # publisher canary passed. The former Python 3.11 digest remains the rollback
  # anchor; never use the mutable master tag as a rollback target.
  modelToolsImage: "registry.harbor.lan/flexinfer/model-tools@sha256:41f948bafa42c154a17ac567a0ade1f49fd3e17e6241c7e8bb44dc7a48265f30"
  # Explicitly overwrite a legacy live Deployment field that pointed publish
  # validation at a stale ROCm runtime. Model tools is the canonical CPU-only
  # image and carries the validator from the same FlexInfer revision.
  validatorImage: "registry.harbor.lan/flexinfer/model-tools@sha256:41f948bafa42c154a17ac567a0ade1f49fd3e17e6241c7e8bb44dc7a48265f30"
  useRuntimeForQuantize: false
  # 2026-09-13 (issue #74 drift report): the previous pin (6ee8b3ed, the
  # 2026-07-18 shuffle-guard build) is no longer in Harbor — retention keeps
  # only tagged manifests. Repinned to the current unified gfx1100 build
  # (immutable tag rocm-gfx1100-57b56bb6, 2026-08-24), which carries the same
  # quantizer layer plus the torchao 0.17 pin and server-snac.py.
  runtimeImage: "registry.harbor.lan/flexinfer/runtime@sha256:5d384ac4268310d50e01897c1a902e6cc819a6ff9352234ae95ffb221baae88c"
  gptqDeviceMap: "auto"
  gptqModelPolicies:
    # Exact-source Fable Fusion candidate gets a larger calibration corpus than
    # the generic Qwen3.6 recovery path. Keep before qwen3.6-text: policy
    # selection is first-match and modelPath=qwen36-27b-fable matches both.
    - name: qwen3.6-fable-text
      match_path_substrings:
        - qwen36-27b-fable
      extract_text_config: true
      copy_root_keys:
        - bos_token_id
        - eos_token_id
        - pad_token_id
      remap_model_type: qwen3_5_text
      architectures:
        - Qwen3_5ForCausalLM
      loader: gptqmodel
      python_packages:
        - git+https://github.com/huggingface/transformers.git@529504b2fa98970c6c44d3fafaeb07a39c40e7ea
      quantize_config_overrides:
        offload_to_disk: true
      calibration_overrides:
        max_samples: 128
        max_seq_len: 1024
        max_tokens: 131072
      runtime_overrides:
        attn_implementation: eager
        disable_qwen35_fla: true
        fix_mistral_regex: true
    - name: qwen3.5-moe-text
      match_model_types:
        - qwen3_5_moe_text
        - qwen3_5_moe
      extract_text_config: true
      copy_root_keys:
        - bos_token_id
        - eos_token_id
        - pad_token_id
      # Preserve the Transformers text config so MoE router/GDN defaults are
      # populated; the quantizer registers this alias to GPTQModel's MoE class.
      remap_model_type: qwen3_5_moe_text
      architectures:
        - Qwen3_5MoeForCausalLM
      loader: gptqmodel
      python_packages:
        - git+https://github.com/huggingface/transformers.git@529504b2fa98970c6c44d3fafaeb07a39c40e7ea
      quantize_config_overrides:
        offload_to_disk: true
      calibration_overrides:
        max_samples: 16
        max_seq_len: 512
        max_tokens: 8192
      runtime_overrides:
        attn_implementation: eager
        disable_qwen35_fla: true
        fix_mistral_regex: true
    - name: qwen3.6-text
      match_path_substrings:
        - qwen36
        - qwen3.6
      extract_text_config: true
      copy_root_keys:
        - bos_token_id
        - eos_token_id
        - pad_token_id
      remap_model_type: qwen3_5_text
      architectures:
        - Qwen3_5ForCausalLM
      loader: gptqmodel
      python_packages:
        - git+https://github.com/huggingface/transformers.git@529504b2fa98970c6c44d3fafaeb07a39c40e7ea
      quantize_config_overrides:
        offload_to_disk: true
      calibration_overrides:
        max_samples: 16
        max_seq_len: 512
        max_tokens: 8192
      runtime_overrides:
        attn_implementation: eager
        disable_qwen35_fla: true
        fix_mistral_regex: true
    - name: qwen3.5-text
      match_model_types:
        - qwen3_5_text
      match_path_substrings:
        - qwen35
        - qwen3.5
        - qwen36
        - qwen3.6
      extract_text_config: true
      copy_root_keys:
        - bos_token_id
        - eos_token_id
        - pad_token_id
      remap_model_type: qwen3_5_text
      architectures:
        - Qwen3_5ForCausalLM
      # 2026-05-09: switched manual_sharded_state_dict -> gptqmodel.
      # Stock GPTQModel.load(offload_to_disk=true) sets turtle_model=LazyTurtle
      # which routes shell_module_materialize through undo_offload_to_disk
      # so disk-offloaded layers materialize on demand instead of crashing.
      # Architectures pin above prevents the multimodal loader regression
      # that originally motivated the manual_sharded_state_dict workaround.
      # See pkg/quantization/gptq.go default policies block + MR !300.
      loader: gptqmodel
      python_packages:
        - git+https://github.com/huggingface/transformers.git@529504b2fa98970c6c44d3fafaeb07a39c40e7ea
      quantize_config_overrides:
        offload_to_disk: true
      calibration_overrides:
        max_samples: 16
        max_seq_len: 512
        max_tokens: 8192
      runtime_overrides:
        attn_implementation: eager
        disable_qwen35_fla: true
        fix_mistral_regex: true
    - name: gemma4-text
      match_model_types: [gemma4_text]
      match_path_substrings: [gemma4, gemma-4]
      extract_text_config: true
      copy_root_keys: [bos_token_id, eos_token_id, pad_token_id]
      remap_model_type: gemma4_text
      architectures: [Gemma4ForCausalLM]
      loader: gptqmodel
      python_packages:
        - git+https://github.com/huggingface/transformers.git
      quantize_config_overrides:
        offload_to_disk: false
      calibration_overrides:
        max_samples: 64
        max_seq_len: 2048
        max_tokens: 262144
      runtime_overrides:
        attn_implementation: eager
  images:
    awq: registry.harbor.lan/flexinfer/quantizer:awq-rocm-gfx1100
    gptqRocm: registry.harbor.lan/flexinfer/quantizer:gptq-rocm-gfx1100

runtime:
  enabled: true
  imagePullPolicy: IfNotPresent
  modelHostPath: "/var/lib/flexinfer/models"
  terminationGracePeriodSeconds: 60
  profiles:
    # 2026-08-22 GAMING HANDBACK: the 08-19 lease went stale (no gaming in
    # progress); 7900xtx returns to inference for the voice lanes (orpheus
    # twin, whisper). Serving digest matches gfx1100-5930k.
    # 2026-08-24: repinned both gfx1100 profiles to the unified build with
    # the bundled snac decode backend (server-snac.py) and the torchao pin
    # (pipeline job 244321). The previous pin predated the snac backend by
    # five weeks; a hand-patched DS digest kept getting silently reverted on
    # every values re-render, so the pin now lives here in git. The gaming stanza
    # shape lives in git history (534b32a89, and the 2026-08-19 lease commit)
    # for the next lease.
    - name: gfx1100
      # 2026-10-23 (issue #74 S1''): repinned to the serving persona rebuilt by
      # master pipeline 34198 from b8637f35 (rocm-gfx1100-serving-b8637f35:
      # Go 1.26.10 + the runtime drain / fast-swap / stall-detection / warm-
      # coexistence commits, same patch stack as the ad93ae72 text lanes).
      # The previous pin f7d2e967 (rocm-gfx1100-serving-e4ad4d10, S1',
      # 2026-09-13) was deleted by Harbor retention on 2026-10-21 and exists
      # only as the containerd snapshot the prewarm DaemonSet holds; rollback
      # anchor (resident on both gfx1100 nodes, IfNotPresent):
      #   registry.harbor.lan/flexinfer/runtime@sha256:f7d2e967c51487220e91285fc1c357a73dad04b62cd3279d23d6ae5f2705aef0
      # 2026-11-01 (D1 step 2, research next-differentiators-2026-10-31
      # §6.1; staged for the owner window, landed 2026-11-04 after KT-FLEX
      # passed, matrix row xtx-runtime-v032-527e2714-2026-11-04): repinned
      # to the stacked vLLM 0.32 runtime 7ae8e92f (rocm-gfx1100-serving-v032-5ca58769, master
      # CI pipeline 36312: vLLM 0.32.0 + the three FlexInfer plugins, text
      # plugin 0.9.0 as in the warm lane's b06b06fe, + the runtime supervisor
      # with in-pod reload, load substages and the short-KV-pool recheck,
      # server-diffusers.py, server-snac.py; prewarmed here by !1232). The
      # design named ef28b7b0 (c444b5ff), the same Dockerfile and stack whose
      # supervisor predates R1/R4/C5; it is certified and prewarmed too, so it
      # is a one-line fallback. This rolls the runtime pod once;
      # snac-decode-gfx1100 reloads at its next election.
      # 2026-11-03: retargeted 7ae8e92f -> 527e2714
      # (rocm-gfx1100-serving-v032-ddf22437, pipeline 37264 job 460293,
      # prewarmed here by !1274): the same stack plus bitsandbytes 0.50.2
      # (ROCm 7.2 library), torchsde, imageio + imageio-ffmpeg and ftfy (!1269),
      # which 7ae8e92f lacked for the in-pod Qwen-Image, Wan and Stable Audio
      # lanes, and the Wan VAE MIOpen bypass (!1268). Still no audio decode
      # (no librosa/soundfile), so whisper stays out of the pod. 7ae8e92f and
      # ef28b7b0 remain certified fallbacks. Rollback = the cfefae18 pin
      # below, still prewarmed here (pinned-cfefae18061f), and drop
      # sharedCompileCache:
      #   registry.harbor.lan/flexinfer/runtime@sha256:cfefae18061fd2f9f07cfbfb9b0c2abb51cb4ab34dabda86f3969c13eca9f278
      image: "registry.harbor.lan/flexinfer/runtime@sha256:527e2714c163f3c284bcba7e168590e8cb8960e2b1cf247b00976bb7b8f30d0b"
      gpuVendor: amd
      gpuArch: gfx1100
      gpuCount: 2
      # 2026-11-01 (D1): mount this image's shared compile cache
      # (/var/lib/flexinfer/compile-cache/shared/gfx1100/527e2714c163 at
      # /cache/compile, C5 !1200, docs/user/caching.md "Runtime pod"). In-pod
      # lanes set spec.cache.compilationCache.scope: Image, so their Triton,
      # Inductor, vLLM and MIOpen caches survive a runtime-pod roll and a
      # swap. A per-Model compile-cache hostPath is never mounted in this pod.
      # Loads without the scope (snac) keep the per-Model directory.
      sharedCompileCache: true
      shmSize: "8Gi"
      # 2026-09-13 disk-pressure guard (issue #74): CI job pods share the
      # physical GPU nodes. Three concurrent pipelines filled the 5930k root
      # at 16:23Z and kubelet evicted the serving pods BEFORE the CI pods,
      # because kubelet ranks pods exceeding their ephemeral-storage request
      # first and a pod with no request exceeds it at the first byte. The
      # request makes the runtime pod rank behind CI pods (5Gi request, up to
      # 20Gi usage); the PriorityClass (150000, above modelcache-transform)
      # protects it from scheduler preemption too. Memory unchanged.
      priorityClassName: flexinfer-serving-critical
      resources:
        limits:
          memory: "48Gi"
        requests:
          memory: "8Gi"
          ephemeral-storage: "2Gi"
      nodeSelector:
        kubernetes.io/hostname: cblevins-7900xtx
      env:
        - name: HIP_VISIBLE_DEVICES
          value: "0"
        - name: ROCR_VISIBLE_DEVICES
          value: "0"
        # 2026-09-13 (issue #74 S1): let the runtime manager host concurrent
        # subprocesses so the gfx1100 GPUProfile's features.multiModel election
        # (VRAM-bounded co-residency, e.g. orpheus + snac) is honoured inside
        # the pod as well as by the controller. Already set on gfx906.
        - name: FLEXINFER_RUNTIME_MULTI_MODEL
          value: "1"
        # 2026-10-27 (S6b pre-work, review row R2): accepted streams finish
        # before a lane swap or spec-change reload releases the GPU, as on
        # gfx906. Adding it rolls this runtime pod once (snac reloads).
        - name: FLEXINFER_RUNTIME_REQUEST_DRAIN
          value: "1"
        - name: MIOPEN_CUSTOM_CACHE_DIR
          value: "/var/lib/flexinfer/compile-cache/runtime/miopen"
        - name: MIOPEN_USER_DB_PATH
          value: "/var/lib/flexinfer/compile-cache/runtime/miopen/user.db"
        - name: VLLM_CACHE_ROOT
          value: "/var/lib/flexinfer/compile-cache/runtime/vllm"
        - name: XDG_CACHE_HOME
          value: "/var/lib/flexinfer/compile-cache/runtime/xdg"
        - name: TORCHINDUCTOR_CACHE_DIR
          value: "/var/lib/flexinfer/compile-cache/runtime/inductor"
        - name: TRITON_CACHE_DIR
          value: "/var/lib/flexinfer/compile-cache/runtime/triton"
        - name: TORCH_HOME
          value: "/var/lib/flexinfer/compile-cache/runtime/torch"
        - name: PYTORCH_ALLOC_CONF
          value: "garbage_collection_threshold:0.7,max_split_size_mb:256,expandable_segments:True"
        - name: VLLM_ALLOW_CHUNKED_LOCAL_ATTN_WITH_HYBRID_KV_CACHE
          value: "1"
    - name: gfx1100-5930k
      # 2026-10-23 (issue #74 S1''): same digest as the gfx1100 profile above
      # (this DaemonSet is desired=0 behind `parked: true` below; the pin is
      # kept identical so enabling it never starts an unpullable image).
      # Previous pin / rollback anchor, node snapshot only:
      #   registry.harbor.lan/flexinfer/runtime@sha256:f7d2e967c51487220e91285fc1c357a73dad04b62cd3279d23d6ae5f2705aef0
      image: "registry.harbor.lan/flexinfer/runtime@sha256:cfefae18061fd2f9f07cfbfb9b0c2abb51cb4ab34dabda86f3969c13eca9f278"
      gpuVendor: amd
      gpuArch: gfx1100
      gpuCount: 1
      shmSize: "8Gi"
      # 2026-09-13 disk-pressure guard: see the gfx1100 profile comment.
      priorityClassName: flexinfer-serving-critical
      resources:
        limits:
          memory: "48Gi"
        requests:
          memory: "8Gi"
          ephemeral-storage: "2Gi"
      nodeSelector:
        kubernetes.io/hostname: cblevins-5930k
      # 2026-10-30 (S6b readiness): the park, in git. The chart adds
      # `flexinfer.ai/quantization-pause: "false"` to the nodeSelector; no node
      # carries that label, so the DaemonSet stays at desired=0. Until now the
      # key lived only in the live object (a 2026-04-04 kubectl patch that
      # Helm's 3-way merge kept), so recreating the DaemonSet or a template
      # change to nodeSelector would have started this runtime on the vLLM
      # 0.17 pin above. Un-parking is S6b's job: delete this line in the change
      # that moves the image to the gfx1100-serving-v032 persona, and only
      # after this park has shipped in a Helm release (the 3-way merge deletes
      # the key only when the previous release manifest carries it). Lanes
      # that must stay dedicated until S6b set config.dedicatedDeployment.
      parked: true
      env:
        # 2026-10-27 (S6b pre-work, review row R2): co-resident lanes and
        # request drain, matching the gfx1100 and gfx906 profiles, so the
        # workhorse can move onto this runtime. The DaemonSet is desired=0, so
        # nothing rolls until S6b un-parks it.
        - name: FLEXINFER_RUNTIME_MULTI_MODEL
          value: "1"
        - name: FLEXINFER_RUNTIME_REQUEST_DRAIN
          value: "1"
        - name: MIOPEN_CUSTOM_CACHE_DIR
          value: "/var/lib/flexinfer/compile-cache/runtime/miopen"
        - name: MIOPEN_USER_DB_PATH
          value: "/var/lib/flexinfer/compile-cache/runtime/miopen/user.db"
        - name: VLLM_CACHE_ROOT
          value: "/var/lib/flexinfer/compile-cache/runtime/vllm"
        - name: XDG_CACHE_HOME
          value: "/var/lib/flexinfer/compile-cache/runtime/xdg"
        - name: TORCHINDUCTOR_CACHE_DIR
          value: "/var/lib/flexinfer/compile-cache/runtime/inductor"
        - name: TRITON_CACHE_DIR
          value: "/var/lib/flexinfer/compile-cache/runtime/triton"
        - name: TORCH_HOME
          value: "/var/lib/flexinfer/compile-cache/runtime/torch"
        - name: PYTORCH_ALLOC_CONF
          value: "garbage_collection_threshold:0.7,max_split_size_mb:256,expandable_segments:True"
        - name: VLLM_ALLOW_CHUNKED_LOCAL_ATTN_WITH_HYBRID_KV_CACHE
          value: "1"
    - name: gfx906
      # 2026-10-23 (issue #74 S3''): repinned to the gfx906 runtime rebuilt by
      # CI from master b8637f35 (rocm-gfx906-b8637f35, pipeline 34198): the
      # same inputs as the off-CI Humanizer overlay it replaces — llama.cpp
      # b11335 and the entrypoint that unsets HSA_OVERRIDE_GFX_VERSION so HIP
      # sees Vega20 (both on master since cc26086e4) — plus Go 1.26.10, i.e.
      # the runtime-manager build already serving on both gfx1100 DaemonSets
      # (cfefae18). Rollback anchor (Harbor-resident, pinned-8181b6901ab0;
      # dropped from the radeonvii-gfx906 prewarm list 2026-10-27, so a
      # rollback pulls it):
      #   registry.harbor.lan/flexinfer/runtime@sha256:8181b6901ab0ed1244a9035d88677c2c729094b847f60d63368faca147a21585
      # 2026-11-02 (!1207 apply plan step 3): repinned to rocm-gfx906-5ca58769, the
      # master CI publish from the !1206 merge, the first gfx906 runtime with the
      # whisper.cpp stage (KT-ASR 2026-10-30). Prewarmed on the Radeon VII first.
      # Rollback anchor: 90648c35 (rocm-gfx906-b8637f35), still prewarmed.
      # Prepared 2026-11-02 for the D5-a KT-DIAR window (go point G2): repinned to
      # rocm-gfx906-pyannote-6fc6fcbd9361 (pinned-cb4c8dc3c2bd), 6fc6fcbd plus the
      # pyannote venv layer (build/Dockerfile.runtime-gfx906-pyannote at !1259,
      # built on the 7900xtx host 2026-11-02); flexinfer-runtime, llama-server and
      # whisper-server are byte-identical to 6fc6fcbd (sha256).
      # Prewarmed on the Radeon VII first. Rollback anchor: 6fc6fcbd
      # (rocm-gfx906-5ca58769), still prewarmed.
      image: "registry.harbor.lan/flexinfer/runtime@sha256:cb4c8dc3c2bd55e0a5935642ed71b06d6fa1236ddd00f15b73627c1660359bc5"
      gpuVendor: amd
      gpuArch: gfx906
      gpuCount: 1
      shmSize: "8Gi"
      # 2026-09-13 disk-pressure guard: see the gfx1100 profile comment. This
      # pod is the whole retrieval plane (bge-large, bge-reranker, gte-qwen2)
      # plus the only voice tier, on a 127G root that CI job pods also use
      # (34 job pods peaked here today; 25 GB of ephemeral at one point).
      priorityClassName: flexinfer-serving-critical
      resources:
        limits:
          memory: "24Gi"
        requests:
          memory: "4Gi"
          ephemeral-storage: "2Gi"
      env:
        # R5 (hardware-utilization arc): the gfx906 runtime holds a VRAM-bounded
        # set of concurrent model subprocesses (per-model ports) instead of a
        # single active model, so the bge embeddings lane and the bge-reranker
        # lane stay GPU-resident together. Pairs with features.multiModel:true on
        # the gfx906 GPUProfile (the controller's multi-Active election). Default
        # off everywhere else — additive, single-slot behavior is unchanged.
        - name: FLEXINFER_RUNTIME_MULTI_MODEL
          value: "true"
        # Accepted streams finish before a subprocess releases the GPU.
        - name: FLEXINFER_RUNTIME_REQUEST_DRAIN
          value: "true"
      # D5-a: the pyannote backend reads the gated-model token from
      # backend.RuntimeSecretsDir/<hfTokenSecret>/<hfTokenSecretKey>; the value
      # never enters a load payload. Same Secret the standalone
      # pyannote-diarization Deployment uses (accepted pyannote/segmentation-3.0
      # and speaker-diarization-3.1).
      extraVolumes:
        - name: hf-token
          secret:
            secretName: flexinfer-hf-token
            defaultMode: 0400
            items:
              - key: HF_TOKEN
                path: HF_TOKEN
      extraVolumeMounts:
        - name: hf-token
          mountPath: /var/run/flexinfer/secrets/flexinfer-hf-token
          readOnly: true
      nodeSelector:
        kubernetes.io/hostname: cblevins-radeonvii
        # 2026-05-07: pause lifted after Track B-3 cycle 2 slim image
        # (sha256:94045d0c, 36.9 GB extracted vs 59.2 GB before) plus moving
        # /var/lib/flexinfer/models to /mnt/nvme/longhorn/flexinfer/models via
        # bind-mount on the Radeon VII node. Pre-pull verified root holds at
        # 65% (78G/127G used) post-pull. Re-pause via this annotation if the
        # runtime image grows back into root-pressure territory.

grafanaDashboard:
  enabled: true
  runtimeEnabled: false

# Chart alert rules (charts/flexinfer/templates/prometheusrule.yaml). Enabled
# 2026-10-23 together with the GPU health sentinel so FlexInferGPUDegraded
# (critical: flexinfer_gpu_healthy == 0) pages when a card drops off the bus;
# the pre-existing proxy, GPU-temperature, scheduler and quantization rules
# in the same template had never been rendered in this cluster before.
# `release: kube-prometheus-stack` is REQUIRED: the Prometheus Operator's
# ruleSelector matches on it and a PrometheusRule without it applies cleanly
# and then never loads (gitops k3s/monitoring/prometheus-rules-lan-storm.yaml
# records the lesson); the other two mirror the older gitops rules.
alerting:
  enabled: true
  labels:
    release: kube-prometheus-stack
    prometheus: kube-prometheus
    role: alert-rules
  thresholds:
    # vLLM lanes reserve 94-96 % of the card by design (gpuMemoryUtilization),
    # so free VRAM is not a health signal here: a negative threshold never
    # matches, which keeps FlexInferGPUVRAMLow from firing permanently on
    # every warm lane (0 would fall back to the chart's 0.1 through Helm's
    # `default`). The agent still exports flexinfer_gpu_vram_* for dashboards.
    vramFreeRatio: -1

# Gaming lease policy for the k3s cluster (rendered into the
# flexinfer-gaming-policy ConfigMap; consumed by the GamingSession controller
# and `flexinfer game preflight`). Play sessions themselves are ephemeral
# GamingSession objects created via `flexinfer game start` — per-session
# GitOps edits to model manifests are obsolete (the controller's scheduling
# overlay parks/restores pinned inference automatically).
gaming:
  # SECURITY GATE — intentionally empty. The last known-streaming Sunshine
  # build (2025.924.154138, image sha256:a58e4f36...) is affected by
  # GHSA-ph75-mgxh-mv57 (CVE-2026-32253, critical auth bypass) and the patched
  # v2026.516 release segfaults on stream start on this exact headless
  # sway/wlroots + VAAPI host (Sunshine #5018; reverted 2026-07-06). Do NOT
  # add a digest here until a candidate passes the 30-minute exact-hardware
  # kill test in docs/dev/gaming-image-canary.md.
  approvedImages: []
  defaultTTL: "2h"
  maxTTL: "8h"
  drainTimeout: "10m"
  requireOwner: true

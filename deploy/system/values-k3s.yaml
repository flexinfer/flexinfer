# FlexInfer Helm values override for K3s cluster
# Uses Harbor registry instead of ghcr.io defaults

serviceAccount:
  create: true
  annotations: {}
  name: ""

serviceAccounts:
  controller:
    create: true
    imagePullSecrets:
      - name: harbor-creds
  agent:
    create: true
    imagePullSecrets:
      - name: harbor-creds
  scheduler:
    create: true
    imagePullSecrets:
      - name: harbor-creds
  proxy:
    create: true
    imagePullSecrets:
      - name: harbor-creds
  benchmarker:
    create: true
    imagePullSecrets:
      - name: harbor-creds

controller:
  enabled: true
  replicas: 1
  image:
    repository: registry.harbor.lan/flexinfer/flexinfer-controller
    # Keep controller/runtime drain contracts on the same tested revision.
    # 2026-10-24: master b02367ad = the 60009c34 build below plus !1133: the
    # certified llama.cpp feature surface accepts specType draft-mtp behind a
    # flexinfer.ai/backend-certificate-llamacpp-draft-mtp GPUProfile triple
    # (draftMax/draftMin rejected with it). No GPUProfile carries that triple
    # at roll time, so admission is unchanged; 65d99ead (60009c34) is the
    # safe fallback.
    # 2026-10-23: master 60009c34 (!1122 reconcile hot-loop fix, !1125 and
    # !1127 cache-status patch churn fixes, !1129 parked-lane cadence, on top
    # of the b8637f35 GPU health sentinel build): a steady shared-GPU member
    # re-elects every 30 s instead of 3 s, a parked Deployment lane requeues
    # at that cadence instead of every 10 s, every status writer on the Model
    # reconcile path skips the write when the pass changed nothing, none of
    # the four status.cache rebuilds in ensureCacheStaging removes and
    # restores prefetchPolicy/lastPrefetchTime any more (two writes and two
    # watch events per pass, which the proxy's per-request lastActiveTime
    # stamps turned into a loop on gte-qwen2 on build e2731314 and on
    # qwen36-35b's cache-copy branch on build a4495e0c, each pinning the
    # single reconcile worker and starving every other Model), and a
    # lastActiveTime-only stamp on a Ready model no longer reconciles it. The
    # sibling watch fans out phase/sharedGroup.state transitions and a
    # GPULease watch re-enqueues the group on lease changes, so swap, park
    # and release latency stay event-driven. Measured on a517165a (the
    # previous pin): 1.5 reconciles/s, 0 conflicts, workqueue depth 0, 43 ms
    # per reconcile; expected on this build: under 1/s. Only the controller
    # binary changed; no lane restart is expected from the roll. Rollback
    # anchor (b8637f35, the sentinel build; skip e2731314 and a4495e0c;
    # a517165a is also safe):
    # sha256:39581256217d78a9f0a9698547d3596d0dd31648d43f6598e159d53a5d5b4376
    # (tag 20261023-142445).
    digest: "sha256:113eb1246a4cad88c34b8cfe96eef085dfa8ab16a613d70c147b5581787c82f6"
    tag: "20261024-134916"
  resources:
    limits:
      cpu: 1000m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  # Keep the controller on any healthy amd64 control-plane node. Host pinning
  # makes rollouts fragile when a single node is down or rebooting.
  nodeSelector:
    kubernetes.io/arch: amd64
    node-role.kubernetes.io/control-plane: "true"
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
    - key: dedicated
      operator: Equal
      value: gpu
      effect: NoSchedule
  runtime:
    imagePullSecrets:
      - harbor-creds
    # 2026-09-14 (issue #74): every dedicated serving pod preempts priority-0
    # CI job pods and ranks behind them for disk-pressure eviction. Explicit
    # here (not only in the chart defaults) because this file is the values
    # the HelmRelease renders with; the two Mills lanes carried these by hand
    # since 2026-09-13 (!1035/!1036) and stay unchanged.
    servingDefaults:
      priorityClass: flexinfer-serving-critical
      ephemeralStorageRequest: "2Gi"

agent:
  enabled: true
  image:
    repository: registry.harbor.lan/flexinfer/flexinfer-agent
    tag: "master"
  resources:
    limits:
      cpu: 1000m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  # Tolerate GPU node taints so agents can label GPU nodes
  tolerations:
    - key: "dedicated"
      operator: "Equal"
      value: "gpu"
      effect: "NoSchedule"
  # Only run on amd64 nodes (no ARM64 images available)
  nodeSelector:
    kubernetes.io/arch: amd64
    flexinfer.ai/gpu-present: "true"

proxy:
  enabled: true
  replicaCount: 1
  image:
    repository: registry.harbor.lan/flexinfer/flexinfer-proxy
    tag: "humanizer-fastswaps-cc7273917"
    digest: "sha256:db4c70c04e4196bf26da174d6e529380000678be76ac8315916e7a62452f18c8"
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 80
  # Explicit in the cluster values file because Flux HelmChart valuesFiles are
  # packaged as chart defaults; relying only on charts/flexinfer/values.yaml
  # left FLEXINFER_CODEBASE_ANSWER_UPSTREAM absent from the live proxy.
  codebaseAnswerUpstream: "http://codebase-answer.flexinfer-system.svc:8000"
  # Static upstream for the /diarize route → pyannote diarization sibling
  # Deployment on gfx906 (deploy/system/pyannote-diarization/). Gives ICC one
  # base URL for ASR + diarization. Empty disables the route (503).
  pyannoteUpstream: "http://pyannote-diarization.flexinfer-system.svc:8000"
  # Static upstream for the /v1/audio/speech route → Kokoro TTS sibling
  # Deployment (deploy/system/kokoro-tts/, CPU-only). Completes the voice stack
  # (ASR + diarization + TTS) under one base URL. Empty disables the route (503).
  kokoroUpstream: "http://kokoro-tts.flexinfer-system.svc:8880"
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi
  # Large models (18GB+ GGUF via Longhorn mmap) need 15-20min to load.
  # Set proxy timeouts above worst-case load time.
  timeouts:
    queue: "25m"
    coldStart: "25m"
  # Rollout draining (issue #65). SIGTERM flips /readyz to 503 (pod leaves
  # Service endpoints), waits drainDelay for propagation, then drains in-flight
  # requests up to timeout before closing the listener.
  # terminationGracePeriodSeconds must exceed timeout + drainDelay so the
  # kubelet does not SIGKILL the proxy mid-drain.
  gracefulShutdown:
    timeout: "10m"
    drainDelay: "5s"
    terminationGracePeriodSeconds: 640
  # Both 128K workhorse members are maxNumSeqs=1. Enable only after image
  # automation pins a proxy binary that supports least-loaded routing
  # (first verified tag: 20260714-234146).
  routing:
    labelGroupMode: "least-loaded"
  # Keep the proxy on any healthy amd64 control-plane node. Host pinning makes
  # control-plane service recovery depend on a single machine.
  nodeSelector:
    kubernetes.io/arch: amd64
    node-role.kubernetes.io/control-plane: "true"
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
    - key: dedicated
      operator: Equal
      value: gpu
      effect: NoSchedule
  # Enable context-bounded admission for Models that opt in via the
  # `flexinfer.ai/admission: context-bounded` annotation. Currently only
  # `qwen3-8b-radeonvii` (the gfx906 tertiary fast-chat-fallback lane) is
  # opted in; other Models see no behavior change. See
  # docs/planning/context-bounded-admission-spec.md.
  admission:
    enabled: true
    safetyMarginPercent: 5
    defaultMaxTokens: 256

tenancy:
  enabled: false

# Backend images are now auto-detected by the controller based on GPU vendor:
# - AMD (amd.com/gpu): ollama/ollama:rocm
# - NVIDIA (nvidia.com/gpu): ollama/ollama:latest
# - Intel (intel.com/gpu): ollama/ollama:latest
# To override, set DEFAULT_BACKEND_IMAGE_{AMD,NVIDIA,INTEL} env vars

# Ollama backend images
# Custom Maxwell image built with CUDA 11.8 + sm_52 (pre-built binaries lack sm_52)
ollama:
  maxwellImage: registry.harbor.lan/flexinfer/ollama:cuda-maxwell

scheduler:
  enabled: true
  replicas: 1
  port: 8082
  image:
    repository: registry.harbor.lan/flexinfer/flexinfer-scheduler
    tag: "master"
    pullPolicy: IfNotPresent
  # kube-scheduler sidecar uses upstream k8s image (keep as-is)
  kubeScheduler:
    image:
      repository: registry.k8s.io/kube-scheduler
      tag: "v1.28.0"
  kubeconfigInit:
    image:
      repository: busybox
      tag: "1.37"
      pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  # Any healthy amd64 control-plane node, preferring cblevins-7900xtx (image
  # already cached there). The scheduler mounts only an emptyDir and its own
  # ConfigMap and needs no GPU, so the former hostname pin had no hard
  # dependency behind it — it only turned that host's outage into a
  # cluster-wide control-plane outage (2026-10-22: NotReady at 00:37Z, the
  # replacement pod sat Pending >11h on "didn't match Pod's node
  # affinity/selector"). Same shape as controller/proxy above.
  nodeSelector:
    kubernetes.io/arch: amd64
    node-role.kubernetes.io/control-plane: "true"
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - cblevins-7900xtx
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
    - key: dedicated
      operator: Equal
      value: gpu
      effect: NoSchedule
  weights:
    tps: 0.7
    util: 0.2
    cost: 0.1
    cache: 0.3
    vramFree: 10.0
  tenantFairShare:
    enabled: false
    weight: 5.0
    gpuBudget: 1.0
    tenantLabelKey: ""

benchmarker:
  enabled: true
  image:
    repository: registry.harbor.lan/flexinfer/flexinfer-bench
    tag: "master"
  postgresDsn: "postgres://langgraph:changeme-app@langgraph-postgres-postgresql.ai.svc:5432/flexinfer_benchmarks?sslmode=disable"

mlcllm:
  rocmImage: registry.harbor.lan/library/mlc-llm:rocm64-llvm19
  defaults:
    jitPolicy: "READONLY"

llamacpp:
  rocmImage: registry.harbor.lan/flexinfer/llamacpp:rocm6.4.4-gfx1100-b8173-v2
  gfx1100Image: registry.harbor.lan/flexinfer/llamacpp:rocm6.4.4-gfx1100-b8173-v2
  gfx906Image: registry.harbor.lan/library/llamacpp:rocm-gfx906-patched-v3

vllm:
  rocmImage: registry.harbor.lan/library/vllm-api:rocm-navi-fp8e5-v2
  gfx1100Image: registry.harbor.lan/flexinfer/vllm@sha256:7ac257f3f04246b02c2cb05c610aeb56b19c2f57ef4ac4273c35d592a8ef1464
  gfx906Image: registry.harbor.lan/flexinfer/vllm:rocm-gfx906@sha256:2139c92b3ca00716216f9e5644e9fbd29b2bba7237dc0459017c86012ece51c3

diffusers:
  rocmImage: registry.harbor.lan/library/diffusers-api:rocm-0cbf9b7
  gfx1100Image: registry.harbor.lan/flexinfer/diffusers:rocm-gfx1100-66af64f
  cudaImage: registry.harbor.lan/library/diffusers-api@sha256:a2f768a4205870422929fbba0da2dc5cb195033ccb16275fb63d888ce271cd40

imagePrewarm:
  enabled: true
  imagePullPolicy: IfNotPresent
  profiles:
    - name: 5930k-gfx1100-serving
      nodeSelector:
        kubernetes.io/hostname: cblevins-5930k
      images:
        # 2026-09-13 (issue #74): keep the Model lanes' v023 serving image
        # (rocm-gfx1100-v023-native-w4a16-037d0bc1, recipe no longer at HEAD)
        # resident across Harbor/containerd GC.
        - registry.harbor.lan/flexinfer/runtime@sha256:2e9652edee30ed078843935ce5672280efd3585de0527d27703dd6880592981d
        # 2026-10-23 (issue #74 S1''): retired the two earlier serving-persona
        # digests, both deleted by Harbor retention on 2026-10-21 and no longer
        # pinned by any consumer: 522d0fe2 (rocm-gfx1100-serving-0d631512, S1)
        # and f7d2e967 (rocm-gfx1100-serving-e4ad4d10, S1'), superseded on both
        # gfx1100 runtime DaemonSets by cfefae18 below (matrix row
        # gfx1100-serving-2026-10-23). This node's runtime DaemonSet is
        # desired=0 and its image GC starts at 60 %, so their snapshots will be
        # reclaimed here; the 7900xtx keeps f7d2e967 as the rollback anchor.
        # 2026-10-23 (issue #74 S1''): the gfx1100 runtime DaemonSet image,
        # the serving persona rebuilt by CI from master b8637f35 (pipeline
        # 34198, publish_serving_rocm_gfx1100, 17.0 GB) —
        # rocm-gfx1100-serving-b8637f35: Go 1.26.10, the runtime drain / fast-
        # swap / stall-detection / warm-coexistence commits already live on the
        # gfx906 DaemonSet, same patch stack as ad93ae72 below. Was held here
        # so enabling the gfx1100-5930k DaemonSet is a container start, not a
        # 17 GB pull.
        # 2026-10-24 HOLD RELEASED: the 5930k root reached 87 % (803 GB of
        # 930 GB: 254 GB FlexInfer caches, 315 GB containerd, 144 GB Longhorn
        # replicas) after the cd108c9e prewarm and kubelet went DiskPressure
        # (imagefs.available < 15 %), evicting the agent, promtail,
        # longhorn-manager and metallb-speaker DaemonSet pods in a loop and
        # restarting the workhorse once at 16:19Z. This 18.2 GB snapshot backs
        # a DaemonSet that is desired=0 by design, so it is the cheapest
        # release; the pin stays as a comment (Harbor-resident,
        # pinned-cfefae18061f, still held on the 7900xtx). Re-add it before
        # enabling the gfx1100-5930k DaemonSet, or accept a 17 GB pull then.
        #   registry.harbor.lan/flexinfer/runtime@sha256:cfefae18061fd2f9f07cfbfb9b0c2abb51cb4ab34dabda86f3969c13eca9f278
        # 2026-10-22 (issue #74 S2, vLLM currency): the rebuilt v0.26 native-
        # W4A16 serving image (rocm-gfx1100-v026-native-w4a16-a106504c, master
        # a106504c, plugin 0.8.0 on 0.26's FLA layout; Harbor tag
        # pinned-ad93ae726bbe). Qualified on this node 2026-09-14 (matrix rows
        # gfx1100-native-w4a16-2026-09-14-seqs2 / -096). Pulled here BEFORE the
        # workhorse repin so the lane swap is a container restart, not an
        # 11 GB pull. 2e9652ed above is the rollback anchor (node snapshot
        # only: Harbor retention deleted it on 2026-10-17/21).
        - registry.harbor.lan/flexinfer/runtime@sha256:ad93ae726bbeb27b2731e3d9ca1ba8f0a9d4234ad7c6d58ef6423e4dc40beeb5
        # 2026-10-24 (issue #74 S2, vLLM currency 0.26 -> 0.32): the native-
        # W4A16 image on the upstream 0.32.0 ROCm wheel
        # (rocm-gfx1100-v032-native-w4a16-3fc9c37f; Dockerfile from !1134 =
        # master 6fcd4af7, 11.6 GB). No from-source rebuild any more: the 0.32
        # wheel embeds gfx1100 code objects, asserted at build time by
        # verify_vllm_gfx1100_native_w4a16.py. Built off-CI on the 7900xtx
        # docker daemon from that exact commit because the buildkit-rocm-images
        # resource group was saturated by multi-hour gfx1100 builds; CI
        # republishes the same Dockerfile under the merge sha later. Promotion
        # target for both 27B lanes (XTX warm lane canaries first); pulled here
        # so the workhorse repin is a container restart. ad93ae72 above is the
        # rollback anchor (Harbor-resident, pinned-ad93ae726bbe). Lanes pinned
        # to this image must drop `calculateKvScales` (flag removed in 0.28).
        - registry.harbor.lan/flexinfer/runtime@sha256:cd108c9ebf99130cc98c3a45bd6e09c89a3b26cb21193c858fab9a99573c7d90
        - registry.harbor.lan/flexinfer/vllm@sha256:7ac257f3f04246b02c2cb05c610aeb56b19c2f57ef4ac4273c35d592a8ef1464
        # Keep the 64K Qwen workhorse overlay referenced across containerd GC;
        # its first cold pull/unpack took 9m05s on this node.
        - registry.harbor.lan/flexinfer/vllm@sha256:7bc680b43ab91e60ea120d65e5af5d0d70300602ac881790ca5cbcfebad90604
        - registry.harbor.lan/flexinfer/diffusers:rocm-gfx1100-66af64f
        # wan21 video lanes (t2v/vace): first cold pull took 14m04s (22.7GB)
        # on 2026-08-22 and the pod was preempted 30s after the pull finished.
        # Keep it resident so VACE reaches Ready inside one election turn.
        # 2026-09-13 (issue #74 drift report): the previous pin (52ebc2b9) is no
        # longer in Harbor (node cache only). Repinned to what the wan21 lanes
        # actually pull — the floating diffusers-video:rocm-gfx1100 tag's current
        # digest (2026-08-23); the newer rocm-gfx1100-0d631512 build (da07169c)
        # never had the floating tag moved onto it.
        - registry.harbor.lan/flexinfer/diffusers-video@sha256:83cda206faea929c181cc13fe4fdb928db2942f22d45938201965527e3beb80f
    # 2026-09-13 (issue #74 S3'): the gfx906 runtime DaemonSet hosts the whole
    # retrieval plane (bge-large, bge-reranker, gte-qwen2) plus the only voice
    # tier, and RollingUpdate terminates the old pod before the new one pulls.
    # Prewarming the promotion target turns a pull-length outage into a load-
    # length one. The Radeon VII root is 127 G — keep this list short.
    - name: radeonvii-gfx906
      nodeSelector:
        kubernetes.io/hostname: cblevins-radeonvii
      images:
        # Rollback anchor for the S3'' roll below: the off-CI Humanizer overlay
        # 8181b690 (rocm-gfx906-humanizer-coexist-cc26086e4, pinned-8181b6901ab0,
        # 2026-10-12) that the gfx906 DaemonSet served from 2026-10-12 until the
        # roll. Harbor-resident and already unpacked on this node, so listing it
        # costs nothing and keeps a rollback a container swap. 171081de
        # (rocm-gfx906-882d81ba, the 09-13 S3' build and the Humanizer-episode
        # rollback) left the list here: two generations back.
        - registry.harbor.lan/flexinfer/runtime@sha256:8181b6901ab0ed1244a9035d88677c2c729094b847f60d63368faca147a21585
        # 2026-10-23 (issue #74 S3''): the gfx906 runtime rebuilt by CI from
        # master b8637f35 (pipeline 34198, publish_runtime_rocm_gfx906, 7.6 GB;
        # tags rocm-gfx906-b8637f35 / rocm-gfx906-609a955f / rocm-gfx906).
        # Same build inputs as the live off-CI Humanizer overlay 8181b690
        # (rocm-gfx906-humanizer-coexist-cc26086e4: llama.cpp b11335 and the
        # entrypoint that unsets HSA_OVERRIDE_GFX_VERSION, both on master since
        # cc26086e4) plus Go 1.26.10 — the same runtime-manager build that
        # already serves on both gfx1100 DaemonSets (cfefae18). Promotion target
        # for the gfx906 DaemonSet + GPUProfile; pulled here first so the roll
        # is a container swap, not a pull with the retrieval plane down.
        # Pinned by the gfx906 DaemonSet + GPUProfile since the S3'' roll
        # (matrix row gfx906-serving-2026-10-23); 8181b690 above is the anchor.
        - registry.harbor.lan/flexinfer/runtime@sha256:90648c350783694d4858e88a31aefcdf682d171571801905c3ddd64c64c530d7
    - name: 7900xtx-gfx1100-serving
      nodeSelector:
        kubernetes.io/hostname: cblevins-7900xtx
      images:
        # 2026-09-13 (issue #74): the v023 Model-lane image, as in the 5930k
        # profile — this node served the warm Mills lane on it.
        - registry.harbor.lan/flexinfer/runtime@sha256:2e9652edee30ed078843935ce5672280efd3585de0527d27703dd6880592981d
        # 2026-10-23 (issue #74 S1''): 522d0fe2 and f7d2e967 retired from this
        # list, see the 5930k profile. f7d2e967 (rocm-gfx1100-serving-e4ad4d10)
        # is the runtime DaemonSet's rollback anchor and stays resident on this
        # node while root use is below its 90 % image-GC threshold (66 % on
        # 2026-10-23); it is no longer in Harbor, so it can only be listed as a
        # comment without failing the runtime_pin_drift gate:
        #   registry.harbor.lan/flexinfer/runtime@sha256:f7d2e967c51487220e91285fc1c357a73dad04b62cd3279d23d6ae5f2705aef0
        # 2026-10-23 (issue #74 S1''): the master b8637f35 serving rebuild
        # (rocm-gfx1100-serving-b8637f35) this node's runtime DaemonSet runs
        # since !1116 (qualified, matrix row gfx1100-serving-2026-10-23).
        - registry.harbor.lan/flexinfer/runtime@sha256:cfefae18061fd2f9f07cfbfb9b0c2abb51cb4ab34dabda86f3969c13eca9f278
        # 2026-10-22 (issue #74 S2): the v0.26 native-W4A16 serving image, see
        # the 5930k profile above. The XTX warm lane is the canary vehicle for
        # this digest (first roll after this image is resident); 2e9652ed
        # stays listed as the rollback anchor until both lanes are promoted.
        - registry.harbor.lan/flexinfer/runtime@sha256:ad93ae726bbeb27b2731e3d9ca1ba8f0a9d4234ad7c6d58ef6423e4dc40beeb5
        # 2026-10-24 (issue #74 S2, vLLM 0.32): the native-W4A16 image on the
        # upstream 0.32.0 wheel, see the 5930k profile above. The XTX warm
        # lane is the canary vehicle for this digest (first roll once it is
        # resident here); ad93ae72 above stays as the rollback anchor.
        - registry.harbor.lan/flexinfer/runtime@sha256:cd108c9ebf99130cc98c3a45bd6e09c89a3b26cb21193c858fab9a99573c7d90
        - registry.harbor.lan/flexinfer/vllm@sha256:7ac257f3f04246b02c2cb05c610aeb56b19c2f57ef4ac4273c35d592a8ef1464
        # Exact Qwen3.5 text-MoE overlay used by the 128K qualification and
        # subsequent second workhorse replica. Keep it resident across GC.
        - registry.harbor.lan/flexinfer/vllm@sha256:7bc680b43ab91e60ea120d65e5af5d0d70300602ac881790ca5cbcfebad90604
        - registry.harbor.lan/flexinfer/diffusers:rocm-gfx1100-66af64f
quantization:
  # Python 3.14 candidate promoted after the isolated ModelCache validator and
  # publisher canary passed. The former Python 3.11 digest remains the rollback
  # anchor; never use the mutable master tag as a rollback target.
  modelToolsImage: "registry.harbor.lan/flexinfer/model-tools@sha256:41f948bafa42c154a17ac567a0ade1f49fd3e17e6241c7e8bb44dc7a48265f30"
  # Explicitly overwrite a legacy live Deployment field that pointed publish
  # validation at a stale ROCm runtime. Model tools is the canonical CPU-only
  # image and carries the validator from the same FlexInfer revision.
  validatorImage: "registry.harbor.lan/flexinfer/model-tools@sha256:41f948bafa42c154a17ac567a0ade1f49fd3e17e6241c7e8bb44dc7a48265f30"
  useRuntimeForQuantize: false
  # 2026-09-13 (issue #74 drift report): the previous pin (6ee8b3ed, the
  # 2026-07-18 shuffle-guard build) is no longer in Harbor — retention keeps
  # only tagged manifests. Repinned to the current unified gfx1100 build
  # (immutable tag rocm-gfx1100-57b56bb6, 2026-08-24), which carries the same
  # quantizer layer plus the torchao 0.17 pin and server-snac.py.
  runtimeImage: "registry.harbor.lan/flexinfer/runtime@sha256:5d384ac4268310d50e01897c1a902e6cc819a6ff9352234ae95ffb221baae88c"
  gptqDeviceMap: "auto"
  gptqModelPolicies:
    # Exact-source Fable Fusion candidate gets a larger calibration corpus than
    # the generic Qwen3.6 recovery path. Keep before qwen3.6-text: policy
    # selection is first-match and modelPath=qwen36-27b-fable matches both.
    - name: qwen3.6-fable-text
      match_path_substrings:
        - qwen36-27b-fable
      extract_text_config: true
      copy_root_keys:

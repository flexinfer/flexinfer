# HostPath-backed PVs/PVCs for local NVMe model storage
# These bypass NFS and use local storage on GPU nodes
---
# MLC models on cblevins-7900xtx NVMe
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mlc-models-nvme-7900xtx
  labels:
    type: nvme-hostpath
    node: cblevins-7900xtx
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /var/lib/flexinfer/qwen3-14b-mlc-nvme
    type: Directory
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - cblevins-7900xtx
  claimRef:
    namespace: flexinfer-system
    name: mlc-models-nvme-7900xtx
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlc-models-nvme-7900xtx
  namespace: flexinfer-system
  labels:
    type: nvme-hostpath
    node: cblevins-7900xtx
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
  volumeName: mlc-models-nvme-7900xtx
  storageClassName: ""
---

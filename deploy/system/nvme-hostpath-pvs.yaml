# HostPath-backed PVs/PVCs for local NVMe model storage
# These bypass NFS and use local storage on GPU nodes
#
# 2026-08-19: the three MLC-era pairs (mlc-models-nvme-7900xtx,
# mlc-8b-abliterated-nvme-7900xtx, mlc-8b-abliterated-nvme-5930k) were
# removed with the MLC retirement. Their hostPath data dirs under
# /var/lib/flexinfer/ on the nodes are wiped separately.
---
# Vision models on cblevins-5930k NVMe
apiVersion: v1
kind: PersistentVolume
metadata:
  name: vision-models-nvme-5930k
  labels:
    type: nvme-hostpath
    node: cblevins-5930k
spec:
  capacity:
    storage: 50Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /var/lib/flexinfer/qwen3-vl-vision
    type: Directory
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - cblevins-5930k
  claimRef:
    namespace: flexinfer-system
    name: vision-models-nvme-5930k
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vision-models-nvme-5930k
  namespace: flexinfer-system
  labels:
    type: nvme-hostpath
    node: cblevins-5930k
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  volumeName: vision-models-nvme-5930k
  storageClassName: ""

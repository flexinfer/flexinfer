# GPUProfile: NVIDIA Maxwell (GTX 980 Ti, sm_52)
#
# Node: cblevins-gtx980ti (single dGPU, 6 GB GDDR5)
#
# Maxwell supports ollama + llamacpp (text gen) and diffusers (image gen) via
# the CUDA 11.8 / torch 2.1.2 build — the last toolkit supporting sm_5.x.
# CUDA compute capability 5.2 — no FP16 tensor cores, no INT8/INT4 acceleration.
# Diffusers runs in fp16 with attention + VAE slicing at 512x512 to fit the 6 GB
# budget (proven on SD 1.5 class models; SDXL is too large here). vLLM and
# comfyui still require higher compute capability and stay unsupported.
apiVersion: ai.flexinfer/v1alpha2
kind: GPUProfile
metadata:
  name: sm-52
  namespace: flexinfer-system
spec:
  architecture: sm_52
  vendor: nvidia
  vramMB: 6144
  features:
    fp16: false
    bf16: false
    fp8: false
    flashAttention: false
    int4: false
    int8: false
  backends:
    ollama:
      support: full
      image: registry.harbor.lan/flexinfer/ollama:cuda-maxwell
    llamacpp:
      support: full
      image: registry.harbor.lan/flexinfer/llamacpp@sha256:18e8cb0868346b273b1cd22b4c3ed0fb5c63d0bb74e72dd0dae10f8786d81cc5
    mlc-llm:
      support: full
      image: registry.harbor.lan/flexinfer/mlc-llm:cuda-maxwell-v7
    vllm:
      support: unsupported
    diffusers:
      # Image generation via the CUDA 11.8 / torch 2.1.2 diffusers-api build.
      # fp16 + attention/VAE slicing at 512x512 fits the 6 GB budget on SD 1.5
      # class models. Experimental: Maxwell has no FP16 tensor cores, so decode
      # is slower than modern cards.
      support: experimental
      # CUDA 11.8 diffusers-api with the scheduler-override fix + black-image /
      # VRAM guards (services/flexinfer!698): step floor (steps=1 -> black on SD
      # 1.5), pixel-area budget (768x768 OOMs the 6 GiB card -> clean 400), and
      # finally-block cache cleanup + VRAM-aware /health self-heal. Built from
      # build/server-diffusers-cuda.py (_apply_scheduler retained) so DEIS-default
      # checkpoints (e.g. Dreamshaper 8) still pin a robust scheduler instead of
      # crashing on the final denoise step.
      # cuda-maxwell-0b19f7a8 (!712): _apply_scheduler now forces
      # algorithm_type=dpmsolver++ so dpm++2m/dpm++2m-karras no longer crash on
      # Dreamshaper 8's leftover algorithm_type=deis, plus an optional lcm
      # scheduler for a future LCM 4-8 step path.
      image: registry.harbor.lan/flexinfer/diffusers:cuda-maxwell-0b19f7a8@sha256:145ee5526017e75674e771739523962124aa00a8fc364797ca7c01b6880a0ce2
    comfyui:
      support: unsupported
  # No spec.runtime: Maxwell is dedicated-pod only (decided 2026-10-12). There is
  # no runtime DaemonSet on cblevins-gtx980ti; every Model there gets its own
  # Deployment running the backends.<name>.image pin above.
  #
  # The block used to pin registry.harbor.lan/flexinfer/runtime:cuda-maxwell, a
  # tag that was never built (Harbor has no such artifact, no CI job publishes
  # it). The whole block is gone, not just the image line, because the CRD
  # requires runtime.image. Its bundledBackends went with it; that list only
  # gates loads into a runtime pod, and none exists here. With spec.runtime
  # absent, pkg/runtime.RuntimeProfileBundlesBackend is permissive,
  # RuntimeReconciler.FindRuntimeForNode finds no runtime pod matching the
  # node's hostname selector, and the Model controller takes the Deployment path.
  #
  # Why no runtime on this node:
  #   - One 6 GiB GPU, held by the warm dedicated image-gen lane
  #     (dreamshaper8-imagegen-gtx980ti, minReplicas 1). A runtime pod would
  #     have no second workload to host.
  #   - The cuda-maxwell profile in build/runtime.yaml sets diffusers: false, so
  #     the only live Maxwell workload could not run inside it anyway.
  #   - charts/flexinfer/templates/runtime-daemonset.yaml is AMD-only: it mounts
  #     /dev/kfd and /dev/dri and sets no runtimeClassName: nvidia or
  #     nvidia.com/gpu request.
  #   - build/Dockerfile.runtime builds llama.cpp for GPU_VENDOR=nvidia without
  #     -DGGML_AVX2=OFF -DGGML_FMA=OFF -DGGML_BMI2=OFF. The host CPU is an Ivy
  #     Bridge i7-3770K (AVX, no AVX2/FMA/BMI2), so that binary would SIGILL.
  #     Only build/Dockerfile.llamacpp-cuda-maxwell sets those flags.
  #
  # Adding one needs all of: a second Maxwell workload worth co-hosting; NVIDIA
  # wiring in the runtime DaemonSet template; the Ivy Bridge GGML flags (plus
  # diffusers if image-gen moves in) in the cuda-maxwell runtime build; a CI job
  # publishing an immutable runtime:cuda-maxwell-<sha> tag; a runtime.profiles
  # entry in deploy/system/values-k3s.yaml; then spec.runtime restored here with
  # a digest pin and bundledBackends. See docs/agents/gpu-compatibility.md
  # "Maxwell runtime posture (GTX 980 Ti)".
  quantization:
    supported:
      - gguf

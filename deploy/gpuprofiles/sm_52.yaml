# GPUProfile: NVIDIA Maxwell (GTX 980 Ti, sm_52)
#
# Node: cblevins-gtx980ti (single dGPU, 6 GB GDDR5)
#
# Maxwell supports ollama + llamacpp (text gen) and diffusers (image gen) via
# the CUDA 11.8 / torch 2.1.2 build — the last toolkit supporting sm_5.x.
# CUDA compute capability 5.2 — no FP16 tensor cores, no INT8/INT4 acceleration.
# Diffusers runs in fp16 with attention + VAE slicing at 512x512 to fit the 6 GB
# budget (proven on SD 1.5 class models; SDXL is too large here). vLLM and
# comfyui still require higher compute capability and stay unsupported.
apiVersion: ai.flexinfer/v1alpha2
kind: GPUProfile
metadata:
  name: sm-52
  namespace: flexinfer-system
spec:
  architecture: sm_52
  vendor: nvidia
  vramMB: 6144
  features:
    fp16: false
    bf16: false
    fp8: false
    flashAttention: false
    int4: false
    int8: false
  backends:
    ollama:
      support: full
      image: registry.harbor.lan/flexinfer/ollama:cuda-maxwell
    llamacpp:
      support: full
      image: registry.harbor.lan/flexinfer/llamacpp@sha256:18e8cb0868346b273b1cd22b4c3ed0fb5c63d0bb74e72dd0dae10f8786d81cc5
    mlc-llm:
      support: full
      image: registry.harbor.lan/flexinfer/mlc-llm:cuda-maxwell-v7
    vllm:
      support: unsupported
    diffusers:
      # Image generation via the CUDA 11.8 / torch 2.1.2 diffusers-api build.
      # fp16 + attention/VAE slicing at 512x512 fits the 6 GB budget on SD 1.5
      # class models. Experimental: Maxwell has no FP16 tensor cores, so decode
      # is slower than modern cards.
      support: experimental
      # CUDA 11.8 diffusers-api with the scheduler-override fix + black-image /
      # VRAM guards (services/flexinfer!698): step floor (steps=1 -> black on SD
      # 1.5), pixel-area budget (768x768 OOMs the 6 GiB card -> clean 400), and
      # finally-block cache cleanup + VRAM-aware /health self-heal. Built from
      # build/server-diffusers-cuda.py (_apply_scheduler retained) so DEIS-default
      # checkpoints (e.g. Dreamshaper 8) still pin a robust scheduler instead of
      # crashing on the final denoise step.
      image: registry.harbor.lan/flexinfer/diffusers:cuda-maxwell-5d5a3121@sha256:5be69785e4f167c26d023c02fad64de397dee00827b36a16c1c68879ca6284b3
    comfyui:
      support: unsupported
  runtime:
    bundledBackends:
      - ollama
      - llamacpp
    image: registry.harbor.lan/flexinfer/runtime:cuda-maxwell
  quantization:
    supported:
      - gguf

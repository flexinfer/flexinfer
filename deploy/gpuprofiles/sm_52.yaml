# GPUProfile: NVIDIA Maxwell (GTX 980 Ti, sm_52)
#
# Node: cblevins-gtx980ti (single dGPU, 6 GB GDDR5)
#
# Maxwell GPUs only support ollama and llamacpp backends in the current
# unified runtime matrix. Image generation stays unsupported here until a
# separate compatibility path is added.
# CUDA compute capability 5.2 — no FP16 tensor cores, no INT8/INT4 acceleration.
# vLLM, diffusers, comfyui all require higher compute capability.
apiVersion: ai.flexinfer/v1alpha2
kind: GPUProfile
metadata:
  name: sm-52
  namespace: flexinfer-system
spec:
  architecture: sm_52
  vendor: nvidia
  vramMB: 6144
  features:
    fp16: false
    bf16: false
    fp8: false
    flashAttention: false
    int4: false
    int8: false
  backends:
    ollama:
      support: full
      image: registry.harbor.lan/flexinfer/ollama:cuda-maxwell
    llamacpp:
      support: full
      image: registry.harbor.lan/flexinfer/llamacpp@sha256:2c378e3120c14963e20dd34bafeb46fe2c9ec5358edd130acbac56bde779e785
    mlc-llm:
      support: full
      image: registry.harbor.lan/flexinfer/mlc-llm:cuda-maxwell-v7
    vllm:
      support: unsupported
    diffusers:
      support: unsupported
    comfyui:
      support: unsupported
  runtime:
    image: registry.harbor.lan/flexinfer/runtime:cuda-maxwell
  quantization:
    supported:
      - gguf

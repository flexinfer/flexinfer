# GPUProfile: AMD RDNA3 (RX 7900 XTX, gfx1100)
#
# Nodes: cblevins-7900xtx (dGPU + iGPU), cblevins-5930k (dGPU only)
#
# cblevins-7900xtx has an integrated GPU (Raphael iGPU) that the K8s device
# plugin exposes as a second amd.com/gpu resource. The iGPU has no dedicated
# VRAM and crashes inference workloads. deviceCount=2 reflects K8s resource
# accounting, but usableDeviceIndices=["0"] ensures only the discrete GPU is
# used via HIP_VISIBLE_DEVICES/ROCR_VISIBLE_DEVICES injection.
#
# cblevins-5930k has a single 7900 XTX with no iGPU (deviceCount would be 1).
# The usableDeviceIndices=["0"] is harmless on single-GPU nodes.
apiVersion: ai.flexinfer/v1alpha2
kind: GPUProfile
metadata:
  name: gfx1100
  namespace: flexinfer-system
spec:
  architecture: gfx1100
  vendor: amd
  vramMB: 24576
  deviceCount: 2
  usableDeviceIndices:
    - "0"
  features:
    fp16: true
    bf16: true
    fp8: false
    flashAttention: true
    int4: true
    int8: true
  backends:
    vllm:
      support: full
      image: registry.harbor.lan/flexinfer/vllm@sha256:cb6d92c956ee150b4b8210e625586140e1b5da4c204caa422b1965e953de78e8
    vllm-omni:
      # vLLM-Omni shares the gfx1100 vLLM build but ships multimodal endpoints.
      # Owns its own per-arch image so the backend rule slice can drop the
      # hardcoded default (slice 3 of the GPUProfile-first contract).
      support: full
      image: registry.harbor.lan/flexinfer/vllm-omni:rocm-gfx1100
    llamacpp:
      support: full
    diffusers:
      # Full support for family-tagged FLUX / SDXL / SD1.5 manifests.
      # SD3.x is represented in this branch via the separate vLLM-Omni example.
      # Keep the 1024px warmup cache enabled on gfx1100 to avoid first-request
      # MIOpen/Triton compile stalls.
      support: full
      image: registry.harbor.lan/flexinfer/diffusers:rocm-gfx1100
    ollama:
      support: full
    comfyui:
      # ComfyUI is a separate backend image; this profile only says the GPU is
      # capable when that image is present in the runtime matrix.
      support: full
      image: registry.harbor.lan/flexinfer/comfyui:rocm-gfx1100
    mlc-llm:
      support: full
      image: registry.harbor.lan/flexinfer/mlc-llm:rocm64-gfx1100
  env:
    - name: HSA_OVERRIDE_GFX_VERSION
      value: "11.0.0"
    - name: TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL
      value: "1"
    - name: HIP_FORCE_DEV_KERNARG
      value: "1"
    - name: TORCH_BLAS_PREFER_HIPBLASLT
      value: "1"
    - name: PYTORCH_ROCM_ARCH
      value: gfx1100
    - name: VLLM_ALLOW_CHUNKED_LOCAL_ATTN_WITH_HYBRID_KV_CACHE
      value: "1"
    # 64 GiB system RAM nodes cannot tolerate materializing a full state_dict
    # after accelerate has already spilled weights to CPU/disk. Keep save-time
    # memory closer to the live module working set instead.
    - name: ABLITERATION_DISK_OFFLOAD_SAVE_IMPL
      value: streaming
    # Auto-select save policy based on available space. The script prefers
    # staged (atomic rename on PVC) > workspace (cross-FS copy) > inplace,
    # and accounts for reclaimable offload dir space before deciding.
    - name: ABLITERATION_SAVE_POLICY
      value: auto
    # hooks-based activation capture on gfx1100 can hang on the first real
    # forward pass for large Gemma abliterations. hidden_states is slower but
    # avoids the forward-hook/device-runtime path until the hooks failure mode
    # is root-caused.
    - name: ABLITERATION_ACTIVATION_CAPTURE_MODE
      value: hidden_states
    # Keep live abliteration jobs deterministic until the next runtime image is
    # rebuilt and rolled out. This matches the pinned Gemma4 runtime profile.
    - name: ABLITERATION_TRANSFORMERS_PACKAGE
      value: git+https://github.com/huggingface/transformers.git@f965b10bcc979e6ad5f02a46f6d074206eccbe75
    - name: ABLITERATION_TRANSFORMERS_RUNTIME_INSTALL
      value: fallback
  runtime:
    image: registry.harbor.lan/flexinfer/runtime@sha256:04631a8db20fb7c2ea62a9846938b155d031d180c962477e011936765bcfeb88
  containerMemoryGB: 48
  maxGPUMemoryGB: 18
  # Dropped 44 → 24 on 2026-04-21 to unblock gemma4-26b-a4b-gptq-dense
  # abliteration which was looping OOM on 5930k. The ModelCache overrides
  # spec.abliteration.maxMemoryGB=28 (kubelet-stability protection after
  # incident 5099ab17), which caps the container cgroup at 40Gi. The prior
  # value of 44 told accelerate to target 44Gi CPU offload → cgroup kills
  # the process at 40 before collection even starts. 24 fits any per-ModelCache
  # override ≥ 28Gi with 4Gi headroom for Python runtime + activation tensors.
  # Once !167's controller-side clamp rolls out, this can be revisited upward
  # for jobs that actually have larger containers available — the clamp is
  # the safety net, this is the floor.
  maxCPUMemoryGB: 24
  gpuDriverMemoryMB: 12288
  quantization:
    supported:
      - gptq
      - awq
      - gguf
      - exl2
    images:
      gptq: registry.harbor.lan/flexinfer/quantizer@sha256:d7a4eeaed0a9c1c0e8c42f128aebfb3a9ad9d9e36bf082dd8168651590c68e57
      abliteration: registry.harbor.lan/flexinfer/runtime@sha256:eb977b01cd8751bcc111cbaed5f8b5171f3968eccc783bfcfc25f36cef7f0365

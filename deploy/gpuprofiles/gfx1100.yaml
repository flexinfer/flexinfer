# GPUProfile: AMD RDNA3 (RX 7900 XTX, gfx1100)
#
# Nodes: cblevins-7900xtx (dGPU + iGPU), cblevins-5930k (dGPU only)
#
# cblevins-7900xtx has an integrated GPU (Raphael iGPU) that the K8s device
# plugin exposes as a second amd.com/gpu resource. The iGPU has no dedicated
# VRAM and crashes inference workloads. deviceCount=2 reflects K8s resource
# accounting, but usableDeviceIndices=["0"] ensures only the discrete GPU is
# used via HIP_VISIBLE_DEVICES/ROCR_VISIBLE_DEVICES injection.
#
# cblevins-5930k has a single 7900 XTX with no iGPU (deviceCount would be 1).
# The usableDeviceIndices=["0"] is harmless on single-GPU nodes.
apiVersion: ai.flexinfer/v1alpha2
kind: GPUProfile
metadata:
  name: gfx1100
  namespace: flexinfer-system
  annotations:
    # 2026-07-16: clean Qwen3.5-35B-A3B MoE + native MTP-1 certificate. The
    # pinned plugin v0.6.0 overlay serves the surgical MTP-expert GPTQ artifact
    # (contract digest below) in graph mode at 32K/FP8-KV with exact constrained
    # greedy parity, 80.18% draft acceptance, and a 1.230x median decode
    # speedup. Certified on cblevins-7900xtx; promoted as the demand-only
    # deploy/models/qwen35-35b-clean-mtp-32k.yaml lane. This certificate does
    # not replace the generic profile image below or broaden its claims.
    flexinfer.ai/backend-certificate-vllm-qwen35-moe-mtp1: registry.harbor.lan/flexinfer/vllm@sha256:f467e202987671b321e215142a7a6be7b910940c1323fced6243b573d27c8669
    flexinfer.ai/backend-certificate-vllm-qwen35-moe-mtp1-artifact: sha256:46d21a2b84818bd319bf774bd385ecd73eeeec4bdb5770df09cc9b8c8be0e78d
    flexinfer.ai/backend-certificate-vllm-qwen35-moe-mtp1-max-model-len: "32768"
    flexinfer.ai/backend-certificate-vllm-qwen35-moe-mtp1-gpu-util: "0.96"
    flexinfer.ai/backend-certificate-vllm-qwen35-moe-mtp1-since: "2026-07-16T19:38:00Z"
    flexinfer.ai/backend-certificate-vllm-qwen35-moe-mtp1-evidence: .loom/iteration-gfx1100-clean-qwen35-mtp-2026-07-16.md
spec:
  architecture: gfx1100
  vendor: amd
  vramMB: 24576
  deviceCount: 2
  usableDeviceIndices:
    - "0"
  features:
    fp16: true
    bf16: true
    fp8: false
    flashAttention: true
    int4: true
    int8: true
  backends:
    vllm:
      support: full
      image: registry.harbor.lan/flexinfer/vllm@sha256:a9b306af9122e39d2554d090fcc63e6f4317c4a69c5e0bf1055027f0f11345ba
      # Wave 1 capability matrix backfill (2026-05-15, spec .loom/21-product-spec-vllm-feature-parity-2026-05-15.md).
      # Controller/runtime load paths consume safe defaults when Model config omits them.
      vllm:
        v1Engine: supported          # V0 removed in vLLM >=0.18; production target is 0.19.x.
        piecewiseGraphs: experimental # Gated on upstream vllm-project/vllm#39010, #41622.
        flashAttention: ck            # CK FA from rocm/vllm-dev Navi base; AOTriton experimental.
        fusedMoETriton: experimental  # BF16 path works (gemma4.py in 0.19+); INT4 weight-loader unproven.
        fp8KVEmulation: experimental  # patch_vllm_env_override_torch29.py wires kv_cache_dtype="fp8"; overhead unmeasured.
        marlinINT4: unsupported       # CUDA-only upstream; turboquant-vllm Tq4 is our INT4 path.
        audioTranscription: experimental # Gated on Slice 1 kill-test in .loom/asr-diarization-7900xtx-plan-2026-05-18.md.
        defaults:
          cudagraphMode: "NONE"       # Expressed as enforceEager by controller/runtime defaults.
          enforceEager: true
          kvCacheDtype: auto
    vllm-omni:
      # vLLM-Omni shares the gfx1100 vLLM build but ships multimodal endpoints.
      # Owns its own per-arch image so the backend rule slice can drop the
      # hardcoded default (slice 3 of the GPUProfile-first contract).
      support: full
      image: registry.harbor.lan/flexinfer/vllm-omni:rocm-gfx1100
    llamacpp:
      support: full
    diffusers:
      # Full support for family-tagged FLUX / SDXL / SD1.5 manifests.
      # SD3.x is represented in this branch via the separate vLLM-Omni example.
      # Keep the 1024px warmup cache enabled on gfx1100 to avoid first-request
      # MIOpen/Triton compile stalls.
      support: full
      image: registry.harbor.lan/flexinfer/diffusers:rocm-gfx1100
    ollama:
      support: full
    comfyui:
      # ComfyUI is a separate backend image; this profile only says the GPU is
      # capable when that image is present in the runtime matrix.
      support: full
      image: registry.harbor.lan/flexinfer/comfyui:rocm-gfx1100
    mlc-llm:
      support: full
      image: registry.harbor.lan/flexinfer/mlc-llm:rocm64-gfx1100
  env:
    - name: HSA_OVERRIDE_GFX_VERSION
      value: "11.0.0"
    - name: TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL
      value: "1"
    - name: HIP_FORCE_DEV_KERNARG
      value: "1"
    - name: TORCH_BLAS_PREFER_HIPBLASLT
      value: "1"
    - name: PYTORCH_ROCM_ARCH
      value: gfx1100
    - name: VLLM_ALLOW_CHUNKED_LOCAL_ATTN_WITH_HYBRID_KV_CACHE
      value: "1"
    # 64 GiB system RAM nodes cannot tolerate materializing a full state_dict
    # after accelerate has already spilled weights to CPU/disk. Keep save-time
    # memory closer to the live module working set instead.
    - name: ABLITERATION_DISK_OFFLOAD_SAVE_IMPL
      value: streaming
    # Auto-select save policy based on available space. The script prefers
    # staged (atomic rename on PVC) > workspace (cross-FS copy) > inplace,
    # and accounts for reclaimable offload dir space before deciding.
    - name: ABLITERATION_SAVE_POLICY
      value: auto
    # hooks-based activation capture on gfx1100 can hang on the first real
    # forward pass for large Gemma abliterations. hidden_states is slower but
    # avoids the forward-hook/device-runtime path until the hooks failure mode
    # is root-caused.
    - name: ABLITERATION_ACTIVATION_CAPTURE_MODE
      value: hidden_states
    # Keep live abliteration jobs deterministic until the next runtime image is
    # rebuilt and rolled out. This matches the pinned Gemma4 runtime profile.
    - name: ABLITERATION_TRANSFORMERS_PACKAGE
      value: git+https://github.com/huggingface/transformers.git@f965b10bcc979e6ad5f02a46f6d074206eccbe75
    - name: ABLITERATION_TRANSFORMERS_RUNTIME_INSTALL
      value: fallback
  runtime:
    # Persistent serving runtime is intentionally slimmer than the broad
    # GPUProfile fallback image: only direct-load backends listed here may use
    # the runtime pod. Other backends fall back to their dedicated image.
    bundledBackends:
      - vllm
      - diffusers
    image: registry.harbor.lan/flexinfer/runtime@sha256:592c0a751c89c6e7c79c0854a4a41fc2b86d6423af3ffe148b61174416dce166
  containerMemoryGB: 48
  # 2026-05-25: bumped 18 → 22 to make room for `gemma4-26b-a4b-gptq` at
  # maxModelLen=32768 with kvCacheDtype=fp8_e4m3. Math:
  #   weights (GPTQ Int4, 26B):  ~13 GB
  #   KV @ FP8, interleaved attn (32k global / 4k local): ~5 GB
  #   activations + framework:   ~3 GB
  # 22 GB cap on a 24 GB card leaves 2 GB physical headroom; vLLM's own
  # gpuMemoryUtilization (set per-Model at 0.98) bounds its working set
  # within the cap. The prior 18 GB cap was sized for 16k context and is
  # too tight for 32k.
  maxGPUMemoryGB: 22
  # Dropped 44 → 24 on 2026-04-21 to unblock gemma4-26b-a4b-gptq-dense
  # abliteration which was looping OOM on 5930k. The ModelCache overrides
  # spec.abliteration.maxMemoryGB=28 (kubelet-stability protection after
  # incident 5099ab17), which caps the container cgroup at 40Gi. The prior
  # value of 44 told accelerate to target 44Gi CPU offload → cgroup kills
  # the process at 40 before collection even starts. 24 fits any per-ModelCache
  # override ≥ 28Gi with 4Gi headroom for Python runtime + activation tensors.
  # Once !167's controller-side clamp rolls out, this can be revisited upward
  # for jobs that actually have larger containers available — the clamp is
  # the safety net, this is the floor.
  maxCPUMemoryGB: 24
  gpuDriverMemoryMB: 12288
  quantization:
    supported:
      - gptq
      - awq
      - gguf
      - exl2
    images:
      gptq: registry.harbor.lan/flexinfer/quantizer@sha256:753e0c21bf578725d152045209970922330c6f08398e27c4ddee08770a0171a9
      abliteration: registry.harbor.lan/flexinfer/runtime@sha256:eb977b01cd8751bcc111cbaed5f8b5171f3968eccc783bfcfc25f36cef7f0365
      # Fine-tuning lane (LoRA/QLoRA via build/scripts/finetune.py). Controller prefers
      # this "finetune" image and falls back to "gptq" when absent. Built from
      # build/Dockerfile.finetune; carries peft/trl/bitsandbytes (NF4 4-bit QLoRA proven
      # on gfx1100, 2026-06-19). See .loom/f1-training-killtest-verdict-2026-06-19.md.
      finetune: registry.harbor.lan/flexinfer/finetune@sha256:c9ee307c3b6ed1b7ab98d423e101d93a3c6f6ff638aeb8652fe8cfa2a36d67b6

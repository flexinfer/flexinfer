# GPUProfile: AMD Vega20 (Radeon VII, gfx906)
#
# Node: cblevins-radeonvii (single dGPU, 16 GB HBM2)
#
# gfx906 hardware reports as gfx900 — HSA_OVERRIDE_GFX_VERSION=9.0.6 is
# required for gfx906 ISA (bitsandbytes NF4 HIP kernels, etc.).
# SDMA disabled for stability. SVM disabled to avoid hipMemGetInfo crash
# (VMM not supported on Vega20, ROCm/ROCm#2433).
#
# diffusers/comfyui are experimental — the unified runtime can run FLUX/SDXL
# family manifests here, but keep warmups conservative (512px) and expect
# CPU-offload to be mandatory for larger models.
apiVersion: ai.flexinfer/v1alpha2
kind: GPUProfile
metadata:
  name: gfx906
  namespace: flexinfer-system
spec:
  architecture: gfx906
  vendor: amd
  vramMB: 16384
  features:
    fp16: true
    bf16: false
    fp8: false
    flashAttention: false
    int4: true
    int8: true
  backends:
    vllm:
      support: full
    llamacpp:
      support: full
    diffusers:
      support: experimental
    ollama:
      support: full
    comfyui:
      support: experimental
    mlc-llm:
      support: experimental
  env:
    - name: HSA_OVERRIDE_GFX_VERSION
      value: "9.0.6"
    - name: HSA_ENABLE_SDMA
      value: "0"
    - name: HSA_USE_SVM
      value: "0"
    - name: PYTORCH_ROCM_ARCH
      value: gfx906
  runtime:
    image: registry.harbor.lan/flexinfer/runtime@sha256:5bdb065f3e143951086056f4a81378e0cb02cb6d5549114913e56a031c028109
  quantization:
    supported:
      - gptq
      - gguf
    images:
      gptq: registry.harbor.lan/flexinfer/runtime@sha256:5bdb065f3e143951086056f4a81378e0cb02cb6d5549114913e56a031c028109
      abliteration: registry.harbor.lan/flexinfer/runtime@sha256:5bdb065f3e143951086056f4a81378e0cb02cb6d5549114913e56a031c028109

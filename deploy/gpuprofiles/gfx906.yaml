# GPUProfile: AMD Vega20 (Radeon VII, gfx906)
#
# Node: cblevins-radeonvii (single dGPU, 16 GB HBM2)
#
# Serving runtimes detect the Radeon VII as gfx906 directly; do not set
# HSA_OVERRIDE_GFX_VERSION on this profile. SDMA is disabled for stability and
# SVM is disabled to avoid hipMemGetInfo crashes
# (VMM not supported on Vega20, ROCm/ROCm#2433).
#
# diffusers/comfyui are experimental — the unified runtime can run FLUX/SDXL
# family manifests here, but keep warmups conservative (512px) and expect
# CPU-offload to be mandatory for larger models.
apiVersion: ai.flexinfer/v1alpha2
kind: GPUProfile
metadata:
  name: gfx906
  namespace: flexinfer-system
  annotations:
    flexinfer.ai/backend-certificate-llamacpp-stateful-slots: registry.harbor.lan/library/llamacpp:rocm-gfx906-hipmem-shim@sha256:79cc4eb24c5260e835637b9de34d93b58b74f03dc9826056a1bea22d566a3407
    flexinfer.ai/backend-certificate-llamacpp-stateful-slots-since: "2026-07-15T20:36:31Z"
    flexinfer.ai/backend-certificate-llamacpp-stateful-slots-evidence: .loom/iteration-gfx906-llamacpp-stateful-spec-2026-07-15.md
    flexinfer.ai/backend-certificate-llamacpp-ngram-simple-draft16-min1: registry.harbor.lan/library/llamacpp:rocm-gfx906-hipmem-shim@sha256:79cc4eb24c5260e835637b9de34d93b58b74f03dc9826056a1bea22d566a3407
    flexinfer.ai/backend-certificate-llamacpp-ngram-simple-draft16-min1-since: "2026-07-15T20:36:31Z"
    flexinfer.ai/backend-certificate-llamacpp-ngram-simple-draft16-min1-evidence: .loom/iteration-gfx906-llamacpp-stateful-spec-2026-07-15.md
    flexinfer.ai/backend-certificate-vllm-qwen35-dense-mtp1: registry.harbor.lan/flexinfer/vllm@sha256:034f081861278a680fe54ddeb71db6446ce65f0a9c37ce9aecc061a99b1d40fc
    flexinfer.ai/backend-certificate-vllm-qwen35-dense-mtp1-artifact: sha256:64189493708ff203f65a08e0ebde92cf9998271212b69cb390173a694f453134
    flexinfer.ai/backend-certificate-vllm-qwen35-dense-mtp1-max-model-len: "32768"
    flexinfer.ai/backend-certificate-vllm-qwen35-dense-mtp1-gpu-util: "0.80"
    flexinfer.ai/backend-certificate-vllm-qwen35-dense-mtp1-since: "2026-07-17T02:27:00Z"
    flexinfer.ai/backend-certificate-vllm-qwen35-dense-mtp1-evidence: .loom/iteration-gfx906-qwen35-mtp-long-context-2026-07-16.md
spec:
  architecture: gfx906
  vendor: amd
  vramMB: 16384
  features:
    fp16: true
    bf16: false
    fp8: false
    flashAttention: false
    int4: true
    int8: true
    # R5 (hardware-utilization arc): allow the controller to keep multiple
    # shared-GPU members Active at once on this card (VRAM-bounded set election,
    # chooseSharedGroupLeaders). The 16 GB HBM2 budget (vramMB above) easily
    # holds the bge embeddings lane (~1.5 GB) + the bge-reranker lane (~0.7 GB)
    # concurrently. Pairs with FLEXINFER_RUNTIME_MULTI_MODEL on the gfx906
    # runtime DaemonSet (the runtime must actually hold both subprocesses).
    multiModel: true
  backends:
    vllm:
      # 2026-06-09: unified multi-arch (gfx906;gfx1100) vLLM 0.6.3.post1
      # serving image, `-serve` derivative with the request-path
      # guided-decoding short-circuit baked in
      # (build/Dockerfile.vllm-rocm-multiarch-serve). Proven on this card:
      # full engine, coherent graph-mode generation, plain + Ray-actor
      # executors (.loom/local/validation/f5-3way-2026-06-09/
      # TOY-KILLTEST-VERDICT.md). Replaces the retired 0.7.3 diagnostic build
      # that segfaulted during OPT Embedding init. Keep experimental until
      # more than the opt-125m canary has soaked; profile-first contract:
      # per-model overrides go through Model spec.image or a profile patch,
      # not the in-code env-var rule slice.
      # 2026-07-16: a separate immutable v0.20.1-lineage overlay is certified
      # for dense Qwen3.5-9B GPTQ + native MTP-1 through a real 18,001-token
      # prefill at maxModelLen=32768. It requires eager mode,
      # maxNumBatchedTokens=256, gpuMemoryUtilization=0.80, the text-only
      # non-MRoPE hfOverrides contract, and the image/artifact pair pinned in
      # the annotations above. This certificate does not replace the generic
      # v0.6.3 profile image or broaden its capability claims.
      support: experimental
      image: registry.harbor.lan/flexinfer/vllm:rocm6.3.4-multiarch-serve@sha256:2f3fe30651ae1cf52b1af12e5db2ad03ed4d36fa1c2b9da64d0e83da3b907920
      # Wave 1 capability matrix backfill (2026-05-15, spec .loom/21-product-spec-vllm-feature-parity-2026-05-15.md).
      # Controller/runtime load paths consume safe defaults when Model config omits them.
      vllm:
        v1Engine: unsupported        # Pinned image is vLLM 0.6.3.post1 — V0 engine (VLLM_USE_V1=0 baked into image env).
        piecewiseGraphs: unsupported  # 0.6.3 predates piecewise graphs; full HIP-graph capture IS proven on Vega20 (2026-06-09 kill-test).
        flashAttention: none          # No FA kernel exists for gfx906 in CK/Triton/AOTriton.
        fusedMoETriton: experimental  # Untested on Vega20; will be validated during Slice 8.
        fp8KVEmulation: unsupported   # No FP8 hardware; emulation untested on Vega20.
        marlinINT4: unsupported       # CUDA-only upstream; ExllamaV2 is the INT4 path on gfx906.
        audioTranscription: unsupported # No FA kernel on Vega20 and runtime is paused (Track B). Whisper.cpp HIP is the gfx906 ASR fallback per .loom/asr-diarization-7900xtx-plan-2026-05-18.md.
        defaults:
          cudagraphMode: "NONE"       # Expressed as enforceEager by controller/runtime defaults.
          enforceEager: true
          kvCacheDtype: auto
    llamacpp:
      support: full
      # b8173 / 2e7e638; stateful slots + ngram-simple certificate artifact.
      image: registry.harbor.lan/library/llamacpp:rocm-gfx906-hipmem-shim@sha256:79cc4eb24c5260e835637b9de34d93b58b74f03dc9826056a1bea22d566a3407
    diffusers:
      support: experimental
      image: registry.harbor.lan/flexinfer/diffusers:rocm-gfx906
    ollama:
      support: full
    comfyui:
      support: experimental
      image: registry.harbor.lan/flexinfer/comfyui:rocm-gfx906
    mlc-llm:
      support: experimental
      image: registry.harbor.lan/flexinfer/mlc-llm:rocm64-gfx906
  env:
    - name: HSA_ENABLE_SDMA
      value: "0"
    - name: HSA_USE_SVM
      value: "0"
    - name: PYTORCH_ROCM_ARCH
      value: gfx906
    # Force the MoE expert-quantization fail-fast gate for GPTQ jobs. Only affects
    # MoE architectures (non-MoE returns early at the has_moe check); makes a run
    # abort in seconds if experts can't be quantized rather than burning ~hours and
    # silently saving an attention-only artifact. See quantize_gptq.py
    # should_require_moe_expert_quantization + patch_moe_module_tree (MR !618).
    - name: GPTQ_REQUIRE_MOE_EXPERT_QUANTIZATION
      value: "1"
    - name: ABLITERATION_SKIP_CACHING_ALLOCATOR_WARMUP
      value: "true"
    - name: ABLITERATION_SAFE_SHARDED_LOAD
      value: "true"
    # hooks-based activation capture has been unstable on Gemma 4 31B resume
    # runs on Radeon VII; hidden_states is slower but avoids that retry loop.
    - name: ABLITERATION_ACTIVATION_CAPTURE_MODE
      value: hidden_states
    # Streaming save iterates one module at a time from offload disk, avoiding
    # the 2x memory peak of the materialized path. Safe because ablitateLmHead
    # is false (the only known corruption case is lm_head with disk offload).
    - name: ABLITERATION_DISK_OFFLOAD_SAVE_IMPL
      value: streaming
    # Auto-select save policy based on available space. The script prefers
    # staged (atomic rename on PVC) > workspace (cross-FS copy) > inplace,
    # and accounts for reclaimable offload dir space before deciding.
    - name: ABLITERATION_SAVE_POLICY
      value: auto
    # Keep Gemma4 retries deterministic on gfx906 as well. The live 31B run is
    # already in-flight, but any future recreate should install the same tested
    # transformers commit instead of drifting to whatever is on main.
    - name: ABLITERATION_TRANSFORMERS_PACKAGE
      value: git+https://github.com/huggingface/transformers.git@f965b10bcc979e6ad5f02a46f6d074206eccbe75
    - name: ABLITERATION_TRANSFORMERS_RUNTIME_INSTALL
      value: fallback
    # Qwen2 sliding-window attention is not supported by ROCm Triton flash
    # attention on gfx906. Force CK flash attention for vLLM canaries.
    - name: VLLM_USE_TRITON_FLASH_ATTN
      value: "0"
  runtime:
    # The persistent gfx906 runtime deliberately does not bundle vLLM. vLLM
    # canaries must use the standalone profile backend image instead of the
    # runtime direct-load path.
    bundledBackends:
      - llamacpp
      - ollama
      - diffusers
    image: registry.harbor.lan/flexinfer/runtime@sha256:89e8d0dc6757ffc318202e98c75372ba32567eb4487fdf585e5648f66acabd8e
  containerMemoryGB: 56
  maxGPUMemoryGB: 12
  maxCPUMemoryGB: 56
  gpuDriverMemoryMB: 8192
  quantization:
    supported:
      - gptq
      - gguf
    images:
      # MR !618 + qwen3_5_moe remap fix: proven gptqmodel-7.0.0 base (sha256:4738926c)
      # + current quantize_gptq.py carrying patch_moe_module_tree (decoupled module_tree
      # inject + version-robust GateUpDownMoELifecycleHooks import) AND the
      # normalize_gptqmodel_model_type fix (qwen3_5_moe_text -> qwen3_5_moe, the
      # registered MODEL_MAP key — without it the MoE model loads as BaseQModel and
      # experts are silently dropped). Rebuilt off-CI as a thin COPY layer because CI
      # no longer builds the gfx906 GPTQ quantizer (unified-gfx906 ships no importable
      # gptqmodel). See build/scripts/quantize_gptq.py.
      # Adds the streaming MoE re-fuse (MR !624): the prior re-fuse mmapped all
      # shards + built ~20GB of fused tensors at once -> SIGBUS on gfx906 at 96%.
      # Now streams one output shard at a time + preserves the per-expert artifact
      # before re-fuse (re-fuse-only recovery, no 12h re-quant).
      # v21 script overlay on the proven gfx906 dependency image; includes the
      # stdlib pcre.Flag compatibility shim required by GPTQModel 7.
      gptq: registry.harbor.lan/flexinfer/quantizer@sha256:12c88adf40ce92314508fc8a10fd8da677d1acbefb698fc0df36cb4e3939b588
      abliteration: registry.harbor.lan/flexinfer/runtime@sha256:aefe41fac3e43a65982fb1da9744c9c485f08dd010bab859b0d1f90de3a6dc4e

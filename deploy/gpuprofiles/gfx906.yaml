# GPUProfile: AMD Vega20 (Radeon VII, gfx906)
#
# Node: cblevins-radeonvii (single dGPU, 16 GB HBM2)
#
# gfx906 hardware reports as gfx900 — HSA_OVERRIDE_GFX_VERSION=9.0.6 is
# required for gfx906 ISA (bitsandbytes NF4 HIP kernels, etc.).
# SDMA disabled for stability. SVM disabled to avoid hipMemGetInfo crash
# (VMM not supported on Vega20, ROCm/ROCm#2433).
#
# diffusers/comfyui are experimental — the unified runtime can run FLUX/SDXL
# family manifests here, but keep warmups conservative (512px) and expect
# CPU-offload to be mandatory for larger models.
apiVersion: ai.flexinfer/v1alpha2
kind: GPUProfile
metadata:
  name: gfx906
  namespace: flexinfer-system
spec:
  architecture: gfx906
  vendor: amd
  vramMB: 16384
  features:
    fp16: true
    bf16: false
    fp8: false
    flashAttention: false
    int4: true
    int8: true
  backends:
    vllm:
      support: full
    llamacpp:
      support: full
    diffusers:
      support: experimental
    ollama:
      support: full
    comfyui:
      support: experimental
    mlc-llm:
      support: experimental
  env:
    - name: HSA_OVERRIDE_GFX_VERSION
      value: "9.0.6"
    - name: HSA_ENABLE_SDMA
      value: "0"
    - name: HSA_USE_SVM
      value: "0"
    - name: PYTORCH_ROCM_ARCH
      value: gfx906
    - name: ABLITERATION_SKIP_CACHING_ALLOCATOR_WARMUP
      value: "true"
    - name: ABLITERATION_SAFE_SHARDED_LOAD
      value: "true"
    # hooks-based activation capture has been unstable on Gemma 4 31B resume
    # runs on Radeon VII; hidden_states is slower but avoids that retry loop.
    - name: ABLITERATION_ACTIVATION_CAPTURE_MODE
      value: hidden_states
    # Keep source weights intact until the save fully completes. The Radeon VII
    # jobs have sufficient /workspace headroom for Gemma4 staging, and
    # destructive in-place saves can force a full redownload after a late
    # shard-write failure.
    - name: ABLITERATION_SAVE_POLICY
      value: workspace
    # Keep Gemma4 retries deterministic on gfx906 as well. The live 31B run is
    # already in-flight, but any future recreate should install the same tested
    # transformers commit instead of drifting to whatever is on main.
    - name: ABLITERATION_TRANSFORMERS_PACKAGE
      value: git+https://github.com/huggingface/transformers.git@f965b10bcc979e6ad5f02a46f6d074206eccbe75
    - name: ABLITERATION_TRANSFORMERS_RUNTIME_INSTALL
      value: fallback
  runtime:
    image: registry.harbor.lan/flexinfer/runtime@sha256:ba4570f515af05fe62f8b6672449b4029e1f15c2f606412e8d6d800e3e0e2dbf
  containerMemoryGB: 56
  maxGPUMemoryGB: 12
  maxCPUMemoryGB: 56
  gpuDriverMemoryMB: 8192
  quantization:
    supported:
      - gptq
      - gguf
    images:
      gptq: registry.harbor.lan/flexinfer/runtime@sha256:ba4570f515af05fe62f8b6672449b4029e1f15c2f606412e8d6d800e3e0e2dbf
      abliteration: registry.harbor.lan/flexinfer/runtime@sha256:617609505076df29e3cec1932774b15d329a6b2c98af3277a9085da6611d609d

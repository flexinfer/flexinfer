# GPUGroup definitions for exclusive GPU scheduling
# Models in the same group share a GPU via priority-based preemption
# Note: GPUGroup CRD is v1alpha1 and NOT required by v1alpha2 Model scheduling
# (gpu.shared field works independently). These are documentation/future-proofing.
---
# Text generation lane on cblevins-7900xtx (shared: opus-distill + 14B-abl-v2)
apiVersion: ai.flexinfer/v1alpha1
kind: GPUGroup
metadata:
  name: 7900xtx-textgen
  namespace: flexinfer-system
spec:
  models:
    - name: qwen35-27b-opus-distill
      priority: 200
    - name: qwen3-14b-abliterated-v2
      priority: 150
  nodeSelector:
    kubernetes.io/hostname: cblevins-7900xtx
  scalingPolicy:
    strategy: Exclusive
    preemptionPolicy: Graceful
    drainTimeoutSeconds: 120
  antiThrashing:
    enabled: true
    minimumRunDurationSeconds: 60
    cooldownAfterPreemptionSeconds: 120
    requestQueueThreshold: 1
    hysteresisWindowSeconds: 15

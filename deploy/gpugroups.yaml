# GPUGroup definitions for exclusive GPU scheduling
# Models in the same group share a GPU via priority-based preemption
# Note: GPUGroup CRD is v1alpha1 and NOT required by v1alpha2 Model scheduling
# (gpu.shared field works independently). These are documentation/future-proofing.
---
# cblevins-5930k: imagegen (primary) + opus-distill text (fast swap secondary)
# When idle, imagegen stays loaded. Text requests preempt imagegen,
# then imagegen reclaims GPU after text idle timeout (5m).
apiVersion: ai.flexinfer/v1alpha1
kind: GPUGroup
metadata:
  name: 5930k-imagegen-textgen
  namespace: flexinfer-system
spec:
  models:
    - name: gonzalomo-fluxpony-imagegen
      priority: 200
    - name: qwen35-27b-opus-distill-5930k
      priority: 150
  nodeSelector:
    kubernetes.io/hostname: cblevins-5930k
  scalingPolicy:
    strategy: Exclusive
    preemptionPolicy: Graceful
    drainTimeoutSeconds: 120
  antiThrashing:
    enabled: true
    minimumRunDurationSeconds: 60
    cooldownAfterPreemptionSeconds: 120
    requestQueueThreshold: 1
    hysteresisWindowSeconds: 15

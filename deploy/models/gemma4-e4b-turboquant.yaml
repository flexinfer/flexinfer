# Gemma 4 E4B via vLLM on AMD gfx1100.
#
# Source: staged on llm-models-nfs at google/gemma-4-E4B-it, then copied into
# node-local cache for the runtime-managed service on cblevins-7900xtx.
#
# Runtime: opt-in TurboQuant canary image. This manifest stays disabled in
# deploy/models/kustomization.yaml and is promoted by digest only after the
# runtime image build/probe completes.
#
# Small E4B regression probe for the Gemma4/TurboQuant path on the 7900 XTX.
apiVersion: ai.flexinfer/v1alpha2
kind: Model
metadata:
  name: gemma4-e4b-turboquant
  namespace: flexinfer-system
  annotations:
    flexinfer.ai/promotion-gate: turboquant-runtime-v1
    flexinfer.ai/promotion-state: canary-disabled-pending-runtime-probe
    flexinfer.ai/promotion-requires: E4B chat smoke plus TurboQuant plugin/shared-primitive log evidence
spec:
  backend: vllm
  image: registry.harbor.lan/flexinfer/runtime@sha256:f9c69576b2681feafe0ba845054ebd5ff0c52a0edddf5c05b08e0fca6ed8817c
  source: pvc://llm-models-nfs/google/gemma-4-E4B-it
  cache:
    strategy: Local
  gpu:
    vendor: amd
    count: 1
    vramEstimateMB: 18000
    shared: 7900xtx-textgen
    priority: 50
  serverless:
    enabled: true
    minReplicas: 0
    idleTimeout: 30m
    coldStartTimeout: 15m
  config:
    dtype: "half"
    maxModelLen: 16384
    gpuMemoryUtilization: "0.90"
    maxNumSeqs: 1
    trustRemoteCode: true
    kvCacheCodec: turboquant
    servedModelName: gemma4-e4b-turboquant
    enableToolCalling: true
    toolCallParser: gemma4
    reasoningParser: gemma4
    enablePrefixCaching: false
    maxNumBatchedTokens: 512
    disableLogStats: false
    warmPolicy: ondemand
  nodeSelector:
    kubernetes.io/hostname: cblevins-7900xtx
  resources:
    requests:
      cpu: "4"
      memory: 16Gi
    limits:
      cpu: "8"
      memory: 24Gi
  serviceLabels:
    - gemma4-e4b-turboquant
  litellm:
    enabled: true
    servedModelName: gemma4-e4b-turboquant
    aliases:
      - gemma4-e4b-turboquant
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"

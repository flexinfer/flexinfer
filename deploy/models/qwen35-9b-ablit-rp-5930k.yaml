# Abliterated Qwen3.5-9B @ 229K + NSFW-RP LoRA — TWIN lane on cblevins-5930k.
#
# Sister to qwen35-9b-ablit-rp (the warm primary on cblevins-7900xtx). Seeded
# from the primary's LIVE promoted spec (canary-certified 224K context,
# generation 4) rather than its original 32K git draft — the promotion
# machinery certified those fields on the primary; the twin inherits them
# explicitly here.
#
# Purpose (psyche roadmap slice E + APC canary):
#   - Second full ~355K-token KV pool: one psyche per lane at full 64K
#     journal budgets, dream cycles offloaded off the primary's turn path.
#   - Designated APC canary for the hybrid-GDN prefix-caching flip
#     (enablePrefixCaching stays false until the canary plan runs; see
#     annotations). The primary is never the experiment.
#
# Election: joins 5930k-textgen at priority 550 — above the idle gemma/qwen36
# residents, below the wan video lanes (600), so invoked video still wins the
# card; serverless ondemand (minReplicas 0) hands it back when idle.
apiVersion: ai.flexinfer/v1alpha2
kind: Model
metadata:
  name: qwen35-9b-ablit-rp-5930k
  namespace: flexinfer-system
  annotations:
    flexinfer.ai/base-model-source: Qwen/Qwen3.5-9B
    flexinfer.ai/base-model-posture: abliterated
    flexinfer.ai/artifact-oci: registry.harbor.lan/flexinfer/qwen35-9b:gptq-w4-g128
    flexinfer.ai/canary: fp8-kv-flip
    flexinfer.ai/canary-plan: .loom/psyche-next-level-roadmap.md
    flexinfer.ai/promotion-state: apc-canary-running
spec:
  backend: vllm
  # Pin the same runtime the primary was certified on. Without this the twin
  # got the 5930k's older prewarmed image, which predates
  # --gdn-prefill-backend / --scheduler-reserve-full-isl (crash-looped on
  # unrecognized args) and hand-patches qwen3-next instead of speaking
  # qwen3_5 natively.
  image: "registry.harbor.lan/flexinfer/runtime@sha256:2e9652edee30ed078843935ce5672280efd3585de0527d27703dd6880592981d"
  source: pvc://qwen35-9b-oci-5930k/qwen35-9b
  cache:
    strategy: Local
    hostPath: /var/lib/flexinfer/models
    size: 50Gi
    storageClass: longhorn
    compilationCache:
      enabled: true
      hostPath: /var/lib/flexinfer/compile-cache-qwen35-9b-v023-5930k
      sizeLimit: 4Gi
  gpu:
    vendor: amd
    count: 1
    vramEstimateMB: 23200
    # 5930k-textgen election: wan video lanes (600) outrank on demand; the
    # idle gemma4/qwen36 residents (<=300) yield to the twin.
    priority: 550
    shared: 5930k-textgen
  serverless:
    enabled: true
    minReplicas: 0
    idleTimeout: 30m
    coldStartTimeout: 25m
  config:
    dtype: "half"
    quantization: gptq
    # Same text-only rope override as the primary: the artifact config carries
    # multimodal mRoPE fields vLLM's qwen3_5 parser rejects.
    hfOverrides: '{"architectures":["Qwen3_5ForCausalLM"],"rope_parameters":{"rope_type":"default","rope_theta":10000000,"partial_rotary_factor":0.25}}'
    maxModelLen: 229376
    maxInputTokens: 228352
    maxOutputTokens: 1024
    gpuMemoryUtilization: "0.94"
    maxNumSeqs: 4
    maxNumBatchedTokens: 4096
    enableChunkedPrefill: true
    schedulerReserveFullISL: true
    enforceEager: false
    cudagraphCaptureSizes: [1, 2, 4]
    maxCudagraphCaptureSize: 4
    cudagraphMetrics: true
    # fp8-kv-flip canary (#67 remaining leg, 2026-07-25): fp8_e4m3 halves
    # per-token KV, targeting ~355k -> ~700k-class pool — the lever for
    # multi-psyche budgets (roadmap slice E). Same recipe as the gemma fp8
    # canaries. Baseline for the delta: the APC-on bench rep 2 (perfect
    # recall) in psyche .loom/killtest-evidence/apc-canary-2026-07-25/.
    # Rollback = kvCacheDtype: auto.
    kvCacheDtype: fp8_e4m3
    # ngram-spec-flip canary (#66, 2026-07-25): lookup speculation targets the
    # measured deep-context decode collapse (~4 tok/s at 45k depth vs ~42
    # shallow). RP prose is maximally repetitive -> high accept rates. Same
    # values the gemma lanes certified (incl. the 7900xtx primary run of
    # 2026-05-25). Distribution-preserving, so the gate is decode tok/s vs
    # the fp8 A/B numbers in flexinfer #67. Rollback = remove this key.
    kvCacheMetrics: true
    kvCacheMetricsSample: "1.0"
    gdnPrefillBackend: triton
    languageModelOnly: true
    dedicatedDeployment: true
    disableAiter: true
    rocmCustomPagedAttn: false
    hipVisibleDevices: "0"
    # Do NOT flip to true: inert on this runtime — vLLM 0.23 force-disables
    # calculate_kv_scales for hybrid GDN models and pins scales at 1.0
    # regardless (probed on the primary 2026-08-01, MR !956 reverted).
    # fp8-KV outlier clipping needs checkpoint-embedded scales; see #69.
    calculateKvScales: false
    # THE gdn-prefix-cache-flip canary, live (vanilla parity proven
    # 2026-07-25: pinned-runtime boot, 0 restarts, served completions,
    # baseline depth-recall probes recorded). GDN hybrids checkpoint
    # recurrent state at block boundaries; "align" is the only mode GDN
    # supports, and without it APC stays inert. bfloat16 SSM state halves
    # each checkpoint so more stay resident (runtime accepts
    # auto|float32|float16|bfloat16 — verified in the live pod).
    # Rollback = revert this block to enablePrefixCaching: false.
    # Boots to the same 544-token aligned attention block as the primary, so
    # the same reporting floor applies: prompts under one block always come
    # back with prompt_tokens_details: null (= zero cached, not "unknown").
    # See the MEASURING APC note in qwen35-9b-ablit-rp.yaml before probing.
    enablePrefixCaching: true
    mambaCacheMode: "align"
    mambaSsmCacheDtype: "bfloat16"
    # Exact usage details in responses from day one (harmless without APC;
    # carries prompt_tokens_details.cached_tokens once the flip lands).
    enablePromptTokensDetails: true
    defaultChatTemplateKwargs:
      enable_thinking: false
    trustRemoteCode: true
    # sleep-mode kill-test (#68 stage 2) ran 2026-07-26 and FAILED on this
    # runtime: --enable-sleep-mode forces vLLM's cumem allocator ("Enabling
    # cumem allocator because sleep mode requires it"), and engine init then
    # dies with an HSA "Memory access fault by GPU node-1 ... Page not present
    # or supervisor privilege" immediately after weight load / PunicaWrapperGPU
    # init. Deterministic crash-loop, so sleep mode is not usable here at all.
    # Do NOT re-flip enableSleepMode on this lane before a runtime bump; see
    # issue #68 for the full trace and the next probe to run.
    servedModelName: qwen35-9b-ablit-rp-5930k
    enableToolCalling: false
    disableLogStats: false
    failOnEnvironValidation: false
    warmPolicy: ondemand
  nodeSelector:
    kubernetes.io/hostname: cblevins-5930k
  resources:
    requests:
      cpu: "4"
      memory: 16Gi
    limits:
      cpu: "8"
      memory: 40Gi
  serviceLabels:
    - qwen35-9b-ablit-rp-5930k
    - nsfw-rp-twin-base
  litellm:
    enabled: true
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"

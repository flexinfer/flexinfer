# gte-Qwen2-1.5B-instruct embeddings on Radeon VII (gfx906) — 1536-dim lane
#
# Purpose: a self-hosted 1536-dimension embedding model that MATCHES the
# agent_context_v1 collection dimension (built by the hosted Morph
# morph-embedding-v3 model, 1536-dim). It serves as the WRITE-PATH fallback for
# agent-context's embedder: when the hosted Morph embeddings provider is down
# (Cloudflare 522 outages), agent_context_add embeds new entries here instead of
# erroring. Queries do NOT use this lane (different vector space than Morph) —
# search degrades to keyword fallback. See loom-core
# pkg/codebase/embed/fallback.go (FallbackEmbedder).
#
# Sizing: Q8_0 GGUF ~1.6 GB; fits in gfx906 16 GB alongside the bge embedding +
# reranker co-Active lanes. Warm-pinned (minReplicas 1) since 2026-08-13: Morph
# retired its hosted embedding line entirely (HTTP 404 model_not_found), and
# loom-core defaults agent-context/pm/codebase writes to this lane (loom-core
# !1583) — it is the PRIMARY write-path embedder now, not an outage spare.
# Cold on-demand activation cannot work here: a scale-to-zero member below the
# warm-pinned bge-large leader is statically parked (see
# controllers/model_shared_gpu.go staticallyParkedBehindPrimary) and the proxy
# fast-fails its requests, so demand never registers. Warm-pinned membership is
# how bge-reranker co-actives; gte joins the same tier. See flexinfer#70.
#
# Mirrors the proven bge-radeonvii.yaml llamacpp embedding lane (Local node
# hostPath cache; the gfx906 runtime only sees node-local staged caches).
#
apiVersion: ai.flexinfer/v1alpha2
kind: Model
metadata:
  name: gte-qwen2-1p5b-radeonvii
  namespace: flexinfer-system
spec:
  backend: llamacpp
  source: HF://second-state/gte-Qwen2-1.5B-instruct-GGUF
  cache:
    size: 3Gi
    storageClass: nvme-1r
    strategy: Local
  gpu:
    vendor: amd
    shared: radeonvii-models
    # Co-Active tier: above the idle chat lanes (gemma4-e4b 110), below the
    # reranker (115) and bge-large leader (120) so group leadership stays with
    # the retrieval plane. Warm-pinning (minReplicas 1), not priority, is what
    # admits this lane; priority only orders VRAM admission under contention.
    priority: 114
    count: 1
    vramEstimateMB: 2600
  serverless:
    enabled: true
    # Warm-pinned: this is the default write-path embedder for loom-core
    # (agent-context/pm/codebase) since the Morph retirement — it must hold a
    # co-Active slot alongside the bge plane, like bge-reranker does.
    minReplicas: 1
    idleTimeout: 30m
    coldStartTimeout: 5m
  config:
    ggufFile: gte-Qwen2-1.5B-instruct-Q8_0.gguf
    contextSize: 1024
    nGPULayers: 999
    batchSize: 2048
    ubatchSize: 512
    embedding: true
    # gte-Qwen2 GGUF defaults to pooling 'none' (token-level), which the
    # OpenAI-compatible /v1/embeddings endpoint rejects. Qwen2 instruct
    # embedding models use last-token pooling.
    pooling: last
    flashAttention: false
    fitOff: true
    metrics: true
    rocrVisibleDevices: "0"
  nodeSelector:
    kubernetes.io/hostname: cblevins-radeonvii
  resources:
    requests:
      cpu: "2"
      memory: 2Gi
    limits:
      cpu: "4"
      memory: 4Gi
  # Distinct label so it does NOT join the default `embeddings`/`rag` routing
  # group (which routes to bge/morph). Addressed explicitly via the litellm
  # served-model name + `gte-qwen2-1.5b` alias only.
  serviceLabels:
    - embeddings-1536
  litellm:
    enabled: true
    servedModelName: gte-qwen2-1p5b-radeonvii
    aliases:
      - gte-qwen2-1.5b
      - embeddings-1536

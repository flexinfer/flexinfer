# whisper.cpp large-v3-turbo (q8_0) ASR lane on the Radeon VII (gfx906).
#
# OpenAI POST /v1/audio/transcriptions served by whisper-server (whisper.cpp
# v1.9.5, ggml-hip) inside the gfx906 runtime pod. Decision and kill-test:
# .loom/10-research-voice-stack-and-gpu-placement-2026-10-30.md §4 and §4.1
# (KT-ASR, 2026-10-30). Request contract:
#   - multipart `file` (WAV, MP3, FLAC or OGG; there is no ffmpeg in the image,
#     so m4a/webm must be converted by the caller), `model`, `response_format`
#     (json, text, srt, vtt, verbose_json), optional `language`, `prompt`,
#     `temperature`.
#   - verbose_json gains the OpenAI top-level `words` list from the runtime
#     ingress (internal/runtime/whispercpp_words.go); ICC's aligner reads it.
#   - one request at a time: whisper-server serializes on a mutex.
#
# KT-ASR 2026-10-30 (one-shot pods beside the live runtime, GPU_MAX_HW_QUEUES=1,
# HSA_CU_MASK=0:0-39): 34.7x real time on a 60-minute meeting (103.6 s),
# 1,319 MiB per process (weights 874 MB, compute buffers 202 MB), 3 compute
# queues, 0 SDMA, load 3.0 s, WER 21.0 % on AMI EN2001a (production
# faster-whisper large-v3: 21.2 %). Card peak 18 of 24 queues with pyannote.
#
# Apply only after the controller and the gfx906 runtime run a build with the
# whispercpp backend (research doc §4.2 apply plan): the controller fails a
# Model whose backend it does not know, and the runtime needs whisper-server.
#
# Placement: warm-pinned so it is co-Active with the retrieval plane and voice
# (scale-to-zero members behind the warm-pinned bge-large leader are parked).
# Priority 111 sits below gte-qwen2 (114) on purpose: Humanizer (130,
# 11,000 MB) + bge-large + bge-reranker + gte = 15,800 of 16,384 MB, so a lane
# ranked above gte would evict gte during a Humanizer burst. At 111 a burst
# evicts ASR (and orpheus) instead, and the in-pod reload is seconds.
apiVersion: ai.flexinfer/v1alpha2
kind: Model
metadata:
  name: whisper-large-v3-turbo-radeonvii
  namespace: flexinfer-system
  annotations:
    flexinfer.ai/purpose: "ASR: OpenAI /v1/audio/transcriptions (whisper.cpp large-v3-turbo q8_0) on the Radeon VII"
    flexinfer.ai/kill-test-evidence: ".loom/10-research-voice-stack-and-gpu-placement-2026-10-30.md#41-kt-asr-results-2026-10-30"
    # ASR only. whisper-server also serves POST /load (loads any server-side
    # path) and /inference; the proxy must never forward those.
    flexinfer.ai/serve-paths: /v1/audio/transcriptions
    # whisper-server answers only when the transcript is done, so the proxy's
    # default 120 s first-byte budget would 504 a long recording. 900 s covers
    # about 8.5 h of audio at 34.7x.
    flexinfer.ai/lane-first-byte-budget: "900s"
spec:
  backend: whispercpp
  source: HF://ggerganov/whisper.cpp
  nodeSelector:
    kubernetes.io/hostname: cblevins-radeonvii
  cache:
    strategy: Local
    hostPath: /var/lib/flexinfer/models
    size: 2Gi
  gpu:
    vendor: amd
    count: 1
    shared: radeonvii-models
    priority: 111
    # Measured 1,319 MiB + 10 %.
    vramEstimateMB: 1500
    # Measured: one whisper-server, 3 compute queues at GPU_MAX_HW_QUEUES=1.
    hwQueueEstimate: 3
  serverless:
    enabled: true
    minReplicas: 1
    idleTimeout: 30m
    coldStartTimeout: 5m
  config:
    hfRevision: 5359861c739e955e79d9a303bcbc70fb988958b1
    modelFile: ggml-large-v3-turbo-q8_0.bin
    # Filter the download even on a controller without the whispercpp
    # download filter: the repo holds every ggml model.
    hfAllowPatterns:
      - ggml-large-v3-turbo-q8_0.bin
    threads: 4
    rocrVisibleDevices: "0"
    env:
      # Confine whisper-server to 40 of the 60 CUs (KFD spreads them over the
      # 4 shader engines). Unmasked it saturates the card and gte p95 rose
      # 38-54 % during a transcription; masked, gte and bge stayed at baseline
      # (KT-ASR run 2). Costs ~16 % throughput (41.4x -> 34.7x).
      HSA_CU_MASK: "0:0-39"
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      cpu: "4"
      memory: 4Gi
  serviceLabels:
    - asr
    - transcription
    - whisper
  litellm:
    enabled: true
    servedModelName: whisper-large-v3-turbo-radeonvii

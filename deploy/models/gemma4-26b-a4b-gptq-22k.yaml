# Gemma4 26B-A4B GPTQ higher-context canary via vLLM on AMD gfx1100.
#
# Experimental 22K lane for the same clean 26B-A4B GPTQ source artifact used by
# the validated 16K FP8-KV canary. The 16K manifest stays unchanged so it remains
# the known-good long-context fallback while this profile probes the practical
# upper bound reported by vLLM's KV cache planner on a single 24 GB 7900 XTX.
apiVersion: ai.flexinfer/v1alpha2
kind: Model
metadata:
  name: gemma4-26b-a4b-gptq-22k
  namespace: flexinfer-system
  annotations:
    flexinfer.ai/promotion-gate: quantized-artifact-v1
    flexinfer.ai/promotion-state: 17k-fp8kv-canary-validated
    flexinfer.ai/promotion-validation: partial
    flexinfer.ai/promotion-evidence: incluster-job/gemma4-22k-incluster-probe@2026-04-26T23:38:13Z
    flexinfer.ai/promotion-requires: 18k-22k-validation-before-primary-promotion
spec:
  backend: vllm
  image: registry.harbor.lan/flexinfer/runtime@sha256:0b05b32b92e6ab99cd648837a9bf80cf3dd437275b1d97fb71378a9f829cdaac
  source: pvc://gemma4-26b-a4b-gptq/gemma4-26b-a4b-gptq/gptq-w4-g128-attnfp16-clean
  cache:
    strategy: None
  gpu:
    vendor: amd
    count: 2
    shared: 7900xtx-textgen
    # Below the warm 31B primary so successful 22K validation does not strand
    # the shared 7900xtx-textgen lane away from the default chat model.
    priority: 240
    vramEstimateMB: 18000
  serverless:
    enabled: true
    minReplicas: 0
    idleTimeout: 30m
    coldStartTimeout: 15m
  config:
    quantization: gptq
    dtype: "half"
    maxModelLen: 22000
    gpuMemoryUtilization: "0.98"
    kvCacheDtype: fp8_e4m3
    maxNumSeqs: 1
    trustRemoteCode: true
    attentionBackend: TRITON_ATTN
    servedModelName: gemma4-26b-a4b-gptq-22k
    enableToolCalling: true
    toolCallParser: gemma4
    reasoningParser: gemma4
    enablePrefixCaching: false
    maxNumBatchedTokens: 160
    enforceEager: true
    disableAiter: true
    rocmCustomPagedAttn: false
    disableHybridKVCacheManager: true
    limitMmPerPrompt: '{"image":0,"audio":0,"video":0}'
    disableLogStats: false
    warmPolicy: ondemand
    hipVisibleDevices: "0"
  nodeSelector:
    kubernetes.io/hostname: cblevins-7900xtx
  resources:
    requests:
      cpu: "4"
      memory: 16Gi
    limits:
      cpu: "8"
      memory: 24Gi
  serviceLabels:
    - gemma4-26b-a4b-gptq-22k
  litellm:
    enabled: true
    servedModelName: gemma4-26b-a4b-gptq-22k
    aliases:
      - gemma4-26b-22k
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"

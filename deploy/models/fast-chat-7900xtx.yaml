apiVersion: ai.flexinfer/v1alpha2
kind: Model
metadata:
  name: qwen3-8b-fast-7900xtx
  namespace: flexinfer-system
spec:
  backend: mlc-llm
  source: pvc://mlc-8b-abliterated-nvme-7900xtx/Qwen3-8B-abliterated-q4f32_1-MLC
  gpu:
    vendor: amd
    shared: 7900xtx-textgen
    priority: 300
    vramEstimateMB: 12000
  serverless:
    enabled: true
    # 2026-05-13: demoted to scale-to-zero. gemma4-26b-a4b-gptq is the warm
    # primary for downstream services (project-mgmt etc.) on this lane; this
    # 8B remains on disk for loom-core qwen3-default/qwen3-8b cold-starts and
    # any explicit fast-chat traffic.
    minReplicas: 0
    idleTimeout: 5m
    coldStartTimeout: 10m
  config:
    mode: server
    jitPolicy: "READONLY"
    modelLibPath: /models/Qwen3-8B-abliterated-q4f32_1-MLC/lib_rocm_gfx1100.so
    maxNumSequence: 4
    maxTotalSeqLength: 32768
    # cblevins-7900xtx exposes both iGPU and dGPU; force the RX 7900 XTX device.
    hipVisibleDevices: "0"
    rocrVisibleDevices: "0"
    gpuDeviceOrdinal: "0"
    # 2026-05-13: explicit on-demand. gemma4-26b-a4b-gptq holds the warm slot
    # on this GPU group; this 8B cold-starts when fast-chat aliases are hit.
    warmPolicy: ondemand
  nodeSelector:
    kubernetes.io/hostname: cblevins-7900xtx
  resources:
    requests:
      cpu: "4"
      memory: 16Gi
    limits:
      cpu: "8"
      memory: 24Gi
  serviceLabels:
    - fast-chat
    - fast-chat-7900
    - fast-text
    - gpt-3.5-turbo
    - copilot
    - qwen3-8b
    - qwen3-default
  litellm:
    enabled: true
    servedModelName: qwen3-8b-fast-7900xtx
    aliases:
      - fast-chat
      - fast-chat-7900
      - fast-text
      - gpt-3.5-turbo
      # 2026-05-08: canonical short aliases consumed by Loom's pkg/aimodels
      # resolver (RoleWeaverSubagent, RoleMillsJudge, RoleCoordinatorDefault,
      # RoleAutofix). See loom-core MR !328 / !329 and
      # services/loom-core/.loom/111-product-spec-weaver-qwen3-integration-2026-05-08.md.
      - qwen3-8b
      - qwen3-default

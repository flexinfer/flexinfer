# Gemma4 26B-A4B GPTQ long-context canary via vLLM on AMD gfx1100.
#
# Experimental 16K lane for the same clean 26B-A4B GPTQ source
# artifact used by the 26B fallback model. This is a separate scale-to-zero canary
# on cblevins-7900xtx so the RWO source PVC stays on the node that already owns
# the working 26B artifact. It must be scaled/tested deliberately and should
# not replace any default alias until the long-context probe passes.
#
# Runtime requirements:
# - standard vLLM ROCm attention path
# - prefix caching disabled
# - eager execution, matching the working 8K primary profile
# - text-only profile on the discrete 7900 XTX
apiVersion: ai.flexinfer/v1alpha2
kind: Model
metadata:
  name: gemma4-26b-a4b-gptq-long
  namespace: flexinfer-system
  annotations:
    flexinfer.ai/promotion-gate: quantized-artifact-v1
    flexinfer.ai/promotion-state: validated-16k-fp8kv-gfx1100-canary
    flexinfer.ai/promotion-validation: passed
    flexinfer.ai/promotion-evidence: docs/dev/gemma4-rocm-status.md#16k-fp8-kv-proof-2026-04-26
    flexinfer.ai/promotion-requires: separate-primary-promotion-change
spec:
  backend: vllm
  image: registry.harbor.lan/flexinfer/runtime@sha256:0b05b32b92e6ab99cd648837a9bf80cf3dd437275b1d97fb71378a9f829cdaac
  source: pvc://gemma4-26b-a4b-gptq/gemma4-26b-a4b-gptq/gptq-w4-g128-attnfp16-clean
  cache:
    # The source artifact already lives on the 7900 XTX node in the primary
    # model PVC. Direct-mount it instead of allocating a duplicate 50Gi cache
    # volume; Longhorn currently cannot schedule that extra NVMe replica.
    strategy: None
  gpu:
    vendor: amd
    # Match the working primary 26B profile on cblevins-7900xtx. That node
    # exposes both the discrete 7900 XTX and the Raphael iGPU as amd.com/gpu;
    # with count=1 the device plugin can hand this canary the iGPU slot, while
    # hipVisibleDevices=0 then pins vLLM to the wrong device. Claim both plugin
    # slots so plugin-local device 0 is deterministically the dGPU.
    count: 2
    shared: 7900xtx-textgen
    # Below the 31B primary and above the 22K probe, so explicit long-context
    # demand can run as a canary without displacing the warm primary.
    priority: 245
    vramEstimateMB: 18000
  serverless:
    enabled: true
    minReplicas: 0
    idleTimeout: 30m
    coldStartTimeout: 15m
  config:
    quantization: gptq
    dtype: "half"
    maxModelLen: 16384
    gpuMemoryUtilization: "0.98"
    kvCacheDtype: fp8_e4m3
    maxNumSeqs: 1
    trustRemoteCode: true
    attentionBackend: TRITON_ATTN
    servedModelName: gemma4-26b-a4b-gptq-long
    enableToolCalling: true
    toolCallParser: gemma4
    reasoningParser: gemma4
    enablePrefixCaching: false
    maxNumBatchedTokens: 160
    # Match the working primary profile: disable torch.compile + CUDAGraph on
    # ROCm/GPTQ, where vLLM warns that GPTQ GEMM and compiled GELU are unstable.
    enforceEager: true
    # Force source-backed ROCm fallback kernels for the long-context canary. vLLM keeps
    # AITER opt-in, but the package still initializes AITER modules; pinning
    # these env-backed switches also disables ROCm custom paged attention.
    disableAiter: true
    rocmCustomPagedAttn: false
    # Gemma4's mixed sliding/full attention KV specs trip vLLM's hybrid manager
    # on this runtime. The 16K profile uses FP8 KV to fit the single 7900 XTX.
    disableHybridKVCacheManager: true
    limitMmPerPrompt: '{"image":0,"audio":0,"video":0}'
    disableLogStats: false
    warmPolicy: ondemand
    hipVisibleDevices: "0"
  nodeSelector:
    kubernetes.io/hostname: cblevins-7900xtx
  resources:
    requests:
      cpu: "4"
      memory: 16Gi
    limits:
      cpu: "8"
      memory: 24Gi
  serviceLabels:
    - gemma4-26b-a4b-gptq-long
  litellm:
    enabled: true
    servedModelName: gemma4-26b-a4b-gptq-long
    aliases:
      - gemma4-26b-long
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"

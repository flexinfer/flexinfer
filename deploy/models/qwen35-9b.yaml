# Disabled from deploy/models/kustomization.yaml.
#
# Historical Qwen3.5-9B manifest retained for rollback/reference only.
# The active Gemma4 rollout now lives in deploy/models/gemma4-e4b-turboquant.yaml.
#
apiVersion: ai.flexinfer/v1alpha2
kind: Model
metadata:
  name: qwen35-9b
  namespace: flexinfer-system
spec:
  backend: vllm
  source: pvc://qwen35-9b-gptq/qwen35-9b-gptq/gptq-w4-g128
  cache:
    strategy: Local
  gpu:
    vendor: amd
    count: 1
    vramEstimateMB: 8000
    shared: 5930k-textgen
    priority: 200
  serverless:
    enabled: true
    minReplicas: 1
    idleTimeout: 30m
    coldStartTimeout: 15m
  config:
    dtype: "half"
    quantization: gptq
    maxModelLen: 4096
    gpuMemoryUtilization: "0.95"
    maxNumSeqs: 2
    enforceEager: true
    trustRemoteCode: true
    servedModelName: qwen35-9b
    enableToolCalling: true
    toolCallParser: hermes
    maxNumBatchedTokens: 2048
    disableLogStats: false
    warmPolicy: primary
  nodeSelector:
    kubernetes.io/hostname: cblevins-5930k
  resources:
    requests:
      cpu: "2"
      memory: 8Gi
    limits:
      cpu: "4"
      memory: 24Gi
  serviceLabels:
    - qwen35-9b
    - qwen35-9b-subagent
  litellm:
    enabled: true
    servedModelName: qwen35-9b
    aliases:
      - qwen35-9b-subagent
      - qwen35-subagent
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"

# Qwen3.5-9B via vLLM on AMD gfx1100 — dedicated on cblevins-5930k
#
# FP16 (~15 GB) — no quantization.
# GPTQ INT4 produces gibberish on ROCm because the GDN (linear_attention)
# layers require higher precision. gptq_gemm kernel is buggy on ROCm and
# moe_wna16 (official method) is CUDA-only. FP16 fits in 24 GB VRAM.
#
# Source: HuggingFace Qwen3.5-9B (abliteration not applied in FP16 mode).
# Image: Unified runtime with vLLM Qwen3.5 support.
#
# maxModelLen=4096 to leave room for KV cache in FP16 mode.
# maxNumSeqs=2 to reduce concurrent memory pressure.
#
apiVersion: ai.flexinfer/v1alpha2
kind: Model
metadata:
  name: qwen35-9b
  namespace: flexinfer-system
spec:
  backend: vllm
  source: HF://Qwen/Qwen3.5-9B
  cache:
    strategy: Local
    size: 20Gi
    storageClass: local-path
  gpu:
    vendor: amd
    count: 1
    vramEstimateMB: 15000
    shared: 5930k-textgen
    priority: 200
  serverless:
    enabled: true
    minReplicas: 1
    idleTimeout: 30m
    coldStartTimeout: 15m
  config:
    dtype: "half"
    maxModelLen: 4096
    gpuMemoryUtilization: "0.95"
    maxNumSeqs: 2
    enforceEager: true
    trustRemoteCode: true
    servedModelName: qwen35-9b
    enableToolCalling: true
    toolCallParser: hermes
    maxNumBatchedTokens: 2048
    disableLogStats: false
    warmPolicy: primary
  nodeSelector:
    kubernetes.io/hostname: cblevins-5930k
  resources:
    requests:
      cpu: "2"
      memory: 8Gi
    limits:
      cpu: "4"
      memory: 24Gi
  serviceLabels:
    - qwen35-9b
    - qwen35-9b-subagent
  litellm:
    enabled: true
    servedModelName: qwen35-9b
    aliases:
      - qwen35-9b-subagent
      - qwen35-subagent
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"

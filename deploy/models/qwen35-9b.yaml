# Qwen3.5-9B via vLLM on AMD gfx1100 — temporary primary on cblevins-7900xtx
#
# GPTQ INT4 (~7.5 GiB), abliterated (skipGDNLayers=true, 3 target layers).
# Source: GPTQ cache PVC — abliteration + quantization pipeline on radeonvii.
# While the 27B rebuild is still in-flight, keep 9B warm on the otherwise idle
# 7900 XTX node so 5930k can stay image-first.
# Runtime: Unified runtime with vLLM Qwen3.5 patches baked in at build time.
#
# maxModelLen=8192 so default LiteLLM/OpenWebUI 8K output requests do not
# immediately bounce at the vLLM layer while 9B is the temporary primary.
# maxNumSeqs=2 to reduce concurrent memory pressure.
#
apiVersion: ai.flexinfer/v1alpha2
kind: Model
metadata:
  name: qwen35-9b
  namespace: flexinfer-system
spec:
  backend: vllm
  source: pvc://qwen35-9b-gptq/qwen35-9b-gptq/gptq-w4-g128
  cache:
    strategy: Local
  gpu:
    vendor: amd
    count: 1
    vramEstimateMB: 8000
    shared: 7900xtx-textgen
    priority: 200
  serverless:
    enabled: true
    minReplicas: 1
    idleTimeout: 30m
    coldStartTimeout: 15m
  config:
    quantization: gptq
    dtype: "half"
    maxModelLen: 8192
    gpuMemoryUtilization: "0.65"
    maxNumSeqs: 2
    enforceEager: true
    trustRemoteCode: true
    servedModelName: qwen35-9b
    enableToolCalling: true
    toolCallParser: hermes
    maxNumBatchedTokens: 2048
    disableLogStats: false
    warmPolicy: primary
  nodeSelector:
    kubernetes.io/hostname: cblevins-7900xtx
  resources:
    requests:
      cpu: "2"
      memory: 8Gi
    limits:
      cpu: "4"
      memory: 24Gi
  serviceLabels:
    - qwen35-9b
    - qwen35-9b-subagent
  litellm:
    enabled: true
    servedModelName: qwen35-9b
    aliases:
      - qwen35-9b-subagent
      - qwen35-subagent
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"

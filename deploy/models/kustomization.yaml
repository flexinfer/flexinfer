apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: flexinfer-system
resources:
  # === cblevins-7900xtx (24 GB gfx1100) — primary orchestrator ===
  # qwen35-27b-opus-distill.yaml and qwen35-9b.yaml are intentionally disabled
  # for the Gemma4 rollout. Keep the manifests on disk for rollback/reference,
  # but do not reconcile them here.
  # 2026-05-13 fleet reshape — two-instance 26B serving + image-gen consolidation:
  # Both 7900 XTX nodes (cblevins-7900xtx and cblevins-5930k) now run the same
  # gemma4-26b-a4b-gptq hybrid artifact as their warm primary. Shared routes
  # (quality-chat / mid-chat / gpt-4 / project-mgmt / gemma4-26b) live in
  # serviceLabels on both Models so the proxy load-balances across them.
  # 5930k's source artifact pulls from Harbor OCI (published by the 7900xtx
  # source modelcache) -- no full pipeline rerun. The Radeon VII takes over
  # ALL image generation (FluxPony + SDXL inpainting). As of 2026-05-16, the
  # two warm Gemma4 26B instances also own fast-chat/default-chat aliases; the
  # old 8B Qwen fallback is disabled so the 7900 XTX lanes stay unambiguous.
  # 31B / 22K / 26B-long canaries stay disabled until their own gates pass.
  # - gemma4-31b-gptq.yaml          # disabled; promoted-state pending dense rebuild
  # - fast-chat-7900xtx.yaml        # disabled 2026-05-16; Gemma4 26B now serves fast-chat/default-chat.
  - gemma4-26b-a4b-gptq.yaml        # vLLM gfx1100 GPTQ INT4 hybrid, warm quality primary @ 16K (7900xtx instance #1)
  - gemma4-26b-a4b-gptq-apc-canary.yaml  # F4-prefix-cache-flip canary; minReplicas=0, low priority, operator-activated kill-test lane (.loom/ralph-f4-prefix-cache-flip-canary-2026-05-26.md)
  - whisper-large-v3-turbo.yaml     # ASR (Slice 3a): vLLM Whisper on gfx1100, demand-driven (priority 400, minReplicas=0) so deploying is a no-op for the 26B until first transcribe. .loom/30-implementation-plan-voice-stack-2026-06-01.md
  # ASR kill-test history: Slice 1 (whisper-kill-test-v3.yaml) was torn down
  # 2026-05-20; the runtime-side gate finally PASSED on v6 2026-05-21 after the
  # mistral_common bump (MR !461/!462) cleared the WhisperProcessor ImportError
  # and MR !464 dropped the --task flag vLLM 0.17+ rejects. v6 evidence:
  # .loom/ralph-whisper-kill-test-v6-evidence-2026-05-21.md (Model Ready,
  # /v1/models returns whisper-large-v3-turbo). The production CR above
  # supersedes the kill-test.
  # - gemma4-26b-a4b-gptq-long.yaml # disabled; superseded by base 26B at 16K (see 2026-05-03 dedupe)
  # 2026-05-05: replaced by Qwen3.6. The old qwen3-30b-a3b canary requested
  # gpu.count=2 and stayed unschedulable after gfx1100 nodes were normalized
  # to one discrete GPU slot.
  # - qwen3-30b-a3b-gptq-int4.yaml  # disabled; busted old Qwen canary
  # 2026-05-07: qwen36 reached Ready but is not usable. Greedy smoke and live
  # profile traffic produce token soup / multilingual junk, and activation is
  # slow enough to block the 5930k shared GPU lane. Keep the manifest on disk
  # for forensic rebuilds only; do not reconcile or advertise it until a
  # coherent deterministic smoke passes and .loom/60-validation-matrix.md is
  # moved out of fail.
  # - qwen36-27b-gptq.yaml            # disabled; broken + slow canary
  # - gemma4-26b-a4b-gptq-22k.yaml  # superseded until 18K-22K is re-qualified
  # gemma4-31b-gptq-long.yaml: SUPERSEDED on 2026-04-25. Canary boot OOM'd at
  # 23.59/24 GiB during weight load — plugin rotation-matrix allocations
  # (~3.5 GiB) plus 31B INT4 weights (20 GiB) leave no headroom for
  # activations or KV. Full analysis + math in
  # docs/dev/gemma4-31b-turboquant-24gb-oom.md. File kept on disk for
  # historical reference; do not reconcile until one of the unblockers
  # from that doc lands.
  # - gemma4-31b-gptq-long.yaml     # vLLM GPTQ INT4 + TurboQuant 16K canary (priority 50)
  # E4B multimodal/turboquant variants disabled during the 26B-A4B rollout.
  # - gemma4-e4b-turboquant.yaml
  # - gemma4-e4b-multimodal.yaml

  # === cblevins-5930k (24 GB gfx1100) — second 26B instance, no image-gen ===
  # 2026-05-13 fleet reshape: this node is now dedicated to gemma4-26b-a4b-gptq
  # instance #2 (warm primary, OCI-pull from the 7900xtx-published artifact).
  # FluxPony moved to cblevins-radeonvii. The 5930k 8B llama.cpp fallback is
  # disabled; fast-chat/default-chat now route to the two warm Gemma4 26B
  # primaries only. See docs/planning/fast-chat-resilience.md for the current
  # decision record.
  - gemma4-26b-a4b-gptq-5930k.yaml  # 2026-06-17: RETIRED to minReplicas 0; 5930k GPU reassigned to qwen35-moe-reasoning-5930k (kept enabled so it can be restored).
  - qwen35-moe-reasoning-5930k.yaml  # 2026-06-17: warm-pinned Qwen3.5-MoE 35B-A3B reasoning lane on cblevins-5930k (vLLM-currency kill-test full pass; graph mode, 32K fp8 KV, 74.6 tok/s).
  # - gemma4-26b-a4b-gptq-5930k-8k-canary.yaml # disabled 2026-05-16; keep XTX lanes to the two 26B primaries.
  # - fast-chat-5930k-llamacpp.yaml # disabled 2026-05-13; 8B path consolidated onto cblevins-7900xtx
  # - fast-chat.yaml                  # disabled MLC variant, kept on disk for one cycle as rollback
  # qwen3-14b-abliterated-v2-5930k.yaml references a GPTQ PVC that is not
  # present in the live cluster; keep disabled until that cache is rebuilt or
  # repointed to an OCI-backed artifact.
  # - qwen3-14b-abliterated-v2-5930k.yaml
  # Deprecated 2026-05-03: Omnicoder returned HTTP 200 but produced corrupted
  # direct-backend output from the staged GPTQ artifact. Keep the manifest on
  # disk for forensic rebuilds, but do not advertise or reconcile it.
  # - omnicoder-9b.yaml

  # === cblevins-radeonvii (16 GB gfx906) — image-gen primary ===
  # 2026-05-13: FluxPony relocated here from cblevins-5930k. The Radeon VII
  # now owns ALL image generation (SDXL text-to-image + SDXL inpainting),
  # both on the `radeonvii-imagegen` shared lane. Disk pressure on the node
  # root FS is the main risk -- monitor /var/lib once both caches are warm.
  # The 1.7B Qwen tool/canary lanes stay for routing experiments.
  - qwen3-1.7b-tools-radeonvii.yaml # llama.cpp GGUF, fast tool-router lane
  - qwen3-1p7b-vllm-radeonvii.yaml  # vllm canary, scaled to 0; explicit canary traffic can preempt CPU fallback
  - qwen3-8b-radeonvii.yaml         # llama.cpp GGUF on gfx906, cold tertiary fast-chat-fallback (Lane 1C 2026-05-25)
  - gemma4-e4b-radeonvii.yaml       # llama.cpp Gemma 3 4B IT GGUF on gfx906, draft for cross-card spec decode (CC-DR-1b precursor, 2026-05-25)
  - gonzalomo-fluxpony-imagegen.yaml # diffusers gfx906, SDXL text-to-image (relocated 2026-05-13 from 5930k)
  - sdxl-inpainting-radeonvii.yaml   # diffusers gfx906, SDXL inpainting
  - bge-radeonvii.yaml               # llamacpp bge-large embeddings on gfx906 HBM2; additive lane (priority 100, serverless, label embeddings-hbm2). Kill-test PASS 2026-06-03; hardware-util arc Sprint 1.
  - bge-reranker-radeonvii.yaml      # llamacpp bge-reranker-v2-m3 on gfx906; co-Active with bge embeddings (priority 115, serverless, label rerank). R5 multi-Active payoff — needs gfx906 features.multiModel + FLEXINFER_RUNTIME_MULTI_MODEL.

  # === cblevins-gtx980ti (6 GB sm_52) ===
  - gemma4-e4b-gguf-gtx980ti.yaml   # llama.cpp GGUF, node-local cache for Maxwell cold starts
  - embeddings.yaml                  # ollama, nomic-embed-text, always warm

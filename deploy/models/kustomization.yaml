apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: flexinfer-system
resources:
  # === cblevins-7900xtx (24 GB gfx1100) — primary text generation ===
  - qwen35-27b-opus-distill.yaml    # vLLM, GPTQ INT4, ~15 GiB VRAM

  # === cblevins-5930k (24 GB gfx1100) — image generation ===
  - gonzalomo-fluxpony-source.yaml   # PVC + download job for Civitai checkpoint
  - gonzalomo-fluxpony-imagegen.yaml # diffusers, FluxPipeline, cpu offload

  # === cblevins-radeonvii (16 GB gfx906) — image editing / inpainting ===
  - sdxl-inpainting-radeonvii.yaml   # diffusers, SDXL inpainting, ~12 GiB VRAM

  # === cblevins-gtx980ti (6 GB sm_52) — embeddings ===
  - embeddings.yaml                  # ollama, nomic-embed-text, always warm

# Warm Mills/loom text lane on cblevins-7900xtx — Qwen3.8-27B INT4 AutoRound.
#
# PROMOTED 2026-09-13 (Flux-managed from this file; the object keeps the name
# it was qualified under so adoption is a no-op for the running pod).
# Research: .loom/10-research-flexinfer-utilization-loom-mills-2026-09-13.md
# §7a. The 7900 XTX had been 0.0015% busy over 30d with the voice pod as its
# only tenant (0 requests in 30d). Operator chose option 7(a): voice moved to
# the warm-pinned Radeon VII tier (orpheus-3b-7900xtx parked at minReplicas 0,
# priority 460) and this lane took the card.
#
# Qualification 2026-09-13 14:38-14:47Z: Ready 6 min after apply (cache 3 min,
# weights 42 s, engine 69 s incl. 51 s first compile — AOT-cached since),
# RDNA3W4A16LinearKernel, KV pool 69,905 tokens fp8 = 1.07x @64K; probes
# ROUTE_OK / 17x23=391 / coherent prose at ~34 tok/s; 2,317-token prompt in
# 2.57 s; orpheus-tts served by the VII in 0.72 s with this lane Ready.
#
# Why it could not co-schedule before: the node exposes amd.com/gpu=2 (dGPU +
# Raphael iGPU); a dedicated vLLM pod must claim count=2 so it never draws the
# iGPU, and the dedicated orpheus pod held one slot. The runtime-managed
# channel (flexinfer-runtime-gfx1100) is vLLM 0.17 without the RDNA3 W4A16
# kernel and single-model — issue #74 (runtime-image CI program) fixes that.
#
# Envelope: same artifact, digest, hfOverrides, TRITON_ATTN and compile-cache
# recipe as the promoted 5930k lane; 64K fp8 KV (pool margin), maxNumSeqs 2 so
# a Mills review lens and a triage call can overlap, minReplicas 1 so it is
# always there, priority 470 (below the RP lane's 500 so a deliberate RP
# restore still wins the card; above parked orpheus 460 / snac 430 / whisper
# 340), vramEstimateMB 23200 = whole card so the multiModel election never
# admits snac (1500) or whisper (4000) beside a 0.94-util vLLM process.
#
# Roles: `mills-warm` (Mills council lenses, audit pool, spinning frames,
# triage/consolidation — gitops k3s/mills/configmap-policy.yaml) and
# `mills-council` (moved here from the 5930k workhorse). Since 2026-10-03
# (owner decision) the Mills research stage and the weaver router/subagent
# (gitops k3s/mills/deployment.yaml FLEXINFER_WEAVER_MODEL, loom-core
# k8s/base WEAVER_*_MODEL) also address this lane: both 27B lanes are now
# 64K / two sequences, and this one never scales to zero or loses its card
# to a video lane (an 8-token probe answered in 0.64 s here against 88.9 s
# behind a research completion on the ondemand 5930k lane). The shadow
# judge followed later the same day (gitops !889). `workhorse`,
# `loom-workhorse` and `reasoning` stay on the 5930k lane.
apiVersion: ai.flexinfer/v1alpha2
kind: Model
metadata:
  name: qwen38-27b-xtx-warm-canary
  namespace: flexinfer-system
  annotations:
    flexinfer.ai/base-model-source: Qwen/Qwen3.8-27B
    # 2026-09-13: scheduler preemption guard. The serving pod carries
    # flexinfer-serving-critical (150000) so it preempts priority-0 CI job
    # pods for CPU on its node (17:11Z: the pod sat Pending on "Insufficient cpu" behind
    # priority-0 CI job pods (1500m each) with "No preemption victims found").
    # Same class the radeonvii retrieval lanes use; the class must exist.
    flexinfer.ai/serving-priority-class: flexinfer-serving-critical
    flexinfer.ai/base-model-posture: clean
    flexinfer.ai/artifact-source: HF://biMEMO/Qwen3.8-27B-int4-AutoRound
    flexinfer.ai/purpose: "Warm-pinned Mills/loom text lane on the 7900 XTX (mills-warm / mills-council)"
    flexinfer.ai/plan: ".loom/10-research-flexinfer-utilization-loom-mills-2026-09-13.md"
    # 2026-10-26 (gfx1100 S4, research §7f): this lane is the context-overflow
    # target of the 5930k workhorse (32K since S4). flexinfer-proxy's lane
    # breaker waits for the first generated token, and its default 120 s
    # budget cut every prompt this TRITON + fp8 lane cannot prefill in 120 s:
    # 33,514 tokens took 119.8 s, and 50K prompts got a proxy 504 while vLLM
    # kept working. 480 s covers a 64K prefill (~380 s extrapolated from the
    # 33.5K point and S3's TRITON curve) with margin, under psyche-
    # simulation's 600 s client timeout. Cost: a wedged XTX card now holds a
    # request up to 480 s before it counts toward the breaker (3 failures
    # open it). Rollback = drop this annotation (default 120 s).
    flexinfer.ai/lane-first-byte-budget: "480s"
    flexinfer.ai/promotion-state: promoted-64k-fp8-graph-warm
    flexinfer.ai/promotion-evidence: "2026-09-13 §7a: Ready +6min, RDNA3W4A16, KV 69,905 tok fp8 (1.07x @64K), probes 3/3 coherent ~34 tok/s, 2.3K-token prompt 2.57 s, orpheus-tts on VII 0.72 s"
spec:
  backend: vllm
  # 2026-09-13 (issue #74 S2, vLLM currency): this lane is the qualification
  # vehicle for `rocm-gfx1100-v026-native-w4a16-0d631512` (vLLM 0.26.0 +
  # RDNA3 W4A16, built 2026-08-01 by publish_serving_rocm_gfx1100_native_w4a16
  # and reproducible from HEAD). The previous pin `2e9652ed` is the 07-21 v023
  # build whose job was repointed to v0.26 in place, so it cannot be rebuilt.
  # Issue #66 (2026-08-16): every lane on this digest must keep
  # attentionBackend TRITON_ATTN (below). Rollback = the 2e9652ed digest.
  # Validation row: .loom/60-validation-matrix.md gfx1100-native-w4a16-2026-09-13.
  # ROLLED BACK 2026-09-13 18:40Z: on d6d18459 the pod crash-looped at startup —
  # the image's bundled vLLM general plugin `flexinfer_vllm_qwen35_text`
  # imports `vllm.model_executor.layers.fla.ops.chunk_scaled_dot_kkt`, which
  # vLLM 0.26 no longer ships (ModuleNotFoundError before the engine starts).
  # The v0.26 build was never qualified for Qwen3.5 lanes; S2 needs a rebuilt
  # native-W4A16 image whose plugin tracks 0.26's FLA layout. Back on v023.
  # 2026-10-22 (issue #74 S2, canary roll): REPINNED to `ad93ae72`
  # (rocm-gfx1100-v026-native-w4a16-a106504c, master a106504c 2026-09-14:
  # vLLM 0.26.0 + the RDNA3 W4A16 kernel, plugin 0.8.0 on 0.26's FLA
  # layout; Harbor tag pinned-ad93ae726bbe; prewarmed on this node by
  # !1106). Why now: Harbor retention deleted `2e9652ed` (row
  # gfx1100-runtime-pins-2026-10-21); it survives only as this node's
  # containerd snapshot under the prewarm DaemonSet, so a reinstall or
  # image GC ends the lane for good, and the digest cannot be rebuilt. The
  # 5930k qualified `ad93ae72` on 2026-09-14 at this 64K / two-sequence
  # envelope (rows gfx1100-native-w4a16-2026-09-14-seqs2 / -096: 3/3
  # probes, 41.3 tok/s vs 41.7 on v023, 65K recall, tools, cancellation,
  # 82-request soak). This lane rolls first as the canary vehicle for the
  # target node; the 5930k workhorse follows on pass (row
  # gfx1100-native-w4a16-2026-10-22). Rollback = `2e9652ed` (still
  # resident here, IfNotPresent): revert this line.
  # 2026-10-24 (issue #74 S2, vLLM currency 0.26 -> 0.32): REPINNED to
  # `cd108c9e` (rocm-gfx1100-v032-native-w4a16-3fc9c37f: the native-W4A16
  # image on the upstream vLLM 0.32.0 ROCm wheel, Dockerfile from !1134 =
  # master 6fcd4af7, 11.6 GB; built off-CI on the 7900xtx docker daemon from
  # that exact commit while the BuildKit group was saturated; prewarmed on
  # both gfx1100 nodes first). Why: 0.26 was six releases behind — Model
  # Runner V2 is the default since 0.29, Qwen3.8 is enabled on ROCm since
  # 0.28, torch 2.13 / Triton 3.8 since 0.31 — and the September model
  # survey's candidates (Glimmer on vLLM, Laguna XS, Smaug-Mini) need
  # >= 0.28. The 0.32 wheel ships gfx1100 code objects, so the image no
  # longer rebuilds vLLM from source; both FlexInfer plugins register on it
  # with fla_autotuners=11 on this card (GPU-visible probe 2026-10-24) and
  # every flag the controller renders exists on 0.32 except
  # `--calculate-kv-scales` (see `calculateKvScales` below). This lane
  # canaries the digest under the 2100 MHz cap — probes + 10-minute
  # concurrency-2 soak, row xtx-vllm-v032-2026-10-24 — and the 5930k
  # workhorse follows on pass. Rollback = `ad93ae72` (resident, Harbor
  # pinned-ad93ae726bbe): revert this line and restore
  # `calculateKvScales: false`.
  # 2026-10-27 (pin hygiene, research serving-gaps §7): REPINNED to
  # `b06b06fe` (rocm-gfx1100-v032-native-w4a16-dc73879c / -c444b5ff, master
  # pipeline 34797; Harbor pinned-b06b06fe1c02; prewarmed on this node by
  # !1184), the CI build of the same Dockerfile as `cd108c9e` plus text
  # plugin 0.9.0, and the image the 5930k workhorse runs. Why: this lane is
  # the workhorse's context-overflow target, so the overflow route no
  # longer switches engine build mid-request-class, and the off-CI
  # `cd108c9e` stops being a production pin. Envelope unchanged: TRITON_ATTN,
  # fp8 KV, 64K, two sequences, no speculativeConfig (plugin 0.9.0 adds the
  # MTP-head policy; this lane builds no draft). Evidence:
  # S3's arm D ran TRITON + fp8 on this digest (row
  # gfx1100-native-w4a16-v032-s3-attn-2026-10-26, 5930k, 40.8 / 40.2 / 34.3
  # tok/s at 512 / 2K / 16K); the roll itself is row
  # xtx-warm-b06b06fe-2026-10-27. The compile-cache path is kept: the cache
  # is keyed by code hash, so the first boot recompiles what changed and may
  # profile a short pool once (KVPoolRecheck relaunches). Rollback =
  # `cd108c9e` (resident, pinned-cd108c9ebf99): revert this line.
  image: registry.harbor.lan/flexinfer/runtime@sha256:b06b06fe1c0265ce207f3fc719c181e8edd18eae50bdb8490c122800b17abfe2
  source: HF://biMEMO/Qwen3.8-27B-int4-AutoRound
  cache:
    strategy: Local
    storageClass: nvme-1r-gpu
    size: 40Gi
    flashLoader:
      enabled: false
    compilationCache:
      enabled: true
      hostPath: /var/lib/flexinfer/compile-cache-qwen38-27b-autoround-7900xtx
      sizeLimit: 4Gi
  gpu:
    vendor: amd
    # Both device-plugin slots (see header); hipVisibleDevices pins the dGPU.
    count: 2
    shared: 7900xtx-textgen
    priority: 470
    vramEstimateMB: 23200
  serverless:
    enabled: true
    minReplicas: 1
    idleTimeout: 12h
    coldStartTimeout: 25m
  config:
    attentionBackend: TRITON_ATTN
    warmPolicy: primary
    dedicatedDeployment: true
    quantization: gptq
    # 2026-09-13: `architectures` pinned in-process (issue #74 incident #2).
    # The runtime DaemonSet's entrypoint rewrote this lane's on-disk
    # config.json to the text-only Qwen3_5ForCausalLM class (node-wide
    # /models pass), and vLLM 0.23 then died on the first request with
    # "M-RoPE support is not implemented". hf-overrides is applied before
    # architecture resolution, so the lane loads the VL-layout class it was
    # qualified on regardless of what the cache says on disk.
    hfOverrides: '{"architectures":["Qwen3_5ForConditionalGeneration"],"quantization_config":{"quant_method":"gptq","bits":4,"group_size":128,"sym":true,"desc_act":false,"lm_head":false,"modules_in_block_to_quantize":["self_attn.q_proj","self_attn.k_proj","self_attn.v_proj","self_attn.o_proj","mlp.gate_proj","mlp.up_proj","mlp.down_proj","linear_attn.in_proj_qkv","linear_attn.in_proj_z","linear_attn.out_proj"]}}'
    dtype: half
    languageModelOnly: true
    maxModelLen: 65536
    maxNumSeqs: 2
    maxNumBatchedTokens: 4096
    enableChunkedPrefill: true
    # false since 2026-10-03 (see the prefix-caching note below): harmless
    # with the full pool, and it keeps two requests overlapping if a boot
    # profiles a short pool.
    schedulerReserveFullISL: false
    # 2026-10-22 (vLLM 0.26 roll, !1107): 0.94 -> 0.96. vLLM >= 0.21 charges
    # cudagraph capture memory to this budget (boot log: "0.94 is equivalent
    # to 0.9232 without CUDA graph memory profiling"), so on 0.26 the same
    # 0.94 profiled 103,517 tokens (1.58x at 64K) against 132,561 (2.02x) on
    # 0.23, and a cold-compile-cache boot left 1.54 GiB (< the 2.15 GiB one
    # 64K request needs) and crashed once before the warm retry passed. 0.96
    # is the value this digest was qualified with on the 5930k (rows
    # gfx1100-native-w4a16-2026-09-14-seqs2 / -096: 129,615 tokens warm) and
    # restores the 2x pool; the card hosts nothing else (vramEstimateMB 23200
    # = whole card). Rollback = 0.94 (1.58x, still above the KVPoolShort
    # line of 1.5x).
    gpuMemoryUtilization: "0.96"
    kvCacheDtype: fp8_e4m3
    # `calculateKvScales: false` left with the 0.32 repin (2026-10-24): vLLM
    # 0.28 removed the deprecated runtime KV-scale calculation together with
    # its CLI flag, so the controller must not render
    # `--no-calculate-kv-scales` any more (vllm serve rejects unknown flags).
    # Behaviour is unchanged — fp8 KV with static scales, which is exactly
    # what `false` selected. Restore the key only with a < 0.28 image.
    enforceEager: false
    # Hybrid-GDN prefix caching (owner decision 2026-10-03), the recipe the
    # 9B RP primary has run since 2026-07-25 (f90b4fbfe, flexinfer #67) on
    # this same runtime digest, dtype half and fp8 KV: the flag must be
    # explicit (vLLM 0.23 boots hybrid lanes APC-off), "align" is the only
    # GDN-supported cache mode (it rounds the attention block up to the
    # mamba page — read the boot line "Setting attention block size to N
    # tokens"; hits are counted in whole blocks, so prompts shorter than one
    # block report cached_tokens null), bf16 SSM state halves the recurrent
    # checkpoint so the block shrinks and more prefixes stay resident, and
    # prompt-token details expose cached_tokens / X-Flexinfer-Cached-Tokens.
    # Why here: weaver loops re-send an append-only history every iteration,
    # Mills retries resend the same prompt, and prefill on this lane runs at
    # ~1.4K tok/s. Measured 2026-10-03 16:57Z after the roll: a 7,627-token
    # prompt took 12.96 s cold and 1.34 s / 1.27 s on repeats with
    # cached_tokens 7200 (9 blocks of 800; bf16 SSM state shrank the block
    # from 1568), needle and arithmetic answers unchanged.
    # Pool: the first APC boot (!1076) profiled "GPU KV cache size: 70,004
    # tokens" (1.07x); the relaunch under !1077 with identical settings
    # profiled 132,561 tokens (2.02x), the same pool as APC-off, so it is
    # NOT a cost of prefix caching (the !1077 commit message said otherwise
    # and is wrong). The pattern across both lanes on 2026-10-03: the FIRST
    # boot after a change that invalidates the torch.compile / cudagraph
    # cache profiles ~70K (the cold compile/autotune inflates the peak that
    # vLLM's profile run measures: 46 s between the block-size and KV lines
    # here against 17 s on the warm relaunch), and a pod deleted right
    # afterwards gets the full pool from the warm hostPath cache. After any
    # roll inspect status.kvPool (kvCacheTokens/maxConcurrency) and KVPoolShort for the automatic recheck.
    # Verified
    # 2026-10-03 17:18Z: three concurrent 400-token generations 10.4 s /
    # 19.8 s / 10.5 s against 10.2 s alone, engine "Running: 2 reqs".
    # schedulerReserveFullISL below stays false: harmless at 2 x 64K <=
    # 132K, identical to the workhorse, and it keeps two requests
    # overlapping if a boot ever profiles a short pool again.
    # Rollback = enablePrefixCaching: false and drop the three keys.
    enablePrefixCaching: true
    mambaCacheMode: "align"
    mambaSsmCacheDtype: "bfloat16"
    enablePromptTokensDetails: true
    disableAiter: true
    rocmCustomPagedAttn: false
    hipVisibleDevices: "0"
    trustRemoteCode: true
    defaultChatTemplateKwargs:
      enable_thinking: false
    enableToolCalling: true
    toolCallParser: qwen3_coder
    reasoningParser: qwen3
    servedModelName: qwen38-27b-xtx-warm-canary
    disableLogStats: false
    failOnEnvironValidation: false
  # 2026-10-10 14:35Z TEMPORARY: lane taken out of scheduling. The 7900 XTX
  # drops off the PCIe bus under its first sustained load on every boot
  # (10-04, 10-06, 10-07 06:15Z, 10-10 00:35Z, 10-10 14:2xZ — the last two on
  # fresh boots, the last with amdgpu.runpm=0, DPM pinned high and the power
  # cap at its 294 W minimum), and each activation attempt leaves a vLLM
  # process in state D on the host. With no node matching this selector the
  # Model reports Schedulable=False / NoMatchingNodes and the proxy answers
  # callers with an immediate 503 instead of a 25-minute cold-start timeout.
  # Restore `kubernetes.io/hostname: cblevins-7900xtx` once the card has been
  # reseated / re-cabled and survives a load soak.
  # 2026-10-21 23:59Z load soak FAILED on the rebooted host (Ubuntu 24.04.3,
  # 6.14.0-24, amdgpu.runpm=0, DPM high, link x16 Gen4 at boot, no amdgpu
  # errors in the first 24 h of uptime): an in-pod fp16 8192x8192 matmul burn
  # (flexinfer-runtime-gfx1100 pod, ROCR_VISIBLE_DEVICES=0) held 70 TFLOPS at
  # 283-308 W / 73 C junction, then at +2m41s the SMU stopped answering
  # ("Failed to get current clock freq", "Failed to retrieve enabled
  # ppfeatures", "Failed to export SMU metrics table" x1.4K/min), the PCIe
  # link reads Unknown, and rocminfo plus the ttm kworker sit in state D.
  # Same signature as 10-04..10-10, so the fault is not runtime-side. The
  # selector stays parked; evidence row `xtx-pcie-soak-2026-10-21` in
  # .loom/60-validation-matrix.md.
  # 2026-10-22 13:19Z second soak FAILED under a lower-draw posture (DPM auto,
  # 294 W floor, overdrive max sclk 1700 MHz, ASPM off, after a hard power
  # cycle): the SMU hung within ~1 min at 227-230 W / 1659 MHz / 58 C. Draw is
  # not the trigger; sustained compute is. Software knobs are exhausted; next
  # step is physical (swap the card with the 5930k's XTX to tell card from
  # host/PSU). Row `xtx-pcie-soak-2026-10-22`.
  # 2026-10-22 15:36Z third soak PASSED after moving the host from kernel
  # 6.14.0-24 to 7.0.0-38 (Ubuntu 24.04.5 HWE; same posture, same SMU
  # 78.130.0 / MES 128 firmware): 600 s at 56.8 TFLOPS, 224-233 W, 79 C,
  # zero SMU errors. First sustained load survived since 10-04; the 6.14
  # amdgpu driver is the prime suspect. Row `xtx-pcie-soak-2026-10-22b`.
  # Selector still parked here because this lane's digest `2e9652ed` is no
  # longer in Harbor (pull policy Always): restore the hostname together with
  # a startable image (IfNotPresent from !1097, or a repin) and soak the lane.
  # 2026-10-22 16:05Z RESTORED (operator decision): kernel 7.0.0-38 soak passed
  # (row `xtx-pcie-soak-2026-10-22b`) and !1097 is merged, so this lane starts
  # from the image resident on the node (IfNotPresent for digest pins). This
  # boot is the vLLM-level soak; park again (`cblevins-7900xtx-gpu-offline`)
  # if the SMU hangs under real load.
  # 2026-10-22 23:16Z PARKED AGAIN (the rule above): the card dropped off the
  # bus 2m54s into the first concurrency-2 soak on the vLLM 0.26 image
  # (!1107) under the cap-free posture: 40/40 completions at 37 tok/s per
  # stream, host 302-307 W / 2780-2837 MHz / 69-73 C junction, then the
  # engine stalled (requests hung 371 s), the controller killed the pod at
  # 23:22:54Z (EngineStalled), dmesg logged `SMU: bus error for message:
  # TransferTableSmu2Dram(18) response:0xFFFFFFFF` from 23:23:13Z and
  # `device lost from bus!` at 23:27:33Z; rocm-smi dead, 17 D-state tasks,
  # the replacement pod never Ready. Same signature as 10-04..10-22, but
  # the first on kernel 7.0.0-38 and the first at uncapped clocks (the 7.0
  # passes were a <=2100 MHz burn and vLLM 0.23 at 1653-1748 MHz under the
  # 1700 MHz cap). The 0.26 functional canary had passed (row
  # gfx1100-native-w4a16-2026-10-22: identical answers, 43.0 tok/s). Needs
  # a hard power cycle; restore the hostname only with a posture decision
  # (clock cap back?) and another soak. Image pin stays on ad93ae72.
  # 2026-10-23 ~19:00Z RESTORED (operator decision, posture: 2100 MHz cap).
  # The host was hard power-cycled at 02:35Z and ran 16 h idle on kernel
  # 7.0.0-38 with zero SMU / amdgpu errors (link x16 Gen4, gpu.health=ok).
  # Both kernel-7.0 passes were at <= 2100 MHz (the 10-22 cap-free burn sat at
  # ~2100 MHz on the 294 W floor; vLLM 0.23 ran 1653-1748 MHz under the
  # 1700 MHz cap) and the one kernel-7.0 drop was at uncapped 2780-2837 MHz,
  # so the boot unit (/usr/local/sbin/amdgpu-power-pin.sh,
  # amdgpu-power-pin.service) now applies DPM auto + the 294 W floor + an
  # overdrive max sclk of 2100 MHz, applied live before this restore. This
  # boot is the vLLM 0.26 soak on ad93ae72 (row `xtx-vllm-soak-2026-10-23`).
  # The GPU health sentinel (!1104 / !1112) parks the lane by itself if the
  # card drops (Schedulable=False / GPUDegraded); the offline selector above
  # is now only the manual fallback.
  nodeSelector:
    kubernetes.io/hostname: cblevins-7900xtx
  resources:
    requests:
      cpu: "4"
      memory: 16Gi
      # 2026-09-13: disk-pressure eviction guard, same reasoning as the
      # workhorse lane (CI job pods share this node; pods with no
      # ephemeral-storage request are evicted before CI pods).
      ephemeral-storage: 2Gi
    limits:
      cpu: "8"
      memory: 40Gi
  serviceLabels:
    - mills-warm
    - mills-council
    - xtx-warm
  litellm:
    enabled: true
    servedModelName: qwen38-27b-xtx-warm-canary
    aliases:
      - qwen38-27b-xtx-warm-canary
      - mills-warm
      - mills-council
      - xtx-warm
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

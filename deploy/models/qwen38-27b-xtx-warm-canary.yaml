    - qwen38-27b
    - workhorse
    - loom-workhorse
    - reasoning
  litellm:
    enabled: true
    servedModelName: qwen38-27b-xtx-warm-canary
    aliases:
      - qwen38-27b-xtx-warm-canary
      - mills-warm
      - mills-council
      - xtx-warm
  tolerations:

# Slice 1 vLLM-currency kill-test — flexinfer Model CR path.
# Serves the new Qwen3.5-MoE-VL 35B-A3B (text-only GPTQ quant) on the official
# AMD rocm/vllm gfx110X image (vLLM 0.19.1), via the flexinfer controller so the
# shared-GPU group coordinates the gfx1100 handoff (a raw pod could not claim
# the GPU held by the runtime DaemonSet).
#
# VERDICT (2026-06-17): FULL PASS. The kill-test's question — "can a current
# vLLM serve, on ROCm gfx1100, an arch the old vLLM (0.17.0) rejects?" — is YES,
# and it serves COHERENTLY. vLLM 0.19.1 loads this hybrid linear-attention
# (gated-deltanet/mamba) + 256-expert MoE arch, runs the GDN/FLA + rotary kernels
# on gfx1100, allocates a hybrid KV cache (42,432 tokens, 9.24x concurrency), and
# returns correct answers ("The capital of France is" -> " Paris."; a coherent
# reasoning trace for "what is photosynthesis?"). FIVE layered blockers were hit
# and ALL SOLVED — this file (startup plugin + hfOverrides) is the full recipe:
#
#   1. arch unregistered: the artifact says architectures=[Qwen3_5MoeForCausalLM]
#      which vLLM 0.19.1 has as a CLASS (qwen3_5.py:553, the multimodal wrapper's
#      inner language_model) but does NOT register as a top-level servable arch.
#      Qwen3NextForCausalLM -> AttributeError decoder_sparse_step;
#      Qwen3_5MoeForConditionalGeneration (multimodal) -> "no module named 'model'"
#      (it wants language_model.*+visual.*, the quant is text-only model.*).
#      FIX: the startup plugin below registers Qwen3_5MoeForCausalLM via the
#      vllm.general_plugins entry-point (runs in parent + EngineCore subprocess).
#   2. mRoPE position shape: top-level rope_parameters.mrope_section makes
#      uses_mrope True -> positions [3,N], but the text class builds a standard
#      rotary expecting [N] -> "query, key and positions must have the same
#      batch_size and seq_len". FIX: hfOverrides strips mrope (text needs none).
#   3. hybrid KV page unify: the text class is not marked IsHybrid, so vLLM skips
#      the mamba/attention page-size alignment -> "page size ... not divisible ...
#      Cannot unify". FIX: plugin sets C.is_hybrid=True + grafts the Qwen3.5
#      get_mamba_state_{shape,dtype,copy_func} classmethods from the multimodal
#      class so HybridAttentionMambaModelConfig pads the mamba page to equal the
#      attention page (the "Padding mamba page size 1.49%" path).
#   4. routed experts skipped: the gptqmodel fused-MoE GPTQ checkpoint names the
#      256 experts model.layers.N.moe.{gate_up_proj,down_proj}, but vLLM expects
#      mlp.experts.* -> all 240 expert tensors silently skipped -> incoherent
#      (repetition-loop) output. FIX: plugin wraps load_weights to rename
#      .moe.gate_up_proj/.moe.down_proj -> .mlp.experts.* (drops skip count to 0).
#   5. GPTQ fused-MoE expert loader bug: with experts routed in, vLLM's
#      fused_expert_params_mapping maps experts.down_proj -> experts.w2_weight
#      (the UNQUANTIZED name), so load_fused_expert_weights looks up
#      'experts.w2_weight.qweight' -> KeyError; the GPTQ FusedMoE param (both
#      gptq_marlin + moe_wna16) is 'experts.w2_qweight'. FIX: plugin monkeypatches
#      Qwen3_5Model.load_fused_expert_weights to rewrite {w13,w2}_weight.{qweight,
#      scales,qzeros,g_idx} -> {w13,w2}_{...} before lookup, and gracefully skips
#      sub-tensors the quant method did not create (e.g. sym -> no qzeros). This
#      is a real vLLM 0.19.1 bug (its Qwen3.5 expert mapping is unquantized-only);
#      upstreaming the fix would let any GPTQ Qwen3.5-MoE serve without the plugin.
#
# Requires the controller hfOverrides passthrough (MR !627) + per-model command
# override (MR !628).
#
# PROMOTION (2026-06-17): warm-pinned reasoning lane on cblevins-5930k,
# REPLACING the low-traffic gemma4-26b-a4b-gptq-5930k twin (set to minReplicas 0
# in the same change). Benchmark-tuned: graph mode (74.6 tok/s single-stream,
# 7.85x over eager), fp8 KV @ 32K ctx (122,208 KV tokens), maxNumSeqs 4
# (~176 tok/s agg). FOLLOW-UP: bake the q35plugin into the image to drop the
# startup pip-install (the plugin is a workaround for a real vLLM 0.19.1
# Qwen3.5 GPTQ-MoE expert-loader bug — also an upstream-PR candidate).
apiVersion: ai.flexinfer/v1alpha2
kind: Model
metadata:
  name: qwen35-moe-reasoning-5930k
  namespace: flexinfer-system
  annotations:
    flexinfer.ai/promotion-state: vllm-currency-killtest-fullpass-2026-06-17
    flexinfer.ai/promotion-evidence: deploy/debug/qwen36-currency-canary-model.yaml
spec:
  backend: vllm
  # Official AMD prebuilt vLLM 0.19.1 (ROCm 7.13 / torch 2.10), mirrored to Harbor.
  image: registry.harbor.lan/flexinfer/vllm:rocm7.13-gfx110X-vllm0.19.1
  source: pvc://llm-models-nfs/qwen36-35b-a3b-reasoning/gptq-w4-g128
  cache:
    hostPath: /var/lib/flexinfer/models
    size: 50Gi
    storageClass: local-path
    strategy: SharedPVC
  config:
    # Official rocm/vllm image's entrypoint is not a flexinfer serve-wrapper, so
    # supply the launcher explicitly (the backend Args are appended after it).
    #
    # The artifact is a TEXT-ONLY GPTQ quant (keys: model.*) of the multimodal
    # Qwen3.5-MoE-VL. vLLM 0.19.1 registers only the multimodal wrapper
    # Qwen3_5MoeForConditionalGeneration (expects language_model.* + visual.*),
    # which rejects the text-only checkpoint ("no module named 'model'"). The
    # matching text class Qwen3_5MoeForCausalLM EXISTS in vllm (qwen3_5.py:553,
    # the wrapper's inner language_model) but is not registered as a top-level
    # arch. This wrapper installs a tiny vllm.general_plugins entry-point that
    # registers it in every process (parent + EngineCore subprocess), then
    # launches the OpenAI API server. base64 keeps the YAML/shell escaping clean.
    command:
      - bash
      - -lc
      - 'set -e; D=/tmp/q35build; mkdir -p $D/q35plugin; echo  | base64 -d > $D/q35plugin/__init__.py; echo  | base64 -d > $D/pyproject.toml; pip install -e $D --no-deps -q; exec python3 -m vllm.entrypoints.openai.api_server "$@"'
      - vllm
    quantization: gptq
    dtype: half
    # Arch remap to the text-only class registered by the startup plugin above.
    # (Qwen3NextForCausalLM wanted decoder_sparse_step; the multimodal
    # Qwen3_5MoeForConditionalGeneration rejected the text-only weight names.)
    #
    # rope_parameters is also overridden to STRIP the multimodal mRoPE keys
    # (mrope_section / mrope_interleaved). vLLM's uses_mrope keys off the
    # top-level rope_parameters.mrope_section and makes the runner emit mRoPE
    # positions of shape [3, N]; but the text class builds a STANDARD rotary
    # (rope_type=default) that expects [N], so the rotary op crashed with
    # "query, key and positions must have the same batch_size and seq_len"
    # (3N != N). Text-only serving needs no mRoPE (it only encodes image/video
    # tile positions), so removing mrope_section makes uses_mrope False -> [N].
    hfOverrides: '{"architectures":["Qwen3_5MoeForCausalLM"],"rope_parameters":{"rope_type":"default","rope_theta":10000000,"partial_rotary_factor":0.25}}'
    # Benchmark-tuned config (2026-06-17, gfx1100). fp8 KV (storage-only on
    # gfx1100, halves KV bytes) + util 0.98 -> 122,208 KV tokens (2.88x of the
    # 16K/fp16 baseline's 42,432), enabling full 32K context at 13.5x concurrency.
    # enforceEager: false is the big win — vLLM uses VLLM_COMPILE + FULL_AND_
    # PIECEWISE cudagraph (mamba/GDN ops split out, run eager; rest captured),
    # lifting single-stream decode from 9.5 -> 74.6 tok/s (7.85x) and aggregate
    # to ~176 tok/s @ maxNumSeqs=4. Cost: cold start adds ~8s compile+capture
    # (graph cached under /cache); a scale-to-zero lane recompiles each cold
    # start unless that compile dir is on a persistent volume.
    maxModelLen: 32768
    maxNumSeqs: 4
    kvCacheDtype: fp8_e4m3
    gpuMemoryUtilization: "0.98"
    enforceEager: false
    trustRemoteCode: true
    servedModelName: qwen35-moe-reasoning-5930k
    # Reasoning model: separate <think>...</think> blocks in the API response.
    reasoningParser: qwen3
    enableToolCalling: true
    toolCallParser: hermes
    # Warm-pinned primary of the 5930k lane (replaces the gemma twin).
    warmPolicy: primary
  gpu:
    count: 1
    # Primary of the 5930k-textgen group at priority 360, ABOVE the retired gemma
    # twin (350, minReplicas 0). Higher priority guarantees this warm lane wins
    # leader election even if the idle twin briefly reclaims the GPU during a
    # restart (parity 350 left them in a standoff during the live cutover; a
    # one-time forcePromotion took leadership and is not needed in steady state).
    priority: 360
    shared: 5930k-textgen
    vendor: amd
    vramEstimateMB: 20000
  nodeSelector:
    kubernetes.io/hostname: cblevins-5930k
  resources:
    limits:
      cpu: "4"
      memory: 16Gi
    requests:
      cpu: "2"
      memory: 8Gi
  serverless:
    enabled: true
    # Warm-pinned (always hot) so the graph-compile cost is paid once per
    # (re)start, not per request.
    minReplicas: 1
    # 25m budget so the controller sizes vLLM's startupProbe to cover the first
    # graph-capture compile (same as the gemma twin used).
    coldStartTimeout: 25m0s
    idleTimeout: 30m0s
  tolerations:
    - effect: NoSchedule
      key: node-role.kubernetes.io/control-plane
      operator: Exists
  # Dedicated label only (NOT the gemma fleet's shared labels, and NOT the
  # existing shared `reasoning` route served by qwen3-14b-claude-distill — adding
  # this 35B there would silently change that route's load-balancing; opt in
  # later if desired). The retired twin's gemma routes (quality-chat, gpt-4, ...)
  # continue to serve via the 7900xtx primary.
  serviceLabels:
    - qwen35-moe-reasoning-5930k
  litellm:
    enabled: true
    servedModelName: qwen35-moe-reasoning-5930k
    aliases:
      - qwen35-reasoning
      - qwen3.5-moe-reasoning

# gte-Qwen2-1.5B-instruct embeddings on the 5930k, CPU backend — stable
# 1536-dim twin of gte-qwen2-1p5b-radeonvii.
#
# Why (2026-08-30): the radeonvii lane is the fleet's primary write-path
# embedder (loom-core agent-context/pm/codebase AND the daemon PDOS entity
# index), but cblevins-radeonvii flaps on root-disk pressure (60G longhorn +
# kubelet staging bursts on a 127G LV) — every eviction storm kills the
# embedder mid-batch. The daemon's 11K-entity vector backfill stalled on
# exactly this. This twin runs CPU-only on the stable 5930k: zero VRAM
# contention with the 5930k text lanes, and a 1.5B Q8 embed pass is fast
# enough on CPU (~100-300ms/doc) for both write paths and backfills.
#
# Same vector space as the radeonvii lane (identical GGUF), so consumers can
# switch between them freely. Distinct served name + aliases — deliberately
# NOT reusing the radeonvii lane's aliases to avoid routing-table collisions.
#
apiVersion: ai.flexinfer/v1alpha2
kind: Model
metadata:
  name: gte-qwen2-1p5b-cpu-5930k
  namespace: flexinfer-system
spec:
  backend: llamacpp
  # Digest the twin ran on 2026-10-31 under the controller's unpinned CPU
  # default (ghcr.io/ggml-org/llama.cpp:server); pinned so a roll cannot
  # change llama.cpp under the measured capacity curve.
  image: ghcr.io/ggml-org/llama.cpp:server@sha256:b32890309c1a33a534a01b0b461e953dc2c5a6bac20213abcf48e22847a19c85
  source: HF://second-state/gte-Qwen2-1.5B-instruct-GGUF
  cache:
    size: 3Gi
    storageClass: nvme-1r
    strategy: SharedPVC
  gpu:
    vendor: cpu
  serverless:
    enabled: true
    # Warm-pinned like its radeonvii twin: it exists to be the always-there
    # fallback, so it must not cold-start behind a wake it can't receive.
    minReplicas: 1
    idleTimeout: 30m
    coldStartTimeout: 5m
  config:
    ggufFile: gte-Qwen2-1.5B-instruct-Q8_0.gguf
    contextSize: 1024
    nGPULayers: 0
    batchSize: 2048
    ubatchSize: 512
    # 12 of the node's 14 physical cores; see resources below.
    threads: 12
    embedding: true
    # gte-Qwen2 GGUF defaults to pooling 'none' (token-level), which the
    # OpenAI-compatible /v1/embeddings endpoint rejects. Qwen2 instruct
    # embedding models use last-token pooling.
    pooling: last
    fitOff: true
    metrics: true
    hipVisibleDevices: "-1"
    rocrVisibleDevices: "-1"
  nodeSelector:
    kubernetes.io/hostname: cblevins-5930k
  # Sized for 2 req/s sustained as the VII lane's failover (D6, matrix row
  # gfx906-retrieval-swap-safety-2026-10-31). Production-shaped singles
  # (~8 tokens) cost ~250 ms of 6 threads; closed loop the twin tops out at
  # ~4 req/s, CFS-throttled at the 6-core limit. Open loop through the proxy:
  # 2 req/s p95 0.93 s on 3.0-3.7 cores, 3 req/s p95 1.85 s on 4.6-5.1 cores.
  #
  # Threads 6 -> 12 and limit 6 -> 14 (KT-RET K2, 2026-11-02): the 5-min park
  # sent the twin ~5.6 req/s (the 2 req/s harness plus ~3.6 req/s of rerouted
  # production), and one production input of 956 tokens held its single
  # llama.cpp decode for 12.4 s at 82.5 tokens/s; every slot waited behind it,
  # which was the whole 60 s stall (park p95 8.5 s). Prompt processing is
  # compute-bound, the pod was CFS-throttled in 17-24 % of periods at
  # threads = limit = 6, and "cblevins-5930k" is a Xeon E5-2680 v4 (14 cores /
  # 28 threads, 25 allocatable) whose busy CPUs ran p50 2.7 / p99 11.4 of 28
  # over the week before. The limit leaves two cores above the threads for the
  # server's own threads. The request stays at the 2 req/s working set.
  resources:
    requests:
      cpu: "4"
      memory: 3Gi
    limits:
      cpu: "14"
      memory: 5Gi
  # Distinct label so it does NOT join the default `embeddings`/`rag` routing
  # group; addressed explicitly via its served-model name/aliases.
  serviceLabels:
    - embeddings-1536-cpu
  litellm:
    enabled: true
    servedModelName: gte-qwen2-1p5b-cpu-5930k
    aliases:
      - gte-qwen2-1.5b-cpu

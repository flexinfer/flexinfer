apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gonzalomo-fluxpony-source
  namespace: flexinfer-system
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 25Gi
  storageClassName: nvme-1r
---
apiVersion: batch/v1
kind: Job
metadata:
  name: gonzalomo-fluxpony-source-seed
  namespace: flexinfer-system
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: cblevins-5930k
      containers:
        - name: downloader
          image: python:3.11-slim
          command:
            - python
            - -c
          args:
            - |
              import os
              import shutil
              import urllib.request

              url = "https://civitai.com/api/download/models/2750059"
              dest = "/models/gonzalomoXLFluxPony_v30FluxDAIO.safetensors"
              marker = dest + ".downloaded"
              tmp = dest + ".part"
              token = os.environ.get("CIVITAI_TOKEN", "").strip()

              if os.path.exists(marker) and os.path.exists(dest):
                  print(f"Model already present at {dest}")
                  raise SystemExit(0)

              if not token:
                  raise SystemExit("CIVITAI_TOKEN is not set")

              os.makedirs(os.path.dirname(dest), exist_ok=True)
              if os.path.exists(tmp):
                  os.remove(tmp)

              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "User-Agent": "flexinfer-gitops/1.0",
                  },
              )
              with urllib.request.urlopen(req, timeout=60) as resp, open(tmp, "wb") as fh:
                  shutil.copyfileobj(resp, fh, length=1024 * 1024)

              os.replace(tmp, dest)
              with open(marker, "w", encoding="utf-8") as fh:
                  fh.write("ok\n")
              print(f"Downloaded {dest}")
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 2Gi
          env:
            - name: CIVITAI_TOKEN
              valueFrom:
                secretKeyRef:
                  name: civitai-token
                  key: CIVITAI_TOKEN
          volumeMounts:
            - name: model-store
              mountPath: /models
      volumes:
        - name: model-store
          persistentVolumeClaim:
            claimName: gonzalomo-fluxpony-source

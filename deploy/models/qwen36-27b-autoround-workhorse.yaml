# Qwen3.6-27B dense INT4 AutoRound — PARKED FALLBACK (2026-08-16).
#
# Base workhorse/loom-workhorse/mills-council/reasoning role aliases moved to
# qwen38-27b-autoround-workhorse (identical serving contract, generational
# agentic gains — research doc 8g + qwen38 canary ladder). This lane keeps
# ONLY its unique qwen36-27b alias and stays demand-only as the rollback
# target until the 3.8 lane soaks; remove after soak.
#
# Original research + qualification: .loom/10-research-gfx1100-model-quality-2026-08-15.md
# (slices 1-3, 2026-08-16). Quality rationale at promotion time: 77.2
# SWE-bench Verified / 59.3 Terminal-Bench 2.0 / 48.2 SkillsBench as a dense
# 27B, AutoRound W4 ~+2% PPL vs the ~+8.5% vanilla-GPTQ self-quants.
#
# Qualified envelope (do not casually change):
#   - 64K, fp16 KV, graph mode (FULL_AND_PIECEWISE, GDN split out), no MTP.
#   - Needle recall proven at 32K and 64K; native-262K arch, no RoPE cliff.
#   - Decode: ~39 tok/s short-context, ~12-25 tok/s at the 2-16K working set,
#     collapsing to ~4 tok/s @30K / 2 @60K — the fleet-wide RDNA3
#     unified-Triton decode ceiling (35B lanes share it). fp8 KV would double
#     the pool but halves long-context decode again (fp8 dequant tax) — keep
#     fp16 until the runtime attention kernel gains split-K (backlog task).
#   - MTP head exists but is disabled: ~33% pos-0 acceptance = net zero.
#     A retry ALSO requires re-patching quantization_config in the cache PVC
#     (the draft config re-reads disk and ignores hfOverrides).
apiVersion: ai.flexinfer/v1alpha2
kind: Model
metadata:
  name: qwen36-27b-autoround-workhorse
  namespace: flexinfer-system
  annotations:
    flexinfer.ai/base-model-source: Qwen/Qwen3.6-27B
    flexinfer.ai/base-model-posture: clean
    flexinfer.ai/artifact-source: HF://Intel/Qwen3.6-27B-int4-AutoRound
    flexinfer.ai/plan: ".loom/10-research-gfx1100-model-quality-2026-08-15.md"
    flexinfer.ai/promotion-state: slice4-promoted-64k-fp16-graph
    flexinfer.ai/promotion-evidence: "canary qwen36-27b-clean-autoround-canary slices 1-3 2026-08-16: 6/6 gauntlets (eager, graph, MTP), needle 1/1 @32K+64K, 39 tok/s graph decode, RDNA3W4A16LinearKernel"
spec:
  backend: vllm
  # 2026-10-25 (issue #74 S2, vLLM currency): REPINNED from the vLLM 0.23
  # runtime `2e9652ed` that all three qualification slices passed against.
  # That digest is gone from Harbor (retention, 2026-10-21) and from this node
  # (image GC after the 2026-10-24 DiskPressure episode), so the lane could not
  # start. The new pin is the CI-built vLLM 0.32 native-W4A16 image from
  # master pipeline 34797 (b06b06fe, rocm-gfx1100-v032-native-w4a16-dc73879c;
  # same Dockerfile lineage as the workhorse's cd108c9e, plus the newer text
  # plugin): the native RDNA3 W4A16 kernel ships in the upstream 0.32 wheel. Every flag this lane renders exists in 0.32
  # except --no-calculate-kv-scales (key dropped below). Re-qualified by a
  # boot + probe on 2026-10-25 (matrix row parked-5930k-lanes-v032-2026-10-25).
  image: registry.harbor.lan/flexinfer/runtime@sha256:b06b06fe1c0265ce207f3fc719c181e8edd18eae50bdb8490c122800b17abfe2
  source: HF://Intel/Qwen3.6-27B-int4-AutoRound
  cache:
    # 19.0 GB artifact. Serving needs NO on-disk config surgery (hfOverrides
    # rewrites quantization_config in-process); only an MTP retry does.
    strategy: Local
    storageClass: nvme-1r-gpu
    size: 40Gi
    # 18 GB of shards exceed this 63Gi node's tmpfs budget (7.7 GB) — serve
    # from the PVC directly, same as the wan21 lanes on this host.
    flashLoader:
      enabled: false
    compilationCache:
      enabled: true
      hostPath: /var/lib/flexinfer/compile-cache-qwen36-27b-autoround-5930k
      sizeLimit: 4Gi
  gpu:
    vendor: amd
    count: 1
    shared: 5930k-textgen
    # Borrow-idle posture (fable/wan pattern): explicit workhorse demand may
    # take an idle card (beats gemma4's 385 when it has been idle >2m), while
    # the higher-priority VACE video lane stays authoritative. Cold-load
    # window: demand must persist ~4-6 min; Mills' proxy retries cover this.
    priority: 500
    vramEstimateMB: 22000
  serverless:
    enabled: true
    minReplicas: 0
    idleTimeout: 30m
    # First activation on a cold cache covers the 19 GB HF prefetch + fresh
    # torch.compile (~5 min); cached restarts are ~3 min.
    coldStartTimeout: 25m
  config:
    # 2026-10-30 (S6b readiness): stay a dedicated Deployment until S6b moves
    # this lane into the 5930k runtime pod on purpose. Without the flag,
    # un-parking that DaemonSet (deploy/system/values-k3s.yaml, profile
    # gfx1100-5930k) loads the lane in-pod on the DaemonSet's image instead
    # of spec.image. The flag only routes; the Deployment renders the same
    # (controllers/model_dedicated_deployment_render_test.go).
    dedicatedDeployment: true
    # RDNA3 long-context decode fix (2026-08-16): vLLM's ROCm default picks
    # ROCM_ATTN, whose decode has no KV-length parallelism — single-stream
    # decode collapses linearly with context (research doc 8c/8e fleet
    # ceiling). TRITON_ATTN engages the unified-attention 3D split-KV decode:
    # canary 36 tok/s @30K and 32 @60K vs 4.0/2.0 baseline (9-16x). Kernel
    # evidence: deploy/debug/gfx1100-unified-attn-decode-probe.yaml.
    attentionBackend: TRITON_ATTN
    warmPolicy: ondemand
    # vLLM 0.23 resolves quant_method "auto-round" to "inc" (rejected on
    # ROCm) before honoring --quantization (the 0.32 qwen38 workhorse keeps the
    # same rewrite and selects the same kernel). hfOverrides therefore rewrites
    # quantization_config wholesale to plain GPTQ form; the checkpoint's
    # auto_round:auto_gptq packing is GPTQ-shaped (sym, g128) and selects the
    # native RDNA3W4A16LinearKernel. modules_in_block_to_quantize is the
    # exact INT4 census from the safetensors index (in_proj_a/b, conv1d,
    # norms, lm_head are FP16).
    quantization: gptq
    hfOverrides: '{"quantization_config":{"quant_method":"gptq","bits":4,"group_size":128,"sym":true,"desc_act":false,"lm_head":false,"modules_in_block_to_quantize":["self_attn.q_proj","self_attn.k_proj","self_attn.v_proj","self_attn.o_proj","mlp.gate_proj","mlp.up_proj","mlp.down_proj","linear_attn.in_proj_qkv","linear_attn.in_proj_z","linear_attn.out_proj"]}}'
    dtype: half
    languageModelOnly: true
    maxModelLen: 65536
    maxNumSeqs: 1
    maxNumBatchedTokens: 4096
    enableChunkedPrefill: true
    schedulerReserveFullISL: true
    # 0.94 -> 0.96 with the 0.32 repin (2026-10-25): vLLM 0.32 charges CUDA
    # graph memory to the startup profile (0.23 did not), so at 0.94 the
    # engine refused to start on every boot, cold and warm: "max seq len
    # (65536), 4.16 GiB KV cache is needed, which is larger than the available
    # KV cache memory (4.15 GiB) ... estimated maximum model length is 65072".
    # 0.96 is what the 0.32 qwen38 workhorse runs on this same card (whole
    # card, vramEstimateMB 22000); it keeps the qualified 64K / fp16 / graph
    # envelope instead of trimming context or flipping KV to fp8.
    gpuMemoryUtilization: "0.96"
    # fp16 KV on purpose — see header. Pool is ~68K tokens (1.05x @64K) on
    # 0.23.
    # `calculateKvScales: false` left with the 0.32 repin (2026-10-25): vLLM
    # 0.28 removed the flag, and with fp16 KV it never had an effect here.
    kvCacheDtype: auto
    enforceEager: false
    enablePrefixCaching: false
    disableAiter: true
    rocmCustomPagedAttn: false
    hipVisibleDevices: "0"
    trustRemoteCode: true
    enableToolCalling: true
    toolCallParser: qwen3_coder
    # Clean checkpoint with proper <think> boundaries — split reasoning into
    # reasoning_content so Mills/agent flows get clean content + tool_calls.
    # (The 35B heretic lane's no-parser exception does not apply here.)
    reasoningParser: qwen3
    servedModelName: qwen36-27b-autoround-workhorse
    disableLogStats: false
    failOnEnvironValidation: false
  nodeSelector:
    kubernetes.io/hostname: cblevins-5930k
  resources:
    requests:
      cpu: "4"
      memory: 16Gi
    limits:
      cpu: "8"
      memory: 40Gi
  # Parked-fallback routing: unique alias only; the base role aliases live on
  # qwen38-27b-autoround-workhorse now.
  serviceLabels:
    - qwen36-27b
  litellm:
    enabled: true
    servedModelName: qwen36-27b-autoround-workhorse
    aliases:
      - qwen36-27b
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

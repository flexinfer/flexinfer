# Abliterated Qwen3-14B (huihui-ai v2, self-requanted GPTQ-w4-g128) — warm lane
# on the cblevins-5930k gfx1100 card, served on the NEW vLLM 0.19.1 image.
#
# Promoted from a deploy/debug/ serve-test (2026-06-18) after it PASSED:
# coherent + correct (17x23->391, capital of Japan->Tokyo), genuinely
# uncensored, and a standard dense Qwen3ForCausalLM so it needs NONE of the
# qwen3_5_moe q35plugin/hfOverrides machinery — just the launcher + tuned
# settings. As the warm leader of the 5930k-textgen shared group it displaces
# qwen35-moe-reasoning-5930k (parked at minReplicas 0 in kustomization.yaml).
#
# Name retained from the serve-test so Flux adopts the already-running live
# object in place (no orphaned hand-applied CR, no cold restart).
apiVersion: ai.flexinfer/v1alpha2
kind: Model
metadata:
  name: qwen3-14b-ablit-newimg
  namespace: flexinfer-system
  annotations:
    flexinfer.ai/base-model-source: "huihui-ai/Huihui-Qwen3-14B-abliterated-v2"
    flexinfer.ai/base-model-posture: "abliterated"
    flexinfer.ai/promotion-state: promoted-warm-5930k-2026-06-18
spec:
  backend: vllm
  image: registry.harbor.lan/flexinfer/vllm:rocm7.13-gfx110X-vllm0.19.1
  source: pvc://llm-models-nfs/qwen3-14b-abliterated-v2/gptq-w4-g128
  cache:
    hostPath: /var/lib/flexinfer/models
    size: 30Gi
    storageClass: local-path
    strategy: SharedPVC
  config:
    # Official rocm/vllm image entrypoint isn't the flexinfer serve-wrapper, so
    # supply the launcher explicitly (backend Args appended after "vllm"). No
    # plugin/hfOverrides: this is a standard dense Qwen3ForCausalLM.
    command:
      - bash
      - -lc
      - 'exec python3 -m vllm.entrypoints.openai.api_server "$@"'
      - vllm
    quantization: gptq
    dtype: half
    # 40960 = the model's full native max_position_embeddings (no rope_scaling,
    # no sliding window in config.json), so no YaRN/quality risk. Fits the 24GB
    # card: ~12GB GPTQ weights + 0.95 util leaves ~10.8GB for fp8 KV (~80KB/tok)
    # = ~140K-token pool, >3x one full 40K sequence.
    maxModelLen: 40960
    maxNumSeqs: 8
    kvCacheDtype: fp8_e4m3
    gpuMemoryUtilization: "0.95"
    enforceEager: false
    trustRemoteCode: true
    servedModelName: qwen3-14b-ablit-newimg
    reasoningParser: qwen3
    enableToolCalling: true
    toolCallParser: hermes
  gpu:
    count: 1
    # 2026-06-18: DEMOTED. forcePromotion removed and minReplicas set to 0 below —
    # the uncensored qwen36-35b-mtp-uncensored-5930k lane (priority 380,
    # forcePromotion) was promoted to the warm leader of this shared card. This
    # 14B abliterated lane is parked (kept enabled/reconciled for restore).
    priority: 370
    shared: 5930k-textgen
    vendor: amd
    vramEstimateMB: 12000
  nodeSelector:
    kubernetes.io/hostname: cblevins-5930k
  resources:
    limits:
      cpu: "4"
      memory: 16Gi
    requests:
      cpu: "2"
      memory: 8Gi
  serverless:
    enabled: true
    # PARKED 2026-06-18 (displaced by qwen36-35b-mtp-uncensored-5930k). Restore by
    # flipping back to 1 (and re-add forcePromotion if the 35B still holds the card).
    minReplicas: 0
    coldStartTimeout: 20m0s
    idleTimeout: 30m0s
  tolerations:
    - effect: NoSchedule
      key: node-role.kubernetes.io/control-plane
      operator: Exists
  # `uncensored` label/alias released to the promoted 35B lane (avoids alias
  # conflict); this parked lane keeps only its abliterated-specific routes.
  serviceLabels:
    - qwen3-14b-ablit-newimg
    - abliterated
  litellm:
    enabled: true
    servedModelName: qwen3-14b-ablit-newimg
    aliases:
      - abliterated
      - qwen3-14b-abliterated

apiVersion: ai.flexinfer/v1alpha2
kind: Model
metadata:
  name: qwen3-8b-fast
  namespace: flexinfer-system
spec:
  backend: mlc-llm
  source: pvc://mlc-models-nfs/Qwen3-8B-abliterated-q4f32_1-MLC
  gpu:
    vendor: amd
    shared: 5930k-textgen
    # Legacy disabled fallback on the second gfx1100. If restored, it belongs
    # to the text-only 5930k lane; the 7900XTX route owns the default aliases.
    priority: 220
    vramEstimateMB: 12000
  serverless:
    enabled: true
    minReplicas: 0
    idleTimeout: 5m
    coldStartTimeout: 10m
  config:
    mode: server
    # Avoid slow startup-time compilation; use the prebuilt ROCm library shipped with the model.
    jitPolicy: "READONLY"
    modelLibPath: /models/Qwen3-8B-abliterated-q4f32_1-MLC/lib_rocm_gfx1100.so
    maxNumSequence: 4
    maxTotalSeqLength: 32768
  nodeSelector:
    kubernetes.io/hostname: cblevins-5930k
  resources:
    requests:
      cpu: "4"
      memory: 16Gi
    limits:
      cpu: "8"
      memory: 24Gi
  serviceLabels:
    - fast-chat-5930k
    - fast-chat-fallback
    - fast-text-5930k
  litellm:
    enabled: true
    servedModelName: qwen3-8b-fast
    aliases:
      - fast-chat-5930k
      - fast-chat-fallback

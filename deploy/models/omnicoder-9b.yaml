# OmniCoder-9B via vLLM on AMD gfx1100 — shared group on cblevins-5930k
#
# Abliterated + GPTQ INT4 ~7.2 GB coding-focused model.
# Shares GPU with qwen35-9b via 5930k-textgen group (swap on demand).
#
# Source: Locally staged from Harbor OCI (omnicoder-9b:gptq-w4-g128).
# Image: Same Qwen3.5-patched vLLM as 27B (identical qwen3_5_text architecture).
#
# maxModelLen=8192 for code generation tasks.
# maxNumSeqs=4 for concurrent requests.
#
apiVersion: ai.flexinfer/v1alpha2
kind: Model
metadata:
  name: omnicoder-9b
  namespace: flexinfer-system
spec:
  backend: vllm
  source: local://omnicoder-9b
  cache:
    strategy: Local
  gpu:
    vendor: amd
    count: 1
    vramEstimateMB: 8000
    shared: 5930k-textgen
    priority: 100
  serverless:
    enabled: true
    minReplicas: 0
    idleTimeout: 10m
    coldStartTimeout: 10m
  config:
    quantization: gptq
    dtype: "half"
    maxModelLen: 8192
    gpuMemoryUtilization: "0.95"
    maxNumSeqs: 4
    enforceEager: true
    trustRemoteCode: true
    servedModelName: omnicoder-9b
    enableToolCalling: true
    toolCallParser: hermes
    maxNumBatchedTokens: 4096
    disableLogStats: false
    warmPolicy: ondemand
  nodeSelector:
    kubernetes.io/hostname: cblevins-5930k
  resources:
    requests:
      cpu: "2"
      memory: 8Gi
    limits:
      cpu: "4"
      memory: 24Gi
  serviceLabels:
    - omnicoder-9b
    - code-gen
  litellm:
    enabled: true
    servedModelName: omnicoder-9b
    aliases:
      - omnicoder
      - code-gen
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"

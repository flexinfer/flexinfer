# Qwen3-1.7B GGUF on Radeon VII (gfx906) — fast tool-call routing model
#
# Small model for function calling and tool routing decisions.
# Runs CPU-only (config pins nGPULayers:0 + *VisibleDevices:-1).
#
# 2026-06-03 (services/flexinfer#62): reclassified from the radeonvii-models GPU
# group to vendor:cpu. The gfx906 unified runtime serves ONE backend subprocess
# at a time, so this CPU model was holding that single slot and blocking GPU
# models (the bge-large HBM2 embedding lane) from serving. As vendor:cpu it leaves
# the GPU group (schema-enforced) and is served by a dedicated CPU Deployment
# (controller routes CPU models off the single-slot GPU runtime), so it stays warm
# for Loom's weaver Router WHILE the GPU runtime serves embeddings concurrently.
#
# 2026-05-08: bumped minReplicas 0 -> 1 because Loom's weaver Router
# resolves to this model on every query (via pkg/aimodels
# RoleWeaverRouter); a 60-120s llamacpp cold start on the radeonvii
# was unacceptable for a per-query routing path. Subagent calls remain
# serverless (cold-start absorbed by qwen3-8b-fast-7900xtx Ready
# replica). See services/loom-core/.loom/111-product-spec-weaver-qwen3-
# integration-2026-05-08.md (MR-003).
#
apiVersion: ai.flexinfer/v1alpha2
kind: Model
metadata:
  name: qwen3-1p7b-tools-radeonvii
  namespace: flexinfer-system
spec:
  backend: llamacpp
  # Explicit image, retained deliberately. The DEFAULT_LLAMA_CPP_IMAGE_CPU
  # default is now ghcr.io/ggml-org/llama.cpp:server (valid; pre-#62 it was the
  # stale ggerganov path that 404'd -> ErrImagePull). We still pin the gfx906
  # ROCm llamacpp image already cached node-local on cblevins-radeonvii to avoid
  # a fresh public pull on a disk-constrained node; it has the binary at the
  # custom path (/opt/src/llama.cpp/build/bin/llama-server) and is proven to run
  # this router CPU-only (n-gpu-layers 0; it was the runtime image pre-#62).
  image: registry.harbor.lan/library/llamacpp:rocm-gfx906-patched-v3
  source: HF://rippertnt/Qwen3-1.7B-Q4_K_M-GGUF
  cache:
    # Runtime DaemonSets only see node-local staged caches under /models.
    # Keep this GGUF beside the Radeon VII runtime instead of a model PVC.
    size: 2Gi
    storageClass: nvme-1r
    strategy: Local
  gpu:
    # CPU-only: leaves the radeonvii-models GPU group (schema requires gpu.shared
    # empty for cpu) and is served by a dedicated Deployment, not the single-slot
    # gfx906 runtime — frees that slot for the bge-large embedding lane. See #62.
    vendor: cpu
  serverless:
    enabled: true
    minReplicas: 1
    idleTimeout: 5m
    coldStartTimeout: 5m
  config:
    ggufFile: qwen3-1.7b-q4_k_m.gguf
    contextSize: 8192
    # Radeon VII currently aborts llama.cpp ROCm loads in hipMemGetInfo.
    # Keep this tiny router colocated with the gfx906 runtime, but hide ROCm
    # devices so llama.cpp takes the proven CPU path.
    nGPULayers: 0
    batchSize: 1024
    ubatchSize: 512
    parallel: 2
    flashAttention: false
    fitOff: true
    jinja: true
    reasoningFormat: none
    reasoningBudget: 0
    metrics: true
    cacheTypeK: q4_0
    cacheTypeV: q4_0
    hipVisibleDevices: "-1"
    rocrVisibleDevices: "-1"
  nodeSelector:
    kubernetes.io/hostname: cblevins-radeonvii
  resources:
    requests:
      cpu: "2"
      memory: 4Gi
    limits:
      cpu: "8"
      memory: 8Gi
  serviceLabels:
    - tool-router
    - fast
    - qwen3-router
  litellm:
    enabled: true
    servedModelName: qwen3-1.7b-tools
    aliases:
      - tool-router
      - qwen3-1.7b
      # 2026-05-08: canonical alias for Loom's pkg/aimodels resolver
      # (RoleWeaverRouter). Lets callers resolve to "qwen3-router"
      # without coupling to the GPU-specific CR name.
      - qwen3-router

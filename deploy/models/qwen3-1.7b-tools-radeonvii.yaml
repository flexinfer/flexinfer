# Qwen3-1.7B GGUF on Radeon VII (gfx906) — fast tool-call routing model
#
# Small model for function calling and tool routing decisions.
# VRAM: ~1.5 GB Q4_K_M — coexists with BGE embeddings in 16 GB.
# Part of the radeonvii-models shared group at priority 120.
#
# 2026-05-08: bumped minReplicas 0 -> 1 because Loom's weaver Router
# resolves to this model on every query (via pkg/aimodels
# RoleWeaverRouter); a 60-120s llamacpp cold start on the radeonvii
# was unacceptable for a per-query routing path. Subagent calls remain
# serverless (cold-start absorbed by qwen3-8b-fast-7900xtx Ready
# replica). See services/loom-core/.loom/111-product-spec-weaver-qwen3-
# integration-2026-05-08.md (MR-003).
#
apiVersion: ai.flexinfer/v1alpha2
kind: Model
metadata:
  name: qwen3-1p7b-tools-radeonvii
  namespace: flexinfer-system
spec:
  backend: llamacpp
  source: HF://rippertnt/Qwen3-1.7B-Q4_K_M-GGUF
  cache:
    size: 2Gi
    storageClass: nvme-1r
    strategy: SharedPVC
  gpu:
    vendor: amd
    shared: radeonvii-models
    priority: 120
    count: 1
    vramEstimateMB: 2000
  serverless:
    enabled: true
    minReplicas: 1
    idleTimeout: 5m
    coldStartTimeout: 5m
  config:
    ggufFile: qwen3-1.7b-q4_k_m.gguf
    contextSize: 8192
    nGPULayers: 999
    batchSize: 1024
    ubatchSize: 512
    parallel: 2
    flashAttention: false
    fitOff: true
    jinja: true
    reasoningFormat: none
    reasoningBudget: 0
    metrics: true
    cacheTypeK: q4_0
    cacheTypeV: q4_0
    rocrVisibleDevices: "0"
  nodeSelector:
    kubernetes.io/hostname: cblevins-radeonvii
  resources:
    requests:
      cpu: "2"
      memory: 4Gi
    limits:
      cpu: "8"
      memory: 8Gi
  serviceLabels:
    - tool-router
    - fast
    - qwen3-router
  litellm:
    enabled: true
    servedModelName: qwen3-1.7b-tools
    aliases:
      - tool-router
      - qwen3-1.7b
      # 2026-05-08: canonical alias for Loom's pkg/aimodels resolver
      # (RoleWeaverRouter). Lets callers resolve to "qwen3-router"
      # without coupling to the GPU-specific CR name.
      - qwen3-router

# Clean Qwen3.5-35B-A3B 128K workhorse sister on cblevins-7900xtx.
#
# Promotion evidence (2026-07-14, exact artifact/runtime pair below):
# - 97,309-token prompt: 5/5 needles recalled in 184.33s.
# - 129,919-token prompt: 5/5 needles recalled in 297.17s.
# - Final global-proxy route smoke returned ROUTE_OK.
# - ModelExperiment qwen35-35b-clean-gptq-128k-graph run 1 completed with
#   phase=Succeeded, reason=GauntletPassed.
#
# Shared service labels add this GPU to ordinary workhorse/Mills/Council
# routing. Long prompts must use one of this Model's explicit *-128k aliases;
# those labels are not advertised by the 64K sister on cblevins-5930k.
apiVersion: ai.flexinfer/v1alpha2
kind: Model
metadata:
  name: qwen35-35b-clean-gptq-workhorse-128k
  namespace: flexinfer-system
  annotations:
    flexinfer.ai/base-model-source: Qwen/Qwen3.5-35B-A3B
    flexinfer.ai/base-model-posture: clean
    flexinfer.ai/artifact-digest: sha256:ed9cd20ffca20cdff54a581276c3b448aeb04fed234485995b308a10b360b6ba
    flexinfer.ai/runtime-digest: sha256:7bc680b43ab91e60ea120d65e5af5d0d70300602ac881790ca5cbcfebad90604
    flexinfer.ai/promotion-state: 128k-graph-five-depth-gauntlet-passed
    flexinfer.ai/promotion-evidence: modelexperiment/qwen35-35b-clean-gptq-128k-graph@run-1
spec:
  backend: vllm
  image: registry.harbor.lan/flexinfer/vllm@sha256:7bc680b43ab91e60ea120d65e5af5d0d70300602ac881790ca5cbcfebad90604
  source: pvc://llm-models-nfs/qwen35-35b-a3b-clean/gptq-w4-g128-gdn
  cache:
    strategy: None
    compilationCache:
      enabled: true
      hostPath: /var/lib/flexinfer/compile-cache
      sizeLimit: 4Gi
  config:
    dedicatedDeployment: true
    quantization: gptq
    dtype: half
    hfOverrides: '{"architectures":["Qwen3_5MoeForCausalLM"],"rope_parameters":{"rope_type":"default","rope_theta":10000000,"partial_rotary_factor":0.25}}'
    languageModelOnly: true
    maxModelLen: 131072
    maxNumSeqs: 1
    maxNumBatchedTokens: 4096
    enableChunkedPrefill: true
    schedulerReserveFullISL: true
    # This is the exact qualified setting. A first-ever uncached compile can
    # exit once after populating the persistent AOT cache; the automatic
    # restart then has 1.94 GiB KV / 196,608-token capacity. Do not delete the
    # host compilation cache during routine model cleanup.
    gpuMemoryUtilization: "0.94"
    kvCacheDtype: fp8_e4m3
    calculateKvScales: false
    enforceEager: false
    gdnPrefillBackend: triton
    cudagraphMetrics: true
    kvCacheMetrics: true
    kvCacheMetricsSample: "0.01"
    enablePrefixCaching: false
    disableAiter: true
    rocmCustomPagedAttn: false
    hipVisibleDevices: "0"
    trustRemoteCode: true
    enableToolCalling: true
    toolCallParser: qwen3_coder
    servedModelName: qwen35-35b-clean-gptq-workhorse-128k
    disableLogStats: false
    failOnEnvironValidation: true
    # Keep this second 128K replica available on explicit demand while the
    # identical 5930k workhorse remains warm for ordinary and 128K routes.
    # Its higher shared-GPU priority lets it preempt video when requested.
    warmPolicy: ondemand
  gpu:
    vendor: amd
    # This host exposes the discrete 7900 XTX plus its Raphael iGPU. Claim
    # both device-plugin slots and select the discrete card explicitly above.
    count: 2
    shared: 7900xtx-textgen
    priority: 700
    vramEstimateMB: 23200
  nodeSelector:
    kubernetes.io/hostname: cblevins-7900xtx
  resources:
    requests:
      cpu: "4"
      memory: 16Gi
    limits:
      cpu: "8"
      memory: 48Gi
  serverless:
    enabled: true
    minReplicas: 0
    idleTimeout: 30m
    # Allow a cache-loss recovery to complete its cold compile plus the
    # self-healing cached restart without a competing controller timeout.
    coldStartTimeout: 25m
  serviceLabels:
    - qwen35
    - qwen35-35b
    - workhorse
    - loom-workhorse
    - mills-council
    - reasoning
    - qwen35-128k
    - workhorse-128k
    - loom-workhorse-128k
    - mills-council-128k
  litellm:
    enabled: true
    servedModelName: qwen35-35b-clean-gptq-workhorse-128k
    aliases:
      - qwen35-128k
      - workhorse-128k
      - loom-workhorse-128k
      - mills-council-128k
  tolerations:
    - effect: NoSchedule
      key: node-role.kubernetes.io/control-plane
      operator: Exists

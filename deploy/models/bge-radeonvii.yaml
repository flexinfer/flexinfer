# BGE-large-en-v1.5 embeddings on Radeon VII (gfx906)
#
# HBM2 retrieval-plane embedding lane using llamacpp backend with GGUF weights.
# VRAM: ~1.3 GB — fits easily in 16 GB alongside other radeonvii models.
# Part of the radeonvii-models shared group.
#
# Hardware-utilization arc Sprint 1 (.loom/30-implementation-plan-hardware-
# utilization-2026-06-03.md). Kill-test 2026-06-03 PASS: GPU-resident on gfx906,
# 8,952 tok/s compute, peak GPU 100% (60-validation-matrix.md "S1.1 kill-test").
#
# Primary GPU lane of the radeonvii-models group. priority 120 wins leadership
# over the other (mostly-defunct) GPU members — gemma4-e4b-radeonvii (110, the
# falsified cross-card spec-decode draft) and qwen3-8b-radeonvii (100, cold
# fallback). The CPU tool router left this group in #62, so the old "stay below
# 120" constraint is gone. minReplicas: 0 (serverless, activated on demand);
# distinct serviceLabel `embeddings-hbm2` so it does NOT hijack the default
# `embeddings`/`rag` routing group from nomic; addressed via `bge-large` /
# `embeddings-radeonvii`. Warm-promote + default-alias cutover + reranker are a
# LATER slice, gated on the S0.3 baseline.
#
apiVersion: ai.flexinfer/v1alpha2
kind: Model
metadata:
  name: bge-large-radeonvii
  namespace: flexinfer-system
  annotations:
    # Protect this warm retrieval lane from GPU preemption: the serving pod runs
    # at PriorityClass flexinfer-serving-critical (150000) > flexinfer-modelcache-
    # transform (100000), so a quant/transform Job cannot grab the radeonvii GPU
    # out from under embeddings (the 2026-06-27 reembed 502 root cause).
    flexinfer.ai/serving-priority-class: flexinfer-serving-critical
spec:
  backend: llamacpp
  source: HF://CompendiumLabs/bge-large-en-v1.5-gguf
  cache:
    # Local (node-local hostPath under /models): the gfx906 unified runtime only
    # sees node-local staged caches, not PVCs. SharedPVC left the GGUF where the
    # runtime couldn't open it (gguf_init_from_file: No such file or directory).
    # Mirrors gemma4-e4b-radeonvii (the working runtime-served llamacpp lane).
    size: 2Gi
    storageClass: nvme-1r
    strategy: Local
  gpu:
    vendor: amd
    shared: radeonvii-models
    priority: 120
    count: 1
    vramEstimateMB: 1500
  serverless:
    enabled: true
    # Warm: S1.2c cutover makes bge the default embeddings retrieval plane. As the
    # radeonvii-models priority-120 leader it holds the gfx906 runtime slot — an
    # intentional allocation (HBM2 -> embeddings) over the low-use gemma4-e4b draft
    # and qwen3-8b fallback lanes.
    # Temporarily parked for the 2026-07-20 Qwen3.6 Fable GPTQ build window.
    # Restore to 1 after the quantization/publish job leaves Radeon VII.
    minReplicas: 0
    idleTimeout: 30m
    coldStartTimeout: 5m
  config:
    ggufFile: bge-large-en-v1.5-q8_0.gguf
    contextSize: 512
    nGPULayers: 999
    batchSize: 2048
    ubatchSize: 512
    embedding: true
    flashAttention: false
    fitOff: true
    metrics: true
    rocrVisibleDevices: "0"
  nodeSelector:
    kubernetes.io/hostname: cblevins-radeonvii
  resources:
    requests:
      cpu: "2"
      memory: 2Gi
    limits:
      cpu: "4"
      memory: 4Gi
  # S1.2c cutover: bge is now the default embeddings/rag retrieval lane (taken
  # from the stuck nomic@980Ti incumbent — see 60-validation-matrix.md "S0.3").
  serviceLabels:
    - embeddings
    - semantic-search
    - rag
    - embeddings-hbm2
  litellm:
    enabled: true
    servedModelName: bge-large-radeonvii
    aliases:
      - embeddings
      - text-embedding-3-small
      - bge-large
      - embeddings-radeonvii

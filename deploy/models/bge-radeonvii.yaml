# BGE-large-en-v1.5 embeddings on Radeon VII (gfx906)
#
# Always-on embedding model using llamacpp backend with GGUF weights.
# VRAM: ~1.3 GB — fits easily in 16 GB alongside other radeonvii models.
# Part of the radeonvii-models shared group at priority 200 (highest).
#
apiVersion: ai.flexinfer/v1alpha2
kind: Model
metadata:
  name: bge-large-radeonvii
  namespace: flexinfer-system
spec:
  backend: llamacpp
  source: HF://CompendiumLabs/bge-large-en-v1.5-gguf
  cache:
    size: 2Gi
    storageClass: nvme-1r
    strategy: SharedPVC
  gpu:
    vendor: amd
    shared: radeonvii-models
    priority: 200
    count: 1
    vramEstimateMB: 1500
  serverless:
    enabled: true
    minReplicas: 0
    idleTimeout: 30m
    coldStartTimeout: 5m
  config:
    ggufFile: bge-large-en-v1.5-q8_0.gguf
    contextSize: 512
    nGPULayers: 999
    batchSize: 2048
    ubatchSize: 512
    embedding: true
    flashAttention: false
    fitOff: true
    metrics: true
    rocrVisibleDevices: "0"
  nodeSelector:
    kubernetes.io/hostname: cblevins-radeonvii
  resources:
    requests:
      cpu: "2"
      memory: 2Gi
    limits:
      cpu: "4"
      memory: 4Gi
  serviceLabels:
    - embeddings
    - rag
  litellm:
    enabled: true
    servedModelName: bge-large-radeonvii
    aliases:
      - bge-large
      - embeddings-radeonvii

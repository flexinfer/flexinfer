# Qwen3-14B via vLLM on AMD gfx1100 (pre-quantized GPTQ INT4)
#
# Model: JunHowie/Qwen3-14B-GPTQ-Int4 (GPTQ, ~8 GiB)
# Quant: Pre-quantized GPTQ INT4 (sym=true, desc_act=false, group_size=128)
#
# vLLM routes GPTQ through ExLlama v2 kernels (HIP-compiled on ROCm).
# Previous AWQ config: ~9.5 tok/s (Triton AWQ kernels, CDNA-optimized)
#
# Also consider: Qwen/Qwen3.5-27B-GPTQ-Int4 (official, larger, ~30 GiB)
#
# Recommended generation params: temperature=0.6, top_k=20, top_p=0.95
#
# ── Performance (2026-03-07, gfx1100 7900 XTX 24GB) ──
#
# VRAM budget:
#   Model weights (GPTQ INT4):  9.53 GiB
#   CUDA graphs:                0.78 GiB
#   KV cache (0.95 util):      11.71 GiB → 76,736 tokens
#   Total VRAM:                ~22.0 GiB / 24 GiB
#
# Single-request decode: 72-73 tok/s
# Prefill: TTFT ~0.96s for 2K-token prompt
# Max concurrency @ 16K context: 4.68x
#
# Concurrency scaling (200 tok/req, short prompts):
#   C=1:  73 tok/s aggregate
#   C=2: 135 tok/s aggregate (1.85x)
#   C=4: 241 tok/s aggregate (3.30x)
#   C=8: 431 tok/s aggregate (5.91x, no queuing)
#
apiVersion: ai.flexinfer/v1alpha2
kind: Model
metadata:
  name: qwen3-14b-abliterated
  namespace: flexinfer-system
spec:
  backend: vllm
  source: HF://JunHowie/Qwen3-14B-GPTQ-Int4
  gpu:
    vendor: amd
    shared: 7900xtx-textgen
    priority: 200
    count: 2
    vramEstimateMB: 10000
  serverless:
    enabled: true
    minReplicas: 0
    idleTimeout: 30m
    coldStartTimeout: 15m
  config:
    quantization: gptq
    dtype: "half"
    # Reduced from 32768: most requests use <4K context. 16K covers coding
    # and long-document workloads while doubling KV cache density.
    maxModelLen: 16384
    # Bumped from 0.92: model+graphs use ~10.3 GiB, leaves ~12.5 GiB for
    # KV cache + overhead. 0.95 is safe — no OOM risk with GPTQ INT4.
    gpuMemoryUtilization: "0.95"
    # Bumped from 4: with 16K context and ~138K KV tokens, we can serve
    # 8 concurrent requests at max context. Matches peak aggregate throughput.
    maxNumSeqs: 8
    enforceEager: false
    trustRemoteCode: true
    servedModelName: qwen3-14b-abliterated
    enableToolCalling: true
    toolCallParser: hermes
    reasoningParser: qwen3
    maxNumBatchedTokens: 8192
    # enablePrefillDecodeAttention: removed — env var VLLM_V1_USE_PREFILL_DECODE_ATTENTION
    # is reported as "Unknown" by vLLM; dead config, not used by the engine.
    # kvCacheDtype: fp8 — removed: gfx1100 lacks native FP8 compute, adds overhead.
    # Known crash risk with prefix caching on RDNA3.
    # Log stats enabled for performance monitoring and tuning.
    disableLogStats: false
    hipVisibleDevices: "0"
  cache:
    size: 50Gi
    storageClass: nvme-1r
    strategy: SharedPVC
  nodeSelector:
    kubernetes.io/hostname: cblevins-7900xtx
  resources:
    requests:
      cpu: "2"
      memory: 12Gi
    limits:
      cpu: "4"
      memory: 48Gi
  serviceLabels:
    - qwen3-14b-abliterated
    - abliterated
    - uncensored
  litellm:
    enabled: true
    servedModelName: qwen3-14b-abliterated
    aliases:
      - abliterated
      - uncensored
      - qwen3-14b-abl

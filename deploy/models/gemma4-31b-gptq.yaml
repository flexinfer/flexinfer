# Gemma4 31B Dense GPTQ INT4 via vLLM on AMD gfx1100.
#
# Dense: 30.7B params, 60 layers. GPTQ INT4 checkpoint ~16 GB weights.
# VRAM budget: ~15-16 GB weights + ~6 GB KV cache → tight fit in 24 GB.
# Conservative maxModelLen=1920 to stay within VRAM (see config block).
#
# On-demand model on cblevins-7900xtx (priority 250, scale-to-zero) co-located
# with the 26B-A4B MoE in the 7900xtx-textgen shared group. 5930k is currently
# tied up with the 26B-dense abliteration Job (and the imagegen shared group
# below), so the gfx1100 with available serving capacity is 7900xtx.
#
# Shared-group semantics: 31B priority=250 > 26B priority=200, so a call to
# any 31B alias preempts the 26B MoE (scale-to-zero). When 31B goes idle
# (idleTimeout=15m), the MoE's minReplicas=1 brings it back automatically.
#
# The quantized artifact lives on an RWX (nas-bulk-rwx) PVC so 7900xtx can
# mount it without a cache-copy step.
#
# History (2026-04-21):
#   - Original placement: 7900xtx.
#   - Temporarily moved to 5930k to free VRAM for 26B-A4B MoE (commit 5099ab17).
#   - Moved back to 7900xtx after 31B quantize finished (7h57m58s; artifact
#     18.1 GiB / 3.4x compression). 5930k is blocked by the 26B-dense
#     abliteration Job + imagegen shared group.
#
# Promotion gate (reusable for any quantized family):
# future compressed-tensors/fp8-KV paths must stay canary-only until validated
# at target context and explicitly promoted.
apiVersion: ai.flexinfer/v1alpha2
kind: Model
metadata:
  name: gemma4-31b-gptq
  namespace: flexinfer-system
  annotations:
    flexinfer.ai/promotion-gate: quantized-artifact-v1
    flexinfer.ai/promotion-state: conservative-on-demand-baseline
    flexinfer.ai/promotion-requires: validated-canary-before-alias-or-default-change
spec:
  backend: vllm
  image: registry.harbor.lan/flexinfer/runtime@sha256:0c7e9ffb390f39a3b5fffe71e341a127ad20fc191a11cafa99f3c2c6a3e8a863
  # Points at the k_eq_v-patched artifact produced by the
  # deploy/tasks/gemma4-31b-keqv/ Job. The controller's cache-copy will
  # retry until the Job finishes writing this directory on the source
  # PVC (~1-2 min CPU work). See that task's README for the algorithm
  # and rationale.
  source: pvc://gemma4-31b-gptq/gemma4-31b-gptq/gptq-w4-g128-keqv
  # Cache staging (2026-04-21): raw pvc:// sources require an explicit
  # staged Local cache. Without storageClass+hostPath+size the controller
  # emits `Skipping runtime-managed flow for model ... raw pvc:// sources
  # require staged Local cache for runtime loads` and never schedules a
  # runtime pod — the warmPolicy=primary swap in !171 landed cleanly but
  # didn't spawn a pod because the controller was bailing out earlier in
  # reconcile. Mirror the gemma4-26b-a4b-gptq pattern: local-path +
  # hostPath + SharedPVC. This also sidesteps the cross-node Longhorn
  # mmap-stall incident (#53) that motivated the 26B migration.
  #
  # **Operator migration step** — the existing gemma4-31b-gptq-cache PVC
  # was provisioned on the default storageClass (longhorn) before this
  # change. storageClassName is immutable on a PVC, so Flux alone will
  # NOT re-create it. Manual sequence after this MR merges:
  #   1. kubectl scale deploy gemma4-31b-gptq -n flexinfer-system --replicas=0
  #   2. kubectl delete pvc gemma4-31b-gptq-cache -n flexinfer-system
  #   3. flux reconcile kustomization flexinfer-models -n flux-system
  #   4. Wait for controller to recreate cache PVC with local-path on
  #      7900xtx and run a fresh cache-copy from the source PVC
  #      (gemma4-31b-gptq, nas-bulk-rwx) — ~18 GiB artifact.
  #   5. Model will transition Idle → Ready automatically; warmPolicy=primary
  #      + minReplicas=1 then brings up the serving pod.
  cache:
    strategy: SharedPVC
    storageClass: local-path
    hostPath: /var/lib/flexinfer/models
    size: 50Gi
  gpu:
    vendor: amd
    # count=2 claims both amd.com/gpu slots on 7900xtx (discrete + iGPU).
    # The iGPU is useless for inference and would otherwise be allocated
    # to a co-tenant. Pair with config.hipVisibleDevices=0 to force the
    # serving process onto the discrete 7900 XTX. Same pattern as the
    # 26B-A4B MoE serving pod on this node.
    count: 2
    # 31B INT4 ≈ 16 GB weights + KV cache (~1.3 GB at maxModelLen=2048).
    # 2026-04-23: kept 18000 despite the maxModelLen drop — first load
    # actually showed ~5 GiB of activations + overhead (only 1.7 GiB
    # free for KV at 0.95 util), so the real resident budget is closer
    # to 21-22 GiB than the nominal 17-18. 18000 is a floor for the
    # shared-group scheduler, not an exact estimate.
    vramEstimateMB: 18000
    shared: 7900xtx-textgen
    # Higher than the 26B-A4B MoE (priority=200). This is the always-warm
    # primary in this group; the MoE runs on-demand as a fallback.
    priority: 250
  serverless:
    enabled: true
    # Warm primary on 7900xtx-textgen, pointing at the k_eq_v-patched
    # artifact (source: -keqv suffix above). Flux applies the Job + the
    # source-path change + this minReplicas bump in the same reconcile.
    # Order of operations on merge:
    #   1. Flux creates the k_eq_v post-process Job → Job runs, writes
    #      -keqv/ on the source PVC (~1-2 min).
    #   2. Controller sees the new Model CR source path; its cache-copy
    #      fails on first attempt (path doesn't exist yet), retries,
    #      eventually succeeds once the Job output is visible.
    #   3. Model transitions Idle → Ready; with warmPolicy=primary and
    #      minReplicas=1 here the controller spawns the serving pod.
    #   4. Meanwhile the 26B-A4B MoE (warmPolicy=primary, minReplicas=1)
    #      is still running on 7900xtx. When the 31B becomes Active in
    #      the 7900xtx-textgen shared group (priority=250 > MoE's 200),
    #      the controller preempts the MoE — MoE scales to 0.
    # If the cascade fails at any step (e.g. new artifact still doesn't
    # load in vLLM), the 26B-A4B MoE stays serving and the 31B deployment
    # crashloops visibly. `git revert` rolls back to the Phase 0 state
    # (MoE warm, 31B cold) without further manual steps.
    minReplicas: 1
    idleTimeout: 15m
    coldStartTimeout: 15m
  config:
    quantization: gptq
    dtype: "half"
    # 2026-04-23: 4096 → 2048 → 1920 tuning on the -keqv artifact.
    #
    # First load at 4096 hit:
    #   ValueError: ... max seq len (4096), (2.67 GiB KV cache is needed,
    #   which is larger than the available KV cache memory (1.7 GiB).
    #   Based on the available memory, the estimated maximum model
    #   length is 2000.
    #
    # Dropped 4096 → 2048 from the per-token-KV estimate (0.65 MiB,
    # assumed linear), but vLLM actually measured per-token KV at
    # ~0.844 MiB (heterogeneous attention + k_eq_v reshapes) → 2048
    # needed 1.73 GiB, still 30 MiB over the 1.7 GiB budget:
    #   ValueError: ... max seq len (2048), (1.73 GiB KV cache is
    #   needed, ... (1.7 GiB). ... estimated maximum model length is 2000.
    #
    # 1920 = 2000 / multiple-of-64, keeps a comfortable headroom below
    # vLLM's estimate and matches what the engine can actually allocate.
    # Can be bumped if we add quant KV, lower maxNumSeqs, or reclaim
    # activation memory.
    maxModelLen: 1920
    gpuMemoryUtilization: "0.95"
    maxNumSeqs: 4
    trustRemoteCode: true
    attentionBackend: TRITON_ATTN
    # Force serving onto the discrete GPU only — the 7900xtx node exposes
    # an iGPU as amd.com/gpu index 1 which cannot run inference.
    hipVisibleDevices: "0"
    # Warm primary in 7900xtx-textgen, tied to serverless.minReplicas=1.
    # vLLM rejected the pre-keqv artifact on load, so this flip only
    # takes effect together with the source: -keqv switch and the
    # post-process Job under deploy/tasks/gemma4-31b-keqv/. If the
    # keqv artifact ALSO fails to load, `git revert` restores the
    # working 26B-A4B MoE as the sole warm model on 7900xtx-textgen.
    warmPolicy: primary
    servedModelName: gemma4-31b-gptq
    enableToolCalling: true
    toolCallParser: gemma4
    reasoningParser: gemma4
    enablePrefixCaching: true
    disableLogStats: false
  nodeSelector:
    kubernetes.io/hostname: cblevins-7900xtx
  resources:
    requests:
      cpu: "4"
      memory: 24Gi
    limits:
      cpu: "8"
      memory: 32Gi
  serviceLabels:
    - gemma4-31b-gptq
    - gemma4-31b
  litellm:
    enabled: true
    servedModelName: gemma4-31b-gptq
    aliases:
      - gemma4-31b
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"

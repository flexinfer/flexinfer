# Uncensored-heretic Qwen3.6-35B-A3B-MoE (Native-MTP-Preserved), self-quantized
# GPTQ-w4-g128 from llmfan46/Qwen3.6-35B-A3B-uncensored-heretic-Native-MTP-Preserved.
# Promoted OVER the 14B abliterated lane on the cblevins-5930k gfx1100 card as the
# uncensored daily-driver (priority 380 > 14B's 370, forcePromotion to claim the
# shared card; qwen3-14b-ablit-newimg parked at minReplicas 0).
#
# SAME MoE serving recipe as qwen35-moe-reasoning-5930k.yaml (see that file for the
# full 5-blocker explanation: startup q35plugin registering Qwen3_5MoeForCausalLM +
# is_hybrid + mamba-state graft + moe.*->mlp.experts.* rename + GPTQ fused-expert
# loader fix; hfOverrides stripping mRoPE). ONLY the source artifact differs.
#
# RISKIEST ASSUMPTION / kill-test: the "Native-MTP-Preserved" variant retains
# Multi-Token-Prediction head weights the reasoning quant lacks. The plugin's
# graceful-skip (load_fused_expert_weights returns False for params not in
# params_dict) should drop unexpected MTP tensors, but whether the checkpoint
# loads AND serves COHERENTLY on vLLM 0.19.1 is unproven until the first cold
# start. Failure mode: load error on MTP weights, or incoherent output. If it
# fails, unpark the 14B (this file's followers revert) — the 14B reclaims the card.
apiVersion: ai.flexinfer/v1alpha2
kind: Model
metadata:
  name: qwen36-35b-mtp-uncensored-5930k
  namespace: flexinfer-system
  annotations:
    flexinfer.ai/base-model-source: llmfan46/Qwen3.6-35B-A3B-uncensored-heretic-Native-MTP-Preserved
    flexinfer.ai/base-model-posture: uncensored-heretic
    flexinfer.ai/promotion-state: mtp-serve-test-2026-06-18
    flexinfer.ai/promotion-evidence: deploy/models/qwen35-moe-reasoning-5930k.yaml
spec:
  backend: vllm
  image: registry.harbor.lan/flexinfer/vllm:rocm7.13-gfx110X-vllm0.19.1
  source: pvc://llm-models-nfs/qwen36-35b-a3b-mtp/gptq-w4-g128
  cache:
    hostPath: /var/lib/flexinfer/models
    size: 50Gi
    storageClass: local-path
    strategy: SharedPVC
  config:
    command:
    - bash
    - -lc
    - set -e; D=/tmp/q35build; mkdir -p $D/q35plugin; echo  | base64 -d > $D/q35plugin/__init__.py; echo  | base64 -d > $D/pyproject.toml; pip install -e $D --no-deps -q; exec python3 -m vllm.entrypoints.openai.api_server "$@"
    - vllm
    quantization: gptq
    dtype: half
    hfOverrides: '{"architectures":["Qwen3_5MoeForCausalLM"],"rope_parameters":{"rope_type":"default","rope_theta":10000000,"partial_rotary_factor":0.25}}'
    # 32768 is the model's REAL ceiling. config.json has a top-level
    # max_position_embeddings=262144 but the text-model (nested) value is 32768,
    # and vLLM derives max_model_len from that — 65536 crashlooped with
    # "User-specified max_model_len (65536) > derived max_model_len
    # (max_position_embeddings=32768)". Going past 32K needs
    # VLLM_ALLOW_LONG_MAX_MODEL_LEN=1 and risks NaN/OOB (RoPE trained to 32K).
    # The empty-response issue is NOT context — it's the model's over-thinking;
    # fix that with enable_thinking=false, not a larger window.
    maxModelLen: 32768
    maxNumSeqs: 4
    kvCacheDtype: fp8_e4m3
    gpuMemoryUtilization: '0.98'
    enforceEager: false
    trustRemoteCode: true
    servedModelName: qwen36-35b-mtp-uncensored-5930k
    reasoningParser: qwen3
    enableToolCalling: true
    toolCallParser: hermes
    warmPolicy: primary
  gpu:
    count: 1
    priority: 380
    shared: 5930k-textgen
    vendor: amd
    vramEstimateMB: 20000
    forcePromotion: true
  nodeSelector:
    kubernetes.io/hostname: cblevins-5930k
  resources:
    limits:
      cpu: '4'
      memory: 16Gi
    requests:
      cpu: '2'
      memory: 8Gi
  serverless:
    enabled: true
    minReplicas: 1
    coldStartTimeout: 25m0s
    idleTimeout: 30m0s
  tolerations:
  - effect: NoSchedule
    key: node-role.kubernetes.io/control-plane
    operator: Exists
  serviceLabels:
  - qwen36-35b-mtp-uncensored-5930k
  - uncensored
  - heretic
  litellm:
    enabled: true
    servedModelName: qwen36-35b-mtp-uncensored-5930k
    aliases:
    - uncensored
    - heretic
    - qwen36-35b-uncensored

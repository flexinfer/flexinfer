# Orpheus-3B TTS token generator — fast twin on the 7900 XTX (gfx1100)
#
# Joins the orpheus-tts routing group with orpheus-3b-radeonvii. This lane is
# the speed tier (gfx1100 kernels put 3B Q4 well past realtime; RTF ~1.6 vs
# ~0.75 on the VII); the warm-pinned VII twin is the availability tier.
# route-priority 100 makes the preference explicit: while this lane is Ready
# the proxy routes every orpheus-tts request here — least-loaded would
# otherwise round-robin the idle warm pair ~50/50 and push half the traffic
# below realtime. A GamingSession evicting this lane drops it from Ready and
# voice degrades to the VII instead of going silent — which is the whole
# point of the group.
#
# Warm-pinned since 2026-08-22 (see serverless below): this lane is the
# 7900xtx-textgen warm leader while the parked RP lane stays a deliberate
# post-handback posture. Priority 480 stays below qwen35-9b-ablit-rp (500) so
# a deliberate RP restore would win the card back without a priority edit.
#
apiVersion: ai.flexinfer/v1alpha2
kind: Model
metadata:
  name: orpheus-3b-7900xtx
  namespace: flexinfer-system
  annotations:
    flexinfer.ai/purpose: "TTS audio-token generator (Orpheus) — gfx1100 speed tier of the orpheus-tts group"
    flexinfer.ai/serve-paths: /v1/completions
    # Preferred generation target of the orpheus-tts group: while Ready, this
    # lane shadows the tier-0 VII twin (see internal/proxy/resolver.go).
    flexinfer.ai/route-priority: "100"
spec:
  backend: llamacpp
  source: HF://QuantFactory/orpheus-3b-0.1-ft-GGUF
  cache:
    size: 4Gi
    storageClass: nvme-1r
    strategy: Local
  gpu:
    vendor: amd
    shared: 7900xtx-textgen
    priority: 480
    count: 1
    vramEstimateMB: 3300
  serverless:
    enabled: true
    # 2026-08-22: warm-pinned. Measured: the proxy routes orpheus-tts to Ready
    # members only and never wakes an Idle one, so at minReplicas 0 this speed
    # tier was permanently shadowed by the always-warm VII twin. Both tiers
    # warm + route-priority 100 -> this lane takes all traffic while Ready; a
    # gaming lease still evicts this one and the VII carries the group alone.
    minReplicas: 1
    idleTimeout: 15m
    coldStartTimeout: 5m
  config:
    ggufFile: orpheus-3b-0.1-ft.Q4_K_M.gguf
    contextSize: 4096
    nGPULayers: 999
    batchSize: 1024
    ubatchSize: 512
    flashAttention: false
    fitOff: true
    metrics: true
    rocrVisibleDevices: "0"
  nodeSelector:
    kubernetes.io/hostname: cblevins-7900xtx
  resources:
    requests:
      cpu: "2"
      memory: 3Gi
    limits:
      cpu: "4"
      memory: 6Gi
  serviceLabels:
    - orpheus-tts
  litellm:
    enabled: false
    servedModelName: orpheus-3b-7900xtx

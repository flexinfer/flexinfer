# Qwen3.6-27B GPTQ INT4 serving on cblevins-5930k (gfx1100, 24 GiB).
#
# Path A artifact: produced by qwen36-27b-gptq-gfx1100 ModelCache (upstream
# Qwen/Qwen3.6-27B BF16 → abliterate → GPTQ INT4). See ModelCache header
# and .loom/qwen36-27b-hauhaucs-gptq-plan.md for rationale.
#
# Qwen3.6 IS Qwen3.5 modeling code (verified upstream config.json) — our
# existing Qwen3.5 vLLM patch stack covers this with no new ports needed.
#
# Replaces the busted qwen3-30b-a3b-gptq-int4 canary with adjustments for
# Qwen3.6-27B (dense, abliterated, not MoE):
#   - vramEstimateMB raised to 18000 (weights ~14 GB GPTQ + KV pool)
#   - quantization=gptq, ExllamaLinearKernel via sym=true
#   - kvCacheDtype=fp8_e4m3 (proven on gfx1100; gemma4-26b-a4b-gptq-long lane)
#   - maxModelLen=8192 starting cap (native is 262144); raise after smoke
#   - enforceEager=true (ROCm GPTQ + CUDAGraph fragility)
#
# Co-existence: cblevins-5930k is the recovered Qwen3.6 build node and the
# FluxPony imagegen lane remains scale-to-zero. Qwen3.6 uses the shared
# 5930k-imagegen-textgen lane and activates on demand.
#
# Tool calling: Qwen3 family ships a Hermes-shaped chat template. For the
# first smoke we leave toolCallParser unset (vLLM falls back to OpenAI
# default). If function-args malform during smoke, switch to hermes parser.
---
apiVersion: ai.flexinfer/v1alpha2
kind: Model
metadata:
  name: qwen36-27b-gptq
  namespace: flexinfer-system
  annotations:
    flexinfer.ai/promotion-state: qwen36-ready-replaces-busted-qwen-canary
    flexinfer.ai/promotion-evidence: "ModelCache qwen36-27b-gptq-gfx1100 Ready; OCI digest sha256:fe3a6bea0cd2cdf254a5db6194e01402f1f7f93c4b86d8c717695470fdd3849d"
spec:
  backend: vllm
  source: pvc://qwen36-27b-oci/qwen36-27b
  cache:
    strategy: Local
  gpu:
    vendor: amd
    count: 1
    vramEstimateMB: 18000
    shared: 5930k-imagegen-textgen
    priority: 250
  serverless:
    enabled: true
    minReplicas: 0
    idleTimeout: 30m
    coldStartTimeout: 15m
  config:
    quantization: gptq
    dtype: "half"
    # Conservative initial cap. Native model supports 262144; raise after smoke
    # in 8K → 16K → 32K increments while monitoring KV pool usage.
    maxModelLen: 8192
    maxInputTokens: 6144
    maxOutputTokens: 2048
    gpuMemoryUtilization: "0.92"
    # FP8 KV cache currently trips the Triton cache-update path on gfx1100 for
    # Qwen3.6, so use the runtime default and keep concurrency modest at 8K.
    kvCacheDtype: auto
    calculateKvScales: false
    maxNumSeqs: 2
    trustRemoteCode: true
    attentionBackend: TRITON_ATTN
    hipVisibleDevices: "0"
    servedModelName: qwen36-27b
    enableToolCalling: true
    enablePrefixCaching: false
    enforceEager: true
    disableLogStats: false
    warmPolicy: ondemand
  nodeSelector:
    kubernetes.io/hostname: cblevins-5930k
  resources:
    requests:
      cpu: "4"
      memory: 16Gi
    limits:
      cpu: "8"
      memory: 32Gi
  serviceLabels:
    - qwen36-27b
    - qwen3-coder
    - qwen3-30b-a3b
    - qwen3-uncensored
  litellm:
    enabled: true
    servedModelName: qwen36-27b
    aliases:
      - qwen36-27b
      - qwen3-6-27b
      - qwen3-coder
      - qwen3-30b-a3b
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"

# Qwen3.6-27B GPTQ INT4 serving on cblevins-7900xtx (gfx1100, 24 GiB).
#
# Path A artifact: produced by qwen36-27b-gptq-gfx1100 ModelCache (upstream
# Qwen/Qwen3.6-27B BF16 → abliterate → GPTQ INT4). See ModelCache header
# and .loom/qwen36-27b-hauhaucs-gptq-plan.md for rationale.
#
# Qwen3.6 IS Qwen3.5 modeling code (verified upstream config.json) — our
# existing Qwen3.5 vLLM patch stack covers this with no new ports needed.
#
# Mirrors the qwen3-30b-a3b-gptq-int4.yaml posture (canary, scale-to-zero)
# with adjustments for Qwen3.6-27B (dense, not MoE):
#   - vramEstimateMB raised to 18000 (weights ~14 GB GPTQ + KV pool)
#   - quantization=gptq, ExllamaLinearKernel via sym=true
#   - kvCacheDtype=fp8_e4m3 (proven on gfx1100; gemma4-26b-a4b-gptq-long lane)
#   - maxModelLen=8192 starting cap (native is 262144); raise after smoke
#   - enforceEager=true (ROCm GPTQ + CUDAGraph fragility)
#
# Co-existence: priority=180 (below qwen3-30b-a3b canary at 200, well below
# gemma4-31b-gptq warm primary at 250). Scale-to-zero with 30m idle. Will not
# preempt either warm lane.
#
# Tool calling: Qwen3 family ships a Hermes-shaped chat template. For the
# first smoke we leave toolCallParser unset (vLLM falls back to OpenAI
# default). If function-args malform during smoke, switch to hermes parser.
---
apiVersion: ai.flexinfer/v1alpha2
kind: Model
metadata:
  name: qwen36-27b-gptq
  namespace: flexinfer-system
  annotations:
    flexinfer.ai/promotion-state: pending-quant-cycle
    flexinfer.ai/promotion-requires: ".loom/qwen36-27b-hauhaucs-gptq-plan.md"
spec:
  backend: vllm
  source: pvc://qwen36-27b-gptq-gfx1100/qwen36-27b-gptq-gfx1100
  cache:
    strategy: Local
  gpu:
    vendor: amd
    # Same dGPU+iGPU pinning pattern as gemma4-31b and qwen3-30b-a3b on this node.
    count: 2
    vramEstimateMB: 18000
    shared: 7900xtx-textgen
    priority: 180
  serverless:
    enabled: true
    minReplicas: 0
    idleTimeout: 30m
    coldStartTimeout: 15m
  config:
    quantization: gptq
    dtype: "half"
    # Conservative initial cap. Native model supports 262144; raise after smoke
    # in 8K → 16K → 32K increments while monitoring KV pool usage.
    maxModelLen: 8192
    maxInputTokens: 6144
    maxOutputTokens: 2048
    gpuMemoryUtilization: "0.92"
    # FP8 KV proven on gfx1100 (gemma4-26b-a4b-gptq-long). Qwen3.6 has no
    # precalibrated KV scales — vLLM computes dynamically.
    kvCacheDtype: fp8_e4m3
    calculateKvScales: true
    # 4 concurrent sequences keeps batch math healthy at 8K context without
    # blowing the KV pool.
    maxNumSeqs: 4
    trustRemoteCode: true
    attentionBackend: TRITON_ATTN
    hipVisibleDevices: "0"
    servedModelName: qwen36-27b
    enableToolCalling: true
    enablePrefixCaching: false
    enforceEager: true
    disableLogStats: false
    warmPolicy: ondemand
  nodeSelector:
    kubernetes.io/hostname: cblevins-7900xtx
  resources:
    requests:
      cpu: "4"
      memory: 16Gi
    limits:
      cpu: "8"
      memory: 32Gi
  serviceLabels:
    - qwen36-27b
    - qwen3-uncensored
  litellm:
    enabled: true
    servedModelName: qwen36-27b
    aliases:
      - qwen36-27b
      - qwen3-6-27b
      # Reserved for promotion gate; do NOT route generic "qwen-uncensored"
      # traffic until smoke + a behavior diff vs HauhauCS Aggressive lane is
      # signed off.
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"

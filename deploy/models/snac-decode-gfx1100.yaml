# SNAC 24 kHz audio decode — Orpheus TTS waveform lane on ROCm gfx1100
#
# Purpose: turn Orpheus SNAC code frames into WAV on the GPU, so tts-lane
# (labs/tts-lane, tts.lan) stops decoding on CPU (~0.9x realtime; the lane's
# dominant latency per the 2026-08-22 twin benchmark). Serves
# POST /v1/audio/decode via the bundled server-snac.py inside the unified
# runtime image (backend `snac`, merged in !990).
#
# Why a lane and not a pod-local GPU: 2026-08-23 kill-test — a standalone
# tts-lane amd.com/gpu grant drew the Raphael iGPU (gfx1036, no torch
# kernels) while pinning one of the node's two device-plugin slots that the
# demand-scaled wan/stable-audio models need free to wake (reverted same day,
# gitops!625). The runtime election is the only correct owner of the card.
#
# Placement: cblevins-7900xtx via the persistent gfx1100 runtime pod, which
# owns the card and multiplexes backends without pod rolls. Decode bursts
# are ~1 s of GPU per utterance; tts-lane keeps its CPU fallback for cold
# or busy windows.
#
# 2026-08-24 election finding: the shared-group election applies to EVERY
# member with gpu.shared set — runtime-managed placement is NOT exempt; the
# earlier claim here that it was exempt shipped this model into a live deadlock.
# Single-slot election statically parked this model (430) behind the
# warm-pinned orpheus-3b-7900xtx (480), and the proxy fast-fails parked
# models 503 without recording demand, so it could never earn its way in.
# Fixed by gfx1100 GPUProfile features.multiModel (VRAM-bounded co-residency:
# orpheus 3300 + snac 1500 of 24576) plus, at the root, !1000 (2026-08-25):
# the controller no longer stamps the primary/ static park on multiModel
# members whose vramEstimateMB fits the budget alongside the Active set, so
# a cold request queues WITH demand and the election promotes it. The
# interim !998 warm-pin (minReplicas 1) was relaxed back to 0 once the
# fixed controller rolled out.
#
apiVersion: ai.flexinfer/v1alpha2
kind: Model
metadata:
  name: snac-decode-gfx1100
  namespace: flexinfer-system
  annotations:
    flexinfer.ai/serve-paths: /v1/audio/decode
    flexinfer.ai/purpose: "SNAC 24kHz waveform decode for Orpheus TTS (tts.lan GPU decode lane)"
spec:
  backend: snac
  source: HF://hubertsiuzdak/snac_24khz
  # NO cache block: SNACBackend.NeedsVolume() is false (server-snac.py pulls
  # the ~80MB decoder from the HF hub at load). Declaring strategy: Local here
  # deadlocks eligibility — ensureCache short-circuits on NeedsVolume without
  # ever writing Status.Cache, while DirectRuntimeLoadEligibility requires
  # Status.Cache.Ready whenever the SPEC declares a Local cache. Found live
  # 2026-08-24 ("staged Local cache is not ready" x50 with no cache job).
  gpu:
    vendor: amd
    count: 1
    # 2026-08-24 placement fix: persistent gfx1100 runtime pods exist only on
    # cblevins-7900xtx (the 5930k has none, so FindRuntimeForNode came up
    # empty and the runtime-managed flow could never place this model). The
    # runtime pod owns the card continuously and multiplexes backends — no
    # election queue — and it is the same node as tts.lan, so decode calls
    # stay node-local. Mirrors orpheus-3b-7900xtx.
    shared: 7900xtx-textgen
    priority: 430
    vramEstimateMB: 1500
  serverless:
    enabled: true
    # Scale-to-zero (minReplicas 0), restored 2026-08-25: !1000 exempts
    # budget-fitting multiModel members from the primary/ static-park stamp,
    # so a cold snac request queues with demand and promotes instead of
    # fast-failing 503 — the deadlock the !998 warm-pin worked around is
    # fixed at the root. tts-lane's CPU decode fallback covers the
    # cold-start window; when a big vllm member (e.g. the 9B, 23200MB)
    # wakes, the VRAM budget still evicts snac for that window.
    minReplicas: 0
    idleTimeout: 30m
    coldStartTimeout: 10m
  config:
    dtype: float16
    hipVisibleDevices: "0"
  nodeSelector:
    kubernetes.io/hostname: cblevins-7900xtx
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      cpu: "4"
      memory: 6Gi
  # Advertised so the proxy's parked-model gate cold-starts it by name
  # (cold on-demand lanes must be advertised — stable-audio convention).
  litellm:
    enabled: true
    servedModelName: snac-decode-gfx1100
    aliases:
      - snac-decode

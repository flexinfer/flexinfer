# Qwen2.5-1.5B via vLLM on AMD gfx906 (Radeon VII) — canary lane
#
# Closes Track C of `.loom/gfx1100-gfx906-next-round-plan.md` (revive-or-retire
# decision for gfx906 vLLM): chose Path A (revive). Track C investigation
# (`.loom/local/track-c-vllm-gfx906-investigation.md`) recommended the
# `mixa3607` base, but the live merged Dockerfile path (commit ea0bc1e0,
# 2026-05-02) reverted to source-built vLLM 0.7.3 on `rocm/vllm-dev:base`.
# That build is pinned in the gfx906 GPUProfile for operator-visible canary use:
# `registry.harbor.lan/flexinfer/vllm:rocm-gfx906@sha256:beadf394fc81c031799799f5d965664e419e5f3ffb4c5873a9d7677f0e1e06b8`.
#
# This manifest is the smallest model that exercises the full vLLM serve
# path on gfx906 hardware. The persistent gfx906 runtime does not bundle
# vLLM, so this canary must be served by the standalone GPUProfile backend
# image pinned in `deploy/gpuprofiles/gfx906.yaml` instead of the runtime
# direct-load API:
#   - Qwen2.5-1.5B FP16 ≈ 3 GB weights
#   - vLLM overhead ≈ 5-7 GB (KV cache + activations)
#   - Total budget: ~10-12 GB on a 16 GB Vega20 dGPU
#
# Coexists with the existing radeonvii-models pool entries: bge embeddings
# (~600 MB), qwen3-1p7b-tools llama.cpp tool-router (~1.5 GB), and SDXL
# inpainting (~6-8 GB CPU-offloaded). The vLLM canary stays scaled to zero,
# but its explicit canary aliases can preempt the CPU fallback while an
# operator is intentionally smoking the vLLM lane.
#
# Default: scaled to zero. Smoke procedure (manual; do NOT auto-promote):
#   1. Hit the proxy canary alias and let serverless cold-start
#      qwen3-1p7b-vllm-radeonvii through flexinfer-runtime-gfx906.
#   2. Wait for Ready phase on the Model and the active Service endpoint.
#   3. curl /v1/chat/completions through flexinfer-proxy with prompt
#      "The color of the sky is" (deterministic). Expect coherent reply.
#   4. Record evidence in .loom/60-validation-matrix.md as a `gfx906` textgen
#      canary row. If pass, follow up with a small MR flipping
#      `deploy/gpuprofiles/gfx906.yaml` `vllm.support: experimental -> full`.
#
# Block: vLLM 0.7.3 has known limits on gfx906 (no FP8 KV, no Marlin kernels;
# Triton AWQ is slow). Do NOT promote to a serving lane based on this canary
# alone — the canary's purpose is to validate the *import-and-serve* path,
# not to claim parity with the gfx1100 vLLM lane.
#
# 2026-05-17 live RALPH: DNS-safe naming, Local cache staging, and priority
# preemption all worked. The smoke exposed a controller/runtime readiness gap:
# the persistent runtime can be API-alive but pod-not-Ready while no backend is
# ready. Keep support experimental until the patched load path rolls out and
# this canary returns HTTP 200.
#
# 2026-05-18 prewarm follow-up: attempting to hold the standalone vLLM image
# warm on Radeon VII drove the node back into DiskPressure during image pull.
# Keep this canary scaled to zero and do not smoke it again until the node image
# store has enough free space for the digest outside the activation path.
#
# 2026-05-18 runtime follow-up: vLLM 0.7.3 does not implement Qwen3ForCausalLM
# natively. Keep the historical resource name for now, but use a Qwen2.5
# canary artifact that this vLLM generation can load without the Transformers
# fallback path.
#
# 2026-05-19 ROCm attention follow-up: Qwen2.5 advertises sliding-window
# attention, and vLLM 0.7.3 cannot serve that path reliably on gfx906. The
# canary disables sliding-window attention so the import-and-serve smoke can
# validate the Radeon VII vLLM lane without exercising unsupported SWA kernels.
apiVersion: ai.flexinfer/v1alpha2
kind: Model
metadata:
  name: qwen3-1p7b-vllm-radeonvii
  namespace: flexinfer-system
spec:
  backend: vllm
  source: HF://Qwen/Qwen2.5-1.5B-Instruct
  gpu:
    vendor: amd
    shared: radeonvii-models
    # Above the CPU fallback only for explicit canary traffic. The model stays
    # minReplicas=0 and owns only canary-scoped aliases.
    priority: 130
    count: 1
    vramEstimateMB: 10000
  serverless:
    enabled: true
    minReplicas: 0
    idleTimeout: 10m
    coldStartTimeout: 15m
  config:
    dtype: half
    maxModelLen: 4096
    gpuMemoryUtilization: "0.85"
    maxNumSeqs: 2
    disableSlidingWindow: true
    # ROCm gfx906 vLLM 0.7.3 — eager mode required to avoid CUDA-graph
    # compilation issues (gfx906 lacks the toolchain support that gfx1100/
    # gfx942 have).
    enforceEager: true
    trustRemoteCode: true
    servedModelName: qwen2.5-1.5b-vllm
    # gfx906 reports as gfx900; HSA_OVERRIDE_GFX_VERSION=9.0.6 is supplied
    # by the gfx906 GPUProfile env block. No per-model override needed.
    rocrVisibleDevices: "0"
  cache:
    size: 6Gi
    storageClass: nvme-1r
    strategy: Local
  nodeSelector:
    kubernetes.io/hostname: cblevins-radeonvii
  resources:
    requests:
      cpu: "2"
      memory: 8Gi
    limits:
      cpu: "6"
      memory: 16Gi
  serviceLabels:
    - vllm-canary
    - qwen2.5-1.5b-vllm
  litellm:
    enabled: true
    servedModelName: qwen2.5-1.5b-vllm
    # Carry only canary-scoped aliases. Do not claim generic chat aliases until
    # the gfx906 vLLM lane has live HTTP 200 evidence.
    aliases:
      - vllm-canary
      - qwen2.5-1.5b-vllm
      - qwen2.5-1.5b-vllm-vii

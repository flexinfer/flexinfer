# Wan 2.1 1.3B text-to-video lane on cblevins-7900xtx (gfx1100).
#
# 2026-10-30 MOVED back to the 7900xtx flex card (placement layout,
# .loom/10-research-voice-stack-and-gpu-placement-2026-10-30.md §6). The
# 5930k is now the always-on workhorse card (900, minReplicas 1), where
# this lane would be statically parked. In 7900xtx-textgen, 500 outranks the
# idle tenant (the Mills warm lane, 300 ondemand) and ties the other creative
# lanes, so they queue first-come-first-served without killing a render.
# idleTimeout 30m -> 15m hands the card back to the warm lane sooner. The
# 2026-07-18 note below is history.
#
# 2026-07-18 psyche fleet layout: rehomed from cblevins-7900xtx so the 7900xtx
# card is the psyche TEXT lane (warm qwen35-9b-ablit-rp) and the 5930k gfx1100
# card is the psyche VIDEO lane. This Model is the warm video primary here;
# the demoted 5930k Qwen workhorse (priority 300, minReplicas 0) cold-starts
# on demand but loses the election to video.
# Remove this parent Model (not its Deployment/pod) to roll the lane back.
#
# 2026-11-01 D1 step 3 (S6c, research next-differentiators-2026-10-31 §6.1;
# WINDOW-GATED): served IN-POD by the 7900xtx runtime DaemonSet instead of its
# own Deployment, so a render swaps the XTX warm lane out and back inside the
# runtime pod.
# - dedicatedDeployment dropped; spec.image stays the dedicated rollback image.
# - Compile cache: scope Image on the default hostPath, the directory the
#   runtime pod mounts at /cache/compile.
# Runtime image: 527e2714 (rocm-gfx1100-serving-v032-ddf22437, live on the XTX runtime since !1234 on 2026-11-04). It carries imageio 2.37.0, imageio-ffmpeg 0.6.0 (H.264
# export) and ftfy 6.3.1, and its server-diffusers.py has the Wan VAE MIOpen
# bypass (!1268, 225b7150); checked in the live runtime pod 2026-11-05. Its
# stack is torch 2.13 / ROCm 7.2.3 (MIOpen of that release), not the dedicated
# image's. S9 (2026-11-05/06, rows gfx1100-wan-decode-ab-v032-*) A/B'd it
# against the dedicated lane (b1f98ad0, warm clip 121.7 s, decode 5.9 s).
#
# 2026-11-21 refresh: the allocator pinned (config.env below).
# - S9 cause: expandable_segments:True with model CPU offload on this stack
#   holds ~19 GiB on the card outside torch's accounting and corrupts every
#   VAE use after the first in a process. In-pod this lane would inherit the
#   runtime pod's PYTORCH_ALLOC_CONF (gc 0.7, split 256, expandable True),
#   which torch 2.13 reads before PYTORCH_HIP_ALLOC_CONF.
# - With both variables off (S9 diagnostic dx-B-noexp2, untiled) the lane was
#   sound in one process across three VAE uses: decode 6.1/5.8 s, clips in
#   61-70 s against 122 s dedicated, card peak 24,431 MiB (the dedicated lane
#   peaks at 24.47 GB too). It missed S9's pre-registered decode equivalence
#   against the dedicated lane's latents: 34.22/31.76 dB and SSIM 0.9789
#   against 35/32/0.98. Whether that is acceptable is the owner's call, and
#   it needs a pre-registered gate row before this merges.
# - The same pin made Qwen-Image sound in-pod on 2026-11-21 (D3 third
#   attempt, !1368, row gfx1100-xtx-inpod-qwen-image-gate-2026-11-19).
# Host RAM: this lane's dedicated limit (48 GiB) equals the runtime pod's
# whole limit; a render that needed all of it in-pod would leave the runtime
# manager nothing.
# Rollback: revert this commit (restores dedicatedDeployment and the cache
# config); the Deployment returns on the next reconcile.
apiVersion: ai.flexinfer/v1alpha2
kind: Model
metadata:
  name: wan21-t2v-1p3b-gfx1100
  namespace: flexinfer-system
  annotations:
    flexinfer.ai/serve-paths: /v1/videos/generations
    # flexinfer-proxy cancels a forward with no response byte inside the lane
    # first-byte budget (default 120 s, 504 "upstream first byte budget
    # exceeded", internal/proxy/routing_retry.go). The diffusers server answers
    # once the clip is rendered, and a cold start adds the weight load, so 480p
    # clips through the proxy need the same budget as Qwen-Image (KT-FLEX,
    # 2026-11-01). Direct callers of the lane Service are unaffected.
    # 2026-11-03 KT-FLEX rerun on the XTX: a 33-frame 832x480 20-step clip
    # took 506 s to its first byte (server timing: denoise 137 s, VAE
    # decode + postprocess 367 s; the July proving run took 6m57s), so 600 s
    # left ~90 s of margin. 900 s covers the decode-bound floor with room.
    flexinfer.ai/lane-first-byte-budget: "900s"
    flexinfer.ai/purpose: 480p text-to-video on ROCm gfx1100
    flexinfer.ai/plan: .loom/30-implementation-plan-video-gen-gfx1100-2026-07-14.md
spec:
  backend: diffusers
  # Wan requires PyTorch >=2.4. This dedicated tag uses the ROCm 6.4.1 /
  # PyTorch 2.6 build and leaves the proven image-generation runtime untouched.
  image: registry.harbor.lan/flexinfer/diffusers-video:rocm-gfx1100
  # 2026-10-27 (pin hygiene): repinned from f03bfc2f (the off-CI
  # rocm-gfx1100-compile-inplace-20260714 build; Harbor-resident but tagged
  # for no guard) to 83cda206, the CI build from 2026-08-23 master that the
  # floating tag points at and the 5930k prewarm list holds (pinned-83cda206faea).
  # Its server-diffusers.py carries the in-place compile path this lane's
  # compileMode needs (0c8c7b1bb) and the VACE mode the sibling uses.
  # 2026-11-03: repinned from 83cda206 to rocm-gfx1100-2c0cc642 (API
  # pipeline 37384 job 460942), the first master build with !1268.
  # It runs the bf16 Wan VAE with MIOpen off. MIOpen 3.4 only offers gfx1100
  # its naive kernel for the VAE's 3D convs, so a 33-frame 832x480 clip spent
  # 370 s in decode. The PyTorch im2col path takes 5-11 s (A/B in .loom/
  # 70-result-kt-flex-flex-card-2026-11-01.md). Same recipe and base
  # otherwise: 58 of 60 layers are 83cda206's, the other two are the
  # server scripts. Rollback = 83cda206, still prewarmed on the XTX.
  imageDigest: sha256:b1f98ad0d9adbf8927145bed242e5e49b5cc0f6ac3fa27196cbc4c3e885644bb
  source: HF://Wan-AI/Wan2.1-T2V-1.3B-Diffusers
  cache:
    strategy: Local
    storageClass: nvme-1r-gpu
    size: 32Gi
    # Keep the warm model on persistent local NVMe. A shared-model flash loader
    # uses a persistent /dev/shm hostPath, so its 28Gi copy plus Wan CPU offload
    # leaves this 63Gi node with less than 2Gi available memory.
    flashLoader:
      enabled: false
    compilationCache:
      enabled: true
      # 2026-11-01 D1: image-scoped on the default hostPath, shared with the
      # runtime pod (header).
      scope: Image
      sizeLimit: 6Gi
  gpu:
    vendor: amd
    # cblevins-7900xtx exposes the dGPU and the Raphael iGPU as two
    # device-plugin slots: claim both so the pod can never be handed the iGPU.
    count: 2
    shared: 7900xtx-textgen
    priority: 500
    vramEstimateMB: 18000
  serverless:
    enabled: true
    # Parked (1 -> 0) for the qwen35-9b twin canary window: minReplicas=1 makes
    # this holder unpreemptable, which starves every higher-priority member of
    # 5930k-textgen (VACE at 600 and the twin at 550 both queued for hours).
    # Restore to 1 + warmPolicy: primary when the twin canary cascade closes.
    minReplicas: 0
    # 2026-10-30: 30m -> 15m, same hand-back window as the other creative lanes.
    idleTimeout: 15m
    coldStartTimeout: 30m
  config:
    pipelineMode: text2video
    modelFamily: wan
    dtype: bfloat16
    cpuOffload: "true"
    # The transformer accounts for ~88% of matched warm-request latency. Wan
    # supports combining model CPU offload with torch.compile; the host-backed
    # compilation cache amortizes the first-request compilation cost.
    # `reduce-overhead` captures CUDA graphs whose output is overwritten by
    # Wan's second classifier-free-guidance transformer call. Autotune without
    # CUDA graphs keeps the safe execution model while tuning generated kernels.
    compileMode: max-autotune-no-cudagraphs
    # Accelerate's model-offload hook performs device moves that cannot be
    # captured in a single full graph; allow graph breaks around those hooks.
    compileFullgraph: "false"
    # Image warmup assumes a 2D pipeline. The first video request is the
    # bounded compile/warm pass for this cold lane.
    skipWarmup: "1"
    numInferenceSteps: "30"
    guidanceScale: "5.0"
    videoSize: 832x480
    videoFrames: "81"
    videoFps: "16"
    negativePrompt: "static, blurry, low quality, distorted, watermark, subtitles, text"
    hipVisibleDevices: "0"
    # Pair with minReplicas=0 during the twin canary window (same parking shape
    # as the Fable GPTQ smoke). `primary` forces a backend start even at zero
    # replicas and would keep the GPU held.
    warmPolicy: ondemand
    # 2026-11-21 (header): no expandable_segments, on both names so torch's
    # precedence does not matter; overrides the runtime pod's
    # PYTORCH_ALLOC_CONF in-pod (config.env is applied last). Same values as
    # qwen-image-21-gfx1100 (!1368).
    env:
      PYTORCH_ALLOC_CONF: "garbage_collection_threshold:0.9,max_split_size_mb:512,expandable_segments:False"
      PYTORCH_HIP_ALLOC_CONF: "garbage_collection_threshold:0.9,max_split_size_mb:512,expandable_segments:False"
  nodeSelector:
    kubernetes.io/hostname: cblevins-7900xtx
  resources:
    requests:
      cpu: "4"
      memory: 16Gi
    limits:
      cpu: "8"
      memory: 48Gi
  serviceLabels:
    - video-gen
    - text-to-video
    - wan21
    - wan21-t2v-480p
  litellm:
    enabled: true
    servedModelName: wan21-t2v-1p3b-gfx1100
    aliases:
      - video-gen
      - text-to-video
      - wan21-t2v-480p
  tolerations:
    - effect: NoSchedule
      key: node-role.kubernetes.io/control-plane
      operator: Exists

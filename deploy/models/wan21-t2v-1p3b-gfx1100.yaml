# Wan 2.1 1.3B text-to-video lane on cblevins-5930k (gfx1100).
#
# 2026-07-18 psyche fleet layout: rehomed from cblevins-7900xtx so the 7900xtx
# card is the psyche TEXT lane (warm qwen35-9b-ablit-rp) and the 5930k gfx1100
# card is the psyche VIDEO lane. This Model is the warm video primary here;
# the demoted 5930k Qwen workhorse (priority 300, minReplicas 0) cold-starts
# on demand but loses the election to video.
# Remove this parent Model (not its Deployment/pod) to roll the lane back.
apiVersion: ai.flexinfer/v1alpha2
kind: Model
metadata:
  name: wan21-t2v-1p3b-gfx1100
  namespace: flexinfer-system
  annotations:
    flexinfer.ai/serve-paths: /v1/videos/generations
    flexinfer.ai/purpose: 480p text-to-video on ROCm gfx1100
    flexinfer.ai/plan: .loom/30-implementation-plan-video-gen-gfx1100-2026-07-14.md
spec:
  backend: diffusers
  # Wan requires PyTorch >=2.4. This dedicated tag uses the ROCm 6.4.1 /
  # PyTorch 2.6 build and leaves the proven image-generation runtime untouched.
  image: registry.harbor.lan/flexinfer/diffusers-video:rocm-gfx1100
  imageDigest: sha256:f03bfc2fbde17528aec2f95f656630c8a402385a70f591ff52931748a34ff599
  source: HF://Wan-AI/Wan2.1-T2V-1.3B-Diffusers
  cache:
    strategy: Local
    storageClass: nvme-1r-gpu
    size: 32Gi
    # Keep the warm model on persistent local NVMe. A shared-model flash loader
    # uses a persistent /dev/shm hostPath, so its 28Gi copy plus Wan CPU offload
    # leaves this 63Gi node with less than 2Gi available memory.
    flashLoader:
      enabled: false
    compilationCache:
      enabled: true
      hostPath: /var/lib/flexinfer/compile-cache
      sizeLimit: 6Gi
  gpu:
    vendor: amd
    # cblevins-5930k exposes a single gfx1100 device-plugin slot (no iGPU).
    count: 1
    shared: 5930k-textgen
    priority: 500
    vramEstimateMB: 18000
  serverless:
    enabled: true
    # Parked (1 -> 0) for the qwen35-9b twin canary window: minReplicas=1 makes
    # this holder unpreemptable, which starves every higher-priority member of
    # 5930k-textgen (VACE at 600 and the twin at 550 both queued for hours).
    # Restore to 1 + warmPolicy: primary when the twin canary cascade closes.
    minReplicas: 0
    idleTimeout: 30m
    coldStartTimeout: 30m
  config:
    # The gfx1100 GPUProfile bundles the older generic Diffusers runtime. This
    # lane must exercise its model-specific PyTorch 2.6 image instead.
    dedicatedDeployment: true
    pipelineMode: text2video
    modelFamily: wan
    dtype: bfloat16
    cpuOffload: "true"
    # The transformer accounts for ~88% of matched warm-request latency. Wan
    # supports combining model CPU offload with torch.compile; the host-backed
    # compilation cache amortizes the first-request compilation cost.
    # `reduce-overhead` captures CUDA graphs whose output is overwritten by
    # Wan's second classifier-free-guidance transformer call. Autotune without
    # CUDA graphs keeps the safe execution model while tuning generated kernels.
    compileMode: max-autotune-no-cudagraphs
    # Accelerate's model-offload hook performs device moves that cannot be
    # captured in a single full graph; allow graph breaks around those hooks.
    compileFullgraph: "false"
    # Image warmup assumes a 2D pipeline. The first video request is the
    # bounded compile/warm pass for this cold lane.
    skipWarmup: "1"
    numInferenceSteps: "30"
    guidanceScale: "5.0"
    videoSize: 832x480
    videoFrames: "81"
    videoFps: "16"
    negativePrompt: "static, blurry, low quality, distorted, watermark, subtitles, text"
    hipVisibleDevices: "0"
    # Pair with minReplicas=0 during the twin canary window (same parking shape
    # as the Fable GPTQ smoke). `primary` forces a backend start even at zero
    # replicas and would keep the GPU held.
    warmPolicy: ondemand
  nodeSelector:
    kubernetes.io/hostname: cblevins-5930k
  resources:
    requests:
      cpu: "4"
      memory: 16Gi
    limits:
      cpu: "8"
      memory: 48Gi
  serviceLabels:
    - video-gen
    - text-to-video
    - wan21
    - wan21-t2v-480p
  litellm:
    enabled: true
    servedModelName: wan21-t2v-1p3b-gfx1100
    aliases:
      - video-gen
      - text-to-video
      - wan21-t2v-480p
  tolerations:
    - effect: NoSchedule
      key: node-role.kubernetes.io/control-plane
      operator: Exists

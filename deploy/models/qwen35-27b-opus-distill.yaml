# Qwen3.5-27B via vLLM on AMD gfx1100 — dedicated on cblevins-7900xtx
#
# GPTQ INT4 ~17 GiB (all layers quantized), abliterated (attention layers only,
# skipGDNLayers=true). Source: GPTQ cache PVC with re-quantized weights.
# Runtime: Unified runtime with vLLM Qwen3.5 patches baked in at build time.
#
# maxModelLen=4096 to minimize KV cache budget.
# maxNumSeqs=2 to reduce concurrent memory pressure.
#
apiVersion: ai.flexinfer/v1alpha2
kind: Model
metadata:
  name: qwen35-27b-opus-distill
  namespace: flexinfer-system
spec:
  backend: vllm
  source: pvc://qwen35-27b-opus-distill-gptq/qwen35-27b-opus-distill-gptq/gptq-w4-g128
  cache:
    strategy: Local
  gpu:
    vendor: amd
    count: 2
    vramEstimateMB: 18000
  serverless:
    enabled: true
    minReplicas: 0
    idleTimeout: 60m
    coldStartTimeout: 15m
  config:
    quantization: gptq
    dtype: "half"
    maxModelLen: 4096
    gpuMemoryUtilization: "0.95"
    maxNumSeqs: 2
    enforceEager: true
    trustRemoteCode: true
    servedModelName: qwen35-27b-opus-distill
    enableToolCalling: true
    toolCallParser: hermes
    maxNumBatchedTokens: 2048
    disableLogStats: false
    warmPolicy: primary
    hipVisibleDevices: "0"
  nodeSelector:
    kubernetes.io/hostname: cblevins-7900xtx
  resources:
    requests:
      cpu: "2"
      memory: 16Gi
    limits:
      cpu: "4"
      memory: 56Gi
  serviceLabels:
    - qwen35-27b-opus-distill
    - qwen35-27b-opus
  litellm:
    enabled: true
    servedModelName: qwen35-27b-opus-distill
    aliases:
      - qwen35-27b-opus
      - qwen35-opus

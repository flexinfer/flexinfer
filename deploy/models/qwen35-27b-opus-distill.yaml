# Qwen3.5-27B via vLLM on AMD gfx1100
#
# Model: Qwen3.5-27B, GPTQ INT4 (self-quantized pipeline, clean weights).
# Source: OCI artifact in Harbor (pushed from radeonvii quantization pipeline).
# Image: Patched vLLM with Qwen3.5 support (FLA kernels, qwen3_5_text registration).
# Weights: ~16.6 GiB GPTQ INT4 (5 shards + metadata).
#
# maxModelLen=4096 to minimize KV cache budget.
# maxNumSeqs=2 to reduce concurrent memory pressure.
#
apiVersion: ai.flexinfer/v1alpha2
kind: Model
metadata:
  name: qwen35-27b-opus-distill
  namespace: flexinfer-system
spec:
  backend: vllm
  image: registry.harbor.lan/flexinfer/vllm:rocm-gfx1100-qwen35-patched
  source: pvc://qwen35-27b-opus-distill-oci/qwen35-27b-opus-distill
  gpu:
    vendor: amd
    count: 2
    vramEstimateMB: 15000
  serverless:
    enabled: true
    minReplicas: 0
    idleTimeout: 60m
    coldStartTimeout: 15m
  config:
    quantization: gptq
    dtype: "half"
    maxModelLen: 4096
    gpuMemoryUtilization: "0.95"
    maxNumSeqs: 2
    enforceEager: true
    trustRemoteCode: true
    servedModelName: qwen35-27b-opus-distill
    enableToolCalling: true
    toolCallParser: hermes
    maxNumBatchedTokens: 2048
    disableLogStats: false
    cpuOffloadGb: "6"
    warmPolicy: primary
    hipVisibleDevices: "0"
  nodeSelector:
    kubernetes.io/hostname: cblevins-7900xtx
  resources:
    requests:
      cpu: "2"
      memory: 16Gi
    limits:
      cpu: "4"
      memory: 56Gi
  serviceLabels:
    - qwen35-27b-opus-distill
    - qwen35-27b-opus
  litellm:
    enabled: true
    servedModelName: qwen35-27b-opus-distill
    aliases:
      - qwen35-27b-opus
      - qwen35-opus

# Qwen3.5-27B via vLLM on AMD gfx1100
#
# Model: Qwen/Qwen3.5-27B-GPTQ-Int4 (official GPTQ, not abliterated)
# Temporary: using official GPTQ while self-quantization pipeline is fixed.
# TODO: switch back to abliterated source once quantization OOM is resolved.
#
# Dynamic quantization: attn layers FP16, MoE experts INT4.
# Total model weights: ~29 GiB on disk.
# moe_wna16 not supported on ROCm — using gptq (ExllamaV2 HIP kernels).
# May OOM on 24GB gfx1100 — monitor VRAM usage.
#
# maxModelLen=4096 to minimize KV cache budget.
# maxNumSeqs=2 to reduce concurrent memory pressure.
#
apiVersion: ai.flexinfer/v1alpha2
kind: Model
metadata:
  name: qwen35-27b-opus-distill
  namespace: flexinfer-system
spec:
  backend: vllm
  source: pvc://qwen35-27b-opus-distill-gptq/qwen35-27b-gptq-int4
  gpu:
    vendor: amd
    count: 2
    vramEstimateMB: 15000
  serverless:
    enabled: true
    minReplicas: 0
    idleTimeout: 60m
    coldStartTimeout: 15m
  config:
    quantization: gptq
    dtype: "half"
    maxModelLen: 4096
    gpuMemoryUtilization: "0.95"
    maxNumSeqs: 2
    enforceEager: true
    trustRemoteCode: true
    servedModelName: qwen35-27b-opus-distill
    enableToolCalling: true
    toolCallParser: hermes
    maxNumBatchedTokens: 2048
    disableLogStats: false
    warmPolicy: primary
    hipVisibleDevices: "0"
  nodeSelector:
    kubernetes.io/hostname: cblevins-7900xtx
  resources:
    requests:
      cpu: "2"
      memory: 16Gi
    limits:
      cpu: "4"
      memory: 56Gi
  serviceLabels:
    - qwen35-27b-opus-distill
    - qwen35-27b-opus
  litellm:
    enabled: true
    servedModelName: qwen35-27b-opus-distill
    aliases:
      - qwen35-27b-opus
      - qwen35-opus

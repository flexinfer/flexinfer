# Demand-only Qwen3.6-27B Fable Fusion GPTQ lane qualified on gfx1100.
#
# The artifact is produced from the exact BF16 source of DavidAU's Fable
# Fusion 711 GGUF by deploy/modelcaches/qwen36-27b-fable-gptq.yaml. It uses the
# dedicated vLLM 0.23 gfx1100 runtime, compiled from the upstream release with
# its native RDNA3 W4A16 HIP operator. Keep the qualified runtime digest pinned
# so profile defaults cannot silently move this model back to a generic kernel.
#
# v1 is intentionally text-only and does not enable native MTP. Its 2026-07-21
# gfx1100 qualification passed artifact validation, deterministic greedy
# coherence, a 5-prompt quality smoke, and VRAM fit. Keep the unique alias and
# minReplicas=0: the legacy ROCm GPTQ reference path was correct but only
# ~0.61 tok/s, while an earlier generic fused path corrupted production-shape
# output. The native lane produced coherent deterministic output at about
# 8.7 tok/s, roughly 14x the legacy reference path.
apiVersion: ai.flexinfer/v1alpha2
kind: Model
metadata:
  name: qwen36-27b-fable-gptq
  namespace: flexinfer-system
  annotations:
    flexinfer.ai/base-model-source: nightmedia/Qwen3.6-27B-Architect-Polaris2-Fable-B-F451
    flexinfer.ai/source-revision: 5ae530c3ab85033856e75cb1efc63fb1bf82a133
    flexinfer.ai/base-model-posture: uncensored-heretic-fable-fusion
    flexinfer.ai/artifact-oci: registry.harbor.lan/flexinfer/qwen36-27b-fable@sha256:285a044529f6321f954353c93c5a91f771cfdfc7445ad25af5d64b7926d83710
    flexinfer.ai/runtime-image: registry.harbor.lan/flexinfer/runtime@sha256:b06b06fe1c0265ce207f3fc719c181e8edd18eae50bdb8490c122800b17abfe2
    flexinfer.ai/promotion-state: gfx1100-native-w4a16-text-qualified
spec:
  backend: vllm
  # 2026-10-25 (issue #74 S2, vLLM currency): REPINNED from the source-built
  # vLLM 0.23 runtime `2e9652ed`, which is gone from Harbor and from this node,
  # to the CI-built vLLM 0.32 native-W4A16 image (master pipeline 34797). The
  # upstream 0.32 ROCm wheel now carries the RDNA3 GPTQ operator itself, so no
  # source build is needed. Every flag this lane renders exists in 0.32 except
  # --no-calculate-kv-scales (key dropped below). Re-qualified by a boot +
  # probe on 2026-10-25 (matrix row parked-5930k-lanes-v032-2026-10-25).
  image: registry.harbor.lan/flexinfer/runtime@sha256:b06b06fe1c0265ce207f3fc719c181e8edd18eae50bdb8490c122800b17abfe2
  # 2026-09-13: the 5930k OCI cache (qwen36-27b-fable-oci) was deleted to reclaim
  # the node's root; stage from the NFS ModelCache (qwen36-27b-fable-gptq ->
  # llm-models-nfs:qwen36-27b-fable) instead. Same artifact; a cold start copies
  # from NFS into the Local cache once (demand-only canary, minReplicas 0).
  # Point at the GPTQ output subdir: the NFS ModelCache root also holds the 12
  # BF16 source shards (52 G), and the first re-stage (2026-09-14 01:23Z)
  # copied all 69 G onto the 5930k root before this was corrected.
  source: pvc://llm-models-nfs/qwen36-27b-fable/gptq-w4-g128
  cache:
    strategy: Local
  gpu:
    vendor: amd
    count: 1
    shared: 5930k-textgen
    # Match the warm WAN primary so explicit Fable demand may borrow an idle
    # card without preempting active video traffic. Higher-priority VACE stays
    # authoritative. A lower priority is statically parked by proxy design.
    priority: 500
    vramEstimateMB: 22000
  serverless:
    enabled: true
    minReplicas: 0
    # Native vLLM cold start is about two minutes. Keep the demand-only lane
    # alive long enough for qualification and ordinary responses; one minute
    # caused it to self-reap immediately after readiness and between probes.
    idleTimeout: 10m
    coldStartTimeout: 20m
  config:
    # RDNA3 long-context decode fix (2026-08-16): vLLM's ROCm default picks
    # ROCM_ATTN, whose decode has no KV-length parallelism — single-stream
    # decode collapses linearly with context (research doc 8c/8e fleet
    # ceiling). TRITON_ATTN engages the unified-attention 3D split-KV decode:
    # canary 36 tok/s @30K and 32 @60K vs 4.0/2.0 baseline (9-16x). Kernel
    # evidence: deploy/debug/gfx1100-unified-attn-decode-probe.yaml.
    attentionBackend: TRITON_ATTN
    warmPolicy: ondemand
    quantization: gptq
    dtype: half
    languageModelOnly: true
    # Strip multimodal M-RoPE fields and force the text model class emitted by
    # the source-specific quantizer policy.
    hfOverrides: '{"architectures":["Qwen3_5ForCausalLM"],"rope_parameters":{"rope_type":"default","rope_theta":10000000,"partial_rotary_factor":0.25}}'
    # Keep the qualified 8K safety envelope. Qwen3.6 is native 262K, but larger
    # contexts require a separate VRAM and latency qualification on this card.
    maxModelLen: 8192
    maxInputTokens: 6144
    maxOutputTokens: 2048
    maxNumSeqs: 1
    maxNumBatchedTokens: 2048
    enableChunkedPrefill: true
    gpuMemoryUtilization: "0.90"
    # `calculateKvScales: false` left with the 0.32 repin (2026-10-25): vLLM
    # 0.28 removed the flag, and with fp16 KV it never had an effect here.
    kvCacheDtype: auto
    # Keep the conservative scheduler posture used for the successful native
    # W4A16 qualification. Context and scheduler tuning remain separate work.
    enforceEager: true
    enablePrefixCaching: false
    disableAiter: true
    rocmCustomPagedAttn: false
    hipVisibleDevices: "0"
    trustRemoteCode: true
    enableToolCalling: true
    toolCallParser: qwen3_coder
    servedModelName: qwen36-27b-fable-gptq
    disableLogStats: false
    # Unknown environment validation stays non-fatal for the immutable ROCm
    # base image, which carries variables outside vLLM's own registry.
    failOnEnvironValidation: false
  nodeSelector:
    kubernetes.io/hostname: cblevins-5930k
  resources:
    requests:
      cpu: "4"
      memory: 16Gi
    limits:
      cpu: "8"
      memory: 40Gi
  serviceLabels:
    - qwen36-27b-fable-gptq
  litellm:
    enabled: true
    servedModelName: qwen36-27b-fable-gptq
    aliases:
      - qwen36-27b-fable-gptq
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

# Demand-only Qwen3.6-27B Fable Fusion GPTQ canary on gfx1100.
#
# The artifact is produced from the exact BF16 source of DavidAU's Fable
# Fusion 711 GGUF by deploy/modelcaches/qwen36-27b-fable-gptq.yaml. It uses the
# persistent gfx1100 runtime, whose current digest carries the load-bearing
# ROCm 4-bit GPTQ shuffle guard plus the correctness-first dense fallback.
# Upstream vLLM's compatibility matrix still marks GPTQ unsupported on AMD;
# this lane therefore must not run on an unpatched stock image.
#
# v1 is intentionally text-only and does not enable native MTP. Its 2026-07-21
# gfx1100 qualification passed artifact validation, deterministic greedy
# coherence, a 5-prompt quality smoke, and VRAM fit. Keep the unique alias and
# minReplicas=0: the ROCm GPTQ reference path is correct but only ~0.61 tok/s.
apiVersion: ai.flexinfer/v1alpha2
kind: Model
metadata:
  name: qwen36-27b-fable-gptq
  namespace: flexinfer-system
  annotations:
    flexinfer.ai/base-model-source: nightmedia/Qwen3.6-27B-Architect-Polaris2-Fable-B-F451
    flexinfer.ai/source-revision: 5ae530c3ab85033856e75cb1efc63fb1bf82a133
    flexinfer.ai/base-model-posture: uncensored-heretic-fable-fusion
    flexinfer.ai/artifact-oci: registry.harbor.lan/flexinfer/qwen36-27b-fable@sha256:285a044529f6321f954353c93c5a91f771cfdfc7445ad25af5d64b7926d83710
    flexinfer.ai/runtime-image: registry.harbor.lan/flexinfer/runtime@sha256:6ee8b3ed6bd0f80ba669f9a5a8525c9323592d1aa84fdf64b2a48f061fa4220e
    flexinfer.ai/promotion-state: gfx1100-fused-gptq-failed-token-corruption
spec:
  backend: vllm
  # Keep the known-coherent reference implementation pinned until the fused
  # kernel passes full production-shape logit parity on gfx1100.
  image: registry.harbor.lan/flexinfer/runtime@sha256:6ee8b3ed6bd0f80ba669f9a5a8525c9323592d1aa84fdf64b2a48f061fa4220e
  source: pvc://qwen36-27b-fable-oci/qwen36-27b-fable
  cache:
    strategy: Local
  gpu:
    vendor: amd
    count: 1
    shared: 5930k-textgen
    # Match the warm WAN primary so explicit Fable demand may borrow an idle
    # card without preempting active video traffic. Higher-priority VACE stays
    # authoritative. A lower priority is statically parked by proxy design.
    priority: 500
    vramEstimateMB: 22000
  serverless:
    enabled: true
    minReplicas: 0
    # Reap failed/experimental activations quickly so the warm WAN leader is
    # restored without leaving this demand-only canary on the shared GPU.
    idleTimeout: 1m
    coldStartTimeout: 20m
  config:
    warmPolicy: ondemand
    quantization: gptq
    dtype: half
    languageModelOnly: true
    # Strip multimodal M-RoPE fields and force the text model class emitted by
    # the source-specific quantizer policy.
    hfOverrides: '{"architectures":["Qwen3_5ForCausalLM"],"rope_parameters":{"rope_type":"default","rope_theta":10000000,"partial_rotary_factor":0.25}}'
    # Start with a small qualification envelope. Qwen3.6 is native 262K, but
    # context is raised only after the artifact's weight fit and coherence pass.
    maxModelLen: 8192
    maxInputTokens: 6144
    maxOutputTokens: 2048
    maxNumSeqs: 1
    maxNumBatchedTokens: 2048
    enableChunkedPrefill: true
    gpuMemoryUtilization: "0.90"
    kvCacheDtype: auto
    calculateKvScales: false
    # Match the supported Qwen3.5 hybrid posture on the pinned gfx1100 image.
    # Do not emit the newer gdnPrefillBackend or schedulerReserveFullISL flags:
    # The pinned vLLM 0.17 runtime rejects both before model loading.
    enforceEager: true
    enablePrefixCaching: false
    disableAiter: true
    rocmCustomPagedAttn: false
    hipVisibleDevices: "0"
    trustRemoteCode: true
    enableToolCalling: true
    toolCallParser: qwen3_coder
    servedModelName: qwen36-27b-fable-gptq
    disableLogStats: false
    # The pinned unified runtime carries legacy VLLM_USE_TRITON_FLASH_ATTN in
    # its image environment; vLLM 0.17 no longer recognizes that variable.
    # Unknown-env validation must remain non-fatal for this immutable image.
    failOnEnvironValidation: false
  nodeSelector:
    kubernetes.io/hostname: cblevins-5930k
  resources:
    requests:
      cpu: "4"
      memory: 16Gi
    limits:
      cpu: "8"
      memory: 40Gi
  serviceLabels:
    - qwen36-27b-fable-gptq
  litellm:
    enabled: true
    servedModelName: qwen36-27b-fable-gptq
    aliases:
      - qwen36-27b-fable-gptq
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

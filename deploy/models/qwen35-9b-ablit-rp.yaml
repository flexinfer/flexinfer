# Abliterated Qwen3.5-9B @ 224K context + NSFW-RP LoRA — primary RP lane.
#
# Warm-primary member of the 7900xtx-textgen shared group on cblevins-7900xtx.
# The LoRAAdapter qwen35-9b-nsfw-rp targets this model; the controller auto-injects
# --enable-lora, --max-loras, --max-lora-rank 64, and VLLM_ALLOW_RUNTIME_LORA_UPDATING.
#
# ModelExperiment/qwen35-9b-context-ceiling-224k-canary PASSED twice on
# 2026-07-22 on the vLLM 0.23 runtime 2e9652ed: native RDNA3 W4A16, graphs
# 1/2/4, rank-64 LoRA, >55 aggregate tok/s across two RP streams, and exact
# 5/5 recall in two independent 223,969-token prompts. The lane runs the 0.32
# image below since 2026-10-27 (see spec.image). Normal requests default to
# non-thinking; clients can opt in with chat_template_kwargs.enable_thinking=true.
# Reach the adapter via model="nsfw-rp".
apiVersion: ai.flexinfer/v1alpha2
kind: Model
metadata:
  name: qwen35-9b-ablit-rp
  namespace: flexinfer-system
  annotations:
    flexinfer.ai/base-model-source: Qwen/Qwen3.5-9B
    flexinfer.ai/base-model-posture: abliterated
    flexinfer.ai/artifact-oci: registry.harbor.lan/flexinfer/qwen35-9b:gptq-w4-g128
    flexinfer.ai/runtime-digest: sha256:b06b06fe1c0265ce207f3fc719c181e8edd18eae50bdb8490c122800b17abfe2
    # Earned on 2e9652ed (vLLM 0.23); the 0.32 engine is covered by the 5930k
    # twin's re-qualification, not by this certificate (see spec.image).
    flexinfer.ai/canary-certificate: qwen35-9b-context-ceiling-224k-canary-generation-4
spec:
  backend: vllm
  # 2026-10-27 (pin hygiene, research serving-gaps §7): REPINNED from the vLLM
  # 0.23 runtime 2e9652ed, which Harbor retention deleted on 2026-10-21 (it
  # survived only as this node's prewarm snapshot, so a reinstall or image GC
  # would have ended the lane). New pin: the CI-built vLLM 0.32 native-W4A16
  # image (master pipeline 34797) that the 5930k twin and workhorse run, so
  # the twins share an engine again. The twin is the template: every flag this
  # lane renders exists in 0.32 except --no-calculate-kv-scales (key dropped
  # below) and the compile cache moves to a fresh path. Evidence: matrix row
  # parked-5930k-lanes-v032-2026-10-25 (the twin, same artifact and config:
  # 694,559 tokens / 3.03x at 229,376, base + adapter probes 3/3, 103.5 /
  # 68.5 tok/s). This lane is parked (minReplicas 0), so the repin boots
  # nothing; the first activation on this card is its own check: read the
  # boot's KV pool (>= 3x at 229,376 for 4 seqs, else the KVPoolRecheck
  # relaunch) and probe base + nsfw-rp. Rollback = 2e9652ed while the 7900xtx
  # prewarm list still holds it; after that, fix forward.
  image: registry.harbor.lan/flexinfer/runtime@sha256:b06b06fe1c0265ce207f3fc719c181e8edd18eae50bdb8490c122800b17abfe2
  # Exact OCI-pull cache PVC path certified by the canary artifact gate.
  source: pvc://qwen35-9b-oci-gfx1100/qwen35-9b
  cache:
    strategy: Local
    # The staged cache is 14.7 GB while this node has only ~4.2 GB free in
    # /dev/shm. Mount the proven EXT4 cache directly, as the canary did,
    # instead of auto-copying it through an unsatisfiable tmpfs init step.
    flashLoader:
      enabled: false
    compilationCache:
      enabled: true
      # 2026-10-27: fresh path for the 0.32 engine, as the twin did. The old
      # compile-cache-qwen35-9b-v023-production (2.6 GB of 0.23 artifacts) is
      # kept on the node for a 2e9652ed rollback.
      hostPath: /var/lib/flexinfer/compile-cache-qwen35-9b-v032-production
      sizeLimit: 4Gi
  gpu:
    vendor: amd
    # The host advertises both the discrete XTX and Raphael iGPU. Claim both
    # resources and expose ordinal zero, matching the certified canary.
    count: 2
    shared: 7900xtx-textgen
    # Production reserves four LoRA slots and leaves 355,302 KV tokens after
    # warm compilation: 1.55 full-window requests at the promoted ceiling.
    vramEstimateMB: 23200
    # 2026-07-18 psyche fleet layout: warm-pinned leader of the 7900xtx text
    # lane. Outranks the demoted workhorse-128k (300) and every other group
    # member; the wan video lanes moved to cblevins-5930k in the same change.
    priority: 500
  serverless:
    enabled: true
    # 2026-08-30: kept parked after the 08-22 gaming handback — DELIBERATE, not
    # a lease leftover. The XTX is the voice card now (orpheus-3b speed tier
    # warm-pinned 2026-08-22 + route-priority !1001, whisper co-resident on
    # demand); this lane's 0.94-util envelope needs the whole card, so a warm
    # floor here evicts the voice stack (priority 500 > 480, no VRAM co-fit).
    # RP serving lives on the 5930k twin (via its own name / nsfw-rp-twin-base;
    # the borrowed qwen35-9b-ablit-rp label was removed 2026-08-30 once all
    # text consumers migrated to qwen38-27b-autoround-workhorse). Restore
    # recipe if this lane must serve again: minReplicas 1, warmPolicy primary,
    # litellm true — and expect voice to degrade to the VII tier.
    minReplicas: 0
    idleTimeout: 30m
    coldStartTimeout: 25m
  config:
    # RDNA3 long-context decode fix (2026-08-16): vLLM's ROCm default picks
    # ROCM_ATTN, whose decode has no KV-length parallelism — single-stream
    # decode collapses linearly with context (research doc 8c/8e fleet
    # ceiling). TRITON_ATTN engages the unified-attention 3D split-KV decode:
    # canary 36 tok/s @30K and 32 @60K vs 4.0/2.0 baseline (9-16x). Kernel
    # evidence: deploy/debug/gfx1100-unified-attn-decode-probe.yaml.
    attentionBackend: TRITON_ATTN
    # Reclaim the shared card after an on-demand borrower goes idle. Priority
    # alone only controls demand-driven swaps and does not evict a Ready model.
    # 2026-08-30: stays ondemand after the gaming handback — the warm-pinned
    # orpheus speed tier owns the card now (see serverless block above).
    warmPolicy: ondemand
    # Run the pinned spec.image in its own Deployment instead of the node's
    # persistent runtime bundle.
    dedicatedDeployment: true
    dtype: "half"
    quantization: gptq
    languageModelOnly: true
    # The artifact config carries multimodal mRoPE fields (mrope_interleaved,
    # mrope_section) that vLLM's qwen3_5 config parser rejects (validate_rope:
    # "set -= list"). Override with a clean text-only rope block (same trick the
    # 35B workhorse uses). Native max_position_embeddings is 262144 with NO RoPE
    # extrapolation anywhere in range (unlike the 35B, which cliffs ~64K).
    # The retained five-depth gauntlet passed twice at 223,969 prompt tokens on
    # 2026-07-22. An older one-needle probe at roughly 245K missed 0/1 despite
    # coherent prose, so 229,376 remains the certified serving ceiling rather
    # than the native 262,144-token metadata maximum.
    hfOverrides: '{"architectures":["Qwen3_5ForCausalLM"],"rope_parameters":{"rope_type":"default","rope_theta":10000000,"partial_rotary_factor":0.25}}'
    maxModelLen: 229376
    maxInputTokens: 228352
    maxOutputTokens: 1024
    gpuMemoryUtilization: "0.94"
    # 4 slots so two slow/stuck streams can't monopolize the engine (observed
    # 2026-07-19: a 2-req retry loop pinned both slots for 6h while psyche
    # queued). The production KV pool provides 1.55 full-window requests; the
    # certificate still cleared its two-stream short-RP concurrency floor, and
    # vLLM preempts if concurrent long sequences outgrow the pool.
    maxNumSeqs: 4
    maxNumBatchedTokens: 4096
    enableChunkedPrefill: true
    schedulerReserveFullISL: true
    # fp8 KV promoted from the twin's fp8-kv-flip canary (#67, 2026-07-25):
    # pool 355,302 -> 703,133 tokens (1.98x), clean boot with APC, prefix
    # caching works under fp8, recall parity vs the APC-on baseline (one
    # noise-level flap in nine samples; #67 holds waived by operator
    # 2026-07-26). Doubled pool = the budget lever for multi-psyche
    # (roadmap slice E). Rollback = kvCacheDtype: auto.
    kvCacheDtype: fp8_e4m3
    # `calculateKvScales: false` left with the 0.32 repin (2026-10-27): vLLM
    # 0.28 removed runtime KV-scale calculation and its flag, so the controller
    # must not render --no-calculate-kv-scales (vllm serve rejects unknown
    # flags). Behaviour is unchanged: fp8 KV scales stay pinned at 1.0 and
    # outlier activations clip on cache write, a contributor to the lane's
    # mid-sentence word substitutions (psyche .loom/decision-sampling-
    # hygiene.md). It was inert on 0.23 too (force-disabled for hybrid GDN
    # models; probed 2026-08-01, MR !956 reverted). The real fix is
    # checkpoint-embedded k_scale/v_scale in a requantized artifact, see #69.
    # vLLM 0.23 plugin certificate: bounded graph shapes avoid the v0.17
    # hybrid-architecture crash and deliver ~102 base / ~60 short-LoRA tok/s.
    enforceEager: false
    cudagraphCaptureSizes: [1, 2, 4]
    maxCudagraphCaptureSize: 4
    gdnPrefillBackend: triton
    cudagraphMetrics: true
    kvCacheMetrics: true
    kvCacheMetricsSample: "1.0"
    # MEASURING APC ON THIS LANE — read before filing a "cache is broken" bug.
    # "align" makes vLLM round the attention block UP to the mamba page size:
    #   [interface.py:670] Setting attention block size to 544 tokens
    # 544 is the floor of cache-hit *reporting*, not just of caching. vLLM
    # counts cached_tokens in whole blocks and omits prompt_tokens_details
    # entirely when the count is zero, so any prompt shorter than 544 tokens
    # comes back with prompt_tokens_details: null and no X-Flexinfer-Cached-
    # Tokens header no matter how warm the cache is. null means ZERO, not
    # "unknown". Probe with a repeated prompt of several blocks (~4k+ tokens);
    # verified 2026-08-01 at 7252 tokens -> cached_tokens 7072 (= 13 x 544).
    #
    # The block size is not fixed: it is whatever makes the attention page
    # match the mamba page, so it moves when KV bytes/token move. fp8 KV
    # (9acebff46, promoted 2026-07-25 right after APC) halved KV bytes and
    # so doubled the block 272 -> 544. That is why #67's contemporaneous
    # proof reads 8976 = 33 x 272 while today's reads 13 x 544. Re-measure
    # the boot line after any kvCacheDtype change rather than assuming.
    #
    # Hybrid-GDN APC, promoted from the twin's gdn-prefix-cache-flip canary
    # (PASSED 2026-07-25, flexinfer #67): warm repeat served 99.4% of the
    # prompt from cache at 7x speed, engine hit rate 79.3% on shared-prefix
    # traffic, recall-at-depth parity vs the APC-off baseline across two bench
    # repetitions. Requires all three keys together — vLLM 0.23 boots hybrid
    # lanes APC-off unless the flag is explicit (!945), "align" is the only
    # GDN-supported cache mode, and cached_tokens only appears in usage when
    # launched with --enable-prompt-tokens-details. psyche's Long Memory panel
    # reads real warm share from this lane once this lands.
    # Rollback = revert this block to enablePrefixCaching: false.
    enablePrefixCaching: true
    mambaCacheMode: "align"
    mambaSsmCacheDtype: "bfloat16"
    enablePromptTokensDetails: true
    disableAiter: true
    rocmCustomPagedAttn: false
    hipVisibleDevices: "0"
    trustRemoteCode: true
    servedModelName: qwen35-9b-ablit-rp
    # RP is the default interaction mode. Per-request chat_template_kwargs
    # still take precedence, so callers can explicitly opt into thinking.
    defaultChatTemplateKwargs:
      enable_thinking: false
    enableToolCalling: false     # roleplay model — no tool parser
    disableLogStats: false
    failOnEnvironValidation: false
  nodeSelector:
    kubernetes.io/hostname: cblevins-7900xtx
  resources:
    requests:
      cpu: "4"
      memory: 16Gi
    limits:
      cpu: "8"
      memory: 40Gi
  serviceLabels:
    - qwen35-9b-ablit-rp
  litellm:
    # 2026-08-30: stays de-advertised after the gaming handback. The scheduled
    # consumers (news-analyzer, jobsearch daemon, Mills reviewers/audit) are
    # MIGRATED to qwen38-27b-autoround-workhorse (news-analyzer !20,
    # jobsearch-app !118, gitops !639); psyche's text lane rides the
    # "workhorse" label. The 9b lanes remain only for NSFW-RP (the nsfw-rp
    # LoRAs target this abliterated base; no qwen38-era RP artifact exists) —
    # retiring them awaits that operator decision. Re-advertising this lane
    # would route demand back at the voice card.
    enabled: false
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"

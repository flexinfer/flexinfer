# Abliterated Qwen3.5-9B @ 131K context + NSFW-RP LoRA — primary RP lane.
#
# Warm-primary member of the 7900xtx-textgen shared group on cblevins-7900xtx.
# The LoRAAdapter qwen35-9b-nsfw-rp targets this model; the controller auto-injects
# --enable-lora, --max-loras, --max-lora-rank 64, and VLLM_ALLOW_RUNTIME_LORA_UPDATING.
#
# ModelExperiment/qwen35-9b-v023-rp-canary PASSED 2026-07-21 on the exact
# digest below: native RDNA3 W4A16, FULL_AND_PIECEWISE graphs 1/2/4, rank-64
# LoRA, 55.68 aggregate tok/s across two RP streams, and exact 5/5 recall in a
# 127,969-token prompt. Reach the adapter via model="nsfw-rp".
apiVersion: ai.flexinfer/v1alpha2
kind: Model
metadata:
  name: qwen35-9b-ablit-rp
  namespace: flexinfer-system
  annotations:
    flexinfer.ai/base-model-source: Qwen/Qwen3.5-9B
    flexinfer.ai/base-model-posture: abliterated
    flexinfer.ai/artifact-oci: registry.harbor.lan/flexinfer/qwen35-9b:gptq-w4-g128
    flexinfer.ai/runtime-digest: sha256:2e9652edee30ed078843935ce5672280efd3585de0527d27703dd6880592981d
    flexinfer.ai/canary-certificate: qwen35-9b-v023-rp-canary-generation-5
spec:
  backend: vllm
  image: registry.harbor.lan/flexinfer/runtime@sha256:2e9652edee30ed078843935ce5672280efd3585de0527d27703dd6880592981d
  # Exact OCI-pull cache PVC path certified by the canary artifact gate.
  source: pvc://qwen35-9b-oci-gfx1100/qwen35-9b
  cache:
    strategy: Local
    compilationCache:
      enabled: true
      hostPath: /var/lib/flexinfer/compile-cache-qwen35-9b-v023-production
      sizeLimit: 4Gi
  gpu:
    vendor: amd
    # The host advertises both the discrete XTX and Raphael iGPU. Claim both
    # resources and expose ordinal zero, matching the certified canary.
    count: 2
    shared: 7900xtx-textgen
    # The certified profile reserves 94% of the discrete 24 GiB card and left
    # 13.77 GiB for 448,077 KV tokens after warm compilation.
    vramEstimateMB: 23200
    # 2026-07-18 psyche fleet layout: warm-pinned leader of the 7900xtx text
    # lane. Outranks the demoted workhorse-128k (300) and every other group
    # member; the wan video lanes moved to cblevins-5930k in the same change.
    priority: 500
  serverless:
    enabled: true
    minReplicas: 1
    idleTimeout: 30m
    coldStartTimeout: 25m
  config:
    # Reclaim the shared card after an on-demand borrower goes idle. Priority
    # alone only controls demand-driven swaps and does not evict a Ready model.
    warmPolicy: primary
    # Pin this model to the certified vLLM 0.23 image instead of the node's
    # older persistent runtime bundle.
    dedicatedDeployment: true
    dtype: "half"
    quantization: gptq
    languageModelOnly: true
    # The artifact config carries multimodal mRoPE fields (mrope_interleaved,
    # mrope_section) that vLLM's qwen3_5 config parser rejects (validate_rope:
    # "set -= list"). Override with a clean text-only rope block (same trick the
    # 35B workhorse uses). Native max_position_embeddings is 262144 with NO RoPE
    # extrapolation anywhere in range (unlike the 35B, which cliffs ~64K).
    # 131072 is the highest NEEDLE-VERIFIED window (2026-07-19, in-pod
    # context-needle-bench): 131072 PASS (recall 1/1, coherent); 245760 FAIL
    # (coherent prose but recall 0/1) despite loading Ready at 262144. Recall
    # ceiling sits in (131072, 245760) — bisect before raising this again.
    hfOverrides: '{"architectures":["Qwen3_5ForCausalLM"],"rope_parameters":{"rope_type":"default","rope_theta":10000000,"partial_rotary_factor":0.25}}'
    maxModelLen: 131072
    maxInputTokens: 130048
    maxOutputTokens: 1024
    gpuMemoryUtilization: "0.94"
    # 4 slots so two slow/stuck streams can't monopolize the engine (observed
    # 2026-07-19: a 2-req retry loop pinned both slots for 6h while psyche
    # queued). KV pool is shared and was at ~1% under 2×128K-capable seqs;
    # vLLM preempts if concurrent sequences ever outgrow the pool.
    maxNumSeqs: 4
    maxNumBatchedTokens: 4096
    enableChunkedPrefill: true
    schedulerReserveFullISL: true
    kvCacheDtype: auto
    calculateKvScales: false
    # vLLM 0.23 plugin certificate: bounded graph shapes avoid the v0.17
    # hybrid-architecture crash and deliver ~102 base / ~60 short-LoRA tok/s.
    enforceEager: false
    cudagraphCaptureSizes: [1, 2, 4]
    maxCudagraphCaptureSize: 4
    gdnPrefillBackend: triton
    cudagraphMetrics: true
    kvCacheMetrics: true
    kvCacheMetricsSample: "1.0"
    enablePrefixCaching: false
    disableAiter: true
    rocmCustomPagedAttn: false
    hipVisibleDevices: "0"
    trustRemoteCode: true
    servedModelName: qwen35-9b-ablit-rp
    enableToolCalling: false     # roleplay model — no tool parser
    disableLogStats: false
    failOnEnvironValidation: false
  nodeSelector:
    kubernetes.io/hostname: cblevins-7900xtx
  resources:
    requests:
      cpu: "4"
      memory: 16Gi
    limits:
      cpu: "8"
      memory: 40Gi
  serviceLabels:
    - qwen35-9b-ablit-rp
  litellm:
    enabled: true                # kill-test passed 2026-07-19; joined the public fleet
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"

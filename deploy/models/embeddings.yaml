apiVersion: ai.flexinfer/v1alpha2
kind: Model
metadata:
  name: nomic-embed-text
  namespace: flexinfer-system
spec:
  backend: ollama
  # Ollama downloads the model on first activation (~270 MB).
  source: ollama://nomic-embed-text
  gpu:
    vendor: nvidia
    shared: gtx980ti-models
    priority: 100
    vramEstimateMB: 1000
  serverless:
    enabled: true
    # Demoted to cold fallback (S1.2c): bge-large-radeonvii is now the default
    # embeddings lane. nomic stayed stuck Queued on gtx980ti-models for weeks
    # (60-validation-matrix.md "S0.3"), so this is strictly an availability win.
    minReplicas: 0
    idleTimeout: 30m
    coldStartTimeout: 5m
  nodeSelector:
    # GTX 980 Ti (Maxwell, sm_52, 6 GB VRAM).
    # Controller selects the custom ollama Maxwell image automatically
    # via DEFAULT_BACKEND_IMAGE_MAXWELL (ollama.maxwellImage in Helm values).
    kubernetes.io/hostname: cblevins-gtx980ti
  resources:
    requests:
      cpu: "2"
      memory: 2Gi
    limits:
      cpu: "4"
      memory: 4Gi
  # Distinct fallback labels/aliases (S1.2c): the default embeddings/rag/
  # semantic-search names moved to bge-large-radeonvii. nomic remains reachable
  # explicitly for fallback/rollback.
  serviceLabels:
    - embeddings-980ti
  litellm:
    enabled: true
    servedModelName: nomic-embed-text
    aliases:
      - nomic-embed-text
      - embeddings-980ti

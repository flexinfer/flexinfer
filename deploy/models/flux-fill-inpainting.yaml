apiVersion: ai.flexinfer/v1alpha2
kind: Model
metadata:
  name: flux-fill-inpainting
  namespace: flexinfer-system
spec:
  backend: diffusers
  source: HF://black-forest-labs/FLUX.1-Fill-dev
  gpu:
    vendor: amd
    shared: radeonvii-models
    priority: 200
    count: 1
    # With cpuOffload=true, only NF4 transformer (~6GB) + VAE (~100MB) on GPU.
    # T5 text encoders stay on CPU. Fits comfortably in 16GB HBM2.
    vramEstimateMB: 8000
  serverless:
    enabled: true
    minReplicas: 0
    idleTimeout: 30m
    coldStartTimeout: 15m
  cache:
    size: 30Gi
    storageClass: nvme-1r
    strategy: SharedPVC
  config:
    # FLUX.1 Fill Dev: 12B param model — inpainting only
    # Text2image is served by the Radeon VII imagegen lane; keep this manifest
    # on gfx906 with CPU offload.
    # Running on Radeon VII (gfx906, 16GB HBM2) — CPU offload required
    modelFamily: "flux"
    pipelineMode: "inpainting"
    # NF4 transformer ~6GB fits in 16GB VRAM, T5 stays on CPU via offload.
    # Offload adds ~20-30% step overhead but avoids OOM on 16GB GPU.
    cpuOffload: "true"
    quantization: "nf4"
    # FLUX.1-Fill-dev uses flow-matching (not DDPM) — needs low guidance scale
    # and moderate step count. Dev-quality model, not schnell/turbo.
    guidanceScale: "3.5"
    numInferenceSteps: "20"
    computeDtype: "bfloat16"
    compilationCache: "true"
    hipVisibleDevices: "0"
  nodeSelector:
    kubernetes.io/hostname: cblevins-radeonvii
  resources:
    requests:
      cpu: "2"
      memory: 16Gi
    limits:
      cpu: "4"
      memory: 40Gi
  serviceLabels:
    - flux-image-edit
    - flux-inpainting
    - image-edit
  litellm:
    enabled: true
    servedModelName: flux-fill-inpainting
    aliases:
      - flux-image-edit
      - flux-inpainting
      - image-edit

# Production Whisper ASR Model CR — ASR/diarization plan Slice 3a.
#
# Plan:       .loom/asr-diarization-7900xtx-plan-2026-05-18.md
# Execution:  .loom/30-implementation-plan-voice-stack-2026-06-01.md
# Kill-test:  .loom/ralph-whisper-kill-test-v6-evidence-2026-05-21.md (PASS 2026-05-21)
#
# This promotes the v6-proven kill-test to a routable production endpoint.
# vLLM 0.17.0+rocm700 auto-exposes OpenAI-compatible /v1/audio/transcriptions
# from the WhisperForConditionalGeneration architecture — no `task:` field
# (dropped in MR !464; v5 evidence showed --task is rejected by 0.17+ argparse).
#
# === PARKED 2026-06-23: ASR is un-servable on this card, so it is de-advertised ===
# litellm.enabled=false (below) removes whisper from the servable fleet: it is
# hidden from /v1/models, not alias/label-resolvable, and never cold-started by
# name. This stops a doomed-cold-start loop, NOT a working lane.
#
# Why it could never serve here:
#   The warm primary gemma4-26b-a4b-gptq (priority 350) on this shared
#   7900xtx-textgen card runs minReplicas:1 + warmPolicy:primary, so it holds the
#   single slot at gpuMemoryUtilization 0.98 and NEVER idles to zero. whisper
#   (priority 340) is therefore statically un-promotable: the demand-swap in
#   controllers/model_shared_gpu.go requires whisper.priority >= gemma4.priority
#   (never true), and the Ready-leader branch returns gemma4 unconditionally.
#   The earlier comment here ("queues until gemma4 idles out 30m") was wrong —
#   a minReplicas:1 warm primary does not idle out, so every transcribe request
#   spun a backend the election immediately parked (signal: terminated), timing
#   out after 10-25m. Live impact (2026-06-23): ~4k requests/24h, 100% error,
#   repeated gfx1100-runtime churn. See model_shared_gpu.go:180 (demand path).
#
# History: priority 400 (> 350) inverted primacy — a sustained transcription
# stream evicted the gemma4 daily driver (MR !687 dropped it to 340). 340 stopped
# the flap but left ASR permanently starved behind the warm primary; parking
# (this change) makes that honest until ASR is rehomed to its own GPU.
#
# To restore ASR: rehome whisper to a GPU it can hold (own card / multiModel
# coexistence with a lowered gemma4 gpuMemoryUtilization), then re-enable
# litellm + the serviceLabels/aliases below. A dedicated batch window via
# `gpu.forcePromotion: true` (the proven kill-test path) also still works.
# The sister 26B on cblevins-5930k carries chat throughout via shared serviceLabels.
apiVersion: ai.flexinfer/v1alpha2
kind: Model
metadata:
  name: whisper-large-v3-turbo
  namespace: flexinfer-system
  annotations:
    flexinfer.ai/purpose: "ASR — OpenAI /v1/audio/transcriptions for ICC meeting transcription (Slice 3a)"
    flexinfer.ai/plan: ".loom/asr-diarization-7900xtx-plan-2026-05-18.md"
    flexinfer.ai/kill-test-evidence: ".loom/ralph-whisper-kill-test-v6-evidence-2026-05-21.md"
    # ASR-ONLY endpoint guard: whisper serves ONLY /v1/audio/transcriptions. The
    # proxy rejects any other path (e.g. chat-completion probes) at the edge with
    # 404 and WITHOUT cold-starting or touching demand. With whisper now ranked
    # below gemma4 this no longer gates a preempt, but it still keeps the lane
    # honest: only a REAL transcription warms whisper at all, so chat-completion
    # health probes can never flap it Active and consume an otherwise-idle card.
    # See internal/proxy/serving_policy.go (modelServesPath).
    flexinfer.ai/serve-paths: "/v1/audio/transcriptions"
spec:
  backend: vllm
  # Image inherits from the gfx1100 GPUProfile vllm.image pin
  # (deploy/gpuprofiles/gfx1100.yaml). Do NOT override — production must serve
  # from the same runtime image the v6 kill-test passed against.
  source: HF://openai/whisper-large-v3-turbo
  cache:
    # Local strategy mirrors the v6 kill-test (and qwen3-1p7b-vllm-radeonvii):
    # a single cache-prefetch job downloads the HF repo into a per-node PVC,
    # and the same-node runtime DaemonSet mounts it at
    # /models/flexinfer-system/whisper-large-v3-turbo/. No SharedPVC/cache-copy.
    strategy: Local
    # nvme-1r-gpu: single-replica Longhorn on GPU-labelled nodes. Proven on
    # cblevins-7900xtx by gemma4-26b-a4b-gptq-cache and the v3 kill-test stage.
    storageClass: nvme-1r-gpu
    # whisper-large-v3-turbo is ~1.6 GiB safetensors; 6Gi buys headroom for
    # tokenizer/preprocessor/config + transient download artifacts.
    size: 6Gi
  gpu:
    vendor: amd
    # count=2 is REQUIRED on cblevins-7900xtx: the node exposes the discrete
    # 7900 XTX AND the Raphael iGPU both as amd.com/gpu. Claim both plugin slots
    # so nothing co-tenants the iGPU; hipVisibleDevices="0" then pins the dGPU.
    count: 2
    vramEstimateMB: 4000
    shared: 7900xtx-textgen
    # priority 340 < the 26B's 350: the gemma4 daily-driver chat stays primary.
    # ASR only takes the card when gemma4 is idle-to-zero, and yields back as
    # soon as chat demand returns. NO forcePromotion — idle-to-zero keeps the
    # card free for the primary. See the "Chat-primary" block above.
    priority: 340
  serverless:
    enabled: true
    # idle-to-zero: the 24 GiB lane is not double-claimed while idle.
    minReplicas: 0
    # release the GPU back to the 26B promptly after a transcription batch.
    idleTimeout: 5m
    coldStartTimeout: 10m
  config:
    # Whisper-large-v3 architectural ceiling.
    maxModelLen: 448
    # Cap VRAM well under 24 GiB so the allocator does not OOM while the 26B is
    # mid-preemption (the swap is not instantaneous).
    gpuMemoryUtilization: "0.30"
    enforceEager: true
    dtype: "half"
    servedModelName: whisper-large-v3-turbo
    hipVisibleDevices: "0"
    trustRemoteCode: false
    disableLogStats: false
    # No `task` field — vLLM 0.17+ auto-resolves transcription from the
    # WhisperForConditionalGeneration architecture (MR !464).
  nodeSelector:
    kubernetes.io/hostname: cblevins-7900xtx
  resources:
    requests:
      cpu: "1"
      memory: 4Gi
    limits:
      cpu: "2"
      memory: 8Gi
  # serviceLabels STRIPPED while parked: label-group routing (model=asr|
  # transcription|whisper) builds from Services and can bypass the litellm
  # disabled gate, so a label-keyed caller could still warm this lane. Removing
  # them guarantees nothing routes here. RESTORE these (and litellm below) when
  # ASR is rehomed.
  # serviceLabels:
  #   - whisper-large-v3-turbo
  #   - whisper
  #   - asr
  #   - transcription
  litellm:
    # PARKED: de-advertised from the servable fleet — see the header block.
    # Flip back to true (and restore serviceLabels/aliases above) to re-list.
    enabled: false
    servedModelName: whisper-large-v3-turbo
    # aliases STRIPPED while parked (would otherwise stay alias-resolvable):
    # aliases:
    #   - whisper-large-v3-turbo-7900xtx

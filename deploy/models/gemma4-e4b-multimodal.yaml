# Gemma4 E4B multimodal (vision + audio) via vLLM on AMD gfx1100.
#
# Full FP16 checkpoint — vision/audio towers kept at full precision.
# Uses standard vLLM backend (NOT vllm-omni) for multimodal *input* processing
# via Gemma4ForConditionalGeneration.
#
# Scale-to-zero, shares GPU with text models in 7900xtx-textgen group.
apiVersion: ai.flexinfer/v1alpha2
kind: Model
metadata:
  name: gemma4-e4b-multimodal
  namespace: flexinfer-system
spec:
  backend: vllm
  image: registry.harbor.lan/flexinfer/runtime:rocm-gfx1100-gemma4-experimental
  source: pvc://llm-models-nfs/google/gemma-4-E4B-it
  cache:
    strategy: Local
  gpu:
    vendor: amd
    count: 1
    vramEstimateMB: 18000
    shared: 7900xtx-textgen
    priority: 150
  serverless:
    enabled: true
    minReplicas: 0
    idleTimeout: 15m
    coldStartTimeout: 15m
  config:
    dtype: "bfloat16"
    maxModelLen: 4096
    gpuMemoryUtilization: "0.90"
    maxNumSeqs: 4
    trustRemoteCode: true
    attentionBackend: TRITON_ATTN
    servedModelName: gemma4-e4b-multimodal
    enableToolCalling: true
    toolCallParser: gemma4
    reasoningParser: gemma4
    limitMmPerPrompt: "image=4,audio=2"
    disableLogStats: false
  capabilities:
    vision: true
    toolCalling: true
  nodeSelector:
    kubernetes.io/hostname: cblevins-7900xtx
  resources:
    requests:
      cpu: "4"
      memory: 24Gi
    limits:
      cpu: "8"
      memory: 32Gi
  serviceLabels:
    - gemma4-e4b-multimodal
    - vision
    - audio
    - multimodal
  litellm:
    enabled: true
    servedModelName: gemma4-e4b-multimodal
    aliases:
      - gemma4-vision
      - gemma4-multimodal
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"

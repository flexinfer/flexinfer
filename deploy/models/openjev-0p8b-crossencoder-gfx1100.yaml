---
# openjev 0.8B cross-encoder NLI, served by vLLM as a POOLING model.
#
# Registration comes from build/vllm-qwen35-seqcls-plugin (sibling of
# vllm-qwen35-text-plugin, sharing build/vllm-plugin-common): it pre-wraps the
# Qwen3.5 causal class with as_seq_cls_model and registers it under
# Qwen3_5ForSequenceClassification, so vLLM resolves `--runner auto` to pooling
# with no extra CLI flag and no backend change.
#
# This lane answers /v1/rerank, /v1/score and /classify with a 3-class NLI
# verdict (contradiction / entailment / neutral). It is NOT a chat model: the
# checkpoint has no lm_head, hence serve-paths and litellm disabled.
#
# The source is a PVC PATH, not HF://, because the checkpoint lives in a
# subfolder and the platform cannot express that on an HF source. See
# deploy/modelcaches/openjev-crossencoder.yaml.
#
# NOT in kustomization.yaml: the plugin must be live in the serving image and
# the logit-parity check must pass before this is applied. The verified fp32
# reference is the 2026-09-21 gfx1100 kill-test (0/10 argmax flips, worst
# probability delta 1e-6 against Apple Silicon).
apiVersion: ai.flexinfer/v1alpha2
kind: Model
metadata:
  name: openjev-0p8b-crossencoder-gfx1100
  namespace: flexinfer-system
  annotations:
    # Non-chat lane: refuse everything except the pooling routers, so a stray
    # chat request fails fast instead of 500-ing inside vLLM.
    flexinfer.ai/serve-paths: /v1/rerank,/v1/score,/classify,/pooling
spec:
  backend: vllm
  # The plugin lives in THIS image, so the pin is load-bearing, not cosmetic.
  # Without spec.image the operator falls back to the gfx1100 GPUProfile
  # default (registry.harbor.lan/flexinfer/vllm@sha256:7ac257f3...), a
  # different image with no FlexInfer plugins in it — so
  # Qwen3_5ForSequenceClassification would never be registered and the lane
  # would fail to resolve the architecture at all.
  #
  # rocm-gfx1100-v026-native-w4a16-497647ef, built 2026-09-21 by
  # publish_serving_rocm_gfx1100_native_w4a16. This is also the first v0.26
  # native-W4A16 build whose bundled text plugin loads: the 08-01 build was
  # rolled back on 2026-09-13 because it imported an FLA module path vLLM 0.26
  # no longer ships. The shared flexinfer_vllm_common resolves either layout.
  image: registry.harbor.lan/flexinfer/runtime@sha256:a28ef662bfe6e0640e83e4c48b41f4e2b773edd395f3c9f5f70c2505481774a2
  source: pvc://llm-models-nfs/openjev/qwen3.5-0.8b-nli-v2s-long
  nodeSelector:
    kubernetes.io/hostname: cblevins-5930k
  serverless:
    enabled: true
    minReplicas: 0
    idleTimeout: 30m
    coldStartTimeout: 10m
  litellm:
    # A 3-class classifier is not an OpenAI-shaped chat/embedding model.
    enabled: false
  config:
    dtype: half
    # Cross-encoder inputs are one premise plus one hypothesis; 4k is generous
    # for the 0.8B v2s-long variant and keeps the KV/pooling footprint small.
    maxModelLen: 4096
  resources:
    limits:
      amd.com/gpu: 1

# Gemma4 26B-A4B GPTQ INT4 via vLLM on AMD gfx1100.
#
# MoE: 25.2B total / 3.8B active params. GPTQ quantized attention layers only;
# experts remain FP16 (excluded by dynamic GPTQ patterns). Total ~48.9 GB weights.
# Requires --cpu-offload-gb 30 to fit in 24 GB VRAM (~19 GB on GPU, 30 GB pinned CPU).
#
# Primary model in 7900xtx-textgen shared group (priority 200, always-on).
# Replaces gemma4-e4b-gptq as primary text model.
apiVersion: ai.flexinfer/v1alpha2
kind: Model
metadata:
  name: gemma4-26b-a4b-gptq
  namespace: flexinfer-system
spec:
  backend: vllm
  image: registry.harbor.lan/flexinfer/runtime@sha256:3ce2e84dc30b3765ed8955fda679fa2d356412723ed0d922961ecacae1d0252a
  source: pvc://gemma4-26b-a4b-gptq/gemma4-26b-a4b-gptq/gptq-w4-g128
  cache:
    strategy: SharedPVC
  gpu:
    vendor: amd
    count: 1
    vramEstimateMB: 20000
    shared: 7900xtx-textgen
    priority: 200
  serverless:
    enabled: true
    minReplicas: 1
    idleTimeout: 30m
    coldStartTimeout: 15m
  config:
    quantization: gptq
    dtype: "half"
    cpuOffloadGb: "30"
    enforceEager: true
    maxModelLen: 8192
    gpuMemoryUtilization: "0.95"
    maxNumSeqs: 4
    trustRemoteCode: true
    attentionBackend: TRITON_ATTN
    servedModelName: gemma4-26b-a4b-gptq
    enableToolCalling: true
    toolCallParser: gemma4
    reasoningParser: gemma4
    enablePrefixCaching: true
    maxNumBatchedTokens: 4096
    disableLogStats: false
    warmPolicy: primary
  nodeSelector:
    kubernetes.io/hostname: cblevins-7900xtx
  resources:
    requests:
      cpu: "4"
      memory: 40Gi
    limits:
      cpu: "8"
      memory: 56Gi
  serviceLabels:
    - gemma4-26b-a4b-gptq
    - gemma4-26b-a4b
  litellm:
    enabled: true
    servedModelName: gemma4-26b-a4b-gptq
    aliases:
      - gemma4-26b
      - gemma4-26b-a4b
      - gemma4-moe
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"

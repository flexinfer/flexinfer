# Gemma4 26B-A4B GPTQ INT4 via vLLM on AMD gfx1100.
#
# MoE: 25.2B total / 3.8B active params. The working gfx1100 artifact is a
# hybrid export: MoE experts stay GPTQ INT4, while dense attention/MLP weights
# stay at post-abliteration FP16/BF16. Full dense-attention GPTQ produced bad
# dequantized tensors and repeated-token output on vLLM/ROCm.
#
# Warm primary in 7900xtx-textgen (priority 350, minReplicas=1).
# 7900 XTX instance #1 of the 2-instance 26B serving fleet. Promoted 2026-05-13
# to the always-on quality lane for downstream services (project-management and
# similar) that need capable reasoning + 16K context. The paired sister model
# `gemma4-26b-a4b-gptq-5930k` runs on cblevins-5930k from the same OCI-published
# artifact for horizontal capacity. Shared routes (quality-chat / mid-chat /
# gpt-4 / project-mgmt / gemma4-26b) live in `serviceLabels` on BOTH instances
# so the proxy load-balances across them; `litellm.aliases` carry only
# node-specific addressing (gemma4-26b-7900xtx). Context uplift 2026-04-27:
# the separate gemma4-26b-a4b-gptq-long canary proved the same hybrid artifact
# at 16K with FP8 KV on 2026-04-26; those runtime knobs are baked in below.
# Runtime image (2026-05-15, Wave 1 Slice 3+4+5 promotion): pinned to digest
# sha256:737ac1ba9c5366c66dc3e010c6cac5a904a5cee8276d720187ea04a335e52ce5 which
# is the `runtime:rocm-gfx1100-sandbox-019` build (vLLM 0.19.1 commit b1388b1f
# + native gemma4 FusedMoE + the ROCm rms_norm half-precision patch from !371).
#
# Replaces the prior digest sha256:69569cbfc0db... which was the V0+Python-MoE
# patch path. The V1 native path is +18.7% faster on this prod workload (3-run
# mean 25.33s vs V0 31.17s for 200-token completion at temperature=0) and
# retires GEMMA4_MOE_ROCM_REFERENCE_PATCH for both BF16 and GPTQ-INT4 gemma4.
#
# Sister `gemma4-26b-a4b-gptq-5930k` intentionally stays on the V0 digest for
# a 24h A/B baseline; promote that instance only after the 7900xtx canary
# burns in cleanly.
#
# Evidence: .loom/slice3-v1-sandbox-rms-norm-falsified-2026-05-15.md
# Spec:     .loom/21-product-spec-vllm-feature-parity-2026-05-15.md (Slices 3-5)
#
# Build flow for this digest (sandbox profile, no auto-promotion):
#   ./build/build-runtime.sh gfx1100-sandbox-019 --push --no-cache
# The patch chain is:
#   - vllm_source_patch_script: build/scripts/patch_vllm_rocm_rms_norm_dtype.py
#   - No GEMMA4_MOE_ROCM_REFERENCE_PATCH (upstream native FusedMoE supplants it)
# Roll back to the V0 digest above if any regression surfaces under prod traffic.
apiVersion: ai.flexinfer/v1alpha2
kind: Model
metadata:
  name: gemma4-26b-a4b-gptq
  namespace: flexinfer-system
  annotations:
    flexinfer.ai/promotion-gate: quantized-artifact-v1
    flexinfer.ai/promotion-state: baseline-16k-validated
    flexinfer.ai/promotion-validation: passed
    flexinfer.ai/promotion-evidence: docs/dev/gemma4-rocm-status.md#16k-fp8-kv-proof-2026-04-26
    flexinfer.ai/promotion-requires: dense-artifact-or-22k-target-proof-before-next-rung
spec:
  backend: vllm
  image: registry.harbor.lan/flexinfer/runtime@sha256:737ac1ba9c5366c66dc3e010c6cac5a904a5cee8276d720187ea04a335e52ce5
  source: pvc://gemma4-26b-a4b-gptq/gemma4-26b-a4b-gptq/gptq-w4-g128-attnfp16-clean
  # Cache PVC migration (2026-04-18): switched from the default 3-replica
  # Longhorn storage class to single-replica local NVMe to stop
  # mmap-driven weight loads from stalling on cross-node replica reads
  # (shard-31 stall incident, services/flexinfer#53). Matches the
  # qwen35-35b-a3b pattern: local-path + hostPath + SharedPVC.
  #
  # PersistentVolumeClaim.spec.storageClassName is immutable, so this
  # Flux reconcile alone will NOT migrate the existing
  # gemma4-26b-a4b-gptq-cache PVC. An operator must: (1) scale the
  # primary Model to zero, (2) delete the existing -cache PVC,
  # (3) wait for Flux to reconcile the new spec so the controller
  # recreates the cache PVC with local-path, (4) wait for the
  # controller cache-copy job to restage the ~17 GiB artifact from the
  # source PVC (gemma4-26b-a4b-gptq, nvme-1r-gpu), (5) scale back to
  # minReplicas=1. Full runbook in .loom/ or the follow-up issue; this
  # manifest change is the durable half of the fix.
  cache:
    strategy: SharedPVC
    storageClass: local-path
    hostPath: /var/lib/flexinfer/models
    size: 50Gi
  gpu:
    vendor: amd
    # count=2 is REQUIRED on cblevins-7900xtx. The node exposes the discrete
    # 7900 XTX AND the Raphael iGPU both as amd.com/gpu (allocatable=2). With
    # count=1 the AMD device plugin can hand this pod the iGPU slot, and
    # `hipVisibleDevices="0"` then pins inference onto the iGPU → immediate
    # "Memory access fault by GPU node-1 ... Page not present" on engine init.
    # Claim BOTH plugin slots so nothing co-tenants the iGPU; hipVisibleDevices
    # then deterministically selects the dGPU (plugin-local index 0).
    # Originally added in 4dae96b9; regressed in 6f6e9a98. Do not lower.
    count: 2
    vramEstimateMB: 16000
    shared: 7900xtx-textgen
    # 2026-05-13: priority raised above qwen3-8b-fast-7900xtx (300) so the
    # 26B owns the warm lane for downstream services.
    priority: 350
  serverless:
    enabled: true
    # 2026-05-13: promoted to warm primary for project-management and other
    # quality-tier consumers. Pair-edited fast-chat-7900xtx down to
    # minReplicas: 0 so the 24 GiB lane is not double-claimed.
    minReplicas: 1
    idleTimeout: 30m
    coldStartTimeout: 15m
  config:
    quantization: gptq
    dtype: "half"
    # Hybrid dense-FP16/MoE-GPTQ loads at ~17.7 GiB. 16K requires FP8 KV on the
    # single 7900 XTX; the canary proof processed a 14,088-token prompt with
    # these runtime knobs and returned the expected marker. Do not raise this
    # default serving limit again until a smaller dense artifact or a 22K target
    # proof passes the promotion gate.
    maxModelLen: 16384
    gpuMemoryUtilization: "0.98"
    kvCacheDtype: fp8_e4m3
    maxNumSeqs: 1
    trustRemoteCode: true
    attentionBackend: TRITON_ATTN
    servedModelName: gemma4-26b-a4b-gptq
    enableToolCalling: true
    toolCallParser: gemma4
    reasoningParser: gemma4
    enablePrefixCaching: false
    maxNumBatchedTokens: 160
    disableLogStats: false
    # Disable torch.compile + CUDAGraph: gptq_gemm kernel is "buggy" per
    # vLLM warning, and GELU tanh approximation falls back to 'none' under
    # torch.compile on ROCm. Eager mode eliminates both issues.
    enforceEager: true
    # Gemma4 has heterogeneous head dims (256 sliding / 512 full attention)
    # which triggers V1 KV cache page_size_padded assertion. Disabling the
    # hybrid manager unifies all specs to FullAttentionSpec, bypassing it.
    disableHybridKVCacheManager: true
    # Match the validated 16K canary: force source-backed ROCm fallback kernels
    # and disable ROCm custom paged attention for this long-context profile.
    disableAiter: true
    rocmCustomPagedAttn: false
    hipVisibleDevices: "0"
    # 2026-05-13: ondemand → primary. 26B-A4B is the warm quality lane for
    # downstream services on the discrete 7900 XTX.
    warmPolicy: primary
  nodeSelector:
    kubernetes.io/hostname: cblevins-7900xtx
  resources:
    requests:
      cpu: "2"
      memory: 8Gi
    limits:
      cpu: "4"
      memory: 16Gi
  serviceLabels:
    # 2026-05-13: shared route names live here so the proxy load-balances them
    # across both 26B instances (this one + sister on cblevins-5930k). Routing
    # policy is round-robin among Ready members (alphabetical fallback when
    # none Ready); see internal/proxy/resolver.go:pickReadyMember. Adding or
    # removing a name requires the same change in the sister manifest, or the
    # alias drops out of the multi-claimant set and reverts to single-target
    # routing for that name only.
    - gemma4-26b-a4b-gptq
    - gemma4-26b-a4b
    - gemma4-26b
    - quality-chat
    - mid-chat
    - gpt-4
    - project-mgmt
  litellm:
    enabled: true
    servedModelName: gemma4-26b-a4b-gptq
    # 2026-05-13: shared routes (quality-chat, mid-chat, gpt-4, project-mgmt,
    # gemma4-26b, gemma4-26b-a4b) moved to serviceLabels so the proxy can
    # load-balance them across both instances (this one + sister on 5930k).
    # litellm.aliases stays node-specific.
    aliases:
      - gemma4-26b-7900xtx
      - gemma4-26b-a4b-7900xtx
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"

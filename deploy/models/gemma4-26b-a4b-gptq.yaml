# Gemma4 26B-A4B GPTQ INT4 via vLLM on AMD gfx1100.
#
# MoE: 25.2B total / 3.8B active params. The working gfx1100 artifact is a
# hybrid export: MoE experts stay GPTQ INT4, while dense attention/MLP weights
# stay at post-abliteration FP16/BF16. Full dense-attention GPTQ produced bad
# dequantized tensors and repeated-token output on vLLM/ROCm.
#
# Primary model in 7900xtx-textgen shared group (priority 200, always-on).
# Replaces gemma4-e4b-gptq as primary text model.
#
# Context uplift 2026-04-18: raised from 8192 to 16384. The 32K canary
# (gemma4-26b-a4b-gptq-long, same weights, same node) has been running since
# 2026-04-16 without runtime regressions. 16K is a conservative halfway step
# that does not require the canary's long-context kernel fallbacks
# (disableAiter / rocmCustomPagedAttn). Promotion gate state moved to
# baseline-16k-validated; a full long-context correctness sweep is still
# outstanding before raising to 32K on the primary.
apiVersion: ai.flexinfer/v1alpha2
kind: Model
metadata:
  name: gemma4-26b-a4b-gptq
  namespace: flexinfer-system
  annotations:
    flexinfer.ai/promotion-gate: quantized-artifact-v1
    flexinfer.ai/promotion-state: baseline-16k-validated
    flexinfer.ai/promotion-requires: long-context-correctness-sweep-before-32k
spec:
  backend: vllm
  image: registry.harbor.lan/flexinfer/runtime@sha256:0b05b32b92e6ab99cd648837a9bf80cf3dd437275b1d97fb71378a9f829cdaac
  source: pvc://gemma4-26b-a4b-gptq/gemma4-26b-a4b-gptq/gptq-w4-g128-attnfp16-clean
  cache:
    strategy: SharedPVC
  gpu:
    vendor: amd
    count: 1
    vramEstimateMB: 16000
    shared: 7900xtx-textgen
    priority: 200
  serverless:
    enabled: true
    minReplicas: 1
    idleTimeout: 30m
    coldStartTimeout: 15m
  config:
    quantization: gptq
    dtype: "half"
    # Hybrid dense-FP16/MoE-GPTQ loads at ~17.7 GiB on gfx1100. At 16K context
    # the KV cache estimate (5 full-attn layers plus 25 sliding layers at
    # window=1024) sits well inside the 22.8 GiB practical cap (24 GiB card
    # × gpuMemoryUtilization=0.95). A full dense GPTQ rebuild is still
    # required to safely push past 16K on the primary without the canary's
    # ROCm long-context kernel fallbacks.
    maxModelLen: 16384
    gpuMemoryUtilization: "0.95"
    maxNumSeqs: 1
    trustRemoteCode: true
    attentionBackend: TRITON_ATTN
    servedModelName: gemma4-26b-a4b-gptq
    enableToolCalling: true
    toolCallParser: gemma4
    reasoningParser: gemma4
    enablePrefixCaching: true
    maxNumBatchedTokens: 512
    disableLogStats: false
    # Disable torch.compile + CUDAGraph: gptq_gemm kernel is "buggy" per
    # vLLM warning, and GELU tanh approximation falls back to 'none' under
    # torch.compile on ROCm. Eager mode eliminates both issues.
    enforceEager: true
    # Gemma4 has heterogeneous head dims (256 sliding / 512 full attention)
    # which triggers V1 KV cache page_size_padded assertion. Disabling the
    # hybrid manager unifies all specs to FullAttentionSpec, bypassing it.
    disableHybridKVCacheManager: true
    hipVisibleDevices: "0"
    warmPolicy: primary
  nodeSelector:
    kubernetes.io/hostname: cblevins-7900xtx
  resources:
    requests:
      cpu: "2"
      memory: 8Gi
    limits:
      cpu: "4"
      memory: 16Gi
  serviceLabels:
    - gemma4-26b-a4b-gptq
    - gemma4-26b-a4b
  litellm:
    enabled: true
    servedModelName: gemma4-26b-a4b-gptq
    aliases:
      - gemma4-26b
      - gemma4-26b-a4b
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"

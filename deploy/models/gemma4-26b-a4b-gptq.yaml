# Gemma4 26B-A4B GPTQ INT4 via vLLM on AMD gfx1100.
#
# MoE: 25.2B total / 3.8B active params. Full GPTQ INT4 quantization including
# MoE experts (GPTQModel >= 6.0.3 native support). ~7-13 GB weights, fits in
# 24 GB VRAM without CPU offload.
#
# Primary model in 7900xtx-textgen shared group (priority 200, always-on).
# Replaces gemma4-e4b-gptq as primary text model.
apiVersion: ai.flexinfer/v1alpha2
kind: Model
metadata:
  name: gemma4-26b-a4b-gptq
  namespace: flexinfer-system
spec:
  backend: vllm
  image: registry.harbor.lan/flexinfer/runtime@sha256:eb70d423f67e12c19b96faca41d728fff001bdb6d29045fcf0a46d10d3e2c7f5
  source: pvc://gemma4-26b-a4b-gptq/gemma4-26b-a4b-gptq/gptq-w4-g128
  cache:
    strategy: SharedPVC
  gpu:
    vendor: amd
    count: 2
    vramEstimateMB: 16000
    shared: 7900xtx-textgen
    priority: 200
  serverless:
    enabled: true
    minReplicas: 1
    idleTimeout: 30m
    coldStartTimeout: 15m
  config:
    quantization: gptq
    dtype: "half"
    # Full MoE GPTQ INT4 weights: 16.2 GiB. With KV cache page-size
    # unification (heterogeneous heads → doubled block_size), 16K context
    # needs ~3.75 GiB KV cache, comfortably within 5.3 GiB available.
    maxModelLen: 16384
    gpuMemoryUtilization: "0.95"
    maxNumSeqs: 16
    trustRemoteCode: true
    attentionBackend: TRITON_ATTN
    servedModelName: gemma4-26b-a4b-gptq
    enableToolCalling: true
    toolCallParser: gemma4
    reasoningParser: gemma4
    enablePrefixCaching: true
    maxNumBatchedTokens: 8192
    disableLogStats: false
    # Disable torch.compile + CUDAGraph: gptq_gemm kernel is "buggy" per
    # vLLM warning, and GELU tanh approximation falls back to 'none' under
    # torch.compile on ROCm. Eager mode eliminates both issues.
    enforceEager: true
    # Gemma4 has heterogeneous head dims (256 sliding / 512 full attention)
    # which triggers V1 KV cache page_size_padded assertion. Disabling the
    # hybrid manager unifies all specs to FullAttentionSpec, bypassing it.
    disableHybridKVCacheManager: true
    hipVisibleDevices: "0"
    warmPolicy: primary
  nodeSelector:
    kubernetes.io/hostname: cblevins-7900xtx
  resources:
    requests:
      cpu: "2"
      memory: 8Gi
    limits:
      cpu: "4"
      memory: 16Gi
  serviceLabels:
    - gemma4-26b-a4b-gptq
    - gemma4-26b-a4b
  litellm:
    enabled: true
    servedModelName: gemma4-26b-a4b-gptq
    aliases:
      - gemma4-26b
      - gemma4-26b-a4b
      - gemma4-moe
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"

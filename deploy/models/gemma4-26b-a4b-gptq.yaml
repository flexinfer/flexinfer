# Gemma4 26B-A4B GPTQ INT4 via vLLM on AMD gfx1100.
#
# MoE: 25.2B total / 3.8B active params. Full GPTQ INT4 quantization including
# MoE experts (GPTQModel >= 6.0.3 native support). ~7-13 GB weights, fits in
# 24 GB VRAM without CPU offload.
#
# Primary model in 7900xtx-textgen shared group (priority 200, always-on).
# Replaces gemma4-e4b-gptq as primary text model.
apiVersion: ai.flexinfer/v1alpha2
kind: Model
metadata:
  name: gemma4-26b-a4b-gptq
  namespace: flexinfer-system
spec:
  backend: vllm
  image: registry.harbor.lan/flexinfer/runtime@sha256:fffb20497b4b10eca21ce44d76cdee93d0033850cd8b36ba199df52f0f604105
  source: pvc://gemma4-26b-a4b-gptq/gemma4-26b-a4b-gptq/gptq-w4-g128
  cache:
    strategy: SharedPVC
  gpu:
    vendor: amd
    count: 2
    vramEstimateMB: 16000
    shared: 7900xtx-textgen
    priority: 200
  serverless:
    enabled: true
    minReplicas: 1
    idleTimeout: 30m
    coldStartTimeout: 15m
  config:
    quantization: gptq
    dtype: "half"
    # Full MoE GPTQ INT4 (~7-13GB) fits in 24GB → more KV cache room.
    maxModelLen: 32768
    gpuMemoryUtilization: "0.95"
    maxNumSeqs: 16
    trustRemoteCode: true
    attentionBackend: TRITON_ATTN
    servedModelName: gemma4-26b-a4b-gptq
    enableToolCalling: true
    toolCallParser: gemma4
    reasoningParser: gemma4
    enablePrefixCaching: true
    maxNumBatchedTokens: 8192
    disableLogStats: false
    hipVisibleDevices: "0"
    warmPolicy: primary
  nodeSelector:
    kubernetes.io/hostname: cblevins-7900xtx
  resources:
    requests:
      cpu: "2"
      memory: 8Gi
    limits:
      cpu: "4"
      memory: 16Gi
  serviceLabels:
    - gemma4-26b-a4b-gptq
    - gemma4-26b-a4b
  litellm:
    enabled: true
    servedModelName: gemma4-26b-a4b-gptq
    aliases:
      - gemma4-26b
      - gemma4-26b-a4b
      - gemma4-moe
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"

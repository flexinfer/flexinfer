# Gemma4 26B-A4B GPTQ INT4 via vLLM on AMD gfx1100.
#
# MoE: 25.2B total / 3.8B active params. The working gfx1100 artifact is a
# hybrid export: MoE experts stay GPTQ INT4, while dense attention/MLP weights
# stay at post-abliteration FP16/BF16. Full dense-attention GPTQ produced bad
# dequantized tensors and repeated-token output on vLLM/ROCm.
#
# Warm primary in 7900xtx-textgen (priority 350, minReplicas=1).
# 7900 XTX instance #1 of the 2-instance 26B serving fleet. Promoted 2026-05-13
# to the always-on quality lane for downstream services (project-management and
# similar) that need capable reasoning + 16K context. The paired sister model
# `gemma4-26b-a4b-gptq-5930k` runs on cblevins-5930k from the same OCI-published
# artifact for horizontal capacity. Shared routes (quality-chat / mid-chat /
# gpt-4 / project-mgmt / gemma4-26b) live in `serviceLabels` on BOTH instances
# so the proxy load-balances across them; `litellm.aliases` carry only
# node-specific addressing (gemma4-26b-7900xtx). On 2026-05-16 this pair also
# became the sole fast-chat/default-chat path for the 7900 XTXs. Context uplift 2026-04-27:
# the separate gemma4-26b-a4b-gptq-long canary proved the same hybrid artifact
# at 16K with FP8 KV on 2026-04-26; those runtime knobs are baked in below.
# Runtime image (2026-05-15): pinned to digest sha256:310988969f34... from
# MR !379. This keeps the legacy Gemma4 patch skipped on native vLLM 0.19+,
# but still patches `MoeWNA16` to accept Gemma4 GELU activation and forwards
# `activation=layer.activation` into `fused_experts`. Canary on cblevins-7900xtx
# reached Ready with 0 restarts and direct smoke returned coherent output.
#
# 2026-05-15: Wave 1 Slice 7 promotion to sha256:737ac1ba... (vLLM 0.19.1
# patched) was ATTEMPTED in MR !372 and ROLLED BACK in this MR (!NNN). The
# initial swap canary passed (3-run benchmark, 4-prompt coherence gauntlet),
# but under sustained operation the V1 pod entered CrashLoopBackOff (11
# restarts observed) after Flux took back GitOps control. Falsification follow-up
# captured in .loom/slice3-v1-sandbox-rms-norm-falsified-2026-05-15.md.
# Sister `gemma4-26b-a4b-gptq-5930k` was never moved off V0 — pair-stable.
apiVersion: ai.flexinfer/v1alpha2
kind: Model
metadata:
  name: gemma4-26b-a4b-gptq
  namespace: flexinfer-system
  annotations:
    flexinfer.ai/promotion-gate: quantized-artifact-v1
    flexinfer.ai/promotion-state: baseline-16k-validated
    flexinfer.ai/promotion-validation: passed
    flexinfer.ai/promotion-evidence: docs/dev/gemma4-rocm-status.md#16k-fp8-kv-proof-2026-04-26
    flexinfer.ai/promotion-requires: dense-artifact-or-22k-target-proof-before-next-rung
spec:
  backend: vllm
  image: registry.harbor.lan/flexinfer/runtime@sha256:310988969f3448ccb7b6001d36df0610c40a0354cacbd7e3410cf9d9592dd187
  source: pvc://gemma4-26b-a4b-gptq/gemma4-26b-a4b-gptq/gptq-w4-g128-attnfp16-clean
  # Cache PVC migration (2026-04-18): switched from the default 3-replica
  # Longhorn storage class to single-replica local NVMe to stop
  # mmap-driven weight loads from stalling on cross-node replica reads
  # (shard-31 stall incident, services/flexinfer#53). Matches the
  # qwen35-35b-a3b pattern: local-path + hostPath + SharedPVC.
  #
  # PersistentVolumeClaim.spec.storageClassName is immutable, so this
  # Flux reconcile alone will NOT migrate the existing
  # gemma4-26b-a4b-gptq-cache PVC. An operator must: (1) scale the
  # primary Model to zero, (2) delete the existing -cache PVC,
  # (3) wait for Flux to reconcile the new spec so the controller
  # recreates the cache PVC with local-path, (4) wait for the
  # controller cache-copy job to restage the ~17 GiB artifact from the
  # source PVC (gemma4-26b-a4b-gptq, nvme-1r-gpu), (5) scale back to
  # minReplicas=1. Full runbook in .loom/ or the follow-up issue; this
  # manifest change is the durable half of the fix.
  cache:
    strategy: SharedPVC
    storageClass: local-path
    hostPath: /var/lib/flexinfer/models
    size: 50Gi
  gpu:
    vendor: amd
    # count=2 is REQUIRED on cblevins-7900xtx. The node exposes the discrete
    # 7900 XTX AND the Raphael iGPU both as amd.com/gpu (allocatable=2). With
    # count=1 the AMD device plugin can hand this pod the iGPU slot, and
    # `hipVisibleDevices="0"` then pins inference onto the iGPU → immediate
    # "Memory access fault by GPU node-1 ... Page not present" on engine init.
    # Claim BOTH plugin slots so nothing co-tenants the iGPU; hipVisibleDevices
    # then deterministically selects the dGPU (plugin-local index 0).
    # Originally added in 4dae96b9; regressed in 6f6e9a98. Do not lower.
    count: 2
    vramEstimateMB: 16000
    shared: 7900xtx-textgen
    # 2026-05-13: priority raised above qwen3-8b-fast-7900xtx (300) so the
    # 26B owns the warm lane for downstream services.
    # 2026-06-19 TRANSIENT BUMP 350->410: post power-outage, whisper (pri 400)
    # was left a PHANTOM shared-group leader (Active in status, NO pod) holding
    # the 7900xtx card and keeping the warm gemma4 primary Preempted at
    # replicas=0. Bump above whisper so gemma4 preempts the phantom and reclaims;
    # REVERT to 350 once gemma4 is Active+serving (so whisper's real ASR
    # preemption still works). Recurs on every gemma4 vacate — durable fix is in
    # the shared-group election (prefer warm minR>=1 over a podless higher-pri
    # member); tracked separately.
    priority: 410
    # 2026-06-19: the pri bump alone did NOT break it — the phantom whisper is a
    # STICKY Active incumbent, and higher priority alone does not trigger a
    # handover (same lesson as the 14B/qwen35 standoff). forcePromotion forces
    # gemma4 to claim the card. TRANSIENT: revert this + priority once gemma4 is
    # Active+serving (else whisper can never preempt for real ASR).
    forcePromotion: true
  serverless:
    enabled: true
    # 2026-05-13: promoted to warm primary for project-management and other
    # quality-tier consumers. Pair-edited fast-chat-7900xtx down to
    # minReplicas: 0 so the 24 GiB lane is not double-claimed.
    minReplicas: 1
    idleTimeout: 30m
    coldStartTimeout: 15m
  config:
    quantization: gptq
    dtype: "half"
    # Hybrid dense-FP16/MoE-GPTQ loads at ~17.7 GiB. 16K previously required
    # FP8 KV on the single 7900 XTX. 2026-05-25: raised to 32K alongside the
    # gfx1100 GPUProfile cap bump (18 → 22 GB). Gemma's interleaved
    # local/global attention bounds the KV cost — global layers do hold the
    # full 32K window, but the local-attention layers cap at the sliding
    # window. With FP8 KV the total KV cache is ~5 GB. maxNumSeqs drops to 1
    # so the prompt budget is single-stream at 32K; restore to 2 only if a
    # cap raise or smaller artifact gives us batched headroom.
    maxModelLen: 32768
    gpuMemoryUtilization: "0.98"
    kvCacheDtype: fp8_e4m3
    # 2026-05-25: single-stream at 32K. The 2-way concurrency tuning from
    # 2026-05-16 (maxNumBatchedTokens=256, ~132 tok/s aggregate) does not
    # have VRAM headroom at this context. Re-evaluate after smoke + a
    # production traffic sample.
    maxNumSeqs: 1
    trustRemoteCode: true
    attentionBackend: TRITON_ATTN
    servedModelName: gemma4-26b-a4b-gptq
    enableToolCalling: true
    toolCallParser: gemma4
    reasoningParser: gemma4
    enablePrefixCaching: false
    maxNumBatchedTokens: 256
    disableLogStats: false
    # 2026-05-16: graph capture validated on the native Gemma4 runtime at 16K:
    # the 7900 XTX profile reached Ready with zero restarts and steady decode
    # throughput around 70 tok/s.
    enforceEager: false
    # Gemma4 has heterogeneous head dims (256 sliding / 512 full attention)
    # which triggers V1 KV cache page_size_padded assertion. Disabling the
    # hybrid manager unifies all specs to FullAttentionSpec, bypassing it.
    disableHybridKVCacheManager: true
    # Match the validated 16K canary: force source-backed ROCm fallback kernels
    # and disable ROCm custom paged attention for this long-context profile.
    disableAiter: true
    rocmCustomPagedAttn: false
    hipVisibleDevices: "0"
    # 2026-05-13: ondemand → primary. 26B-A4B is the warm quality lane for
    # downstream services on the discrete 7900 XTX.
    warmPolicy: primary
    # 2026-06-06 S3.4 — n-gram speculative decoding REMOVED from this lane.
    #
    # Earlier history: the 5/4 config (MR !512) measured p50 1.95× on SHORT
    # Q/A; CC-DR-2 then widened it to 7/6 on that basis. But the win was
    # workload-conditional (ngram-sd-workload-conditional.md): SD regresses
    # hard on long-form generation, where prompt-lookup acceptance can't
    # offset the widened per-verifier-step compute on this MoE/gfx1100 target.
    #
    # The S3.0 data clock (2026-06-06, ≥1 day of real canary traffic) showed
    # this PRIMARY lane is long-form-dominant: completion p50 ≈ 588 tok, 58%
    # of completions > 512 tok. The S3.4 on/off A/B then measured the effect
    # directly on the identical gemma4-26b/gfx1100 substrate (the -5930k twin,
    # single-stream, real document→summary load matching the 588/953 p50/p90
    # shape; engine-verified each arm). Decode throughput:
    #   SD OFF        63.2 tok/s   (baseline)
    #   ngram {5,4}   40.3 tok/s   −36%
    #   ngram {7,6}   38.4 tok/s   −39%   (this lane's prior config)
    # i.e. SD OFF is +64% faster than 7/6 on real summarization traffic.
    # Evidence: .loom/60-validation-matrix.md "2026-06-06 S3.4".
    #
    # The twin (-5930k) KEEPS its {5,4} SD: its real traffic is short
    # (completion p50 ≈ 13 tok), the SD-favorable regime. SD is a per-lane
    # decision, not a fleet default. To re-enable here, restore:
    #   speculativeConfig: '{"method": "ngram", "num_speculative_tokens": 5, "prompt_lookup_max": 4, "prompt_lookup_min": 1}'
  nodeSelector:
    kubernetes.io/hostname: cblevins-7900xtx
  resources:
    requests:
      cpu: "2"
      memory: 8Gi
    limits:
      cpu: "4"
      memory: 16Gi
  serviceLabels:
    # 2026-05-16: shared route names live here so the proxy load-balances them
    # across both 26B instances (this one + sister on cblevins-5930k). Routing
    # policy is round-robin among Ready members (alphabetical fallback when
    # none Ready); see internal/proxy/resolver.go:pickReadyMember. Adding or
    # removing a name requires the same change in the sister manifest, or the
    # alias drops out of the multi-claimant set and reverts to single-target
    # routing for that name only.
    - gemma4-26b
    - quality-chat
    - mid-chat
    - fast-chat
    - fast-text
    - gpt-4
    - gpt-3.5-turbo
    - copilot
    - qwen3-default
    - project-mgmt
  litellm:
    enabled: true
    servedModelName: gemma4-26b-a4b-gptq
    # Shared/default routes moved to serviceLabels so the proxy can load-balance
    # them across both instances (this one + sister on 5930k). litellm.aliases
    # stays node-specific.
    aliases:
      - gemma4-26b-7900xtx
      - gemma4-26b-a4b-7900xtx
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"

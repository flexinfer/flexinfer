# Wan 2.1 VACE 1.3B image-to-video lane on cblevins-7900xtx (gfx1100).
#
# 2026-10-30 MOVED back to the 7900xtx flex card (placement layout,
# .loom/10-research-voice-stack-and-gpu-placement-2026-10-30.md §6).
# Priority 600 -> 500, the shared creative tier. Equal priority means a
# Qwen-Image click no longer kills a running clip, and the reverse also holds:
# the holder keeps the card while its request is open. Any creative lane
# outranks the idle tenant (the Mills warm lane, 300 ondemand), which
# returns after this lane's 15 min idleTimeout. The T2V-primary and
# 5930k-workhorse notes below are history.
#
# 2026-07-18 psyche fleet layout: rehomed from cblevins-7900xtx together with
# the T2V sibling; the 5930k gfx1100 card is now the psyche VIDEO lane.
# On-demand keyframe animation: a first-frame image conditions the clip via
# WanVACEPipeline (PIPELINE_MODE=image2video, added in a4df75880). Explicit
# demand for this Model preempts the warm Wan T2V primary (priority 600 > 500);
# T2V reclaims the card once this lane goes idle. The demoted 5930k Qwen
# workhorse (300) cold-starts on demand but loses the election to video.
# Slice 3 of .loom/30-implementation-plan-keyframe-video-pipeline-2026-07-15.md;
# the kill test must pass before any downstream pipeline ships.
# Remove this parent Model (not its Deployment/pod) to roll the lane back.
#
# 2026-11-01 D1 step 3 (S6c, research next-differentiators-2026-10-31 §6.1;
# WINDOW-GATED): served IN-POD by the 7900xtx runtime DaemonSet instead of its
# own Deployment, so a render swaps the XTX warm lane out and back inside the
# runtime pod.
# - dedicatedDeployment dropped; spec.image stays the dedicated rollback image.
# - Compile cache: scope Image on the default hostPath, the directory the
#   runtime pod mounts at /cache/compile.
# Runtime image: 12f30206 (527e2714 with server-diffusers.py at fb8182fc, live
# on the XTX runtime since !1380 on 2026-11-21). 527e2714 carries ftfy 6.3.1
# (WanVACEPipeline.basic_clean calls ftfy.fix_text unguarded), imageio 2.37.0
# and imageio-ffmpeg 0.6.0. This lane's VAE is fp32, so the Wan VAE MIOpen
# bypass (!1268) does not apply and the decode runs through the MIOpen of
# torch 2.13 / ROCm 7.2.3: A/B in-pod against the dedicated lane before
# promotion.
#
# 2026-11-22 refresh: config.env pins what the in-pod Wan T2V gates found
# (rows gfx1100-xtx-inpod-wan-t2v-*-2026-11-21):
# - both allocator variables without expandable_segments: with model CPU
#   offload, expandable_segments corrupts every VAE use on this stack, and
#   VACE corrupted even its first clip because it encodes the keyframe through
#   the VAE (S9);
# - TORCH_BLAS_PREFER_HIPBLASLT=0: in-pod the lane would inherit the gfx1100
#   GPUProfile's 1, and hipBLASLt made same-seed requests differ;
# - TORCH_DETERMINISTIC=1 (server switch from !1379): this lane runs eager
#   (no compile), and eager rocBLAS GEMMs run with atomics allowed under
#   PyTorch, which made every eager T2V request differ. Untested on VACE; the
#   gate checks it. The exact-shape warmup that fixed the compiled T2V lane
#   does not apply: the server's warmup cannot send a conditioning image.
#
# 2026-11-22 gate fail and fix: row gfx1100-xtx-inpod-wan-vace-gate-2026-11-22
# failed bar (2) on the eager lane above. Same-seed clips matched at 29-41 dB
# against the dedicated lane's 43.96, clip 3 the outlier, with no op logged as
# lacking a deterministic implementation. Every other bar passed, NaN-free
# included. The fix follows the in-pod Wan T2V lane, which became
# byte-identical from the first request and across loads once compiled and
# warmed at the served shape (research-determinism.md F2): compile the
# transformer (max-autotune-no-cudagraphs, graph breaks allowed around the
# offload hooks) and warm 832x480 x 33 frames x 20 steps with the server's
# image2video warmup (!1399), which sends the request path's own VACE
# conditioning. TORCH_DETERMINISTIC stays on (F1+F2): it keeps the float32
# VAE's MIOpen convs, which T2V never ran, on deterministic solvers, and
# Inductor's deterministic mode drops runtime reduction tuning. Compile and
# warmup are set in env only, so the dedicated rollback stays eager. Needs a
# runtime carrying !1399 (Draft !1390, repinned to that overlay). Gate: row
# gfx1100-xtx-inpod-wan-vace-warmup-gate-2026-11-22.
# 2026-11-22 diagnostic (uncounted, 20:37-20:51Z on a8d525e0): compiled and
# warmed as above, same-seed clips still differed at 37.4 dB (40 dB at the kept
# first frame, 36-37 dB later), below the row's 43.96 dB floor; warm clips
# 150 s, warmup 292 s per load. TORCH_DETERMINISTIC is dropped to run the exact
# in-pod T2V recipe (plain compile: Triton templates instead of the aten GEMMs
# Inductor's deterministic mode picks). If clips still differ, the float32
# VAE on MIOpen is the remaining VACE-only suspect.
# 2026-11-22 diagnostic 2 (uncounted, 21:06-21:16Z, plain compile): still
# 37.1 dB, same profile; its first clip matched diagnostic 1's at 43.9 dB, so
# the transformer is not the source. The VACE pipeline encodes the condition
# with sample_mode="argmax" (no RNG). WAN_VAE_MIOPEN=off (!1407, runtime
# c54cad12) runs the float32 VAE's two condition encodes and the decode
# through PyTorch's im2col + GEMM path, as the 16-bit T2V VAE runs and
# repeats; enableVaeTiling bounds the float32 im2col buffer per tile.
# 2026-11-23 diagnostic 4 (bypass plus TORCH_DETERMINISTIC=1, reverted):
# 39.9 dB, warm clips 158 s, warmup 274 s. Deterministic mode does not help
# and costs time, so the lane stays on the bypass alone (diagnostic 3: 42.3 dB,
# 141 s, warmup 172 s). Gate: row gfx1100-xtx-inpod-wan-vace-repeat-gate-
# 2026-11-23, which judges the same-seed repeat on row-set floors (neither the
# dedicated lane nor any in-pod setup repeats byte-for-byte).
# 2026-11-23 gate: row gfx1100-xtx-inpod-wan-vace-repeat-gate-2026-11-23
# PASSED, owner accepted the side-by-sides: same-seed clips 42.4 / 42.1 dB
# (SSIM 0.993), warm clips 141 s against 264 s dedicated, warmup ~250 s per
# load, first request ~490 s (first-byte budget 900 s). VACE stays in-pod.
# Host RAM: dedicated limit 48 GiB = the runtime pod's whole limit.
# Rollback: revert this commit (restores dedicatedDeployment and the cache
# config); the Deployment returns on the next reconcile.
apiVersion: ai.flexinfer/v1alpha2
kind: Model
metadata:
  name: wan21-vace-1p3b-i2v-gfx1100
  namespace: flexinfer-system
  annotations:
    flexinfer.ai/serve-paths: /v1/videos/generations
    # flexinfer-proxy cancels a forward with no response byte inside the lane
    # first-byte budget (default 120 s, 504 "upstream first byte budget
    # exceeded", internal/proxy/routing_retry.go). The diffusers server answers
    # once the clip is rendered, and a cold start adds the weight load, so 480p
    # clips through the proxy need the same budget as Qwen-Image (KT-FLEX,
    # 2026-11-01). Direct callers of the lane Service are unaffected.
    # 2026-11-03 KT-FLEX rerun on the XTX: a 33-frame 832x480 20-step clip
    # took 506 s to its first byte (server timing: denoise 137 s, VAE
    # decode + postprocess 367 s; the July proving run took 6m57s), so 600 s
    # left ~90 s of margin. 900 s covers the decode-bound floor with room.
    flexinfer.ai/lane-first-byte-budget: "900s"
    flexinfer.ai/purpose: 480p image-to-video (first-frame keyframe) on ROCm gfx1100
    flexinfer.ai/plan: .loom/30-implementation-plan-keyframe-video-pipeline-2026-07-15.md
spec:
  backend: diffusers
  # Same ROCm 6.4.1 / PyTorch 2.6 video build as the T2V lane.
  # 2026-10-27 (pin hygiene): repinned from 52ebc2b9 (the first VACE-capable
  # digest, deleted from Harbor by retention, so a node without its snapshot
  # cannot start this lane) to 83cda206: the CI build from 2026-08-23 master
  # (WanVACEPipeline + image2video mode present) that the floating tag points
  # at, the T2V sibling pins, and the 5930k prewarm list holds
  # (pinned-83cda206faea).
  image: registry.harbor.lan/flexinfer/diffusers-video:rocm-gfx1100
  imageDigest: sha256:83cda206faea929c181cc13fe4fdb928db2942f22d45938201965527e3beb80f
  source: HF://Wan-AI/Wan2.1-VACE-1.3B-diffusers
  cache:
    strategy: Local
    storageClass: nvme-1r-gpu
    size: 32Gi
    # Explicitly OFF: staging 18.2 GB of weights in memory tmpfs cannot
    # coexist with the warm T2V sibling's tmpfs through a preemption handover
    # on this 62 GiB node (activations crash-looped with 4.2 GB free —
    # kill-test evidence on !849/!850/!851). Omitting the block is NOT a
    # disable: flash-loader defaults to enabled when cache.strategy is Local
    # and gpu.shared is set (api/v1alpha2/model_types.go FlashLoaderSpec).
    # This on-demand lane loads straight from the NVMe cache instead.
    flashLoader:
      enabled: false
    compilationCache:
      enabled: true
      # 2026-11-01 D1: image-scoped on the default hostPath, shared with the
      # runtime pod (header).
      scope: Image
      sizeLimit: 6Gi
  gpu:
    vendor: amd
    # cblevins-7900xtx exposes the dGPU and the Raphael iGPU as two
    # device-plugin slots: claim both so the pod can never be handed the iGPU.
    count: 2
    shared: 7900xtx-textgen
    priority: 500
    vramEstimateMB: 18000
  serverless:
    enabled: true
    minReplicas: 0
    # Shorter than the T2V lane's 30m so the warm primary reclaims the card
    # promptly after keyframe demand expires (a kill-test pass criterion).
    idleTimeout: 15m
    coldStartTimeout: 30m
  config:
    pipelineMode: image2video
    modelFamily: wan
    dtype: bfloat16
    cpuOffload: "true"
    # VACE encodes the whole 33-frame conditioning video through the float32
    # Wan VAE before denoising; untiled, that conv3d alone wants 7.7 GiB and
    # OOMs the 24 GiB card (kill-test attempt 3, HIP OOM at 15.3 GiB
    # allocated). Tiling bounds the encode. T2V has no conditioning encode
    # and does not need this.
    enableVaeTiling: "1"
    # No torch.compile for bring-up: the T2V compile settings were qualified
    # on WanPipeline only. Qualify VACE latency separately after the kill test.
    skipWarmup: "1"
    numInferenceSteps: "20"
    guidanceScale: "5.0"
    videoSize: 832x480
    # Bounded kill-test default (~2s @ 16fps); requests may still ask up to 81.
    videoFrames: "33"
    videoFps: "16"
    negativePrompt: "static, blurry, low quality, distorted, watermark, subtitles, text"
    hipVisibleDevices: "0"
    warmPolicy: ondemand
    # 2026-11-22 (header): in-pod pins; config.env is applied last in-pod.
    env:
      PYTORCH_ALLOC_CONF: "garbage_collection_threshold:0.9,max_split_size_mb:512,expandable_segments:False"
      PYTORCH_HIP_ALLOC_CONF: "garbage_collection_threshold:0.9,max_split_size_mb:512,expandable_segments:False"
      TORCH_BLAS_PREFER_HIPBLASLT: "0"
      # TORCH_DETERMINISTIC dropped 2026-11-22 after the diagnostic (header).
      # 2026-11-22 float32 VAE without MIOpen (header; needs runtime c54cad12).
      WAN_VAE_MIOPEN: "off"
      # 2026-11-22 compiled transformer plus exact-shape warmup (header).
      # Overrides skipWarmup "1" in-pod; the dedicated rollback ignores them.
      COMPILE_MODE: "max-autotune-no-cudagraphs"
      COMPILE_FULLGRAPH: "false"
      SKIP_WARMUP: "0"
      WARMUP_RESOLUTIONS: "832x480"
      WARMUP_VIDEO_FRAMES: "33"
      WARMUP_STEPS: "20"
      WARMUP_NONFINITE_RETRIES: "0"
      TORCH_LOGS: "recompiles,graph_breaks"
  nodeSelector:
    kubernetes.io/hostname: cblevins-7900xtx
  resources:
    requests:
      cpu: "4"
      memory: 16Gi
    limits:
      cpu: "8"
      memory: 48Gi
  serviceLabels:
    - video-i2v
    - image-to-video
    - wan21-vace
    - wan21-vace-480p
  litellm:
    enabled: true
    servedModelName: wan21-vace-1p3b-i2v-gfx1100
    aliases:
      - video-i2v
      - image-to-video
      - wan21-vace-480p
  tolerations:
    - effect: NoSchedule
      key: node-role.kubernetes.io/control-plane
      operator: Exists

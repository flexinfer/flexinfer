# Wan 2.1 VACE 1.3B image-to-video lane on cblevins-7900xtx (gfx1100).
#
# 2026-10-30 MOVED back to the 7900xtx flex card (placement layout,
# .loom/10-research-voice-stack-and-gpu-placement-2026-10-30.md §6).
# Priority 600 -> 500, the shared creative tier. Equal priority means a
# Qwen-Image click no longer kills a running clip, and the reverse also holds:
# the holder keeps the card while its request is open. Any creative lane
# outranks the idle tenant (the Mills warm lane, 300 ondemand), which
# returns after this lane's 15 min idleTimeout. The T2V-primary and
# 5930k-workhorse notes below are history.
#
# 2026-07-18 psyche fleet layout: rehomed from cblevins-7900xtx together with
# the T2V sibling; the 5930k gfx1100 card is now the psyche VIDEO lane.
# On-demand keyframe animation: a first-frame image conditions the clip via
# WanVACEPipeline (PIPELINE_MODE=image2video, added in a4df75880). Explicit
# demand for this Model preempts the warm Wan T2V primary (priority 600 > 500);
# T2V reclaims the card once this lane goes idle. The demoted 5930k Qwen
# workhorse (300) cold-starts on demand but loses the election to video.
# Slice 3 of .loom/30-implementation-plan-keyframe-video-pipeline-2026-07-15.md;
# the kill test must pass before any downstream pipeline ships.
# Remove this parent Model (not its Deployment/pod) to roll the lane back.
apiVersion: ai.flexinfer/v1alpha2
kind: Model
metadata:
  name: wan21-vace-1p3b-i2v-gfx1100
  namespace: flexinfer-system
  annotations:
    flexinfer.ai/serve-paths: /v1/videos/generations
    # flexinfer-proxy cancels a forward with no response byte inside the lane
    # first-byte budget (default 120 s, 504 "upstream first byte budget
    # exceeded", internal/proxy/routing_retry.go). The diffusers server answers
    # once the clip is rendered, and a cold start adds the weight load, so 480p
    # clips through the proxy need the same budget as Qwen-Image (KT-FLEX,
    # 2026-11-01). Direct callers of the lane Service are unaffected.
    # 2026-11-03 KT-FLEX rerun on the XTX: a 33-frame 832x480 20-step clip
    # took 506 s to its first byte (server timing: denoise 137 s, VAE
    # decode + postprocess 367 s; the July proving run took 6m57s), so 600 s
    # left ~90 s of margin. 900 s covers the decode-bound floor with room.
    flexinfer.ai/lane-first-byte-budget: "900s"
    flexinfer.ai/purpose: 480p image-to-video (first-frame keyframe) on ROCm gfx1100
    flexinfer.ai/plan: .loom/30-implementation-plan-keyframe-video-pipeline-2026-07-15.md
spec:
  backend: diffusers
  # Same ROCm 6.4.1 / PyTorch 2.6 video build as the T2V lane.
  # 2026-10-27 (pin hygiene): repinned from 52ebc2b9 (the first VACE-capable
  # digest, deleted from Harbor by retention, so a node without its snapshot
  # cannot start this lane) to 83cda206: the CI build from 2026-08-23 master
  # (WanVACEPipeline + image2video mode present) that the floating tag points
  # at, the T2V sibling pins, and the 5930k prewarm list holds
  # (pinned-83cda206faea).
  image: registry.harbor.lan/flexinfer/diffusers-video:rocm-gfx1100
  imageDigest: sha256:83cda206faea929c181cc13fe4fdb928db2942f22d45938201965527e3beb80f
  source: HF://Wan-AI/Wan2.1-VACE-1.3B-diffusers
  cache:
    strategy: Local
    storageClass: nvme-1r-gpu
    size: 32Gi
    # Explicitly OFF: staging 18.2 GB of weights in memory tmpfs cannot
    # coexist with the warm T2V sibling's tmpfs through a preemption handover
    # on this 62 GiB node (activations crash-looped with 4.2 GB free —
    # kill-test evidence on !849/!850/!851). Omitting the block is NOT a
    # disable: flash-loader defaults to enabled when cache.strategy is Local
    # and gpu.shared is set (api/v1alpha2/model_types.go FlashLoaderSpec).
    # This on-demand lane loads straight from the NVMe cache instead.
    flashLoader:
      enabled: false
    compilationCache:
      enabled: true
      hostPath: /var/lib/flexinfer/compile-cache
      sizeLimit: 6Gi
  gpu:
    vendor: amd
    # cblevins-7900xtx exposes the dGPU and the Raphael iGPU as two
    # device-plugin slots: claim both so the pod can never be handed the iGPU.
    count: 2
    shared: 7900xtx-textgen
    priority: 500
    vramEstimateMB: 18000
  serverless:
    enabled: true
    minReplicas: 0
    # Shorter than the T2V lane's 30m so the warm primary reclaims the card
    # promptly after keyframe demand expires (a kill-test pass criterion).
    idleTimeout: 15m
    coldStartTimeout: 30m
  config:
    dedicatedDeployment: true
    pipelineMode: image2video
    modelFamily: wan
    dtype: bfloat16
    cpuOffload: "true"
    # VACE encodes the whole 33-frame conditioning video through the float32
    # Wan VAE before denoising; untiled, that conv3d alone wants 7.7 GiB and
    # OOMs the 24 GiB card (kill-test attempt 3, HIP OOM at 15.3 GiB
    # allocated). Tiling bounds the encode. T2V has no conditioning encode
    # and does not need this.
    enableVaeTiling: "1"
    # No torch.compile for bring-up: the T2V compile settings were qualified
    # on WanPipeline only. Qualify VACE latency separately after the kill test.
    skipWarmup: "1"
    numInferenceSteps: "20"
    guidanceScale: "5.0"
    videoSize: 832x480
    # Bounded kill-test default (~2s @ 16fps); requests may still ask up to 81.
    videoFrames: "33"
    videoFps: "16"
    negativePrompt: "static, blurry, low quality, distorted, watermark, subtitles, text"
    hipVisibleDevices: "0"
    warmPolicy: ondemand
  nodeSelector:
    kubernetes.io/hostname: cblevins-7900xtx
  resources:
    requests:
      cpu: "4"
      memory: 16Gi
    limits:
      cpu: "8"
      memory: 48Gi
  serviceLabels:
    - video-i2v
    - image-to-video
    - wan21-vace
    - wan21-vace-480p
  litellm:
    enabled: true
    servedModelName: wan21-vace-1p3b-i2v-gfx1100
    aliases:
      - video-i2v
      - image-to-video
      - wan21-vace-480p
  tolerations:
    - effect: NoSchedule
      key: node-role.kubernetes.io/control-plane
      operator: Exists

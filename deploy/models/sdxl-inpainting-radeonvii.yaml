apiVersion: ai.flexinfer/v1alpha2
kind: Model
metadata:
  name: sdxl-inpainting-radeonvii
  namespace: flexinfer-system
spec:
  backend: diffusers
  source: HF://diffusers/stable-diffusion-xl-1.0-inpainting-0.1
  gpu:
    vendor: amd
    # Keep every 5930k contender in the same shared group so the unified
    # runtime serializes image/text swaps cleanly on the single GPU.
    shared: 5930k-textgen
    priority: 200
    count: 1
    vramEstimateMB: 12000
  serverless:
    enabled: true
    # Leave the shared 5930k image-edit model cold by default. It should only
    # preempt the text side when there is real image-edit traffic.
    minReplicas: 0
    idleTimeout: 5m
    coldStartTimeout: 10m
  cache:
    # Unified runtimes only see their node-local model root. Keep the default
    # warm image-edit model on Local cache so auxiliary assets like the fixed
    # VAE live beside the staged model and survive runtime reloads cleanly.
    strategy: Local
  config:
    pipelineMode: inpainting
    modelFamily: "sdxl"
    cpuOffload: 'true'
    # Keep the main pipeline in fp32 for stability, but load the fixed VAE from
    # the staged cache path so we do not rely on the base model's decoder.
    useFp16: '0'
    vaeRepo: "madebyollin/sdxl-vae-fp16-fix"
    vaePath: ".vae/sdxl-vae-fp16-fix"
    strength: '0.75'
    guidanceScale: '7.5'
    numInferenceSteps: '30'
    warmPolicy: ondemand
    warmupResolutions: "512x512"
    compilationCache: "true"
    hipVisibleDevices: '0'
  nodeSelector:
    kubernetes.io/hostname: cblevins-5930k
  resources:
    requests:
      cpu: '2'
      memory: 12Gi
    limits:
      cpu: '4'
      memory: 20Gi
  serviceLabels:
  - image-edit
  - inpainting
  - sdxl-image-edit
  - sdxl-inpainting
  litellm:
    enabled: true
    servedModelName: sdxl-inpainting-radeonvii
    aliases:
    - image-edit
    - inpainting
    - sdxl-image-edit
    - sdxl-inpainting
    - image-edit-radeonvii
  tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule

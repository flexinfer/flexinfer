apiVersion: ai.flexinfer/v1alpha2
kind: Model
metadata:
  name: sdxl-inpainting-radeonvii
  namespace: flexinfer-system
spec:
  backend: diffusers
  source: HF://diffusers/stable-diffusion-xl-1.0-inpainting-0.1
  gpu:
    vendor: amd
    shared: radeonvii-models
    priority: 250
    count: 1
    vramEstimateMB: 12000
  serverless:
    enabled: true
    minReplicas: 1
    idleTimeout: 5m
    coldStartTimeout: 10m
  cache:
    size: 20Gi
    storageClass: nvme-1r
    strategy: SharedPVC
  config:
    pipelineMode: inpainting
    cpuOffload: 'true'
    # gfx906 still needs the fixed SDXL VAE or decodes trend gray/washed out.
    # Keep the main pipeline in fp32 for stability, but load the VAE from the
    # staged cache path so we do not rely on the base model's decoder.
    useFp16: '0'
    vaeRepo: "madebyollin/sdxl-vae-fp16-fix"
    # SharedPVC diffusers models stage the auxiliary VAE under the shared model
    # root, not the per-model local-cache root used by unified runtime locals.
    vaePath: "/models/.vae/sdxl-vae-fp16-fix"
    strength: '0.75'
    guidanceScale: '7.5'
    numInferenceSteps: '30'
    warmPolicy: primary
    hipVisibleDevices: '0'
  nodeSelector:
    kubernetes.io/hostname: cblevins-radeonvii
  resources:
    requests:
      cpu: '2'
      memory: 12Gi
    limits:
      cpu: '4'
      memory: 20Gi
  serviceLabels:
  - image-edit
  - inpainting
  - sdxl-image-edit
  - sdxl-inpainting
  litellm:
    enabled: true
    servedModelName: sdxl-inpainting-radeonvii
    aliases:
    - image-edit
    - inpainting
    - sdxl-image-edit
    - sdxl-inpainting
    - image-edit-radeonvii
  tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule

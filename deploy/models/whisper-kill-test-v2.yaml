# Slice 1 kill-test (v2) for the ASR/diarization plan
# (.loom/asr-diarization-7900xtx-plan-2026-05-18.md).
#
# Purpose: prove that vLLM on ROCm gfx1100 actually serves Whisper via the
# OpenAI-compatible /v1/audio/transcriptions endpoint. The plan's riskiest
# assumption remains unverified — the v1 attempt (!429) was INCONCLUSIVE
# because the new claimant deadlocked at State: Queued, replicas: 0
# (chooseSharedGroupLeader preferred the Ready warm-primary 26B regardless
# of raw priority — see Open Question #14 in the plan and the kill-test
# postmortem at .loom/asr-diarization-kill-test-inconclusive-2026-05-19.md).
#
# MR !433 added the gpu.forcePromotion field that bypasses the Ready-first
# preference and the anti-thrashing cooldown in chooseSharedGroupLeader
# (controllers/model_shared_gpu.go:84-101). Setting it true on a new
# claimant guarantees the chooser returns this Model as the active leader,
# the warm 26B gets preempted, and this pod gets a Deployment so the
# kill-test can actually run.
#
# Production impact while this Model is reconciled:
#   - The 7900 XTX warm 26B (gemma4-26b-a4b-gptq) is preempted and scales
#     to zero replicas. ICC's quality-chat / mid-chat / project-mgmt
#     routes continue to be served by the sister instance on cblevins-5930k
#     via the shared serviceLabels routing.
#   - This Model is deliberately NOT routable: no serviceLabels, no
#     litellm. Validation goes through `kubectl port-forward` from the
#     operator's workstation.
#
# Tear-down: remove this file from deploy/models/kustomization.yaml and let
# Flux reconcile. With no force-promoted members in the group,
# chooseSharedGroupLeader reverts to its normal priority order and the
# 26B is selected as Ready leader again (the same way it was before this
# kill-test landed).
apiVersion: ai.flexinfer/v1alpha2
kind: Model
metadata:
  name: whisper-kill-test-v2
  namespace: flexinfer-system
  annotations:
    flexinfer.ai/purpose: "Slice 1 kill-test (vLLM Whisper on ROCm gfx1100)"
    flexinfer.ai/plan: ".loom/asr-diarization-7900xtx-plan-2026-05-18.md"
    flexinfer.ai/temporary: "true"
spec:
  backend: vllm
  # Image inherits from the gfx1100 GPUProfile vllm.image pin
  # (deploy/gpuprofiles/gfx1100.yaml:35). Do not override here — the kill-test
  # exercises the same image the production Whisper Model CR would use.
  source: HF://openai/whisper-large-v3-turbo
  cache:
    strategy: SharedPVC
    storageClass: local-path
    hostPath: /var/lib/flexinfer/models
    size: 5Gi
  gpu:
    vendor: amd
    # Same count=2 trick as gemma4-26b-a4b-gptq.yaml: claim both K8s plugin
    # slots so the iGPU can't co-tenant; hipVisibleDevices="0" pins to the
    # dGPU.
    count: 2
    vramEstimateMB: 4000
    shared: 7900xtx-textgen
    # With forcePromotion=true, priority only matters as a tiebreaker among
    # other force-promoted members in the same group. There are no other
    # force-promoted members today; 400 is set for documentation / future
    # use only.
    priority: 400
    # The point of this kill-test. Without this, chooseSharedGroupLeader
    # returns the Ready 26B at priority step 3 and this Model deadlocks at
    # State: Queued, replicas: 0.
    forcePromotion: true
  serverless:
    enabled: true
    # Keep this Model loaded for the duration of the kill-test. Scale-to-zero
    # would unload the pod between curl attempts and waste time on cold
    # starts; the kill-test is a one-shot live evaluation.
    minReplicas: 1
    idleTimeout: 30m
    coldStartTimeout: 10m
  config:
    # Whisper-large-v3 architectural limit.
    maxModelLen: 448
    # Cap VRAM well below the GPU's 24 GiB so the allocator does not OOM
    # while the 26B is being preempted (the swap is not instantaneous).
    gpuMemoryUtilization: "0.30"
    # gfx1100 vLLM standard for non-graph-capture canaries.
    enforceEager: true
    dtype: "half"
    # Wired via backend/vllm.go:167 (shipped in !423). Exposes
    # /v1/audio/transcriptions on the served port.
    task: transcription
    servedModelName: whisper-large-v3-turbo
    hipVisibleDevices: "0"
    trustRemoteCode: false
    disableLogStats: false
  nodeSelector:
    kubernetes.io/hostname: cblevins-7900xtx
  resources:
    requests:
      cpu: "1"
      memory: 4Gi
    limits:
      cpu: "2"
      memory: 8Gi
  # No serviceLabels: this Model must not be reachable through the proxy's
  # OpenAI model-name routing surface. Operator validates via port-forward.
  # No litellm block: same reason.

# Qwen3.8-27B dense INT4 AutoRound — the Mills/Council QUALITY workhorse.
#
# Successor to qwen36-27b-autoround-workhorse (parked as fallback until soak):
# identical serving contract (Qwen3_5ForConditionalGeneration / qwen3_5, 64
# layers, full_attention_interval 4, native 262144 ctx) with generational
# agentic gains — SWE-bench Pro 61.7 vs 53.5, Terminal-Bench 73.0 vs 59.3.
# Research: .loom/10-research-gfx1100-model-quality-2026-08-15.md (8g) +
# canary deploy/debug/qwen38-27b-clean-autoround-canary.yaml.
#
# Artifact: biMEMO/Qwen3.8-27B-int4-AutoRound (community; Intel has no official
# 3.8 AutoRound release). Intel-recipe shape: auto_round:auto_gptq, INT4 sym
# g128, GDN in_proj_a/b + norms + lm_head FP16, 19.0 GB; INT4 census verified
# 2026-08-16 = the same 10-module list as the 3.6 artifact, so the inc
# workaround hfOverrides carries over unchanged. MTP block is INT4 in this
# artifact (Intel's 3.6 kept mtp.fc FP16) — irrelevant while MTP stays off.
#
# Qualified envelope (mirrors the 3.6 lane; do not casually change):
#   - 64K, fp16 KV, graph mode (FULL_AND_PIECEWISE, GDN split out), no MTP.
#   - TRITON_ATTN (the !967 RDNA3 split-KV decode fix) from day one.
apiVersion: ai.flexinfer/v1alpha2
kind: Model
metadata:
  name: qwen38-27b-autoround-workhorse
  namespace: flexinfer-system
  annotations:
    flexinfer.ai/base-model-source: Qwen/Qwen3.8-27B
    # 2026-09-13: scheduler preemption guard. The serving pod carries
    # flexinfer-serving-critical (150000) so it preempts priority-0 CI job
    # pods for CPU on its node (the 5930k also hosts CI job pods).
    # Same class the radeonvii retrieval lanes use; the class must exist.
    flexinfer.ai/serving-priority-class: flexinfer-serving-critical
    flexinfer.ai/base-model-posture: clean
    flexinfer.ai/artifact-source: HF://biMEMO/Qwen3.8-27B-int4-AutoRound
    flexinfer.ai/plan: ".loom/10-research-gfx1100-model-quality-2026-08-15.md"
    flexinfer.ai/promotion-state: promoted-64k-fp16-graph
    flexinfer.ai/promotion-evidence: "canary qwen38-27b-clean-autoround-canary ladder 2026-08-16: eager 6/6 gauntlet + graph 6/6 (34.9-40.5 tok/s vs 3.6's 39.0), needle 1/1 @28,842 + 1/1 @60,973 tokens, decode 35.4 tok/s @31,602 ctx (3.6: 36.3), RDNA3W4A16LinearKernel, KV pool 68,549 tok @64K"
spec:
  backend: vllm
  # 2026-10-22 (issue #74 S2, vLLM currency): REPINNED from `2e9652ed` — the
  # July vLLM 0.23 build with the native RDNA3 W4A16 HIP operator that the 3.6
  # AND 3.8 qualification ladders passed against. Harbor retention deleted
  # that digest (2026-10-17/21, row gfx1100-runtime-pins-2026-10-21) and its
  # CI job had been repointed to v0.26 in place, so it cannot be rebuilt; it
  # survived only as this node's containerd snapshot under the prewarm
  # DaemonSet, one reinstall or image GC away from ending the lane. Now on
  # `ad93ae72` (rocm-gfx1100-v026-native-w4a16-a106504c, master a106504c
  # 2026-09-14: vLLM 0.26.0 + the same RDNA3 W4A16 kernel, plugin 0.8.0 on
  # 0.26's FLA layout; Harbor tag pinned-ad93ae726bbe; prewarmed here by
  # !1106). Qualified on this node 2026-09-14 at this 64K / two-sequence
  # envelope (rows gfx1100-native-w4a16-2026-09-14-seqs2 / -096: 3/3 probes,
  # 41.3 tok/s vs 41.7 on v023, 65K recall in JSON mode, tools, cancellation,
  # 82-request soak). Canaried on the XTX warm lane first (row
  # gfx1100-native-w4a16-2026-10-22): identical answers, 43.0 tok/s vs 43.1,
  # 40/40 concurrent completions, then the XTX card dropped off the bus
  # (its known SMU/PCIe signature, not a runtime fault; lane parked). Every
  # other knob below is unchanged except gpuMemoryUtilization (see there).
  # Rollback = `2e9652ed` (still resident on this node, IfNotPresent, held
  # by the prewarm list): revert this line.
  # 2026-10-25 (issue #74 S2, vLLM currency 0.26 -> 0.32): PROMOTED to
  # `cd108c9e` (rocm-gfx1100-v032-native-w4a16-3fc9c37f: the native-W4A16
  # image on the upstream vLLM 0.32.0 ROCm wheel, Dockerfile from !1134,
  # prewarmed here by !1143) after the XTX warm lane canaried it (row
  # xtx-vllm-v032-2026-10-24): Model Runner V2, RDNA3W4A16LinearKernel,
  # TRITON_ATTN, fla_autotuners=11, pool 129,582 tokens / 1.98x at 0.96 (0.26
  # gave 1.81x on that card), probes identical. `calculateKvScales` left the
  # config with this repin (flag removed upstream in 0.28, see below);
  # everything else in the envelope is unchanged. Rollback = `ad93ae72`
  # (resident here, Harbor pinned-ad93ae726bbe): revert this line and
  # restore `calculateKvScales: false`.
  image: registry.harbor.lan/flexinfer/runtime@sha256:cd108c9ebf99130cc98c3a45bd6e09c89a3b26cb21193c858fab9a99573c7d90
  source: HF://biMEMO/Qwen3.8-27B-int4-AutoRound
  cache:
    # 19.0 GB artifact. Serving needs NO on-disk config surgery (hfOverrides
    # rewrites quantization_config in-process); only an MTP retry does.
    strategy: Local
    storageClass: nvme-1r-gpu
    size: 40Gi
    # 19 GB of shards exceed this 63Gi node's tmpfs budget — serve from the
    # PVC directly, same as the wan21 lanes on this host.
    flashLoader:
      enabled: false
    compilationCache:
      enabled: true
      hostPath: /var/lib/flexinfer/compile-cache-qwen38-27b-autoround-5930k
      sizeLimit: 4Gi
  gpu:
    vendor: amd
    count: 1
    shared: 5930k-textgen
    # Borrow-idle posture (fable/wan pattern): explicit workhorse demand may
    # take an idle card, while the higher-priority VACE video lane stays
    # authoritative. Cold-load window: demand must persist ~4-6 min; Mills'
    # proxy retries cover this.
    priority: 500
    vramEstimateMB: 22000
  serverless:
    enabled: true
    minReplicas: 0
    # 2026-09-13 (utilization slice 1, .loom/10-research-flexinfer-utilization-
    # loom-mills-2026-09-13.md): 30m -> 12h. Every recorded cold start of this
    # lane exceeded 300 s (12/12 in flexinfer_model_cold_start_duration_seconds)
    # and the lane sat Idle at 15 of 17 four-hour samples in the week of 09-06,
    # so each Mills council/audit/review call after a quiet half hour paid a
    # 5+ minute cold start and every latency-sensitive Mills stage stayed on
    # vendor models. A long idle window keeps the card warm across Mills'
    # inter-call gaps (council cron every 6h, pipelines, audit sweeps) while
    # warmPolicy stays ondemand: a higher-priority member (wan21 VACE 600, T2V
    # 500, glimmer 500) can still demand-swap once this lane is idle > 2 min,
    # which minReplicas 1 would block (whisper/!563 lesson). Card is otherwise
    # 1.2% busy over 30d, so holding VRAM costs nothing.
    idleTimeout: 12h
    # First activation on a cold cache covers the 19 GB HF prefetch + fresh
    # torch.compile (~5 min); cached restarts are ~3 min.
    coldStartTimeout: 25m
  config:
    # RDNA3 long-context decode fix (research doc 8d/!967): ROCm default
    # ROCM_ATTN has no KV-length decode parallelism; TRITON_ATTN engages the
    # unified-attention 3D split-KV decode path.
    attentionBackend: TRITON_ATTN
    warmPolicy: ondemand
    # vLLM 0.23 resolves quant_method "auto-round" to "inc" (rejected on
    # ROCm) before honoring --quantization. hfOverrides therefore rewrites
    # quantization_config wholesale to plain GPTQ form; the checkpoint's
    # auto_round:auto_gptq packing is GPTQ-shaped (sym, g128) and selects the
    # native RDNA3W4A16LinearKernel. modules_in_block_to_quantize is the
    # exact INT4 census from this artifact's safetensors index (in_proj_a/b,
    # conv1d, norms, lm_head are FP16).
    quantization: gptq
    # 2026-09-13: `architectures` pinned in-process (issue #74 incident #2).
    # The runtime DaemonSet's entrypoint rewrote this lane's on-disk
    # config.json to the text-only Qwen3_5ForCausalLM class (node-wide
    # /models pass), and vLLM 0.23 then died on the first request with
    # "M-RoPE support is not implemented". hf-overrides is applied before
    # architecture resolution, so the lane loads the VL-layout class it was
    # qualified on regardless of what the cache says on disk.
    hfOverrides: '{"architectures":["Qwen3_5ForConditionalGeneration"],"quantization_config":{"quant_method":"gptq","bits":4,"group_size":128,"sym":true,"desc_act":false,"lm_head":false,"modules_in_block_to_quantize":["self_attn.q_proj","self_attn.k_proj","self_attn.v_proj","self_attn.o_proj","mlp.gate_proj","mlp.up_proj","mlp.down_proj","linear_attn.in_proj_qkv","linear_attn.in_proj_z","linear_attn.out_proj"]}}'
    dtype: half
    languageModelOnly: true
    # Context envelope: 64K / two sequences (owner decision 2026-10-03), the
    # same posture as the 7900xtx warm lane. The 128K envelope (2026-08-16
    # context-push: fp8 KV pool 137,098 tokens = 1.05x at 131072; needle 1/1
    # @99,498, 1/1 @128,409, 5/5 @128,509; prefill 198 tok/s @60K, 129 @100K)
    # still qualifies on this artifact/runtime/TRITON_ATTN posture, but on a
    # 23 GiB gfx1100 the model takes 16.77 GiB and leaves ~4.4 GiB of KV
    # (~132K tokens fp8), so 131072 forces maxNumSeqs 1: every Mills research,
    # shadow-judge and weaver call serialised behind one 2-minute generation
    # (8-token probe 88.9 s on 2026-10-03; vLLM e2e p95 204-235 s all day)
    # while the 7-day p99 prompt on this lane was 40.7K tokens (mean 4.1K).
    # 65536 gives 2.02x concurrency with the same pool. Raise back to 131072
    # only with a >64K consumer in hand and the concurrency cost accepted.
    maxModelLen: 65536
    maxNumSeqs: 2
    maxNumBatchedTokens: 4096
    enableChunkedPrefill: true
    # Reserve by actual request length, not the full 64K (owner decision
    # 2026-10-03). Correction to the first reading: the 69,905-token pool
    # after !1074 was a rollout race (vLLM profiled free VRAM while the old
    # EngineCore was still releasing memory; the !1075 relaunch got the full
    # 132,528), not the 5930k's 256 MiB BAR window, which costs transfer
    # speed (weights 24.9 s vs 15 s) rather than pool size. The flag stays
    # false on purpose: it is harmless with the full pool (2 x 64K fits in
    # 132K) and it keeps two typical requests overlapping if a boot ever
    # profiles a short pool again. The lane's 7-day p95 is 18K prompt +
    # 4.3K generation; vLLM preempts only when two long requests collide.
    schedulerReserveFullISL: false
    # 2026-10-22 (vLLM 0.26 repin): 0.94 -> 0.96, the value this digest was
    # qualified with on this node on 2026-09-14 (rows gfx1100-native-w4a16-
    # 2026-09-14-seqs2 / -096: 129,615 tokens warm, 72,817 on a fresh
    # compile). vLLM >= 0.21 charges cudagraph capture memory to this budget
    # ("0.94 is equivalent to 0.9232 without CUDA graph memory profiling"):
    # on the XTX roll the same 0.94 profiled 103,517 tokens (1.58x) against
    # 132,561 (2.02x) on 0.23, and the cold-compile-cache first boot left
    # 1.54 GiB (< the 2.15 GiB one 64K request needs) and crashed once. The
    # card hosts nothing else (vramEstimateMB 22000 = whole card). Rollback
    # = 0.94 (1.58x, still above the KVPoolShort line of 1.5x).
    gpuMemoryUtilization: "0.96"
    # fp8 KV (the 2026-08-16 context push moved this lane off fp16; research
    # doc 8c's dequant-tax note applied to the earlier runtime).
    kvCacheDtype: fp8_e4m3
    # `calculateKvScales: false` left with the 0.32 repin (2026-10-25): vLLM
    # 0.28 removed the deprecated runtime KV-scale calculation and its CLI
    # flag, so the controller must not render `--no-calculate-kv-scales`
    # (vllm serve rejects unknown flags). fp8 KV with static scales, which is
    # what `false` selected, is the remaining behaviour. Restore the key only
    # with a < 0.28 image.
    enforceEager: false
    # Hybrid-GDN prefix caching (owner decision 2026-10-03), the same recipe
    # as the warm XTX lane (flexinfer !1076/!1077) and the 9B RP primary:
    # explicit flag, "align" mode, bf16 SSM state, prompt-token details.
    # Measured on the XTX lane 2026-10-03: a 7,627-token repeat went from
    # 12.96 s to 1.3 s with cached_tokens 7200 (blocks of 800), answers
    # unchanged, and the pool stays ~132K tokens (2.02x at 65536; the XTX
    # lane's second APC boot read 132,561). After any roll read the boot
    # line "GPU KV cache size". Three times on 2026-10-03 the FIRST boot
    # after a change that invalidates the torch.compile / cudagraph cache
    # (64K envelope, then APC on each lane) profiled only ~70K tokens, and
    # the pod deleted right afterwards profiled the full pool (this lane:
    # 70,004 then 132,561 at 17:48Z). The warm-cache boot started seconds
    # after the deletion, so it is not the old pod's memory: the cold
    # compile/autotune during vLLM's profile run inflates the measured
    # peak and the KV budget is sized around it for the pod's lifetime.
    # Rule: inspect status.kvPool (kvCacheTokens/maxConcurrency) and KVPoolShort for the automatic recheck; the
    # compile cache on the hostPath is warm for the next boot.
    # schedulerReserveFullISL above stays false (harmless at 2 x 64K <=
    # 132K, identical to the XTX lane). Consumers that benefit here: the
    # workhorse/reasoning alias callers that resend a system prompt, and
    # the Mills fallback traffic (research, weaver and shadow judge all
    # moved to the XTX lane on 2026-10-03, gitops !887/!889).
    # Rollback = enablePrefixCaching: false and drop the three keys below.
    enablePrefixCaching: true
    mambaCacheMode: "align"
    mambaSsmCacheDtype: "bfloat16"
    enablePromptTokensDetails: true
    # MTP stays OFF (3.6 finding: ~33% pos-0 acceptance = net zero on this
    # runtime; the draft ModelConfig also re-reads config.json from disk and
    # ignores hfOverrides). This artifact's MTP block is INT4 — a retry needs
    # the PVC config.json patch AND fresh acceptance numbers.
    disableAiter: true
    rocmCustomPagedAttn: false
    hipVisibleDevices: "0"
    trustRemoteCode: true
    # Non-thinking by default (2026-08-30, RP-consumer migration). This lane
    # now serves naive OpenAI callers moving off the 9b RP lanes
    # (news-analyzer, jobsearch daemon) that send no chat_template_kwargs
    # and modest max_tokens; with thinking on, the <think> phase eats the
    # budget and answers come back EMPTY (F3 session 2026-08-16). Same
    # posture as both qwen35-9b lanes. Per-request chat_template_kwargs
    # still take precedence, so Mills/loom clients that set enable_thinking
    # explicitly (loom-core pkg/mills/clients/flexinfer.go) are unchanged,
    # and any caller can opt back into thinking per request.
    defaultChatTemplateKwargs:
      enable_thinking: false
    enableToolCalling: true
    toolCallParser: qwen3_coder
    # Clean checkpoint with proper <think> boundaries — split reasoning into
    # reasoning_content so Mills/agent flows get clean content + tool_calls.
    reasoningParser: qwen3
    servedModelName: qwen38-27b-autoround-workhorse
    disableLogStats: false
    failOnEnvironValidation: false
  nodeSelector:
    kubernetes.io/hostname: cblevins-5930k
  resources:
    requests:
      cpu: "4"
      memory: 16Gi
      # 2026-09-13: CI job pods share this node. When three pipelines filled
      # the root disk at 16:23Z, kubelet evicted this pod (and image GC then
      # dropped its 11 GB runtime image: 10 min re-pull, ~20 min lane outage)
      # ahead of the CI pods, because pods exceeding their ephemeral-storage
      # request are ranked first and a pod with no request exceeds it at the
      # first byte. Actual usage is ~50 MB; the request only changes ranking.
      ephemeral-storage: 2Gi
    limits:
      cpu: "8"
      memory: 40Gi
  # 2026-09-13: mills-council moved to the warm 7900xtx lane
  # (qwen38-27b-xtx-warm-canary, alias mills-warm); this lane keeps the
  # workhorse / loom-workhorse / reasoning roles (64K, two sequences since
  # 2026-10-03 — see maxModelLen above).
  serviceLabels:
    - qwen38-27b
    - workhorse
    - loom-workhorse
    - reasoning
  litellm:
    enabled: true
    servedModelName: qwen38-27b-autoround-workhorse
    aliases:
      - qwen38-27b
      - workhorse
      - loom-workhorse
      - reasoning
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

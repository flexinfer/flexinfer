# Qwen3.8-27B dense INT4 AutoRound — the Mills/Council QUALITY workhorse.
#
# Successor to qwen36-27b-autoround-workhorse (parked as fallback until soak):
# identical serving contract (Qwen3_5ForConditionalGeneration / qwen3_5, 64
# layers, full_attention_interval 4, native 262144 ctx) with generational
# agentic gains — SWE-bench Pro 61.7 vs 53.5, Terminal-Bench 73.0 vs 59.3.
# Research: .loom/10-research-gfx1100-model-quality-2026-08-15.md (8g) +
# canary deploy/debug/qwen38-27b-clean-autoround-canary.yaml.
#
# Artifact: biMEMO/Qwen3.8-27B-int4-AutoRound (community; Intel has no official
# 3.8 AutoRound release). Intel-recipe shape: auto_round:auto_gptq, INT4 sym
# g128, GDN in_proj_a/b + norms + lm_head FP16, 19.0 GB; INT4 census verified
# 2026-08-16 = the same 10-module list as the 3.6 artifact, so the inc
# workaround hfOverrides carries over unchanged. MTP block is INT4 in this
# artifact (Intel's 3.6 kept mtp.fc FP16); text plugin >= 0.9.0 builds the
# draft from it in-process (FLEXINFER_QWEN35_MTP_HEAD=checkpoint).
#
# Qualified envelope (S4, 2026-10-26; do not casually change):
#   - 32K, fp16 KV, graph mode, MTP K=2, ROCM_SEGMENTED_ATTN with autotune.
#     Evidence: .loom/10-research-gfx1100-next-feature-2026-10-23.md §7d' and
#     §7d'' (rows gfx1100-native-w4a16-v032-s3-attn-2026-10-26 and
#     gfx1100-native-w4a16-v032-s3b-ttft-2026-10-26) on this node and image:
#     decode 71.8 / 66.5 / 66.1 tok/s at 512 / 2K / 16K (the TRITON + fp8
#     envelope below: 40.8 / 40.2 / 34.3), prefill 2-3x faster at 16K-28K,
#     TTFT within 20 % of the TRITON lane at every size once the segmented
#     kernels are compiled (first use of a shape compiles once, ~1-1.5 s).
#   - Before S4 (2026-08-16 .. 2026-10-26): 64K, fp8 KV, TRITON_ATTN (the !967
#     RDNA3 split-KV decode fix), no MTP. That is the rollback envelope.
apiVersion: ai.flexinfer/v1alpha2
kind: Model
metadata:
  name: qwen38-27b-autoround-workhorse
  namespace: flexinfer-system
  annotations:
    flexinfer.ai/base-model-source: Qwen/Qwen3.8-27B
    # 2026-09-13: scheduler preemption guard. The serving pod carries
    # flexinfer-serving-critical (150000) so it preempts priority-0 CI job
    # pods for CPU on its node (the 5930k also hosts CI job pods).
    # Same class the radeonvii retrieval lanes use; the class must exist.
    flexinfer.ai/serving-priority-class: flexinfer-serving-critical
    flexinfer.ai/base-model-posture: clean
    flexinfer.ai/artifact-source: HF://biMEMO/Qwen3.8-27B-int4-AutoRound
    flexinfer.ai/plan: ".loom/10-research-gfx1100-next-feature-2026-10-23.md"
    # 2026-11-22: the window is 64K (see maxModelLen) and the target is the
    # 128K lane (!1383), so this route now carries 64K-128K prompts.
    # S4: prompts that no longer fit the 32K window (vLLM's context-length
    # 400) are replayed once by flexinfer-proxy to the warm XTX lane: same
    # Qwen3.8-27B artifact and recipe at 64K, warmPolicy primary. Needs the
    # proxy with CC-6a-3 (feat/proxy-context-overflow) rolled first. The main
    # consumer is psyche-simulation (consolidates around 58.9K through the
    # `workhorse` alias). If the XTX lane is down, those requests get the
    # original 400. Counted in flexinfer_proxy_context_overflow_total.
    flexinfer.ai/context-overflow-to: qwen38-27b-xtx-warm-canary
    # 2026-10-30 placement layout (.loom/10-research-voice-stack-and-gpu-
    # placement-2026-10-30.md §6): the XTX warm lane also claims the
    # workhorse / loom-workhorse / reasoning / qwen38-27b labels, so a
    # label-addressed request fails over to it when this lane is not Ready.
    # This tier keeps those labels here while this lane is Ready. It only
    # affects label groups that contain this lane; aliases are unchanged.
    flexinfer.ai/route-priority: "100"
    # 2026-11-22 (owner decision): promoted straight to 64K on the evidence
    # in the image comment below; row
    # gfx1100-5930k-workhorse-v033-s7-64k-2026-11-22 records the live checks.
    flexinfer.ai/promotion-state: promoted-64k-v033-s7-segmented-mtp
    flexinfer.ai/promotion-evidence: "runtime@51afd0d3 (vLLM 0.33 + S7 embed host + segmented + MTP K=2) live on the XTX 128K lane since !1383: parity hash 8174a49e, pos0 0.81, 159,599-token fp8 pool; S7 row xtx-s7-embed-host-2026-11-05: +2.36 GiB KV, parity identical; 0.33 parity row xtx-vllm-v033-parity-2026-11-05; 5930k 64K live checks in row gfx1100-5930k-workhorse-v033-s7-64k-2026-11-22"
spec:
  backend: vllm
  # 2026-10-22 (issue #74 S2, vLLM currency): REPINNED from `2e9652ed` — the
  # July vLLM 0.23 build with the native RDNA3 W4A16 HIP operator that the 3.6
  # AND 3.8 qualification ladders passed against. Harbor retention deleted
  # that digest (2026-10-17/21, row gfx1100-runtime-pins-2026-10-21) and its
  # CI job had been repointed to v0.26 in place, so it cannot be rebuilt; it
  # survived only as this node's containerd snapshot under the prewarm
  # DaemonSet, one reinstall or image GC away from ending the lane. Now on
  # `ad93ae72` (rocm-gfx1100-v026-native-w4a16-a106504c, master a106504c
  # 2026-09-14: vLLM 0.26.0 + the same RDNA3 W4A16 kernel, plugin 0.8.0 on
  # 0.26's FLA layout; Harbor tag pinned-ad93ae726bbe; prewarmed here by
  # !1106). Qualified on this node 2026-09-14 at this 64K / two-sequence
  # envelope (rows gfx1100-native-w4a16-2026-09-14-seqs2 / -096: 3/3 probes,
  # 41.3 tok/s vs 41.7 on v023, 65K recall in JSON mode, tools, cancellation,
  # 82-request soak). Canaried on the XTX warm lane first (row
  # gfx1100-native-w4a16-2026-10-22): identical answers, 43.0 tok/s vs 43.1,
  # 40/40 concurrent completions, then the XTX card dropped off the bus
  # (its known SMU/PCIe signature, not a runtime fault; lane parked). Every
  # other knob below is unchanged except gpuMemoryUtilization (see there).
  # Rollback = `2e9652ed` (still resident on this node, IfNotPresent, held
  # by the prewarm list): revert this line.
  # 2026-10-25 (issue #74 S2, vLLM currency 0.26 -> 0.32): PROMOTED to
  # `cd108c9e` (rocm-gfx1100-v032-native-w4a16-3fc9c37f: the native-W4A16
  # image on the upstream vLLM 0.32.0 ROCm wheel, Dockerfile from !1134,
  # prewarmed here by !1143) after the XTX warm lane canaried it (row
  # xtx-vllm-v032-2026-10-24): Model Runner V2, RDNA3W4A16LinearKernel,
  # TRITON_ATTN, fla_autotuners=11, pool 129,582 tokens / 1.98x at 0.96 (0.26
  # gave 1.81x on that card), probes identical. `calculateKvScales` left the
  # config with this repin (flag removed upstream in 0.28, see below);
  # everything else in the envelope is unchanged. Rollback = `ad93ae72`
  # (resident here, Harbor pinned-ad93ae726bbe): revert this line and
  # restore `calculateKvScales: false`.
  # 2026-10-26 (S4, research §7d''): `b06b06fe` (rocm-gfx1100-v032-native-
  # w4a16, CI builds of master dc73879c and c444b5ff produced this same
  # digest; Harbor pinned-b06b06fe1c02; prewarmed here by !1166): the same
  # Dockerfile plus text plugin 0.9.0, which carries the MTP head policy.
  # `cd108c9e` predates !1139 and must not run MTP. S3 and S3b measured this
  # digest on this node. Rollback = revert the S4 commit: `cd108c9e` (resident,
  # pinned-cd108c9ebf99) with the TRITON + fp8 + 64K config and its warm
  # compile cache path.
  # 2026-11-05 (prepared; promotion to vLLM 0.33 + S7, row
  # xtx-workhorse-v033-promotion-2026-11-05): `51afd0d3` (rocm-gfx1100-serving-v033-3e8ae3c2,
  # pinned-51afd0d377f7; CI job publish_serving_rocm_gfx1100_v033 from master 4da96d96 +
  # the CI-only commit of !1306): the gfx1100-serving-v033 persona, vLLM
  # 0.33.0-rocm72 (S3 parity, row xtx-vllm-v033-parity-2026-11-05) with text
  # plugin 0.12.0 and plugin-common 0.5.0, which carry the S7 embed-host
  # loader patch. 2026-11-22: promoted without the separate XTX promotion
  # canary (owner decision). This digest with S7, segmented attention and
  # MTP K=2 has served the XTX 128K lane since !1383 (fp8 KV there; parity
  # hash 8174a49e, pos0 0.81, row xtx-128k-fp8-segmented-s7-2026-11-21), and
  # fp16 parity of 0.33 is row xtx-vllm-v033-parity-2026-11-05.
  # Rollback = revert the promotion commit: `b06b06fe` (resident here,
  # pinned-b06b06fe1c02) with no vllmVersion, no FLEXINFER_EMBED_HOST, no
  # structuredOutput, and the S4 compile cache path.
  # 2026-11-23 dot2 (owner decision; step 2 of 2 after the XTX lane, row
  # gfx1100-5930k-workhorse-dot2-2026-11-23): pinned-1a2dd85c9bcd, the v033
  # build carrying build/vllm-rdna3-w4a16-plugin, with
  # FLEXINFER_RDNA3_W4A16=dot2 (env below). Canary +10.7 % decode at 2K on
  # this posture; the XTX 128K lane on it read +17.8 % at 2K. Not bit-identical
  # to vLLM's kernel. Rollback = 51afd0d3 (prewarmed) without the env key and
  # the compile-cache-qwen38-27b-v033-5930k base.
  image: registry.harbor.lan/flexinfer/runtime@sha256:1a2dd85c9bcd17f75c80fe8ba8649e81cb96038ca247f2469e5167db799758c0
  source: HF://biMEMO/Qwen3.8-27B-int4-AutoRound
  # D4 (KT-SO): renders --structured-outputs-config {"backend":"auto"} once the
  # gfx1100 GPUProfile certifies exactly this digest (Draft !1303, re-targeted
  # after the promotion canary's phase S re-ran KT-SO on it); until then the
  # condition reads StructuredOutputNotCertified and nothing renders. Needs
  # dedicatedDeployment: true (set below). Rollback = drop this block.
  capabilities:
    structuredOutput: true
  cache:
    # 19.0 GB artifact. Serving needs NO on-disk config surgery (hfOverrides
    # rewrites quantization_config in-process); only an MTP retry does.
    strategy: Local
    storageClass: nvme-1r-gpu
    size: 40Gi
    # 19 GB of shards exceed this 63Gi node's tmpfs budget — serve from the
    # PVC directly, same as the wan21 lanes on this host.
    flashLoader:
      enabled: false
    compilationCache:
      enabled: true
      # S4: a fresh path, so the TRITON + fp8 cache under
      # compile-cache-qwen38-27b-autoround-5930k (4.2 GB) stays warm for a
      # rollback. Seed it from the S3/S3b canary before the roll (research
      # §7f): the segmented autotune table and Triton variants are keyed by
      # GPU, toolchain, kernel source and shapes, not by Model name or path,
      # so a seeded first boot skips the ~10 min 74-workload autotune and the
      # first-use compiles S3/S3b already paid. Unseeded, it still boots; the
      # first boot autotunes and may profile a short pool once (the controller
      # rechecks it).
      # 2026-11-05 (0.33): a fresh path, so the 0.32 S4 cache
      # (compile-cache-qwen38-27b-v032-s4-5930k) stays warm for a rollback.
      # Unseeded, the first boot autotunes the segmented kernels for the 64K
      # table width (10-30 min) and may fail the one-request 64K KV check on
      # that cold boot; the automatic restart is warm (the 128K canary saw
      # both, row xtx-128k-fp8-segmented-s7-2026-11-21 §3.3).
      # 2026-11-23 dot2: a new base, so the 51afd0d3 64K cache stays warm for
      # a rollback. Its .../flexinfer-system/qwen38-27b-autoround-workhorse
      # subdir was seeded by hand from the GPTQ-RDNA3 canary's subdir on the
      # XTX (same image, gfx1100 and 64K fp16 posture: compile plus segmented
      # autotune, 1.3 GB).
      hostPath: /var/lib/flexinfer/compile-cache-qwen38-27b-v033-dot2-5930k
      sizeLimit: 4Gi
  gpu:
    vendor: amd
    count: 1
    shared: 5930k-textgen
    # 2026-10-30 placement layout (.loom/10-research-voice-stack-and-gpu-
    # placement-2026-10-30.md §6): this card is the ALWAYS-ON workhorse card.
    # 900 is the top of 5930k-textgen, and with minReplicas 1 plus warmPolicy
    # primary nothing in the group can preempt this lane. Every other 5930k
    # member is statically parked (the proxy answers 503 at once and records
    # no demand). The creative lanes (Qwen-Image, Wan, Stable Audio) moved to
    # the 7900xtx flex card. Why here and not the XTX: over the 7 days before
    # 2026-10-30 the 5930k's GPU never left flexinfer_gpu_healthy=1, while the
    # XTX was degraded ~41 of 168 h.
    # Rollback: 500, minReplicas 0, warmPolicy ondemand (the borrow-idle
    # posture: equal-priority creative lanes took the card only when this lane
    # was idle 2 min, so Qwen-Image made 3 successful renders in a week).
    priority: 900
    vramEstimateMB: 22000
  serverless:
    enabled: true
    # 2026-10-30 placement layout: 0 -> 1, always on (see gpu.priority). The
    # 2026-09-13 note below describes the ondemand posture this replaces; the
    # creative lanes it protected now live on the 7900xtx.
    minReplicas: 1
    # 2026-09-13 (utilization slice 1, .loom/10-research-flexinfer-utilization-
    # loom-mills-2026-09-13.md): 30m -> 12h. Every recorded cold start of this
    # lane exceeded 300 s (12/12 in flexinfer_model_cold_start_duration_seconds)
    # and the lane sat Idle at 15 of 17 four-hour samples in the week of 09-06,
    # so each Mills council/audit/review call after a quiet half hour paid a
    # 5+ minute cold start and every latency-sensitive Mills stage stayed on
    # vendor models. A long idle window keeps the card warm across Mills'
    # inter-call gaps (council cron every 6h, pipelines, audit sweeps) while
    # warmPolicy stays ondemand: a higher-priority member (wan21 VACE 600, T2V
    # 500, glimmer 500) can still demand-swap once this lane is idle > 2 min,
    # which minReplicas 1 would block (whisper/!563 lesson). Card is otherwise
    # 1.2% busy over 30d, so holding VRAM costs nothing.
    idleTimeout: 12h
    # First activation on a cold cache covers the 19 GB HF prefetch + fresh
    # torch.compile (~5 min); cached restarts are ~3 min.
    # 2026-11-22: 25m -> 45m for the cold 64K autotune.
    coldStartTimeout: 45m
  config:
    # 2026-11-05 (promotion to 0.33): required with a 0.32+ image pin (!1281,
    # live in the controller since A1/!1289). It drops the VLLM_* env names
    # 0.33 removed and --mamba-cache-mode. Rollback = drop this key.
    vllmVersion: "0.33.0"
    # 2026-10-30 (S6b readiness): stay a dedicated Deployment until S6b moves
    # this lane into the 5930k runtime pod on purpose. Without the flag,
    # un-parking that DaemonSet (deploy/system/values-k3s.yaml, profile
    # gfx1100-5930k) loads the lane in-pod on the DaemonSet's image instead
    # of spec.image. The flag only routes; the Deployment renders the same
    # (controllers/model_dedicated_deployment_render_test.go).
    dedicatedDeployment: true
    # S4 (2026-10-26): vLLM 0.32's token-major segmented attention (#59132)
    # for both prefill chunks and the MTP verify step; it holds decode at
    # 66 tok/s to 16K where TRITON_ATTN (the !967 RDNA3 split-KV decode fix,
    # the rollback value) falls to 34 and loses MTP's gain past 2K (research
    # §7d'). The draft names the same backend in speculativeConfig.
    attentionBackend: ROCM_SEGMENTED_ATTN
    # Startup autotune for the segmented kernels (74 workloads, ~10 min once
    # per compile cache; cached in vllm/rocm_segmented_attention/ on the
    # hostPath). Only affects ROCM_SEGMENTED_ATTN.
    kernelConfig: '{"enable_rocm_segmented_attn_autotune":true}'
    # Text plugin 0.9.0 builds the MTP draft from the checkpoint's own head
    # (mtp.fc fp16, mtp.layers.0 INT4) instead of re-reading config.json.
    # S7 (2026-11-05, rows xtx-s7-embed-host-2026-11-05 and
    # xtx-workhorse-v033-promotion-2026-11-05): FLEXINFER_EMBED_HOST moves the
    # untied 2.37 GiB fp16 embed_tokens table to exact-size mapped host memory
    # (cudaHostAlloc), so vLLM sizes the KV pool ~2.37 GiB larger. The MTP
    # draft shares the module. Gathered rows are bit-identical (parity held).
    # Rollback = drop the key.
    env:
      FLEXINFER_QWEN35_MTP_HEAD: checkpoint
      FLEXINFER_EMBED_HOST: "1"
      # 2026-11-23: the dot2 RDNA3 W4A16 GEMM (see the image comment).
      FLEXINFER_RDNA3_W4A16: dot2
    # 2026-10-30 placement layout: ondemand -> primary. The lane is the group's
    # designated tenant and reclaims the card if anything ever holds it (an
    # operator activation, a forcePromotion canary). Controller-only key: it
    # does not render into the pod, so this edit does not restart the lane.
    warmPolicy: primary
    # vLLM 0.23 resolves quant_method "auto-round" to "inc" (rejected on
    # ROCm) before honoring --quantization. hfOverrides therefore rewrites
    # quantization_config wholesale to plain GPTQ form; the checkpoint's
    # auto_round:auto_gptq packing is GPTQ-shaped (sym, g128) and selects the
    # native RDNA3W4A16LinearKernel. modules_in_block_to_quantize is the
    # exact INT4 census from this artifact's safetensors index (in_proj_a/b,
    # conv1d, norms, lm_head are FP16).
    quantization: gptq
    # 2026-09-13: `architectures` pinned in-process (issue #74 incident #2).
    # The runtime DaemonSet's entrypoint rewrote this lane's on-disk
    # config.json to the text-only Qwen3_5ForCausalLM class (node-wide
    # /models pass), and vLLM 0.23 then died on the first request with
    # "M-RoPE support is not implemented". hf-overrides is applied before
    # architecture resolution, so the lane loads the VL-layout class it was
    # qualified on regardless of what the cache says on disk.
    hfOverrides: '{"architectures":["Qwen3_5ForConditionalGeneration"],"quantization_config":{"quant_method":"gptq","bits":4,"group_size":128,"sym":true,"desc_act":false,"lm_head":false,"modules_in_block_to_quantize":["self_attn.q_proj","self_attn.k_proj","self_attn.v_proj","self_attn.o_proj","mlp.gate_proj","mlp.up_proj","mlp.down_proj","linear_attn.in_proj_qkv","linear_attn.in_proj_z","linear_attn.out_proj"]}}'
    dtype: half
    languageModelOnly: true
    # Context envelope: 64K / two sequences (owner decision 2026-10-03), the
    # same posture as the 7900xtx warm lane. The 128K envelope (2026-08-16
    # context-push: fp8 KV pool 137,098 tokens = 1.05x at 131072; needle 1/1
    # @99,498, 1/1 @128,409, 5/5 @128,509; prefill 198 tok/s @60K, 129 @100K)
    # still qualifies on this artifact/runtime/TRITON_ATTN posture, but on a
    # 23 GiB gfx1100 the model takes 16.77 GiB and leaves ~4.4 GiB of KV
    # (~132K tokens fp8), so 131072 forces maxNumSeqs 1: every Mills research,
    # shadow-judge and weaver call serialised behind one 2-minute generation
    # (8-token probe 88.9 s on 2026-10-03; vLLM e2e p95 204-235 s all day)
    # while the 7-day p99 prompt on this lane was 40.7K tokens (mean 4.1K).
    # 65536 gave 2.02x concurrency with the fp8 pool.
    # S4 (owner decision 2026-10-26): 32768. Segmented attention needs fp16 KV
    # on gfx11 (fp8 is gfx12-only), and with the MTP draft resident the pool is
    # 52,932 fp16 tokens = 1.62x at 32K, below one 64K sequence. Traffic fits:
    # in the 7 days to 2026-10-26 99.62 % of this lane's 12,971 requests had
    # prompts <= 20K and none exceeded 50K (49 were 20K-50K). Longer requests
    # take the overflow route (research §7f). Rollback restores 65536 with
    # fp8 KV and TRITON_ATTN.
    # 2026-11-22 (owner decision): 32768 -> 65536, fp16 KV kept. S7 frees
    # 2.37 GiB of VRAM, so the pool goes from 52,932 to ~84K tokens (~1.29x at
    # 64K). Why: at 32K the Mills pi harness compacted 4.1-12.5 times per run
    # (S0, 2026-11-22), and every render on the XTX paused the overflow lane.
    # Now 0-64K stays on this always-on card at full fp16 speed, and 64K-128K
    # overflows to the XTX 128K lane. Rollback = 32768.
    # 2026-11-22/23: 131072 with fp8 KV was tried (!1405) and ROLLED BACK (row
    # gfx1100-5930k-workhorse-128k-fp8-2026-11-22, `fail` on P2): pool
    # 182,729 tokens and everything else passed, but under this lane's own
    # production traffic long-context decode was 18.9-19.4 tok/s at 64K and
    # 9.1 at 120K (bars 24 / 15; the isolated XTX canary did 27.1 / 18.7), in
    # four runs including two with the XTX lane up, and short requests queued
    # (up to 4 waiting) behind 120K prefills on the two sequence slots.
    # Research keeps the XTX 128K lane (equal quality in the S0 window A/B).
    maxModelLen: 65536
    # 2026-11-23 (owner: optimization #1): 2 -> 4 sequence slots. On two slots
    # a long prompt plus one other request fill the lane. The seat-mix probe
    # (scripts/probe-lane-seat-mix.py, one ~56K prompt with a 2K request every
    # 5 s) measured 2K-request TTFT p50 27 s / p95 55-57 s on two slots, and
    # the 128K trial saw up to 4 production requests waiting. The 92,906-token
    # pool with reserve-by-length (schedulerReserveFullISL false) holds four
    # typical requests (7-day p95: 18K prompt + 4.3K output). vLLM priority
    # alone does nothing on a full lane (KT-QOS: no running request is evicted
    # for a seat), so seats come first and caller classes later. Row
    # gfx1100-5930k-workhorse-4-seats-2026-11-23. Rollback = 2.
    # 2026-11-23: ROLLED BACK to 2 (that row: `fail` on P2). With 4 slots the
    # 2K-request TTFT during a 56K prefill was p50 14.3 / 26.7 s and p95
    # 39.2 / 58.2 s (bars 13.5 / 28 s; two slots 27 / 56 s), and short decode
    # during the prefill fell to 2.7-6.4 tok/s (two slots 11-18): every step
    # still carries the long prompt's 1664-token chunk, so more slots only let
    # more short requests share slow steps. The bottleneck is the per-step
    # token budget, not the slot count. Idle decode was unchanged (16K 66.3).
    maxNumSeqs: 2
    maxNumBatchedTokens: 4096
    enableChunkedPrefill: true
    # Reserve by actual request length, not the full 64K (owner decision
    # 2026-10-03). Correction to the first reading: the 69,905-token pool
    # after !1074 was a rollout race (vLLM profiled free VRAM while the old
    # EngineCore was still releasing memory; the !1075 relaunch got the full
    # 132,528), not the 5930k's 256 MiB BAR window, which costs transfer
    # speed (weights 24.9 s vs 15 s) rather than pool size. The flag stays
    # false on purpose: it is harmless with the full pool (2 x 64K fits in
    # 132K) and it keeps two typical requests overlapping if a boot ever
    # profiles a short pool again. The lane's 7-day p95 is 18K prompt +
    # 4.3K generation; vLLM preempts only when two long requests collide.
    # S4: now load-bearing. 2 x 32K exceeds the 52,932-token pool, so
    # reserving by actual length is what lets two typical requests overlap.
    # Still load-bearing at 64K (2 x 64K > ~84K).
    schedulerReserveFullISL: false
    # 2026-11-22 (64K): the ~84K pool is ~1.29x at 65536, below the
    # controller's 1.5x KVPoolShort line for maxNumSeqs 2 by design, so a
    # recheck restart would buy nothing (a cold boot that profiles short fails
    # vLLM's own check and its restart is warm).
    kvPoolRecheck: false
    # 2026-11-22 (64K): cap a long prefill at 1664 tokens (four 416-token
    # blocks) per step, so short requests are not stuck behind a 64K cold
    # prefill (the 128K canary: 338-432 s without the cap, 6-66 s with it).
    # 2026-11-24 (WINDOW-GATED trial, row
    # gfx1100-5930k-workhorse-prefill-cap-416-2026-11-24): 1664 -> 416, one
    # state block. While a long prompt prefills, a request on the other slot
    # gets one stream chunk per engine step, and a 1664-token chunk at 56K
    # depth is ~1.8 s, so it decodes at ~1.3 tok/s and holds the slot. A
    # 416-token chunk should cut the step to ~0.5 s. vLLM applies the cap only
    # while another request is running or waiting, so a solo prompt keeps the
    # full 4096-token step. Chunk ends align to the 416-token block: 832 and
    # 416 keep every contended chunk on a boundary (a smaller cap is legal,
    # the scheduler re-aligns at the next boundary). Rollback = 1664.
    longPrefillTokenThreshold: 416
    # 2026-11-22 (64K): the engine-stall detector reads a long prefill as
    # frozen counters; 64K cold prefills run ~2-3 min here, under load longer.
    # Controller fix !1381 (KV growth counts as progress) is not live yet.
    stallWindow: 10m
    # 2026-10-22 (vLLM 0.26 repin): 0.94 -> 0.96, the value this digest was
    # qualified with on this node on 2026-09-14 (rows gfx1100-native-w4a16-
    # 2026-09-14-seqs2 / -096: 129,615 tokens warm, 72,817 on a fresh
    # compile). vLLM >= 0.21 charges cudagraph capture memory to this budget
    # ("0.94 is equivalent to 0.9232 without CUDA graph memory profiling"):
    # on the XTX roll the same 0.94 profiled 103,517 tokens (1.58x) against
    # 132,561 (2.02x) on 0.23, and the cold-compile-cache first boot left
    # 1.54 GiB (< the 2.15 GiB one 64K request needs) and crashed once. The
    # card hosts nothing else (vramEstimateMB 22000 = whole card). Rollback
    # = 0.94 (1.58x, still above the KVPoolShort line of 1.5x).
    gpuMemoryUtilization: "0.96"
    # S4: auto = fp16 (the model dtype). ROCM_SEGMENTED_ATTN rejects fp8 KV
    # on gfx11. The fp8_e4m3 value (2026-08-16 context push) is the rollback.
    kvCacheDtype: auto
    # `calculateKvScales: false` left with the 0.32 repin (2026-10-25): vLLM
    # 0.28 removed the deprecated runtime KV-scale calculation and its CLI
    # flag, so the controller must not render `--no-calculate-kv-scales`
    # (vllm serve rejects unknown flags). fp8 KV with static scales, which is
    # what `false` selected, is the remaining behaviour. Restore the key only
    # with a < 0.28 image.
    enforceEager: false
    # Hybrid-GDN prefix caching (owner decision 2026-10-03), the same recipe
    # as the warm XTX lane (flexinfer !1076/!1077) and the 9B RP primary:
    # explicit flag, "align" mode, bf16 SSM state, prompt-token details.
    # Measured on the XTX lane 2026-10-03: a 7,627-token repeat went from
    # 12.96 s to 1.3 s with cached_tokens 7200 (blocks of 800), answers
    # unchanged, and the pool stays ~132K tokens (2.02x at 65536; the XTX
    # lane's second APC boot read 132,561). After any roll read the boot
    # line "GPU KV cache size". Three times on 2026-10-03 the FIRST boot
    # after a change that invalidates the torch.compile / cudagraph cache
    # (64K envelope, then APC on each lane) profiled only ~70K tokens, and
    # the pod deleted right afterwards profiled the full pool (this lane:
    # 70,004 then 132,561 at 17:48Z). The warm-cache boot started seconds
    # after the deletion, so it is not the old pod's memory: the cold
    # compile/autotune during vLLM's profile run inflates the measured
    # peak and the KV budget is sized around it for the pod's lifetime.
    # Rule: inspect status.kvPool (kvCacheTokens/maxConcurrency) and KVPoolShort for the automatic recheck; the
    # compile cache on the hostPath is warm for the next boot.
    # schedulerReserveFullISL above stays false (harmless at 2 x 64K <=
    # 132K, identical to the XTX lane). Consumers that benefit here: the
    # workhorse/reasoning alias callers that resend a system prompt, and
    # the Mills fallback traffic (research, weaver and shadow judge all
    # moved to the XTX lane on 2026-10-03, gitops !887/!889).
    # Rollback = enablePrefixCaching: false and drop the three keys below.
    enablePrefixCaching: true
    mambaCacheMode: "align"
    mambaSsmCacheDtype: "bfloat16"
    enablePromptTokensDetails: true
    # MTP K=2 (S4). The 3.6-era "MTP off" finding (~33 % pos-0 acceptance,
    # draft re-reading config.json) no longer holds on 0.32 + plugin 0.9.0: the
    # draft is built in-process from the target's VllmConfig, so no on-disk
    # config surgery. Position-0 acceptance was 0.79-0.86 at every context
    # and 0.81 overall, mean acceptance length 2.38 (S3/S3b). MTP pays only on
    # segmented attention: on TRITON_ATTN it lost past 2K (0.45x at 16K).
    # Rollback = drop this key.
    speculativeConfig: '{"method":"mtp","num_speculative_tokens":2,"attention_backend":"ROCM_SEGMENTED_ATTN"}'
    disableAiter: true
    rocmCustomPagedAttn: false
    hipVisibleDevices: "0"
    trustRemoteCode: true
    # Non-thinking by default (2026-08-30, RP-consumer migration). This lane
    # now serves naive OpenAI callers moving off the 9b RP lanes
    # (news-analyzer, jobsearch daemon) that send no chat_template_kwargs
    # and modest max_tokens; with thinking on, the <think> phase eats the
    # budget and answers come back EMPTY (F3 session 2026-08-16). Same
    # posture as both qwen35-9b lanes. Per-request chat_template_kwargs
    # still take precedence, so Mills/loom clients that set enable_thinking
    # explicitly (loom-core pkg/mills/clients/flexinfer.go) are unchanged,
    # and any caller can opt back into thinking per request.
    defaultChatTemplateKwargs:
      enable_thinking: false
    enableToolCalling: true
    toolCallParser: qwen3_coder
    # Clean checkpoint with proper <think> boundaries — split reasoning into
    # reasoning_content so Mills/agent flows get clean content + tool_calls.
    reasoningParser: qwen3
    servedModelName: qwen38-27b-autoround-workhorse
    disableLogStats: false
    failOnEnvironValidation: false
  nodeSelector:
    kubernetes.io/hostname: cblevins-5930k
  resources:
    requests:
      cpu: "4"
      memory: 16Gi
      # 2026-09-13: CI job pods share this node. When three pipelines filled
      # the root disk at 16:23Z, kubelet evicted this pod (and image GC then
      # dropped its 11 GB runtime image: 10 min re-pull, ~20 min lane outage)
      # ahead of the CI pods, because pods exceeding their ephemeral-storage
      # request are ranked first and a pod with no request exceeds it at the
      # first byte. Actual usage is ~50 MB; the request only changes ranking.
      ephemeral-storage: 2Gi
    limits:
      cpu: "8"
      memory: 40Gi
  # 2026-09-13: mills-council moved to the warm 7900xtx lane
  # (qwen38-27b-xtx-warm-canary, alias mills-warm); this lane keeps the
  # workhorse / loom-workhorse / reasoning roles (two sequences since
  # 2026-10-03, 32K since S4 — see maxModelLen above).
  serviceLabels:
    - qwen38-27b
    - workhorse
    - loom-workhorse
    - reasoning
  litellm:
    enabled: true
    servedModelName: qwen38-27b-autoround-workhorse
    aliases:
      - qwen38-27b
      - workhorse
      - loom-workhorse
      - reasoning
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

# MAINTENANCE WINDOW — 2026-04-19/20
#
# Temporarily disabled so the gemma4-26b-a4b-gptq-dense ModelCache can
# complete its GPTQ quantization job on cblevins-5930k (the only remaining
# gfx1100 slot after !151 locked both amd.com/gpu plugin slots on 7900xtx
# for the primary serving pod). Dense quant budget: ~12–24 h per the
# modelcache manifest comment.
#
# The shared-group warm-primary logic in controllers/model_helpers.go
# should have auto-yielded the GPU once the quant pod appeared, but
# nodeHasActivePipelineWork only checks scheduled pods (spec.nodeName set)
# and the quant pod stays Pending until the GPU is free — chicken-and-egg
# (tracked as a follow-up bug to fix in the controller).
#
# Restore steps when dense quant completes:
#   1. Verify status.phase=Ready on modelcache/gemma4-26b-a4b-gptq-dense.
#   2. Revert this file (serverless.enabled: true) and delete the
#      maintenance header. FluxPony cold-starts in ~30s–30m depending on
#      flash-loader cache state.
apiVersion: ai.flexinfer/v1alpha2
kind: Model
metadata:
  name: gonzalomo-fluxpony-imagegen
  namespace: flexinfer-system
spec:
  backend: diffusers
  source: HF://stablediffusionapi/gonzalomoxlfluxpony-v30unitydmd
  cache:
    strategy: Local
    flashLoader:
      enabled: false
  gpu:
    vendor: amd
    count: 1
    shared: 5930k-imagegen
    priority: 100
    vramEstimateMB: 12000
  serverless:
    enabled: false
    minReplicas: 0
    idleTimeout: 5m
    coldStartTimeout: 30m
  config:
    # Gonzalomo FluxPony is an SDXL model despite the FLUX-like name.
    modelFamily: "sdxl"
    cpuOffload: "true"
    # The staged repo publishes fp16-named component weights only
    # (for example `model.fp16.safetensors`), so the runtime must request
    # the fp16 diffusers variant to load the local cache successfully.
    useFp16: "1"
    vaeRepo: "madebyollin/sdxl-vae-fp16-fix"
    vaePath: ".vae/sdxl-vae-fp16-fix"
    # This Unity DMD checkpoint ships with Euler + ~30 steps as its published
    # inference recipe. Generic SDXL DPM++/45-step defaults oversoften the
    # image and can produce a washed-out "negative" look on ROCm.
    guidanceScale: "7.5"
    numInferenceSteps: "30"
    scheduler: "euler"
    negativePrompt: "painting, extra fingers, mutated hands, poorly drawn hands, poorly drawn face, deformed, ugly, blurry, bad anatomy, bad proportions, extra limbs, cloned face, skinny, glitchy, double torso, extra arms, extra hands, mangled fingers, missing lips, ugly face, distorted face, extra legs, anime"
    warmupResolutions: "512x512"
    # warmPolicy: primary — removed for the dense-quant maintenance window;
    # restore alongside serverless.enabled above.
    compilationCache: "true"
    hipVisibleDevices: "0"
  nodeSelector:
    kubernetes.io/hostname: cblevins-5930k
  resources:
    requests:
      cpu: "2"
      memory: 12Gi
    limits:
      cpu: "4"
      memory: 24Gi
  serviceLabels:
    - image-gen
    - text-to-image
    - dall-e-3
    - flux-image-gen
    - fluxpony-image-gen
    - imagegen
  litellm:
    enabled: true
    servedModelName: gonzalomo-fluxpony-imagegen
    aliases:
      - image-gen
      - dall-e-3
      - flux-image-gen
      - text-to-image
      - fluxpony-image-gen
      - gonzalomo-fluxpony
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"

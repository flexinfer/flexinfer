# Gonzalomo FluxPony SDXL text-to-image on cblevins-radeonvii (gfx906).
#
# Relocated 2026-05-13 from cblevins-5930k to cblevins-radeonvii so the
# 5930k 7900 XTX is fully dedicated to the second gemma4-26b-a4b-gptq textgen
# instance. Image generation now lives entirely on the Radeon VII (gfx906)
# alongside sdxl-inpainting-radeonvii on the `radeonvii-imagegen` shared lane.
#
# Radeon VII / gfx906 quirks:
#   - 16 GiB VRAM (vs 24 GiB on 7900 XTX) — SDXL + cpuOffload still fits since
#     this is FluxPony (an SDXL fork, ~12 GiB est) with cpuOffload=true.
#   - The diffusers gfx906 image (registry.harbor.lan/flexinfer/diffusers:rocm-gfx906)
#     is selected automatically by the GPUProfile gfx906 backends.diffusers.image.
#     Memory: gfx906 reports as gfx900 — requires HSA_OVERRIDE_GFX_VERSION=9.0.6
#     at runtime (also handled via GPUProfile env injection).
#   - Disk: this manifest uses cache.strategy=Local so the model lives on the
#     node's local FS. Radeon VII root FS is 127G total. Combined with the
#     sdxl-inpainting Local cache, monitor for disk pressure.
apiVersion: ai.flexinfer/v1alpha2
kind: Model
metadata:
  name: gonzalomo-fluxpony-imagegen
  namespace: flexinfer-system
spec:
  backend: diffusers
  source: HF://stablediffusionapi/gonzalomoxlfluxpony-v30unitydmd
  cache:
    strategy: Local
    flashLoader:
      enabled: false
  gpu:
    vendor: amd
    count: 1
    shared: radeonvii-imagegen
    priority: 200
    vramEstimateMB: 12000
  serverless:
    enabled: true
    minReplicas: 0
    idleTimeout: 30m
    coldStartTimeout: 30m
  config:
    # Gonzalomo FluxPony is an SDXL model despite the FLUX-like name.
    modelFamily: "sdxl"
    cpuOffload: "true"
    # The staged repo publishes fp16-named component weights only
    # (for example `model.fp16.safetensors`), so the runtime must request
    # the fp16 diffusers variant to load the local cache successfully.
    useFp16: "1"
    vaeRepo: "madebyollin/sdxl-vae-fp16-fix"
    vaePath: ".vae/sdxl-vae-fp16-fix"
    # This Unity DMD checkpoint ships with Euler + ~30 steps as its published
    # inference recipe. Generic SDXL DPM++/45-step defaults oversoften the
    # image and can produce a washed-out "negative" look on ROCm.
    guidanceScale: "7.5"
    numInferenceSteps: "30"
    scheduler: "euler"
    negativePrompt: "painting, extra fingers, mutated hands, poorly drawn hands, poorly drawn face, deformed, ugly, blurry, bad anatomy, bad proportions, extra limbs, cloned face, skinny, glitchy, double torso, extra arms, extra hands, mangled fingers, missing lips, ugly face, distorted face, extra legs, anime"
    warmupResolutions: "512x512"
    compilationCache: "true"
    hipVisibleDevices: "0"
  nodeSelector:
    kubernetes.io/hostname: cblevins-radeonvii
  resources:
    requests:
      cpu: "2"
      memory: 12Gi
    limits:
      cpu: "4"
      memory: 24Gi
  serviceLabels:
    - image-gen
    - text-to-image
    - dall-e-3
    - flux-image-gen
    - fluxpony-image-gen
    - imagegen
  litellm:
    enabled: true
    servedModelName: gonzalomo-fluxpony-imagegen
    aliases:
      - image-gen
      - dall-e-3
      - flux-image-gen
      - text-to-image
      - fluxpony-image-gen
      - gonzalomo-fluxpony
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"

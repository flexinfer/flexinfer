apiVersion: ai.flexinfer/v1alpha2
kind: Model
metadata:
  name: gonzalomo-fluxpony-imagegen
  namespace: flexinfer-system
spec:
  backend: diffusers
  source: HF://stablediffusionapi/gonzalomoxlfluxpony-v30unitydmd
  cache:
    strategy: Local
  gpu:
    vendor: amd
    count: 1
    shared: gfx1100-5930k-primary
    priority: 100
    vramEstimateMB: 22000
  serverless:
    enabled: true
    minReplicas: 1
    idleTimeout: 10m
    coldStartTimeout: 30m
  config:
    # Gonzalomo FluxPony is an SDXL model despite the FLUX-like name.
    # Use the canonical diffusers repo directly so the unified runtime loads a
    # verified multi-folder pipeline instead of a brittle single-file export.
    cpuOffload: "true"
    # SDXL on ROCm is visibly noisy in fp16 unless we pair it with the
    # madebyollin fixed VAE.
    useFp16: "1"
    vaeRepo: "madebyollin/sdxl-vae-fp16-fix"
    vaePath: "/models/.vae/sdxl-vae-fp16-fix"
    guidanceScale: "7.0"
    numInferenceSteps: "36"
    scheduler: "dpm++sde-karras"
    negativePrompt: "(worst quality, low quality, normal quality:2), blurry, noisy, grainy, jpeg artifacts, watermark, text, logo, signature, deformed, disfigured, bad anatomy, extra limbs, extra fingers, duplicate, oversaturated"
    warmupResolutions: "512x512"
    warmPolicy: primary
    hipVisibleDevices: "0"
  nodeSelector:
    kubernetes.io/hostname: cblevins-5930k
  resources:
    requests:
      cpu: "2"
      memory: 16Gi
    limits:
      cpu: "4"
      memory: 40Gi
  serviceLabels:
    - image-gen
    - text-to-image
    - dall-e-3
    - flux-image-gen
    - fluxpony-image-gen
    - imagegen
  litellm:
    enabled: true
    servedModelName: gonzalomo-fluxpony-imagegen
    aliases:
      - image-gen
      - dall-e-3
      - flux-image-gen
      - text-to-image
      - fluxpony-image-gen
      - gonzalomo-fluxpony
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"

apiVersion: ai.flexinfer/v1alpha2
kind: Model
metadata:
  name: gonzalomo-fluxpony-imagegen
  namespace: flexinfer-system
spec:
  backend: diffusers
  source: HF://stablediffusionapi/gonzalomoxlfluxpony-v30unitydmd
  cache:
    strategy: Local
  gpu:
    vendor: amd
    count: 1
    shared: gfx1100-5930k-primary
    priority: 100
    vramEstimateMB: 22000
  serverless:
    enabled: true
    minReplicas: 1
    idleTimeout: 10m
    coldStartTimeout: 30m
  config:
    # Gonzalomo FluxPony is an SDXL model despite the FLUX-like name.
    # Use the canonical diffusers repo directly so the unified runtime loads a
    # verified multi-folder pipeline instead of a brittle single-file export.
    modelFamily: "sdxl"
    cpuOffload: "true"
    # SDXL on ROCm is visibly noisy in fp16 unless we pair it with the
    # madebyollin fixed VAE.
    useFp16: "1"
    # Disable the lower-precision ROCm Aiter fused-RoPE backend; the runtime
    # warns that it is lower precision and it has been producing noisier output.
    useRocmAiterRopeBackend: "0"
    vaeRepo: "madebyollin/sdxl-vae-fp16-fix"
    # Resolve from the model cache root so the same manifest works for the
    # unified runtime's node-local layout instead of assuming a global /models/.vae mount.
    vaePath: ".vae/sdxl-vae-fp16-fix"
    # This Unity DMD checkpoint ships with Euler + ~30 steps as its published
    # inference recipe. Generic SDXL DPM++/45-step defaults oversoften the
    # image and can produce a washed-out "negative" look on ROCm.
    guidanceScale: "7.5"
    numInferenceSteps: "30"
    scheduler: "euler"
    negativePrompt: "painting, extra fingers, mutated hands, poorly drawn hands, poorly drawn face, deformed, ugly, blurry, bad anatomy, bad proportions, extra limbs, cloned face, skinny, glitchy, double torso, extra arms, extra hands, mangled fingers, missing lips, ugly face, distorted face, extra legs, anime"
    warmupResolutions: "512x512,1024x1024"
    warmPolicy: primary
    compilationCache: "true"
    hipVisibleDevices: "0"
  nodeSelector:
    kubernetes.io/hostname: cblevins-5930k
  resources:
    requests:
      cpu: "2"
      memory: 16Gi
    limits:
      cpu: "4"
      memory: 40Gi
  serviceLabels:
    - image-gen
    - text-to-image
    - dall-e-3
    - flux-image-gen
    - fluxpony-image-gen
    - imagegen
  litellm:
    enabled: true
    servedModelName: gonzalomo-fluxpony-imagegen
    aliases:
      - image-gen
      - dall-e-3
      - flux-image-gen
      - text-to-image
      - fluxpony-image-gen
      - gonzalomo-fluxpony
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"

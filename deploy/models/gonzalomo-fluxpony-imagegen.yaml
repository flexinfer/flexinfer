apiVersion: ai.flexinfer/v1alpha2
kind: Model
metadata:
  name: gonzalomo-fluxpony-imagegen
  namespace: flexinfer-system
spec:
  backend: diffusers
  source: pvc://gonzalomo-fluxpony-source/gonzalomoXLFluxPony_v30FluxDAIO.safetensors
  cache:
    strategy: Local
  gpu:
    vendor: amd
    count: 1
    vramEstimateMB: 22000
  serverless:
    enabled: true
    minReplicas: 0
    idleTimeout: 10m
    coldStartTimeout: 30m
  config:
    # Gonzalomo FluxPony is packaged as a single-file SDXL checkpoint.
    # Declare the pipeline/config explicitly so the unified runtime doesn't
    # guess from the model name and accidentally take the FLUX loader path.
    cpuOffload: "true"
    useFp16: "1"
    guidanceScale: "3.5"
    numInferenceSteps: "28"
    warmupResolutions: "512x512"
    hipVisibleDevices: "0"
    singleFilePipeline: "sdxl"
    singleFileConfig: "stablediffusionapi/gonzalomoxlfluxpony-v30unitydmd"
    singleFileStrict: "true"
  nodeSelector:
    kubernetes.io/hostname: cblevins-5930k
  resources:
    requests:
      cpu: "2"
      memory: 16Gi
    limits:
      cpu: "4"
      memory: 40Gi
  serviceLabels:
    - image-gen
    - text-to-image
    - dall-e-3
    - flux-image-gen
    - fluxpony-image-gen
    - imagegen
  litellm:
    enabled: true
    servedModelName: gonzalomo-fluxpony-imagegen
    aliases:
      - image-gen
      - dall-e-3
      - flux-image-gen
      - text-to-image
      - fluxpony-image-gen
      - gonzalomo-fluxpony
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"

# Stable Audio Open 1.0 — neural music lane on ROCm gfx1100
#
# Purpose: text-to-music for film scores and ambient beds that the note-based
# chiptune engine can't reach (produced textures, sound design). Serves
# POST /v1/audio/generations (44.1 kHz stereo WAV, b64_json envelope).
# Consumers: filmfest instrumentation="neural" via flexinfer-proxy; anything
# else that wants a prompt-to-audio lane.
#
# Kill-tested 2026-08-22 on the 7900 XTX builder in this exact image family:
# 10 s @ 100 steps = 12.1 s wall — step count dominates wall time, audio
# duration is nearly free, so a 40 s film score costs ~13 s.
#
# 2026-10-30 MOVED to the 7900xtx flex card (placement layout,
# .loom/10-research-voice-stack-and-gpu-placement-2026-10-30.md §6).
# Priority 450 -> 500, the shared creative tier: it outranks the idle tenant
# (the Mills warm lane, 300 ondemand) and ties the image and video lanes.
# The warm-pinned XTX leader that the next paragraph avoided is now an
# ondemand idle tenant BELOW the creative lanes, so they are not statically
# parked. The image is prewarmed on the XTX (deploy/system/values-k3s.yaml).
# The original 2026-08-22 kill-test ran on this card. History:
# Placement: 5930k-textgen (demand-based elections since the 08-21/22
# warm-policy cleanup). Priority 450 sits below the workhorse (500) and the
# video lanes (600): a ~15 s music render queues politely behind film clips
# and Jarvis. NOT on 7900xtx-textgen — that group has a warm-pinned leader
# (orpheus twin), and cold members below a warm leader are statically parked
# (see gte-qwen2-1p5b-radeonvii.yaml / flexinfer#70).
#
#
# 2026-11-01 D1 step 3 (S6c, research next-differentiators-2026-10-31 §6.1;
# WINDOW-GATED, and BLOCKED on the runtime image, see below): served IN-POD by
# the 7900xtx runtime DaemonSet instead of its own Deployment, so a render
# swaps the XTX warm lane out and back inside the runtime pod.
# - dedicatedDeployment dropped; spec.image stays the dedicated rollback image.
# - Compile cache: scope Image on the default hostPath, the directory the
#   runtime pod mounts at /cache/compile.
# BLOCKED: the v032 persona (ef28b7b0 and its master rebuild 7ae8e92f,
# the repin target; same package set) has no torchsde.
# diffusers then swaps CosineDPMSolverMultistepScheduler, the scheduler in
# Stable Audio Open's repo config, for a dummy that raises when
# StableAudioPipeline.from_pretrained loads it. The dedicated image
# (d87f75f8, rocm-gfx1100-audio2) carries torchsde 0.2.6. Checked inside
# the image 2026-11-01. Unblock: a gfx1100-serving-v032 build adding
# torchsde, pinned on the XTX runtime first.
# Rollback: revert this commit (restores dedicatedDeployment and the cache
# config); the Deployment returns on the next reconcile.
apiVersion: ai.flexinfer/v1alpha2
kind: Model
metadata:
  name: stable-audio-open-gfx1100
  namespace: flexinfer-system
  annotations:
    flexinfer.ai/serve-paths: /v1/audio/generations
    flexinfer.ai/purpose: "text-to-music (Stable Audio Open 1.0) for film scores and ambient beds"
spec:
  backend: diffusers
  # audio2: audio1 + bitsandbytes==0.49.2 pin (0.50.1 crash-looped every
  # diffusers import on this torch 2.3 base — see build MR !988).
  # 2026-10-30 (voice-stack audit, .loom/10-research-voice-stack-and-gpu-
  # placement-2026-10-30.md §3): the digest is written into `image:` as well
  # as `imageDigest:`. The Harbor pin guard (gitops
  # harbor-flexinfer-pin-guard) and scripts/check-runtime-pin-drift.py only
  # match `repo@sha256:` references, so with the tag form this digest
  # (tag rocm-gfx1100-audio2, last pulled 2026-08-23) carried no pinned-* tag
  # and was one retention run away from deletion. backend.ApplyImageDigest
  # strips the tag or digest on `image:` and appends imageDigest, so the
  # rendered image is unchanged.
  image: registry.harbor.lan/flexinfer/diffusers@sha256:d87f75f8c69bd3e266b11fbb11ee6528d1134001721a960b6e738f6af7e788ce
  imageDigest: sha256:d87f75f8c69bd3e266b11fbb11ee6528d1134001721a960b6e738f6af7e788ce
  source: HF://stabilityai/stable-audio-open-1.0
  cache:
    strategy: Local
    storageClass: nvme-1r
    size: 12Gi
    flashLoader:
      enabled: false
    compilationCache:
      enabled: true
      # 2026-11-01 D1: image-scoped on the default hostPath, shared with the
      # runtime pod (header).
      scope: Image
      sizeLimit: 4Gi
  gpu:
    vendor: amd
    # cblevins-7900xtx exposes the dGPU and the Raphael iGPU as two
    # device-plugin slots: claim both so the pod can never be handed the iGPU.
    count: 2
    shared: 7900xtx-textgen
    priority: 500
    vramEstimateMB: 7000
  serverless:
    enabled: true
    minReplicas: 0
    idleTimeout: 15m
    coldStartTimeout: 15m
  config:
    pipelineMode: text2audio
    dtype: float16
    hipVisibleDevices: "0"
    skipWarmup: "1"
    numInferenceSteps: "100"
  nodeSelector:
    kubernetes.io/hostname: cblevins-7900xtx
  resources:
    requests:
      cpu: "2"
      memory: 6Gi
    limits:
      cpu: "6"
      memory: 16Gi
  # Advertised (enabled) even though litellm cannot proxy /v1/audio/generations:
  # the proxy refuses to cold-start de-advertised (litellm.enabled=false)
  # models by name — that 404 is the parked-model gate (internal/proxy
  # proxy.go "parked / de-advertised"). Warm-pinned lanes may stay disabled
  # (orpheus); cold on-demand lanes must be advertised. Same convention as
  # the wan21 video lanes, whose routes litellm also cannot proxy.
  litellm:
    enabled: true
    servedModelName: stable-audio-open-gfx1100
    aliases:
      - music-gen
      - text-to-music

# Gemma4 26B-A4B GPTQ INT4 — short-context 5930k canary.
#
# Purpose: safe sandbox for runtime knob experiments on cblevins-5930k without
# changing the stable 16K sister model. This profile is not in shared
# quality-chat routes; activate it deliberately via its canary aliases.
#
# The model source direct-mounts the already-staged 5930k cache PVC to avoid
# duplicating the ~14 GiB artifact into another local-path PVC. It shares the
# same physical GPU group as the stable 16K 5930k lane, so only one of them
# runs at a time.
apiVersion: ai.flexinfer/v1alpha2
kind: Model
metadata:
  name: gemma4-26b-a4b-gptq-5930k-8k-canary
  namespace: flexinfer-system
  annotations:
    flexinfer.ai/promotion-gate: short-context-canary
    flexinfer.ai/promotion-state: experimental
    flexinfer.ai/promotion-validation: pending
    flexinfer.ai/promotion-evidence: .loom/brainstorm-gemma4-5930k-additional-improvements-2026-05-16.md
    flexinfer.ai/promotion-requires: canary-smoke-and-benchmark-before-route-promotion
spec:
  backend: vllm
  image: registry.harbor.lan/flexinfer/runtime@sha256:310988969f3448ccb7b6001d36df0610c40a0354cacbd7e3410cf9d9592dd187
  source: pvc://gemma4-26b-a4b-gptq-5930k-cache/gemma4-26b-a4b-gptq
  cache:
    strategy: None
  gpu:
    vendor: amd
    count: 1
    vramEstimateMB: 14000
    shared: 5930k-textgen
    # Higher than the stable 16K 5930k model so explicit canary activation can
    # take the lane. minReplicas=0 keeps it cold unless deliberately requested.
    priority: 360
  serverless:
    enabled: true
    minReplicas: 0
    idleTimeout: 15m
    coldStartTimeout: 15m
  config:
    quantization: gptq
    dtype: "half"
    maxModelLen: 8192
    maxInputTokens: 6144
    maxOutputTokens: 2048
    gpuMemoryUtilization: "0.96"
    kvCacheDtype: fp8_e4m3
    maxNumSeqs: 1
    trustRemoteCode: true
    attentionBackend: TRITON_ATTN
    servedModelName: gemma4-26b-a4b-gptq-5930k-8k-canary
    enableToolCalling: true
    toolCallParser: gemma4
    reasoningParser: gemma4
    enablePrefixCaching: false
    maxNumBatchedTokens: 160
    enforceEager: true
    disableHybridKVCacheManager: true
    disableAiter: true
    rocmCustomPagedAttn: false
    limitMmPerPrompt: '{"image":0,"audio":0,"video":0}'
    disableLogStats: false
    warmPolicy: ondemand
    hipVisibleDevices: "0"
  nodeSelector:
    kubernetes.io/hostname: cblevins-5930k
  resources:
    requests:
      cpu: "4"
      memory: 16Gi
    limits:
      cpu: "8"
      memory: 24Gi
  # 2026-06-30 GAMING CUTOVER: de-advertised so this priority-360 canary can't
  # cold-start and preempt the gemma primary on the 5930k-textgen card.
  serviceLabels: []
  litellm:
    enabled: false
    servedModelName: gemma4-26b-a4b-gptq-5930k-8k-canary
    aliases:
      - gemma4-26b-5930k-8k
      - gemma4-26b-a4b-5930k-8k
      - gemma4-26b-5930k-short
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"

apiVersion: ai.flexinfer/v1alpha2
kind: Model
metadata:
  name: sdxl-diffusers-gfx1100
  namespace: flexinfer-system
spec:
  backend: diffusers
  source: HF://stabilityai/stable-diffusion-xl-base-1.0
  cache:
    strategy: Local
  gpu:
    vendor: amd
    count: 1
    shared: gfx1100-5930k-primary
    priority: 100
    vramEstimateMB: 22000
  serverless:
    enabled: true
    minReplicas: 1
    idleTimeout: 10m
    coldStartTimeout: 30m
  config:
    modelFamily: "sdxl"
    cpuOffload: "true"
    # SDXL on ROCm is visibly noisy in fp16 unless we pair it with the
    # madebyollin fixed VAE.
    useFp16: "1"
    vaeRepo: "madebyollin/sdxl-vae-fp16-fix"
    # Resolve from the model cache root so the same manifest works for the
    # unified runtime's node-local layout instead of assuming a global /models/.vae mount.
    vaePath: ".vae/sdxl-vae-fp16-fix"
    # Use standard default settings optimized for high fidelity.
    guidanceScale: "7.5"
    numInferenceSteps: "30"
    warmupResolutions: "512x512,1024x1024"
    warmPolicy: primary
    compilationCache: "true"
    hipVisibleDevices: "0"
  nodeSelector:
    kubernetes.io/hostname: cblevins-5930k
  resources:
    requests:
      cpu: "2"
      memory: 16Gi
    limits:
      cpu: "4"
      memory: 40Gi
  serviceLabels:
    - image-gen
    - text-to-image
    - dall-e-3
    - imagegen
  litellm:
    enabled: true
    servedModelName: sdxl-diffusers-gfx1100
    aliases:
      - image-gen
      - dall-e-3
      - text-to-image
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"

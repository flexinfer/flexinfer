# Gemma4 26B-A4B GPTQ INT4 — 5930k instance (sister of gemma4-26b-a4b-gptq).
#
# 7900 XTX instance #2 of the 2-instance 26B serving fleet (added 2026-05-13).
# Mirrors gemma4-26b-a4b-gptq.yaml but pinned to cblevins-5930k. The source
# artifact is pulled from the OCI ref published by the primary modelcache
# (see deploy/modelcaches/gemma4-26b-a4b-gptq-oci-5930k.yaml) so this node
# never runs the 12-24h pipeline.
#
# Shared routes (quality-chat, mid-chat, fast-chat, default chat aliases,
# project-mgmt, gemma4-26b, gemma4-26b-a4b) live in `serviceLabels` so the
# proxy load-balances across both instances. `litellm.aliases` carry only the
# 5930k-specific alias.
#
# Runtime image: matches the 7900xtx instance — digest sha256:310988969f34...
# from MR !379. This is the native vLLM 0.19+ path with the legacy Gemma4 patch
# skipped, while still patching `MoeWNA16` for Gemma4 GELU activation and
# forwarding `activation=layer.activation` into `fused_experts`.
apiVersion: ai.flexinfer/v1alpha2
kind: Model
metadata:
  name: gemma4-26b-a4b-gptq-5930k
  namespace: flexinfer-system
  annotations:
    flexinfer.ai/promotion-gate: quantized-artifact-v1
    flexinfer.ai/promotion-state: baseline-16k-validated-oci-pull
    flexinfer.ai/promotion-validation: passed
    flexinfer.ai/promotion-evidence: docs/dev/gemma4-rocm-status.md#16k-fp8-kv-proof-2026-04-26
    flexinfer.ai/promotion-requires: dense-artifact-or-22k-target-proof-before-next-rung
spec:
  backend: vllm
  # 2026-05-15: live canary on cblevins-5930k reached Ready with 0 restarts.
  # Warm direct endpoint benchmark: 8.08 tok/s average / 8.07 median across
  # five 138-token completions, up from the r3-cap24 baseline of ~4.9 tok/s.
  image: registry.harbor.lan/flexinfer/runtime@sha256:310988969f3448ccb7b6001d36df0610c40a0354cacbd7e3410cf9d9592dd187
  # Source = the 5930k OCI-pull cache PVC. The OCI artifact was pushed via
  # `oras push` from inside the `gptq-w4-g128-attnfp16-clean/` directory on
  # cblevins-7900xtx, so the 42-file artifact landed FLAT under the modelPath
  # (`/data/gemma4-26b-a4b-gptq/<file>`), without a `gptq-w4-g128-attnfp16-clean/`
  # parent. Source therefore points one level shallower than the 7900xtx
  # Model's source (which reads from the original quantization-output PVC
  # where the subdir is preserved). Cache-copy/serving paths derive from
  # this; do not append `gptq-w4-g128-attnfp16-clean` here or the cache-copy
  # job fails with `Missing source path: /src/.../gptq-w4-g128-attnfp16-clean`.
  source: pvc://gemma4-26b-a4b-gptq-oci-5930k/gemma4-26b-a4b-gptq
  cache:
    strategy: SharedPVC
    storageClass: local-path
    hostPath: /var/lib/flexinfer/models
    size: 50Gi
  gpu:
    vendor: amd
    # cblevins-5930k has ONLY the discrete 7900 XTX (no iGPU), so count=1 is
    # sufficient. This differs from cblevins-7900xtx which exposes the
    # Raphael iGPU as a second amd.com/gpu slot and needs count=2.
    count: 1
    vramEstimateMB: 16000
    # New shared group name — image-gen moved off to radeonvii, so this lane
    # is text-gen-only now. Group rename: 5930k-imagegen-textgen -> 5930k-textgen.
    shared: 5930k-textgen
    # Same priority as the 7900xtx instance so neither preempts the other; the
    # proxy serviceLabel routing load-balances between them.
    # 2026-07-01 GAMING CUTOVER: raised 350 -> 385 to outrank the de-advertised
    # qwen36-35b-mtp-uncensored (380) so the 5930k-textgen election hands gemma
    # the card immediately (the 35B held it as the Ready incumbent — de-advertise
    # + minReplicas 0 + warmPolicy ondemand alone did not preempt it). Revert to
    # 350 when handing the 5930k lane back / bringing 7900xtx out of gaming.
    priority: 385
  serverless:
    enabled: true
    # 2026-06-17: RETIRED — replaced on the 5930k GPU by the warm-pinned
    # qwen35-moe-reasoning-5930k reasoning lane (vLLM-currency kill-test full
    # pass). Scaled to 0 (reversible) so it releases the 5930k-textgen GPU; the
    # gemma fleet's shared routes (quality-chat, gpt-4, ...) now serve from the
    # 7900xtx primary alone. Restore by setting minReplicas back to 1 (and idle
    # the reasoning lane) if the second gemma instance is needed again.
    # 2026-06-30 GAMING CUTOVER: promoted to warm primary (7900xtx -> gaming).
    # 2026-07-19 PSYCHE VIDEO LAYOUT: demoted back to 0. cblevins-5930k is the
    # psyche video lane now — wan21-t2v-1p3b-gfx1100 (priority 500, minReplicas 1)
    # is the intended warm primary of 5930k-textgen. Gemma held the card as the
    # warm incumbent despite its lower priority (385) and preempted both wan
    # lanes; it is quiet (0 proxy hits over the observation window) and not part
    # of the psyche layout. minReplicas 0 keeps it servable on-demand via its
    # shared routes off the 7900xtx primary without contending for the 5930k card.
    minReplicas: 0
    idleTimeout: 30m
    # 2026-05-16: raised for the 2/256 concurrency canary. The controller now
    # sizes vLLM's startupProbe from this budget, so the first graph-capture
    # compile gets up to 25m before kubelet can restart the pod. Once the
    # compile cache is warm, subsequent starts should be materially faster.
    coldStartTimeout: 25m
  config:
    quantization: gptq
    dtype: "half"
    maxModelLen: 16384
    gpuMemoryUtilization: "0.98"
    kvCacheDtype: fp8_e4m3
    # 2026-05-16: parity canary with the 7900xtx profile. The previous 2/256
    # attempt hit kubelet's old 5m startup-probe ceiling during V1 graph
    # compilation rather than a runtime/kernel error. Keep maxModelLen at the
    # proven 16K rung; longer context remains a separate canary.
    maxNumSeqs: 2
    trustRemoteCode: true
    attentionBackend: TRITON_ATTN
    # servedModelName MUST be globally unique across Models in the namespace
    # (controller checks aliasOwners[served]). Give this instance its own.
    servedModelName: gemma4-26b-a4b-gptq-5930k
    enableToolCalling: true
    toolCallParser: gemma4
    reasoningParser: gemma4
    enablePrefixCaching: false
    maxNumBatchedTokens: 256
    disableLogStats: false
    enforceEager: false
    disableHybridKVCacheManager: true
    disableAiter: true
    rocmCustomPagedAttn: false
    hipVisibleDevices: "0"
    warmPolicy: primary
    # 2026-05-25 CC-DR-2 follow-up: enable in-process n-gram (prompt-lookup)
    # spec decoding on the 5930k twin.
    #
    # An earlier R5 experiment on 2026-05-14 (see
    # .loom/r5-ngram-spec-decode-falsified-2026-05-14.md) found this exact
    # config delivered −13% to −22% throughput on this twin. That experiment
    # ran on `runtime:rocm-gfx1100-gemma4-moe-cache-nan-v3`, BEFORE graph
    # capture was validated for the gemma4 MoE path. The MoE forward was
    # eager-mode (~4.6 tok/s baseline single-stream), so widening each
    # verifier step from 1 → 1+num_spec positions multiplied a dominant
    # cost.
    #
    # On 2026-05-25 the 7900xtx primary ran the same speculativeConfig
    # against the post-graph-capture image (sha256:31098896...) — measured
    # speedup p50 1.95x, p95 2.17x; vLLM acceptance rate 82.5%. With graph
    # capture the per-forward overhead of widening positions is dominated
    # by amortised graph cost, and SD flips from net-negative to
    # net-positive. Both twins now run that same image, so we expect the
    # same flip here. This deployment is the live re-validation.
    #
    # Difference vs the 7900xtx primary: this twin runs maxNumSeqs=2, so
    # the SD ↔ concurrency interaction is also being measured for the
    # first time. If acceptance drops or decode tps regresses under
    # 2-way concurrency we revert this single key (see post-roll
    # measurement in 60-validation-matrix.md).
    speculativeConfig: '{"method": "ngram", "num_speculative_tokens": 5, "prompt_lookup_max": 4, "prompt_lookup_min": 1}'
  nodeSelector:
    kubernetes.io/hostname: cblevins-5930k
  resources:
    requests:
      cpu: "2"
      memory: 8Gi
    limits:
      cpu: "4"
      memory: 16Gi
  # 2026-06-30 GAMING CUTOVER: PROMOTED to sole gemma primary. cblevins-7900xtx
  # moved to gaming mode, so the shared 26B routes were moved here from the
  # 7900xtx sister (which now has serviceLabels: [] + litellm.enabled=false).
  # Revert this block (drop serviceLabels, litellm.enabled=false, minReplicas 0)
  # and restore them on the 7900xtx sister to hand the fleet back.
  serviceLabels:
    - gemma4-26b
    - quality-chat
    - mid-chat
    - fast-chat
    - fast-text
    - gpt-4
    - gpt-3.5-turbo
    - copilot
    - qwen3-default
    - project-mgmt
  litellm:
    enabled: true
    servedModelName: gemma4-26b-a4b-gptq-5930k
    aliases:
      - gemma4-26b-5930k
      - gemma4-26b-a4b-5930k
      # Stable-id route preserved through the 2026-06-30 gaming cutover. The
      # 7900xtx sister (servedModelName gemma4-26b-a4b-gptq, litellm.enabled=false)
      # used to own this name; consumers that pin the bare id — the Mills
      # operator's FLEXINFER_WEAVER_MODEL / FLEXINFER_JUDGE_MODEL, council
      # reviewers, audit pool — 404'd after the cutover moved the routes here
      # but only carried the -5930k-suffixed aliases. Aliasing the bare id to
      # this primary restores them without waking the gaming-mode 7900xtx GPU.
      - gemma4-26b-a4b-gptq
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"

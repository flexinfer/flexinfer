# Text-only, projected 768-dimensional vectors. Keep the existing BGE/GTE
# aliases: equal dimensions do not make different embedding spaces compatible.
apiVersion: ai.flexinfer/v1alpha2
kind: Model
metadata:
  name: embeddinggemma-2-radeonvii
  namespace: flexinfer-system
  annotations:
    flexinfer.ai/serve-paths: /v1/embeddings
    flexinfer.ai/serving-priority-class: flexinfer-serving-critical
spec:
  backend: llamacpp
  source: HF://ggml-org/embeddinggemma-2-GGUF
  nodeSelector:
    kubernetes.io/hostname: cblevins-radeonvii
  cache:
    strategy: Local
    hostPath: /var/lib/flexinfer/models
    size: 2Gi
  gpu:
    vendor: amd
    count: 1
    shared: radeonvii-models
    priority: 112
    # Full 8K compute buffer is about 2.1 GiB, beyond the small model weights.
    vramEstimateMB: 3000
  config:
    hfRevision: bfcd298762cc34d0357ece5ebdd31791a3a374d8
    ggufFile: embeddinggemma-2-BF16.gguf
    embedding: true
    pooling: mean
    contextSize: 8192
    batchSize: 8192
    ubatchSize: 8192
    parallel: 1
    nGPULayers: 999
    threads: 4
    flashAttention: false
    fitOff: true
    metrics: true
    rocrVisibleDevices: "0"
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      cpu: "4"
      memory: 6Gi
  serverless:
    enabled: true
    minReplicas: 1
    idleTimeout: 30m
    coldStartTimeout: 5m
  litellm:
    enabled: true
    servedModelName: embeddinggemma-2-radeonvii
    aliases:
      - embeddinggemma-2
      - embeddinggemma-2-text
  serviceLabels:
    - embeddinggemma-2
    - embeddinggemma-2-text

# TEMPORARY — Slice 1 kill-test for the ICC meeting-transcription plan.
#
# Spec: .loom/asr-diarization-7900xtx-plan-2026-05-18.md (Riskiest Assumption + Kill-Test section)
#
# Validates the load-bearing claim: vLLM (the gfx1100 GPUProfile pin) actually
# serves openai/whisper-large-v3-turbo via OpenAI-compatible
# /v1/audio/transcriptions on ROCm gfx1100. If true → Slice 3a uses vLLM. If
# false → fall back to whisper.cpp HIP per the plan's fallback path 1.
#
# Priority 400 is set ABOVE gemma4-26b-a4b-gptq's 350 so the controller's
# shared-GPU swap evicts the 26B and lets this pod claim the GPU. K8s
# amd.com/gpu accounting (2 slots, both currently held by the 26B) makes a
# bare kubectl-run kill-test unschedulable; going through the Model CR path
# exercises the production-grade swap machinery.
#
# This is intentionally NOT in serviceLabels / litellm — it must not become
# routable from the proxy during its lifetime. ICC will not get an
# accidentally-real ASR endpoint.
#
# DELETE THIS FILE AS SOON AS EVIDENCE IS CAPTURED. The 26B is unavailable
# while this is active.
apiVersion: ai.flexinfer/v1alpha2
kind: Model
metadata:
  name: whisper-kill-test
  namespace: flexinfer-system
  annotations:
    flexinfer.ai/temporary: "true"
    flexinfer.ai/purpose: "asr-plan-slice-1-kill-test"
    flexinfer.ai/spec: ".loom/asr-diarization-7900xtx-plan-2026-05-18.md"
spec:
  backend: vllm
  # Inherit image from gfx1100 GPUProfile (currently
  # registry.harbor.lan/flexinfer/vllm@sha256:cb6d92c956...). This is the
  # exact image the kill-test claims will-or-won't work for Whisper.
  source: HF://openai/whisper-large-v3-turbo
  cache:
    strategy: SharedPVC
    storageClass: local-path
    hostPath: /var/lib/flexinfer/models
    size: 5Gi
  gpu:
    vendor: amd
    # count=2 mirrors gemma4-26b-a4b-gptq: claim both K8s plugin slots so the
    # iGPU can't co-tenant; hipVisibleDevices=0 pins to the dGPU.
    count: 2
    vramEstimateMB: 4000
    shared: 7900xtx-textgen
    # Above the 26B's 350 so the controller swaps it out for this pod.
    # Drop back to <350 (or delete this Model CR entirely) to return the
    # GPU to the 26B.
    priority: 400
  serverless:
    enabled: true
    # Force scheduling — minReplicas=1 so the controller actually claims
    # the GPU instead of waiting for a request. The whole point is to
    # validate the engine starts; idle-to-zero defeats that.
    minReplicas: 1
    idleTimeout: 5m
    coldStartTimeout: 15m
  config:
    dtype: "half"
    # Whisper-large-v3 has a hard ceiling of 448 tokens for the decoder
    # context. This is NOT model_max_length for chat — it's the upstream
    # Whisper architecture limit.
    maxModelLen: 448
    # Cap VRAM at 30% so the 26B can coexist memory-wise once the swap
    # restores it; for the kill-test alone (during which the 26B is
    # evicted) this is plenty for Whisper's ~1.5 GiB.
    gpuMemoryUtilization: "0.30"
    enforceEager: true
    trustRemoteCode: false
    servedModelName: whisper-large-v3-turbo
    hipVisibleDevices: "0"
    # The flag this kill-test (and Slice 3a / 3b) exists to validate. Lands
    # in --task transcription on the vLLM engine via backend/vllm.go (!423).
    task: transcription
  nodeSelector:
    kubernetes.io/hostname: cblevins-7900xtx
  resources:
    requests:
      cpu: "1"
      memory: 4Gi
    limits:
      cpu: "2"
      memory: 8Gi
  # No serviceLabels — kill-test must not be routable from the proxy.
  # No litellm — same reason.
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"

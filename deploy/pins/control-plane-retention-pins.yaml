# Harbor retention pins for the control-plane digests (not a Kubernetes manifest).
#
# Nothing applies this file: deploy/kustomization.yaml (Flux flexinfer-models)
# and deploy/system/kustomization.yaml (Flux flexinfer-system) do not list
# deploy/pins/. It exists for the gitops CronJob monitoring/harbor-flexinfer-pin-tags,
# which tags every registry.harbor.lan/<project>/<repo>@sha256:<hex> reference on a
# non-comment line under deploy/ and charts/ with pinned-<12hex>
# (platform/gitops docs/runbooks/harbor-flexinfer-pinned-digests.md).
#
# Why: values-k3s.yaml pins the controller and proxy with split repository: /
# digest: keys, which that job does not match, so no control-plane digest had a
# pinned-* tag and the rollback digests could age out of retention
# (latest 30 pushed or pulled in 30 days). The owner chose to protect them before
# the 2026-11-07 02:00Z retention run (window runbook
# .loom/32-iteration-plan-owner-window-2026-11-06.md, Q6, 2026-11-05).
#
# Keep a line here for every control-plane digest that runs or is a named
# rollback target. Retire a pin per the gitops runbook: drop its line here and
# from values-k3s.yaml, merge, then delete the tag once nothing runs it.
pins:

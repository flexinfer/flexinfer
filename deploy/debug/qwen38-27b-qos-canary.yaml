# DEBUG CANARY — KT-QOS2 (re-plan of KT-QOS), feature D3 of
# .loom/10-research-gfx1100-gfx906-next-differentiators-2026-10-31.md (§6.3).
# Matrix row workhorse-qos-prefill-budget-2026-11-05; window procedure and the
# owner's paste in .loom/32-iteration-plan-kt-qos2-2026-11-05.md. KT-QOS itself
# (row workhorse-qos-priority-2026-10-31, result
# .loom/70-result-kt-qos-v033-2026-11-05.md) ran this file on 2026-11-05 and
# failed bar 1 only. NOT in the models kustomization: the operator applies it
# once in a scheduled window, the agent session sequences the arms through
# flexinfer_update_model, then deletes it.
#
# Question (KT-QOS2): with the proxy's interactive seat reserve
# (flexinfer.ai/qos: proxy), does a smaller vLLM per-step prefill budget
# (maxNumBatchedTokens 512 + longPrefillTokenThreshold 256) bring interactive
# TTFT p95 within 1.3x idle on the workhorse's two-seat posture, and what does
# it cost long prompts and background throughput? KT-QOS's residual tail was
# interactive turns that arrived while a background request's one-step ~2K
# prefill was already running on the GPU; the reserve already admits no
# background while an interactive is in flight, so a proxy admission gate was
# dropped (proxy-log evidence in the plan).
#
# This file boots the reserve-only control as written (fcfs,
# maxNumBatchedTokens 4096, no threshold). The budget arm is one MCP
# config patch, which restarts the pod.
#
# This is the production workhorse config (deploy/models/
# qwen38-27b-autoround-workhorse.yaml at 1a88df83) on its source, with its own
# name and served name and the changes below.
#
# vLLM 0.33.0-rocm72, runtime@29378fe0 (owner decision P2; parity with 0.32 on
# the XTX in row xtx-vllm-v033-parity-2026-11-05). `vllmVersion: "0.33.0"`
# goes with the pin (!1281). While this Model exists, the controller roll
# !1289's pre-merge gate (no Model declares vllmVersion) is not empty: apply it
# only after !1289 has merged and soaked, or delete it before that roll.
#
# Placement: the XTX warm lane's slot, as S3 and KT-QOS ran (cblevins-7900xtx,
# both device-plugin slots with hipVisibleDevices 0, shared group
# 7900xtx-textgen, vramEstimateMB 23200 = the whole card, priority 480: above
# the warm lane's 300, below the creative lanes' 500). It is the only KT-QOS2
# Model, so minReplicas is 1; before applying, no other Model on the group may
# sit at priority >= 480 (equal-priority primaries are elected by name). The
# 0.33 image is prewarmed only there; the 5930k workhorse is never preempted.
# The compile cache is S3 arm B's XTX path, warm for the control; the budget
# arm changes the compile range (max_num_batched_tokens) and compiles cold.
#
# flexinfer.ai/qos: proxy gives both arms the seat reserve; the harness runs
# through the proxy in both. The live proxy's seat gate is unchanged from
# KT-QOS's 72628e0e through master (no QoS or forwarding code changed).
#
# Window cost: the warm lane (mills-warm, mills-council, weaver) is off the XTX
# for the window; the 5930k workhorse is untouched. Rollback = delete this
# Model; one proxied xtx-warm request hands the card back to the warm lane.
apiVersion: ai.flexinfer/v1alpha2
kind: Model
metadata:
  name: qwen38-27b-qos-canary
  namespace: flexinfer-system
  annotations:
    flexinfer.ai/base-model-source: Qwen/Qwen3.8-27B
    flexinfer.ai/serving-priority-class: flexinfer-serving-critical
    flexinfer.ai/base-model-posture: clean
    flexinfer.ai/artifact-source: HF://biMEMO/Qwen3.8-27B-int4-AutoRound
    flexinfer.ai/plan: ".loom/32-iteration-plan-kt-qos2-2026-11-05.md"
    flexinfer.ai/promotion-state: debug-canary-kt-qos2
    flexinfer.ai/qos: proxy
spec:
  backend: vllm
  # vLLM 0.33.0-rocm72 (rocm-gfx1100-serving-v033-bebfb52e, pinned-29378fe07274).
  image: registry.harbor.lan/flexinfer/runtime@sha256:29378fe072741a9be5c23333762e37759c027dde5e445e9bc4a1b37bd730cf69
  source: HF://biMEMO/Qwen3.8-27B-int4-AutoRound
  cache:
    strategy: Local
    storageClass: nvme-1r-gpu
    size: 40Gi
    flashLoader:
      enabled: false
    compilationCache:
      enabled: true
      hostPath: /var/lib/flexinfer/compile-cache-qwen38-27b-v033-parity-b-xtx
      sizeLimit: 4Gi
  gpu:
    vendor: amd
    count: 2
    shared: 7900xtx-textgen
    priority: 480
    vramEstimateMB: 23200
  serverless:
    enabled: true
    # The only KT-QOS2 Model: it boots once applied (after the pre-check).
    minReplicas: 1
    idleTimeout: 30m
    coldStartTimeout: 25m
  config:
    # Required with a 0.32+ image pin (!1281).
    vllmVersion: "0.33.0"
    env:
      FLEXINFER_QWEN35_MTP_HEAD: checkpoint
    kernelConfig: '{"enable_rocm_segmented_attn_autotune":true}'
    hfRevision: 2d7425f78ee0abd518aceabf385997fbb54c9342
    attentionBackend: ROCM_SEGMENTED_ATTN
    warmPolicy: primary
    dedicatedDeployment: true
    quantization: gptq
    hfOverrides: '{"architectures":["Qwen3_5ForConditionalGeneration"],"quantization_config":{"quant_method":"gptq","bits":4,"group_size":128,"sym":true,"desc_act":false,"lm_head":false,"modules_in_block_to_quantize":["self_attn.q_proj","self_attn.k_proj","self_attn.v_proj","self_attn.o_proj","mlp.gate_proj","mlp.up_proj","mlp.down_proj","linear_attn.in_proj_qkv","linear_attn.in_proj_z","linear_attn.out_proj"]}}'
    dtype: half
    languageModelOnly: true
    maxModelLen: 32768
    maxNumSeqs: 2
    maxNumBatchedTokens: 4096
    enableChunkedPrefill: true
    schedulerReserveFullISL: false
    gpuMemoryUtilization: "0.96"
    kvCacheDtype: auto
    enforceEager: false
    enablePrefixCaching: true
    mambaCacheMode: "align"
    mambaSsmCacheDtype: "bfloat16"
    enablePromptTokensDetails: true
    speculativeConfig: '{"method":"mtp","num_speculative_tokens":2,"attention_backend":"ROCM_SEGMENTED_ATTN"}'
    disableAiter: true
    rocmCustomPagedAttn: false
    hipVisibleDevices: "0"
    trustRemoteCode: true
    defaultChatTemplateKwargs:
      enable_thinking: false
    enableToolCalling: true
    toolCallParser: qwen3_coder
    reasoningParser: qwen3
    servedModelName: qwen38-27b-qos-canary
    # /metrics must carry the spec-decode, generation-token and preemption
    # counters the harness reads.
    disableLogStats: false
    failOnEnvironValidation: false
  nodeSelector:
    kubernetes.io/hostname: cblevins-7900xtx
  resources:
    requests:
      cpu: "4"
      memory: 16Gi
      ephemeral-storage: 2Gi
    limits:
      cpu: "8"
      memory: 40Gi
  # Hidden from discovery; the direct arms talk to the pod over localhost.
  litellm:
    enabled: false
    servedModelName: qwen38-27b-qos-canary
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

apiVersion: v1
kind: Pod
metadata:
  name: mtp-surgery4
  namespace: flexinfer-system
  labels:
    app: mtp-quant-surgery
spec:
  restartPolicy: Never
  nodeSelector:
    kubernetes.io/hostname: cblevins-radeonvii
  tolerations:
  - key: node.flexstack.io/gpu-shared
    operator: Exists
  imagePullSecrets:
  - name: harbor-creds
  containers:
  - name: surgery
    image: registry.harbor.lan/flexinfer/quantizer:gptq-rocm-gfx906-v10
    command: ["sleep", "infinity"]
    resources:
      requests:
        cpu: "1"
        memory: 6Gi
      limits:
        cpu: "4"
        memory: 14Gi
    volumeMounts:
    - name: models
      mountPath: /nfs
  volumes:
  - name: models
    persistentVolumeClaim:
      claimName: llm-models-nfs

# Staged long-context canary for the GDN-preserving Qwen3.5-35B-A3B artifact.
#
# Do not add this file to deploy/debug/kustomization.yaml. It is safe to apply
# while ModelCache/qwen35-35b-a3b-clean-gptq is still running: artifactGate
# blocks candidate creation until strict validation and immutable OCI publish
# evidence exist. The bounded first run mounts the validated PVC path; pin the
# published OCI digest before promotion:
#
#   kubectl apply -f deploy/debug/qwen35-35b-clean-gptq-canary.yaml
#
# The experiment temporarily preempts the warm 5930k workhorse, runs the
# project gauntlet, and then restores that workhorse automatically. The gaming
# lease on cblevins-7900xtx remains untouched. Start at 64K; promote this same
# manifest to 96K and 128K only after direct needle tests pass at each rung.
apiVersion: ai.flexinfer/v1alpha2
kind: ModelExperiment
metadata:
  name: qwen35-35b-clean-gptq-64k-graph
  namespace: flexinfer-system
  annotations:
    flexinfer.ai/canary: qwen35-clean-workhorse
    flexinfer.ai/runtime: vllm-0.23-rocm-gfx1100-native-w4a16
    flexinfer.ai/artifact-policy: qwen35-35b-a3b-gdn-fp
    flexinfer.ai/kill-test: .loom/10-research.md#update-2026-07-11-long-context-council-workhorse-on-dual-rx-7900-xtx-nodes
spec:
  timeout: 90m
  artifactGate:
    modelCacheRef: qwen35-35b-a3b-clean-gptq
    requireValidation: true
    requirePublishedDigest: true
    requireSourceMatch: true
  candidate:
    backend: vllm
    image: docker.io/vllm/vllm-openai-rocm@sha256:3813e31cc3ab56f71ba83a72da77a84f3c75030e54c9c316951a99317b818ce4
    source: pvc://llm-models-nfs/qwen35-35b-a3b-clean/gptq-w4-g128-gdn
    cache:
      # The first run mounts the validated shared artifact directly. Replace
      # candidate.source with the published OCI digest before promotion; this
      # RWX path is not immutable.
      strategy: None
      compilationCache:
        enabled: true
        hostPath: /var/lib/flexinfer/compile-cache
        sizeLimit: 4Gi
    gpu:
      vendor: amd
      count: 1
      shared: 5930k-textgen
      priority: 425
      forcePromotion: true
      # Stay below the controller's hard 95% admission ceiling (23,347 MiB on
      # a 24 GiB card); runtime allocation remains bounded separately by
      # gpuMemoryUtilization and the 64K gauntlet.
      vramEstimateMB: 23200
    serverless:
      enabled: true
      minReplicas: 1
      idleTimeout: 30m
      coldStartTimeout: 60m
    config:
      # Force the pinned per-model runtime instead of the older persistent
      # gfx1100 runtime bundled on the node.
      dedicatedDeployment: true
      quantization: gptq
      dtype: half
      languageModelOnly: true
      maxModelLen: 65536
      maxNumSeqs: 1
      maxNumBatchedTokens: 4096
      enableChunkedPrefill: true
      # Admit a long request only when its full input can remain resident. This
      # turns insufficient 64K KV capacity into a canary failure instead of
      # repeated preemption and cache thrashing.
      schedulerReserveFullISL: true
      # Keep physical headroom for transient Triton/FLA GDN prefill workspace.
      gpuMemoryUtilization: "0.90"
      kvCacheDtype: fp8_e4m3
      # vLLM 0.23 disables dynamic KV-scale calculation for hybrid GDN/Mamba
      # models because an uninitialized recurrent state corrupts calibration.
      # Keep this explicit and make FP8-vs-BF16 attention quality an A/B gate.
      calculateKvScales: false
      # Required outcome: torch.compile + piecewise graphs, never eager mode.
      enforceEager: false
      # ROCm always resolves Qwen's GDN prefill to Triton/FLA in vLLM 0.23;
      # pin it so the active kernel is visible and reproducible.
      gdnPrefillBackend: triton
      # The bounded canary samples every block and reports actual HIP-graph
      # dispatch. Reduce kvCacheMetricsSample to 0.01 before warm promotion.
      cudagraphMetrics: true
      kvCacheMetrics: true
      kvCacheMetricsSample: "1.0"
      enablePrefixCaching: false
      # AITER has no gfx1100 build in this image. Use native Triton/FLA GDN
      # prefill and ROCm attention instead of falling into unsupported kernels.
      disableAiter: true
      rocmCustomPagedAttn: false
      trustRemoteCode: true
      enableToolCalling: true
      toolCallParser: qwen3_coder
      servedModelName: qwen35-35b-clean-gptq-64k-graph
      disableLogStats: false
      failOnEnvironValidation: true
    nodeSelector:
      kubernetes.io/hostname: cblevins-5930k
    resources:
      requests:
        cpu: "4"
        memory: 16Gi
      limits:
        cpu: "8"
        memory: 48Gi
    tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
        operator: Exists
  gauntlet:
    templateRef: model-eval-gauntlet
    env:
      # Generation fence for the first run against the validated immutable
      # artifact. Updating this value restarts a terminal experiment without
      # mutating or rebuilding the underlying ModelCache.
      FLEXINFER_EXPERIMENT_REVISION: "artifact-ed9cd20f-vram23200"
      WARMUP: "1"
      ITERS: "2"
      MIN_DURATION: 15s
      BATCH_SIZE: "32"
      COLD_START_TIMEOUT: 60m
      GAUNTLET_API: chat
      GAUNTLET_MIN_TPS: "5"
      GAUNTLET_MAX_TTFT: 30s
      GAUNTLET_MIN_TOKENS: "8"
      GAUNTLET_PROMPT: "Use a tool-call-ready concise answer: explain why preserving Gated DeltaNet layers matters when quantizing a long-context hybrid model."
      GAUNTLET_EXPECT: "Gated,DeltaNet,quant"
      GAUNTLET_EXPECT_MODE: any

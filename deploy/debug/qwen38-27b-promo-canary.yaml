# DEBUG CANARY: the gfx1100 workhorse promotion (qwen38-27b-autoround-workhorse,
# cblevins-5930k, priority 900) at its exact posture on the XTX, cashing in the
# 2026-11-05 canaries: S3 (vLLM 0.33 parity, row xtx-vllm-v033-parity-2026-11-05),
# KT-SO (row gfx1100-structured-outputs-2026-11-01) and S7 (embed table in
# mapped host memory, row xtx-s7-embed-host-2026-11-05). G3 (fp8 segmented KV)
# is not in it: its arm 2 decoded 0.74x at 16K, under its 0.90x kill line.
# Matrix row xtx-workhorse-v033-promotion-2026-11-05 holds the pass, kill and
# envelope rules, written and merged before any data. NOT in any
# kustomization: the operator applies this file once, the agent drives the
# arms over the flexinfer MCP tools and reads results with `kubectl exec`,
# then deletes both Models.
#
# APPLY ONLY AFTER A1 (!1289, controller with !1281) IS MERGED AND LIVE: arm B
# declares vllmVersion, which A1's pre-check forbids, and only a !1281
# controller renders 0.33 without the dead VLLM_* env and --mamba-cache-mode.
#
# Two Models on the XTX warm lane's slot (cblevins-7900xtx, 7900xtx-textgen,
# count 2 / hipVisibleDevices 0, vramEstimateMB 23200):
#   arm A   qwen38-27b-v033-parity-a, priority 480, minReplicas 1: TODAY's
#           workhorse exactly (runtime@b06b06fe, 0.32, plugin 0.9.0, no
#           vllmVersion). The same-window decode, TTFT and pool baseline.
#   arm B   qwen38-27b-v033-parity-b, priority 470, minReplicas 0, raised to 1
#           once arm A is deleted: the promotion image with
#           vllmVersion "0.33.0" and spec.capabilities.structuredOutput.
#     B0    as applied: 0.33, no S7 flag.
#     B1    flexinfer_update_model config {"env":{"FLEXINFER_EMBED_HOST":"1"}}:
#           the promotion candidate. Then phase S (KT-SO re-run) and the
#           30-min soak on B1, and phase L only if the row's envelope rule
#           calls for it.
# The names are S3's on purpose: their Local caches (18 GB each, the same
# artifact at 2d7425f7 with the same download options) are still staged on
# this node, so nothing new is staged on a root with 129 GB free (kubelet
# evicts near 94 GB). Compile caches: S3 arm A's path for 0.32 and S3 arm B's
# path for 0.33 (warm at this posture; KT-SO, KT-QOS and KT-QOS2 used it).
#
# Window cost: the warm lane (mills-warm, mills-council, weaver, the 32K
# overflow route) is off the card for ~2.5 h; the 5930k workhorse is
# untouched. Rollback = delete both Models; the warm lane returns on its next
# request.

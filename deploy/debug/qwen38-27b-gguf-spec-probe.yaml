# Qwen3.8-27B GGUF speculative-decoding probe — gfx1100 llama.cpp b11847.
# One-shot Model on the 5930k, deleted when measured.
#
# Research: .loom/10-research-gfx1100-next-feature-2026-10-23.md §4 row 3 /
# §6 S5: `--spec-type draft-mtp` on a Qwen3.8-27B GGUF that keeps its MTP head
# (bartowski Q4_K_M: `blk.64.nextn.*`, `qwen35.nextn_predict_layers=1`, header
# parsed 2026-10-24). It is a vLLM-independent MTP datapoint and the fallback
# if S2's INT4-MTP acceptance stays low.
#
# draft-mtp at b11847 drives the NextN head inside this GGUF (no
# --model-draft) at llama.cpp's default draft window: --spec-draft-n-max 3,
# n-min 0. The single qwen35 head is reused for each of the 3 draft steps;
# only multi-head models clamp the window to their head count. b11847
# removed --draft-max/--draft-min (the server aborts on them), so the
# controller rejects draftMax/draftMin with this spec type.
#
# Admission (controller 113eb124 or newer, !1133/!1135): specType draft-mtp
# needs dedicatedDeployment true, this exact digest, and the gfx1100
# GPUProfile triple flexinfer.ai/backend-certificate-llamacpp-draft-mtp
# {,-since,-evidence} bound to it (provisional MR !1136). Without the triple
# the Model goes Schedulable=False BackendUnsupported and the card is not
# taken.
#
# Window (one operator step; everything else via the loom flexinfer MCP):
#   1. Merge !1136 and reconcile ks flux-system/flexinfer-models, so the
#      GPUProfile carries the triple.
#   2. Operator: kubectl apply -f deploy/debug/qwen38-27b-gguf-spec-probe.yaml.
#      forcePromotion at 510 preempts the 5930k-textgen group (the
#      workhorse); the Local cache is still staged on the node, so the pod is
#      Ready in about a minute.
#   3. draft-mtp arm: port-forward svc/qwen38-27b-gguf-spec-probe 18081:8080,
#      then run scripts/verify-llamacpp-canary.py --skip-tools --decode-runs 3
#      (draft_n / draft_n_accepted / draft_acceptance) plus a greedy-output
#      parity pass.
#   4. Baseline arm on the same pod path: flexinfer_update_model
#      config='{"specType":null}' (merge patch; null deletes), then the same
#      two passes.
#   5. flexinfer_delete_model, then record the result in matrix row
#      gfx1100-llamacpp-b11847-2026-10-24. Keep the !1136 triple with that
#      row as its evidence, or remove it.
# Thinking is off (reasoningBudget 0) so the coherence probes answer inside
# their token budget; decode tok/s is unaffected. Never routed: no
# serviceLabels, one unique alias.
#
# MEASURED 2026-10-24 12:27–13:14Z (matrix row gfx1100-llamacpp-b11847-2026-10-24):
#   ROCm baseline   coherence 4/4; decode 27.5–32.7 tok/s (median 27.8 gauntlet,
#                   31.8 pp-probe); PP 808 tok/s on a 7,066-token prompt. Ran as
#                   a dedicated Deployment on this digest.
#   draft-mtp       BLOCKED on controller 65d99ead (certified llama.cpp surface
#                   knew only ngram-simple 16/1); unblocked in code by !1133,
#                   not yet measured.
#   Vulkan/RADV     coherence 4/4 but 11.5 tok/s decode and 154 tok/s PP
#                   (2.7× / 5.2× slower than ROCm on the same card and file;
#                   sclk 1433 vs 2138 MHz) — rejected. Its one-shot Model
#                   (qwen38-27b-gguf-vulkan-probe, image b6c48846) left this
#                   file after the measurement; it is in git history at
#                   15775d92a, and build/Dockerfile.llamacpp-vulkan-gfx1100 stays
#                   as the record.
# Caches (17.44 GB each) remain under
# /var/lib/flexinfer/models/flexinfer-system/qwen38-27b-gguf-*-probe/ on the
# 5930k until the operator reclaims them.
apiVersion: ai.flexinfer/v1alpha2
kind: Model
metadata:
  name: qwen38-27b-gguf-spec-probe
  namespace: flexinfer-system
  annotations:
    flexinfer.ai/base-model-source: Qwen/Qwen3.8-27B
    flexinfer.ai/base-model-posture: clean
    flexinfer.ai/artifact-source: HF://bartowski/Qwen3.8-27B-GGUF (Qwen3.8-27B-Q4_K_M.gguf)
    flexinfer.ai/purpose: "Probe — draft-mtp then no-speculation baseline on llama.cpp b11847 gfx1100; never routed, delete after the window"
    flexinfer.ai/plan: ".loom/10-research-gfx1100-next-feature-2026-10-23.md"
    flexinfer.ai/promotion-state: probe-only
spec:
  backend: llamacpp
  # = library/llamacpp:rocm-gfx1100-b11847 (pinned-95c1d3901fab), the S5 image
  # and the digest the draft-mtp certificate binds.
  image: registry.harbor.lan/library/llamacpp@sha256:95c1d3901faba5fbbfa9ac173c4b40c479bcc604f1a41f873a975ce0cee0f2a1
  source: HF://bartowski/Qwen3.8-27B-GGUF
  cache:
    strategy: Local
    storageClass: nvme-1r-gpu
    # Single 17.44 GB GGUF + headroom.
    size: 24Gi
    flashLoader:
      enabled: false
  gpu:
    vendor: amd
    count: 1
    shared: 5930k-textgen
    # Window posture: force-promoted over the workhorse for the window.
    priority: 510
    forcePromotion: true
    vramEstimateMB: 21000
  serverless:
    enabled: true
    minReplicas: 1
    idleTimeout: 15m
    coldStartTimeout: 25m
  config:
    warmPolicy: ondemand
    # Certified llama.cpp opt-ins run on the model-specific image, never the
    # persistent runtime.
    dedicatedDeployment: true
    specType: draft-mtp
    ggufFile: Qwen3.8-27B-Q4_K_M.gguf
    # 16K is enough for the decode probes; the hybrid 3:1 GDN layout keeps
    # the f16 KV of the 16 full-attention layers near 1 GB at this size.
    contextSize: 16384
    nGPULayers: 999
    batchSize: 2048
    ubatchSize: 512
    parallel: 1
    threads: 12
    flashAttention: true
    jinja: true
    reasoningFormat: auto
    reasoningBudget: 0
    metrics: true
  nodeSelector:
    kubernetes.io/hostname: cblevins-5930k
  resources:
    requests:
      cpu: "4"
      memory: 12Gi
    limits:
      cpu: "8"
      memory: 28Gi
  serviceLabels: []
  litellm:
    enabled: true
    servedModelName: qwen38-27b-gguf-spec-probe
    aliases:
      - qwen38-27b-gguf-spec-probe
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

# Slice-1 kill-test canary: CLEAN Qwen3.6-27B INT4 AutoRound on gfx1100.
#
# Research: .loom/10-research-gfx1100-model-quality-2026-08-15.md
# Riskiest assumption under test: Intel/Qwen3.6-27B-int4-AutoRound
# (quant_method=auto-round, packing_format=auto_round:auto_gptq, sym=true,
# g128, GDN in_proj_a/b + norms + gates kept FP16) loads and serves
# COHERENTLY on the pinned vLLM 0.23 gfx1100 runtime — the same runtime that
# qualified the Fable Fusion 27B GPTQ on 2026-07-21.
#
# Differences from the fable lane, on purpose:
#   - NO hfOverrides: Intel's artifact keeps the stock multimodal wrapper
#     (Qwen3_5ForConditionalGeneration, weights under model.language_model.*),
#     so we serve the stock class with --language-model-only instead of
#     forcing the text class (fable's artifact had a text-only layout).
#   - NO config.quantization: vLLM auto-detects auto-round from
#     quantization_config (Intel's own reference serve command does the same);
#     with auto_gptq packing it should route to the GPTQ-kernel path. If
#     detection routes to a slow/unsupported kernel, retry with
#     quantization: gptq before falling back to the FOEM GPTQ artifact.
#
# Pass = deterministic greedy coherence + 5-prompt quality smoke (fable
# gauntlet). Then slice 2 (graph mode + MTP) and slice 3 (context ladder).
# Perf is NOT judged in this slice (eager posture, 8K envelope).
apiVersion: ai.flexinfer/v1alpha2
kind: Model
metadata:
  name: qwen36-27b-clean-autoround-canary
  namespace: flexinfer-system
  annotations:
    flexinfer.ai/base-model-source: Qwen/Qwen3.6-27B
    flexinfer.ai/base-model-posture: clean
    flexinfer.ai/artifact-source: HF://Intel/Qwen3.6-27B-int4-AutoRound
    flexinfer.ai/purpose: "Slice-1 kill-test — Qwen3.6-27B dense AutoRound INT4 coherence on gfx1100 (workhorse quality uplift)"
    flexinfer.ai/plan: ".loom/10-research-gfx1100-model-quality-2026-08-15.md"
    flexinfer.ai/promotion-state: slice1-coherence-gauntlet-passed
    flexinfer.ai/promotion-evidence: "2026-08-16 6/6 greedy gauntlet PASS (exact Paris, fib code, JSON, 14-apples); RDNA3W4A16LinearKernel active; weights load 43.7s no skips; KV 46,811 tok @8K fp16; eager single-stream 8.3 tok/s (= fable eager floor; graph mode is slice 2)"
spec:
  backend: vllm
  # Pinned vLLM 0.23 gfx1100 runtime with the native RDNA3 W4A16 HIP operator —
  # the exact digest the fable 27B GPTQ qualification passed against.
  image: registry.harbor.lan/flexinfer/runtime@sha256:2e9652edee30ed078843935ce5672280efd3585de0527d27703dd6880592981d
  source: HF://Intel/Qwen3.6-27B-int4-AutoRound
  cache:
    # 19.0 GB artifact (10 safetensors shards + mtp extra tensors); 40Gi buys
    # download scratch headroom. nvme-1r-gpu binds on cblevins-5930k (proven by
    # the wan21 lanes).
    strategy: Local
    storageClass: nvme-1r-gpu
    size: 40Gi
    # 18 GB of shards cannot stage into this 63Gi node's tmpfs budget
    # (flash-loader pre-flight: 7.7 GB available). Serve from the PVC directly,
    # same as the wan21 lanes on this host.
    flashLoader:
      enabled: false
  gpu:
    vendor: amd
    count: 1
    shared: 5930k-textgen
    # Match the WAN primary (fable precedent): explicit canary demand may
    # borrow an idle card without preempting active video traffic; the
    # higher-priority VACE lane stays authoritative.
    priority: 500
    vramEstimateMB: 22000
  serverless:
    enabled: true
    # NOTE for future qualification windows: an on-demand start of this lane is
    # preempted mid-load by the warm primary (cold load ~4-6 min > 2-min demand
    # window; minReplicas=1 alone does not win the election back). Use
    # minReplicas=1 + gpu.forcePromotion=true for the window, then revert.
    minReplicas: 0
    # Long enough to run the qualification gauntlet between probes without
    # self-reaping (fable's 1m lesson), short enough to hand the card back.
    idleTimeout: 15m
    # First activation must cover the 19 GB HF prefetch + cold vLLM load.
    coldStartTimeout: 25m
  config:
    warmPolicy: ondemand
    # vLLM 0.23 resolves quant_method "auto-round" to "inc" (Intel Neural
    # Compressor) BEFORE honoring --quantization, and ROCm rejects inc
    # outright. The checkpoint's auto_round:auto_gptq packing is GPTQ-shaped
    # (qweight/qzeros/scales, sym=true, g128), so rewrite quantization_config
    # to plain GPTQ form via hf-overrides (applied before quant resolution).
    # modules_in_block_to_quantize = exact INT4 module census from the
    # safetensors index; in_proj_a/b, conv1d, norms, and lm_head are FP16 in
    # the checkpoint (gemma4 partial-quant pattern).
    quantization: gptq
    hfOverrides: '{"quantization_config":{"quant_method":"gptq","bits":4,"group_size":128,"sym":true,"desc_act":false,"lm_head":false,"modules_in_block_to_quantize":["self_attn.q_proj","self_attn.k_proj","self_attn.v_proj","self_attn.o_proj","mlp.gate_proj","mlp.up_proj","mlp.down_proj","linear_attn.in_proj_qkv","linear_attn.in_proj_z","linear_attn.out_proj"]}}'
    dtype: half
    languageModelOnly: true
    # Conservative qualification envelope, mirroring the fable smoke posture.
    # Native context is 262144; slice 3 raises this after coherence passes.
    maxModelLen: 8192
    maxInputTokens: 6144
    maxOutputTokens: 2048
    maxNumSeqs: 1
    maxNumBatchedTokens: 2048
    enableChunkedPrefill: true
    gpuMemoryUtilization: "0.90"
    kvCacheDtype: auto
    calculateKvScales: false
    enforceEager: true
    enablePrefixCaching: false
    disableAiter: true
    rocmCustomPagedAttn: false
    hipVisibleDevices: "0"
    trustRemoteCode: true
    enableToolCalling: true
    toolCallParser: qwen3_coder
    servedModelName: qwen36-27b-clean-autoround-canary
    disableLogStats: false
    # Immutable ROCm base image carries env vars outside vLLM's registry.
    failOnEnvironValidation: false
  nodeSelector:
    kubernetes.io/hostname: cblevins-5930k
  resources:
    requests:
      cpu: "4"
      memory: 16Gi
    limits:
      cpu: "8"
      memory: 40Gi
  # Demand-only lane (fable pattern): NO service labels, litellm ENABLED with
  # only the unique name — nothing routes here unless the canary is named
  # explicitly, but explicit demand can cold-start it. litellm.enabled=false
  # would park the lane entirely (never cold-started by name — whisper lesson).
  serviceLabels: []
  litellm:
    enabled: true
    servedModelName: qwen36-27b-clean-autoround-canary
    aliases:
      - qwen36-27b-clean-autoround-canary
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

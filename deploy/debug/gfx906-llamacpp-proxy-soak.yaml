# gfx906 llama.cpp proxy-backed soak.
#
# Purpose: run the post-runtime-promotion gate for the Radeon VII llama.cpp
# lane. Unlike deploy/debug/gfx906-llamacpp-soak.yaml, this goes through the
# FlexInfer proxy/controller/runtime path and persists the traffic summary to a
# PVC so completed-container log loss cannot erase the verdict.
#
# Preconditions:
#   1. publish_runtime_rocm_gfx906 has produced a runtime image that includes
#      /opt/flexinfer/lib/libflexinfer_hipmeminfo_shim.so.
#   2. That digest has been promoted into deploy/gpuprofiles/gfx906.yaml and
#      deploy/system/values-k3s.yaml, then reconciled.
#   3. deploy/debug/gfx906-llamacpp-proxy-soak-target.yaml has been applied so
#      qwen3-8b-radeonvii-soak can temporarily force-promote over the warm
#      qwen3-1p7b-tools-radeonvii fallback.
#
# Usage:
#   kubectl apply -f deploy/debug/gfx906-llamacpp-proxy-soak-target.yaml
#   kubectl apply -f deploy/debug/gfx906-llamacpp-proxy-soak.yaml
#   kubectl -n flexinfer-system logs -f job/gfx906-llamacpp-proxy-soak-traffic
#   kubectl -n flexinfer-system get model qwen3-8b-radeonvii-soak sdxl-inpainting-radeonvii qwen3-1p7b-tools-radeonvii
#
# Preflight:
#   Before the 24h gate, run the same manifest with SOAK_DURATION_SECONDS set
#   to 900 in the Job env and verify:
#     - qwen3-8b-radeonvii-soak reaches Active/Ready
#     - qwen3-1p7b-tools-radeonvii is intentionally preempted
#     - deleting qwen3-8b-radeonvii-soak restores qwen3-1p7b-tools-radeonvii
#   The traffic script also performs a bounded HTTP preflight before the 24h
#   loop. It exits 23 when the target cannot serve a request within the
#   preflight budget, preserving the failure records on the evidence PVC.
#
# Harvest after completion:
#   kubectl -n flexinfer-system get job gfx906-llamacpp-proxy-soak-traffic -o yaml
#   kubectl -n flexinfer-system get pods -o wide | rg 'qwen3-8b-radeonvii-soak|sdxl-inpainting-radeonvii|flexinfer-runtime-gfx906'
#   kubectl -n flexinfer-system get events --sort-by=.lastTimestamp
#   Mount PVC gfx906-llamacpp-proxy-soak-evidence in a reader pod and copy:
#     /evidence/proxy-soak.jsonl
#     /evidence/proxy-soak-summary.json
#
# Rollback:
#   kubectl -n flexinfer-system delete job/gfx906-llamacpp-proxy-soak-traffic --ignore-not-found
#   kubectl -n flexinfer-system delete configmap/gfx906-llamacpp-proxy-soak-traffic --ignore-not-found
#   kubectl -n flexinfer-system delete pvc/gfx906-llamacpp-proxy-soak-evidence --ignore-not-found
#   kubectl -n flexinfer-system delete model/qwen3-8b-radeonvii-soak --ignore-not-found
#
# Reference: .loom/ralph-gfx906-runtime-hipmem-shim-2026-05-22.md
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gfx906-llamacpp-proxy-soak-evidence
  namespace: flexinfer-system
  labels:
    app.kubernetes.io/part-of: flexinfer
    flexinfer.ai/purpose: proxy-soak
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gfx906-llamacpp-proxy-soak-traffic
  namespace: flexinfer-system
  labels:
    app.kubernetes.io/part-of: flexinfer
    flexinfer.ai/purpose: proxy-soak
data:
  proxy-soak.py: |
    import json
    import os
    import sys
    import time
    import urllib.request

    endpoint = os.environ.get(
        "SOAK_ENDPOINT",
        "http://flexinfer-proxy.flexinfer-system.svc.cluster.local/model/qwen3-8b-radeonvii-soak/v1/chat/completions",
    )
    model = os.environ.get("SOAK_MODEL", "qwen3-8b-radeonvii-soak")
    duration_seconds = int(os.environ.get("SOAK_DURATION_SECONDS", "86400"))
    interval_seconds = int(os.environ.get("SOAK_INTERVAL_SECONDS", "60"))
    timeout_seconds = int(os.environ.get("SOAK_REQUEST_TIMEOUT_SECONDS", "900"))
    warmup_requests = int(os.environ.get("SOAK_WARMUP_REQUESTS", "1"))
    max_tokens = int(os.environ.get("SOAK_MAX_TOKENS", "64"))
    latency_budget_ms_per_token = float(os.environ.get("SOAK_P95_MS_PER_TOKEN_BUDGET", "300"))
    evidence_dir = os.environ.get("SOAK_EVIDENCE_DIR", "/evidence")
    preflight_attempts = int(os.environ.get("SOAK_PREFLIGHT_ATTEMPTS", "10"))
    preflight_interval_seconds = int(os.environ.get("SOAK_PREFLIGHT_INTERVAL_SECONDS", "30"))
    preflight_timeout_seconds = int(os.environ.get("SOAK_PREFLIGHT_REQUEST_TIMEOUT_SECONDS", "120"))
    expected_model = os.environ.get("SOAK_EXPECT_MODEL", model)
    preflight_require_model_match = os.environ.get(
        "SOAK_PREFLIGHT_REQUIRE_MODEL_MATCH", "false"
    ).lower() in ("1", "true", "yes")
    diag_endpoint = os.environ.get("SOAK_DIAG_ENDPOINT", "").strip()
    diag_timeout_seconds = float(os.environ.get("SOAK_DIAG_TIMEOUT_SECONDS", "5"))
    jsonl_path = os.path.join(evidence_dir, "proxy-soak.jsonl")
    summary_path = os.path.join(evidence_dir, "proxy-soak-summary.json")

    os.makedirs(evidence_dir, exist_ok=True)

    def diag_probe():
        if not diag_endpoint:
            return None
        started = time.monotonic()
        req = urllib.request.Request(diag_endpoint, method="GET")
        try:
            with urllib.request.urlopen(req, timeout=diag_timeout_seconds) as resp:
                status = getattr(resp, "status", 200)
                resp.read(256)
            return {
                "endpoint": diag_endpoint,
                "ok": True,
                "status": status,
                "elapsed_seconds": round(time.monotonic() - started, 3),
            }
        except Exception as diag_exc:
            return {
                "endpoint": diag_endpoint,
                "ok": False,
                "error": repr(diag_exc),
                "elapsed_seconds": round(time.monotonic() - started, 3),
            }

    def utc_now():
        return time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())

    def append_record(record):
        line = json.dumps(record, sort_keys=True)
        print(line, flush=True)
        with open(jsonl_path, "a", encoding="utf-8") as handle:
            handle.write(line + "\n")

    def post_chat(request_timeout):
        body = json.dumps(payload).encode("utf-8")
        req = urllib.request.Request(
            endpoint,
            data=body,
            headers={"Content-Type": "application/json"},
            method="POST",
        )
        with urllib.request.urlopen(req, timeout=request_timeout) as resp:
            raw = resp.read()
            return resp, json.loads(raw)

    def response_record(data, resp, elapsed):
        usage = data.get("usage") or {}
        completion_tokens = int(usage.get("completion_tokens") or 0)
        if completion_tokens <= 0:
            content = (data.get("choices") or [{}])[0].get("message", {}).get("content", "")
            completion_tokens = max(1, len(content.split()))
        ms_per_token = (elapsed * 1000.0) / completion_tokens
        returned_model = data.get("model", "")
        return {
            "ok": True,
            "status": getattr(resp, "status", 200),
            "elapsed_seconds": round(elapsed, 3),
            "completion_tokens": completion_tokens,
            "ms_per_token": round(ms_per_token, 3),
            "model_returned": returned_model,
            "expected_model": expected_model,
            "expected_model_match": not expected_model or returned_model in ("", expected_model),
            "content_preview": (data.get("choices") or [{}])[0].get("message", {}).get("content", "")[:120],
        }

    payload = {
        "model": model,
        "messages": [
            {
                "role": "user",
                "content": "You are a deterministic proxy soak target. Reply with one concise sentence that includes the word Blue.",
            }
        ],
        "max_tokens": max_tokens,
        "temperature": 0,
    }

    append_record({
        "event": "soak_start",
        "endpoint": endpoint,
        "model": model,
        "duration_seconds": duration_seconds,
        "interval_seconds": interval_seconds,
        "warmup_requests": warmup_requests,
        "latency_budget_ms_per_token": latency_budget_ms_per_token,
        "preflight_attempts": preflight_attempts,
        "preflight_interval_seconds": preflight_interval_seconds,
        "preflight_timeout_seconds": preflight_timeout_seconds,
        "expected_model": expected_model,
        "preflight_require_model_match": preflight_require_model_match,
        "started_at": utc_now(),
    })

    preflight_ok = preflight_attempts <= 0
    preflight_model_mismatches = 0
    for attempt in range(1, preflight_attempts + 1):
        started = time.monotonic()
        record = {
            "event": "preflight_request",
            "attempt": attempt,
            "started_at": utc_now(),
        }
        try:
            resp, data = post_chat(preflight_timeout_seconds)
            record.update(response_record(data, resp, time.monotonic() - started))
            if record["ok"] and not record["expected_model_match"]:
                preflight_model_mismatches += 1
            if record["ok"] and (
                record["expected_model_match"] or not preflight_require_model_match
            ):
                preflight_ok = True
        except Exception as exc:
            record.update({
                "ok": False,
                "error": repr(exc),
                "elapsed_seconds": round(time.monotonic() - started, 3),
            })
            diag = diag_probe()
            if diag is not None:
                record["diag"] = diag
        append_record(record)
        if preflight_ok:
            break
        if attempt < preflight_attempts:
            time.sleep(preflight_interval_seconds)

    if not preflight_ok:
        summary = {
            "event": "soak_summary",
            "status": "preflight_failed",
            "attempts": 0,
            "measured_requests": 0,
            "failures": 0,
            "measured_failures": 0,
            "warmup_failures": 0,
            "preflight_model_mismatches": preflight_model_mismatches,
            "measured_model_mismatches": 0,
            "p95_ms_per_token": None,
            "latency_budget_ms_per_token": latency_budget_ms_per_token,
            "preflight_attempts": preflight_attempts,
            "preflight_timeout_seconds": preflight_timeout_seconds,
            "preflight_require_model_match": preflight_require_model_match,
            "jsonl_path": jsonl_path,
            "summary_path": summary_path,
            "completed_at": utc_now(),
        }
        append_record(summary)
        with open(summary_path, "w", encoding="utf-8") as handle:
            json.dump(summary, handle, indent=2, sort_keys=True)
            handle.write("\n")
        sys.exit(23)

    deadline = time.monotonic() + duration_seconds
    attempts = 0
    warmup_failures = 0
    measured_failures = 0
    measured_model_mismatches = 0
    measured = []

    while time.monotonic() < deadline:
        attempts += 1
        started = time.monotonic()
        record = {
            "event": "request",
            "attempt": attempts,
            "started_at": utc_now(),
            "warmup": attempts <= warmup_requests,
        }
        try:
            resp, data = post_chat(timeout_seconds)
            elapsed = time.monotonic() - started
            record.update(response_record(data, resp, elapsed))
            if attempts > warmup_requests:
                measured.append(record["ms_per_token"])
                if record["ok"] and not record["expected_model_match"]:
                    measured_model_mismatches += 1
        except Exception as exc:
            if record["warmup"]:
                warmup_failures += 1
            else:
                measured_failures += 1
            record.update({
                "ok": False,
                "error": repr(exc),
                "elapsed_seconds": round(time.monotonic() - started, 3),
            })
            diag = diag_probe()
            if diag is not None:
                record["diag"] = diag
        append_record(record)

        sleep_for = interval_seconds - (time.monotonic() - started)
        if sleep_for > 0:
            time.sleep(sleep_for)

    p95 = None
    if measured:
        sorted_values = sorted(measured)
        p95_index = max(0, min(len(sorted_values) - 1, int(0.95 * len(sorted_values)) - 1))
        p95 = sorted_values[p95_index]

    summary = {
        "event": "soak_summary",
        "attempts": attempts,
        "measured_requests": len(measured),
        "failures": measured_failures,
        "measured_failures": measured_failures,
        "warmup_failures": warmup_failures,
        "preflight_model_mismatches": preflight_model_mismatches,
        "measured_model_mismatches": measured_model_mismatches,
        "p95_ms_per_token": None if p95 is None else round(p95, 3),
        "latency_budget_ms_per_token": latency_budget_ms_per_token,
        "preflight_require_model_match": preflight_require_model_match,
        "jsonl_path": jsonl_path,
        "summary_path": summary_path,
        "completed_at": utc_now(),
    }
    append_record(summary)
    with open(summary_path, "w", encoding="utf-8") as handle:
        json.dump(summary, handle, indent=2, sort_keys=True)
        handle.write("\n")

    if measured_failures:
        sys.exit(20)
    if p95 is None:
        sys.exit(21)
    if p95 > latency_budget_ms_per_token:
        sys.exit(22)
---
apiVersion: batch/v1
kind: Job
metadata:
  name: gfx906-llamacpp-proxy-soak-traffic
  namespace: flexinfer-system
  labels:
    app.kubernetes.io/part-of: flexinfer
    flexinfer.ai/purpose: proxy-soak
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: flexinfer
        flexinfer.ai/purpose: proxy-soak
    spec:
      restartPolicy: Never
      containers:
        - name: traffic
          image: python:3.11-alpine
          imagePullPolicy: IfNotPresent
          command: ["python3", "/scripts/proxy-soak.py"]
          env:
            - name: SOAK_DURATION_SECONDS
              value: "900"
            - name: SOAK_INTERVAL_SECONDS
              value: "60"
            - name: SOAK_REQUEST_TIMEOUT_SECONDS
              value: "900"
            - name: SOAK_WARMUP_REQUESTS
              value: "1"
            - name: SOAK_MAX_TOKENS
              value: "64"
            - name: SOAK_P95_MS_PER_TOKEN_BUDGET
              value: "300"
            - name: SOAK_PREFLIGHT_ATTEMPTS
              value: "10"
            - name: SOAK_PREFLIGHT_INTERVAL_SECONDS
              value: "30"
            - name: SOAK_PREFLIGHT_REQUEST_TIMEOUT_SECONDS
              value: "120"
            - name: SOAK_EXPECT_MODEL
              value: qwen3-8b-radeonvii-soak
            # Preflight model-match policy. The proxy returns whatever the
            # upstream advertises as `model`; llama.cpp upstreams advertise the
            # GGUF basename (e.g. `Qwen3-8B-Q4_K_M.gguf`), not the Model CR
            # name, so a strict match gates every healthy soak to exit 23.
            # Default soft: any HTTP 200 satisfies preflight, mismatches are
            # tallied into `preflight_model_mismatches` / `measured_model_
            # mismatches` in the summary and the triage tool surfaces them
            # separately. Set to "true" to restore strict behavior when the
            # upstream is known to advertise the Model CR name (e.g. vLLM with
            # `--served-model-name`, or llama.cpp with `--alias`).
            - name: SOAK_PREFLIGHT_REQUIRE_MODEL_MATCH
              value: "false"
            # Correlated diag probe. On each measured/preflight failure the
            # script also hits this endpoint with a short timeout and records
            # the result inline. Default targets `flexinfer-proxy /healthz` so
            # we can tell whether the proxy itself is alive when a per-Model
            # request times out at the selectorless-Service layer. Override to
            # `""` to disable, or to a sibling model route (e.g.
            # `/model/qwen3-1p7b-tools-radeonvii/v1/chat/completions`) to test
            # whether other models on the same runtime are reachable.
            - name: SOAK_DIAG_ENDPOINT
              value: http://flexinfer-proxy.flexinfer-system.svc.cluster.local/healthz
            - name: SOAK_DIAG_TIMEOUT_SECONDS
              value: "5"
            - name: SOAK_EVIDENCE_DIR
              value: /evidence
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
            - name: evidence
              mountPath: /evidence
      volumes:
        - name: script
          configMap:
            name: gfx906-llamacpp-proxy-soak-traffic
            defaultMode: 0755
        - name: evidence
          persistentVolumeClaim:
            claimName: gfx906-llamacpp-proxy-soak-evidence

# (§6.1): vLLM 0.33.0 parity on the 7900 XTX with only the image changed.
# Matrix row xtx-vllm-v033-parity-2026-11-05 (pass rule written before the
# run). NOT in any kustomization: the operator applies this file once, the
# agent drives the arms over the flexinfer MCP tools and reads results with
# `kubectl exec` / `kubectl logs`, then deletes both Models.
#
# Two Models, one per image, because the MCP tools cannot change spec.image:
#   qwen38-27b-v033-parity-a  vLLM 0.32.0, runtime@b06b06fe (the workhorse's
#                             image): the same-card baseline. The 0.32
#                             reference (rows ...-s3b-ttft / -s4-workhorse:
#                             71.8 / 66.5 / 66.1 tok/s at 512 / 2K / 16K,
#                             pos0 0.84 / 0.79 / 0.80, parity_code 8174a49e)
#                             was measured on the 5930k; this card runs under
#                             a 2100 MHz sclk cap.
#   qwen38-27b-v033-parity-b  vLLM 0.33.0-rocm72, runtime@<0.33 digest>
#                             (rocm-gfx1100-serving-v033-<sha>), plus
#                             `vllmVersion: "0.33.0"`, which 0.32+ pins need
#                             since !1281 (it drops VLLM_* names 0.33 lacks and
#                             the deprecated --mamba-cache-mode).
# Everything else is identical between the two: the 5930k workhorse's S4
# posture (ROCM_SEGMENTED_ATTN + autotune, fp16 KV, MTP K=2 with the
# checkpoint head, 32K, two seats, 0.96, GDN prefix caching align / bf16 SSM,
# chunked prefill 4096) on the XTX warm lane's slot (cblevins-7900xtx, both
# device-plugin slots with hipVisibleDevices 0, shared group 7900xtx-textgen,
# vramEstimateMB 23200 = the whole card), the S3 source revision 2d7425f7 and
# one compile cache per arm. No serviceLabels and no LiteLLM entry: nothing
# routes here but the probe.
#
# Priority 480: above the warm lane (300) so the canary borrows the card,
# below the creative lanes (500) so a studio request still wins it. Arm A
# starts with minReplicas 1; arm B waits at minReplicas 0 (its Local cache
# stages meanwhile) until arm A is deleted. The G6 arm is arm B with
# `VLLM_ROCM_USE_SKINNY_GEMM=0` patched into spec.config.env (0.33.0 has no
# VLLM_SKINNY_GEMM_MAX_WEIGHT_BYTES; see the matrix row).
#
# Window cost: the warm lane (mills-warm, mills-council, weaver) is off the
# card for ~45-60 min, two cold boots plus one warm restart; the 5930k
# workhorse is untouched. Afterwards one proxied request returns the card to
# the warm lane (ondemand hand-back gap, row xtx-runtime-v032-527e2714).
# Rollback = delete both Models.

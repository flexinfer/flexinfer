# Idle-time batch appliance [Sprint 2 / S2.2]: re-embed script.
#
# Pure-stdlib Python (urllib + json + uuid + hashlib). No pip deps, so the job
# runs on a bare python:3.x-slim image with nothing to install. It:
#   1. Walks REPO_PATH for source/doc files (extension allowlist, dir denylist).
#   2. Splits each file into overlapping line-window chunks.
#   3. Embeds chunks in batches via the OpenAI-compatible /v1/embeddings endpoint
#      (flexinfer-proxy -> bge-large-radeonvii on gfx906, the HBM2 retrieval plane).
#   4. Upserts vectors into a Qdrant collection with deterministic UUIDv5 point IDs
#      (so nightly re-runs overwrite in place rather than duplicate).
#
# This is the in-cluster batch consumer the S1.4b proof redirected here: hitting
# flexinfer-proxy directly is ~70.9 emb/s (self-hosted), vs 3.3 emb/s for the
# WAN/Cloudflare gateway path that made the interactive consumer a regression.
#
# Chunking is intentionally simple (line windows, not AST) per the operator's
# "standalone ConfigMap script" choice; the goal is to prove the throughput lands
# for a latency-insensitive batch, not to mirror codebase-memory's AST chunker.
apiVersion: v1
kind: ConfigMap
metadata:
  name: codebase-reembed-script
  namespace: flexinfer-system
  labels:
    app.kubernetes.io/part-of: flexinfer
    flexinfer.ai/purpose: idle-batch
data:
  reembed.py: |
    #!/usr/bin/env python3
    """Nightly codebase re-embed into Qdrant via the bge HBM2 retrieval plane.

    Configuration is entirely env-driven (see the CronJob spec). All HTTP uses the
    stdlib so the image needs no extra packages.
    """
    import hashlib
    import json
    import os
    import random
    import re
    import sys
    import time
    import urllib.error
    import urllib.request
    import uuid

    # ---- config (env) --------------------------------------------------------
    EMBEDDINGS_URL = os.environ["EMBEDDINGS_URL"].rstrip("/")
    EMBED_MODEL = os.environ["EMBED_MODEL"]
    QDRANT_URL = os.environ["QDRANT_URL"].rstrip("/")
    QDRANT_API_KEY = os.environ.get("QDRANT_API_KEY", "")
    # Multi-repo (F3 Slice 4): REPOS indexes one or more repos in a single run,
    # each into its own Qdrant collection. Format is ';'-separated records, each
    # 'name=path[=collection]' (field sep '=', record sep ';' -- neither occurs
    # in repo names, filesystem paths, or collection names). When REPOS is empty
    # the legacy single-repo REPO_PATH/REPO_NAME/COLLECTION env is used,
    # byte-for-byte the pre-Slice-4 behaviour.
    REPOS = os.environ.get("REPOS", "")
    COLLECTION = os.environ.get("COLLECTION", "codebase_memory_bge_v1")
    VECTOR_DIM = int(os.environ.get("VECTOR_DIM", "1024"))
    REPO_PATH = os.environ.get("REPO_PATH", "").rstrip("/")
    REPO_NAME = os.environ.get("REPO_NAME", "")
    BATCH_SIZE = int(os.environ.get("BATCH_SIZE", "64"))
    CHUNK_LINES = int(os.environ.get("CHUNK_LINES", "45"))
    CHUNK_OVERLAP = int(os.environ.get("CHUNK_OVERLAP", "8"))
    # bge-large-en-v1.5 has a 512-token max sequence. Token density for code can
    # be much lower than prose, and the repo/path prefix counts too, so cap the
    # final embedding input instead of only the body slice. MAX_CHUNK_CHARS is
    # kept as a compatibility alias for older ad-hoc jobs.
    MAX_INPUT_CHARS = int(os.environ.get(
        "MAX_INPUT_CHARS",
        os.environ.get("MAX_CHUNK_CHARS", "700"),
    ))
    MAX_FILES = int(os.environ.get("MAX_FILES", "0"))      # 0 = unbounded
    MAX_CHUNKS = int(os.environ.get("MAX_CHUNKS", "0"))    # 0 = unbounded
    MAX_FILE_BYTES = int(os.environ.get("MAX_FILE_BYTES", str(512 * 1024)))
    HTTP_TIMEOUT = int(os.environ.get("HTTP_TIMEOUT", "120"))
    # Transient-failure retry. The bge embeddings model is serverless + shared-GPU
    # (bge-large-radeonvii on gfx906); a mid-run reclaim/reload makes
    # flexinfer-proxy return 502/503/504 for several seconds, which must not abort
    # a 10+ minute batch. Bounded exponential backoff + jitter rides out the flap.
    # All knobs are env-tunable from the CronJob spec for slower cold starts.
    HTTP_RETRIES = int(os.environ.get("HTTP_RETRIES", "5"))
    RETRY_BACKOFF = float(os.environ.get("RETRY_BACKOFF", "1.0"))       # base seconds
    RETRY_BACKOFF_CAP = float(os.environ.get("RETRY_BACKOFF_CAP", "30.0"))
    RETRY_STATUS = (502, 503, 504)  # transient upstream; everything else fails fast
    # Qdrant expresses indexing_threshold in KiB. At 1024 float32 dimensions,
    # 5000 KiB is roughly 1,250 vectors per segment and is low enough to build
    # HNSW for the 2K-22K point codebase collections instead of full-scanning.
    QDRANT_INDEXING_THRESHOLD_KB = int(os.environ.get(
        "QDRANT_INDEXING_THRESHOLD_KB", "5000"
    ))
    # Keep headroom below bge-large's 512-token context/physical batch. This is
    # applied adaptively only when llama.cpp reports the real tokenizer count.
    EMBED_TOKEN_HEADROOM = int(os.environ.get("EMBED_TOKEN_HEADROOM", "480"))

    EXTS = tuple(e.strip() for e in os.environ.get(
        "EXTENSIONS",
        ".go,.py,.ts,.tsx,.js,.jsx,.rs,.java,.c,.h,.cpp,.hpp,.md,.rst,.sh,.yaml,.yml,.toml",
    ).split(",") if e.strip())
    DENY_DIRS = set(d.strip() for d in os.environ.get(
        "DENY_DIRS",
        ".git,node_modules,vendor,dist,build,.cache,.venv,venv,__pycache__,testdata,.worktrees,bin,.loom",
    ).split(",") if d.strip())

    NS = uuid.UUID("6f1d9e3a-2b7c-4f5e-9a10-c0ffee5217c2")  # stable namespace for IDs

    def log(msg):
        print(msg, flush=True)

    # ---- multi-repo config (F3 Slice 4) -------------------------------------
    def sanitize_repo_name(name):
        slug = "".join(c if c.isalnum() else "_" for c in name).strip("_").lower()
        return slug or "repo"

    def default_collection(name):
        return f"codebase_memory_bge_{sanitize_repo_name(name)}_v1"

    def parse_repos(repos_env, repo_path="", repo_name="", collection=""):
        """Return [(name, path, collection)] from the REPOS env, or the legacy
        single-repo fallback when REPOS is empty. Each REPOS record is
        'name=path[=collection]'; an omitted collection defaults to
        default_collection(name). Raises ValueError on a malformed record."""
        repos_env = (repos_env or "").strip()
        if not repos_env:
            if not repo_path:
                return []
            path = repo_path.rstrip("/")
            name = repo_name or os.path.basename(path)
            return [(name, path, collection or default_collection(name))]
        out = []
        for rec in repos_env.split(";"):
            rec = rec.strip()
            if not rec:
                continue
            parts = [p.strip() for p in rec.split("=")]
            if len(parts) < 2 or not parts[0] or not parts[1]:
                raise ValueError(
                    f"bad REPOS record {rec!r}; want name=path[=collection]")
            name, path = parts[0], parts[1].rstrip("/")
            coll = parts[2] if len(parts) >= 3 and parts[2] else default_collection(name)
            out.append((name, path, coll))
        return out

    # ---- file discovery + chunking ------------------------------------------
    def iter_files(root):
        for dirpath, dirnames, filenames in os.walk(root):
            dirnames[:] = [d for d in dirnames if d not in DENY_DIRS and not d.startswith(".")]
            for fn in sorted(filenames):
                # Skip dotfiles, incl. macOS AppleDouble (._foo.go) NFS cruft that
                # otherwise embeds as near-empty noise and crowds out real hits.
                if fn.endswith(EXTS) and not fn.startswith("."):
                    yield os.path.join(dirpath, fn)

    def chunk_file(path, repo_name, repo_path):
        try:
            if os.path.getsize(path) > MAX_FILE_BYTES:
                return
            with open(path, "r", encoding="utf-8", errors="replace") as fh:
                lines = fh.readlines()
        except OSError as exc:
            log(f"WARN read {path}: {exc}")
            return
        rel = os.path.relpath(path, repo_path)
        prefix = f"# {repo_name}/{rel}\n"
        if len(prefix) >= MAX_INPUT_CHARS:
            prefix = prefix[:MAX_INPUT_CHARS - 1] + "\n"
        step = max(1, CHUNK_LINES - CHUNK_OVERLAP)
        idx = 0
        for start in range(0, len(lines), step):
            window = lines[start:start + CHUNK_LINES]
            body = "".join(window).strip()
            last = start + CHUNK_LINES >= len(lines)
            if body:
                # Split over-long windows so the complete embedding input
                # (metadata prefix + body slice) stays under the char budget.
                body_budget = max(1, MAX_INPUT_CHARS - len(prefix))
                for off in range(0, len(body), body_budget):
                    yield {
                        "rel": rel, "chunk_index": idx,
                        "start_line": start + 1, "end_line": start + len(window),
                        "text": prefix + body[off:off + body_budget],
                    }
                    idx += 1
            if last:
                break

    # ---- http helpers --------------------------------------------------------
    def _req(url, data=None, method=None, headers=None):
        h = {"Content-Type": "application/json"}
        if headers:
            h.update(headers)
        body = json.dumps(data).encode() if data is not None else None
        return urllib.request.Request(url, data=body, method=method, headers=h)

    def _sleep_backoff(attempt):
        # Exponential backoff with equal jitter: wait a random time in [d/2, d]
        # where d = RETRY_BACKOFF * 2**attempt (capped). Jitter keeps retries from
        # synchronizing on the backend's recovery moment.
        d = min(RETRY_BACKOFF_CAP, RETRY_BACKOFF * (2 ** attempt))
        time.sleep(d / 2 + random.uniform(0, d / 2))

    def _do(req, expect=(200,)):
        last = None
        for attempt in range(HTTP_RETRIES):
            try:
                with urllib.request.urlopen(req, timeout=HTTP_TIMEOUT) as r:
                    raw = r.read()
                    return r.status, (json.loads(raw) if raw else None)
            except urllib.error.HTTPError as exc:
                if exc.code in expect:
                    return exc.code, None
                detail = exc.read()[:300]
                last = RuntimeError(f"HTTP {exc.code} {req.full_url}: {detail!r}")
                # Only transient upstream failures self-heal; a 4xx or a hard 5xx
                # won't recover by retrying, so surface it immediately.
                if exc.code not in RETRY_STATUS:
                    raise last
            except urllib.error.URLError as exc:
                # Connection-level failure (proxy restarting, DNS blip, timeout).
                last = RuntimeError(f"{type(exc).__name__} {req.full_url}: {exc.reason}")
            except Exception as exc:  # noqa: BLE001
                last = RuntimeError(f"{type(exc).__name__} {req.full_url}: {exc}")
            if attempt + 1 < HTTP_RETRIES:
                _sleep_backoff(attempt)
        raise last or RuntimeError(f"unreachable {req.full_url}")

    def qdrant_headers():
        return {"api-key": QDRANT_API_KEY} if QDRANT_API_KEY else {}

    def ensure_collection(collection):
        url = f"{QDRANT_URL}/collections/{collection}"
        status, _ = _do(_req(url, headers=qdrant_headers()), expect=(200, 404))
        if status == 200:
            log(f"collection {collection} exists")
            return
        log(f"creating collection {collection} (dim={VECTOR_DIM}, Cosine)")
        _do(_req(url, data={"vectors": {"size": VECTOR_DIM, "distance": "Cosine"}},
                 method="PUT", headers=qdrant_headers()))

    def tune_collection(collection):
        """Enable HNSW after the bulk upsert, avoiding an index rebuild per batch."""
        url = f"{QDRANT_URL}/collections/{collection}"
        _, info = _do(_req(url, headers=qdrant_headers()))
        current = (((info or {}).get("result") or {}).get("config") or {}).get(
            "optimizer_config", {}
        ).get("indexing_threshold")
        if current == QDRANT_INDEXING_THRESHOLD_KB:
            return
        log(f"collection {collection} indexing_threshold "
            f"{current}->{QDRANT_INDEXING_THRESHOLD_KB} KiB")
        _do(_req(url, data={"optimizers_config": {
            "indexing_threshold": QDRANT_INDEXING_THRESHOLD_KB,
        }}, method="PATCH", headers=qdrant_headers()))

    class EmbeddingInputTooLarge(RuntimeError):
        def __init__(self, tokens, limit):
            super().__init__(f"embedding input has {tokens} tokens; limit is {limit}")
            self.tokens = tokens
            self.limit = limit

    def embedding_limit_from_error(exc):
        match = re.search(
            r"input \((\d+) tokens\).*current batch size: (\d+)", str(exc)
        )
        return (int(match.group(1)), int(match.group(2))) if match else None

    def _embed_once(texts):
        try:
            _, resp = _do(_req(f"{EMBEDDINGS_URL}/v1/embeddings",
                               data={"model": EMBED_MODEL, "input": texts}))
        except RuntimeError as exc:
            limit = embedding_limit_from_error(exc)
            if limit:
                raise EmbeddingInputTooLarge(*limit) from exc
            raise
        rows = sorted(resp["data"], key=lambda d: d["index"])
        return [row["embedding"] for row in rows]

    def _shrink_embedding_record(record, tokens, limit):
        text = record["text"]
        target_tokens = max(1, min(EMBED_TOKEN_HEADROOM, limit - 1))
        target_chars = int(len(text) * target_tokens / max(tokens, 1) * 0.9)
        target_chars = max(1, min(len(text) - 1, target_chars))
        shrunk = dict(record)
        shrunk["text"] = text[:target_chars].rstrip()
        log(f"WARN embedding input too large path={record.get('rel', '?')} "
            f"chunk={record.get('chunk_index', '?')} tokens={tokens} limit={limit}; "
            f"shrinking chars={len(text)}->{len(shrunk['text'])}")
        return shrunk

    def embed_records(records):
        """Embed records in order, isolating only tokenizer-overflow inputs.

        llama.cpp reports the true token count but not the failing item index.
        Bisecting the batch finds the offending record; a singleton is shrunk
        using the observed token/character ratio and retried. The returned
        record carries the exact text used for its vector, keeping Qdrant
        payload and embedding semantically aligned.
        """
        if not records:
            return []
        try:
            vectors = _embed_once([record["text"] for record in records])
            return list(zip(records, vectors))
        except EmbeddingInputTooLarge as exc:
            if len(records) > 1:
                middle = len(records) // 2
                return embed_records(records[:middle]) + embed_records(records[middle:])
            shrunk = _shrink_embedding_record(records[0], exc.tokens, exc.limit)
            if not shrunk["text"] or len(shrunk["text"]) >= len(records[0]["text"]):
                raise RuntimeError("unable to shrink oversized embedding input") from exc
            return embed_records([shrunk])

    def upsert(collection, points):
        _do(_req(f"{QDRANT_URL}/collections/{collection}/points?wait=true",
                 data={"points": points}, method="PUT", headers=qdrant_headers()))

    def point_id(repo_name, rel, chunk_index):
        return str(uuid.uuid5(NS, f"{repo_name}:{rel}:{chunk_index}"))

    # ---- per-repo indexing ---------------------------------------------------
    def process_repo(repo_name, repo_path, collection):
        log(f"  repo={repo_name} path={repo_path} -> {collection}")
        if not os.path.isdir(repo_path):
            log(f"  WARN repo path not found, skipping: {repo_path}")
            return 0, 0, False
        ensure_collection(collection)

        batch = []
        counters = {"total": 0, "files": 0}
        clamped_files = clamped_chunks = False

        def flush():
            if not batch:
                return
            embedded = embed_records(batch)
            points = [{
                "id": point_id(repo_name, b["rel"], b["chunk_index"]),
                "vector": vec,
                "payload": {
                    "repo": repo_name, "path": b["rel"],
                    "chunk_index": b["chunk_index"],
                    "start_line": b["start_line"], "end_line": b["end_line"],
                    "text": b["text"],
                    "embed_model": EMBED_MODEL,
                },
            } for b, vec in embedded]
            upsert(collection, points)
            counters["total"] += len(points)
            batch.clear()

        for path in iter_files(repo_path):
            if MAX_FILES and counters["files"] >= MAX_FILES:
                clamped_files = True
                break
            counters["files"] += 1
            for ch in chunk_file(path, repo_name, repo_path):
                if MAX_CHUNKS and (counters["total"] + len(batch)) >= MAX_CHUNKS:
                    clamped_chunks = True
                    break
                batch.append(ch)
                if len(batch) >= BATCH_SIZE:
                    flush()
            if clamped_chunks:
                break
        flush()
        tune_collection(collection)

        if clamped_files:
            log(f"  NOTE repo={repo_name} stopped at MAX_FILES={MAX_FILES}")
        if clamped_chunks:
            log(f"  NOTE repo={repo_name} stopped at MAX_CHUNKS={MAX_CHUNKS}")
        return counters["files"], counters["total"], True

    # ---- main ----------------------------------------------------------------
    def main():
        try:
            repos = parse_repos(REPOS, REPO_PATH, REPO_NAME, COLLECTION)
        except ValueError as exc:
            log(f"FATAL {exc}")
            sys.exit(1)
        if not repos:
            log("FATAL no repos configured (set REPOS or REPO_PATH)")
            sys.exit(1)

        log(f"re-embed start repos={len(repos)} model={EMBED_MODEL} -> {QDRANT_URL}")
        t0 = time.time()
        grand_files = grand_chunks = indexed = 0
        for repo_name, repo_path, collection in repos:
            files, chunks, ok = process_repo(repo_name, repo_path, collection)
            grand_files += files
            grand_chunks += chunks
            indexed += 1 if ok else 0

        elapsed = time.time() - t0
        rate = grand_chunks / elapsed if elapsed > 0 else 0.0
        log(f"re-embed DONE repos={indexed}/{len(repos)} files={grand_files} "
            f"chunks={grand_chunks} elapsed={elapsed:.1f}s emb/s={rate:.1f}")
        if indexed == 0:
            log("FATAL no repos indexed (all paths missing?)")
            sys.exit(1)

    if __name__ == "__main__":
        main()

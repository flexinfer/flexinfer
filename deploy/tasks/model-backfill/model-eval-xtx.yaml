# Daily opportunistic evaluation against the warm 7900xtx Mills lane
# (qwen38-27b-xtx-warm-canary: mills-warm / mills-council). Same shape as
# model-eval-qwen38-5930k: the controller copies the model-eval-gauntlet
# CronJob template only after the lane has seen no foreground demand for 30
# continuous minutes; the Job is CPU-side, calls the warm endpoint and never
# touches the GPU or unloads the serving model.
#
# 2026-09-13 (issue #74 S2): added with the lane's move to the v0.26 native
# W4A16 runtime so the currency digest gets a coherent-answer check every day
# it is idle long enough, not only on promotion day.
apiVersion: ai.flexinfer/v1alpha2
kind: ModelBackfill
metadata:
  name: model-eval-qwen38-xtx
  namespace: flexinfer-system
  labels:
    app.kubernetes.io/part-of: flexinfer
    flexinfer.ai/purpose: idle-batch
spec:
  modelRef: qwen38-27b-xtx-warm-canary
  templateRef: model-eval-gauntlet
  idleFor: 30m
  maxRunDuration: 15m
  repeatAfter: 24h
  env:
    MODELS: qwen38-27b-xtx-warm-canary=vllm
    ITERS: "3"
    MIN_DURATION: 30s
    BATCH_SIZE: "64"
    GAUNTLET_ENABLED: "1"
    GAUNTLET_API: chat
    GAUNTLET_MIN_TOKENS: "1"
    GAUNTLET_PROMPT: What is 2 + 2? Answer with just the number.
    GAUNTLET_EXPECT: "4"
    GAUNTLET_EXPECT_MODE: all

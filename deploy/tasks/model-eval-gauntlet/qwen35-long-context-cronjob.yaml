# ModelExperiment template for deterministic long-context recall. It sends one
# five-needle prompt at each context rung, covering start/quarter/middle/
# three-quarter/end depth in two requests. Any missed passphrase fails the Job.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: qwen35-long-context-gauntlet
  namespace: flexinfer-system
  labels:
    app.kubernetes.io/part-of: flexinfer
    flexinfer.ai/purpose: long-context-qualification
spec:
  # The template is copied only by ModelExperiment. Keep the CronJob itself
  # suspended; the valid annual expression avoids undefined no-next-run cron
  # behavior if a controller still evaluates its schedule while suspended.
  schedule: "0 0 1 1 *"
  suspend: true
  concurrencyPolicy: Forbid
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/part-of: flexinfer
        flexinfer.ai/purpose: long-context-qualification
    spec:
      backoffLimit: 0
      # Leave room for adaptive prompt calibration and two 15-minute requests,
      # while remaining below the experiment's two-hour end-to-end timeout.
      activeDeadlineSeconds: 5400
      template:
        spec:
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/hostname: cblevins-7900xtx
            kubernetes.io/arch: amd64
          tolerations:
            - effect: NoSchedule
              key: node-role.kubernetes.io/control-plane
              operator: Exists
            # The gauntlet is CPU-only but deliberately co-locates with the
            # candidate to use the node-cached Python image and direct LAN path.
            - effect: NoSchedule
              key: dedicated
              operator: Equal
              value: gpu
          containers:
            - name: context-gauntlet
              image: docker.io/library/python@sha256:25976e9d34a0fab1f278cae931f34c8303d97bf0c0d7f85b6b4dcf641d7702a4
              imagePullPolicy: IfNotPresent
              command: [python3, -c]
              args:
                - |
                  import http.client, json, os, sys, time, urllib.error, urllib.request

                  model = os.environ["MODELS"].split("=", 1)[0]
                  direct_base = os.environ.get(
                      "FLEXINFER_DIRECT_URL_TEMPLATE",
                      "http://{model}.flexinfer-system.svc.cluster.local:8000",
                  ).format(model=model)
                  proxy_base = os.environ.get(
                      "FLEXINFER_PROXY_URL",
                      "http://flexinfer-proxy.flexinfer-system.svc.cluster.local:80",
                  )
                  points = [int(v) for v in os.environ.get("CONTEXT_POINTS", "98304,131072").split(",")]
                  timeout = float(os.environ.get("REQUEST_TIMEOUT", "900"))
                  transport_retries = int(os.environ.get("TRANSPORT_RETRIES", "3"))
                  labels = ["ALPHA", "BRAVO", "CHARLIE", "DELTA", "ECHO"]
                  count = int(os.environ.get("NEEDLE_COUNT", "5"))
                  labels = labels[:count]
                  filler = "Routine telemetry sample: subsystem nominal; no anomaly was recorded in this interval. "
                  measured_tokens_per_line = 22.0

                  def post_json(base, payload, target, lines):
                      http_request = urllib.request.Request(
                          base.rstrip("/") + "/v1/chat/completions",
                          data=payload,
                          headers={"Content-Type": "application/json"},
                      )
                      for transport_attempt in range(1, transport_retries + 1):
                          try:
                              return json.load(urllib.request.urlopen(http_request, timeout=timeout))
                          except urllib.error.HTTPError as error:
                              detail = error.read().decode()[:500]
                              print(f"target={target} lines={lines} HTTP {error.code}: {detail}", flush=True)
                              return None
                          except (urllib.error.URLError, http.client.RemoteDisconnected, TimeoutError, OSError) as error:
                              print(
                                  f"target={target} lines={lines} transport_attempt={transport_attempt}/{transport_retries} "
                                  f"error={type(error).__name__}: {error}",
                                  flush=True,
                              )
                              if transport_attempt == transport_retries:
                                  return None
                              time.sleep(min(15, 2 ** transport_attempt))

                  def request(lines, target, output_budget):
                      nonlocal_values = []
                      haystack = [filler] * lines
                      for index, label in enumerate(labels):
                          value = f"MARMALADE-73118-{label}"
                          nonlocal_values.append(value)
                          depth = index / max(1, count - 1)
                          pos = min(lines - 1, int(depth * (lines - 1)))
                          haystack[pos] = f"The {label} vault passphrase is {value}. " + haystack[pos]
                      prompt = "".join(haystack) + "\nRepeat every labeled vault passphrase exactly, one per line."
                      payload = json.dumps({
                          "model": model,
                          "messages": [{"role": "user", "content": prompt}],
                          "max_tokens": output_budget,
                          "temperature": 0,
                          "chat_template_kwargs": {"enable_thinking": False},
                      }).encode()
                      started = time.time()
                      response = post_json(direct_base, payload, target, lines)
                      if response is None:
                          return None
                      answer = response["choices"][0]["message"].get("content") or ""
                      actual = (response.get("usage") or {}).get("prompt_tokens")
                      return actual, answer, nonlocal_values, round(time.time() - started, 2)

                  def run(target):
                      global measured_tokens_per_line
                      output_budget = max(192, count * 28)
                      prompt_budget = target - output_budget - 256
                      for attempt in range(1, 5):
                          lines = max(count + 1, int(prompt_budget / measured_tokens_per_line))
                          result = request(lines, target, output_budget)
                          if result is None:
                              measured_tokens_per_line *= 1.08
                              continue
                          actual, answer, values, elapsed = result
                          if actual:
                              measured_tokens_per_line = max(1.0, actual / lines) * 1.005
                          close_enough = actual and actual >= target - output_budget - max(1024, int(target * 0.02))
                          within_limit = actual and actual + output_budget <= target
                          print(json.dumps({"target_tokens": target, "attempt": attempt, "prompt_tokens": actual, "needles": count, "close_enough": bool(close_enough), "within_limit": bool(within_limit), "latency_s": elapsed}), flush=True)
                          if not close_enough or not within_limit:
                              continue
                          missing = [value for value in values if value not in answer]
                          print(json.dumps({"target_tokens": target, "prompt_tokens": actual, "needles": count, "recalled": count - len(missing), "missing": missing, "latency_s": elapsed, "answer": answer[:500]}), flush=True)
                          return not missing and bool(answer.strip())
                      print(f"target={target} could not calibrate a request inside the 2% context band", flush=True)
                      return False

                  def proxy_smoke():
                      payload = json.dumps({
                          "model": model,
                          "messages": [{"role": "user", "content": "Reply with exactly ROUTE_OK."}],
                          "max_tokens": 16,
                          "temperature": 0,
                          "chat_template_kwargs": {"enable_thinking": False},
                      }).encode()
                      response = post_json(proxy_base, payload, "proxy-smoke", 1)
                      answer = "" if response is None else (response["choices"][0]["message"].get("content") or "")
                      ok = "ROUTE_OK" in answer
                      print(json.dumps({"proxy_smoke": ok, "answer": answer[:100]}), flush=True)
                      return ok

                  print(f"LONG_CONTEXT_DIRECT_ENDPOINT={direct_base}", flush=True)
                  results = [run(point) for point in points]
                  results.append(proxy_smoke())
                  if not all(results):
                      sys.exit(1)
                  print(f"LONG_CONTEXT_GAUNTLET_OK model={model} points={points} needles={count}", flush=True)
              env:
                - name: FLEXINFER_DIRECT_URL_TEMPLATE
                  value: http://{model}.flexinfer-system.svc.cluster.local:8000
                - name: FLEXINFER_PROXY_URL
                  value: http://flexinfer-proxy.flexinfer-system.svc.cluster.local:80
                - name: TRANSPORT_RETRIES
                  value: "3"
              resources:
                requests:
                  cpu: 200m
                  memory: 128Mi
                limits:
                  cpu: "2"
                  memory: 512Mi

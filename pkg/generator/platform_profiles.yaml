# Platform profiles for Loom MCP config generation.
# Each platform defines its config format, file paths, hook support,
# capabilities, and serialization features. Adding a new platform
# requires only a new entry here — no Go code changes.
#
# Schema versioning: bumped to v2 on 2026-05-07 to gate forthcoming
# template-driven fields (hooks.template, policy_refs → templates/policies/,
# extras → templates/extras/). v1 readers cannot reliably consume v2 YAML
# once those fields are populated. See .loom/107 (EPIC 3 product spec).

version: 2

platforms:
  claude:
    display_name: "Claude Code"
    config_format: "json"
    config_file: "mcp.json"
    config_root: "mcpServers"
    hooks:
      enabled: true
      file: "settings.json"
      events: ["sessionStart", "sessionEnd", "preToolUse", "postToolUse", "subagentStart"]
      policy_refs: ["gitops_flux"]
      enforcement: "native"
      agent_id: "claude-code"
      agent_type: "claude-code"
      description: "Claude Code session"
      # Claude `Stop` is per-turn ("Claude finishes responding"); `SessionEnd`
      # fires once per session (matchers: clear/resume/logout/prompt_input_exit/
      # bypass_permissions_disabled/other). Mapping session-end to `Stop`
      # caused `loom agent session-end --summarize` to run every turn —
      # corrected on 2026-05-12 to fire on the real session-end event.
      # See pkg/generator/VENDOR_SPECS.md "Hook lifecycle surface" + the
      # SessionEnd row in the canonical → vendor mapping table.
      session_end_event: "SessionEnd"
      heartbeat_event: "PostToolUse"
      heartbeat_matcher: "Bash|Task"
      extras: ["postToolUse_formatters", "postToolUse_taskSync", "telemetry_eventEmit"]
    loom_proxy:
      agent_hint: "claude-code"
      tool_profile: "llm-core"
      max_tools: 140
    capabilities:
      mcp_servers: true
      permissions: true
      sandbox: false
      web_search: true
      custom_models: true
      plugin_system: false
    features:
      command_format: "separate"
      env_key: "env"
      timeout_unit: "seconds"
      timeout_field: "timeout"
      supports_timeout: true
      supports_description: true

  claude_desktop:
    display_name: "Claude Desktop"
    config_format: "json"
    config_file: "claude_desktop_config.json"
    config_root: "mcpServers"
    hooks:
      enabled: false
      policy_refs: ["gitops_flux"]
      enforcement: "proxy"
    loom_proxy:
      agent_hint: "claude-desktop"
      tool_profile: "llm-core"
      max_tools: 140
      env:
        LOOM_PROXY_IDLE_EXIT_SECONDS: "0"
    capabilities:
      mcp_servers: true
      permissions: false
      sandbox: false
      web_search: false
      custom_models: false
      plugin_system: false
    features:
      command_format: "separate"
      env_key: "env"
      timeout_unit: "seconds"
      supports_timeout: false
      supports_description: true

  gemini:
    display_name: "Gemini CLI"
    config_format: "toml"
    config_file: "config.toml"
    hooks:
      enabled: true
      file: "settings.json"
      events: ["sessionStart", "sessionEnd", "postToolUse"]
      policy_refs: ["gitops_flux"]
      enforcement: "native"
      agent_id: "gemini-cli"
      agent_type: "gemini-cli"
      description: "Gemini CLI session"
      session_end_event: "SessionEnd"
      heartbeat_event: "AfterTool"
      heartbeat_matcher: "run_shell_command"
      extras: ["telemetry_eventEmit"]
    capabilities:
      mcp_servers: true
      permissions: false
      sandbox: false
      web_search: true
      custom_models: true
      plugin_system: false
    features:
      command_format: "separate"
      env_key: "env"
      timeout_unit: "seconds"
      supports_timeout: true
      supports_description: true

  codex:
    display_name: "Codex CLI"
    config_format: "toml"
    config_file: "config.toml"
    # Codex shipped a Claude-style [hooks] block in v0.129.0 (2026-05-07). We
    # emit `notify = [...]` in config.toml AND a Claude-shape hooks.json
    # alongside it, so both `notify` (turn-end keepalive) and the richer
    # SessionStart/Stop/PostToolUse events fire. `notify` stays as a fallback
    # because the [hooks] block does not always fire SessionStart/Stop for
    # repo-local config (openai/codex#17532).
    hooks:
      enabled: true
      file: "hooks.json"
      # Note: Codex's `Stop` event is per-turn (fires after every model
      # response), NOT session-end. There is NO `SessionEnd` event in Codex
      # docs (https://developers.openai.com/codex/hooks). True session
      # termination is detected via notify + the keepalive-wrap background
      # process (deregister-on-exit). Therefore:
      #   - `stop` is intentionally absent from this events list
      #   - session_end_event is empty so buildPlatformHooks doesn't emit a
      #     [hooks.Stop] block that would spam `loom agent session-end
      #     --summarize` every turn.
      events: ["sessionStart", "postToolUse", "notify"]
      # Enforcement stays "proxy": Codex's PreToolUse doesn't expose a Bash
      # matcher (image-gen and other tools also don't fire PreToolUse —
      # openai/codex#20616), so kubectl/policy guardrails still run via the
      # loom proxy.
      policy_refs: ["gitops_flux"]
      enforcement: "proxy"
      agent_id: "codex"
      agent_type: "codex"
      description: "Codex CLI session"
      session_end_event: ""
      heartbeat_event: "PostToolUse"
      heartbeat_matcher: ""
      extras: ["telemetry_eventEmit"]
    loom_proxy:
      agent_hint: "codex"
      tool_profile: "llm-core"
      max_tools: 140
    capabilities:
      mcp_servers: true
      permissions: true
      sandbox: true
      web_search: true
      custom_models: true
      plugin_system: false
    features:
      command_format: "separate"
      env_key: "env"
      timeout_unit: "seconds"
      timeout_field: "tool_timeout_sec"
      supports_timeout: true
      supports_description: false
      requires_preamble: true

  opencode:
    display_name: "OpenCode"
    config_format: "json"
    config_file: "opencode.json"
    config_root: "mcp"
    hooks:
      enabled: true
      file: "plugins/loom-hooks.ts"
      type: "typescript"
      events: ["sessionCreated", "sessionDeleted", "sessionIdle", "toolExecuteAfter"]
      policy_refs: ["gitops_flux"]
      enforcement: "plugin"
    capabilities:
      mcp_servers: true
      permissions: false
      sandbox: false
      web_search: false
      custom_models: true
      plugin_system: true
    features:
      command_format: "array"
      env_key: "environment"
      timeout_unit: "milliseconds"
      supports_timeout: true
      supports_description: false

  vscode:
    display_name: "VS Code"
    config_format: "json"
    config_file: "mcp.json"
    config_root: "mcpServers"
    hooks:
      enabled: false
      policy_refs: ["gitops_flux"]
      enforcement: "proxy"
    capabilities:
      mcp_servers: true
      permissions: false
      sandbox: false
      web_search: false
      custom_models: false
      plugin_system: false
    features:
      command_format: "separate"
      env_key: "env"
      timeout_unit: "seconds"
      timeout_field: "timeout"
      supports_timeout: true
      supports_description: true

  antigravity:
    display_name: "Antigravity"
    config_format: "json"
    config_file: "mcp.json"
    config_root: "mcpServers"
    hooks:
      enabled: false
      policy_refs: ["gitops_flux"]
      enforcement: "proxy"
    loom_proxy:
      agent_hint: "antigravity"
      tool_profile: "antigravity-core"
      max_tools: 100
    capabilities:
      mcp_servers: true
      permissions: false
      sandbox: false
      web_search: false
      custom_models: false
      plugin_system: false
    features:
      command_format: "separate"
      env_key: "env"
      timeout_unit: "seconds"
      timeout_field: "timeout"
      supports_timeout: true
      supports_description: true

  kilocode:
    display_name: "Kilo Code"
    config_format: "toml"
    config_file: "config.toml"
    hooks:
      enabled: false
      policy_refs: ["gitops_flux"]
      enforcement: "proxy"
    loom_proxy:
      agent_hint: "kilocode"
      tool_profile: "llm-core"
      max_tools: 140
    capabilities:
      mcp_servers: true
      permissions: false
      sandbox: false
      web_search: false
      custom_models: false
      plugin_system: false
    features:
      command_format: "separate"
      env_key: "env"
      timeout_unit: "seconds"
      supports_timeout: true
      supports_description: true

  zed:
    display_name: "Zed"
    config_format: "json"
    config_file: "mcp.json"
    config_root: "mcpServers"
    hooks:
      enabled: false
      policy_refs: ["gitops_flux"]
      enforcement: "proxy"
    loom_proxy:
      agent_hint: "zed"
    capabilities:
      mcp_servers: true
      permissions: false
      sandbox: false
      web_search: false
      custom_models: false
      plugin_system: false
    features:
      command_format: "separate"
      env_key: "env"
      timeout_unit: "seconds"
      timeout_field: "timeout"
      supports_timeout: true
      supports_description: true

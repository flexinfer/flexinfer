name: gitops_flux
description: >-
  Block direct kubectl mutations that bypass GitOps. Operators should edit
  manifests in platform/gitops/, commit, push, and let Flux reconcile.
blocked_commands:
  - "kubectl apply"
  - "kubectl delete"
  - "kubectl patch"
  - "kubectl edit"
  - "kubectl set"
  - "kubectl replace"
  - "kubectl create"
  - "kubectl scale"
  - "kubectl rollout restart"
  - "kubectl rollout undo"
message: >-
  GitOps policy: Direct kubectl mutations bypass git history and Flux reconciliation.
  Edit manifests in platform/gitops/, commit, push, then run flux reconcile.

name: secrets_scan
description: >-
  Block bash commands that exfiltrate or print secrets from common
  locations. EPIC 3 / CONFIG-3 extensibility example (.loom/108) — proves
  that adding a new policy ref now requires only a YAML file under
  pkg/generator/templates/policies/, not a Go switch case.
blocked_commands:
  - "cat ~/.ssh/id_"
  - "cat ~/.aws/credentials"
  - "cat ~/.kube/config"
  - "cat /etc/shadow"
  - "printenv"
  - "env"
message: >-
  Secrets scan: refusing to print credentials, SSH private keys, or kubeconfig.
  Read specific fields you need (e.g. via gh secret list, aws sts get-caller-identity)
  rather than dumping the whole file.

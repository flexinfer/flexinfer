# Tool Metadata for Enhanced LLM Understanding
# This file provides usage hints, examples, and related tools
# to help LLMs better understand when and how to use each tool.

version: 1

servers:
  mcp-git:
    description: "Git version control operations"
    category: "version-control"
    tools:
      git_status:
        usageHint: "Use first to understand repo state before any git operations"
        example: "Check for uncommitted changes before starting work"
        relatedTools: ["git_diff", "git_add", "git_commit"]
        priority: 1
      git_diff:
        usageHint: "Review changes before staging or committing"
        example: "See what has changed in working directory"
        relatedTools: ["git_status", "git_add"]
        priority: 2
      git_add:
        usageHint: "Stage files for commit after reviewing with git_diff"
        example: "Stage specific files or all changes"
        relatedTools: ["git_diff", "git_commit"]
        priority: 3
      git_commit:
        usageHint: "Commit staged changes with descriptive message"
        example: "Create commit after staging with git_add"
        relatedTools: ["git_add", "git_push"]
        priority: 4
      git_log:
        usageHint: "View commit history for context or debugging"
        example: "Find when a change was introduced"
        relatedTools: ["git_diff", "git_show"]
        priority: 5

  mcp-github:
    description: "GitHub API operations"
    category: "collaboration"
    tools:
      list_repos:
        usageHint: "Discover repositories available to the authenticated user/org"
        example: "List repos under an org"
        relatedTools: ["get_repo", "search_repos"]
        priority: 1
      get_repo:
        usageHint: "Fetch repo metadata (default branch, visibility, etc.)"
        example: "Get details for services/loom-core"
        relatedTools: ["list_commits", "get_file_contents"]
        priority: 2
      list_prs:
        usageHint: "List pull requests for a repo"
        example: "List open PRs"
        relatedTools: ["get_pr", "list_commits"]
        priority: 2
      get_pr:
        usageHint: "Get a single PR with details"
        example: "Get PR #123"
        relatedTools: ["list_prs", "list_commits"]
        priority: 3
      list_issues:
        usageHint: "List issues for a repo"
        example: "List open issues"
        relatedTools: ["get_issue", "create_issue"]
        priority: 2
      get_issue:
        usageHint: "Get a single issue with details"
        example: "Get issue #42"
        relatedTools: ["list_issues", "create_issue"]
        priority: 3
      create_issue:
        usageHint: "Report bugs or request features"
        example: "Document a problem for team discussion"
        relatedTools: ["list_issues", "get_issue"]
        priority: 3
      list_commits:
        usageHint: "Inspect recent commit history for a repo/branch"
        example: "List last 20 commits on main"
        relatedTools: ["get_file_contents"]
        priority: 3
      search_repos:
        usageHint: "Search repos by keyword"
        example: "Find repos matching 'loom'"
        relatedTools: ["list_repos", "get_repo"]
        priority: 4
      search_code:
        usageHint: "Search code across repos (use precise queries to limit results)"
        example: "Search for 'k8s_exec' usage"
        relatedTools: ["get_file_contents"]
        priority: 4
      get_file_contents:
        usageHint: "Fetch a file from a repo at a ref/path"
        example: "Get README.md from main"
        relatedTools: ["get_repo", "search_code"]
        priority: 4

  mcp-gitlab:
    description: "GitLab API operations"
    category: "collaboration"
    tools:
      verify_token:
        usageHint: "Validate that the configured GitLab token is present and can authenticate, and (when available) return token scopes"
        example: "Confirm Loom secrets/keychain token is correct before debugging API failures"
        relatedTools: ["list_projects", "get_project"]
        priority: 1
      list_projects:
        usageHint: "List projects accessible to the authenticated user (use to find the correct project path/ID)"
        example: "List projects you are a member of"
        relatedTools: ["get_project", "search_repositories"]
        priority: 2
      create_pipeline:
        usageHint: "Trigger a pipeline run for a branch/tag, optionally with variables"
        example: "Run CI on main with PIPELINE_DEBUG=1"
        relatedTools: ["list_pipelines", "get_pipeline", "list_pipeline_jobs"]
        priority: 2
      list_pipelines:
        usageHint: "Inspect recent pipeline runs for a project (filter by ref/status)"
        example: "Find the last failed pipeline on main"
        relatedTools: ["get_pipeline", "list_pipeline_jobs"]
        priority: 2
      list_pipeline_jobs:
        usageHint: "See all jobs in a pipeline and their current status"
        example: "Locate the failing job to fetch its trace"
        relatedTools: ["get_job", "get_job_trace"]
        priority: 2
      get_job_trace:
        usageHint: "Fetch the job trace/log (use tail_lines/max_bytes to keep output small)"
        example: "Grab the last 200 lines from a failing job"
        relatedTools: ["get_job", "list_pipeline_jobs"]
        priority: 3

  mcp-filesystem:
    description: "File system operations"
    category: "file-operations"
    tools:
      read_file:
        usageHint: "Read file contents before editing or analyzing"
        example: "Load source code for review"
        relatedTools: ["list_directory", "search_files"]
        priority: 1
      list_directory:
        usageHint: "Explore directory structure to find files"
        example: "Navigate project structure"
        relatedTools: ["read_file", "search_files"]
        priority: 3
      search_files:
        usageHint: "Find files by name pattern across directories"
        example: "Locate all test files in project"
        relatedTools: ["list_directory", "read_file"]
        priority: 2

  mcp-k8s:
    description: "Fast Go-native Kubernetes API operations (client-go)"
    category: "kubernetes"
    tools:
      list_pods:
        usageHint: "Start here to understand what's running in a namespace"
        example: "List pods in jobsearch namespace"
        relatedTools: ["get_pod", "get_logs"]
        priority: 1
      get_pod:
        usageHint: "Get detailed info for a single pod (including status and container readiness)"
        example: "Inspect jobsearch-api-... pod details"
        relatedTools: ["list_pods", "get_logs"]
        priority: 2
      get_logs:
        usageHint: "Fetch recent logs; use container name when pod has multiple containers"
        example: "Get last 200 lines of api container logs"
        relatedTools: ["list_pods", "get_pod"]
        priority: 3
      list_deployments:
        usageHint: "Quick health view of deployments and replica counts"
        example: "List deployments in a namespace"
        relatedTools: ["scale_deployment", "restart_deployment"]
        priority: 4
      list_services:
        usageHint: "List services to confirm ports/endpoints are exposed"
        example: "List services in jobsearch"
        relatedTools: ["get_resource"]
        priority: 2
      get_resource:
        usageHint: "Fetch arbitrary resources by kind/name; useful for configmaps, secrets, ingresses"
        example: "Get ingress for jobsearch"
        relatedTools: ["list_namespaces", "list_deployments"]
        priority: 5
      list_namespaces:
        usageHint: "Discover namespaces when you only know the app name"
        example: "List all namespaces"
        relatedTools: ["list_pods"]
        priority: 2
      scale_deployment:
        usageHint: "Scale a deployment up/down; verify with list_deployments afterwards"
        example: "Scale jobsearch-api to 2 replicas"
        relatedTools: ["list_deployments"]
        priority: 3
      restart_deployment:
        usageHint: "Trigger a rollout restart; use when pods are stuck or after config changes"
        example: "Restart jobsearch-api deployment"
        relatedTools: ["list_deployments", "get_logs"]
        priority: 3

  mcp-k8s-ops:
    description: "Kubernetes operations via kubectl (useful when you need exec/apply or specific contexts)"
    category: "kubernetes"
    tools:
      k8s_getPods:
        usageHint: "List pods when you need kubectl-native output formats (wide/yaml/json)"
        example: "Get pods in jobsearch namespace"
        relatedTools: ["k8s_describe", "k8s_logs", "k8s_exec"]
        priority: 1
      k8s_logs:
        usageHint: "Fetch logs for pod/name or deploy/name; prefer tail to limit output size"
        example: "Tail 200 lines of logs for pod/jobsearch-api-..."
        relatedTools: ["k8s_getPods", "k8s_describe"]
        priority: 2
      k8s_exec:
        usageHint: "Run a command in a container; set timeoutSeconds < client deadline to avoid tool timeouts"
        example: "Exec python -V in a pod container"
        relatedTools: ["k8s_getPods", "k8s_logs"]
        priority: 3
      k8s_get:
        usageHint: "Generic get for any kind; use output=json/yaml for machine parsing"
        example: "Get deploy/jobsearch-api -o yaml"
        relatedTools: ["k8s_describe", "k8s_apply"]
        priority: 4
      k8s_describe:
        usageHint: "Use when debugging scheduling, image pulls, restarts, or events"
        example: "Describe pod/jobsearch-api-..."
        relatedTools: ["k8s_getPods", "k8s_logs"]
        priority: 4
      k8s_apply:
        usageHint: "Apply a manifest file; prefer small, targeted applies"
        example: "Apply ./manifests/jobsearch.yaml"
        relatedTools: ["k8s_get"]
        priority: 5
      k8s_listNamespaces:
        usageHint: "Discover namespaces"
        example: "List namespaces"
        relatedTools: ["k8s_getPods"]
        priority: 2
      k8s_listContexts:
        usageHint: "List kubeconfig contexts when switching clusters"
        example: "List available contexts"
        relatedTools: []
        priority: 2

  mcp-ops:
    description: "Operational tools for k3s/Harvester (kubectl + SSH helpers)"
    category: "kubernetes"
    tools:
      k8s_get_nodes:
        usageHint: "Cluster-level health snapshot; use first during incidents"
        example: "Get node status and IPs"
        relatedTools: ["vip_label_node", "stabilize_cluster"]
        priority: 1
      k8s_scale_deploy:
        usageHint: "Scale a deployment; verify with k8s_get_nodes or k8s tools"
        example: "Scale a deployment to 0/1/2 replicas"
        relatedTools: ["stabilize_cluster"]
        priority: 2
      k8s_delete_pods_by_phase:
        usageHint: "Bulk-delete pods stuck in bad phases (Failed/Evicted/etc); use labelSelector to narrow"
        example: "Delete Failed/Evicted pods in a namespace"
        relatedTools: ["stabilize_cluster"]
        priority: 3
      vip_label_node:
        usageHint: "Adjust kube-vip eligibility when failing over VIP"
        example: "Mark a node eligible=true"
        relatedTools: ["k8s_get_nodes"]
        priority: 3
      k3s_service_logs:
        usageHint: "Fetch systemd logs for k3s service on a node"
        example: "Get last 200 lines of k3s logs"
        relatedTools: ["k3s_repair_server"]
        priority: 4
      k3s_repair_server:
        usageHint: "Attempt common repairs for a broken k3s node"
        example: "Repair k3s server via SSH"
        relatedTools: ["k3s_service_logs"]
        priority: 4
      stabilize_cluster:
        usageHint: "Multi-step stabilization (label nodes, restart deployments, delete bad pods)"
        example: "Stabilize cluster during control-plane issues"
        relatedTools: ["k8s_get_nodes", "k8s_delete_pods_by_phase"]
        priority: 5

  mcp-tavily:
    description: "Web search for real-time information"
    category: "research"
    tools:
      search:
        usageHint: "Search web for current information beyond training data"
        example: "Find latest documentation or news"
        relatedTools: []
        priority: 1

  mcp-prometheus:
    description: "Prometheus metrics queries"
    category: "monitoring"
    tools:
      query:
        usageHint: "Execute PromQL query for metrics"
        example: "Check error rates or latency"
        relatedTools: ["query_range"]
        priority: 1
      query_range:
        usageHint: "Query metrics over time range for trends"
        example: "Analyze performance over last hour"
        relatedTools: ["query"]
        priority: 2

  mcp-loki:
    description: "Loki log queries"
    category: "monitoring"
    tools:
      query_logs:
        usageHint: "Search logs using LogQL"
        example: "Find errors in application logs"
        relatedTools: []
        priority: 1

  mcp-docker:
    description: "Docker CLI operations (containers, images, logs, inspect, exec)"
    category: "infrastructure"
    tools:
      docker_version:
        usageHint: "Start here to confirm Docker CLI and daemon connectivity"
        example: "Check client/server versions before debugging failures"
        relatedTools: ["docker_info"]
        priority: 1
      docker_info:
        usageHint: "Inspect daemon configuration, storage driver, and runtime details"
        example: "Confirm Docker root dir, cgroup driver, and enabled runtimes"
        relatedTools: ["docker_version"]
        priority: 2
      docker_ps:
        usageHint: "List containers; use filters to narrow by name/status/label"
        example: "Find running containers matching a prefix"
        relatedTools: ["docker_logs", "docker_inspect"]
        priority: 1
      docker_images:
        usageHint: "List images; use filters like dangling=true or reference=repo:*"
        example: "Check if an image tag exists locally"
        relatedTools: ["docker_inspect"]
        priority: 3
      docker_inspect:
        usageHint: "Deep inspect of containers/images/volumes/networks"
        example: "Inspect a container to find mounts, env, and networks"
        relatedTools: ["docker_ps", "docker_images"]
        priority: 2
      docker_logs:
        usageHint: "Fetch recent container logs; set tail to keep output small"
        example: "Tail 200 lines for a failing container"
        relatedTools: ["docker_ps"]
        priority: 2
      docker_exec:
        usageHint: "Run a command inside a container; prefer read-only commands unless you intend changes"
        example: "Exec 'ls -la' or 'cat /etc/os-release' in a container"
        relatedTools: ["docker_ps", "docker_inspect"]
        priority: 4

  mcp-redis:
    description: "Redis cache inspection and monitoring"
    category: "data-stores"
    tools:
      redis_info:
        usageHint: "Get server stats and configuration; use section param to limit output"
        example: "Get memory stats with section=memory"
        relatedTools: ["redis_dbsize", "redis_memory"]
        priority: 1
      redis_keys:
        usageHint: "Scan keys by pattern; uses SCAN (safe for production). Limit count to avoid large outputs"
        example: "Find session keys with pattern='session:*'"
        relatedTools: ["redis_get", "redis_ttl"]
        priority: 2
      redis_get:
        usageHint: "Get value for any key type (string, list, set, zset, hash, stream)"
        example: "Inspect a cached value or session data"
        relatedTools: ["redis_keys", "redis_ttl", "redis_memory"]
        priority: 2
      redis_ttl:
        usageHint: "Check when a key expires; useful for debugging cache behavior"
        example: "Check if a session key is about to expire"
        relatedTools: ["redis_get", "redis_keys"]
        priority: 3
      redis_memory:
        usageHint: "Check memory usage for a key or server-wide stats"
        example: "Find large keys consuming memory"
        relatedTools: ["redis_info", "redis_get"]
        priority: 3
      redis_slowlog:
        usageHint: "Find slow queries for performance debugging"
        example: "Get last 10 slow commands"
        relatedTools: ["redis_info", "redis_client_list"]
        priority: 4
      redis_client_list:
        usageHint: "List connected clients; useful for debugging connection issues"
        example: "Find which apps are connected to Redis"
        relatedTools: ["redis_info", "redis_pubsub_channels"]
        priority: 4
      redis_pubsub_channels:
        usageHint: "List active pub/sub channels and subscriber counts"
        example: "See which channels have active subscribers"
        relatedTools: ["redis_client_list"]
        priority: 5
      redis_config_get:
        usageHint: "Get Redis configuration parameters"
        example: "Check maxmemory settings"
        relatedTools: ["redis_info"]
        priority: 5
      redis_dbsize:
        usageHint: "Quick count of keys in current database"
        example: "Check if cache is populated"
        relatedTools: ["redis_info", "redis_keys"]
        priority: 3

# Category definitions for profile-based filtering
categories:
  version-control:
    description: "Git and version control tools"
    servers: ["mcp-git", "mcp-git-worktree"]

  collaboration:
    description: "GitHub, GitLab, and code review tools"
    servers: ["mcp-github", "mcp-gitlab"]

  file-operations:
    description: "File system and text manipulation"
    servers: ["mcp-filesystem", "mcp-ripgrep"]

  kubernetes:
    description: "Kubernetes cluster management"
    servers: ["mcp-k8s", "mcp-k8s-ops", "mcp-ops", "mcp-helm"]

  monitoring:
    description: "Metrics, logs, and observability"
    servers: ["mcp-prometheus", "mcp-loki", "mcp-grafana"]

  research:
    description: "Web search and information gathering"
    servers: ["mcp-tavily", "mcp-youtube", "mcp-context7"]

  infrastructure:
    description: "Infrastructure and deployment tools"
    servers: ["mcp-terraform", "mcp-ansible", "mcp-docker"]

  data-stores:
    description: "Database and cache inspection tools"
    servers: ["mcp-postgres", "mcp-redis", "mcp-qdrant"]

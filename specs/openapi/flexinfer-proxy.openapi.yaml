openapi: 3.0.3
info:
  title: FlexInfer Proxy API
  version: 0.1.0
  description: |
    FlexInfer proxy endpoints used for model discovery, health, and OpenAI-style routing.

    Notes:
    - Most inference paths are reverse-proxied to the selected backend; this spec documents only the stable surface.
    - Model selection can be provided via:
      - `X-Model-ID` header
      - `/model/<name>/...` URL prefix
      - JSON body field `"model"` for `application/json` POSTs (OpenAI-compatible)
servers:
  - url: http://flexinfer-proxy.flexinfer-system.svc

paths:
  /healthz:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: string

  /v1/models:
    get:
      summary: List available models (OpenAI-compatible)
      responses:
        '200':
          description: OpenAI model list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIModelsResponse'

  /v1/models/{name}:
    get:
      summary: One model with its cold capability descriptor (never wakes the lane)
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
          description: CR name, served name or alias.
      responses:
        '200':
          description: OpenAI model object with the `flexinfer` descriptor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIModel'
        '404':
          description: Unknown (`model_not_found`) or parked (`model_parked`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/jobs:
    post:
      summary: Submit an async job (docs/specs/proxy-api.md, "Jobs")
      responses:
        '200':
          description: The job object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
    get:
      summary: List jobs (status, model, limit filters)
      responses:
        '200':
          description: List of job objects
  /v1/jobs/{id}:
    get:
      summary: Get a job
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
      responses:
        '200':
          description: The job object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
  /v1/jobs/{id}/content:
    get:
      summary: The stored output of a completed job
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
      responses:
        '200':
          description: The lane's response body, with its content type
        '409':
          description: The job is not completed (`job_not_completed`)
  /v1/jobs/{id}/cancel:
    post:
      summary: Cancel a job
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
      responses:
        '200':
          description: The job object

  /v1/audio/transcriptions:
    post:
      summary: OpenAI-style transcription (reverse proxied), or a diarize job
      description: |
        Without `diarize` (and without `speaker` in `timestamp_granularities[]`) the request is
        forwarded to the selected ASR lane byte for byte, exactly as before D5-a; `background=true`
        makes it an ordinary job.

        With `diarize=true` (or `timestamp_granularities[]=speaker`) the request is always a job
        (docs/specs/proxy-api.md, "Diarized transcriptions"): the answer is the job object, and the
        job's content is a `DiarizedTranscription`. The ASR lane must name a diarization lane
        (`flexinfer.ai/diarization-model`, or the `diarization_model` field) whose GPUProfile
        certifies the pyannote backend; otherwise 501 `diarization_not_certified`, and the ASR
        lane's descriptor (`GET /v1/models/{name}`, `flexinfer.diarization`) says why.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, model]
              properties:
                file: {type: string, format: binary}
                model: {type: string}
                language: {type: string}
                prompt: {type: string}
                temperature: {type: number}
                response_format:
                  type: string
                  description: With diarize, only json, verbose_json or diarized_json (all answer a DiarizedTranscription).
                timestamp_granularities[]:
                  type: array
                  items: {type: string, enum: [word, segment, speaker]}
                background: {type: boolean}
                diarize:
                  type: boolean
                  description: flexinfer extension (D5-a). Run the transcription as a job and label words with speakers.
                diarization_model:
                  type: string
                  description: flexinfer extension. Overrides the ASR lane's flexinfer.ai/diarization-model.
                num_speakers: {type: integer, minimum: 1, maximum: 64}
                min_speakers: {type: integer, minimum: 1, maximum: 64}
                max_speakers: {type: integer, minimum: 1, maximum: 64}
      responses:
        '200':
          description: The lane's transcription (passthrough), or the job object for a diarize or background request
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    additionalProperties: true
                  - $ref: '#/components/schemas/Job'
        '400':
          description: A diarize request with stream=true or a response_format other than json, verbose_json or diarized_json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '501':
          description: |
            `diarization_not_certified` (no certified diarization lane for this ASR lane; not retryable) or
            `jobs_disabled` (diarize needs the job API).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/chat/completions:
    post:
      summary: OpenAI-style chat completions (reverse proxied)
      description: |
        This endpoint is forwarded to the selected backend service.
        The proxy uses the request body field `"model"` for selection when present.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequest'
      parameters:
        - in: header
          name: X-Model-ID
          required: false
          schema:
            type: string
          description: Optional explicit model selection override.
      responses:
        '200':
          description: Backend response (passthrough)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '503':
          description: |
            The lane cannot serve now (cold start with `Prefer: wait=N`, queue full, parked,
            preempted, failed, stalled load, breaker open). Always carries `Retry-After`.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    DiarizedTranscription:
      type: object
      description: |
        Content of a completed diarize job: the ASR lane's verbose_json with every field kept, the
        words labelled with speakers, and the diarization lane's turns.
      required: [text, words, speakers, utterances, diarization]
      properties:
        text: {type: string}
        language: {type: string}
        duration: {type: number}
        segments:
          type: array
          description: The ASR lane's segments, unchanged.
          items: {type: object, additionalProperties: true}
        words:
          type: array
          items:
            type: object
            required: [word, start, end]
            properties:
              word: {type: string}
              start: {type: number}
              end: {type: number}
              probability: {type: number}
              speaker:
                type: string
                description: The speaker whose turns overlap the word longest; absent when no turn is within 1 s.
        speakers:
          type: array
          items: {type: string}
        utterances:
          type: array
          items:
            type: object
            properties:
              speaker: {type: string}
              start: {type: number}
              end: {type: number}
              text: {type: string}
        diarization:
          type: object
          properties:
            model: {type: string, description: The diarization lane.}
            pipeline: {type: string, example: pyannote/speaker-diarization-3.1}
            num_speakers: {type: integer}
            segments:
              type: array
              items:
                type: object
                properties:
                  start: {type: number}
                  end: {type: number}
                  speaker: {type: string}

    Job:
      type: object
      required: [id, object, created_at, status]
      properties:
        id: {type: string}
        object: {type: string, example: job}
        created_at: {type: integer}
        status: {type: string, enum: [queued, in_progress, completed, failed, cancelled, incomplete]}
        background: {type: boolean}
        model: {type: string}
        path: {type: string}
        progress: {type: integer}
        started_at: {type: integer, nullable: true}
        completed_at: {type: integer, nullable: true}
        expires_at: {type: integer, nullable: true}
        error:
          type: object
          nullable: true
          properties:
            code: {type: string}
            message: {type: string}
            status: {type: integer}
        output:
          type: object
          nullable: true
          properties:
            url: {type: string}
            content_type: {type: string}
            bytes: {type: integer}
            sha256: {type: string}
        flexinfer:
          type: object
          additionalProperties: true

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message, type, code]
          properties:
            message:
              type: string
            type:
              type: string
            param:
              type: string
            code:
              type: string
              description: See docs/specs/proxy-api.md, "Error envelope".
            flexinfer:
              $ref: '#/components/schemas/FlexInferErrorDetails'

    FlexInferErrorDetails:
      type: object
      description: Lane state on a proxy-originated error. All keys are present; unknown values are null.
      required: [phase, loading_substage, eta_seconds, retry_after_seconds, reroute_to, queue_position]
      properties:
        phase:
          type: string
          nullable: true
        loading_substage:
          type: string
          nullable: true
        eta_seconds:
          type: integer
          nullable: true
        retry_after_seconds:
          type: integer
          nullable: true
        reroute_to:
          type: string
          nullable: true
        queue_position:
          type: integer
          nullable: true
          description: 1-based place in the lane's QoS class queue on a QoS queue_full; null otherwise.

    OpenAIModelsResponse:
      type: object
      required: [object, data]
      properties:
        object:
          type: string
          example: list
        data:
          type: array
          items:
            $ref: '#/components/schemas/OpenAIModel'

    OpenAIModel:
      type: object
      required: [id, object, created, owned_by]
      properties:
        id:
          type: string
        object:
          type: string
          example: model
        created:
          type: integer
          format: int64
        owned_by:
          type: string
          example: flexinfer
        metadata:
          type: object
          additionalProperties: true
        flexinfer:
          type: object
          description: Cold capability descriptor (docs/specs/proxy-api.md, "GET /v1/models/{name}").
          additionalProperties: true

    ChatCompletionRequest:
      type: object
      required: [model, messages]
      properties:
        model:
          type: string
          description: Model name to route to.
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
        stream:
          type: boolean
          description: Backend-dependent; proxy forwards without interpretation.
      additionalProperties: true

    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [system, user, assistant, tool]
        content:
          oneOf:
            - type: string
            - type: array
              items:
                type: object
                additionalProperties: true
      additionalProperties: true


# Retrieval-quality gate (F3 plan Slice 5) — gauntlet companion.
#
# Runs the kill-test harness in retrieval-only RQ_GATE mode so it emits an
# RQ_RESULT_JSON gate row (rqgate kernel: ev_ratio recall + judge_ratio synthesis
# vs absolute thresholds) for an answer model against a qdrant collection — the
# retrieval-quality sibling of model-eval-gauntlet's throughput row.
#
# Retrieval-only (SKIP_NAIVE=1) so there is NO NFS workspace mount: the gate needs
# only proxy (embed/rerank/generate/judge) + qdrant (the index) + the question set.
# That makes it cheaper and simpler than job.example.yaml (the kill-test, which
# mounts the repo for naive stuffing).
#
# Create the two ConfigMaps first (the script CM carries BOTH f3eval.py and the
# rqgate.py kernel it imports — single source, no inline copy in a Flux resource):
#   kubectl -n flexinfer-system create configmap f3-rqgate-script \
#     --from-file=f3eval.py=f3eval.py --from-file=rqgate.py=rqgate.py
#   kubectl -n flexinfer-system create configmap f3-rqgate-questions \
#     --from-file=questions.json=questions.hard.loomcore.json
#   kubectl -n flexinfer-system apply -f job.rq.example.yaml
#   kubectl -n flexinfer-system logs -f job/f3-rqgate | grep RQ_RESULT_JSON
apiVersion: batch/v1
kind: Job
metadata:
  name: f3-rqgate
  namespace: flexinfer-system
  labels:
    app.kubernetes.io/part-of: flexinfer
    flexinfer.ai/purpose: idle-batch
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 172800
  activeDeadlineSeconds: 2700
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: flexinfer
        flexinfer.ai/purpose: idle-batch
    spec:
      restartPolicy: Never
      containers:
        - name: rqgate
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command: ["python3", "/scripts/f3eval.py"]
          env:
            - name: PROXY_URL
              value: "http://flexinfer-proxy.flexinfer-system.svc.cluster.local"
            - name: EMBED_MODEL
              value: "bge-large-radeonvii"
            - name: RERANK_MODEL
              value: "bge-reranker-radeonvii"
            - name: CHAT_MODEL
              value: "qwen36-35b-mtp-uncensored-5930k"
            - name: JUDGE_MODEL
              value: "gemma4-26b-a4b-gptq"
            - name: QUESTIONS_FILE
              value: "/questions/questions.json"
            - name: QDRANT_URL
              value: "http://192.168.50.176:6333"
            - name: COLLECTION
              value: "codebase_memory_bge_v1"
            - name: QDRANT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: qdrant-credentials
                  key: api-key
            # retrieval-only + gate on
            - name: SKIP_NAIVE
              value: "1"
            - name: RQ_GATE
              value: "1"
            - name: RETR_N
              value: "24"
            - name: RETR_K
              value: "6"
            # Provisional thresholds (Slice-3 hard-set: ev ~0.83, judge ~0.47).
            # Tune against the first live run; FAIL is advisory unless a wrapper
            # acts on the RQ_RESULT_JSON verdict (RQ_FAIL_ON_GATE is read by a
            # looping wrapper, not by f3eval itself).
            - name: RQ_MIN_JUDGE_RATIO
              value: "0.6"
            - name: RQ_MIN_EV_RATIO
              value: "0.8"
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
            - name: questions
              mountPath: /questions
              readOnly: true
          resources:
            requests:
              cpu: "1"
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi
      volumes:
        - name: script
          configMap:
            name: f3-rqgate-script
            defaultMode: 0755
        - name: questions
          configMap:
            name: f3-rqgate-questions

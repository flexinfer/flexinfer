apiVersion: batch/v1
kind: Job
metadata:
  name: f3-killtest
  namespace: flexinfer-system
  labels:
    app.kubernetes.io/part-of: flexinfer
    flexinfer.ai/purpose: kill-test
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 172800
  activeDeadlineSeconds: 2700
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: flexinfer
        flexinfer.ai/purpose: kill-test
    spec:
      restartPolicy: Never
      containers:
        - name: f3eval
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command: ["python3", "/scripts/f3eval.py"]
          env:
            - name: PROXY_URL
              value: "http://flexinfer-proxy.flexinfer-system.svc.cluster.local"
            - name: EMBED_MODEL
              value: "bge-large-radeonvii"
            - name: RERANK_MODEL
              value: "bge-reranker-radeonvii"
            - name: CHAT_MODEL
              value: "qwen36-35b-mtp-uncensored-5930k"
            - name: JUDGE_MODEL
              value: "gemma4-26b-a4b-gptq"
            - name: REPO_PATH
              value: "/workspace/services/loom-core"
            - name: REPO_NAME
              value: "loom-core"
            - name: QUESTIONS_FILE
              value: "/questions/questions.json"
            - name: QDRANT_URL
              value: "http://192.168.50.176:6333"
            - name: COLLECTION
              value: "codebase_memory_bge_v1"
            - name: QDRANT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: qdrant-credentials
                  key: api-key
            - name: NAIVE_CHAR_BUDGET
              value: "120000"
            - name: RETR_N
              value: "24"
            - name: RETR_K
              value: "6"
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
            - name: questions
              mountPath: /questions
              readOnly: true
            - name: workspace
              mountPath: /workspace
              readOnly: true
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 2Gi
      volumes:
        - name: script
          configMap:
            name: f3-killtest-script
            defaultMode: 0755
        - name: questions
          configMap:
            name: f3-killtest-questions
        - name: workspace
          nfs:
            server: 192.168.50.211
            path: /srv/nas/pilot3/nas-media-bulk/devbox-ws
            readOnly: true

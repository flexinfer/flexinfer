apiVersion: v1
data:
  server.yaml: |
    always_allow:
        - pg_list_databases
        - pg_list_tables
        - pg_describe_table
        - pg_query
        - pg_explain
        - pg_active_queries
        - pg_table_stats
    categories:
        - database
    description: PostgreSQL database inspection and read-only queries
    name: postgres
    timeout: 60
kind: ConfigMap
metadata:
  labels:
    app: postgres
    component: mcp-server
  name: postgres-config

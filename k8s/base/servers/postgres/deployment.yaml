apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: postgres
    component: mcp-server
    mcp.server/name: postgres
    mcp.server/type: custom
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      annotations:
        mcp.server/categories: database
        mcp.server/description: PostgreSQL database inspection and read-only queries
      labels:
        app: postgres
        component: mcp-server
        mcp.server/name: postgres
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - env:
            - name: LOG_LEVEL
              value: info
            - name: POSTGRES_QUERY_TIMEOUT
              value: "30"
            - name: POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  key: POSTGRES_URL
                  name: loom-secrets
            - name: MCP_TRANSPORT
              value: websocket
            - name: MCP_WS_PORT
              value: "8080"
            - name: MCP_SERVER_NAME
              value: postgres
            - name: MCP_SERVER_COMMAND
              value: /app/services/loom-core/bin/mcp-postgres
          image: registry.harbor.lan/mcp/custom-server:latest
          imagePullPolicy: IfNotPresent
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          name: postgres
          ports:
            - containerPort: 8080
              name: websocket
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000

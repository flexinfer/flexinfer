apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: mobile-hud
    component: mobile-hud
  name: mobile-hud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mobile-hud
  template:
    metadata:
      labels:
        app: mobile-hud
        component: mobile-hud
    spec:
      serviceAccountName: loom-hub
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: loomd
          # Concrete SHA tag is set via the platform/gitops Kustomization
          # `images:` override (kustomization-loom-hub-servers.yaml). The
          # `:latest` placeholder here only matches the override key.
          image: registry.harbor.lan/mcp/loom-core:latest
          # Always pull on rollout so a SHA bump in the gitops Kustomization
          # picks up the new image even when the previous SHA was already
          # cached on the node. Without this, IfNotPresent kept pods on
          # whatever was first pulled, and SHA bumps silently no-op'd.
          imagePullPolicy: Always
          command:
            - /usr/local/bin/loomd
          args:
            - --registry
            - /etc/loom/registry.yaml
            - --warm
            - agent_context
            - --target
            - codex
            - --hub-url
            - ws://loom-gateway.loom-hub.svc.cluster.local/ws
            - --hub-fallback=true
            - --metrics-addr
            - 127.0.0.1:9876
            - --hud-port
            - "3333"
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://langfuse-web.ai.svc.cluster.local:3000/api/public/otel"
            - name: LOOM_AUDIT_ENABLED
              value: "true"
            - name: LOOM_AUDIT_LOG_PATH
              value: /home/mcp/.config/loom/audit.jsonl
            - name: QDRANT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: loom-secrets
                  key: QDRANT_API_KEY
            - name: MORPH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: loom-secrets
                  key: MORPH_API_KEY
            - name: MORPH_BASE_URL
              value: https://api.morphllm.com/v1
            - name: MORPH_EMBED_MODEL
              value: morph-embedding-v3
            # HUD configuration (previously in separate hud container)
            - name: HUD_BIND_ADDRESS
              value: 0.0.0.0
            - name: HUD_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: loom-secrets
                  key: HUD_ADMIN_TOKEN
            - name: HUD_MOBILE_OPERATOR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: loom-secrets
                  key: HUD_MOBILE_OPERATOR_TOKEN
            - name: HUD_MOBILE_OPERATOR_SCOPES
              valueFrom:
                secretKeyRef:
                  name: loom-secrets
                  key: HUD_MOBILE_OPERATOR_SCOPES
            - name: CACHE_BACKEND
              value: memory
            - name: SPAWN_ENABLED
              value: "true"
            - name: SPAWN_REGISTRY
              value: registry.harbor.lan/mcp
            - name: SPAWN_NAMESPACE
              value: devbox
            - name: SPAWN_SYNC_MODE
              value: git-clone
            - name: SPAWN_GIT_BASE_URL
              value: http://192.168.50.218/services
            - name: SPAWN_GIT_SECRET
              value: gitlab-creds
            - name: SPAWN_PROJECTS
              value: "loom-core,flexdeck,flexinfer,homelab-homepage,storyboard-generator,jobsearch-app"
            - name: SPAWN_DEFAULT_CPU
              value: "0.5"
            - name: SPAWN_DEFAULT_MEMORY_MB
              value: "2048"
            - name: SPAWN_MAX_CONCURRENT_BUILDS
              value: "1"
            - name: SPAWN_BUILD_CPU_REQUEST
              value: 250m
            - name: SPAWN_BUILD_CPU_LIMIT
              value: 500m
            # Embedded weaver (LLM-orchestrated multi-tool queries)
            - name: WEAVER_ENABLED
              value: "true"
            - name: FLEXINFER_URL
              valueFrom:
                secretKeyRef:
                  name: loom-secrets
                  key: FLEXINFER_URL
            - name: WEAVER_ROUTER_MODEL
              valueFrom:
                secretKeyRef:
                  name: loom-secrets
                  key: WEAVER_ROUTER_MODEL
                  optional: true
            - name: WEAVER_SUBAGENT_MODEL
              valueFrom:
                secretKeyRef:
                  name: loom-secrets
                  key: WEAVER_SUBAGENT_MODEL
                  optional: true
            # Mills operator proxy. Setting LOOM_MILLS_OPERATOR_URL flips
            # the HUD's mills proxy from "503 — operator not configured"
            # to live read-through against the loom-mills-operator
            # service in the loom-mills namespace. Reads (Council
            # panel, Pipelines panel, Backlog, Audit, Cross-repo,
            # Squads, Debate transcripts) work immediately. Mutations
            # (POST /council/run, /subrun, etc.) additionally require
            # LOOM_MILLS_OPERATOR_TOKEN; until that's wired through
            # SOPS into loom-secrets, mutating endpoints respond 401
            # (graceful — the panels stay read-only).
            - name: LOOM_MILLS_OPERATOR_URL
              value: http://loom-mills-operator.loom-mills.svc.cluster.local:8090
            - name: LOOM_MILLS_OPERATOR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: loom-secrets
                  key: LOOM_MILLS_OPERATOR_TOKEN
                  optional: true
            # HUD_PIPELINE_PROJECTS is intentionally unset: the embedded HUD
            # auto-discovers projects via the `gitlab__list_projects` MCP tool
            # at startup (internal/hud/embed.go). Set this env var explicitly
            # only to pin a smaller subset of projects for pipeline monitoring.
          ports:
            - containerPort: 9876
              name: metrics
            - containerPort: 3333
              name: http
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3333
            initialDelaySeconds: 8
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3333
            initialDelaySeconds: 12
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
          volumeMounts:
            - name: registry
              mountPath: /etc/loom
              readOnly: true
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      volumes:
        - name: registry
          configMap:
            name: mobile-hud-registry

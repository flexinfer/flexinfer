apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: mobile-hud
    component: mobile-hud
  name: mobile-hud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mobile-hud
  template:
    metadata:
      labels:
        app: mobile-hud
        component: mobile-hud
    spec:
      serviceAccountName: loom-hub
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: loomd
          image: registry.harbor.lan/mcp/loom-core:latest
          imagePullPolicy: IfNotPresent
          command:
            - /usr/local/bin/loomd
          args:
            - --registry
            - /etc/loom/registry.yaml
            - --warm
            - agent_context
            - --target
            - codex
            - --hub-url
            - ws://loom-gateway.loom-hub.svc.cluster.local/ws
            - --hub-fallback=true
            - --metrics-addr
            - 127.0.0.1:9876
            - --hud-port
            - "3333"
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://langfuse-web.ai.svc.cluster.local:3000/api/public/otel"
            - name: QDRANT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: loom-secrets
                  key: QDRANT_API_KEY
            - name: MORPH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: loom-secrets
                  key: MORPH_API_KEY
            - name: MORPH_BASE_URL
              value: https://api.morphllm.com/v1
            - name: MORPH_EMBED_MODEL
              value: morph-embedding-v3
            # HUD configuration (previously in separate hud container)
            - name: HUD_BIND_ADDRESS
              value: 0.0.0.0
            - name: HUD_MOBILE_OPERATOR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: loom-secrets
                  key: HUD_MOBILE_OPERATOR_TOKEN
            - name: HUD_MOBILE_OPERATOR_SCOPES
              valueFrom:
                secretKeyRef:
                  name: loom-secrets
                  key: HUD_MOBILE_OPERATOR_SCOPES
            - name: CACHE_BACKEND
              value: memory
            - name: SPAWN_ENABLED
              value: "true"
            - name: SPAWN_REGISTRY
              value: registry.harbor.lan/mcp
            - name: SPAWN_NAMESPACE
              value: devbox
            - name: SPAWN_SYNC_MODE
              value: git-clone
            - name: SPAWN_GIT_BASE_URL
              value: http://192.168.50.218/services
            - name: SPAWN_GIT_SECRET
              value: gitlab-creds
            - name: SPAWN_PROJECTS
              value: "loom-core,flexdeck,flexinfer,homelab-homepage,storyboard-generator,jobsearch-app"
            # Embedded weaver (LLM-orchestrated multi-tool queries)
            - name: WEAVER_ENABLED
              value: "true"
            - name: FLEXINFER_URL
              valueFrom:
                secretKeyRef:
                  name: loom-secrets
                  key: FLEXINFER_URL
            - name: WEAVER_ROUTER_MODEL
              valueFrom:
                secretKeyRef:
                  name: loom-secrets
                  key: WEAVER_ROUTER_MODEL
            - name: WEAVER_SUBAGENT_MODEL
              valueFrom:
                secretKeyRef:
                  name: loom-secrets
                  key: WEAVER_SUBAGENT_MODEL
            - name: HUD_PIPELINE_PROJECTS
              value: >-
                labs/game,labs/git-tunes,labs/metelevator,
                libs/banner-kit,libs/design-token-sync,libs/fi-accel,libs/fi-fhir,
                libs/fi-gitlab-hookify,libs/fi-mcp-kit,libs/fractal-agents,
                libs/langgraph-agents,libs/mcp-go,libs/py-browser-kit,
                libs/py-changelog-ai,libs/py-chiptune,libs/py-codebase-memory,
                libs/py-diagram-gen,libs/py-git-chronicles,libs/py-llm-kit,
                libs/py-observability,libs/py-resilience,libs/py-sprite-kit,
                libs/py-vector-utils,libs/py-visual-kit,libs/svg-sdk,
                libs/ts-resilience,libs/ts-vscode-utils,libs/visual-kit,
                platform/gitops,
                services/ai-assisted-dev-starter,services/comfyui-images-proxy,
                services/diff-surgeon,services/fi-mcp-gateway,services/flexdeck,
                services/flexinfer,services/flexinfer-site,services/homelab-homepage,
                services/imagegen-ui,services/jobsearch-app,services/k8s-cost-prophet,
                services/kennedi-consulting-site,services/loom-core,services/loom-zed,
                services/loom,services/mcp-gateway,services/mcp-orchestra,
                services/mcp-sandbox,services/mentatlab,services/news-analyzer,
                services/storyboard-generator,services/streamslate,
                services/streamslate-site,services/substack,services/tech-radar
          ports:
            - containerPort: 9876
              name: metrics
            - containerPort: 3333
              name: http
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3333
            initialDelaySeconds: 8
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3333
            initialDelaySeconds: 12
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
          volumeMounts:
            - name: registry
              mountPath: /etc/loom
              readOnly: true
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      volumes:
        - name: registry
          configMap:
            name: mobile-hud-registry

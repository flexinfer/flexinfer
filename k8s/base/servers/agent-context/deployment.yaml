apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: agent-context
    component: mcp-server
    mcp.server/name: agent_context
    mcp.server/type: custom
  name: agent-context
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-context
  template:
    metadata:
      annotations:
        mcp.server/categories: dev,context,memory
        mcp.server/description: Agent context management - sessions, retrieval, cross-agent coordination
      labels:
        app: agent-context
        component: mcp-server
        mcp.server/name: agent_context
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - env:
            # Qdrant configuration (Harvester VM)
            - name: AGENT_CONTEXT_QDRANT_URL
              value: http://192.168.50.176:6333
            - name: QDRANT_API_KEY
              valueFrom:
                secretKeyRef:
                  key: QDRANT_API_KEY
                  name: loom-secrets
            - name: AGENT_CONTEXT_COLLECTION
              value: agent_context_v1
            - name: AGENT_CONTEXT_SESSIONS_COLLECTION
              value: agent_sessions_v1
            # Embeddings (Morph API)
            - name: MORPH_API_KEY
              valueFrom:
                secretKeyRef:
                  key: MORPH_API_KEY
                  name: loom-secrets
            - name: MORPH_BASE_URL
              value: https://api.morphllm.com/v1
            - name: MORPH_EMBED_MODEL
              value: morph-embedding-v3
            # Auto-summarization settings
            - name: AGENT_CONTEXT_AUTO_SUMMARIZE
              value: "true"
            - name: AGENT_CONTEXT_DEFAULT_TOKEN_BUDGET
              value: "4000"
            # Logging
            - name: LOG_LEVEL
              value: info
            # MCP transport settings
            - name: MCP_TRANSPORT
              value: websocket
            - name: MCP_WS_PORT
              value: "8080"
            - name: MCP_SERVER_NAME
              value: agent_context
            - name: MCP_SERVER_COMMAND
              value: /app/services/loom-core/bin/mcp-agent-context
          image: registry.harbor.lan/mcp/custom-server:latest
          imagePullPolicy: IfNotPresent
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          name: agent-context
          ports:
            - containerPort: 8080
              name: websocket
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000

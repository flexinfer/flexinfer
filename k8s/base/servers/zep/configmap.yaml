apiVersion: v1
data:
  server.yaml: |
    always_allow:
        - zep_health
        - zep_add_messages
        - zep_get_messages
    categories:
        - memory
    description: Zep Cloud memory (sessions/messages) via MCP (Go native)
    name: zep
    timeout: 60
kind: ConfigMap
metadata:
  labels:
    app: zep
    component: mcp-server
  name: zep-config

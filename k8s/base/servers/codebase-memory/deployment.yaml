apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: codebase-memory
    component: mcp-server
    mcp.server/name: codebase_memory
    mcp.server/type: custom
  name: codebase-memory
spec:
  replicas: 1
  selector:
    matchLabels:
      app: codebase-memory
  template:
    metadata:
      annotations:
        mcp.server/categories: dev,code,search
        mcp.server/description: Semantic codebase indexing + search (Go native)
      labels:
        app: codebase-memory
        component: mcp-server
        mcp.server/name: codebase_memory
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - env:
            - name: CODEBASE_QDRANT_COLLECTION
              value: codebase_memory_v1
            - name: LOG_LEVEL
              value: info
            - name: MORPH_API_KEY
              valueFrom:
                secretKeyRef:
                  key: MORPH_API_KEY
                  name: loom-secrets
            - name: MORPH_BASE_URL
              value: https://api.morphllm.com/v1
            - name: MORPH_EMBED_MODEL
              value: morph-embedding-v3
            - name: QDRANT_API_KEY
              valueFrom:
                secretKeyRef:
                  key: QDRANT_API_KEY
                  name: loom-secrets
            - name: QDRANT_URL
              value: http://192.168.50.176:6333
            # Default HTTP_TIMEOUT (30s) was insufficient for large
            # qdrant upsert batches with wait=true — the codebase_memory_v1
            # collection has 50K+ points and HNSW reindexing on each
            # upsert pushed batches over 30s, causing index runs to
            # fail with "context deadline exceeded". 5min headroom.
            # NOTE: pkg/httpclient parses this as bare integer seconds
            # (strconv.Atoi); the "s" suffix would silently fall back
            # to the default 30s.
            - name: HTTP_TIMEOUT
              value: "300"
            # Larger upsert batches are safe again now that bulk batches
            # default to wait=false (only the final batch of each flush
            # blocks on Qdrant's WAL+HNSW), and HTTP_TIMEOUT=300 leaves
            # plenty of headroom for the trailing wait=true call. Bumped
            # from 32 back to 128 to amortize round-trip overhead.
            # Rollback hatch: set CODEBASE_UPSERT_WAIT=true to force
            # wait=true on every batch without a code change.
            - name: CODEBASE_UPSERT_BATCH_SIZE
              value: "128"
            - name: MCP_TRANSPORT
              value: websocket
            - name: MCP_WS_PORT
              value: "8080"
            - name: MCP_SERVER_NAME
              value: codebase_memory
            - name: MCP_SERVER_COMMAND
              value: /app/services/loom-core/bin/mcp-codebase-memory
          image: registry.harbor.lan/mcp/custom-server:latest
          imagePullPolicy: IfNotPresent
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          name: codebase-memory
          ports:
            - containerPort: 8080
              name: websocket
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: "2"
              memory: 4Gi
            requests:
              cpu: 200m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
          volumeMounts:
            # Read-only mount of the shared NFS workspace so the
            # indexer can read codebases on disk (e.g.
            # /workspace/core). The same NFS export the devbox and
            # ICC namespaces already mount; this namespace's PVC is
            # `loom-hub-workspace-nfs` (see
            # platform/gitops/k3s/loom-hub/workspace-pvc.yaml).
            # Indexer never writes here.
            - name: workspace
              mountPath: /workspace
              readOnly: true
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: loom-hub-workspace-nfs
            readOnly: true
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000

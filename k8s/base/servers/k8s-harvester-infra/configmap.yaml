apiVersion: v1
data:
  server.yaml: |
    always_allow:
        - k8s.get
        - k8s.getPods
        - k8s.logs
        - k8s.exec
        - k8s.describe
        - k8s.listNamespaces
        - k8s.apply
        - k8s.listContexts
    categories:
        - kubernetes
        - operations
    description: Kubernetes operations for the Harvester (RKE2) management cluster (Go native)
    name: k8s_harvester_infra
    timeout: 90
kind: ConfigMap
metadata:
  labels:
    app: k8s-harvester-infra
    component: mcp-server
  name: k8s-harvester-infra-config

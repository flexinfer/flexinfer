apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: k8s-harvester-infra
    component: mcp-server
    mcp.server/name: k8s_harvester_infra
    mcp.server/type: custom
  name: k8s-harvester-infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-harvester-infra
  template:
    metadata:
      annotations:
        mcp.server/categories: kubernetes,operations
        mcp.server/description: Kubernetes operations for the Harvester (RKE2) management cluster (Go native)
      labels:
        app: k8s-harvester-infra
        component: mcp-server
        mcp.server/name: k8s_harvester_infra
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - env:
            - name: KUBECONFIG
              value: /Users/cblevins/workspace/platform/gitops/.kube/harvester-admin.yaml
            - name: MCP_K8S_KUBECONFIG
              value: /Users/cblevins/workspace/platform/gitops/.kube/harvester-admin.yaml
            - name: MCP_TRANSPORT
              value: websocket
            - name: MCP_WS_PORT
              value: "8080"
            - name: LOG_LEVEL
              value: info
            - name: MCP_SERVER_NAME
              value: k8s_harvester_infra
            - name: MCP_SERVER_COMMAND
              value: /app/services/loom-core/bin/mcp-k8s-ops
          image: registry.harbor.lan/mcp/custom-server:latest
          imagePullPolicy: IfNotPresent
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          name: k8s-harvester-infra
          ports:
            - containerPort: 8080
              name: websocket
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000

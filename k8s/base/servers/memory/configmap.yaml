apiVersion: v1
data:
  server.yaml: |
    always_allow:
        - create_entities
        - create_relations
        - add_observations
        - delete_entities
        - delete_observations
        - delete_relations
        - read_graph
        - search_nodes
        - open_nodes
    categories:
        - memory
        - knowledge
    description: Knowledge graph memory for persistent context (Go native)
    name: memory
    timeout: 60
kind: ConfigMap
metadata:
  labels:
    app: memory
    component: mcp-server
  name: memory-config

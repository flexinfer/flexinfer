apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: memory
    component: mcp-server
    mcp.server/name: memory
    mcp.server/type: custom
  name: memory
spec:
  replicas: 1
  selector:
    matchLabels:
      app: memory
  template:
    metadata:
      annotations:
        mcp.server/categories: memory,knowledge
        mcp.server/description: Knowledge graph memory for persistent context (Go native)
      labels:
        app: memory
        component: mcp-server
        mcp.server/name: memory
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - env:
            - name: MEMORY_AUTO_SAVE
              value: "true"
            - name: MEMORY_PERSIST_PATH
              value: /home/mcp/.config/loom/memory_graph.json
            - name: MCP_SERVER_NAME
              value: memory
            - name: MCP_TRANSPORT
              value: websocket
            - name: MCP_WS_PORT
              value: "8080"
            - name: LOG_LEVEL
              value: info
            - name: MCP_SERVER_COMMAND
              value: /app/services/loom-core/bin/mcp-memory
          image: registry.harbor.lan/mcp/custom-server:latest
          imagePullPolicy: IfNotPresent
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          name: memory
          ports:
            - containerPort: 8080
              name: websocket
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000

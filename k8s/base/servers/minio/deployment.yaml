apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: minio
    component: mcp-server
    mcp.server/name: minio
    mcp.server/type: custom
  name: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      annotations:
        mcp.server/categories: storage,s3
        mcp.server/description: MinIO/S3 object storage operations (list, get, put)
      labels:
        app: minio
        component: mcp-server
        mcp.server/name: minio
    spec:
      containers:
        - env:
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  key: MINIO_ACCESS_KEY
                  name: loom-secrets
            - name: MINIO_ENDPOINT
              value: http://192.168.50.246:9000
            - name: MINIO_PORT_FORWARD
              value: "false"
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  key: MINIO_SECRET_KEY
                  name: loom-secrets
            - name: MCP_WS_PORT
              value: "8080"
            - name: LOG_LEVEL
              value: info
            - name: MCP_SERVER_NAME
              value: minio
            - name: MCP_TRANSPORT
              value: websocket
            - name: MCP_SERVER_COMMAND
              value: /app/services/loom-core/bin/mcp-minio
          image: registry.harbor.lan/mcp/custom-server:latest
          imagePullPolicy: Always
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          name: minio
          ports:
            - containerPort: 8080
              name: websocket
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000

apiVersion: v1
data:
  server.yaml: |
    always_allow:
        - minio_list_buckets
        - minio_list_objects
        - minio_get_object
        - minio_stat_object
    categories:
        - storage
        - s3
    description: MinIO/S3 object storage operations (list, get, put)
    name: minio
    timeout: 60
kind: ConfigMap
metadata:
  labels:
    app: minio
    component: mcp-server
  name: minio-config

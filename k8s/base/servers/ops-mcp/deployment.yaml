apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: ops-mcp
    component: mcp-server
    mcp.server/name: ops_mcp
    mcp.server/type: custom
  name: ops-mcp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ops-mcp
  template:
    metadata:
      annotations:
        mcp.server/categories: operations,automation
        mcp.server/description: Ops MCP server for k3s and Harvester operations (repair, VIP labels, VM lifecycle, scripted ops)
      labels:
        app: ops-mcp
        component: mcp-server
        mcp.server/name: ops_mcp
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - env:
            - name: CONTEXT_BROKER_HOST
              value: 127.0.0.1
            - name: CONTEXT_BROKER_PORT
              value: "9876"
            - name: CONTEXT_BROKER_PUBLISH
              value: "1"
            - name: K3S_KUBECONFIG
              value: /Users/cblevins/workspace/platform/gitops/.kube/k3s.yaml
            - name: LOG_LEVEL
              value: info
            - name: RKE2_KUBECONFIG
              value: /Users/cblevins/workspace/platform/gitops/.kube/harvester-admin.yaml
            - name: SSH_KEY
              value: /home/mcp/.ssh/id_ed25519
            - name: MCP_TRANSPORT
              value: websocket
            - name: MCP_WS_PORT
              value: "8080"
            - name: MCP_SERVER_NAME
              value: ops_mcp
            - name: MCP_SERVER_COMMAND
              value: /app/services/loom-core/bin/mcp-ops
          image: registry.harbor.lan/mcp/custom-server:latest
          imagePullPolicy: IfNotPresent
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          name: ops-mcp
          ports:
            - containerPort: 8080
              name: websocket
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000

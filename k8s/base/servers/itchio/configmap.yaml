apiVersion: v1
data:
  server.yaml: |
    always_allow:
        - itchio_status
        - itchio_version_history
    categories:
        - distribution
        - publishing
        - itchio
    description: itch.io distribution management via Butler CLI. Upload builds, check channel status, and manage versions.
    name: itchio
    timeout: 300
kind: ConfigMap
metadata:
  labels:
    app: itchio
    component: mcp-server
  name: itchio-config

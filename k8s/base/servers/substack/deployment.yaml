apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: substack
    component: mcp-server
    mcp.server/name: substack
    mcp.server/type: custom
  name: substack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: substack
  template:
    metadata:
      annotations:
        mcp.server/categories: publishing,newsletter,substack
        mcp.server/description: Substack publication management. Create drafts, publish posts, read archives.
      labels:
        app: substack
        component: mcp-server
        mcp.server/name: substack
    spec:
      containers:
        - env:
            - name: SUBSTACK_SESSION_TOKEN
              valueFrom:
                secretKeyRef:
                  key: SUBSTACK_SESSION_TOKEN
                  name: loom-secrets
            - name: SUBSTACK_SUBDOMAIN
              valueFrom:
                secretKeyRef:
                  key: SUBSTACK_SUBDOMAIN
                  name: loom-secrets
            - name: MCP_TRANSPORT
              value: websocket
            - name: MCP_WS_PORT
              value: "8080"
            - name: LOG_LEVEL
              value: info
            - name: MCP_SERVER_NAME
              value: substack
            - name: MCP_SERVER_COMMAND
              value: /app/services/loom-core/bin/mcp-substack
          image: registry.harbor.lan/mcp/custom-server:latest
          imagePullPolicy: Always
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          name: substack
          ports:
            - containerPort: 8080
              name: websocket
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000

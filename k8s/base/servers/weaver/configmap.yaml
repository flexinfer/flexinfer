apiVersion: v1
data:
  server.yaml: |
    always_allow:
        - weaver__query
        - weaver__gather
        - weaver__cluster_status
        - weaver__ci_status
        - weaver__system_health
        - weaver__fleet_status
    categories:
        - ai
        - weavertion
        - operations
    description: MCP weaver for local-model tool weavertion via FlexInfer - compound queries, cluster status, CI status, system health, and fleet status
    name: weaver
    timeout: 120
kind: ConfigMap
metadata:
  labels:
    app: weaver
    component: mcp-server
  name: weaver-config

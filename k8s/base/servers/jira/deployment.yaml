apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: jira
    component: mcp-server
    mcp.server/name: jira
    mcp.server/type: custom
  name: jira
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jira
  template:
    metadata:
      annotations:
        mcp.server/categories: devops,collaboration
        mcp.server/description: Atlassian Jira issue tracking (search, get, transition, comment)
      labels:
        app: jira
        component: mcp-server
        mcp.server/name: jira
    spec:
      containers:
        - env:
            - name: JIRA_API_TOKEN
              valueFrom:
                secretKeyRef:
                  key: JIRA_API_TOKEN
                  name: loom-secrets
            - name: JIRA_URL
              valueFrom:
                secretKeyRef:
                  key: JIRA_URL
                  name: loom-secrets
            - name: JIRA_USERNAME
              valueFrom:
                secretKeyRef:
                  key: JIRA_USERNAME
                  name: loom-secrets
            - name: MCP_TRANSPORT
              value: websocket
            - name: MCP_WS_PORT
              value: "8080"
            - name: LOG_LEVEL
              value: info
            - name: MCP_SERVER_NAME
              value: jira
            - name: MCP_SERVER_COMMAND
              value: /app/services/loom-core/bin/mcp-jira
          image: registry.harbor.lan/mcp/custom-server:latest
          imagePullPolicy: Always
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          name: jira
          ports:
            - containerPort: 8080
              name: websocket
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000

apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: longhorn-k3s
    component: mcp-server
    mcp.server/name: longhorn_k3s
    mcp.server/type: custom
  name: longhorn-k3s
spec:
  replicas: 1
  selector:
    matchLabels:
      app: longhorn-k3s
  template:
    metadata:
      annotations:
        mcp.server/categories: storage,kubernetes,operations
        mcp.server/description: Longhorn storage operations on the k3s cluster (volumes, replicas, attachments)
      labels:
        app: longhorn-k3s
        component: mcp-server
        mcp.server/name: longhorn_k3s
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - env:
            - name: CONTEXT_BROKER_HOST
              value: 127.0.0.1
            - name: CONTEXT_BROKER_PORT
              value: "9876"
            - name: CONTEXT_BROKER_PUBLISH
              value: "1"
            - name: KUBECONFIG
              value: /Users/cblevins/workspace/platform/gitops/.kube/k3s.yaml
            - name: LOG_LEVEL
              value: info
            - name: MCP_K8S_KUBECONFIG
              value: /Users/cblevins/workspace/platform/gitops/.kube/k3s.yaml
            - name: MCP_TRANSPORT
              value: websocket
            - name: MCP_WS_PORT
              value: "8080"
            - name: MCP_SERVER_NAME
              value: longhorn_k3s
            - name: MCP_SERVER_COMMAND
              value: /app/services/loom-core/bin/mcp-k8s-ops
          image: registry.harbor.lan/mcp/custom-server:latest
          imagePullPolicy: IfNotPresent
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          name: longhorn-k3s
          ports:
            - containerPort: 8080
              name: websocket
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000

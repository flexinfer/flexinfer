apiVersion: v1
data:
  server.yaml: |
    always_allow:
        - search_messages
        - list_channels
        - get_channel_history
        - list_users
        - get_user_info
        - get_channel_info
        - get_permalink
    categories:
        - communication
        - chat
    description: Slack messaging and search (Go native)
    name: slack
    timeout: 30
kind: ConfigMap
metadata:
  labels:
    app: slack
    component: mcp-server
  name: slack-config

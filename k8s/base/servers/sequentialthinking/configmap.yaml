apiVersion: v1
data:
  server.yaml: |
    always_allow:
        - start_thinking
        - add_thought
        - get_chain
        - list_chains
        - set_active_chain
        - complete_chain
        - branch_thought
        - delete_chain
        - summarize_chain
    categories:
        - reasoning
        - planning
    description: Dynamic and reflective problem-solving through sequential thoughts
    name: sequentialthinking
    timeout: 60
kind: ConfigMap
metadata:
  labels:
    app: sequentialthinking
    component: mcp-server
  name: sequentialthinking-config

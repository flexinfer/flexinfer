apiVersion: v1
data:
  server.yaml: |
    always_allow:
        - qdrant_list_collections
        - qdrant_get_collection
        - qdrant_search
        - qdrant_scroll
    categories:
        - database
        - vector
    description: Qdrant vector database operations (Go native)
    name: qdrant
    timeout: 60
kind: ConfigMap
metadata:
  labels:
    app: qdrant
    component: mcp-server
  name: qdrant-config

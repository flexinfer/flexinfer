apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: tavily
    component: mcp-server
    mcp.server/name: tavily
    mcp.server/type: custom
  name: tavily
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tavily
  template:
    metadata:
      annotations:
        mcp.server/categories: search,docs
        mcp.server/description: AI-powered web search and content extraction (Go native)
      labels:
        app: tavily
        component: mcp-server
        mcp.server/name: tavily
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - env:
            - name: TAVILY_API_KEY
              valueFrom:
                secretKeyRef:
                  key: TAVILY_API_KEY
                  name: loom-secrets
            - name: MCP_WS_PORT
              value: "8080"
            - name: LOG_LEVEL
              value: info
            - name: MCP_SERVER_NAME
              value: tavily
            - name: MCP_TRANSPORT
              value: websocket
            - name: MCP_SERVER_COMMAND
              value: /app/services/loom-core/bin/mcp-tavily
          image: registry.harbor.lan/mcp/custom-server:latest
          imagePullPolicy: IfNotPresent
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          name: tavily
          ports:
            - containerPort: 8080
              name: websocket
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000

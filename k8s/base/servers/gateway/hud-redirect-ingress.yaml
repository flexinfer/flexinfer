apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: loom-gateway-hud-redirect
  annotations:
    nginx.ingress.kubernetes.io/permanent-redirect: https://hud.flexinfer.ai/
    nginx.ingress.kubernetes.io/permanent-redirect-code: "308"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  labels:
    app: loom-gateway
    component: loom-gateway
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - mcp.flexinfer.ai
      secretName: loom-gateway-tls
  rules:
    - host: mcp.flexinfer.ai
      http:
        paths:
          - path: /hud
            pathType: Prefix
            backend:
              service:
                name: loom-gateway
                port:
                  number: 80

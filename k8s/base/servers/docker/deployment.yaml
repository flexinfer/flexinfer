apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: docker
    component: mcp-server
    mcp.server/name: docker
    mcp.server/type: custom
  name: docker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: docker
  template:
    metadata:
      annotations:
        mcp.server/categories: containers,devops
        mcp.server/description: Docker CLI operations (containers, images, logs, inspect, exec)
      labels:
        app: docker
        component: mcp-server
        mcp.server/name: docker
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - env:
            - name: DOCKER_CERT_PATH
              valueFrom:
                secretKeyRef:
                  key: DOCKER_CERT_PATH
                  name: loom-secrets
            - name: DOCKER_CONFIG
              valueFrom:
                secretKeyRef:
                  key: DOCKER_CONFIG
                  name: loom-secrets
            - name: DOCKER_CONTEXT
              valueFrom:
                secretKeyRef:
                  key: DOCKER_CONTEXT
                  name: loom-secrets
            - name: DOCKER_HOST
              valueFrom:
                secretKeyRef:
                  key: DOCKER_HOST
                  name: loom-secrets
            - name: DOCKER_TLS_VERIFY
              valueFrom:
                secretKeyRef:
                  key: DOCKER_TLS_VERIFY
                  name: loom-secrets
            - name: MCP_DOCKER_TIMEOUT_SECONDS
              value: "55"
            - name: MCP_WS_PORT
              value: "8080"
            - name: LOG_LEVEL
              value: info
            - name: MCP_SERVER_NAME
              value: docker
            - name: MCP_TRANSPORT
              value: websocket
            - name: MCP_SERVER_COMMAND
              value: /app/services/loom-core/bin/mcp-docker
          image: registry.harbor.lan/mcp/custom-server:latest
          imagePullPolicy: IfNotPresent
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          name: docker
          ports:
            - containerPort: 8080
              name: websocket
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000

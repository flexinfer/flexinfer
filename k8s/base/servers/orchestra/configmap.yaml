apiVersion: v1
data:
  server.yaml: |
    always_allow:
        - orchestra__query
        - orchestra__gather
        - orchestra__cluster_status
        - orchestra__ci_status
        - orchestra__system_health
        - orchestra__fleet_status
    categories:
        - ai
        - orchestration
        - operations
    description: MCP orchestra for local-model tool orchestration via FlexInfer - compound queries, cluster status, CI status, system health, and fleet status
    name: orchestra
    timeout: 120
kind: ConfigMap
metadata:
  labels:
    app: orchestra
    component: mcp-server
  name: orchestra-config

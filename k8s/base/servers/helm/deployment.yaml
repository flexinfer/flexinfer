apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: helm
    component: mcp-server
    mcp.server/name: helm
    mcp.server/type: custom
  name: helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: helm
  template:
    metadata:
      annotations:
        mcp.server/categories: kubernetes,deployment
        mcp.server/description: Helm chart management (list, status, values, search)
      labels:
        app: helm
        component: mcp-server
        mcp.server/name: helm
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - env:
            - name: HELM_KUBECONFIG
              value: /Users/cblevins/workspace/platform/gitops/.kube/k3s.yaml
            - name: HELM_NAMESPACE
              value: ""
            - name: HELM_TIMEOUT
              value: "60"
            - name: LOG_LEVEL
              value: info
            - name: MCP_TRANSPORT
              value: websocket
            - name: MCP_WS_PORT
              value: "8080"
            - name: MCP_SERVER_NAME
              value: helm
            - name: MCP_SERVER_COMMAND
              value: /app/services/loom-core/bin/mcp-helm
          image: registry.harbor.lan/mcp/custom-server:latest
          imagePullPolicy: IfNotPresent
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          name: helm
          ports:
            - containerPort: 8080
              name: websocket
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000

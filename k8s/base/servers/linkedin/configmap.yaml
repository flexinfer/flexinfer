apiVersion: v1
data:
  server.yaml: |
    always_allow:
        - linkedin_auth_status
        - linkedin_session_health
        - linkedin_get_profile
        - linkedin_list_conversations
        - linkedin_get_conversation_messages
    categories:
        - social
        - messaging
        - linkedin
    description: LinkedIn personal account management. Profile lookup and messaging operations.
    name: linkedin
    timeout: 60
kind: ConfigMap
metadata:
  labels:
    app: linkedin
    component: mcp-server
  name: linkedin-config

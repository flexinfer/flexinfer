apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: office
    component: mcp-server
    mcp.server/name: office
    mcp.server/type: custom
  name: office
spec:
  replicas: 1
  selector:
    matchLabels:
      app: office
  template:
    metadata:
      annotations:
        mcp.server/categories: documents,parsing,office,productivity
        mcp.server/description: Pure-Go parser/producer for .pdf, .docx, .xlsx, .pptx. Read tools accept either a filesystem path or inline base64 bytes, so the server works on restricted hosts (e.g. code-server containers) where the agent cannot install office tooling.
      labels:
        app: office
        component: mcp-server
        mcp.server/name: office
    spec:
      containers:
        - env:
            - name: OFFICE_MAX_BYTES
              value: "67108864"
            - name: MCP_TRANSPORT
              value: websocket
            - name: MCP_WS_PORT
              value: "8080"
            - name: LOG_LEVEL
              value: info
            - name: MCP_SERVER_NAME
              value: office
            - name: MCP_SERVER_COMMAND
              value: /app/services/loom-core/bin/mcp-office
          image: registry.harbor.lan/mcp/custom-server:latest
          imagePullPolicy: Always
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          name: office
          ports:
            - containerPort: 8080
              name: websocket
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000

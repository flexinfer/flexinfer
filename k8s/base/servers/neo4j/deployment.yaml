apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: neo4j
    component: mcp-server
    mcp.server/name: neo4j
    mcp.server/type: custom
  name: neo4j
spec:
  replicas: 1
  selector:
    matchLabels:
      app: neo4j
  template:
    metadata:
      annotations:
        mcp.server/categories: database,graph
        mcp.server/description: Neo4j graph database queries and schema inspection
      labels:
        app: neo4j
        component: mcp-server
        mcp.server/name: neo4j
    spec:
      containers:
        - env:
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: NEO4J_PASSWORD
                  name: loom-secrets
            - name: NEO4J_URI
              value: bolt://localhost:7687
            - name: NEO4J_USERNAME
              value: neo4j
            - name: MCP_TRANSPORT
              value: websocket
            - name: MCP_WS_PORT
              value: "8080"
            - name: LOG_LEVEL
              value: info
            - name: MCP_SERVER_NAME
              value: neo4j
            - name: MCP_SERVER_COMMAND
              value: /app/services/loom-core/bin/mcp-neo4j
          image: registry.harbor.lan/mcp/custom-server:latest
          imagePullPolicy: Always
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          name: neo4j
          ports:
            - containerPort: 8080
              name: websocket
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000

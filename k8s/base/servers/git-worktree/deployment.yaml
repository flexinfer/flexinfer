apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: git-worktree
    component: mcp-server
    mcp.server/name: git_worktree
    mcp.server/type: custom
  name: git-worktree
spec:
  replicas: 1
  selector:
    matchLabels:
      app: git-worktree
  template:
    metadata:
      annotations:
        mcp.server/categories: devops,scm
        mcp.server/description: Manage git worktrees for parallel agent work (list/add/remove/prune)
      labels:
        app: git-worktree
        component: mcp-server
        mcp.server/name: git_worktree
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - env:
            - name: LOG_LEVEL
              value: info
            - name: REPO_PATH
              value: /app
            - name: MCP_TRANSPORT
              value: websocket
            - name: MCP_WS_PORT
              value: "8080"
            - name: MCP_SERVER_NAME
              value: git_worktree
            - name: MCP_SERVER_COMMAND
              value: /app/services/loom-core/bin/mcp-git-worktree
          image: registry.harbor.lan/mcp/custom-server:latest
          imagePullPolicy: IfNotPresent
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          name: git-worktree
          ports:
            - containerPort: 8080
              name: websocket
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000

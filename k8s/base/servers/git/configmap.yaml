apiVersion: v1
data:
  server.yaml: |
    always_allow:
        - git_status
        - git_diff
        - git_log
        - git_show
        - git_branch
    categories:
        - devops
        - scm
    description: Local Git repository operations (Go native)
    name: git
    timeout: 60
kind: ConfigMap
metadata:
  labels:
    app: git
    component: mcp-server
  name: git-config

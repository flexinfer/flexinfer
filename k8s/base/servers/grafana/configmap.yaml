apiVersion: v1
data:
  server.yaml: |
    always_allow:
        - grafana_search
        - grafana_get_dashboard
        - grafana_list_datasources
        - grafana_get_datasource
        - grafana_list_alerts
        - grafana_list_alert_instances
        - grafana_list_annotations
        - grafana_create_annotation
        - grafana_list_folders
    categories:
        - monitoring
        - dashboards
    description: Grafana dashboard search and retrieval
    name: grafana
    timeout: 60
kind: ConfigMap
metadata:
  labels:
    app: grafana
    component: mcp-server
  name: grafana-config

# Pre-commit hooks for loom-core
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # General hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^internal/hud/frontend/dist/
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  # Go hooks (local for reliability)
  - repo: local
    hooks:
      - id: check-flexinfer-site-integration
        name: Check flexinfer-site docs integration
        entry: bash scripts/ci/check_flexinfer_site_integration.sh
        language: system
        pass_filenames: false

      - id: go-fmt
        name: go fmt
        entry: bash -c 'if [ "$#" -eq 0 ]; then exit 0; fi; gofmt -l -w "$@"' --
        language: system
        types: [go]

      - id: go-imports
        name: goimports
        entry: bash scripts/dev/goimports-hook.sh
        language: system
        types: [go]

      - id: go-vet
        name: go vet
        entry: bash scripts/ci/go_changed_packages_hook.sh vet
        language: system
        types: [go]
        pass_filenames: false
        stages: [pre-commit]

      - id: go-mod-tidy
        name: go mod tidy
        entry: bash scripts/dev/with-clean-git-env.sh go mod tidy -diff
        language: system
        types: [go]
        pass_filenames: false
        stages: [pre-commit]

      - id: golangci-lint
        name: golangci-lint
        entry: bash scripts/ci/go_changed_packages_hook.sh lint
        language: system
        types: [go]
        pass_filenames: false
        verbose: true
        stages: [pre-commit]

      - id: go-build
        name: go build
        entry: bash scripts/ci/go_build_hook.sh
        language: system
        types: [go]
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: go-test
        name: go test (fast)
        entry: bash scripts/dev/with-clean-git-env.sh go test -short ./...
        language: system
        types: [go]
        pass_filenames: false
        stages: [pre-push]

      # Docs guardrail: catch missing doc updates before CI
      - id: docs-guardrail
        name: docs guardrail
        entry: bash scripts/ci/check_docs_guardrails.sh
        language: system
        pass_filenames: false
        stages: [pre-push]

      # Memory safety: detect time.After in loops (causes timer leaks)
      - id: check-time-after-loop
        name: Detect time.After in loops
        entry: bash -c 'grep -rn "time\.After" --include="*.go" cmd/ internal/ pkg/ 2>/dev/null | grep -v "_test.go" || true'
        language: system
        types: [go]
        pass_filenames: false

      # GitOps mirror drift: when mcp/context/*.yaml changes, require the
      # platform/gitops mirror to match. The hook is skipped if the gitops
      # checkout is missing (developer doesn't have platform/gitops cloned).
      - id: mirror-drift-check
        name: gitops mirror drift check
        entry: bash scripts/ci/check_mirror_drift.sh
        language: system
        files: ^mcp/context/(registry|skills-registry)\.yaml$
        pass_filenames: false
        stages: [pre-commit]

# CI configuration
ci:
  autofix_commit_msg: "style: auto-fix from pre-commit hooks"
  autoupdate_commit_msg: "chore: update pre-commit hooks"
  skip: [golangci-lint, go-build, go-test]  # These need Go installed

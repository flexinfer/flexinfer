# Pre-commit hooks for loom-core
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # General hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  # Go hooks (local for reliability)
  - repo: local
    hooks:
      - id: check-flexinfer-site-integration
        name: Check flexinfer-site docs integration
        entry: bash scripts/ci/check_flexinfer_site_integration.sh
        language: system
        pass_filenames: false

      - id: go-fmt
        name: go fmt
        entry: bash -c 'if [ "$#" -eq 0 ]; then exit 0; fi; gofmt -l -w "$@"' --
        language: system
        types: [go]

      - id: go-imports
        name: goimports
        entry: bash -c 'if [ "$#" -eq 0 ]; then exit 0; fi; ~/go/bin/goimports -local github.com/crb2nu/loom -w "$@"' --
        language: system
        types: [go]

      - id: go-vet
        name: go vet
        entry: go vet ./...
        language: system
        types: [go]
        pass_filenames: false
        stages: [pre-commit]

      - id: go-mod-tidy
        name: go mod tidy
        entry: go mod tidy -diff
        language: system
        types: [go]
        pass_filenames: false
        stages: [pre-commit]

      - id: golangci-lint
        name: golangci-lint
        entry: bash -c '$HOME/go/bin/golangci-lint run'
        language: system
        types: [go]
        pass_filenames: false
        verbose: true
        stages: [pre-commit]

      - id: go-build
        name: go build
        entry: bash scripts/ci/go_build_hook.sh
        language: system
        types: [go]
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: go-test
        name: go test (fast)
        entry: go test -short ./...
        language: system
        types: [go]
        pass_filenames: false
        stages: [pre-push]

      # Memory safety: detect time.After in loops (causes timer leaks)
      - id: check-time-after-loop
        name: Detect time.After in loops
        entry: bash -c 'grep -rn "time\.After" --include="*.go" cmd/ internal/ pkg/ 2>/dev/null | grep -v "_test.go" || true'
        language: system
        types: [go]
        pass_filenames: false

# CI configuration
ci:
  autofix_commit_msg: "style: auto-fix from pre-commit hooks"
  autoupdate_commit_msg: "chore: update pre-commit hooks"
  skip: [golangci-lint, go-build, go-test]  # These need Go installed

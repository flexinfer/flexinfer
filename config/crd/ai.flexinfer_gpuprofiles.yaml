---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: gpuprofiles.ai.flexinfer
spec:
  group: ai.flexinfer
  names:
    kind: GPUProfile
    listKind: GPUProfileList
    plural: gpuprofiles
    shortNames:
    - gpup
    - gpuprofile
    singular: gpuprofile
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.architecture
      name: Architecture
      type: string
    - jsonPath: .spec.vendor
      name: Vendor
      type: string
    - jsonPath: .spec.vramMB
      name: VRAM
      type: integer
    - jsonPath: .status.cached
      name: Cached
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha2
    schema:
      openAPIV3Schema:
        description: |-
          GPUProfile declares GPU architecture capabilities, container images, and
          environment variables. The controller caches profiles and exposes them to
          Model, ModelCache, and ModelDeployment reconcilers for image/env selection.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              GPUProfileSpec declares the capabilities, images, and environment variables
              for a specific GPU architecture. This replaces hardcoded per-arch logic
              scattered across backend/, controllers/, and pkg/quantization/.
            properties:
              architecture:
                description: Architecture is the GPU microarchitecture identifier
                  (e.g. "gfx1100", "gfx906", "sm_52").
                type: string
              backends:
                additionalProperties:
                  description: BackendProfile describes a backend's support level
                    and optional image override for this arch.
                  properties:
                    image:
                      description: Image overrides the default container image for
                        this backend on this architecture.
                      type: string
                    support:
                      description: 'Support level: "full", "experimental", or "unsupported".'
                      type: string
                  required:
                  - support
                  type: object
                description: Backends maps backend name (e.g. "vllm", "diffusers")
                  to its support profile.
                type: object
              containerMemoryGB:
                description: |-
                  ContainerMemoryGB is the K8s container memory limit for quantization/abliteration jobs.
                  Replaces hardcoded DefaultGPUQuantizationMemoryGB.
                format: int32
                type: integer
              deviceCount:
                description: |-
                  DeviceCount is the total number of GPU resources reported by the K8s device plugin
                  on the target node. This may be higher than the number of usable devices when an
                  iGPU is present (e.g. cblevins-7900xtx reports 2 GPUs but only device 0 is usable).
                format: int32
                type: integer
              env:
                description: Env is a list of environment variables injected into
                  all inference pods on this architecture.
                items:
                  description: EnvVar represents an environment variable present in
                    a Container.
                  properties:
                    name:
                      description: |-
                        Name of the environment variable.
                        May consist of any printable ASCII characters except '='.
                      type: string
                    value:
                      description: |-
                        Variable references $(VAR_NAME) are expanded
                        using the previously defined environment variables in the container and
                        any service environment variables. If a variable cannot be resolved,
                        the reference in the input string will be unchanged. Double $$ are reduced
                        to a single $, which allows for escaping the $(VAR_NAME) syntax: i.e.
                        "$$(VAR_NAME)" will produce the string literal "$(VAR_NAME)".
                        Escaped references will never be expanded, regardless of whether the variable
                        exists or not.
                        Defaults to "".
                      type: string
                    valueFrom:
                      description: Source for the environment variable's value. Cannot
                        be used if value is not empty.
                      properties:
                        configMapKeyRef:
                          description: Selects a key of a ConfigMap.
                          properties:
                            key:
                              description: The key to select.
                              type: string
                            name:
                              default: ""
                              description: |-
                                Name of the referent.
                                This field is effectively required, but due to backwards compatibility is
                                allowed to be empty. Instances of this type with an empty value here are
                                almost certainly wrong.
                                More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                              type: string
                            optional:
                              description: Specify whether the ConfigMap or its key
                                must be defined
                              type: boolean
                          required:
                          - key
                          type: object
                          x-kubernetes-map-type: atomic
                        fieldRef:
                          description: |-
                            Selects a field of the pod: supports metadata.name, metadata.namespace, `metadata.labels['<KEY>']`, `metadata.annotations['<KEY>']`,
                            spec.nodeName, spec.serviceAccountName, status.hostIP, status.podIP, status.podIPs.
                          properties:
                            apiVersion:
                              description: Version of the schema the FieldPath is
                                written in terms of, defaults to "v1".
                              type: string
                            fieldPath:
                              description: Path of the field to select in the specified
                                API version.
                              type: string
                          required:
                          - fieldPath
                          type: object
                          x-kubernetes-map-type: atomic
                        fileKeyRef:
                          description: |-
                            FileKeyRef selects a key of the env file.
                            Requires the EnvFiles feature gate to be enabled.
                          properties:
                            key:
                              description: |-
                                The key within the env file. An invalid key will prevent the pod from starting.
                                The keys defined within a source may consist of any printable ASCII characters except '='.
                                During Alpha stage of the EnvFiles feature gate, the key size is limited to 128 characters.
                              type: string
                            optional:
                              default: false
                              description: |-
                                Specify whether the file or its key must be defined. If the file or key
                                does not exist, then the env var is not published.
                                If optional is set to true and the specified key does not exist,
                                the environment variable will not be set in the Pod's containers.

                                If optional is set to false and the specified key does not exist,
                                an error will be returned during Pod creation.
                              type: boolean
                            path:
                              description: |-
                                The path within the volume from which to select the file.
                                Must be relative and may not contain the '..' path or start with '..'.
                              type: string
                            volumeName:
                              description: The name of the volume mount containing
                                the env file.
                              type: string
                          required:
                          - key
                          - path
                          - volumeName
                          type: object
                          x-kubernetes-map-type: atomic
                        resourceFieldRef:
                          description: |-
                            Selects a resource of the container: only resources limits and requests
                            (limits.cpu, limits.memory, limits.ephemeral-storage, requests.cpu, requests.memory and requests.ephemeral-storage) are currently supported.
                          properties:
                            containerName:
                              description: 'Container name: required for volumes,
                                optional for env vars'
                              type: string
                            divisor:
                              anyOf:
                              - type: integer
                              - type: string
                              description: Specifies the output format of the exposed
                                resources, defaults to "1"
                              pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                              x-kubernetes-int-or-string: true
                            resource:
                              description: 'Required: resource to select'
                              type: string
                          required:
                          - resource
                          type: object
                          x-kubernetes-map-type: atomic
                        secretKeyRef:
                          description: Selects a key of a secret in the pod's namespace
                          properties:
                            key:
                              description: The key of the secret to select from.  Must
                                be a valid secret key.
                              type: string
                            name:
                              default: ""
                              description: |-
                                Name of the referent.
                                This field is effectively required, but due to backwards compatibility is
                                allowed to be empty. Instances of this type with an empty value here are
                                almost certainly wrong.
                                More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                              type: string
                            optional:
                              description: Specify whether the Secret or its key must
                                be defined
                              type: boolean
                          required:
                          - key
                          type: object
                          x-kubernetes-map-type: atomic
                      type: object
                  required:
                  - name
                  type: object
                type: array
              features:
                description: Features declares hardware capability flags for this
                  GPU architecture.
                properties:
                  bf16:
                    type: boolean
                  flashAttention:
                    type: boolean
                  fp8:
                    type: boolean
                  fp16:
                    type: boolean
                  int4:
                    type: boolean
                  int8:
                    type: boolean
                type: object
              imagePullPolicy:
                description: |-
                  ImagePullPolicy overrides the default pull policy for all images on this GPU architecture.
                  If not set, ImagePullPolicyForImage() logic is used.
                type: string
              maxCPUMemoryGB:
                description: |-
                  MaxCPUMemoryGB is the max CPU memory budget for offloading (e.g., 56 for 62GiB node).
                  Used as ABLITERATION_CPU_MAX_MEMORY_GB env var in abliteration jobs.
                format: int32
                type: integer
              maxGPUMemoryGB:
                description: |-
                  MaxGPUMemoryGB is the max GPU memory budget for accelerate device_map (e.g., 12 for gfx906 16GB VRAM).
                  Used as ABLITERATION_GPU_MAX_MEMORY_GB env var in abliteration jobs.
                format: int32
                type: integer
              quantization:
                description: Quantization declares which quantization formats and
                  images are available.
                properties:
                  imagePullPolicy:
                    description: |-
                      ImagePullPolicy overrides the pull policy for quantization job images.
                      Takes precedence over GPUProfileSpec.ImagePullPolicy for quantization jobs.
                    type: string
                  images:
                    additionalProperties:
                      type: string
                    description: Images maps quantization format to the container
                      image used for quantization jobs.
                    type: object
                  supported:
                    description: Supported lists quantization formats available on
                      this architecture (e.g. ["gptq", "awq", "gguf"]).
                    items:
                      type: string
                    type: array
                type: object
              runtime:
                description: |-
                  Runtime configures the persistent runtime container for this GPU architecture.
                  When set, the controller deploys a DaemonSet with this image on matching nodes
                  instead of creating per-model Deployments.
                properties:
                  image:
                    description: |-
                      Image is the unified runtime container image for this architecture.
                      Example: "registry.harbor.lan/flexinfer/runtime:rocm-gfx1100"
                    type: string
                  imagePullPolicy:
                    description: |-
                      ImagePullPolicy overrides the pull policy for runtime images.
                      Takes precedence over GPUProfileSpec.ImagePullPolicy for runtime pods.
                    type: string
                  port:
                    description: Port is the runtime API port. Defaults to 8080.
                    format: int32
                    type: integer
                required:
                - image
                type: object
              usableDeviceIndices:
                description: |-
                  UsableDeviceIndices lists the HIP/CUDA device indices that are valid for inference.
                  When set, the controller injects HIP_VISIBLE_DEVICES or CUDA_VISIBLE_DEVICES accordingly.
                  Example: ["0"] on a node where device 1 is an unusable iGPU.
                items:
                  type: string
                type: array
              vendor:
                description: 'Vendor is the GPU vendor: "amd" or "nvidia".'
                type: string
              vramMB:
                description: |-
                  VRAMMB is the usable VRAM in megabytes for inference workloads.
                  For nodes with mixed GPUs (e.g. dGPU + iGPU), this reflects only the usable device.
                format: int64
                type: integer
            required:
            - architecture
            - vendor
            - vramMB
            type: object
          status:
            description: GPUProfileStatus holds observed state from the controller.
            properties:
              cached:
                description: Cached indicates whether this profile has been loaded
                  into the controller's in-memory cache.
                type: boolean
              lastCachedTime:
                description: LastCachedTime is when the profile was last loaded into
                  cache.
                format: date-time
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}

---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: models.ai.flexinfer
spec:
  group: ai.flexinfer
  names:
    kind: Model
    listKind: ModelList
    plural: models
    shortNames:
    - mdl
    singular: model
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.backend
      name: Backend
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.gpu.shared
      name: Shared
      priority: 1
      type: string
    - jsonPath: .spec.gpu.priority
      name: Priority
      priority: 1
      type: integer
    - jsonPath: .status.metrics.tokensPerSecond
      name: TPS
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha2
    schema:
      openAPIV3Schema:
        description: |-
          Model is the simplified resource for deploying ML models.
          It replaces the v1alpha1 ModelDeployment + GPUGroup workflow
          with a single, homelab-friendly resource.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ModelSpec defines the desired state of Model
              This is the simplified v1alpha2 spec optimized for homelab users.
            properties:
              backend:
                description: |-
                  Backend is the inference backend to use.
                  Supported: ollama, vllm, mlc-llm, llamacpp, diffusers, comfyui, vllm-omni
                type: string
              cache:
                description: |-
                  Cache configures model caching behavior.
                  If not specified, cache strategy is inferred from gpu.shared.
                properties:
                  compilationCache:
                    description: |-
                      CompilationCache configures persistent GPU kernel compilation caching.
                      When enabled, MIOpen/PyTorch/Triton compilation artifacts are stored on
                      a hostPath volume that survives pod restarts, eliminating recompilation
                      on GPU swaps. Only effective for AMD ROCm backends.
                    properties:
                      enabled:
                        description: |-
                          Enabled controls whether compilation cache persistence is active.
                          Default: true when gpu.shared is set and gpu.vendor is amd.
                        type: boolean
                      hostPath:
                        default: /var/lib/flexinfer/compile-cache
                        description: |-
                          HostPath is the base directory on the node for compilation caches.
                          A subdirectory per model is created automatically: <hostPath>/<namespace>/<model-name>/
                        type: string
                      sizeLimit:
                        default: 2Gi
                        description: |-
                          SizeLimit is a soft limit for the compilation cache directory.
                          Not enforced by Kubernetes (hostPath has no built-in quota), but
                          used by the controller to set resource expectations.
                        type: string
                    type: object
                  flashLoader:
                    description: |-
                      FlashLoader configures the flash-loader init container for multi-tier model loading.
                      When enabled, model files are parallel-copied from the source volume (PVC or hostPath)
                      to a tmpfs volume before the backend starts, reducing cold-start I/O latency.
                    properties:
                      bufferSizeKB:
                        default: 4096
                        description: |-
                          BufferSizeKB sets the per-worker I/O buffer in KB.
                          Larger buffers improve NVMe sequential throughput.
                        format: int32
                        maximum: 16384
                        minimum: 32
                        type: integer
                      concurrency:
                        default: 4
                        description: Concurrency is the number of parallel copy goroutines.
                        format: int32
                        maximum: 32
                        minimum: 1
                        type: integer
                      enabled:
                        description: |-
                          Enabled activates flash-loader. Default: auto (true when cache.strategy
                          is Local or SharedPVC with gpu.shared set).
                        type: boolean
                      image:
                        description: Image overrides the flash-loader init container
                          image.
                        type: string
                      tmpfsSizeLimit:
                        description: |-
                          TmpfsSizeLimit caps the tmpfs destination volume.
                          Defaults to cache.size if not specified.
                        type: string
                      verifyIntegrity:
                        description: VerifyIntegrity enables post-copy size verification.
                        type: boolean
                    type: object
                  hostPath:
                    default: /var/lib/flexinfer/models
                    description: |-
                      HostPath is the base directory on the node for Local strategy model storage.
                      A subdirectory per model is created automatically: <hostPath>/<namespace>/<model-name>/
                    type: string
                  pvcName:
                    description: |-
                      PVCName is the PVC to use for SharedPVC strategy.
                      Auto-created if not specified.
                    type: string
                  size:
                    default: 50Gi
                    description: Size is the storage size for auto-created PVCs.
                    type: string
                  storageClass:
                    default: longhorn
                    description: StorageClass for auto-created PVCs.
                    type: string
                  strategy:
                    description: |-
                      Strategy for caching models.
                      - Memory: Keep model weights in RAM (fast reload, uses RAM)
                      - SharedPVC: Store on shared PVC (slower reload, saves RAM)
                      - Local: Use a hostPath directory (e.g., NVMe) for model storage
                      - None: No caching (downloads each time)
                      Default: Memory if gpu.shared is set, SharedPVC otherwise.
                    enum:
                    - Memory
                    - SharedPVC
                    - Local
                    - None
                    type: string
                type: object
              capabilities:
                description: |-
                  Capabilities declares model capabilities for downstream consumers.
                  Unset fields are auto-inferred from backend type and config.
                properties:
                  imageGeneration:
                    description: |-
                      ImageGeneration marks this as an image generation model.
                      Auto: true for diffusers, comfyui, vllm-omni.
                    type: boolean
                  toolCalling:
                    description: |-
                      ToolCalling enables OpenAI-compatible function/tool calling.
                      Auto: true for vllm, ollama; true for llamacpp when jinja=true.
                    type: boolean
                  vision:
                    description: |-
                      Vision enables multimodal image input.
                      Auto: true for llamacpp when mmproj is configured.
                    type: boolean
                type: object
              config:
                description: |-
                  Config contains backend-specific configuration as JSON.
                  These are passed to the backend plugin for container configuration.
                  See backend documentation for available options.
                  Example: {"mode": "server", "maxNumSequence": 4}
                x-kubernetes-preserve-unknown-fields: true
              gpu:
                description: GPU configures GPU allocation and sharing.
                properties:
                  count:
                    description: Count is the number of GPUs required.
                    format: int32
                    maximum: 8
                    minimum: 1
                    type: integer
                  priority:
                    default: 100
                    description: |-
                      Priority within a shared group. Higher = more important.
                      Models with higher priority preempt lower priority ones.
                    format: int32
                    maximum: 1000
                    minimum: 0
                    type: integer
                  shared:
                    description: |-
                      Shared groups models together for time-sharing a GPU.
                      Models with the same shared value compete for the same GPU,
                      with higher priority models preempting lower priority ones.
                      If not set, model gets exclusive GPU access.
                    type: string
                  swapCooldown:
                    description: |-
                      SwapCooldown overrides the default anti-thrashing cooldown for this
                      model's shared group. After a swap, the controller blocks further
                      demand-based swaps for this duration. Defaults to 5m if unset.
                      Set lower for small models that load quickly, higher for large ones.
                    type: string
                  vendor:
                    default: auto
                    description: |-
                      Vendor selects the GPU vendor to target.
                      Use "auto" (or omit) to auto-detect based on available nodes.
                      Use "cpu" for CPU-only inference (no GPU resource requests).
                    enum:
                    - auto
                    - nvidia
                    - amd
                    - cpu
                    type: string
                  vramEstimateMB:
                    description: |-
                      VRAMEstimateMB is the estimated VRAM usage in MB.
                      Used for scheduling decisions in shared groups.
                    format: int64
                    type: integer
                type: object
                x-kubernetes-validations:
                - message: gpu.count must be omitted when gpu.vendor is cpu
                  rule: self.vendor != 'cpu' || !has(self.count)
                - message: gpu.vramEstimateMB must be omitted when gpu.vendor is cpu
                  rule: self.vendor != 'cpu' || !has(self.vramEstimateMB)
                - message: gpu.shared must be empty when gpu.vendor is cpu
                  rule: self.vendor != 'cpu' || !has(self.shared) || size(self.shared)
                    == 0
              image:
                description: |-
                  Image overrides the container image for this model's backend.
                  When set, takes precedence over GPUProfile and backend-default images.
                type: string
              kvCache:
                description: |-
                  KVCache configures KV-cache pressure management.
                  Only effective with backends that support KV-cache tuning (vLLM).
                properties:
                  highWatermark:
                    anyOf:
                    - type: integer
                    - type: string
                    description: HighWatermark is the KV-cache utilization ratio that
                      triggers the pressure policy.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  lowWatermark:
                    anyOf:
                    - type: integer
                    - type: string
                    description: LowWatermark is the target KV-cache utilization ratio
                      after pressure mitigation.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  maxBlockSize:
                    description: MaxBlockSize overrides the vLLM --block-size argument
                      for KV-cache block allocation.
                    type: integer
                  pressurePolicy:
                    default: Observe
                    description: PressurePolicy defines how to react when KV-cache
                      usage exceeds watermarks.
                    enum:
                    - Observe
                    - Reconfigure
                    - Evict
                    type: string
                  reconfigureCooldown:
                    description: |-
                      ReconfigureCooldown is how long after a reconfigure action before
                      the controller considers restoring the original config.
                      Prevents thrashing between reduced and original settings.
                      Default: 5m.
                    type: string
                  reconfigureStrategy:
                    default: ReduceSeqs
                    description: |-
                      ReconfigureStrategy defines which vLLM config knobs the Reconfigure
                      pressure policy reduces. Defaults to reducing maxNumSeqs.
                    enum:
                    - ReduceSeqs
                    - ReduceMaxLen
                    - Both
                    type: string
                  swapSpace:
                    anyOf:
                    - type: integer
                    - type: string
                    description: SwapSpace configures the vLLM --swap-space argument
                      (GiB) for CPU-offloaded KV-cache.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                type: object
              litellm:
                description: LiteLLM configures proxy integration for unified API
                  access.
                properties:
                  aliases:
                    description: Aliases are additional model names that route to
                      this model.
                    items:
                      type: string
                    type: array
                  copilotAlias:
                    description: CopilotAlias enables IDE/Copilot compatibility mode.
                    type: string
                  enabled:
                    default: true
                    description: Enabled controls whether LiteLLM annotations are
                      added.
                    type: boolean
                  servedModelName:
                    description: |-
                      ServedModelName is the model name exposed to clients.
                      Defaults to Model resource name.
                    type: string
                type: object
              nodeSelector:
                additionalProperties:
                  type: string
                description: |-
                  NodeSelector for scheduling the model to specific nodes.
                  If not specified, auto-detects GPU nodes.
                type: object
              quantize:
                description: |-
                  Quantize configures post-download quantization of model weights.
                  When set, the controller downloads the source model, quantizes it,
                  and serves the quantized output.
                properties:
                  bits:
                    description: Bits is the quantization bit width for AWQ/GPTQ/COMPRESSED_TENSORS
                      formats.
                    format: int32
                    type: integer
                  calibration:
                    description: |-
                      Calibration configures calibration parameters for AWQ/GPTQ quantization.
                      Ignored for GGUF and EXL2 formats.
                    properties:
                      dataset:
                        description: |-
                          Dataset is the HuggingFace dataset used for calibration samples.
                          Defaults to "mit-han-lab/pile-val-backup".
                        type: string
                      maxSamples:
                        description: |-
                          MaxSamples is the number of calibration samples to use.
                          Defaults to 256.
                        format: int32
                        maximum: 2048
                        minimum: 8
                        type: integer
                      maxSeqLen:
                        description: |-
                          MaxSeqLen is the maximum sequence length for calibration samples.
                          Defaults to 4096.
                        format: int32
                        maximum: 32768
                        minimum: 128
                        type: integer
                      nParallelCalibSamples:
                        description: |-
                          NParallelCalibSamples controls how many calibration samples are processed
                          in parallel during AWQ quantization. Lower values reduce peak VRAM usage.
                          Defaults to 16 for models >10B params on <=24GB VRAM.
                        format: int32
                        maximum: 256
                        minimum: 1
                        type: integer
                    type: object
                  denseModuleCosineThreshold:
                    description: |-
                      DenseModuleCosineThreshold is the minimum cosine similarity required when
                      DenseModulePolicy is "validate". It is formatted as a string to avoid
                      floating-point serialization drift in CRD specs. Defaults to "0.98".
                      Only used for GPTQ format.
                    type: string
                  denseModulePolicy:
                    description: |-
                      DenseModulePolicy controls how GPTQ dense linear module families are
                      handled after quantization when a family-specific validator is available.
                      Defaults to "fallback", which restores dense modules to source precision.
                      "validate" keeps dense GPTQ modules only after the validator accepts every
                      layer in the family. Only used for GPTQ format.
                    enum:
                    - fallback
                    - validate
                    type: string
                  descAct:
                    description: |-
                      DescAct enables activation reordering (desc_act) for GPTQ (default false).
                      desc_act=false gives faster inference; true gives slightly better quality.
                      Ignored for non-GPTQ formats.
                    type: boolean
                  dynamicExclusion:
                    description: |-
                      DynamicExclusion controls which module patterns are excluded from
                      quantization (kept at full precision). Defaults to "auto".
                        - "auto": auto-detect hybrid architectures and exclude attention/expert/
                          vision/MTP modules (matches official Qwen GPTQ-Int4 approach).
                        - "gdn": exclude only GDN (linear_attn) layers but keep full attention
                          quantized. Fits single-GPU (24 GB) while preserving GDN recurrence
                          quality. Use for Qwen3.5/Qwen3.6 on single-GPU deployments.
                        - "none": quantize all modules to the target bit width (pure INT4).
                          WARNING: corrupts GDN recurrence in Qwen3.5/Qwen3.6.
                      Only used for GPTQ format.
                    enum:
                    - auto
                    - gdn
                    - none
                    type: string
                  format:
                    description: Format is the target quantization format.
                    enum:
                    - GGUF
                    - AWQ
                    - GPTQ
                    - EXL2
                    - FP8
                    - COMPRESSED_TENSORS
                    type: string
                  ggufType:
                    description: |-
                      GGUFType is the GGUF quantization level (e.g., Q4_K_M, Q5_K_M, Q8_0).
                      Only used when Format is GGUF.
                    type: string
                  gpuMemoryFraction:
                    description: |-
                      GPUMemoryFraction caps the fraction of GPU VRAM available to the
                      quantization process (e.g. "0.80"). Defaults to "0.80".
                      Lower values leave more headroom for GPU driver overhead (important on ROCm
                      where HIP/GTT allocations bypass container cgroup limits).
                      Only used for GPTQ format.
                    type: string
                  groupSize:
                    description: GroupSize is the quantization group size for AWQ/GPTQ/COMPRESSED_TENSORS
                      formats.
                    format: int32
                    type: integer
                  maxMemoryGB:
                    description: |-
                      MaxMemoryGB limits the memory available to the quantization job.
                      Defaults to 32GB for GGUF, 48GB for AWQ/GPTQ/COMPRESSED_TENSORS.
                    format: int32
                    type: integer
                  nodeSelector:
                    additionalProperties:
                      type: string
                    description: |-
                      NodeSelector overrides spec.nodeSelector for quantization jobs.
                      Useful when quantization needs a different node (e.g., more RAM).
                    type: object
                  sym:
                    description: |-
                      Sym enables symmetric quantization for GPTQ (default true).
                      sym=true is required for ExLlama kernels (best ROCm performance).
                      Ignored for non-GPTQ formats.
                    type: boolean
                  timeoutSeconds:
                    description: TimeoutSeconds overrides the default 2-hour deadline
                      for quantization jobs.
                    format: int64
                    maximum: 43200
                    minimum: 300
                    type: integer
                  useGPU:
                    description: |-
                      UseGPU enables GPU-accelerated quantization
                      (required for AWQ/GPTQ/COMPRESSED_TENSORS).
                      GGUF quantization runs on CPU only.
                    type: boolean
                required:
                - format
                type: object
              resources:
                description: Resources defines compute resources for the model container.
                properties:
                  claims:
                    description: |-
                      Claims lists the names of resources, defined in spec.resourceClaims,
                      that are used by this container.

                      This field depends on the
                      DynamicResourceAllocation feature gate.

                      This field is immutable. It can only be set for containers.
                    items:
                      description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                      properties:
                        name:
                          description: |-
                            Name must match the name of one entry in pod.spec.resourceClaims of
                            the Pod where this field is used. It makes that resource available
                            inside a container.
                          type: string
                        request:
                          description: |-
                            Request is the name chosen for a request in the referenced claim.
                            If empty, everything from the claim is made available, otherwise
                            only the result of this request.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  limits:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Limits describes the maximum amount of compute resources allowed.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                  requests:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Requests describes the minimum amount of compute resources required.
                      If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                      otherwise to an implementation-defined value. Requests cannot exceed Limits.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                type: object
              serverless:
                description: |-
                  Serverless configures scale-to-zero behavior.
                  Enabled by default for homelab use.
                properties:
                  coldStartTimeout:
                    default: 60s
                    description: |-
                      ColdStartTimeout is max time to wait for model activation.
                      Requests exceeding this get 503 Service Unavailable.
                    type: string
                  enabled:
                    default: true
                    description: Enabled controls scale-to-zero.
                    type: boolean
                  idleTimeout:
                    description: |-
                      IdleTimeout is how long to wait before scaling to zero.
                      Default: 5m for LLMs, 10m for image generation backends.
                    type: string
                  minReplicas:
                    default: 0
                    description: |-
                      MinReplicas is the minimum number of replicas to keep running.
                      Use 0 for true scale-to-zero. Use 1 for "warm start" behavior.
                    format: int32
                    maximum: 10
                    minimum: 0
                    type: integer
                type: object
              serviceLabels:
                description: |-
                  ServiceLabels are semantic labels describing model capabilities.
                  Used for dynamic routing (e.g., ["textgen", "code", "fast"]).
                items:
                  type: string
                maxItems: 10
                type: array
              source:
                description: |-
                  Source is the model source URI.
                  Formats:
                    - HF://org/model        - HuggingFace model
                    - ollama://model:tag   - Ollama model
                    - file:///path/to/model - Local file path
                    - pvc://name/path      - PVC-backed model
                type: string
              tolerations:
                description: |-
                  Tolerations are appended to the pod's tolerations.
                  The controller always adds a GPU-node toleration (dedicated=gpu:NoSchedule);
                  any tolerations specified here are merged with that default.
                items:
                  description: |-
                    The pod this Toleration is attached to tolerates any taint that matches
                    the triple <key,value,effect> using the matching operator <operator>.
                  properties:
                    effect:
                      description: |-
                        Effect indicates the taint effect to match. Empty means match all taint effects.
                        When specified, allowed values are NoSchedule, PreferNoSchedule and NoExecute.
                      type: string
                    key:
                      description: |-
                        Key is the taint key that the toleration applies to. Empty means match all taint keys.
                        If the key is empty, operator must be Exists; this combination means to match all values and all keys.
                      type: string
                    operator:
                      description: |-
                        Operator represents a key's relationship to the value.
                        Valid operators are Exists, Equal, Lt, and Gt. Defaults to Equal.
                        Exists is equivalent to wildcard for value, so that a pod can
                        tolerate all taints of a particular category.
                        Lt and Gt perform numeric comparisons (requires feature gate TaintTolerationComparisonOperators).
                      type: string
                    tolerationSeconds:
                      description: |-
                        TolerationSeconds represents the period of time the toleration (which must be
                        of effect NoExecute, otherwise this field is ignored) tolerates the taint. By default,
                        it is not set, which means tolerate the taint forever (do not evict). Zero and
                        negative values will be treated as 0 (evict immediately) by the system.
                      format: int64
                      type: integer
                    value:
                      description: |-
                        Value is the taint value the toleration matches to.
                        If the operator is Exists, the value should be empty, otherwise just a regular string.
                      type: string
                  type: object
                type: array
            required:
            - backend
            - source
            type: object
            x-kubernetes-validations:
            - message: spec.cache.strategy must be SharedPVC, Local, or None when
                spec.source is pvc://... (SharedPVC copies to a cache PVC; Local stages
                onto node-local storage for unified runtimes; None mounts the source
                directly)
              rule: '!self.source.startsWith(''pvc://'') || !has(self.cache) || !has(self.cache.strategy)
                || size(self.cache.strategy) == 0 || self.cache.strategy == ''SharedPVC''
                || self.cache.strategy == ''Local'' || self.cache.strategy == ''None'''
            - message: Do not set GPU limits in spec.resources.limits; use spec.gpu.vendor/spec.gpu.count
                instead
              rule: '!has(self.resources) || !has(self.resources.limits) || (!(''nvidia.com/gpu''
                in self.resources.limits) && !(''amd.com/gpu'' in self.resources.limits)
                && !(''gpu.intel.com/i915'' in self.resources.limits))'
            - message: Do not set GPU requests in spec.resources.requests; use spec.gpu.vendor/spec.gpu.count
                instead
              rule: '!has(self.resources) || !has(self.resources.requests) || (!(''nvidia.com/gpu''
                in self.resources.requests) && !(''amd.com/gpu'' in self.resources.requests)
                && !(''gpu.intel.com/i915'' in self.resources.requests))'
            - message: spec.nodeSelector['node.flexstack.io/gpu-vendor'] must match
                spec.gpu.vendor
              rule: '!has(self.gpu) || self.gpu.vendor == ''auto'' || !has(self.nodeSelector)
                || !(''node.flexstack.io/gpu-vendor'' in self.nodeSelector) || self.nodeSelector[''node.flexstack.io/gpu-vendor'']
                == self.gpu.vendor'
          status:
            description: ModelStatus defines the observed state of Model
            properties:
              cache:
                description: Cache tracks the cache state.
                properties:
                  jobName:
                    description: JobName is the cache job responsible for ensuring
                      the artifact is present.
                    type: string
                  jobPhase:
                    description: 'JobPhase is a coarse cache job phase: Pending, Running,
                      Succeeded, Failed.'
                    type: string
                  message:
                    description: Message is an optional human-friendly cache status
                      message.
                    type: string
                  pvcName:
                    description: PVCName is the PVC being used (if SharedPVC).
                    type: string
                  quantization:
                    description: Quantization records the result of weight quantization.
                    properties:
                      calibrationParams:
                        description: CalibrationParams records the calibration parameters
                          that were actually used.
                        properties:
                          dataset:
                            description: |-
                              Dataset is the HuggingFace dataset used for calibration samples.
                              Defaults to "mit-han-lab/pile-val-backup".
                            type: string
                          maxSamples:
                            description: |-
                              MaxSamples is the number of calibration samples to use.
                              Defaults to 256.
                            format: int32
                            maximum: 2048
                            minimum: 8
                            type: integer
                          maxSeqLen:
                            description: |-
                              MaxSeqLen is the maximum sequence length for calibration samples.
                              Defaults to 4096.
                            format: int32
                            maximum: 32768
                            minimum: 128
                            type: integer
                          nParallelCalibSamples:
                            description: |-
                              NParallelCalibSamples controls how many calibration samples are processed
                              in parallel during AWQ quantization. Lower values reduce peak VRAM usage.
                              Defaults to 16 for models >10B params on <=24GB VRAM.
                            format: int32
                            maximum: 256
                            minimum: 1
                            type: integer
                        type: object
                      completedAt:
                        description: CompletedAt is the timestamp when the quantization
                          job completed.
                        format: date-time
                        type: string
                      compressedSizeBytes:
                        description: CompressedSizeBytes is the size of the model
                          after quantization.
                        format: int64
                        type: integer
                      compressionRatio:
                        description: CompressionRatio is the ratio of original to
                          compressed size (e.g., "3.75").
                        type: string
                      failureMessage:
                        description: FailureMessage contains the last lines of pod
                          logs on failure.
                        type: string
                      format:
                        description: Format is the quantization format that was applied.
                        type: string
                      originalSizeBytes:
                        description: OriginalSizeBytes is the size of the model before
                          quantization.
                        format: int64
                        type: integer
                      progress:
                        description: Progress is the current job progress percentage
                          (0-100), read from structured telemetry.
                        format: int32
                        type: integer
                      progressDetail:
                        description: ProgressDetail is a human-readable description
                          of current progress (e.g., "layer 152/336").
                        type: string
                      quantizationTime:
                        description: QuantizationTime is the wall-clock duration of
                          the quantization job.
                        type: string
                      startedAt:
                        description: StartedAt is the timestamp when the quantization
                          job started.
                        format: date-time
                        type: string
                      type:
                        description: Type is the specific quantization type (e.g.,
                          Q4_K_M for GGUF).
                        type: string
                    type: object
                  ready:
                    description: Ready indicates cache is populated.
                    type: boolean
                  sizeBytes:
                    description: SizeBytes is the cached model size.
                    format: int64
                    type: integer
                  strategy:
                    description: Strategy being used.
                    type: string
                type: object
              conditions:
                description: Conditions represent the latest observations of the Model's
                  state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              endpoint:
                description: Endpoint is the service endpoint for the model.
                type: string
              gpu:
                description: GPU contains allocated GPU information.
                properties:
                  architecture:
                    description: Architecture is the GPU arch (e.g., sm_89, gfx1100).
                    type: string
                  device:
                    description: Device is the GPU device index.
                    type: string
                  memoryMB:
                    description: MemoryMB is total GPU memory.
                    format: int64
                    type: integer
                  node:
                    description: Node is where the GPU is allocated.
                    type: string
                  vendor:
                    description: Vendor is NVIDIA, AMD, or Intel.
                    type: string
                type: object
              kvCache:
                description: KVCache tracks observed KV-cache metrics and pressure
                  state.
                properties:
                  evicted:
                    description: Evicted indicates the controller has scaled down
                      replicas due to KV-cache pressure.
                    type: boolean
                  evictedAt:
                    description: EvictedAt is when the eviction was triggered.
                    format: date-time
                    type: string
                  lastAction:
                    description: LastAction describes the most recent action taken
                      in response to pressure.
                    type: string
                  lastPressureTime:
                    description: LastPressureTime is when cache pressure was last
                      detected.
                    format: date-time
                    type: string
                  originalConfig:
                    description: |-
                      OriginalConfig captures the original backend config fields that were
                      overridden by the active reconfigure action.
                    x-kubernetes-preserve-unknown-fields: true
                  originalMaxModelLen:
                    description: |-
                      OriginalMaxModelLen is the original maxModelLen value before reconfigure,
                      used to restore the config when pressure subsides.
                    format: int32
                    type: integer
                  originalMaxNumSeqs:
                    description: |-
                      OriginalMaxNumSeqs is the original maxNumSeqs value before reconfigure,
                      used to restore the config when pressure subsides.
                    format: int32
                    type: integer
                  pressure:
                    description: Pressure indicates whether the model is under KV-cache
                      pressure.
                    type: boolean
                  reconfigured:
                    description: |-
                      Reconfigured indicates whether the controller has applied config overrides
                      to reduce KV-cache pressure.
                    type: boolean
                  reconfiguredAt:
                    description: ReconfiguredAt is when the reconfigure action was
                      applied.
                    format: date-time
                    type: string
                  reconfiguredMaxModelLen:
                    description: ReconfiguredMaxModelLen is the reduced maxModelLen
                      value applied by reconfigure.
                    format: int32
                    type: integer
                  reconfiguredMaxNumSeqs:
                    description: ReconfiguredMaxNumSeqs is the reduced maxNumSeqs
                      value applied by reconfigure.
                    format: int32
                    type: integer
                  utilization:
                    description: Utilization is the current KV-cache usage ratio (0.0
                      to 1.0).
                    type: string
                type: object
              lastActiveTime:
                description: LastActiveTime is when the model last served a request.
                format: date-time
                type: string
              loadingProgressAt:
                description: |-
                  LoadingProgressAt is the wall-clock time at which LoadingSubstage or
                  Message last changed. The proxy reads this to detect stalled loads: if
                  Phase==Loading and time.Since(LoadingProgressAt) exceeds a threshold
                  with LoadingSubstage==LoadingWeights, new requests fail fast with 503
                  instead of being queued indefinitely.
                format: date-time
                type: string
              loadingSubstage:
                description: |-
                  LoadingSubstage refines Phase=Loading with granular progress detail so
                  operators and the proxy can distinguish ImagePulling / Initializing /
                  LoadingWeights / Compiling / HealthCheckPending. When Phase=Preempted,
                  it is set to Preempted so clients can surface shared-GPU eviction in the
                  same status field.
                enum:
                - ImagePulling
                - Initializing
                - LoadingWeights
                - Compiling
                - HealthCheckPending
                - Preempted
                type: string
              message:
                description: |-
                  Message is a short human-readable summary of the current status, analogous
                  to the STATUS column of `kubectl get pod`. During Loading it carries the
                  most informative progress hint (e.g. "pulling image", "starting container").
                type: string
              metrics:
                description: Metrics contains runtime performance metrics.
                properties:
                  avgLatencyMs:
                    description: AvgLatencyMs is average request latency.
                    type: string
                  loadTimeSeconds:
                    description: LoadTimeSeconds is how long the model took to load.
                    type: string
                  tokensPerSecond:
                    description: TokensPerSecond is the measured generation speed.
                    type: string
                type: object
              phase:
                description: Phase is the current model lifecycle phase.
                type: string
              sharedGroup:
                description: |-
                  SharedGroup tracks state within the shared GPU group.
                  Only populated when gpu.shared is set.
                properties:
                  groupName:
                    description: GroupName is the shared group identifier.
                    type: string
                  preemptedAt:
                    description: PreemptedAt is when preemption occurred.
                    format: date-time
                    type: string
                  preemptedBy:
                    description: PreemptedBy is which model caused preemption.
                    type: string
                  queuePosition:
                    description: QueuePosition when waiting to be loaded.
                    format: int32
                    type: integer
                  state:
                    description: 'State within the group: Active, Queued, Preempted.'
                    type: string
                type: object
            type: object
        type: object

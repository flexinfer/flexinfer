---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: modelcatalogs.ai.flexinfer
spec:
  group: ai.flexinfer
  names:
    kind: ModelCatalog
    listKind: ModelCatalogList
    plural: modelcatalogs
    shortNames:
    - mcat
    singular: modelcatalog
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.totalModels
      name: Models
      type: integer
    - jsonPath: .status.lastSyncTime
      name: LastSync
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha2
    schema:
      openAPIV3Schema:
        description: |-
          ModelCatalog is the Schema for the modelcatalogs API.
          It syncs model metadata from one or more registries into a discoverable catalog.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ModelCatalogSpec defines the desired state of a ModelCatalog.
            properties:
              filter:
                description: Filter constrains which models are included in the catalog.
                properties:
                  namePattern:
                    description: NamePattern is a glob pattern for filtering model
                      names.
                    type: string
                  tags:
                    description: Tags filters models that have all specified tags.
                    items:
                      type: string
                    type: array
                type: object
              registries:
                description: Registries is the list of model registries to sync from.
                items:
                  description: RegistrySource configures a single model registry endpoint.
                  properties:
                    secretRef:
                      description: |-
                        SecretRef references a Kubernetes secret with registry credentials.
                        For OCI: kubernetes.io/dockerconfigjson format.
                        For HuggingFace: key "HF_TOKEN".
                      type: string
                    type:
                      description: Type is the registry adapter to use.
                      enum:
                      - OCI
                      - HuggingFace
                      - Ollama
                      type: string
                    url:
                      description: |-
                        URL is the registry endpoint (e.g., "registry.harbor.lan").
                        Required for OCI registries. Ignored for HuggingFace/Ollama.
                      type: string
                  required:
                  - type
                  type: object
                minItems: 1
                type: array
              syncInterval:
                default: 1h
                description: SyncInterval is how often the catalog re-syncs with registries.
                type: string
            required:
            - registries
            type: object
          status:
            description: ModelCatalogStatus defines the observed state of a ModelCatalog.
            properties:
              conditions:
                description: Conditions represent the latest observations.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              entries:
                description: Entries is the list of discovered models.
                items:
                  description: CatalogEntryStatus represents a discovered model in
                    the catalog.
                  properties:
                    name:
                      description: Name is the model name.
                      type: string
                    reference:
                      description: Reference is the full qualified reference for pulling.
                      type: string
                    registry:
                      description: Registry is the source registry type.
                      type: string
                    size:
                      description: Size is the approximate model size in bytes.
                      format: int64
                      type: integer
                  required:
                  - name
                  - reference
                  - registry
                  type: object
                type: array
              lastSyncTime:
                description: LastSyncTime is when the catalog was last synced.
                format: date-time
                type: string
              totalModels:
                description: TotalModels is the count of discovered models.
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}

# Feature Development Workflow (Auto Quality Gates)
#
# Variant of feature-dev with automated verification gates replacing
# human approval gates. Part of the dark factory pattern.
#
# Usage:
#   agent_workflow_start(definition_id="feature-dev-auto", input={
#     namespace: "project/feature-branch",
#     agent_id: "claude-code",
#     description: "Add user authentication",
#     branch_name: "feat/user-auth",
#     base_branch: "main",
#     project: "loom-core"
#   })

name: "feature-dev-auto"
description: "Feature development with automated quality gates (no human approval needed)"

steps:
  - id: init
    name: "Initialize Session"
    step_type: tool
    tool_name: agent_session_start
    server_name: agent-context
    tool_args:
      namespace: "${input.namespace}"
      agent_id: "${input.agent_id}"
      description: "Feature: ${input.description}"

  - id: worktree
    name: "Allocate Worktree"
    step_type: tool
    tool_name: agent_worktree_allocate
    server_name: agent-context
    tool_args:
      agent_id: "${input.agent_id}"
      session_id: "${init.session_id}"
      branch_name: "${input.branch_name}"
      base_branch: "${input.base_branch}"
      purpose: "${input.description}"
    depends_on: [init]

  - id: recall
    name: "Recall Context"
    step_type: tool
    tool_name: agent_recall
    server_name: agent-context
    tool_args:
      query: "${input.description}"
      session_id: "${init.session_id}"
      token_budget: 4000
    depends_on: [worktree]

  - id: implement
    name: "Implement Feature"
    step_type: approval
    approval_message: "Context recalled. Implement the feature."
    depends_on: [recall]

  - id: quality-gate
    name: "Automated Quality Gate"
    step_type: tool
    tool_name: devbox_quality_gate
    server_name: devbox
    tool_args:
      project: "${input.project}"
      agent_id: "${input.agent_id}"
      fail_fast: true
    depends_on: [implement]

  - id: commit
    name: "Commit Changes"
    step_type: tool
    tool_name: agent_context_add
    server_name: agent-context
    tool_args:
      session_id: "${init.session_id}"
      entries:
        - entry_type: "milestone"
          title: "Quality gate passed — changes committed"
          content: "All automated checks passed. Committed with conventional format."
    depends_on: [quality-gate]

  - id: push
    name: "Push & Check CI"
    step_type: tool
    tool_name: agent_context_add
    server_name: agent-context
    tool_args:
      session_id: "${init.session_id}"
      entries:
        - entry_type: "milestone"
          title: "Pushed and CI verified"
          content: "Pushed branch to remote and verified CI pipeline"
    depends_on: [commit]

  - id: end
    name: "End Session"
    step_type: tool
    tool_name: agent_session_end
    server_name: agent-context
    tool_args:
      session_id: "${init.session_id}"
      summarize: true
    depends_on: [push]

  - id: cleanup
    name: "Cleanup Worktree"
    step_type: tool
    tool_name: agent_worktree_release
    server_name: agent-context
    tool_args:
      assignment_id: "${worktree.assignment_id}"
      remove_worktree: true
    depends_on: [end]

input_schema:
  namespace:
    type: string
    required: true
    description: "Session namespace"
  agent_id:
    type: string
    required: true
    description: "Agent identifier"
  description:
    type: string
    required: true
    description: "Feature description"
  branch_name:
    type: string
    required: true
    description: "Git branch name"
  base_branch:
    type: string
    required: false
    description: "Base branch (default: main)"
  project:
    type: string
    required: true
    description: "Devbox project name"

rollback_on_failure: false
